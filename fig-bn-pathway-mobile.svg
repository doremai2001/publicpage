<svg xmlns="http://www.w3.org/2000/svg" width="720" height="937" viewBox="0 0 720 937" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">照射之前的那幾關</title>
  <desc id="d">BNCT 少數對病人公道的地方，是它的必要條件事前量得到。 這也表示：有人會在這裡被判定不適合。 過了門檻只是必要條件，不是充分條件：它量的是硼進不進得去，不是治療有沒有效。 第四關最常被跳過。評估你的人手上沒有先前的放療計畫，那一題就還沒開始。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#123641" opacity=".10"/><line x1="0" y1="0" x2="0" y2="8" stroke="#123641" stroke-width="2.2" opacity=".75"/></pattern><pattern id="hatchlite" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#123641" stroke-width="1.4" opacity=".22"/></pattern><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="720" height="937" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="48" y="81" font-size="15" fill="#A98722" font-weight="800" letter-spacing="5px">SCREENING</text>
<text x="48" y="138" font-size="37" fill="#123641" font-weight="800" class="r">照射之前的那幾關</text>
<text x="48" y="182" font-size="18" fill="#527078">BNCT 少數對病人公道的地方，是它的必要條件事前量得到。</text>
<text x="48" y="208" font-size="18" fill="#527078">這也表示：有人會在這裡被判定不適合。</text>
<rect x="48" y="258" width="624" height="80" rx="14" fill="#123641" opacity="0.05"/>
<rect x="48" y="258" width="6" height="80" rx="4" fill="#A98722" opacity="0.9"/>
<text x="70" y="287" font-size="17" fill="#A98722" font-weight="800">1</text>
<text x="95" y="287" font-size="17" fill="#123641" font-weight="700">標準治療用盡或不適用</text>
<text x="95" y="314" font-size="14" fill="#527078">已接受過常規放療，且手術、放療、化療三條救援路線都不適用</text>
<text x="360" y="358" font-size="12" fill="#6B8084" text-anchor="middle">▼</text>
<rect x="48" y="368" width="624" height="80" rx="14" fill="#123641" opacity="0.05"/>
<rect x="48" y="368" width="6" height="80" rx="4" fill="#A98722" opacity="0.9"/>
<text x="70" y="397" font-size="17" fill="#A98722" font-weight="800">2</text>
<text x="95" y="397" font-size="17" fill="#123641" font-weight="700">位置與深度評估</text>
<text x="95" y="424" font-size="14" fill="#527078">病灶要在中子還有力氣的那幾公分內</text>
<text x="360" y="468" font-size="12" fill="#6B8084" text-anchor="middle">▼</text>
<rect x="48" y="478" width="624" height="80" rx="14" fill="#123641" opacity="0.05"/>
<rect x="48" y="478" width="6" height="80" rx="4" fill="#A98722" opacity="0.9"/>
<text x="70" y="507" font-size="17" fill="#A98722" font-weight="800">3</text>
<text x="95" y="507" font-size="17" fill="#123641" font-weight="700">¹⁸F-BPA 正子攝影，量腫瘤／正常組織攝取比 T/N</text>
<text x="95" y="534" font-size="14" fill="#527078">臨床試驗常用的門檻是 T/N 大於 2.5</text>
<text x="360" y="578" font-size="12" fill="#6B8084" text-anchor="middle">▼</text>
<rect x="48" y="588" width="624" height="80" rx="14" fill="#123641" opacity="0.05"/>
<rect x="48" y="588" width="6" height="80" rx="4" fill="#A98722" opacity="0.9"/>
<text x="70" y="617" font-size="17" fill="#A98722" font-weight="800">4</text>
<text x="95" y="617" font-size="17" fill="#123641" font-weight="700">再照射風險評估</text>
<text x="95" y="644" font-size="14" fill="#527078">要有人拿著你先前的放療劑量分布坐下來算過</text>
<text x="360" y="688" font-size="12" fill="#6B8084" text-anchor="middle">▼</text>
<rect x="48" y="698" width="624" height="80" rx="14" fill="#00806B" opacity="0.09" stroke="#00806B" stroke-width="2"/>
<rect x="48" y="698" width="624" height="80" rx="14" fill="url(#hatchlite)"/>
<text x="70" y="727" font-size="17" fill="#00604F" font-weight="800">未達門檻：不適合</text>
<text x="70" y="754" font-size="14" fill="#345963">代價全付，好處沒拿——省下的不只是錢，還有再照射的額度與一段體力</text>
<rect x="48" y="798" width="624" height="2" rx="1" fill="#A98722" opacity="0.5"/>
<text x="48" y="827" font-size="16" fill="#345963" font-weight="700">過了門檻只是必要條件，不是充分條件：它量的是硼進不進得去，不是治療有沒有效。</text>
<text x="48" y="852" font-size="16" fill="#345963" font-weight="700">第四關最常被跳過。評估你的人手上沒有先前的放療計畫，那一題就還沒開始。</text>
<text x="48" y="883" font-size="13" fill="#6B8084">示意圖，依 NCT01173172 的收案條件與 Barth 等 2012 的敘述整理重繪。</text>
  </g>
</svg>
