<svg xmlns="http://www.w3.org/2000/svg" width="720" height="778" viewBox="0 0 720 778" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">How far the neutrons get</title>
  <desc id="d">The depth limit is physics, not a gap in the research. It is the main reason the list of BNCT indications is as short as it is. Eight centimetres is the deepest citable data point, not a measured boundary; deeper than that, the cost to normal tissue catches up with the benefit. Liver, lung, pancreas and the deep pelvis sit outside this line - not yet to be studied, but out of reach.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#123641" opacity=".10"/><line x1="0" y1="0" x2="0" y2="8" stroke="#123641" stroke-width="2.2" opacity=".75"/></pattern><pattern id="hatchlite" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#123641" stroke-width="1.4" opacity=".22"/></pattern><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="720" height="778" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="48" y="81" font-size="15" fill="#A98722" font-weight="800" letter-spacing="5px">PENETRATION</text>
<text x="48" y="138" font-size="37" fill="#123641" font-weight="800" class="r">How far the neutrons get</text>
<text x="48" y="182" font-size="18" fill="#527078">The depth limit is physics, not a gap in the research. It is the</text>
<text x="48" y="208" font-size="18" fill="#527078">main reason</text>
<text x="48" y="234" font-size="18" fill="#527078">the list of BNCT indications is as short as it is.</text>
<text x="48" y="284" font-size="16" fill="#123641" font-weight="700">Thermal beam  flux peaks about 2-3 cm below the skin</text>
<rect x="48" y="312" width="624" height="32" rx="8" fill="#123641" opacity="0.05"/>
<rect x="48" y="312" width="174" height="32" rx="8" fill="#5C77C4" opacity="0.88"/>
<text x="60" y="334" font-size="13" fill="#FFFFFF" font-weight="700">at 10 cm, about one tenth of the peak</text>
<text x="48" y="364" font-size="16" fill="#123641" font-weight="700">Epithermal beam  reaches tumours about 6-8 cm deep</text>
<rect x="48" y="392" width="624" height="32" rx="8" fill="#123641" opacity="0.05"/>
<rect x="48" y="392" width="436" height="32" rx="8" fill="#A98722" opacity="0.88"/>
<text x="60" y="414" font-size="13" fill="#FFFFFF" font-weight="700">this is what clinical treatment uses</text>
<text x="48" y="444" font-size="16" fill="#123641" font-weight="700">Midline brain tumour  therapeutic ratio still above 1 at about 8 cm</text>
<rect x="48" y="472" width="624" height="32" rx="8" fill="#123641" opacity="0.05"/>
<rect x="48" y="472" width="499" height="32" rx="8" fill="#00806B" opacity="0.88"/>
<text x="60" y="494" font-size="13" fill="#FFFFFF" font-weight="700">the deepest citable data point</text>
<rect x="48" y="544" width="624" height="2" rx="1" fill="#A98722" opacity="0.5"/>
<text x="48" y="573" font-size="16" fill="#345963" font-weight="700">Eight centimetres is the deepest citable data point, not a measured</text>
<text x="48" y="598" font-size="16" fill="#345963" font-weight="700">boundary; deeper than that, the cost to normal tissue catches up with</text>
<text x="48" y="623" font-size="16" fill="#345963" font-weight="700">the benefit.</text>
<text x="48" y="648" font-size="16" fill="#345963" font-weight="700">Liver, lung, pancreas and the deep pelvis sit outside this line - not yet</text>
<text x="48" y="673" font-size="16" fill="#345963" font-weight="700">to be studied, but out of reach.</text>
<text x="48" y="704" font-size="13" fill="#6B8084">Schematic, redrawn from Current Oncology 2022 and Barth et al. 2012; bar lengths are</text>
<text x="48" y="724" font-size="13" fill="#6B8084">indicative, not a depth scale.</text>
  </g>
</svg>
