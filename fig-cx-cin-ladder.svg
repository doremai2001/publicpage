<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="t d">
  <title id="t">從 CIN 到侵襲癌：每一階都有人回頭</title>
  <desc id="d">示意圖：CIN 階梯與各階處置。CIN 1 約六成自行消退，觀察為首選；CIN 2 在 24 個月內約一半消退（30 歲以下六成），建議治療、特定條件下可觀察；CIN 3 即「原位癌」，還不是癌，但沒有觀察這個選項——治療得當者 30 年內變成侵襲癌的只有 0.7%，未治療者 31.3%（病灶持續者 50.3%），兩個數字同框。越過基底膜即為侵襲癌：IA1 錐切可為根治治療、IA2 錐切或單純子宮切除、IB 起進入分期與治療分流。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><pattern id="hz" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#96790F" stroke-width="2" opacity="0.55"/></pattern><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="1000" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="86" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">THE CIN LADDER</text>
<text x="84" y="148" font-size="44" fill="#123641" font-weight="800" class="r">從 CIN 到侵襲癌：每一階都有人回頭</text>
<text x="84" y="194" font-size="21" fill="#527078">「原位癌（CIN 3）不是癌」——這句話成立的條件，是「有治療」。</text>
<text x="84" y="224" font-size="21" fill="#527078">越過基底膜（侵襲癌）之後，就是另一條路。</text>
<line x1="120" y1="806" x2="470" y2="806" stroke="#123641" stroke-width="7" stroke-linecap="round"/>
<line x1="470" y1="806" x2="470" y2="700" stroke="#123641" stroke-width="7" stroke-linecap="round"/>
<line x1="470" y1="700" x2="800" y2="700" stroke="#123641" stroke-width="7" stroke-linecap="round"/>
<line x1="800" y1="700" x2="800" y2="594" stroke="#123641" stroke-width="7" stroke-linecap="round"/>
<line x1="800" y1="594" x2="1058" y2="594" stroke="#123641" stroke-width="7" stroke-linecap="round"/>
<g filter="url(#sh)"><rect x="126" y="620" width="336" height="158" rx="18" fill="#FFFFFF"/></g>
<text x="148" y="652" font-size="20" fill="#123641" font-weight="800">CIN 1</text>
<text x="208.8" y="652" font-size="14" fill="#6B8084">｜低度病變</text>
<text x="148" y="680" font-size="14.2" fill="#345963">約 60% 自行消退｜約 30% 持續</text>
<text x="148" y="702" font-size="14.2" fill="#345963">10% →CIN 3、1% →侵襲癌</text>
<text x="148" y="724" font-size="14.2" fill="#345963">（舊研究合成值，無統一時間軸）</text>
<text x="148" y="752" font-size="14.5" fill="#00806B" font-weight="800">處置：觀察為首選</text>
<g filter="url(#sh)"><rect x="470" y="512" width="336" height="160" rx="18" fill="#FFFFFF"/></g>
<text x="492" y="544" font-size="20" fill="#123641" font-weight="800">CIN 2</text>
<text x="552.8" y="544" font-size="14" fill="#6B8084">｜高度病變</text>
<text x="492" y="572" font-size="14.2" fill="#345963">24 個月內：50% 消退（&lt;30 歲 60%）</text>
<text x="492" y="594" font-size="14.2" fill="#345963">32% 持續、18% 進展</text>
<text x="492" y="616" font-size="14.2" fill="#345963">（3,160 人觀察世代）</text>
<text x="492" y="644" font-size="14.5" fill="#00806B" font-weight="800">處置：建議治療；生育考量下可條件式觀察</text>
<g filter="url(#sh)"><rect x="700" y="296" width="404" height="154" rx="18" fill="#FFFFFF"/></g>
<text x="724" y="330" font-size="20" fill="#123641" font-weight="800">CIN 3＝「原位癌」</text>
<text x="724" y="356" font-size="14.2" fill="#6B8084">還不是癌，但沒有「觀察」這個選項</text>
<text x="724" y="388" font-size="14.8" fill="#00806B" font-weight="800">處置：一律切除治療（錐切／LEEP）——指引原</text>
<text x="724" y="410" font-size="14.8" fill="#00806B" font-weight="800">文：「觀察是不可接受的」</text>
<line x1="980" y1="602" x2="918" y2="636" stroke="#00806B" stroke-width="4" stroke-linecap="round"/>
<line x1="918" y1="636" x2="924.006" y2="626.784" stroke="#00806B" stroke-width="4" stroke-linecap="round"/>
<line x1="918" y1="636" x2="928.999" y2="635.89" stroke="#00806B" stroke-width="4" stroke-linecap="round"/>
<text x="824" y="664" font-size="15.5" fill="#00806B" font-weight="800">治療得當（錐切／LEEP）：</text>
<text x="824" y="686" font-size="15.5" fill="#00806B" font-weight="800">30 年內變成侵襲癌 0.7%</text>
<line x1="1062" y1="592" x2="1150" y2="566" stroke="#96790F" stroke-width="4" stroke-linecap="round"/>
<line x1="1150" y1="566" x2="1142.17" y2="573.727" stroke="#96790F" stroke-width="4" stroke-linecap="round"/>
<line x1="1150" y1="566" x2="1139.23" y2="563.768" stroke="#96790F" stroke-width="4" stroke-linecap="round"/>
<text x="1108" y="484" font-size="14.4" fill="#8F7418" font-weight="700" text-anchor="end">未治療：30 年 31.3%</text>
<text x="1108" y="505" font-size="14.4" fill="#8F7418" font-weight="700" text-anchor="end">（24 個月病灶仍在者 50.3%）</text>
<text x="1108" y="526" font-size="14.4" fill="#8F7418" font-weight="700" text-anchor="end">（紐西蘭未治療世代，1,063 人）</text>
<line x1="1120" y1="296" x2="1120" y2="862" stroke="#8F7418" stroke-width="3" stroke-dasharray="9 7"/>
<text x="1106" y="806" font-size="15.5" fill="#8F7418" font-weight="800" text-anchor="end">基底膜——越過這裡就是侵襲癌，</text>
<text x="1106" y="830" font-size="15.5" fill="#8F7418" font-weight="800" text-anchor="end">路從這裡開始不一樣</text>
<rect x="1156" y="330" width="268" height="245" rx="18" fill="#A98722" opacity="0.1"/>
<rect x="1156" y="330" width="268" height="245" rx="18" fill="none" stroke="#C9A83E" stroke-width="1.5"/>
<text x="1178" y="366" font-size="16.5" fill="#123641" font-weight="800">侵襲癌：另一條路</text>
<text x="1178" y="398" font-size="15" fill="#123641" font-weight="800">IA1（浸潤 ≤3 mm）</text>
<text x="1178" y="419" font-size="13.5" fill="#345963">錐切（切緣乾淨）可為根治治療</text>
<text x="1178" y="452" font-size="15" fill="#123641" font-weight="800">IA2（&gt;3–≤5 mm）</text>
<text x="1178" y="473" font-size="13.5" fill="#345963">錐切或單純子宮切除</text>
<text x="1178" y="506" font-size="15" fill="#123641" font-weight="800">≥IB</text>
<text x="1178" y="527" font-size="13.5" fill="#345963">進入分期與治療分流 →〈開刀還</text>
<text x="1178" y="548" font-size="13.5" fill="#345963">是放療〉</text>
<text x="84" y="906" font-size="15" fill="#6B8084">腺體病變（AIS）另有規則：先診斷性錐切、子宮切除為首選（本圖無可靠消退率可標）。</text>
<text x="84" y="974" font-size="16" fill="#6B8084">示意圖，依 Östör 1993、Tainio 2018、McCredie 2008 與 ASCCP 2019／ESGO 2023 重繪｜CIN 2 為 24 個月數據、CIN 3 為 30 年數據，時間軸不同</text>
  </g>
</svg>
