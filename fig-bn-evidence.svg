<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1094" viewBox="0 0 1440 1094" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">各癌別走到哪一格</title>
  <desc id="d">這個領域沒有隨機分派試驗。所以要看的不是有沒有數字， 是那個數字後面站著幾個人、用什麼設計得到的。 只有第一列有藥證，而且只限「不可切除的局部進行或局部復發頭頸癌」這一個適應症。 分母愈小，數字愈容易好看——因為做得好的比較容易被寫出來。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#123641" opacity=".10"/><line x1="0" y1="0" x2="0" y2="8" stroke="#123641" stroke-width="2.2" opacity=".75"/></pattern><pattern id="hatchlite" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#123641" stroke-width="1.4" opacity=".22"/></pattern><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="1094" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="78" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">EVIDENCE</text>
<text x="84" y="140" font-size="44" fill="#123641" font-weight="800" class="r">各癌別走到哪一格</text>
<text x="84" y="192" font-size="21" fill="#527078">這個領域沒有隨機分派試驗。所以要看的不是有沒有數字，</text>
<text x="84" y="223" font-size="21" fill="#527078">是那個數字後面站著幾個人、用什麼設計得到的。</text>
<rect x="84" y="282" width="1272" height="72" rx="12" fill="#123641" opacity="0.05"/>
<rect x="84" y="282" width="8" height="72" rx="4" fill="#A98722" opacity="0.9"/>
<text x="110" y="325" font-size="20" fill="#123641" font-weight="700">復發頭頸癌</text>
<text x="484" y="324" font-size="17" fill="#527078">單臂第二期 ＋ 上市後監測</text>
<text x="1336" y="325" font-size="18" fill="#A98722" font-weight="800" text-anchor="end">21 人 ／ 162 人</text>
<rect x="84" y="366" width="1272" height="72" rx="12" fill="#123641" opacity="0.05"/>
<rect x="84" y="366" width="8" height="72" rx="4" fill="#A98722" opacity="0.9"/>
<text x="110" y="409" font-size="20" fill="#123641" font-weight="700">復發膠質母細胞瘤</text>
<text x="484" y="408" font-size="17" fill="#527078">單臂第二期 ＋ 歷史世代對照</text>
<text x="1336" y="409" font-size="18" fill="#A98722" font-weight="800" text-anchor="end">27 人</text>
<rect x="84" y="450" width="1272" height="72" rx="12" fill="#123641" opacity="0.05"/>
<rect x="84" y="450" width="8" height="72" rx="4" fill="#5C77C4" opacity="0.9"/>
<text x="110" y="493" font-size="20" fill="#123641" font-weight="700">復發高分級腦膜瘤</text>
<text x="484" y="492" font-size="17" fill="#527078">病例系列</text>
<text x="1336" y="493" font-size="18" fill="#5C77C4" font-weight="800" text-anchor="end">44 人</text>
<rect x="84" y="534" width="1272" height="72" rx="12" fill="#123641" opacity="0.05"/>
<rect x="84" y="534" width="8" height="72" rx="4" fill="#5C77C4" opacity="0.9"/>
<text x="110" y="577" font-size="20" fill="#123641" font-weight="700">黑色素瘤</text>
<text x="484" y="576" font-size="17" fill="#527078">病例系列</text>
<text x="1336" y="577" font-size="18" fill="#5C77C4" font-weight="800" text-anchor="end">全球約三、四十例</text>
<rect x="84" y="618" width="1272" height="72" rx="12" fill="#123641" opacity="0.05"/>
<rect x="84" y="618" width="8" height="72" rx="4" fill="#5C77C4" opacity="0.9"/>
<text x="110" y="661" font-size="20" fill="#123641" font-weight="700">乳房外柏哲德氏症</text>
<text x="484" y="660" font-size="17" fill="#527078">病例系列</text>
<text x="1336" y="661" font-size="18" fill="#5C77C4" font-weight="800" text-anchor="end">個位數</text>
<rect x="84" y="702" width="1272" height="72" rx="12" fill="#123641" opacity="0.05"/>
<rect x="84" y="702" width="8" height="72" rx="4" fill="#00806B" opacity="0.9"/>
<rect x="84" y="702" width="1272" height="72" rx="12" fill="url(#hatchlite)"/>
<text x="110" y="745" font-size="20" fill="#123641" font-weight="700">新診斷膠質母細胞瘤</text>
<text x="484" y="744" font-size="17" fill="#527078">第一期，尚無療效結果</text>
<text x="1336" y="745" font-size="18" fill="#00806B" font-weight="800" text-anchor="end">目標 12–18 人</text>
<rect x="84" y="786" width="1272" height="72" rx="12" fill="#123641" opacity="0.05"/>
<rect x="84" y="786" width="8" height="72" rx="4" fill="#00806B" opacity="0.9"/>
<rect x="84" y="786" width="1272" height="72" rx="12" fill="url(#hatchlite)"/>
<text x="110" y="829" font-size="20" fill="#123641" font-weight="700">肝、肺與深部器官</text>
<text x="484" y="828" font-size="17" fill="#527078">個案報告</text>
<text x="1336" y="829" font-size="18" fill="#00806B" font-weight="800" text-anchor="end">個位數</text>
<text x="84" y="880" font-size="16" fill="#6B8084">斜線＝尚無療效結果或僅個案報告</text>
<rect x="84" y="928" width="1272" height="2" rx="1" fill="#A98722" opacity="0.5"/>
<text x="84" y="962" font-size="19" fill="#345963" font-weight="700">只有第一列有藥證，而且只限「不可切除的局部進行或局部復發頭頸癌」這一個適應症。</text>
<text x="84" y="992" font-size="19" fill="#345963" font-weight="700">分母愈小，數字愈容易好看——因為做得好的比較容易被寫出來。</text>
<text x="84" y="1030" font-size="16" fill="#6B8084">示意圖，依本專題各篇引用的原始文獻整理；分母為各該報告的收案人數。</text>
  </g>
</svg>
