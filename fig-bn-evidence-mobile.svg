<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1096" viewBox="0 0 720 1096" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">各癌別走到哪一格</title>
  <desc id="d">這個領域沒有隨機分派試驗。所以要看的不是有沒有數字， 是那個數字後面站著幾個人、用什麼設計得到的。 只有第一列有藥證，而且只限「不可切除的局部進行或局部復發頭頸癌」這一個適應症。 分母愈小，數字愈容易好看——因為做得好的比較容易被寫出來。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#123641" opacity=".10"/><line x1="0" y1="0" x2="0" y2="8" stroke="#123641" stroke-width="2.2" opacity=".75"/></pattern><pattern id="hatchlite" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#123641" stroke-width="1.4" opacity=".22"/></pattern><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="720" height="1096" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="48" y="81" font-size="15" fill="#A98722" font-weight="800" letter-spacing="5px">EVIDENCE</text>
<text x="48" y="138" font-size="37" fill="#123641" font-weight="800" class="r">各癌別走到哪一格</text>
<text x="48" y="182" font-size="18" fill="#527078">這個領域沒有隨機分派試驗。所以要看的不是有沒有數字，</text>
<text x="48" y="208" font-size="18" fill="#527078">是那個數字後面站著幾個人、用什麼設計得到的。</text>
<rect x="48" y="258" width="624" height="83" rx="12" fill="#123641" opacity="0.05"/>
<rect x="48" y="258" width="6" height="83" rx="4" fill="#A98722" opacity="0.9"/>
<text x="70" y="283" font-size="16" fill="#123641" font-weight="700">復發頭頸癌</text>
<text x="70" y="305" font-size="13" fill="#527078">單臂第二期 ＋ 上市後監測</text>
<text x="70" y="337" font-size="14" fill="#A98722" font-weight="800">21 人 ／ 162 人</text>
<rect x="48" y="351" width="624" height="83" rx="12" fill="#123641" opacity="0.05"/>
<rect x="48" y="351" width="6" height="83" rx="4" fill="#A98722" opacity="0.9"/>
<text x="70" y="376" font-size="16" fill="#123641" font-weight="700">復發膠質母細胞瘤</text>
<text x="70" y="398" font-size="13" fill="#527078">單臂第二期 ＋ 歷史世代對照</text>
<text x="70" y="430" font-size="14" fill="#A98722" font-weight="800">27 人</text>
<rect x="48" y="444" width="624" height="83" rx="12" fill="#123641" opacity="0.05"/>
<rect x="48" y="444" width="6" height="83" rx="4" fill="#5C77C4" opacity="0.9"/>
<text x="70" y="469" font-size="16" fill="#123641" font-weight="700">復發高分級腦膜瘤</text>
<text x="70" y="491" font-size="13" fill="#527078">病例系列</text>
<text x="70" y="523" font-size="14" fill="#5C77C4" font-weight="800">44 人</text>
<rect x="48" y="537" width="624" height="83" rx="12" fill="#123641" opacity="0.05"/>
<rect x="48" y="537" width="6" height="83" rx="4" fill="#5C77C4" opacity="0.9"/>
<text x="70" y="562" font-size="16" fill="#123641" font-weight="700">黑色素瘤</text>
<text x="70" y="584" font-size="13" fill="#527078">病例系列</text>
<text x="70" y="616" font-size="14" fill="#5C77C4" font-weight="800">全球約三、四十例</text>
<rect x="48" y="630" width="624" height="83" rx="12" fill="#123641" opacity="0.05"/>
<rect x="48" y="630" width="6" height="83" rx="4" fill="#5C77C4" opacity="0.9"/>
<text x="70" y="655" font-size="16" fill="#123641" font-weight="700">乳房外柏哲德氏症</text>
<text x="70" y="677" font-size="13" fill="#527078">病例系列</text>
<text x="70" y="709" font-size="14" fill="#5C77C4" font-weight="800">個位數</text>
<rect x="48" y="723" width="624" height="83" rx="12" fill="#123641" opacity="0.05"/>
<rect x="48" y="723" width="6" height="83" rx="4" fill="#00806B" opacity="0.9"/>
<rect x="48" y="723" width="624" height="83" rx="12" fill="url(#hatchlite)"/>
<text x="70" y="748" font-size="16" fill="#123641" font-weight="700">新診斷膠質母細胞瘤</text>
<text x="70" y="770" font-size="13" fill="#527078">第一期，尚無療效結果</text>
<text x="70" y="802" font-size="14" fill="#00806B" font-weight="800">目標 12–18 人</text>
<rect x="48" y="816" width="624" height="83" rx="12" fill="#123641" opacity="0.05"/>
<rect x="48" y="816" width="6" height="83" rx="4" fill="#00806B" opacity="0.9"/>
<rect x="48" y="816" width="624" height="83" rx="12" fill="url(#hatchlite)"/>
<text x="70" y="841" font-size="16" fill="#123641" font-weight="700">肝、肺與深部器官</text>
<text x="70" y="863" font-size="13" fill="#527078">個案報告</text>
<text x="70" y="895" font-size="14" fill="#00806B" font-weight="800">個位數</text>
<text x="48" y="917" font-size="13" fill="#6B8084">斜線＝尚無療效結果或僅個案報告</text>
<rect x="48" y="957" width="624" height="2" rx="1" fill="#A98722" opacity="0.5"/>
<text x="48" y="986" font-size="16" fill="#345963" font-weight="700">只有第一列有藥證，而且只限「不可切除的局部進行或局部復發頭頸癌」這一個適應症。</text>
<text x="48" y="1011" font-size="16" fill="#345963" font-weight="700">分母愈小，數字愈容易好看——因為做得好的比較容易被寫出來。</text>
<text x="48" y="1042" font-size="13" fill="#6B8084">示意圖，依本專題各篇引用的原始文獻整理；分母為各該報告的收案人數。</text>
  </g>
</svg>
