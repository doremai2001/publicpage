<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">等待時間研究的正確讀法</title>
  <desc id="desc">大型回溯登記研究發現治療等待拉長與較差存活相關，但不能把族群資料當成個人的倒數計時。應有效率完成必要檢查，而不是省略分期。</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4EFE3"/>
      <stop offset="1" stop-color="#E8E1D1"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#0B2832" flood-opacity=".14"/>
    </filter>
    <style>
      .zh { font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
      .serif { font-family: "Noto Serif TC", "Microsoft JhengHei", serif; }
      .title { fill:#123641; font-size:52px; font-weight:800; }
      .sub { fill:#527078; font-size:24px; }
      .metric { fill:#123641; font-size:47px; font-weight:900; }
      .label { fill:#345963; font-size:22px; }
      .card-title { fill:#F7F1E4; font-size:31px; font-weight:800; }
      .card-body { fill:#D4E0DF; font-size:22px; }
      .dark-title { fill:#123641; font-size:31px; font-weight:800; }
      .dark-body { fill:#45656D; font-size:22px; }
      .small { fill:#6B8084; font-size:17px; }
    </style>
  </defs>

  <rect width="1440" height="860" rx="36" fill="url(#bg2)"/>
  <g class="zh">
    <text x="84" y="91" fill="#A98722" font-size="18" font-weight="800" style="letter-spacing:5px">HOW TO READ THE EVIDENCE</text>
    <text x="84" y="157" class="title serif">等待有代價，但不是個人的倒數計時</text>
    <text x="84" y="202" class="sub">兩份大型研究都看見「等待較久」和「存活較差」相關；研究設計仍無法證明等待本身就是原因。</text>

    <g filter="url(#shadow2)">
      <rect x="84" y="267" width="392" height="214" rx="25" fill="#FFFFFF"/>
      <text x="122" y="320" fill="#A98722" font-size="20" font-weight="800">台灣・口腔鱗狀細胞癌</text>
      <text x="122" y="383" class="metric">18,677 人</text>
      <text x="122" y="428" class="label">診斷至治療間隔與 5 年整體存活</text>
      <text x="122" y="459" class="label">呈獨立相關（2004–2010 登記資料）</text>
    </g>

    <g filter="url(#shadow2)">
      <rect x="506" y="267" width="392" height="214" rx="25" fill="#FFFFFF"/>
      <text x="544" y="320" fill="#A98722" font-size="20" font-weight="800">美國・頭頸部鱗狀細胞癌</text>
      <text x="544" y="383" class="metric">51,655 人</text>
      <text x="544" y="428" class="label">61–90 天相較 30 天內開始</text>
      <text x="544" y="459" class="label">死亡風險比 1.13（95% CI 1.08–1.19）</text>
    </g>

    <g filter="url(#shadow2)">
      <rect x="928" y="267" width="428" height="214" rx="25" fill="#123641"/>
      <text x="968" y="322" class="card-title">研究看見的是「相關」</text>
      <text x="968" y="369" class="card-body">病情越複雜，通常檢查越久；</text>
      <text x="968" y="403" class="card-body">複雜病情本身也可能影響預後。</text>
      <line x1="968" y1="430" x2="1314" y2="430" stroke="#C9A83E" stroke-width="3"/>
      <text x="968" y="463" fill="#F2D879" font-size="19" font-weight="800">不能換算成「多等幾天就多幾％危險」</text>
    </g>

    <g filter="url(#shadow2)">
      <rect x="84" y="531" width="620" height="228" rx="26" fill="#173F49"/>
      <circle cx="132" cy="585" r="23" fill="#C9A83E"/>
      <path d="M121 586 l8 8 15-19" fill="none" stroke="#0A2731" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="174" y="596" class="card-title">正確讀法</text>
      <text x="126" y="650" class="card-body">有效率地把必要的分期與準備做完，</text>
      <text x="126" y="687" class="card-body">知道還缺哪一項、何時討論、何時開始。</text>
      <text x="126" y="727" fill="#F2D879" font-size="20" font-weight="800">目標：完整，而且不讓流程無故停住。</text>
    </g>

    <g filter="url(#shadow2)">
      <rect x="736" y="531" width="620" height="228" rx="26" fill="#FFFFFF"/>
      <circle cx="784" cy="585" r="23" fill="#D8C78F"/>
      <path d="M775 576 l18 18 M793 576 l-18 18" stroke="#123641" stroke-width="5" stroke-linecap="round"/>
      <text x="826" y="596" class="dark-title">錯誤讀法</text>
      <text x="778" y="650" class="dark-body">把某一天畫成「安全／危險」的分界，</text>
      <text x="778" y="687" class="dark-body">或為了更快開始而省略該做的檢查。</text>
      <text x="778" y="727" fill="#99791B" font-size="20" font-weight="800">族群平均不是替個人算出的判決。</text>
    </g>

    <text x="84" y="815" class="small">資料來源：文章參考資料 [2] Liao et al., 2017；[3] Murphy et al., 2016｜資訊圖為原創重繪</text>
  </g>
</svg>
