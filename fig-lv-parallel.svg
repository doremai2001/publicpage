<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1006" viewBox="0 0 1440 1006" role="img" aria-labelledby="t d">
  <title id="t">肝是「平均劑量」器官：省下低劑量浴，就是省肝功能</title>
  <desc id="d">示意圖（非實際劑量分布）：決定放射性肝損傷的是平均肝劑量與被照到的體積（QUANTEC），規則是保留至少 700 立方公分正常肝在 15 Gy 以下（3 至 5 次分次）。左格：光子 SBRT 把高劑量集中在腫瘤，但每道光束穿過腫瘤前後都在正常肝留下低劑量浴，並帶著出射劑量穿出體外；右格：質子在布拉格峰把劑量放完就停，幾乎無出射劑量，更多正常肝幾乎沒被照到。臨床對照：隨機試驗（質子對 RFA）治療後 Child-Pugh 分數上升 7.5% 對 19.6%；回溯比較（質子對光子）非古典放射性肝損傷較少（OR 0.26，選擇偏差不可排除）。質子不是零代價；質子對光子的隨機試驗 NRG-GI003 尚未發表。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="1006" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="86" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">LIVER AS A PARALLEL ORGAN</text>
<text x="84" y="148" font-size="44" fill="#123641" font-weight="800" class="r">肝是「平均劑量」器官：省下低劑量浴，就是省肝功能</text>
<text x="84" y="194" font-size="21" fill="#527078">決定放射性肝損傷的，是平均肝劑量與被照到的體積，不是最高點（QUANTEC）。</text>
<text x="84" y="224" font-size="21" fill="#527078">質子在射程終點停下、幾乎無出射劑量——省下的正是灑在正常肝上的低劑量浴。</text>
<g filter="url(#sh)"><rect x="84" y="262" width="616" height="396" rx="18" fill="#FFFFFF"/></g>
<rect x="108" y="284" width="10" height="26" rx="4" fill="#5C77C4"/>
<text x="130" y="304" font-size="19" fill="#123641" font-weight="800">光子 SBRT——健保給付，本身已經很好</text>
<g transform="translate(132,330) scale(1.02)">
<path d="M 18,142 C 26,58 132,14 252,22 C 372,30 462,58 494,116 C 510,152 486,196 428,218 C 338,250 218,252 138,236 C 68,222 10,206 18,142 Z" fill="#E9E2CF" stroke="#9A9282" stroke-width="2.5"/>
<polygon points="65.6,93.9 528.5,175.5 534.4,142.1 71.5,60.5" fill="#5C77C4" opacity="0.16"/>
<polygon points="547.2,161.6 529.9,167.7 533.0,149.9" fill="#5C77C4" opacity="0.42"/>
<polygon points="118.0,242.7 499.0,22.7 482.0,-6.7 101.0,213.3" fill="#5C77C4" opacity="0.16"/>
<polygon points="504.4,0.0 495.0,15.8 486.0,0.2" fill="#5C77C4" opacity="0.42"/>
<polygon points="154.9,10.2 422.4,251.1 445.1,225.8 177.6,-15.1" fill="#5C77C4" opacity="0.16"/>
<polygon points="445.7,249.1 427.7,245.1 439.8,231.8" fill="#5C77C4" opacity="0.42"/>
<text x="95" y="208" font-size="15" fill="#5C77C4" font-weight="700">低劑量浴</text>
<text x="455" y="22" font-size="15" fill="#5C77C4" font-weight="700">出射劑量</text>
<circle cx="300" cy="118" r="25" fill="#A98722"/>
<text x="300" y="166" font-size="15" fill="#8F7418" font-weight="800" text-anchor="middle">腫瘤</text>
</g>
<text x="114" y="598" font-size="15" fill="#345963" font-weight="600">高劑量集中在腫瘤；但每道光束來回都掃過正常肝，</text>
<text x="114" y="622" font-size="15" fill="#345963" font-weight="600">留下一片低劑量浴，並帶著出射劑量穿出體外。</text>
<g filter="url(#sh)"><rect x="740" y="262" width="616" height="396" rx="18" fill="#FFFFFF"/></g>
<rect x="764" y="284" width="10" height="26" rx="4" fill="#00806B"/>
<text x="786" y="304" font-size="19" fill="#123641" font-weight="800">質子——同一個治療，工程升級</text>
<g transform="translate(788,330) scale(1.02)">
<path d="M 18,142 C 26,58 132,14 252,22 C 372,30 462,58 494,116 C 510,152 486,196 428,218 C 338,250 218,252 138,236 C 68,222 10,206 18,142 Z" fill="#E9E2CF" stroke="#9A9282" stroke-width="2.5"/>
<polygon points="3.0,72.3 296.5,134.6 303.5,101.4 10.1,39.0" fill="#00806B" opacity="0.2"/>
<polygon points="271.0,129.2 296.5,134.6 303.5,101.4 278.1,96.0" fill="#00806B" opacity="0.56"/>
<polygon points="69.6,259.8 308.0,133.0 292.0,103.0 53.6,229.7" fill="#00806B" opacity="0.2"/>
<polygon points="285.0,145.2 308.0,133.0 292.0,103.0 269.1,115.2" fill="#00806B" opacity="0.56"/>
<text x="338" y="62" font-size="15" fill="#00806B" font-weight="700">布拉格峰</text>
<line x1="330" y1="70" x2="312" y2="96" stroke="#6B8084" stroke-width="1.5"/>
<text x="60" y="208" font-size="15" fill="#00806B" font-weight="700">幾乎沒被照到的正常肝</text>
<circle cx="300" cy="118" r="25" fill="#A98722"/>
<text x="300" y="166" font-size="15" fill="#8F7418" font-weight="800" text-anchor="middle">腫瘤</text>
</g>
<text x="770" y="598" font-size="15" fill="#345963" font-weight="600">劑量在布拉格峰放完就停：幾乎無出射劑量，</text>
<text x="770" y="622" font-size="15" fill="#345963" font-weight="600">更多正常肝幾乎沒被照到。</text>
<g filter="url(#sh)"><rect x="84" y="700" width="400" height="148" rx="18" fill="#FFFFFF"/></g>
<text x="108" y="732" font-size="15.5" fill="#8F7418" font-weight="800">肝的規則（QUANTEC）</text>
<text x="108" y="758" font-size="13.8" fill="#345963">決定肝損傷的是「平均肝劑量 × 體積」；</text>
<text x="108" y="781" font-size="13.8" fill="#345963">至少 700 cc 正常肝壓在 15 Gy 以下</text>
<text x="108" y="804" font-size="13.8" fill="#345963">（3–5 次分次）——外科最小殘肝的同一套邏輯。</text>
<g filter="url(#sh)"><rect x="520" y="700" width="400" height="148" rx="18" fill="#FFFFFF"/></g>
<text x="544" y="732" font-size="15.5" fill="#8F7418" font-weight="800">隨機試驗（質子 對 RFA・復發性小肝癌）</text>
<text x="544" y="758" font-size="13.8" fill="#345963">治療後 Child-Pugh 分數上升 7.5% 對 19.6%</text>
<text x="544" y="781" font-size="13.8" fill="#345963">（AASLD 2023 轉述）。非劣性試驗——</text>
<text x="544" y="804" font-size="13.8" fill="#345963">它證明的是「不劣於」，不是「優於」。</text>
<g filter="url(#sh)"><rect x="956" y="700" width="400" height="148" rx="18" fill="#FFFFFF"/></g>
<text x="980" y="732" font-size="15.5" fill="#8F7418" font-weight="800">回溯比較（質子 對 光子・MGH）</text>
<text x="980" y="758" font-size="13.8" fill="#345963">非古典放射性肝損傷較少（OR 0.26）。</text>
<text x="980" y="781" font-size="13.8" fill="#345963">回溯性、選擇偏差不可排除——</text>
<text x="980" y="804" font-size="13.8" fill="#345963">這個標籤不能省。</text>
<text x="84" y="886" font-size="15" fill="#6B8084" font-weight="600">質子不是零代價（日本前瞻登錄：≥G3 晚期不良事件 4.7%）；質子對光子的隨機試驗 NRG-GI003 收案完成、尚未發表——優越性正在被驗證。</text>
<text x="84" y="978" font-size="16" fill="#6B8084">示意圖（非實際劑量分布），依 Pan 2010（QUANTEC）、Newhauser &amp; Zhang 2015、Kim TH 2021、AASLD 2023 與 Sanford 2019 重繪</text>
  </g>
</svg>
