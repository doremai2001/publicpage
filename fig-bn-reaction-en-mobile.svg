<svg xmlns="http://www.w3.org/2000/svg" width="720" height="973" viewBox="0 0 720 973" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">A kill radius smaller than one cell</title>
  <desc id="d">Boron-10 captures a thermal neutron and splits into two fragments. They travel only 5-9 micrometres in tissue - about the size of one mammalian cell. So the selectivity is biological: the cell that took up boron is destroyed, its neighbour is not. But the same neutron beam produces three other dose components that have nothing to do with boron.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#123641" opacity=".10"/><line x1="0" y1="0" x2="0" y2="8" stroke="#123641" stroke-width="2.2" opacity=".75"/></pattern><pattern id="hatchlite" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#123641" stroke-width="1.4" opacity=".22"/></pattern><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="720" height="973" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="48" y="81" font-size="15" fill="#A98722" font-weight="800" letter-spacing="5px">NEUTRON CAPTURE</text>
<text x="48" y="138" font-size="37" fill="#123641" font-weight="800" class="r">A kill radius smaller than</text>
<text x="48" y="183" font-size="37" fill="#123641" font-weight="800" class="r">one cell</text>
<text x="48" y="227" font-size="18" fill="#527078">Boron-10 captures a thermal neutron and splits into two</text>
<text x="48" y="253" font-size="18" fill="#527078">fragments.</text>
<text x="48" y="279" font-size="18" fill="#527078">They travel only 5-9 micrometres in tissue - about the size of</text>
<text x="48" y="305" font-size="18" fill="#527078">one mammalian cell.</text>
<rect x="48" y="355" width="624" height="48" rx="12" fill="#123641" opacity="0.05"/>
<text x="360" y="386" font-size="18" fill="#A98722" font-weight="800" text-anchor="middle">Boron-10</text>
<rect x="48" y="411" width="624" height="48" rx="12" fill="#123641" opacity="0.05"/>
<text x="360" y="442" font-size="18" fill="#6B8084" font-weight="800" text-anchor="middle">+ thermal neutron</text>
<rect x="48" y="467" width="624" height="48" rx="12" fill="#123641" opacity="0.05"/>
<text x="360" y="498" font-size="18" fill="#00806B" font-weight="800" text-anchor="middle">→ alpha particle + lithium-7</text>
<text x="48" y="533" font-size="15" fill="#527078">・Ground state 93.7%: total energy about 2.31 MeV</text>
<text x="48" y="557" font-size="15" fill="#527078">・Excited state 6.3%: about 2.79 MeV, plus a 0.48 MeV gamma ray</text>
<text x="48" y="596" font-size="16" fill="#123641" font-weight="700">Combined range of the two fragments: 5-9 micrometres</text>
<rect x="48" y="625" width="624" height="25" rx="8" fill="#123641" opacity="0.05"/>
<rect x="48" y="625" width="187" height="25" rx="8" fill="#A98722" opacity="0.88"/>
<text x="48" y="670" font-size="16" fill="#123641" font-weight="700">Diameter of one mammalian cell (schematic)</text>
<rect x="48" y="699" width="624" height="25" rx="8" fill="#123641" opacity="0.05"/>
<rect x="48" y="699" width="212" height="25" rx="8" fill="#6B8084" opacity="0.35"/>
<rect x="48" y="764" width="624" height="2" rx="1" fill="#A98722" opacity="0.5"/>
<text x="48" y="793" font-size="16" fill="#345963" font-weight="700">So the selectivity is biological: the cell that took up boron is destroyed,</text>
<text x="48" y="818" font-size="16" fill="#345963" font-weight="700">its neighbour is not.</text>
<text x="48" y="843" font-size="16" fill="#345963" font-weight="700">But the same neutron beam produces three other dose components that</text>
<text x="48" y="868" font-size="16" fill="#345963" font-weight="700">have nothing to do with boron.</text>
<text x="48" y="899" font-size="13" fill="#6B8084">Schematic, redrawn from the descriptions in Barth et al. 2005, Terranova 2026 and Current</text>
<text x="48" y="919" font-size="13" fill="#6B8084">Oncology 2022; lengths are indicative, not to scale.</text>
  </g>
</svg>
