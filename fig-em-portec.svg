<text x="126" y="949.37" font-size="15.5" fill="#8F7418" font-weight="700">三格要一起讀。只看第一格會讀成「當然要照」，只看第二格會讀成「反正不延長存活」，只看第三格會讀成「放療很傷、別碰」。三格放在一起，才是這個試驗的意思：放</text>
