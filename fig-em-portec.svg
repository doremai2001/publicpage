<text x="759" y="1101.42" font-size="18" fill="#123641" font-weight="800">PORTEC-3（n=660，高風險，FIGO 2009 版）</text>
<text x="759" y="1132.62" font-size="15.5" fill="#8F7418" font-weight="700">問題：高風險的人在放療上面加化療，換到什麼？</text>
<text x="759" y="1180.6" font-size="17" fill="#123641" font-weight="800">10 年整體存活</text>
<text x="759" y="1210.6" font-size="14" fill="#527078" font-weight="700">化放療</text>
<rect x="927" y="1192.6" width="311" height="26" rx="7" fill="#ECE8DE"/>
<rect x="927" y="1192.6" width="231.38" height="26" rx="7" fill="#96790F"/>
