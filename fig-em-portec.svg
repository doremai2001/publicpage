<text x="110" y="1800.3" font-size="18" fill="#8F7418" font-weight="800">這張圖不是判準表，也不是給你自己對號入座用的</text>
<text x="110" y="1831.5" font-size="15.5" fill="#345963">三個試驗的收案條件、分期版本、風險族群都不一樣：PORTEC-1 沒有做淋巴結廓清，PORTEC-2 收的是高中度風險，PORTEC-3 收的是高風險。三格之間不可以直接比較。風</text>
<text x="110" y="1855.52" font-size="15.5" fill="#345963">險分組有正式的名字與定義，寫在正文裡；分組要同時看期別與版本、組織型、分化度、肌層侵犯、淋巴血管腔侵犯的量、有沒有做淋巴結分期，還有分子分型。這是要別人幫你</text>
<text x="110" y="1879.55" font-size="15.5" fill="#345963">算的問題。</text>
<text x="84" y="1949.57" font-size="15" fill="#527078">示意圖，依 PORTEC-1（Creutzberg 2000）、PORTEC-2（Nout 2010）、PORTEC-3 的 5 年最終結果（de Boer 2018）與 10 年結果（Post 2025）重繪；各研究族群、設計與終點不同，</text>
<text x="84" y="1972.07" font-size="15" fill="#527078">數點不可直接互比。</text>
