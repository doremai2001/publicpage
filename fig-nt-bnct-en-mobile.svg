<circle cx="225.8" cy="542.8" r="3.4" fill="#96790F"/>
<circle cx="197.1" cy="514.7" r="3.4" fill="#96790F"/>
<text x="200" y="602" font-size="15.5" fill="#8F7418" font-weight="800" text-anchor="middle">Tumour cells: boron-rich</text>
<circle cx="473" cy="497" r="38" fill="#FFFFFF" stroke="#527078" stroke-width="2.2"/>
<circle cx="533" cy="486" r="38" fill="#FFFFFF" stroke="#527078" stroke-width="2.2"/>
<circle cx="505" cy="540" r="38" fill="#FFFFFF" stroke="#527078" stroke-width="2.2"/>
<circle cx="464.4" cy="493.5" r="3.4" fill="#96790F"/>
<circle cx="484.2" cy="555.8" r="3.4" fill="#96790F"/>
<text x="505" y="602" font-size="15.5" fill="#527078" font-weight="800" text-anchor="middle">Normal cells: little uptake</text>
<rect x="84" y="622" width="552" height="94" rx="14" fill="#A98722" opacity="0.10"/>
<text x="104" y="650" font-size="14" fill="#345963">THOR trial, measured tumour/normal boron ratio:</text>
<text x="104" y="675" font-size="14" fill="#345963">median 3.4 → down to 2.5 at the second session</text>
<text x="104" y="700" font-size="14" fill="#345963">— the ratio shifts, and uptake is uneven.</text>
<g filter="url(#sh)"><rect x="50" y="762" width="620" height="560" rx="22" fill="#FFFFFF"/></g>
<text x="84" y="808" font-size="15" fill="#A98722" font-weight="800" letter-spacing="3px">STEP 2</text>
<text x="84" y="844" font-size="21" fill="#123641" font-weight="800">Neutrons: the energy is released inside one cell</text>
<text x="636" y="872" font-size="14" fill="#527078" font-weight="700" text-anchor="end">Thermal neutrons (&lt;0.025 eV)</text>
