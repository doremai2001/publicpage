<text x="170" y="1080" font-size="13.5" fill="#345963" text-anchor="middle">Boron-rich tumour cell</text>
<text x="170" y="1104" font-size="16" fill="#8F7418" font-weight="800" text-anchor="middle">destroyed</text>
<text x="360" y="1080" font-size="13.5" fill="#345963" text-anchor="middle">Boron-poor normal cell</text>
<text x="360" y="1104" font-size="16" fill="#00806B" font-weight="800" text-anchor="middle">spared</text>
<text x="550" y="1080" font-size="13.5" fill="#345963" text-anchor="middle">Under-loaded tumour cell</text>
<text x="550" y="1104" font-size="16" fill="#A94438" font-weight="800" text-anchor="middle">can be missed</text>
<line x1="118" y1="1130" x2="222" y2="1130" stroke="#123641" stroke-width="2"/>
<line x1="118" y1="1124" x2="118" y2="1136" stroke="#123641" stroke-width="2"/>
<line x1="222" y1="1124" x2="222" y2="1136" stroke="#123641" stroke-width="2"/>
<text x="236" y="1135" font-size="14.5" fill="#123641" font-weight="800">Range &lt;10 μm ≈ one cell diameter</text>
<rect x="84" y="1214" width="552" height="64" rx="14" fill="#123641"/>
<text x="194" y="1254" font-size="18" fill="#F7F1E4" font-weight="800"><tspan font-size="11" dy="-6">10</tspan><tspan font-size="18" dy="6">B + neutron → α + </tspan><tspan font-size="11" dy="-6">7</tspan><tspan font-size="18" dy="6">Li (2.38 MeV)</tspan></text>
