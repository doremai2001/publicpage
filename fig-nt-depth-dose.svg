<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="840" viewBox="0 0 1440 840" role="img" aria-labelledby="t d">
  <title id="t">三種射束的深度劑量曲線</title>
  <desc id="d">示意圖：光子曲線在淺處達最大值後緩降並穿出人體；質子在布拉格峰（SOBP）後劑量趨近於零；碳離子峰更窄，但峰後仍有小的碎裂尾。橫軸為體內深度0至30公分，縱軸為相對劑量。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="840" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="86" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">DEPTH–DOSE CURVES</text>
<text x="84" y="148" font-size="44" fill="#123641" font-weight="800" class="r">劑量停在哪裡——三種射束的比較</text>
<text x="84" y="194" font-size="21" fill="#527078">光子一路穿出體外；質子與碳離子把劑量集中在「布拉格峰」。</text>
<text x="84" y="224" font-size="21" fill="#527078">碳離子峰後仍有一條小小的碎裂尾——不是零。</text>
