<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">同樣躺六十分鐘，熱劑量差六倍</title>
  <desc id="d">所以「做了六次」不等於「熱到了六次」。可以問的是：我這幾次的熱劑量分別是多少？ 示意圖。兩條溫度曲線為假想療程，熱劑量依 Sapareto 與 Dewey 1984 的換算式計算。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#123641" opacity=".14"/><line x1="0" y1="0" x2="0" y2="8" stroke="#123641" stroke-width="2.4" opacity=".85"/></pattern><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0B2832" flood-opacity=".12"/></filter><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="1000" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="86" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">THERMAL DOSE</text>
<text x="84" y="148" font-size="44" fill="#123641" font-weight="800" class="r">同樣躺六十分鐘，熱劑量差六倍</text>
<text x="84" y="204" font-size="21" fill="#527078">熱劑量把「幾度、待多久」折算成「相當於在 43 度待幾分鐘」。</text>
<text x="84" y="234" font-size="21" fill="#527078">溫度差一點五度，累積到的劑量差很多——而收費是按次數算的。</text>
<rect x="96" y="302" width="568" height="464" rx="20" fill="#FFFFFF" opacity=".78" />
<text x="116" y="334" font-size="23" fill="#123641" font-weight="800" class="r">達到目標溫度的一次</text>
<line x1="116" y1="578.857" x2="644" y2="578.857" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 8" opacity=".3"/>
<text x="108" y="584.857" font-size="16" fill="#6B8084" font-weight="700" text-anchor="end">40</text>
<line x1="116" y1="510.286" x2="644" y2="510.286" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 8" opacity=".3"/>
<text x="108" y="516.286" font-size="16" fill="#6B8084" font-weight="700" text-anchor="end">41</text>
<line x1="116" y1="441.714" x2="644" y2="441.714" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 8" opacity=".3"/>
<text x="108" y="447.714" font-size="16" fill="#6B8084" font-weight="700" text-anchor="end">42</text>
<line x1="116" y1="373.143" x2="644" y2="373.143" stroke="#A98722" stroke-width="2" stroke-linecap="round" opacity=".55"/>
<text x="108" y="379.143" font-size="16" fill="#8F7418" font-weight="800" text-anchor="end">43</text>
<line x1="116" y1="620" x2="644" y2="620" stroke="#123641" stroke-width="2" stroke-linecap="round"/>
<path d="M 116 620 L 116 510.286 L 248 510.286 L 248 441.714 L 512 441.714 L 512 476 L 644 476 L 644 620 Z" fill="#A98722" opacity=".22"/>
<path d="M 116 510.286 L 248 510.286 M 248 441.714 L 512 441.714 M 512 476 L 644 476 " fill="none" stroke="#A98722" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="182" y="496.286" font-size="16" fill="#123641" font-weight="800" text-anchor="middle">41.0°C</text>
<text x="182" y="646" font-size="17" fill="#A98722" font-weight="800" text-anchor="middle">0.94</text>
<text x="182" y="666" font-size="14" fill="#6B8084" text-anchor="middle">15 min</text>
<text x="380" y="427.714" font-size="16" fill="#123641" font-weight="800" text-anchor="middle">42.0°C</text>
<text x="380" y="646" font-size="17" fill="#A98722" font-weight="800" text-anchor="middle">7.5</text>
<text x="380" y="666" font-size="14" fill="#6B8084" text-anchor="middle">30 min</text>
<line x1="248" y1="362" x2="248" y2="620" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 6" opacity=".25"/>
<text x="578" y="462" font-size="16" fill="#123641" font-weight="800" text-anchor="middle">41.5°C</text>
<text x="578" y="646" font-size="17" fill="#A98722" font-weight="800" text-anchor="middle">1.9</text>
<text x="578" y="666" font-size="14" fill="#6B8084" text-anchor="middle">15 min</text>
<line x1="512" y1="362" x2="512" y2="620" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 6" opacity=".25"/>
<text x="116" y="704" font-size="17" fill="#6B8084" font-weight="700">合計</text>
<text x="116" y="748" font-size="46" fill="#A98722" font-weight="800">10.3</text>
<text x="232" y="746" font-size="18" fill="#6B8084" font-weight="700">CEM43 分鐘</text>
<rect x="772" y="302" width="568" height="464" rx="20" fill="#FFFFFF" opacity=".78" />
<text x="792" y="334" font-size="23" fill="#123641" font-weight="800" class="r">沒有熱到的一次</text>
<line x1="792" y1="578.857" x2="1320" y2="578.857" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 8" opacity=".3"/>
<text x="784" y="584.857" font-size="16" fill="#6B8084" font-weight="700" text-anchor="end">40</text>
<line x1="792" y1="510.286" x2="1320" y2="510.286" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 8" opacity=".3"/>
<text x="784" y="516.286" font-size="16" fill="#6B8084" font-weight="700" text-anchor="end">41</text>
<line x1="792" y1="441.714" x2="1320" y2="441.714" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 8" opacity=".3"/>
<text x="784" y="447.714" font-size="16" fill="#6B8084" font-weight="700" text-anchor="end">42</text>
<line x1="792" y1="373.143" x2="1320" y2="373.143" stroke="#A98722" stroke-width="2" stroke-linecap="round" opacity=".55"/>
<text x="784" y="379.143" font-size="16" fill="#8F7418" font-weight="800" text-anchor="end">43</text>
<line x1="792" y1="620" x2="1320" y2="620" stroke="#123641" stroke-width="2" stroke-linecap="round"/>
<path d="M 792 620 L 792 544.571 L 924 544.571 L 924 544.571 L 1188 544.571 L 1188 578.857 L 1320 578.857 L 1320 620 Z" fill="#5C77C4" opacity=".22"/>
<path d="M 792 544.571 L 924 544.571 M 924 544.571 L 1188 544.571 M 1188 578.857 L 1320 578.857 " fill="none" stroke="#5C77C4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="858" y="530.571" font-size="16" fill="#123641" font-weight="800" text-anchor="middle">40.5°C</text>
<text x="858" y="646" font-size="17" fill="#5C77C4" font-weight="800" text-anchor="middle">0.47</text>
<text x="858" y="666" font-size="14" fill="#6B8084" text-anchor="middle">15 min</text>
<text x="1056" y="530.571" font-size="16" fill="#123641" font-weight="800" text-anchor="middle">40.5°C</text>
<text x="1056" y="646" font-size="17" fill="#5C77C4" font-weight="800" text-anchor="middle">0.94</text>
<text x="1056" y="666" font-size="14" fill="#6B8084" text-anchor="middle">30 min</text>
<line x1="924" y1="362" x2="924" y2="620" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 6" opacity=".25"/>
<text x="1254" y="564.857" font-size="16" fill="#123641" font-weight="800" text-anchor="middle">40.0°C</text>
<text x="1254" y="646" font-size="17" fill="#5C77C4" font-weight="800" text-anchor="middle">0.23</text>
<text x="1254" y="666" font-size="14" fill="#6B8084" text-anchor="middle">15 min</text>
<line x1="1188" y1="362" x2="1188" y2="620" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 6" opacity=".25"/>
<text x="792" y="704" font-size="17" fill="#6B8084" font-weight="700">合計</text>
<text x="792" y="748" font-size="46" fill="#5C77C4" font-weight="800">1.6</text>
<text x="882" y="746" font-size="18" fill="#6B8084" font-weight="700">CEM43 分鐘</text>
<text x="84" y="850" font-size="19" fill="#6B8084">每段各自換算後相加；43 度以下每降一度，同樣的時間只折算成四分之一</text>
<rect x="84" y="864" width="1272" height="2" rx="1" fill="#A98722" opacity=".55" />
<text x="84" y="912" font-size="23" fill="#123641" font-weight="800" class="r">所以「做了六次」不等於「熱到了六次」。可以問的是：我這幾次的熱劑量分別是多少？</text>
<text x="84" y="964" font-size="16" fill="#6B8084">示意圖。兩條溫度曲線為假想療程，熱劑量依 Sapareto 與 Dewey 1984 的換算式計算。</text>
  </g>
</svg>
