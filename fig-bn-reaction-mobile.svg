<svg xmlns="http://www.w3.org/2000/svg" width="720" height="826" viewBox="0 0 720 826" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">殺傷範圍不到一顆細胞</title>
  <desc id="d">硼-10 捕獲一顆熱中子後分裂成兩顆碎片。它們帶著能量， 在組織裡只跑五到九微米就停下來——大約一顆哺乳類細胞的大小。 所以選擇性是生物性的：吃進硼的細胞被摧毀，沒吃進去的隔壁細胞不會挨到硼這一份。 但同一束中子在組織裡還產生另外三種劑量，那三種和硼無關（見劑量那張圖）。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#123641" opacity=".10"/><line x1="0" y1="0" x2="0" y2="8" stroke="#123641" stroke-width="2.2" opacity=".75"/></pattern><pattern id="hatchlite" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#123641" stroke-width="1.4" opacity=".22"/></pattern><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="720" height="826" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="48" y="81" font-size="15" fill="#A98722" font-weight="800" letter-spacing="5px">NEUTRON CAPTURE</text>
<text x="48" y="138" font-size="37" fill="#123641" font-weight="800" class="r">殺傷範圍不到一顆細胞</text>
<text x="48" y="182" font-size="18" fill="#527078">硼-10 捕獲一顆熱中子後分裂成兩顆碎片。它們帶著能量，</text>
<text x="48" y="208" font-size="18" fill="#527078">在組織裡只跑五到九微米就停下來——大約一顆哺乳類細胞的大小。</text>
<rect x="48" y="258" width="624" height="48" rx="12" fill="#123641" opacity="0.05"/>
<text x="360" y="289" font-size="18" fill="#A98722" font-weight="800" text-anchor="middle">硼-10</text>
<rect x="48" y="314" width="624" height="48" rx="12" fill="#123641" opacity="0.05"/>
<text x="360" y="345" font-size="18" fill="#6B8084" font-weight="800" text-anchor="middle">＋ 熱中子</text>
<rect x="48" y="370" width="624" height="48" rx="12" fill="#123641" opacity="0.05"/>
<text x="360" y="401" font-size="18" fill="#00806B" font-weight="800" text-anchor="middle">→ α 粒子 ＋ 鋰-7</text>
<text x="48" y="436" font-size="15" fill="#527078">・基態 93.7%：總能量約 2.31 MeV</text>
<text x="48" y="460" font-size="15" fill="#527078">・激發態 6.3%：約 2.79 MeV，另放出 0.48 MeV 加馬射線</text>
<text x="48" y="499" font-size="16" fill="#123641" font-weight="700">兩顆碎片的合計射程：5–9 微米</text>
<rect x="48" y="528" width="624" height="25" rx="8" fill="#123641" opacity="0.05"/>
<rect x="48" y="528" width="187" height="25" rx="8" fill="#A98722" opacity="0.88"/>
<text x="48" y="573" font-size="16" fill="#123641" font-weight="700">一顆哺乳類細胞的直徑（示意）</text>
<rect x="48" y="602" width="624" height="25" rx="8" fill="#123641" opacity="0.05"/>
<rect x="48" y="602" width="212" height="25" rx="8" fill="#6B8084" opacity="0.35"/>
<rect x="48" y="667" width="624" height="2" rx="1" fill="#A98722" opacity="0.5"/>
<text x="48" y="696" font-size="16" fill="#345963" font-weight="700">所以選擇性是生物性的：吃進硼的細胞被摧毀，沒吃進去的隔壁細胞不會挨到硼這一份。</text>
<text x="48" y="721" font-size="16" fill="#345963" font-weight="700">但同一束中子在組織裡還產生另外三種劑量，那三種和硼無關（見劑量那張圖）。</text>
<text x="48" y="752" font-size="13" fill="#6B8084">示意圖，依 Barth 等 2005、Terranova 2026 與 Current Oncology 2022 的敘述重繪；長度為示意，</text>
<text x="48" y="772" font-size="13" fill="#6B8084">非按比例。</text>
  </g>
</svg>
