<text x="88" y="747.58" font-size="13.5" fill="#345963">第 7 天已經測得到差異（P＝0.02），第 28 天更明顯（P＝0.03）；隨劑量與時間增加。這是隨機試驗裡唯一一項跟劑量明確有關的副作用。</text>
