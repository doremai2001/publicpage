<text x="84" y="793.08" font-size="14.5" fill="#123641" font-weight="800">精神症狀</text>
<text x="88" y="815.08" font-size="13.5" fill="#345963">開始用藥後 8 週內是「急性期」，躁的症狀比鬱常見（勝算比 2.42；勝算比不是機率的幾倍）；精神病症狀約 2.4%（0.76 到 7.26）。GRADE 證據確定性低到極低。</text>
