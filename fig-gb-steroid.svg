<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1459" viewBox="0 0 1440 1459" role="img" aria-labelledby="t d">
  <title id="t">類固醇的減量形狀，與副作用出現的時間帶</title>
  <desc id="d">示意圖：糖皮質素（類固醇）的減量形狀，與副作用出現的時間帶。上半是一段抽象的下降階梯，從「起始（症狀性水腫控制住之後）」一階一階降到「最低有效劑量，或停藥」；階數、每一階停多久、每次降多少，這張圖故意不標，並註明各家指引的起始劑量與減量速度彼此不一致、而且部分互相引用，其中一份的證據基礎裡沒有任何一位膠質瘤病人。下半是一條刻度不等距的時間軸，刻度依序為開始用藥、24 到 72 小時、第 7 天、第 28 天、8 週、1 年以上，上面排了五條時間帶：第一，症狀改善——起效在 24 到 72 小時內，擠出去的是水不是腫瘤；第二，庫欣臉與腳踝水腫——第 7 天已經測得到差異（P 等於 0.02）、第 28 天更明顯（P 等於 0.03），隨劑量與時間增加，是隨機試驗裡唯一一項跟劑量明確有關的副作用；第三，精神症狀——開始用藥後 8 週內是急性期，躁的症狀比鬱常見（勝算比 2.42，勝算比不是機率的幾倍），精神病症狀約 2.4%（0.76 到 7.26），GRADE 證據確定性低到極低；第四，骨質流失——骨密度年下降超過 5% 的風險在開始用藥的前兩年最高（丹麥 15,099 位成人的例行 DXA）；第五，腎上腺功能不全——用藥少於 28 天 1.4%、超過一年 27.4%，依劑量分則低劑量組 2.4%、高劑量組 21.5%（74 篇、3,753 位成人，全部以 ACTH 刺激試驗檢測，多為氣喘等非腦瘤族群）。圖上另有一格說明「這張圖上唯一的 mg 數，是研究裡的分組」：腦轉移病人的回溯世代（n=97，1982 年）裡，每天 12 mg 以上那一組肌病變 4.5%、消化性潰瘍 5.6%、高血糖 6.7%，每天 8 mg 以下那一組三項都是 0%——這是研究把病人分成兩組的方式，不是用法用量；潰瘍真正的放大器是類固醇加止痛消炎藥，類固醇單獨相對風險 1.1（0.5 到 2.1）、類固醇加 NSAID 相對風險 4.4（2.0 到 9.7），來自 1991 年非腦瘤族群的巢式病例對照。時間軸的尾端分出兩條路：腎上腺功能不全（沒力氣、頭暈、站起來眼前發黑、噁心）與症狀反彈（頭痛回來、原本好轉的神經症狀又出現），兩者長得一樣但處理方向相反，所以減量期間出現這些狀況要打電話回去，不是自己加量或自己停。圖的最下方是警語：減量表沒有一份是為你算的；這張圖上所有的 mg 數都是研究裡的分組，不是用法用量；不可自行加量、減量或停藥。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#B9AE94" stroke-width="2" opacity="0.55"/></pattern><pattern id="hatchR" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(135)"><line x1="0" y1="0" x2="0" y2="8" stroke="#B04A4A" stroke-width="2" opacity="0.45"/></pattern><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="1459" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="86" font-size="18" fill="#A98722" font-weight="800" letter-spacing="4px">TAPERING, AND WHEN THINGS SHOW UP</text>
<text x="84" y="148" font-size="42" fill="#123641" font-weight="800" class="r">減量表沒有一份是為你算的</text>
<text x="84" y="206.08" font-size="20" fill="#527078">上半是減量的形狀：一階一階往下。這張圖故意不標階數、不標天數、不標 mg——那是你的團隊算的。</text>
<text x="84" y="235.08" font-size="20" fill="#527078">下半是各種副作用出現的時間帶。時間軸的刻度不等距，只用來排先後，不用來量長短。</text>
