<text x="126" y="1253.58" font-size="13" fill="#345963">沒力氣、頭暈、站起來眼前發黑、噁心</text>
<rect x="732" y="1203.58" width="600" height="64" rx="12" fill="#F6E2E0"/>
<text x="750" y="1231.58" font-size="16" fill="#B04A4A" font-weight="800">症狀反彈</text>
<text x="750" y="1253.58" font-size="13" fill="#345963">頭痛回來、原本好轉的神經症狀又出現</text>
<text x="108" y="1281.58" font-size="14" fill="#345963" font-weight="600">長得一樣，處理方向相反。所以減量期間出現這些狀況，是打電話回去、不是自己加量或自己停。</text>
<rect x="84" y="1327.58" width="1272" height="83.0" rx="16" fill="#F6E2E0" stroke="#B04A4A" stroke-width="2.5"/>
<text x="108" y="1357.58" font-size="18" fill="#B04A4A" font-weight="800">減量表沒有一份是為你算的</text>
<text x="108" y="1386.58" font-size="15" fill="#345963" font-weight="600">這張圖上所有的 mg 數都是研究裡的分組，不是用法用量。不可自行加量、不可自行減量、不可自行停藥；什麼時候減、減多少，由你的團隊依你的症狀與影像決定。</text>
<text x="84" y="1432.58" font-size="16" fill="#527078">示意圖，依 Jessurun 2019、Piper 1991、Kusudo 2026、Hansen 2025、Broersen 2015 與 EANO 2021 重繪；各研究族群、設計與終點不同，數點不可直接互比。</text>
