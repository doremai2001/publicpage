<text x="108" y="1033.58" font-size="17" fill="#8F7418" font-weight="800">這張圖上唯一的 mg 數，是研究裡的分組</text>
<text x="108" y="1057.58" font-size="14.5" fill="#345963">腦轉移病人的回溯世代（n=97，1982 年）：每天 ≥12 mg 那一組，肌病變 4.5%、消化性潰瘍 5.6%、高血糖 6.7%；每天 ≤8 mg 那一組，三項都是 0%。</text>
<text x="108" y="1078.58" font-size="14.5" fill="#345963" font-weight="800">這是研究把病人分成兩組的方式，不是用法用量。</text>
<text x="108" y="1099.58" font-size="14.5" fill="#345963">潰瘍那一項真正的放大器是類固醇加止痛消炎藥：類固醇單獨相對風險 1.1（0.5 到 2.1），類固醇加 NSAID 相對風險 4.4（2.0 到 9.7）（1991 年、非腦瘤族群的巢式病例對照）。</text>
