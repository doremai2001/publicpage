<text x="84" y="928.08" font-size="14.5" fill="#123641" font-weight="800">腎上腺功能不全</text>
<text x="88" y="950.08" font-size="13.5" fill="#345963">用藥少於 28 天 1.4%；超過一年 27.4%。依劑量分，低劑量組 2.4%、高劑量組 21.5%。（74 篇、3,753 位成人，全部以 ACTH 刺激試驗檢測；多為氣喘等非腦瘤族群。）</text>
