<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1420" viewBox="0 0 720 1420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Which rung each cancer site has reached</title>
  <desc id="d">Hatched = the largest randomised trial on that rung was negative Grey = case reports and preclinical work only Soft tissue sarcoma, Breast (chest wall recurrence), Head and neck (reirradiation), Melanoma (superficial), Cervix, Bladder (intravesical), Bladder (preservation), Anus, Rectum, Prostate, Oesophagus / lung / ovary / brain, With immunotherapy, With cell therapy, Proton + hyperthermia</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#123641" opacity=".14"/><line x1="0" y1="0" x2="0" y2="8" stroke="#123641" stroke-width="2.4" opacity=".85"/></pattern><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0B2832" flood-opacity=".12"/></filter><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="720" height="1420" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="56" y="78" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">EVIDENCE BY SITE</text>
<text x="56" y="140" font-size="30" fill="#123641" font-weight="800" class="r">Which rung each cancer site has reached</text>
<text x="56" y="182" font-size="18" fill="#527078">Position = highest completed level of evidence, not a ranking of benefit.</text>
<text x="56" y="209" font-size="18" fill="#527078">Within a rung, era, sample size and endpoint still differ widely.</text>
<line x1="56" y1="292" x2="664" y2="292" stroke="#123641" stroke-width="1.4" stroke-linecap="round" opacity=".22"/>
<text x="56" y="322" font-size="15" fill="#A98722" font-weight="800">Rung 5</text>
<text x="56" y="350" font-size="16" fill="#123641" font-weight="700">Large</text>
<text x="56" y="372" font-size="16" fill="#123641" font-weight="700">positive</text>
<text x="56" y="394" font-size="16" fill="#123641" font-weight="700">randomised</text>
<text x="56" y="416" font-size="16" fill="#123641" font-weight="700">phase 3</text>
<rect x="206" y="388" width="178.4" height="36" rx="19" fill="#A98722" opacity=".20" stroke="#A98722" stroke-width="2" />
<text x="223" y="412" font-size="15" fill="#123641" font-weight="700">Soft tissue sarcoma</text>
<line x1="56" y1="460" x2="664" y2="460" stroke="#123641" stroke-width="1.4" stroke-linecap="round" opacity=".22"/>
<text x="56" y="490" font-size="15" fill="#A98722" font-weight="800">Rung 4</text>
<text x="56" y="518" font-size="16" fill="#123641" font-weight="700">Several</text>
<text x="56" y="540" font-size="16" fill="#123641" font-weight="700">randomised</text>
<text x="56" y="562" font-size="16" fill="#123641" font-weight="700">trials or</text>
<text x="56" y="584" font-size="16" fill="#123641" font-weight="700">their</text>
<text x="56" y="606" font-size="16" fill="#123641" font-weight="700">meta-analysis</text>
<rect x="206" y="556" width="262" height="36" rx="19" fill="#A98722" opacity=".20" stroke="#A98722" stroke-width="2" />
<text x="223" y="580" font-size="15" fill="#123641" font-weight="700">Breast (chest wall recurrence)</text>
<rect x="206" y="600" width="254.4" height="36" rx="19" fill="#A98722" opacity=".20" stroke="#A98722" stroke-width="2" />
<text x="223" y="624" font-size="15" fill="#123641" font-weight="700">Head and neck (reirradiation)</text>
<rect x="206" y="644" width="201.2" height="36" rx="19" fill="#A98722" opacity=".20" stroke="#A98722" stroke-width="2" />
<text x="223" y="668" font-size="15" fill="#123641" font-weight="700">Melanoma (superficial)</text>
<line x1="56" y1="628" x2="664" y2="628" stroke="#123641" stroke-width="1.4" stroke-linecap="round" opacity=".22"/>
<text x="56" y="658" font-size="15" fill="#A98722" font-weight="800">Rung 3</text>
<text x="56" y="686" font-size="16" fill="#123641" font-weight="700"></text>
<text x="56" y="708" font-size="16" fill="#123641" font-weight="700">Randomised,</text>
<text x="56" y="730" font-size="16" fill="#123641" font-weight="700">but</text>
<text x="56" y="752" font-size="16" fill="#123641" font-weight="700">inconsistent</text>
<text x="56" y="774" font-size="16" fill="#123641" font-weight="700">or stopped</text>
<text x="56" y="796" font-size="16" fill="#123641" font-weight="700">early</text>
<rect x="206" y="724" width="79.6" height="36" rx="19" fill="#5C77C4" opacity=".20" stroke="#5C77C4" stroke-width="2" />
<text x="223" y="748" font-size="15" fill="#123641" font-weight="700">Cervix</text>
<rect x="297.6" y="724" width="201.2" height="36" rx="19" fill="#5C77C4" opacity=".20" stroke="#5C77C4" stroke-width="2" />
<rect x="297.6" y="724" width="201.2" height="36" rx="19" fill="url(#hatch)" opacity=".5" />
<text x="314.6" y="748" font-size="15" fill="#123641" font-weight="700">Bladder (intravesical)</text>
<line x1="56" y1="796" x2="664" y2="796" stroke="#123641" stroke-width="1.4" stroke-linecap="round" opacity=".22"/>
<text x="56" y="826" font-size="15" fill="#A98722" font-weight="800">Rung 2</text>
<text x="56" y="854" font-size="16" fill="#123641" font-weight="700"></text>
<text x="56" y="876" font-size="16" fill="#123641" font-weight="700">Prospective</text>
<text x="56" y="898" font-size="16" fill="#123641" font-weight="700">single-arm</text>
<text x="56" y="920" font-size="16" fill="#123641" font-weight="700">/ cohort</text>
<rect x="206" y="892" width="201.2" height="36" rx="19" fill="#5C77C4" opacity=".20" stroke="#5C77C4" stroke-width="2" />
<text x="223" y="916" font-size="15" fill="#123641" font-weight="700">Bladder (preservation)</text>
<rect x="419.2" y="892" width="64.4" height="36" rx="19" fill="#5C77C4" opacity=".20" stroke="#5C77C4" stroke-width="2" />
<text x="436.2" y="916" font-size="15" fill="#123641" font-weight="700">Anus</text>
<rect x="495.6" y="892" width="79.6" height="36" rx="19" fill="#5C77C4" opacity=".20" stroke="#5C77C4" stroke-width="2" />
<text x="512.6" y="916" font-size="15" fill="#123641" font-weight="700">Rectum</text>
<rect x="206" y="936" width="94.8" height="36" rx="19" fill="#00806B" opacity=".20" stroke="#00806B" stroke-width="2" />
<text x="223" y="960" font-size="15" fill="#123641" font-weight="700">Prostate</text>
<line x1="56" y1="964" x2="664" y2="964" stroke="#123641" stroke-width="1.4" stroke-linecap="round" opacity=".22"/>
<text x="56" y="994" font-size="15" fill="#A98722" font-weight="800">Rung 1</text>
<text x="56" y="1022" font-size="16" fill="#123641" font-weight="700"></text>
<text x="56" y="1044" font-size="16" fill="#123641" font-weight="700">Retrospective,</text>
<text x="56" y="1066" font-size="16" fill="#123641" font-weight="700">case</text>
<text x="56" y="1088" font-size="16" fill="#123641" font-weight="700">reports,</text>
<text x="56" y="1110" font-size="16" fill="#123641" font-weight="700">preclinical</text>
<rect x="206" y="1060" width="284.8" height="36" rx="19" fill="#00806B" opacity=".20" stroke="#00806B" stroke-width="2" />
<text x="223" y="1084" font-size="15" fill="#123641" font-weight="700">Oesophagus / lung / ovary / brain</text>
<rect x="206" y="1104" width="170.8" height="36" rx="19" fill="#00806B" opacity=".20" stroke="#00806B" stroke-width="2" />
<text x="223" y="1128" font-size="15" fill="#123641" font-weight="700">With immunotherapy</text>
<rect x="388.8" y="1104" width="163.2" height="36" rx="19" fill="#9A9282" opacity=".16" stroke="#9A9282" stroke-width="2" />
<text x="405.8" y="1128" font-size="15" fill="#6B8084" font-weight="700">With cell therapy</text>
<rect x="206" y="1148" width="193.6" height="36" rx="19" fill="#9A9282" opacity=".16" stroke="#9A9282" stroke-width="2" />
<text x="223" y="1172" font-size="15" fill="#6B8084" font-weight="700">Proton + hyperthermia</text>
<rect x="56" y="1148" width="30" height="20" rx="6" fill="#A98722" opacity=".2" stroke="#A98722" stroke-width="2" />
<rect x="56" y="1148" width="30" height="20" rx="6" fill="url(#hatch)" opacity=".5" />
<text x="98" y="1164" font-size="15" fill="#527078">Hatched = the largest randomised trial on that rung was negative</text>
<rect x="56" y="1182" width="30" height="20" rx="6" fill="#9A9282" opacity=".16" stroke="#9A9282" stroke-width="2" />
<text x="98" y="1198" font-size="15" fill="#527078">Grey = case reports and preclinical work only</text>
<text x="56" y="1384" font-size="14" fill="#6B8084">Schematic built from the sources verified for </text>
<text x="56" y="1404" font-size="14" fill="#6B8084">this topic; see each article for design, sample si</text>
  </g>
</svg>
