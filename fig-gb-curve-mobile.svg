  <rect width="620" height="1673" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="40" y="62" font-size="13" fill="#A98722" font-weight="800" letter-spacing="2.5px">HOW TO READ A SURVIVAL CURVE</text>
<text x="40" y="108" font-size="27" fill="#123641" font-weight="800" class="r">尾巴上那幾個數字，每一個有自己的分母</text>
<text x="40" y="147.48" font-size="15.5" fill="#527078">這張圖要你看兩件事：中位數那條線的意思，以及尾巴是真的存在的。</text>
<text x="40" y="169.95" font-size="15.5" fill="#527078">尾巴上的三個數字來自三個不同的族群，各帶各的分母——不可以挑最高的那一</text>
<text x="40" y="192.43" font-size="15.5" fill="#527078">個當自己的預期。</text>
