<text x="62" y="1311.37" font-size="14.62" fill="#123641" font-weight="800">走過一段之後，前面的機率會變</text>
<text x="62" y="1337.37" font-size="12.04" fill="#527078" font-weight="600">「再活兩年」的機率</text>
<circle cx="62" cy="1373.37" r="9" fill="#5C77C4"/>
<text x="80" y="1379.37" font-size="18.92" fill="#5C77C4" font-weight="800">19.8%</text>
<text x="80" y="1399.37" font-size="11.18" fill="#527078">診斷當下</text>
<circle cx="498" cy="1373.37" r="9" fill="#00806B"/>
<text x="516" y="1379.37" font-size="18.92" fill="#00806B" font-weight="800">65.9%</text>
<text x="516" y="1399.37" font-size="11.18" fill="#527078">診斷後五年</text>
<text x="62" y="1417.37" font-size="11.61" fill="#527078">Johnson 2012，SEER 1998–2008 年、接受含放療方案的病人，n=10,022。這是族群層次的條</text>
<text x="62" y="1436.87" font-size="11.61" fill="#527078">件機率，不是誰的個人預測。</text>
<rect x="40" y="1480.365" width="540" height="111.12000000000012" rx="16" fill="#F6E2E0" stroke="#B04A4A" stroke-width="2.5"/>
<text x="64" y="1510.37" font-size="15.48" fill="#B04A4A" font-weight="800">這條曲線不是任何一個人的預測</text>
<text x="64" y="1532.72" font-size="12.9" fill="#345963" font-weight="600">它是一群人的統計。中位數不是期限；尾巴不是承諾。同一個人身上，年齡、體能狀態、</text>
<text x="64" y="1551.64" font-size="12.9" fill="#345963" font-weight="600">切除程度與 MGMT 會把他往左或往右推，而分級工具只解釋了其中大約兩成的差異——</text>
<text x="64" y="1570.57" font-size="12.9" fill="#345963" font-weight="600">剩下的八成，我們不知道是什麼。</text>
<text x="40" y="1609.49" font-size="14" fill="#527078">示意圖，依 Stupp 2009（EORTC 26981-22981／NCIC CE.3）、Poon 2020、</text>
<text x="40" y="1630.49" font-size="14" fill="#527078">Tykocki 2018 與 Johnson 2012 重繪；曲線形狀為示意，只有標出的數點是原文報告</text>
<text x="40" y="1651.49" font-size="14" fill="#527078">的數字；各研究族群、設計與終點不同，數點不可直接互比。</text>
  </g>
</svg>
