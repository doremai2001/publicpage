<text x="108" y="737.7" font-size="13" fill="#345963">Each beam keeps going after the tumour: a low-dose bath over both lungs and the heart</text>
<circle cx="403.92" cy="645.9" r="20.76" fill="#F1DDDD" stroke="#B04A4A" stroke-width="2"/>
<circle cx="403.92" cy="645.9" r="9.52" fill="#B04A4A"/>
