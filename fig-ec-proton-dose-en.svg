<text x="754" y="737.7" font-size="13" fill="#345963">The beam stops at the Bragg peak: almost no exit dose (schematic, not a real dose distribution)</text>
<circle cx="1049.92" cy="645.9" r="20.76" fill="#F1DDDD" stroke="#B04A4A" stroke-width="2"/>
<circle cx="1049.92" cy="645.9" r="9.52" fill="#B04A4A"/>
<text x="1172.75" y="471.17" font-size="13" fill="#6B8084" font-weight="700" text-anchor="middle">Lung</text>
<text x="913.25" y="471.17" font-size="13" fill="#6B8084" font-weight="700" text-anchor="middle">Lung</text>
<text x="1107.88" y="579.29" font-size="13" fill="#8E5A5A" font-weight="700" text-anchor="middle">Heart</text>
<text x="1043" y="698.66" font-size="12" fill="#7A6E58" font-weight="700" text-anchor="middle">Spine</text>
