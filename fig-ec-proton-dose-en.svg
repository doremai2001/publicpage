<rect x="94" y="793.7" width="5" height="327.3" rx="2.5" fill="#96790F"/>
<text x="106" y="813.6" font-size="14" fill="#123641" font-weight="800">Dosimetry: Zhang 2008 (MD Anderson, 15 distal</text>
<text x="106" y="833.2" font-size="14" fill="#123641" font-weight="800">oesophageal cancers, 4D-CT planning comparison)</text>
<circle cx="110" cy="857.9" r="3" fill="#96790F"/>
<text x="120" y="862.8" font-size="14" fill="#345963">Lung V5: two-beam protons 35.6% lower than</text>
<text x="120" y="883.1" font-size="14" fill="#345963">IMRT, three-beam 17.4% lower</text>
<circle cx="110" cy="904.5" r="3" fill="#96790F"/>
<text x="120" y="909.4" font-size="14" fill="#345963">Mean lung dose: 5.1 Gy (two-beam) / 2.9 Gy</text>
<text x="120" y="929.7" font-size="14" fill="#345963">(three-beam) lower</text>
<circle cx="110" cy="951.1" r="3" fill="#96790F"/>
<text x="120" y="956" font-size="14" fill="#345963">Heart V40: IMRT 35.7%, two-beam protons 41.8%</text>
<text x="120" y="976.3" font-size="14" fill="#345963">(higher), three-beam 27.7% — sparing lung and</text>
<text x="120" y="996.6" font-size="14" fill="#345963">sparing heart trade off</text>
<text x="106" y="1031.5" font-size="12.5" fill="#6B8084" font-weight="700">Heart V40 (%, Zhang 2008)</text>
<text x="106" y="1053.5" font-size="12.5" fill="#345963" font-weight="600">IMRT</text>
<rect x="210.65" y="1042.5" width="135.35" height="16" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="210.65" y="1042.5" width="96.64" height="16" rx="4" fill="#96790F" opacity="0.9"/>
<text x="313.29" y="1054.5" font-size="12.5" fill="#123641" font-weight="800">35.7</text>
<text x="106" y="1079.5" font-size="12.5" fill="#345963" font-weight="600">2-beam proton</text>
<rect x="210.65" y="1068.5" width="135.35" height="16" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="210.65" y="1068.5" width="113.15" height="16" rx="4" fill="#00806B" opacity="0.9"/>
<text x="329.8" y="1080.5" font-size="12.5" fill="#123641" font-weight="800">41.8</text>
<text x="106" y="1105.5" font-size="12.5" fill="#345963" font-weight="600">3-beam proton</text>
<rect x="210.65" y="1094.5" width="135.35" height="16" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="210.65" y="1094.5" width="74.98" height="16" rx="4" fill="#00806B" opacity="0.9"/>
<text x="291.63" y="1106.5" font-size="12.5" fill="#123641" font-weight="800">27.7</text>
<g filter="url(#sh)"><rect x="514" y="779.7" width="412" height="355.3" rx="18" fill="#FFFFFF"/></g>
<rect x="524" y="793.7" width="5" height="327.3" rx="2.5" fill="#00806B"/>
<text x="536" y="813.6" font-size="14" fill="#123641" font-weight="800">The only completed randomised comparison: Lin</text>
<text x="536" y="833.2" font-size="14" fill="#123641" font-weight="800">2020 (randomised phase IIB, n=145, 50.4 Gy, SCC +</text>
<text x="536" y="852.8" font-size="14" fill="#123641" font-weight="800">adenocarcinoma)</text>
<circle cx="540" cy="877.5" r="3" fill="#00806B"/>
<text x="550" y="882.4" font-size="14" fill="#345963">Primary endpoint was 'total toxicity burden' (a</text>
<text x="550" y="902.7" font-size="14" fill="#345963">composite of 11 adverse events and postoperative</text>
<text x="550" y="923" font-size="14" fill="#345963">complications): IMRT 39.9 vs protons 17.4</text>
<text x="550" y="943.3" font-size="14" fill="#345963">(2.3-fold)</text>
<circle cx="540" cy="964.7" r="3" fill="#00806B"/>
<text x="550" y="969.6" font-size="14" fill="#345963">Postoperative complication score 19.1 vs 2.5</text>
<circle cx="540" cy="991" r="3" fill="#00806B"/>
<text x="550" y="995.9" font-size="14" fill="#345963">3-year PFS 50.8% vs 51.2%; 3-year OS 44.5% vs</text>
<text x="550" y="1016.2" font-size="14" fill="#345963">44.5% — identical. 80% of the protons were passive</text>
<text x="550" y="1036.5" font-size="14" fill="#345963">scattering.</text>
<g filter="url(#sh)"><rect x="944" y="779.7" width="412" height="355.3" rx="18" fill="#FFFFFF"/></g>
<rect x="954" y="793.7" width="5" height="327.3" rx="2.5" fill="#5C77C4"/>
<text x="966" y="813.6" font-size="14" fill="#123641" font-weight="800">Lymphocytes: Shiraishi 2018 (propensity-matched</text>
<text x="966" y="833.2" font-size="14" fill="#123641" font-weight="800">136 vs 136, preoperative chemoradiotherapy,</text>
<text x="966" y="852.8" font-size="14" fill="#123641" font-weight="800">retrospective)</text>
<circle cx="970" cy="877.5" r="3" fill="#5C77C4"/>
<text x="980" y="882.4" font-size="14" fill="#345963">Grade 4 lymphopenia: IMRT 40.4% vs protons 17.6%</text>
<circle cx="970" cy="903.8" r="3" fill="#5C77C4"/>
<text x="980" y="908.7" font-size="14" fill="#345963">The low-dose bath hitting circulating lymphocytes</text>
<text x="980" y="929" font-size="14" fill="#345963">is the mechanistic hypothesis; its link to survival is</text>
<text x="980" y="949.3" font-size="14" fill="#345963">not drawn here.</text>
<circle cx="970" cy="970.7" r="3" fill="#5C77C4"/>
<text x="980" y="975.6" font-size="14" fill="#345963">Phase III NRG-GI006 (primary endpoint OS) —</text>
<text x="980" y="995.9" font-size="14" fill="#345963">primary completion estimated November 2031.</text>
<text x="84" y="1161" font-size="14" fill="#6B8084" font-weight="600">Zhou 2023 meta-analysis (45 studies, all non-randomised): protons significantly reduced grade 2+ pneumonitis, pericardial effusion and grade 4+ lymphopenia; its pooled survival advantage</text>
<text x="84" y="1181.3" font-size="14" fill="#6B8084" font-weight="600">comes entirely from non-randomised, selected patients and is not drawn. Retrospective data (Lin 2017): hospital stay 9.3 days with protons vs 11.6 with IMRT; 90-day mortality 0.9% vs</text>
<text x="84" y="1201.6" font-size="14" fill="#6B8084" font-weight="600">4.3%, not significant.</text>
<text x="84" y="1247.9" font-size="16" fill="#6B8084">Schematic (not an actual dose distribution), redrawn from Zhang 2008, Lin 2020 (JCO randomised phase IIB), Shiraishi 2018, Lin 2017, Zhou 2023 and the</text>
<text x="84" y="1271.9" font-size="16" fill="#6B8084">ClinicalTrials.gov NRG-GI006 record | dosimetric numbers come from a 15-patient planning comparison; the randomised trial's primary endpoint was toxicity</text>
<text x="84" y="1295.9" font-size="16" fill="#6B8084">burden, not survival; adult proton therapy in Taiwan is self-pay — ask the hospital's billing office</text>
  </g>
</svg>
