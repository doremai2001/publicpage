<text x="62" y="994.62" font-size="12.5" fill="#123641" font-weight="800">劑量學：Zhang 2008（MD Anderson，遠端食道癌 15 人，4D-CT 計畫比較）</text>
<circle cx="66" cy="1017.75" r="3" fill="#96790F"/>
<text x="76" y="1022.12" font-size="12.5" fill="#345963">肺 V5：兩束質子比 IMRT 少 35.6%、三束少 17.4%</text>
<circle cx="66" cy="1041.88" r="3" fill="#96790F"/>
<text x="76" y="1046.25" font-size="12.5" fill="#345963">平均肺劑量：少 5.1 Gy（兩束）／2.9 Gy（三束）</text>
<circle cx="66" cy="1066" r="3" fill="#96790F"/>
<text x="76" y="1070.38" font-size="12.5" fill="#345963">心臟 V40：IMRT 35.7%、兩束質子 41.8%（反而高）、三束 27.7%——省肺與省心要</text>
<text x="76" y="1088.5" font-size="12.5" fill="#345963">取捨</text>
<text x="62" y="1121.5" font-size="11.5" fill="#6B8084" font-weight="700">心臟 V40（%，Zhang 2008）</text>
<text x="62" y="1143.5" font-size="11.5" fill="#345963" font-weight="600">IMRT</text>
<rect x="120.92" y="1132.5" width="349.08" height="16" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="120.92" y="1132.5" width="249.24" height="16" rx="4" fill="#96790F" opacity="0.9"/>
<text x="376.16" y="1144.5" font-size="11.5" fill="#123641" font-weight="800">35.7</text>
<text x="62" y="1169.5" font-size="11.5" fill="#345963" font-weight="600">兩束質子</text>
<rect x="120.92" y="1158.5" width="349.08" height="16" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="120.92" y="1158.5" width="291.83" height="16" rx="4" fill="#00806B" opacity="0.9"/>
