<text x="62" y="1195.5" font-size="11.5" fill="#345963" font-weight="600">三束質子</text>
<rect x="120.92" y="1184.5" width="349.08" height="16" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="120.92" y="1184.5" width="193.39" height="16" rx="4" fill="#00806B" opacity="0.9"/>
<text x="320.31" y="1196.5" font-size="11.5" fill="#123641" font-weight="800">27.7</text>
<g filter="url(#sh)"><rect x="44" y="1236" width="532" height="166.12" rx="18" fill="#FFFFFF"/></g>
<rect x="54" y="1250" width="5" height="138.12" rx="2.5" fill="#00806B"/>
<text x="62" y="1264.62" font-size="12.5" fill="#123641" font-weight="800">唯一完成的隨機比較：Lin 2020（隨機第二期，n=145，50.4 Gy，鱗癌＋腺癌）</text>
<circle cx="66" cy="1287.75" r="3" fill="#00806B"/>
<text x="76" y="1292.12" font-size="12.5" fill="#345963">主要終點是「總毒性負擔」（11 種不良事件與術後併發症的複合分數）：IMRT 39.9</text>
<text x="76" y="1310.25" font-size="12.5" fill="#345963">對質子 17.4（2.3 倍）</text>
<circle cx="66" cy="1330" r="3" fill="#00806B"/>
<text x="76" y="1334.38" font-size="12.5" fill="#345963">術後併發症分數 19.1 對 2.5</text>
<circle cx="66" cy="1354.12" r="3" fill="#00806B"/>
<text x="76" y="1358.5" font-size="12.5" fill="#345963">3 年 PFS 50.8% 對 51.2%；3 年 OS 44.5% 對 44.5%——相同。80% 的質子是被動散</text>
<text x="76" y="1376.62" font-size="12.5" fill="#345963">射。</text>
<g filter="url(#sh)"><rect x="44" y="1416.12" width="532" height="129.88" rx="18" fill="#FFFFFF"/></g>
<rect x="54" y="1430.12" width="5" height="101.88" rx="2.5" fill="#5C77C4"/>
<text x="62" y="1444.75" font-size="12.5" fill="#123641" font-weight="800">淋巴球：Shiraishi 2018（傾向配對 136 對 136，術前化放療，回溯）</text>
<circle cx="66" cy="1467.88" r="3" fill="#5C77C4"/>
<text x="76" y="1472.25" font-size="12.5" fill="#345963">G4 淋巴球低下：IMRT 40.4% 對質子 17.6%</text>
<circle cx="66" cy="1492" r="3" fill="#5C77C4"/>
<text x="76" y="1496.38" font-size="12.5" fill="#345963">低劑量浴照到循環中的淋巴球，是機轉假說；它跟存活的連結本圖不畫。</text>
<circle cx="66" cy="1516.12" r="3" fill="#5C77C4"/>
<text x="76" y="1520.5" font-size="12.5" fill="#345963">第三期 NRG-GI006（主要終點 OS）主要完成估 2031 年 11 月。</text>
<text x="44" y="1570.5" font-size="12.5" fill="#6B8084" font-weight="600">Zhou 2023 統合（45 篇、全部非隨機）：質子顯著減少 G2+ 放射性肺炎、心包積液、G4+ 淋巴</text>
<text x="44" y="1588.62" font-size="12.5" fill="#6B8084" font-weight="600">球低下；統合的存活優勢全來自非隨機資料、病人經過選擇，本圖不畫。回溯資料（Lin 2017</text>
<text x="44" y="1606.75" font-size="12.5" fill="#6B8084" font-weight="600">）：住院天數質子 9.3 對 IMRT 11.6 天；90 天死亡 0.9% 對 4.3% 未達顯著。</text>
<text x="44" y="1646.88" font-size="12" fill="#6B8084">示意圖（非實際劑量分布），依 Zhang 2008、Lin 2020（JCO 隨機第二期）、Shiraishi 2018、</text>
<text x="44" y="1664.88" font-size="12" fill="#6B8084">Lin 2017、Zhou 2023 與 ClinicalTrials.gov NRG-GI006 登錄重繪｜劑量學數字來自 15 人的計畫</text>
<text x="44" y="1682.88" font-size="12" fill="#6B8084">比較，隨機試驗主要終點是毒性負擔不是存活；成人質子在台灣為自費，費用問醫務課</text>
  </g>
