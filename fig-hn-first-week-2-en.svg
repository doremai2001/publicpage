<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">How to read research about waiting time</title>
  <desc id="desc">Large retrospective registries associate longer waits with worse survival, but population data are not a personal countdown. Complete necessary staging efficiently rather than skipping it.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#0B2832" flood-opacity=".14"/></filter>
    <style>.sans{font-family:Arial,"Noto Sans",sans-serif}.serif{font-family:Georgia,"Noto Serif",serif}.title{fill:#123641;font-size:42px;font-weight:800}.sub{fill:#527078;font-size:23px}.metric{fill:#123641;font-size:38px;font-weight:900}.label{fill:#345963;font-size:21px}.ct{fill:#F7F1E4;font-size:24px;font-weight:800}.cb{fill:#D4E0DF;font-size:21px}.dt{fill:#123641;font-size:27px;font-weight:800}.db{fill:#45656D;font-size:21px}.small{fill:#6B8084;font-size:16px}</style>
  </defs>
  <rect width="1440" height="860" rx="36" fill="url(#bg)"/>
  <g class="sans">
    <text x="84" y="91" fill="#A98722" font-size="18" font-weight="800" letter-spacing="5">HOW TO READ THE EVIDENCE</text>
    <text x="84" y="157" class="title serif">Waiting has a cost — but it is not your personal countdown</text>
    <text x="84" y="202" class="sub">Large registries show an association; they cannot prove that waiting itself caused worse survival.</text>
    <g filter="url(#s)"><rect x="84" y="267" width="392" height="214" rx="25" fill="#FFF"/><text x="122" y="320" fill="#A98722" font-size="20" font-weight="800">TAIWAN · ORAL CAVITY SCC</text><text x="122" y="383" class="metric">18,677 patients</text><text x="122" y="428" class="label">Treatment interval associated with</text><text x="122" y="459" class="label">5-year overall survival (2004–2010)</text></g>
    <g filter="url(#s)"><rect x="506" y="267" width="392" height="214" rx="25" fill="#FFF"/><text x="544" y="320" fill="#A98722" font-size="20" font-weight="800">UNITED STATES · H&amp;N SCC</text><text x="544" y="383" class="metric">51,655 patients</text><text x="544" y="428" class="label">61–90 days vs within 30 days</text><text x="544" y="459" class="label">HR for death 1.13 (95% CI 1.08–1.19)</text></g>
    <g filter="url(#s)"><rect x="928" y="267" width="428" height="214" rx="25" fill="#123641"/><text x="968" y="322" class="ct">The studies show association</text><text x="968" y="369" class="cb">Complex disease often takes longer</text><text x="968" y="403" class="cb">to assess — and carries its own risk.</text><line x1="968" y1="430" x2="1314" y2="430" stroke="#C9A83E" stroke-width="3"/><text x="968" y="463" fill="#F2D879" font-size="18" font-weight="800">Not “X more days = Y% more danger”</text></g>
    <g filter="url(#s)"><rect x="84" y="531" width="620" height="228" rx="26" fill="#173F49"/><circle cx="132" cy="585" r="23" fill="#C9A83E"/><path d="M121 586l8 8 15-19" fill="none" stroke="#0A2731" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="174" y="596" class="ct">The useful reading</text><text x="126" y="650" class="cb">Complete the necessary staging efficiently.</text><text x="126" y="687" class="cb">Know what is missing and when decisions happen.</text><text x="126" y="727" fill="#F2D879" font-size="20" font-weight="800">Goal: complete work-up, without avoidable stalls.</text></g>
    <g filter="url(#s)"><rect x="736" y="531" width="620" height="228" rx="26" fill="#FFF"/><circle cx="784" cy="585" r="23" fill="#D8C78F"/><path d="M775 576l18 18m0-18-18 18" stroke="#123641" stroke-width="5" stroke-linecap="round"/><text x="826" y="596" class="dt">The misleading reading</text><text x="778" y="650" class="db">Draw one sharp “safe / dangerous” cutoff,</text><text x="778" y="687" class="db">or skip necessary staging just to start sooner.</text><text x="778" y="727" fill="#99791B" font-size="20" font-weight="800">A population average is not a personal verdict.</text></g>
    <text x="84" y="815" class="small">Sources: article references [2] Liao et al., 2017; [3] Murphy et al., 2016 · Original infographic</text>
  </g>
</svg>
