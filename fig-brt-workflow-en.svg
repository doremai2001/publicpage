<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1364" viewBox="0 0 1440 1364" role="img" aria-labelledby="t d">
  <title id="t">Simulation to treatment: the steps can be drawn, the days cannot</title>
  <desc id="d">Schematic of the path from simulation to treatment, drawing the steps and no days. The eight steps in order: one, clinic visit and decision — what is treated and over how many fractions is settled in clinic first; two, planning CT simulation — a three-dimensional map in the treatment position, with at least two scans that day for patients having DIBH, one free breathing and one breath hold; three, DIBH practice — where studies state a duration, the typical training session is 15 to 30 minutes, the only time figure on the whole page; four, marks and skin tattoos — the coordinates used to set the patient up each day, which should not be redrawn or rubbed out at home; five, outlining target and organs — the doctor draws the volume to be treated and the organs to be avoided, slice by slice; six, plan design and dose calculation — the physicist arranges the fields and computes the dose; seven, quality verification on the machine — checking that what the machine actually delivers matches what the computer calculated; eight, first treatment and weekly review — check in, set-up, imaging, beam on, with set-up and verification taking most of the time and nothing hurting or feeling hot. A separate panel covers the breath hold itself: the tolerance on the inspiration position is typically just 2 to 5 mm and the beam stops automatically outside it; every field starts with a fresh breath in and a fresh hold, and the literature consistently reports high levels of compliance; even so, after pre-selection and training about three in ten cannot complete a breath-hold planning scan, and then the plan is made another way. The figure states plainly that it carries no days and no minutes: how many days from simulation to the first treatment, how many minutes a single session takes, and how many seconds each breath hold lasts are three questions for which no citable general figure was found, so none is drawn or invented and patients should go by their own hospital's schedule and instructions. What is citable is the 15 to 30 minute training session (systematic review of 38 studies covering literature from 2000 to 2014), which is how long the practice takes and not how long treatment takes.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><pattern id="hz" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#96790F" stroke-width="2" opacity="0.55"/></pattern><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="1364" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="86" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">SIMULATION → FIRST TREATMENT</text>
<text x="84" y="148" font-size="44" fill="#123641" font-weight="800" class="r">Simulation to treatment: the steps can be drawn, the</text>
<text x="84" y="202" font-size="44" fill="#123641" font-weight="800" class="r">days cannot</text>
<text x="84" y="248" font-size="21" fill="#527078">This flow shows what happens, not how many days you wait — that figure is not in the literature, and it is</text>
<text x="84" y="278" font-size="21" fill="#527078">not invented here.</text>
<text x="84" y="308" font-size="21" fill="#527078">The only citable time figure on the whole page is the DIBH training session.</text>
<g filter="url(#sh)"><rect x="84" y="348" width="282" height="228" rx="18" fill="#FFFFFF"/></g>
<text x="110" y="384" font-size="18" fill="#123641" font-weight="800">① Clinic visit and</text>
<text x="110" y="410" font-size="18" fill="#123641" font-weight="800">decision</text>
<text x="110" y="440" font-size="14.2" fill="#345963">What is treated and over how</text>
<text x="110" y="464" font-size="14.2" fill="#345963">many fractions is settled in</text>
<text x="110" y="488" font-size="14.2" fill="#345963">clinic first.</text>
<line x1="374" y1="462" x2="406" y2="462" stroke="#123641" stroke-width="2.5" stroke-linecap="round"/>
<line x1="406" y1="462" x2="396.3" y2="467.2" stroke="#123641" stroke-width="2.5" stroke-linecap="round"/>
<line x1="406" y1="462" x2="396.3" y2="456.8" stroke="#123641" stroke-width="2.5" stroke-linecap="round"/>
<g filter="url(#sh)"><rect x="414" y="348" width="282" height="228" rx="18" fill="#FFFFFF"/></g>
<text x="440" y="384" font-size="18" fill="#123641" font-weight="800">② Planning CT</text>
<text x="440" y="410" font-size="18" fill="#123641" font-weight="800">simulation</text>
<text x="440" y="440" font-size="14.2" fill="#345963">A three-dimensional map in</text>
<text x="440" y="464" font-size="14.2" fill="#345963">the treatment position. For</text>
<text x="440" y="488" font-size="14.2" fill="#345963">DIBH, at least two scans</text>
<text x="440" y="512" font-size="14.2" fill="#345963">that day: one free</text>
<text x="440" y="536" font-size="14.2" fill="#345963">breathing, one breath hold.</text>
<line x1="704" y1="462" x2="736" y2="462" stroke="#123641" stroke-width="2.5" stroke-linecap="round"/>
<line x1="736" y1="462" x2="726.3" y2="467.2" stroke="#123641" stroke-width="2.5" stroke-linecap="round"/>
<line x1="736" y1="462" x2="726.3" y2="456.8" stroke="#123641" stroke-width="2.5" stroke-linecap="round"/>
<g filter="url(#sh)"><rect x="744" y="348" width="282" height="228" rx="18" fill="#FFFFFF"/></g>
<text x="770" y="384" font-size="18" fill="#123641" font-weight="800">③ DIBH practice</text>
<text x="770" y="414" font-size="14.2" fill="#345963">Where studies state a</text>
<text x="770" y="438" font-size="14.2" fill="#345963">duration, the typical</text>
<text x="770" y="462" font-size="14.2" fill="#345963">training session is 15 to 30</text>
<text x="770" y="486" font-size="14.2" fill="#345963">minutes — the only time</text>
<text x="770" y="510" font-size="14.2" fill="#345963">figure on this page.</text>
<line x1="1034" y1="462" x2="1066" y2="462" stroke="#123641" stroke-width="2.5" stroke-linecap="round"/>
<line x1="1066" y1="462" x2="1056.3" y2="467.2" stroke="#123641" stroke-width="2.5" stroke-linecap="round"/>
<line x1="1066" y1="462" x2="1056.3" y2="456.8" stroke="#123641" stroke-width="2.5" stroke-linecap="round"/>
<g filter="url(#sh)"><rect x="1074" y="348" width="282" height="228" rx="18" fill="#FFFFFF"/></g>
<text x="1100" y="384" font-size="18" fill="#123641" font-weight="800">④ Marks and skin</text>
<text x="1100" y="410" font-size="18" fill="#123641" font-weight="800">tattoos</text>
<text x="1100" y="440" font-size="14.2" fill="#345963">The coordinates used to set</text>
<text x="1100" y="464" font-size="14.2" fill="#345963">you up each day; do not</text>
<text x="1100" y="488" font-size="14.2" fill="#345963">redraw or rub out the lines</text>
<text x="1100" y="512" font-size="14.2" fill="#345963">and dots yourself.</text>
<g filter="url(#sh)"><rect x="84" y="636" width="282" height="228" rx="18" fill="#FFFFFF"/></g>
<text x="110" y="672" font-size="18" fill="#123641" font-weight="800">⑤ Outlining target and</text>
<text x="110" y="698" font-size="18" fill="#123641" font-weight="800">organs</text>
<text x="110" y="728" font-size="14.2" fill="#345963">The doctor draws the volume</text>
<text x="110" y="752" font-size="14.2" fill="#345963">to be treated and the organs</text>
<text x="110" y="776" font-size="14.2" fill="#345963">to be avoided, slice by</text>
<text x="110" y="800" font-size="14.2" fill="#345963">slice.</text>
<line x1="374" y1="750" x2="406" y2="750" stroke="#123641" stroke-width="2.5" stroke-linecap="round"/>
<line x1="406" y1="750" x2="396.3" y2="755.2" stroke="#123641" stroke-width="2.5" stroke-linecap="round"/>
<line x1="406" y1="750" x2="396.3" y2="744.8" stroke="#123641" stroke-width="2.5" stroke-linecap="round"/>
<g filter="url(#sh)"><rect x="414" y="636" width="282" height="228" rx="18" fill="#FFFFFF"/></g>
<text x="440" y="672" font-size="18" fill="#123641" font-weight="800">⑥ Plan design and dose</text>
<text x="440" y="698" font-size="18" fill="#123641" font-weight="800">calculation</text>
<text x="440" y="728" font-size="14.2" fill="#345963">The physicist arranges the</text>
<text x="440" y="752" font-size="14.2" fill="#345963">fields and computes the</text>
<text x="440" y="776" font-size="14.2" fill="#345963">dose; during the wait your</text>
<text x="440" y="800" font-size="14.2" fill="#345963">plan is being drawn and</text>
<text x="440" y="824" font-size="14.2" fill="#345963">calculated.</text>
<line x1="704" y1="750" x2="736" y2="750" stroke="#123641" stroke-width="2.5" stroke-linecap="round"/>
<line x1="736" y1="750" x2="726.3" y2="755.2" stroke="#123641" stroke-width="2.5" stroke-linecap="round"/>
<line x1="736" y1="750" x2="726.3" y2="744.8" stroke="#123641" stroke-width="2.5" stroke-linecap="round"/>
<g filter="url(#sh)"><rect x="744" y="636" width="282" height="228" rx="18" fill="#FFFFFF"/></g>
<text x="770" y="672" font-size="18" fill="#123641" font-weight="800">⑦ Quality verification</text>
<text x="770" y="698" font-size="18" fill="#123641" font-weight="800">on the machine</text>
<text x="770" y="728" font-size="14.2" fill="#345963">Checking that what the</text>
<text x="770" y="752" font-size="14.2" fill="#345963">machine actually delivers</text>
<text x="770" y="776" font-size="14.2" fill="#345963">matches what the computer</text>
<text x="770" y="800" font-size="14.2" fill="#345963">calculated.</text>
<line x1="1034" y1="750" x2="1066" y2="750" stroke="#123641" stroke-width="2.5" stroke-linecap="round"/>
<line x1="1066" y1="750" x2="1056.3" y2="755.2" stroke="#123641" stroke-width="2.5" stroke-linecap="round"/>
<line x1="1066" y1="750" x2="1056.3" y2="744.8" stroke="#123641" stroke-width="2.5" stroke-linecap="round"/>
<g filter="url(#sh)"><rect x="1074" y="636" width="282" height="228" rx="18" fill="#FFFFFF"/></g>
<text x="1100" y="672" font-size="18" fill="#123641" font-weight="800">⑧ First treatment and</text>
<text x="1100" y="698" font-size="18" fill="#123641" font-weight="800">weekly review</text>
<text x="1100" y="728" font-size="14.2" fill="#345963">Check in, set-up, imaging,</text>
<text x="1100" y="752" font-size="14.2" fill="#345963">beam on; set-up and</text>
<text x="1100" y="776" font-size="14.2" fill="#345963">verification take most of</text>
<text x="1100" y="800" font-size="14.2" fill="#345963">the time, and nothing hurts</text>
<text x="1100" y="824" font-size="14.2" fill="#345963">or feels hot.</text>
<line x1="1215" y1="582" x2="1215" y2="606" stroke="#6B8084" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="1215" y1="606" x2="225" y2="606" stroke="#6B8084" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="225" y1="606" x2="225" y2="630" stroke="#6B8084" stroke-width="2" stroke-linecap="round"/>
<line x1="225" y1="630" x2="219.8" y2="620.3" stroke="#6B8084" stroke-width="2" stroke-linecap="round"/>
<line x1="225" y1="630" x2="230.2" y2="620.3" stroke="#6B8084" stroke-width="2" stroke-linecap="round"/>
<g filter="url(#sh)"><rect x="84" y="898" width="1272" height="154" rx="18" fill="#FFFFFF"/></g>
<text x="110" y="934" font-size="18" fill="#123641" font-weight="800">The breath hold is yours; the equipment only watches</text>
<text x="110" y="964" font-size="14.2" fill="#345963">The tolerance on the inspiration position is typically just 2 to 5 mm, and the beam stops automatically outside it.</text>
<text x="110" y="988" font-size="14.2" fill="#345963">Every field starts with a fresh breath in and a fresh hold; the literature consistently reports high levels of compliance.</text>
<text x="110" y="1012" font-size="14.2" fill="#345963">Even so, after pre-selection and training about three in ten cannot complete a breath-hold planning scan — and then the plan is made another way.</text>
<rect x="84" y="1082" width="1272" height="166" rx="16" fill="none" stroke="#C9A83E" stroke-width="2.5"/>
<text x="110" y="1114" font-size="17" fill="#8F7418" font-weight="800">No days on this page, and no minutes either</text>
<text x="110" y="1142" font-size="15" fill="#345963">How many days from simulation to the first treatment, how many minutes a single session takes, how many seconds each breath hold lasts — no citable</text>
<text x="110" y="1170" font-size="15" fill="#345963">general figure was found for any of the three, so none is drawn or invented; go by your own hospital's schedule and instructions.</text>
<text x="110" y="1198" font-size="15" fill="#345963">What is citable is the 15 to 30 minute training session (systematic review of 38 studies, covering literature from 2000 to 2014) — that is how long</text>
<text x="110" y="1226" font-size="15" fill="#345963">the practice takes, not how long treatment takes, and the two must not be conflated.</text>
<text x="84" y="1292" font-size="16" fill="#6B8084">Schematic, redrawn from Latty 2015, Bergom 2018 and Lai 2022</text>
<text x="84" y="1316" font-size="16" fill="#6B8084">Steps follow the usual clinical order; names, sequence and scheduling differ between centres — go by your own hospital's instructions</text>
  </g>
</svg>
