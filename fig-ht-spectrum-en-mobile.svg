<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1560" viewBox="0 0 720 1560" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">A few degrees apart is a different treatment</title>
  <desc id="d">Schematic. The clinical band follows the range reported in Datta et al. 2015; no per-effect temperature thresholds are drawn, because those depend on tissue and time. Clinical hyperthermia band：Perfusion and oxygenation rise／Interstitial fluid pressure falls／Hypoxic cells become less radioresistant／DNA repair is impaired／Hypoxic, acidic regions take direct damage／The same radiation dose does more</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#123641" opacity=".14"/><line x1="0" y1="0" x2="0" y2="8" stroke="#123641" stroke-width="2.4" opacity=".85"/></pattern><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0B2832" flood-opacity=".12"/></filter><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="720" height="1560" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="56" y="78" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">TEMPERATURE</text>
<text x="56" y="140" font-size="30" fill="#123641" font-weight="800" class="r">A few degrees apart is a different treatment</text>
<text x="56" y="182" font-size="18" fill="#527078">This topic is about the 39–45 °C band.</text>
<text x="56" y="209" font-size="18" fill="#527078">Ablation at higher temperatures is a different treatment.</text>
<rect x="64" y="332" width="74" height="500" rx="18" fill="#123641" opacity=".07" />
<rect x="64" y="582" width="74" height="250" rx="0" fill="#5C77C4" opacity=".28" />
<rect x="64" y="332" width="74" height="250" rx="0" fill="#A98722" opacity=".42" />
<rect x="64" y="332" width="74" height="500" rx="18" fill="none" stroke="#A98722" stroke-width="3" />
<line x1="54" y1="832" x2="148" y2="832" stroke="#123641" stroke-width="1.5" stroke-linecap="round" opacity=".35"/>
<text x="46" y="839" font-size="17" fill="#6B8084" font-weight="700" text-anchor="end">39°C</text>
<line x1="54" y1="665.333" x2="148" y2="665.333" stroke="#123641" stroke-width="1.5" stroke-linecap="round" opacity=".35"/>
<text x="46" y="672.333" font-size="17" fill="#6B8084" font-weight="700" text-anchor="end">41°C</text>
<line x1="54" y1="498.667" x2="148" y2="498.667" stroke="#123641" stroke-width="1.5" stroke-linecap="round" opacity=".35"/>
<text x="46" y="505.667" font-size="17" fill="#6B8084" font-weight="700" text-anchor="end">43°C</text>
<line x1="54" y1="332" x2="148" y2="332" stroke="#123641" stroke-width="1.5" stroke-linecap="round" opacity=".35"/>
<text x="46" y="339" font-size="17" fill="#6B8084" font-weight="700" text-anchor="end">45°C</text>
<line x1="172" y1="332" x2="172" y2="832" stroke="#A98722" stroke-width="5" stroke-linecap="round"/>
<text x="188" y="578" font-size="18" fill="#8F7418" font-weight="800">Clinical hyperthermia band</text>
<rect x="56" y="910" width="608" height="168" rx="20" fill="#FFFFFF" opacity=".82" filter="url(#sh)"/>
<rect x="56" y="910" width="6" height="168" rx="3" fill="#A98722" />
<text x="82" y="950" font-size="21" fill="#123641" font-weight="800" class="r">Upper end of the band</text>
<text x="82" y="982" font-size="17" fill="#527078">・DNA repair is impaired</text>
<text x="82" y="1012" font-size="17" fill="#527078">・Hypoxic, acidic regions take direct damage</text>
<text x="82" y="1042" font-size="17" fill="#527078">・The same radiation dose does more</text>
<rect x="56" y="1100" width="608" height="168" rx="20" fill="#FFFFFF" opacity=".82" filter="url(#sh)"/>
<rect x="56" y="1100" width="6" height="168" rx="3" fill="#5C77C4" />
<text x="82" y="1140" font-size="21" fill="#123641" font-weight="800" class="r">Lower end of the band</text>
<text x="82" y="1172" font-size="17" fill="#527078">・Perfusion and oxygenation rise</text>
<text x="82" y="1202" font-size="17" fill="#527078">・Interstitial fluid pressure falls</text>
<text x="82" y="1232" font-size="17" fill="#527078">・Hypoxic cells become less radioresistant</text>
<line x1="56" y1="1296" x2="664" y2="1296" stroke="#123641" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 9" opacity=".45"/>
<text x="56" y="1284" font-size="14" fill="#6B8084" opacity=".9">The gap is deliberate: there is no clean line between these zones</text>
<rect x="56" y="1318" width="608" height="168" rx="20" fill="#9A9282" opacity=".13" stroke="#9A9282" stroke-width="2" />
<text x="82" y="1358" font-size="21" fill="#345963" font-weight="800" class="r">Higher still: ablation</text>
<text x="82" y="1390" font-size="17" fill="#6B8084">・Cells die outright; tissue necroses</text>
<text x="82" y="1420" font-size="17" fill="#6B8084">・RFA, microwave ablation, HIFU</text>
<text x="82" y="1450" font-size="17" fill="#6B8084">・A different treatment — not this topic</text>
<text x="56" y="1518" font-size="14" fill="#6B8084">Schematic. The clinical band follows the range repor</text>
<text x="56" y="1540" font-size="14" fill="#6B8084">ted in Datta et al. 2015; no per-effect temperature </text>
  </g>
</svg>
