<text x="296.69" y="1737" font-size="15" fill="#00806B" font-weight="800" text-anchor="middle">26.0%</text>
<text x="504.31" y="1737" font-size="15" fill="#B04A4A" font-weight="800" text-anchor="middle">49.4%</text>
