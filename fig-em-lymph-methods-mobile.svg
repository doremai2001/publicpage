<text x="305.56" y="1853" font-size="15" fill="#00806B" font-weight="800" text-anchor="middle">27%</text>
<text x="429.78" y="1853" font-size="15" fill="#B04A4A" font-weight="800" text-anchor="middle">41%</text>
<text x="66" y="1885" font-size="14.5" fill="#345963">校正後勝算比：Casarin 3.11、Glaser 2.75、Leitao 1.8。放療是另一個獨</text>
<text x="66" y="1906" font-size="14.5" fill="#345963">立因子——Leitao 那份問卷裡做過外照射的人自述水腫 51%、沒做的 35%，勝</text>
<text x="66" y="1927" font-size="14.5" fill="#345963">算比 1.95。</text>
<rect x="66" y="1962" width="488" height="159" rx="14" fill="none" stroke="#C9A83E" stroke-width="2"/>
<text x="82" y="1984" font-size="16" fill="#8F7418" font-weight="800">第五筆根本放不進上面那條軸</text>
<text x="82" y="2006" font-size="14.5" fill="#345963">丹麥全國前瞻世代 486 位低惡性度、推定第 1 期、全部做前哨淋巴結的</text>
<text x="82" y="2027" font-size="14.5" fill="#345963">病人，用 EORTC QLQ-EN24 的腿部水腫分數（0 到 100 分）比術前與</text>
<text x="82" y="2048" font-size="14.5" fill="#345963">12 個月：平均只上升 5.0 分（95% 信賴區間 3.3 到 6.8），低於 8 分的</text>
<text x="82" y="2069" font-size="14.5" fill="#345963">臨床顯著門檻。它報的是分數不是百分比，沒有辦法跟上面四列擺在同</text>
<text x="82" y="2090" font-size="14.5" fill="#345963">一條軸上比。</text>
<rect x="40" y="2159" width="540" height="345" rx="16" fill="#F6E2E0" stroke="#B04A4A" stroke-width="2.5"/>
<text x="66" y="2189" font-size="18" fill="#B04A4A" font-weight="800">這張圖不給你一個機率</text>
<text x="66" y="2215" font-size="15.5" fill="#345963">上面每一個數字都綁著一種判定方法與一個族群，把它們平均起來、或</text>
<text x="66" y="2238" font-size="15.5" fill="#345963">挑一個當「機率」，都是把判定方法造成的差異當成身體造成的差異。</text>
<text x="66" y="2275" font-size="15.5" fill="#345963">也不要把它讀成「做前哨就不會腫」：同樣用問卷的三份研究裡，前哨</text>
<text x="66" y="2298" font-size="15.5" fill="#345963">組仍有 21.4% 到 27% 自述水腫。</text>
<rect x="66" y="2337" width="488" height="163" rx="14" fill="#FFFFFF"/>
<text x="82" y="2359" font-size="16" fill="#B04A4A" font-weight="800">自我按摩不能寫成預防</text>
<text x="82" y="2381" font-size="14.5" fill="#345963">同一個日本世代裡，未接受輔助治療的 87 人依意願分組：24 人每天做</text>
<text x="82" y="2402" font-size="14.5" fill="#345963">簡易淋巴引流滿一年、63 人沒做，追蹤五年——下肢周徑變化率與細胞</text>
<text x="82" y="2423" font-size="14.5" fill="#345963">外水比值都沒有差異，5 年累積發生率 37.5% 對 23.5%，方向甚至相反。</text>
<text x="82" y="2444" font-size="14.5" fill="#345963">作者結論逐字是「SLD does not contribute to the prevention of</text>
<text x="82" y="2465" font-size="14.5" fill="#345963">LLE」。</text>
<text x="40" y="2522" font-size="16" fill="#527078">示意圖，依 Wedin 2021、Geppert 2018、Leitao 2020、Glaser 2021、</text>
