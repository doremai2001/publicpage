<svg xmlns="http://www.w3.org/2000/svg" width="620" height="2600" viewBox="0 0 620 2600" role="img" aria-labelledby="t d">
  <title id="t">下肢淋巴水腫：同一批 235 人，四種判定方法，四個結論</title>
  <desc id="d">示意圖：下肢淋巴水腫的判定方法如何決定結論。圖的主標題是「判定方法決定了結論」。上半是四條並排的長條：瑞典 14 家醫院的前瞻研究，n=235，其中 116 人做淋巴結廓清、119 人沒做，術前與術後一年對同一批人同時用四種方法判定，兩種體積法以增加 10% 以上為門檻。同一個風險因子「淋巴結廓清」，四種判定方法算出來的校正後勝算比是：以身體質量指數標準化的體積 14.42（95% 信賴區間 3.49 到 59.62）；病人自覺 2.51（1.33 到 4.73）；臨床分級 2.11（1.04 到 4.29）；周徑推算的原始體積完全看不出來，未達統計顯著。長條圖上另標一條虛線在 1，代表看不出差別。補充說明：輔助放療也一樣，在這四種量法裡只有以身體質量指數標準化的體積這一種算得出它是風險因子（校正後勝算比 15.02，95% 信賴區間 2.34 到 96.57）；作者結論句是 Apparent risk factors for lymphedema differed considerably depending on the method used，並主張這個領域需要一個公認的判定標準。圖上另有一行警語：勝算比不是機率的倍數，事件常見的時候勝算比會比真正的風險倍數看起來大得多，14.42 不等於機率高 14 倍。下半是那個 1.3% 到 49.4% 的區間逐筆標上判定方法：Geppert 2018 用臨床判定、n=188 機器人手術，只做前哨淋巴結者 1.3%、做淋巴結廓清者 18.1%；Casarin 2025 用問卷、n=239 腹腔鏡，21.4% 對 44.6%；Glaser 2021 用 13 題自填問卷、n=378，26.0% 對 49.4%；Leitao 2020 用 13 題自填問卷、n=599，27% 對 41%。校正後勝算比分別是 Casarin 3.11、Glaser 2.75、Leitao 1.8；放療是另一個獨立因子，Leitao 那份問卷裡做過外照射的人自述水腫 51%、沒做的 35%，勝算比 1.95。第五筆放不進同一條軸：丹麥全國前瞻世代 486 位低惡性度、推定第 1 期、全部做前哨淋巴結的病人，用 EORTC QLQ-EN24 腿部水腫分數（0 到 100 分）比術前與 12 個月，平均只上升 5.0 分（95% 信賴區間 3.3 到 6.8），低於 8 分的臨床顯著門檻；它報的是分數不是百分比。圖的最後兩格是不准的讀法。第一格：這張圖不給你一個機率——上面每一個數字都綁著一種判定方法與一個族群，把它們平均起來或挑一個當機率，都是把判定方法造成的差異當成身體造成的差異；也不要讀成做前哨就不會腫，同樣用問卷的三份研究裡前哨組仍有 21.4% 到 27% 自述水腫。第二格：自我按摩不能寫成預防——同一個日本世代裡未接受輔助治療的 87 人依意願分組，24 人每天做簡易淋巴引流滿一年、63 人沒做，追蹤五年，下肢周徑變化率與細胞外水比值都沒有差異，5 年累積發生率 37.5% 對 23.5%，方向甚至相反，作者結論逐字是 SLD does not contribute to the prevention of LLE。</desc>
