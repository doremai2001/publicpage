<text x="418.5" y="449" font-size="12.5" fill="#527078" text-anchor="middle">15</text>
<text x="66" y="479" font-size="15.5" fill="#123641" font-weight="800">以身體質量指數標準化的體積</text>
<rect x="66" y="498" width="338.87" height="30" rx="7" fill="#B04A4A"/>
