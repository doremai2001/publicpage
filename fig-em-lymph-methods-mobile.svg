<text x="66" y="553" font-size="14" fill="#527078">95% 信賴區間 3.49 到 59.62</text>
<text x="66" y="597" font-size="15.5" fill="#123641" font-weight="800">病人自覺</text>
<rect x="66" y="616" width="58.98" height="30" rx="7" fill="#5C77C4"/>
<line x1="97.25" y1="631" x2="177.16" y2="631" stroke="#123641" stroke-width="2" stroke-linecap="butt" opacity="0.55"/>
