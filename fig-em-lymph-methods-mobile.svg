<text x="66" y="671" font-size="14" fill="#527078">95% 信賴區間 1.33 到 4.73</text>
<text x="66" y="715" font-size="15.5" fill="#123641" font-weight="800">臨床分級</text>
<rect x="66" y="734" width="49.58" height="30" rx="7" fill="#96790F"/>
<line x1="90.44" y1="749" x2="166.81" y2="749" stroke="#123641" stroke-width="2" stroke-linecap="butt" opacity="0.55"/>
<line x1="90.44" y1="742" x2="90.44" y2="756" stroke="#123641" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
