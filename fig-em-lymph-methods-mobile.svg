<text x="66" y="789" font-size="14" fill="#527078">95% 信賴區間 1.04 到 4.29</text>
<text x="66" y="833" font-size="15.5" fill="#123641" font-weight="800">周徑推算的原始體積</text>
<rect x="66" y="852" width="376" height="30" rx="7" fill="none" stroke="#B9AE94" stroke-width="1.6" stroke-dasharray="6 5"/>
