<text x="66" y="1261" font-size="18" fill="#123641" font-weight="800">那個 1.3% 到 49.4% 的區間，逐筆標上判定方法就散開了</text>
<text x="66" y="1293" font-size="14.5" fill="#527078">每一列是一份研究：左邊的點是只做前哨淋巴結的人，右邊的點是做淋巴結</text>
<text x="66" y="1314" font-size="14.5" fill="#527078">廓清的人。判定方法寫在研究名字後面——區間這麼寬，主要來自這一欄。</text>
