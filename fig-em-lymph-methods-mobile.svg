<text x="40" y="74" font-size="17" fill="#A98722" font-weight="800" letter-spacing="2px">HOW LYMPHOEDEMA IS MEASURED</text>
<text x="40" y="128" font-size="40" fill="#123641" font-weight="800" class="r">判定方法決定了結論</text>
<text x="40" y="186" font-size="19" fill="#527078">同一批 235 人、同一個風險因子、術後同一個時間點，四種判定</text>
<text x="40" y="214" font-size="19" fill="#527078">方法給出四個不同的答案。</text>
<text x="40" y="242" font-size="19" fill="#527078">所以「機率多少」這個問題，要先問「誰在量、怎麼量」。</text>
<g filter="url(#sh)">
<rect x="40" y="286" width="540" height="913" rx="18" fill="#FFFFFF"/>
</g>
<text x="66" y="318" font-size="18" fill="#123641" font-weight="800">同一個風險因子（淋巴結廓清），四種判定方法算出來的校正</text>
<text x="66" y="344" font-size="18" fill="#123641" font-weight="800">後勝算比</text>
<text x="66" y="376" font-size="14.5" fill="#527078">瑞典 14 家醫院的前瞻研究：n=235（116 人做淋巴結廓清、119 人沒做），</text>
<text x="66" y="397" font-size="14.5" fill="#527078">術前與術後一年對同一批人同時用四種方法判定；兩種體積法以增加 10% 以</text>
<text x="66" y="418" font-size="14.5" fill="#527078">上為門檻。</text>
<line x1="66" y1="453" x2="66" y2="461" stroke="#B9AE94" stroke-width="1.5" stroke-linecap="round"/>
