<text x="468" y="874" font-size="21" fill="#7A6E58" font-weight="800">—</text>
<text x="66" y="907" font-size="14" fill="#527078">未達統計顯著</text>
<line x1="89.5" y1="459" x2="89.5" y2="929" stroke="#123641" stroke-width="1.6" stroke-linecap="butt" stroke-dasharray="5 5" opacity="0.45"/>
<text x="66" y="951" font-size="14" fill="#527078">校正後勝算比（虛線是 1，也就是「看不出差別」）</text>
<text x="66" y="975" font-size="14.5" fill="#345963">輔助放療也一樣：在這四種量法裡，只有「以身體質量指數標準化的體積」</text>
<text x="66" y="996" font-size="14.5" fill="#345963">這一種算得出它是風險因子（校正後勝算比 15.02，95% 信賴區間 2.34 到</text>
<text x="66" y="1017" font-size="14.5" fill="#345963">96.57）。作者的結論句是「Apparent risk factors for lymphedema</text>
<text x="66" y="1038" font-size="14.5" fill="#345963">differed considerably depending on the method used」——看起來的風險</text>
<text x="66" y="1059" font-size="14.5" fill="#345963">因子，會因為判定方法不同而差很多；他們主張這個領域需要一個公認的判</text>
<text x="66" y="1080" font-size="14.5" fill="#345963">定標準。</text>
<rect x="66" y="1115" width="488" height="76" rx="14" fill="#F6E2E0"/>
<text x="82" y="1135" font-size="15.5" fill="#B04A4A" font-weight="700">勝算比不是機率的倍數。事件常見的時候，勝算比會比真正的風險</text>
<text x="82" y="1158" font-size="15.5" fill="#B04A4A" font-weight="700">倍數看起來大得多——14.42 不等於「機率高 14 倍」。</text>
