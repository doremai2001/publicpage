<text x="78" y="1032.9" font-size="12.5" fill="#123641" font-weight="800">化放療 50.4 Gy</text>
<text x="78" y="1051.78" font-size="12" fill="#345963">1.8 Gy ×28＋cisplatin/5-FU；日本自 60 Gy 改回 50.4 以減少副作用與救援手術風險</text>
<line x1="310" y1="1068.95" x2="310" y2="1084.95" stroke="#00806B" stroke-width="2" stroke-linecap="round"/>
