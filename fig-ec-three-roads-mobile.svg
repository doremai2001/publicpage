<svg xmlns="http://www.w3.org/2000/svg" width="620" height="2541" viewBox="0 0 620 2541" role="img" aria-labelledby="t d">
  <title id="t">化放療之後的三條路：三合一、根治性化放療加救援、主動監測</title>
  <desc id="d">示意圖：化放療之後的三條路時間軸。第一條，三合一（CROSS，荷蘭 n=366，腺癌 75%、鱗癌 23%）：化放療 5 週（41.4 Gy 分 23 次加 carboplatin/paclitaxel 每週 5 次）→化放療結束後 6 到 8 週手術（院內死亡兩組皆 4%，R0 92% 對 69%）→病理 pCR 29%（鱗癌 49%、腺癌 23%）→中位追蹤 147 個月：10 年整體存活 38% 對單純手術 25%，HR 0.70；鱗癌次族群中位存活 81.6 對 21.1 個月（HR 0.48）；NEOCRTEC5010（鱗癌 n=451）5 年 59.9% 對 49.1%；兩個試驗都沒有不開刀那一臂。第二條，根治性化放療加救援（JCOG0909，日本 cStage II/III 鱗癌 n=94，單臂）：50.4 Gy（1.8 Gy 乘 28）加 cisplatin/5-FU→完全反應 59%→殘存或復發者救援 ESD 5%、救援手術 27%（R0 76%、G3 到 4 早期併發症 20%、1 例手術死亡）→5 年整體存活 64.5%、5 年食道保留 54.9%、3 年整體存活 74.2%。第三條，主動監測，標示「試驗中」（SANO，荷蘭 12 院，n=309 cCR，腺癌約四分之三、鱗癌約兩成，中位追蹤 38 個月）：化放療→4 到 6 週 bite-on-bite 切片→12 週 PET-CT 加切片加 EUS-FNA，cCR 37%（274/750）→監測，局部再生長 48% 轉延後手術、遠端轉移 17%→54 個月只有 25% 維持 cCR；2 年整體存活 74% 對 71% 非劣性成立（邊界 15%），中位 43 對 53 個月（HR 1.14 無統計差異），遠端轉移方向偏向手術組。下方三條警語：preSANO 一般切片漏 31%、bite-on-bite 加 FNA 仍漏 10%，鱗癌 preSINO 陰性預測值 68.7%，SANO 手術組 cCR 者 pT0 只有 35.6%；NEEDS（鱗癌，約 1,020 人）收案中、主要完成估 2026 年 12 月，ESOSTRATE 終止（188 人）；反向：Cochrane 加手術整體存活 HR 0.99、治療死亡 RR 5.11，計畫性食道切除 90 天死亡 4.5%、救援 9.5%。三條路族群不同，數字只能在各自那一列讀。</desc>
