<text x="78" y="688.45" font-size="12.5" fill="#123641" font-weight="800">長期追蹤</text>
<text x="78" y="707.32" font-size="12" fill="#345963">中位追蹤 147 個月（Eyck 2021）</text>
<rect x="62" y="737.5" width="496" height="100.25" rx="12" fill="#E3E8F6" stroke="#5C77C4" stroke-width="2"/>
