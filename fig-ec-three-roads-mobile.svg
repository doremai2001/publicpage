<text x="44" y="62" font-size="14" fill="#A98722" font-weight="800" letter-spacing="3.5px">THREE ROADS AFTER CHEMORADIOTHERAPY</text>
<text x="44" y="112" font-size="30" fill="#123641" font-weight="800" class="r">化放療之後的三條路：三合一、根治性</text>
<text x="44" y="152" font-size="30" fill="#123641" font-weight="800" class="r">化放療加救援、主動監測</text>
<text x="44" y="194" font-size="14.5" fill="#527078">三條路各有自己的試驗、族群與追蹤年限，數字不能橫著比。第三條路目前只在試</text>
<text x="44" y="216" font-size="14.5" fill="#527078">驗設計裡成立。</text>
<text x="44" y="238" font-size="14.5" fill="#527078">院內在鱗癌化放療後仍建議開刀的理由，寫在第三條路的下方。</text>
<g filter="url(#sh)"><rect x="44" y="272" width="532" height="583.75" rx="18" fill="#FFFFFF"/></g>
<rect x="62" y="290" width="254.2" height="30" rx="15" fill="#5C77C4"/>
<text x="189.1" y="310.04" font-size="14" fill="#FFFFFF" font-weight="800" text-anchor="middle">第一條｜三合一：先化放療再開刀</text>
<text x="62" y="348.02" font-size="16.5" fill="#123641" font-weight="800">這是院內建議、也是 CROSS／NEOCRTEC5010 證明「比只開刀</text>
<text x="62" y="370.3" font-size="16.5" fill="#123641" font-weight="800">好」的那條路</text>
<text x="62" y="393.18" font-size="12.5" fill="#6B8084">CROSS：荷蘭，n=366，腺癌 75%／鱗癌 23%，cT1N1／T2–3N0–1；兩個試驗都沒有</text>
<text x="62" y="411.3" font-size="12.5" fill="#6B8084">「不開刀」那一臂。</text>
<rect x="62" y="432.8" width="496" height="55.67" rx="10" fill="#E3E8F6"/>
