<text x="78" y="1884.55" font-size="12" fill="#345963">6、9、12、16、20、24、30、36、48、60 個月重複評估；局部再生長 48%→延後手</text>
<text x="78" y="1901.35" font-size="12" fill="#345963">術；遠端轉移 17%</text>
