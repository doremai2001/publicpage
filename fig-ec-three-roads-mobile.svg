<text x="174.82" y="909.79" font-size="14" fill="#FFFFFF" font-weight="800" text-anchor="middle">第二條｜根治性化放療＋救援</text>
<text x="62" y="947.77" font-size="16.5" fill="#123641" font-weight="800">不開刀不是放棄：有前瞻試驗把「救援」寫進療程</text>
<text x="62" y="970.65" font-size="12.5" fill="#6B8084">JCOG0909：日本，cStage II/III 鱗癌，n=94，單臂確認性試驗、無對照組；ESMO</text>
<text x="62" y="988.77" font-size="12.5" fill="#6B8084">2025：不願或不適合手術者、頸段——首選。</text>
<rect x="62" y="1010.27" width="496" height="55.67" rx="10" fill="#D8EDE7"/>
