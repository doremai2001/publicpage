<text x="78" y="533.1" font-size="12.5" fill="#123641" font-weight="800">手術</text>
<text x="78" y="551.98" font-size="12" fill="#345963">化放療結束後 6–8 週；院內死亡兩組皆 4%；R0 92% 對 69%</text>
