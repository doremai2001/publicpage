<text x="76" y="798.12" font-size="12.5" fill="#345963">對單純手術 25%，HR 0.70；鱗癌次族群中位 OS 81.6 對 21.1 個月（HR 0.48）。</text>
<text x="76" y="816.25" font-size="12.5" fill="#345963">NEOCRTEC5010（鱗癌 n=451）：5 年 OS 59.9% 對 49.1%。</text>
