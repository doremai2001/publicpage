<text x="76" y="1350.17" font-size="24" fill="#00806B" font-weight="800">5 年 OS 64.5%</text>
<text x="76" y="1375.6" font-size="12.5" fill="#345963">5 年食道保留率 54.9%（95% CI 44.3–64.4）；3 年 OS 74.2%。單臂，無法與第一</text>
<text x="76" y="1393.72" font-size="12.5" fill="#345963">條路直接比。</text>
