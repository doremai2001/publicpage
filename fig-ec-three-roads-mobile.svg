<text x="171.04" y="1487.26" font-size="14" fill="#9A9282" font-weight="800" text-anchor="middle">第三條｜主動監測——試驗中</text>
<text x="62" y="1525.25" font-size="16.5" fill="#123641" font-weight="800">SANO 讀出「兩年非劣」，但族群是荷蘭腺癌、追蹤三年多、遠端</text>
<text x="62" y="1547.53" font-size="16.5" fill="#123641" font-weight="800">轉移方向不利、長期結果未出</text>
<text x="62" y="1570.4" font-size="12.5" fill="#6B8084">SANO：荷蘭 12 院，階梯楔形群集隨機，n=309 位 cCR（監測 198／手術 111），腺癌約</text>
<text x="62" y="1588.52" font-size="12.5" fill="#6B8084">四分之三、鱗癌約兩成，中位追蹤 38 個月。沒有任何指引把它列為標準選項。</text>
