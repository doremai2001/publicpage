<text x="78" y="1960.15" font-size="12.5" fill="#123641" font-weight="800">長期？</text>
<text x="78" y="1979.02" font-size="12" fill="#345963">54 個月時只有 25% 維持 cCR；作者自承長期可能反映在 OS</text>
<rect x="62" y="2009.2" width="496" height="100.25" rx="12" fill="#ECE8DE" stroke="#9A9282" stroke-width="2" stroke-dasharray="6 5"/>
<text x="76" y="2044.4" font-size="24" fill="#345963" font-weight="800">2 年 OS 74% 對 71%</text>
<text x="76" y="2069.82" font-size="12.5" fill="#345963">非劣性成立（邊界 15%）；中位 OS 43 對 53 個月（HR 1.14，無統計差異）；遠端</text>
<text x="76" y="2087.95" font-size="12.5" fill="#345963">轉移方向偏向手術組。6 個月時吞嚥困難等生活品質較好。</text>
<circle cx="67" cy="2131.7" r="3.5" fill="#B04A4A"/>
<text x="80" y="2136.07" font-size="12.5" fill="#345963">「看不到」不等於沒有：preSANO 一般切片漏掉 31% 的 TRG3–4 殘存，</text>
<text x="80" y="2154.2" font-size="12.5" fill="#345963">bite-on-bite＋FNA 仍漏 10%；鱗癌 preSINO 陰性預測值 68.7%；SANO 手術組</text>
<text x="80" y="2172.32" font-size="12.5" fill="#345963">被判 cCR 的 101 人開刀後 pT0 只有 36 人（35.6%，批評方引附錄）。</text>
<circle cx="67" cy="2192.07" r="3.5" fill="#B04A4A"/>
<text x="80" y="2196.45" font-size="12.5" fill="#345963">還在驗證：NEEDS（限鱗癌，估 1,020 人）收案中，主要完成估 2026 年 12 月；</text>
<text x="80" y="2214.57" font-size="12.5" fill="#345963">ESOSTRATE（法國）因收案不足終止（188 人）；SANO-2 在查試驗外環境能否複</text>
<text x="80" y="2232.7" font-size="12.5" fill="#345963">製。</text>
<circle cx="67" cy="2252.45" r="3.5" fill="#B04A4A"/>
<text x="80" y="2256.82" font-size="12.5" fill="#345963">反向也要記得：對化放療有反應的鱗癌，加手術不增加整體存活（Cochrane HR</text>
<text x="80" y="2274.95" font-size="12.5" fill="#345963">0.99）但治療死亡風險 RR 5.11；計畫性食道切除 90 天死亡 4.5%（Esodata）、救</text>
<text x="80" y="2293.07" font-size="12.5" fill="#345963">援手術 9.5%（Markar 2014）。</text>
<text x="44" y="2349.07" font-size="12.5" fill="#6B8084" font-weight="600">三條路的族群不同：第一條 75% 腺癌、第二條全鱗癌、第三條四分之三腺癌；期別、年代、追蹤</text>
<text x="44" y="2367.2" font-size="12.5" fill="#6B8084" font-weight="600">年限也不同——同一列的數字只能在該列裡讀。</text>
<text x="44" y="2407.32" font-size="12" fill="#6B8084">示意圖，依 CROSS（van Hagen 2012、Shapiro 2015、Eyck 2021）、NEOCRTEC5010（Yang</text>
<text x="44" y="2425.32" font-size="12" fill="#6B8084">2021）、JCOG0909（Takeuchi 2021；JES 2022 引最終分析）、SANO（Noordman 2018 設計、</text>
<text x="44" y="2443.32" font-size="12" fill="#6B8084">van der Wilk 2025、Gangaram Panday 2026、Housman 2025 評論）、preSANO（Noordman</text>
<text x="44" y="2461.32" font-size="12" fill="#6B8084">2018）、preSINO（Yang 2025）、Cochrane 2017、Esodata（Kuppusamy 2022）、Markar</text>
<text x="44" y="2479.32" font-size="12" fill="#6B8084">2014 與 ClinicalTrials.gov NEEDS／ESOSTRATE 登錄重繪｜各試驗族群、設計與終點不同，數字</text>
<text x="44" y="2497.32" font-size="12" fill="#6B8084">不可直接互比</text>
