<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1150" viewBox="0 0 720 1150" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Two good things need not add up</title>
  <desc id="d">A single experiment, at the cellular level. It shows a direction; it supports no clinical dose or outcome conclusion. Low LET: an interactive (synergistic) thermal enhancement appears Above roughly 70 keV/µm: additive only, no longer synergistic Across all LET levels: only additive enhancement was seen</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#123641" opacity=".14"/><line x1="0" y1="0" x2="0" y2="8" stroke="#123641" stroke-width="2.4" opacity=".85"/></pattern><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0B2832" flood-opacity=".12"/></filter><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="720" height="1150" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="56" y="78" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">A HONEST CAVEAT</text>
<text x="56" y="140" font-size="30" fill="#123641" font-weight="800" class="r">Two good things need not add up</text>
<text x="56" y="182" font-size="18" fill="#527078">One cell experiment compared thermal enhancement across levels of linear energy transfer (LET).</text>
<text x="56" y="209" font-size="18" fill="#527078">It is the least favourable datum in this topic for proton-plus-hyperthermia, so it sits in the middle.</text>
<line x1="56" y1="302" x2="664" y2="302" stroke="#123641" stroke-width="3" stroke-linecap="round"/>
<path d="M 666 302 l -10 -7 l 0 14 Z" fill="#123641"/>
<text x="56" y="332" font-size="16" fill="#6B8084" font-weight="700">Low LET</text>
<text x="664" y="332" font-size="16" fill="#6B8084" font-weight="700" text-anchor="end">High LET</text>
<text x="56" y="286" font-size="15" fill="#6B8084">Linear energy transfer of the radiation (LET) →</text>
<rect x="56" y="360" width="334.48" height="116" rx="16" fill="#A98722" opacity=".20" stroke="#A98722" stroke-width="2" />
<rect x="402.48" y="360" width="261.52" height="116" rx="16" fill="#123641" opacity=".08" stroke="#123641" stroke-width="1.6" />
<text x="76" y="394" font-size="17" fill="#123641" font-weight="800" class="r">Cells with functional p53</text>
<text x="76" y="426" font-size="14" fill="#345963" font-weight="700">Low LET: an interactive</text>
<text x="76" y="448" font-size="14" fill="#345963" font-weight="700">(synergistic) thermal</text>
<text x="422.48" y="404" font-size="14" fill="#527078" font-weight="700">Above roughly 70</text>
<text x="422.48" y="428" font-size="14" fill="#527078" font-weight="700">keV/µm: additive</text>
<text x="422.48" y="452" font-size="14" fill="#527078" font-weight="700">only, no longer</text>
<text x="422.48" y="476" font-size="14" fill="#527078" font-weight="700">synergistic</text>
<line x1="396.48" y1="350" x2="396.48" y2="554" stroke="#123641" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 8" opacity=".5"/>
<rect x="56" y="494" width="608" height="76" rx="16" fill="#9A9282" opacity=".14" stroke="#9A9282" stroke-width="1.6" />
<text x="76" y="526" font-size="17" fill="#123641" font-weight="800" class="r">Cells with mutated p53</text>
<text x="76" y="554" font-size="14" fill="#527078" font-weight="700">Across all LET levels: only additive enhancement was seen</text>
<rect x="56" y="592" width="608" height="172" rx="18" fill="#FFFFFF" opacity=".78" />
<rect x="56" y="592" width="5" height="172" rx="3" fill="#00806B" />
<text x="78" y="628" font-size="18" fill="#123641" font-weight="800" class="r">What about protons</text>
<text x="78" y="658" font-size="15" fill="#527078">Protons are low-LET along</text>
<text x="78" y="684" font-size="15" fill="#527078">most of their track; LET</text>
<text x="78" y="710" font-size="15" fill="#527078">rises only at the end of</text>
<text x="78" y="736" font-size="15" fill="#527078">range.</text>
<text x="78" y="762" font-size="15" fill="#527078">So the concern applies</text>
<text x="78" y="788" font-size="15" fill="#527078">differently than for carbon</text>
<text x="78" y="814" font-size="15" fill="#527078">ions — and nobody has</text>
<text x="78" y="840" font-size="15" fill="#527078">measured how differently.</text>
<rect x="56" y="784" width="608" height="2" rx="1" fill="#A98722" opacity=".55" />
<text x="56" y="818" font-size="17" fill="#123641" font-weight="800" class="r">A single experiment, at</text>
<text x="56" y="848" font-size="17" fill="#123641" font-weight="800" class="r">the cellular level. It</text>
<text x="56" y="878" font-size="17" fill="#123641" font-weight="800" class="r">shows a direction; it</text>
<text x="56" y="908" font-size="17" fill="#123641" font-weight="800" class="r">supports no clinical dose</text>
<text x="56" y="938" font-size="17" fill="#123641" font-weight="800" class="r">or outcome conclusion.</text>
<text x="56" y="1114" font-size="14" fill="#6B8084">Schematic from the cell experiment of Takaha</text>
<text x="56" y="1134" font-size="14" fill="#6B8084">shi et al. 2001; no curve is drawn, because the </text>
  </g>
</svg>
