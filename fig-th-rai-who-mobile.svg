  <rect width="620" height="5276" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="40" y="66" font-size="16" fill="#A98722" font-weight="800" letter-spacing="3px">FOUR TRIALS, TWO DIFFERENT QUESTIONS</text>
<text x="40" y="120" font-size="38" fill="#123641" font-weight="800" class="r">四個試驗，兩個問題：一邊</text>
<text x="40" y="167.88" font-size="38" fill="#123641" font-weight="800" class="r">問要不要，一邊問做多少</text>
<text x="40" y="227.76" font-size="19" fill="#527078">常有人把四個試驗串成一串，說它們都證明放射碘可以少做。其</text>
<text x="40" y="256.26" font-size="19" fill="#527078">實不是。四個試驗回答的是兩個不同的問題，所以這張圖把它們</text>
<text x="40" y="284.76" font-size="19" fill="#527078">畫成兩塊，中間隔一條虛線，沒有箭頭。</text>
<text x="40" y="319.26" font-size="19" fill="#527078">上面那一塊的兩個試驗，隨機分派的是「做」與「不做」。下面</text>
<text x="40" y="347.76" font-size="19" fill="#527078">那一塊的兩個試驗裡，每一個人都做了放射碘。</text>
<rect x="40" y="404.26" width="540" height="150.6" rx="18" fill="#D8EDE7" stroke="#00806B" stroke-width="2.5"/>
<text x="60" y="446.26" font-size="22" fill="#123641" font-weight="800" class="r">問題一：要不要做放射碘</text>
<text x="60" y="492.86" font-size="14" fill="#345963">ESTIMABL2 與 IoN。兩個都是非劣性設計，而且事先講定的那個幅度都是五個</text>
<text x="60" y="513.86" font-size="14" fill="#345963">百分點。非劣性試驗不能證明無效，它能說的是「不比較差」。</text>
<g filter="url(#sh)">
<rect x="40" y="570.86" width="540" height="677.75" rx="18" fill="#FFFFFF" stroke="#DBD3BF" stroke-width="2"/>
</g>
<text x="62" y="610.86" font-size="18" fill="#00806B" font-weight="800">ESTIMABL2（法國）</text>
<text x="62" y="651.48" font-size="12.5" fill="#527078" font-weight="700">隨機分派：做放射碘，或不做</text>
<text x="62" y="692.23" font-size="14" fill="#345963">776 人，全做完全甲狀腺切除</text>
<text x="62" y="739.23" font-size="14" fill="#527078" font-weight="700">三年無事件比率</text>
<text x="62" y="777.53" font-size="18" fill="#00806B" font-weight="800">不做 95.6% ／ 做 95.9%</text>
<text x="62" y="823.83" font-size="14" fill="#527078" font-weight="700">五年（698 人可評估）</text>
<text x="62" y="862.13" font-size="18" fill="#00806B" font-weight="800">不做 93.2% ／ 做 94.8%</text>
<text x="62" y="910.43" font-size="14" fill="#345963">兩個時間點都在非劣性界限之內。這裡的「事件」是複合指標，含影像或超音波</text>
<text x="62" y="931.43" font-size="14" fill="#345963">異常、甲狀腺球蛋白或抗體升高——不是復發，更不是存活。</text>
<rect x="62" y="966.43" width="496" height="260.18" rx="14" fill="#F6E2E0" stroke="#B04A4A" stroke-width="2.5"/>
<text x="80" y="998.43" font-size="14" fill="#B04A4A" font-weight="800">它排除了誰：這一格必須跟結論寫在同一句裡</text>
<circle cx="84.5" cy="1033.41" r="4" fill="#B04A4A"/>
<text x="99" y="1038.73" font-size="14" fill="#345963">單顆、一公分以下的乳突微小癌被直接排除。試驗自己寫的理由是：這</text>
<text x="99" y="1059.45" font-size="14" fill="#345963">些人本來就不必做。</text>
<circle cx="84.5" cy="1081.85" r="4" fill="#B04A4A"/>
<text x="99" y="1087.17" font-size="14" fill="#345963">所有淋巴結陽性被排除。</text>
<circle cx="84.5" cy="1109.57" r="4" fill="#B04A4A"/>
<text x="99" y="1114.89" font-size="14" fill="#345963">pT2 以上被排除。</text>
<text x="80" y="1145.61" font-size="14" fill="#B04A4A" font-weight="700">收進去的是多發但總和一到二公分、或單顆一到二公分，淋巴結陰性或未</text>
<text x="80" y="1166.61" font-size="14" fill="#B04A4A" font-weight="700">評估的人。所以它證明的那個「低風險」，不是讀者手上報告的那個低風</text>
<text x="80" y="1187.61" font-size="14" fill="#B04A4A" font-weight="700">險。</text>
<g filter="url(#sh)">
<rect x="40" y="1264.61" width="540" height="804.07" rx="18" fill="#FFFFFF" stroke="#DBD3BF" stroke-width="2"/>
</g>
<text x="62" y="1304.61" font-size="18" fill="#5C77C4" font-weight="800">IoN（英國）</text>
<text x="62" y="1345.23" font-size="12.5" fill="#527078" font-weight="700">隨機分派：做放射碘，或不做</text>
<text x="62" y="1385.98" font-size="14" fill="#345963">33 個中心、504 人，中位追蹤 6.8 與 6.6 年</text>
<text x="62" y="1432.98" font-size="14" fill="#527078" font-weight="700">五年無復發率（粗比率）</text>
<text x="62" y="1471.28" font-size="18" fill="#5C77C4" font-weight="800">不做 97.9%（96.1 到 99.7）／ 做 96.3%（93.9 到 98.7）</text>
<text x="62" y="1517.58" font-size="14" fill="#527078" font-weight="700">試驗另外估的五年絕對風險差</text>
<text x="62" y="1555.88" font-size="18" fill="#5C77C4" font-weight="800">0.5 個百分點（95% 信賴區間 −2.2 到 3.2）</text>
<text x="62" y="1604.18" font-size="14" fill="#345963">試驗自己報出來的那個數字，不是把上面兩個比率相減。那 0.5 是另外估出來的</text>
<text x="62" y="1625.18" font-size="14" fill="#345963">量，方向是「不做消融多出來的風險」，非劣性成立是因為區間的上界 3.2 落在</text>
<text x="62" y="1646.18" font-size="14" fill="#345963">事先訂好的 5 個百分點界限以內；兩個比率相減是 1.6 個百分點，方向還相反。</text>
<text x="62" y="1667.18" font-size="14" fill="#345963">至於那個 0.5 是怎麼估出來的，論文的方法段這次沒有取得，所以講不了。同樣</text>
<text x="62" y="1688.18" font-size="14" fill="#345963">達到非劣性。它的終點和 ESTIMABL2 不一樣：局部復發或殘存的結構性疾病、</text>
<text x="62" y="1709.18" font-size="14" fill="#345963">遠端轉移、死於甲狀腺癌合起來算，全程只有 17 次復發。論文自己寫它還在追</text>
<text x="62" y="1730.18" font-size="14" fill="#345963">蹤中；作者的結論比納入條件窄——是 pT1、pT2、淋巴結陰性或未評估、無不</text>
<text x="62" y="1751.18" font-size="14" fill="#345963">良特徵者可以不做。</text>
<text x="62" y="1800.18" font-size="14" fill="#527078" font-weight="700">試驗裡風險高的人，風險是真的高</text>
<text x="62" y="1840.48" font-size="14" fill="#345963">pT3（46 人）</text>
<text x="558" y="1840.48" font-size="14" fill="#5C77C4" font-weight="800" text-anchor="end">4 人復發，9%</text>
<text x="62" y="1879.78" font-size="14" fill="#345963">pT1 或 pT2（458 人）</text>
<text x="558" y="1879.78" font-size="14" fill="#5C77C4" font-weight="800" text-anchor="end">13 人，3%</text>
<text x="62" y="1919.08" font-size="14" fill="#345963">中央區淋巴結陽性（47 人）</text>
<text x="558" y="1919.08" font-size="14" fill="#5C77C4" font-weight="800" text-anchor="end">6 人復發，13%</text>
<text x="62" y="1958.38" font-size="14" fill="#345963">陰性或未評估（457 人）</text>
<text x="558" y="1958.38" font-size="14" fill="#5C77C4" font-weight="800" text-anchor="end">11 人，2%</text>
<text x="62" y="2004.68" font-size="14" fill="#5C77C4" font-weight="700">論文接著那一句是：這些比率在沒做放射碘的人身上是相似的。全試驗只有 17</text>
<text x="62" y="2025.68" font-size="14" fill="#5C77C4" font-weight="700">個事件，次群組看不出差別不等於沒差別。這是「看不出來」，不是「證明沒有」。</text>
<line x1="40" y1="2098.68" x2="580" y2="2098.68" stroke="#B9AE94" stroke-width="2" stroke-linecap="butt" stroke-dasharray="2 7"/>
<rect x="230.25" y="2086.68" width="159.5" height="24" rx="12" fill="#F7F1E4"/>
<text x="310" y="2103.18" font-size="12.5" fill="#527078" font-weight="700" text-anchor="middle">兩個問題之間：沒有箭頭</text>
<rect x="40" y="2134.68" width="540" height="150.6" rx="18" fill="#F3E8CD" stroke="#96790F" stroke-width="2.5"/>
<text x="60" y="2176.68" font-size="22" fill="#123641" font-weight="800" class="r">問題二：要做多少</text>
<text x="60" y="2223.28" font-size="14" fill="#345963">HiLo 與 ESTIMABL1。這兩個試驗裡每一個人都做了放射碘，隨機分派的是活</text>
<text x="60" y="2244.28" font-size="14" fill="#345963">度高低與準備方式。它們對「要不要做」一個字都沒有回答。</text>
<g filter="url(#sh)">
<rect x="40" y="2301.28" width="540" height="535.17" rx="18" fill="#FFFFFF" stroke="#DBD3BF" stroke-width="2"/>
</g>
<text x="62" y="2341.28" font-size="18" fill="#96790F" font-weight="800">HiLo（英國）</text>
<text x="62" y="2381.9" font-size="12.5" fill="#527078" font-weight="700">隨機分派：活度高低與準備方式</text>
<text x="62" y="2422.65" font-size="14" fill="#345963">每一個人都做了放射碘。低活度 1.1 與較高活度 3.7 GBq——這是這兩個試驗的</text>
<text x="62" y="2443.65" font-size="14" fill="#345963">識別特徵，不是誰的處方。</text>
<text x="62" y="2490.65" font-size="14" fill="#527078" font-weight="700">主要終點：治療後六到九個月殘餘組織清乾淨</text>
<text x="62" y="2528.95" font-size="18" fill="#96790F" font-weight="800">低活度 85.0% ／ 高活度 88.9%</text>
<text x="62" y="2575.25" font-size="14" fill="#527078" font-weight="700">追到中位 6.5 年，七年累積復發率</text>
<text x="62" y="2613.55" font-size="18" fill="#96790F" font-weight="800">5.9% 對 7.3%</text>
<text x="62" y="2659.85" font-size="14" fill="#527078" font-weight="700">風險比</text>
<text x="62" y="2698.15" font-size="18" fill="#96790F" font-weight="800">1.10（95% 信賴區間 0.47 到 2.59）</text>
<text x="62" y="2746.45" font-size="14" fill="#345963">主要終點是替代指標：殘餘組織有沒有清乾淨，不是復發，也不是存活。</text>
<text x="62" y="2793.45" font-size="14" fill="#96790F" font-weight="700">至於你這一次用多少，依你醫院核子醫學科的規定。</text>
<g filter="url(#sh)">
<rect x="40" y="2852.45" width="540" height="365.97" rx="18" fill="#FFFFFF" stroke="#DBD3BF" stroke-width="2"/>
</g>
<text x="62" y="2892.45" font-size="18" fill="#96790F" font-weight="800">ESTIMABL1（法國）</text>
<text x="62" y="2933.07" font-size="12.5" fill="#527078" font-weight="700">隨機分派：活度高低與準備方式</text>
<text x="62" y="2973.82" font-size="14" fill="#345963">同樣是每一個人都做了放射碘，隨機分派的是低活度 1.1 與較高活度 3.7 GBq，</text>
<text x="62" y="2994.82" font-size="14" fill="#345963">以及準備方式。</text>
<text x="62" y="3041.82" font-size="14" fill="#527078" font-weight="700">主要終點</text>
<text x="62" y="3080.12" font-size="18" fill="#96790F" font-weight="800">同樣是治療後六到九個月殘餘組織有沒有清乾淨</text>
<text x="62" y="3128.42" font-size="14" fill="#345963">所以這一塊的兩個試驗，問的是「已經決定要做之後，做多少」。</text>
<text x="62" y="3175.42" font-size="14" fill="#96790F" font-weight="700">把它們拿去回答「要不要做」，是把兩個問題混在一起。</text>
<text x="40" y="3280.42" font-size="22" fill="#123641" font-weight="800" class="r">同一份指引裡，建議強度的排列是反直覺的</text>
<text x="40" y="3305.9" font-size="14" fill="#527078">2025 年版把復發風險分成四格，每格掛上機率：低（不到 10%）、低—中間（10 到</text>
<text x="40" y="3326.9" font-size="14" fill="#527078">15%）、中間—高（16 到 30%）、高（超過 30%）。這四個百分比講的是結構性或生化</text>
<text x="40" y="3347.9" font-size="14" fill="#527078">性復發的機率，不是死亡率，也不是期別。</text>
<rect x="40" y="3366.9" width="540" height="149.42" rx="18" fill="#FFFFFF" stroke="#00806B" stroke-width="3"/>
<text x="58" y="3398.9" font-size="14" fill="#527078" font-weight="700">低（不到 10%）</text>
<text x="58" y="3441.2" font-size="18" fill="#00806B" font-weight="800">不常規做</text>
<rect x="58" y="3473.32" width="76" height="25" rx="12.5" fill="#00806B"/>
<text x="69" y="3490.82" font-size="13.5" fill="#FFFFFF" font-weight="800">強烈建議</text>
<rect x="142" y="3473.32" width="76" height="25" rx="12.5" fill="#FFFFFF" stroke="#00806B" stroke-width="1.6"/>
<text x="153" y="3490.82" font-size="13.5" fill="#00806B" font-weight="800">高確定性</text>
<rect x="40" y="3528.32" width="540" height="149.42" rx="18" fill="#FFFFFF" stroke="#DBD3BF" stroke-width="2"/>
<text x="58" y="3560.32" font-size="14" fill="#527078" font-weight="700">低—中間（10 到 15%）與中間—高（16 到 30%）</text>
<text x="58" y="3602.62" font-size="18" fill="#96790F" font-weight="800">可以考慮</text>
<rect x="58" y="3634.74" width="89.5" height="25" rx="12.5" fill="#96790F"/>
<text x="69" y="3652.24" font-size="13.5" fill="#FFFFFF" font-weight="800">有條件建議</text>
<rect x="155.5" y="3634.74" width="76" height="25" rx="12.5" fill="#FFFFFF" stroke="#96790F" stroke-width="1.6"/>
<text x="166.5" y="3652.24" font-size="13.5" fill="#96790F" font-weight="800">低確定性</text>
<rect x="40" y="3689.74" width="540" height="149.42" rx="18" fill="#FFFFFF" stroke="#DBD3BF" stroke-width="2"/>
<text x="58" y="3721.74" font-size="14" fill="#527078" font-weight="700">高（超過 30%）</text>
<text x="58" y="3764.04" font-size="18" fill="#B04A4A" font-weight="800">常規做</text>
<rect x="58" y="3796.16" width="76" height="25" rx="12.5" fill="#B04A4A"/>
<text x="69" y="3813.66" font-size="13.5" fill="#FFFFFF" font-weight="800">強烈建議</text>
<rect x="142" y="3796.16" width="89.5" height="25" rx="12.5" fill="#FFFFFF" stroke="#B04A4A" stroke-width="1.6"/>
<text x="153" y="3813.66" font-size="13.5" fill="#B04A4A" font-weight="800">中等確定性</text>
<rect x="40" y="3851.16" width="540" height="149.42" rx="18" fill="#FFFFFF" stroke="#DBD3BF" stroke-width="2"/>
<text x="58" y="3883.16" font-size="14" fill="#527078" font-weight="700">一開始就有遠端轉移</text>
<text x="58" y="3925.46" font-size="18" fill="#B04A4A" font-weight="800">要做</text>
<rect x="58" y="3957.58" width="76" height="25" rx="12.5" fill="#B04A4A"/>
<text x="69" y="3975.08" font-size="13.5" fill="#FFFFFF" font-weight="800">強烈建議</text>
<rect x="142" y="3957.58" width="89.5" height="25" rx="12.5" fill="#FFFFFF" stroke="#B04A4A" stroke-width="1.6"/>
<text x="153" y="3975.08" font-size="13.5" fill="#B04A4A" font-weight="800">中等確定性</text>
<rect x="40" y="4016.58" width="540" height="215.72" rx="14" fill="#F3E8CD" stroke="#C9A83E" stroke-width="2.5"/>
<text x="62" y="4054.08" font-size="15.5" fill="#8F7418" font-weight="800">排出來就清楚了：證據最硬的一句，是「不要常規做」</text>
<text x="62" y="4094.06" font-size="15.5" fill="#345963">指引自己解釋中間那格為什麼講不硬：單獨針對中間那兩格的研究太少。</text>
<text x="62" y="4117.31" font-size="15.5" fill="#345963">一份系統性回顧攤得更白，不過它數的是另一批人——舊的三級分層裡被</text>
<text x="62" y="4140.56" font-size="15.5" fill="#345963">歸為中風險的那一格：11 篇觀察性研究看到好處，13 篇沒有，作者自</text>
<text x="62" y="4163.81" font-size="15.5" fill="#345963">己還補了一句，其中族群分層做得乾淨的只有少數幾篇。界線後來重畫過，</text>
<text x="62" y="4187.06" font-size="15.5" fill="#345963">那個中間不等於今天的中間兩格；但分歧的形狀沒有變。</text>
<rect x="40" y="4248.31" width="540" height="256.3" rx="14" fill="#ECE8DE"/>
<text x="62" y="4284.31" font-size="14" fill="#123641" font-weight="800">歐洲那份共識：同一個方向，但每一條都沒有標強度</text>
<text x="62" y="4320.61" font-size="14" fill="#345963">歐洲甲狀腺學會 2022 年的共識同樣把高風險與已知結構性病灶列為適應症；該</text>
<text x="62" y="4341.61" font-size="14" fill="#345963">共識每一條建議都沒有標註強度與等級。</text>
<text x="62" y="4380.61" font-size="14" fill="#345963">它指出低風險難證明的原因：這些人死於甲狀腺癌的機率不到 1%、殘存或復發</text>
<text x="62" y="4401.61" font-size="14" fill="#345963">只有 2% 到 3%，回溯性研究很難在這種底數上看出好處。</text>
<text x="62" y="4440.61" font-size="14" fill="#345963">它還有一句專給微小癌：一公分以下、沒有其他高風險特徵的乳突微小癌不該做。</text>
<text x="62" y="4461.61" font-size="14" fill="#345963">這句只適用一公分以下，不能往上套到一到四公分。</text>
<rect x="40" y="4528.61" width="540" height="575.85" rx="16" fill="#F6E2E0" stroke="#B04A4A" stroke-width="2.5"/>
<text x="66" y="4574.61" font-size="18" fill="#B04A4A" font-weight="800">這張圖不會把四個試驗串成一串</text>
<text x="66" y="4606.21" font-size="15.5" fill="#345963">上下兩塊回答的是兩個不同的問題。ESTIMABL2 與 IoN 問「要不要</text>
<text x="66" y="4629.46" font-size="15.5" fill="#345963">做」；HiLo 與 ESTIMABL1 問「做多少」，而且那兩個試驗裡每一</text>
<text x="66" y="4652.71" font-size="15.5" fill="#345963">個人都做了放射碘。把四個串成「這四個都證明放射碘可以少做」是錯</text>
<text x="66" y="4675.96" font-size="15.5" fill="#345963">的。</text>
<text x="66" y="4709.21" font-size="15.5" fill="#345963">1.1 與 3.7 GBq 在這張圖上只是那兩個試驗的識別特徵，不是任何人的</text>
<text x="66" y="4732.46" font-size="15.5" fill="#345963">處方。你這一次用多少、怎麼準備、要不要住進去，依你醫院核子醫學</text>
<text x="66" y="4755.71" font-size="15.5" fill="#345963">科的規定。</text>
<text x="66" y="4788.96" font-size="15.5" fill="#345963">ESTIMABL2 的「低風險」永遠帶著它的排除條件：單顆一公分以下</text>
<text x="66" y="4812.21" font-size="15.5" fill="#345963">的微小癌、所有淋巴結陽性、pT2 以上都不在裡面。你報告上的「低風</text>
<text x="66" y="4835.46" font-size="15.5" fill="#345963">險」如果不是這一格，那個結論就不是為你做的。</text>
<text x="66" y="4868.71" font-size="15.5" fill="#345963">存活這一題，沒有任何一個隨機試驗是以總存活當主要終點做的（IoN</text>
<text x="66" y="4891.96" font-size="15.5" fill="#345963">的複合終點含死於甲狀腺癌，那不是總存活）。把兩個試驗 1,280 人合</text>
<text x="66" y="4915.21" font-size="15.5" fill="#345963">併分析，無復發存活的風險比 0.96（0.80 到 1.15）、全因死亡 1.28</text>
<text x="66" y="4938.46" font-size="15.5" fill="#345963">（0.48 到 3.41）——區間都寬到橫跨 1。這只能說「看不出差別」，不</text>
<text x="66" y="4961.71" font-size="15.5" fill="#345963">能說「一樣安全」。</text>
<text x="66" y="4994.96" font-size="15.5" fill="#345963">2017 年，歐美的兩個核醫學會與兩個甲狀腺學會合組了跨學會工作小</text>
<text x="66" y="5018.21" font-size="15.5" fill="#345963">組來處理放射碘的爭議。2020 年他們的進度報告寫著：可得的證據不</text>
<text x="66" y="5041.46" font-size="15.5" fill="#345963">足以提供任何確定的指引，他們無法達成共識。四個學會談都談不攏，</text>
<text x="66" y="5064.71" font-size="15.5" fill="#345963">兩個醫師給你兩種說法，是正常的。</text>
<text x="40" y="5124.46" font-size="15" fill="#527078">示意圖，依 ESTIMABL2 的 2022 年主要結果與 2025 年五年追蹤、IoN 的</text>
<text x="40" y="5147.71" font-size="15" fill="#527078">2025 年報告、HiLo 的 2019 年長期結果、ESTIMABL1 的 2012 年報告、美</text>
<text x="40" y="5170.96" font-size="15" fill="#527078">國甲狀腺學會 2025 年分化型甲狀腺癌指引、歐洲甲狀腺學會 2022 年共識、</text>
<text x="40" y="5194.21" font-size="15" fill="#527078">2015 年低風險殘餘消融的系統性回顧、2025 年兩個試驗的合併分析與2020 年</text>
<text x="40" y="5217.46" font-size="15" fill="#527078">跨學會工作小組進度報告重繪，非擷取自原論文圖表；各研究族群、設計與終點不</text>
<text x="40" y="5240.71" font-size="15" fill="#527078">同，數點不可直接互比。</text>
  </g>
</svg>
