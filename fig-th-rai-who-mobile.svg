<svg xmlns="http://www.w3.org/2000/svg" width="620" height="5276" viewBox="0 0 620 5276" role="img" aria-labelledby="t d">
  <title id="t">四個放射碘試驗，回答的是兩個不同的問題</title>
  <desc id="d">示意圖，把四個放射碘的隨機試驗畫成兩塊，中間隔一條標著「兩個問題之間：沒有箭頭」的虛線，因為它們回答的是兩個不同的問題。上面（手機版）或左邊（桌機版）那一塊的標題是「問題一：要不要做放射碘」，放的是 ESTIMABL2 與 IoN；說明寫兩個都是非劣性設計，而且事先講定的那個幅度都是五個百分點，非劣性試驗不能證明無效，它能說的是「不比較差」。ESTIMABL2（法國）那張卡片：隨機分派做放射碘或不做，776 人，全做完全甲狀腺切除；三年無事件比率是不做 95.6%、做 95.9%；五年時 698 人可評估，不做 93.2%、做 94.8%；兩個時間點都在非劣性界限之內。卡片註記寫這裡的「事件」是複合指標，含影像或超音波異常、甲狀腺球蛋白或抗體升高，不是復發，更不是存活。這張卡片裡面另外框了一個紅色方塊，標題是「它排除了誰：這一格必須跟結論寫在同一句裡」，列三條：單顆、一公分以下的乳突微小癌被直接排除，試驗自己寫的理由是這些人本來就不必做；所有淋巴結陽性被排除；pT2 以上被排除。方塊結語寫收進去的是多發但總和一到二公分、或單顆一到二公分、淋巴結陰性或未評估的人，所以它證明的那個「低風險」，不是讀者手上報告的那個低風險。IoN（英國）那張卡片：同樣隨機分派做或不做，33 個中心、504 人，中位追蹤 6.8 與 6.6 年；五年無復發的粗比率是不做 97.9%（96.1 到 99.7）、做 96.3%（93.9 到 98.7）；試驗另外估的五年絕對風險差是 0.5 個百分點（95% 信賴區間 −2.2 到 3.2）。卡片寫明那個 0.5 不是把上面兩個比率相減，它是另外估出來的量，方向是「不做消融多出來的風險」，非劣性成立是因為區間的上界 3.2 落在事先訂好的 5 個百分點界限以內；兩個比率相減是 1.6 個百分點，方向還相反；至於那 0.5 是怎麼估出來的，論文的方法段這次沒有取得，所以講不了。同樣達到非劣性。註記寫它的終點和 ESTIMABL2 不一樣，是局部復發或殘存的結構性疾病、遠端轉移、死於甲狀腺癌合起來算，全程只有 17 次復發；論文自己寫它還在追蹤中，作者的結論比納入條件窄——是 pT1、pT2、淋巴結陰性或未評估、無不良特徵者可以不做。卡片下半是一個小表，標題「試驗裡風險高的人，風險是真的高」：pT3 的 46 人裡 4 人復發（9%）、pT1 或 pT2 的 458 人裡 13 人（3%）、中央區淋巴結陽性的 47 人裡 6 人復發（13%）、陰性或未評估的 457 人裡 11 人（2%）。結語寫論文接著那一句是這些比率在沒做放射碘的人身上是相似的，而全試驗只有 17 個事件，次群組看不出差別不等於沒差別，這是「看不出來」不是「證明沒有」。另一塊的標題是「問題二：要做多少」，放的是 HiLo 與 ESTIMABL1；說明寫這兩個試驗裡每一個人都做了放射碘，隨機分派的是活度高低與準備方式，它們對「要不要做」一個字都沒有回答。HiLo（英國）那張卡片：每一個人都做了放射碘，低活度 1.1 與較高活度 3.7 GBq——這是這兩個試驗的識別特徵，不是誰的處方；主要終點是治療後六到九個月殘餘組織清乾淨，低活度 85.0%、高活度 88.9%；追到中位 6.5 年時七年累積復發率 5.9% 對 7.3%，風險比 1.10（95% 信賴區間 0.47 到 2.59）。註記寫主要終點是替代指標，不是復發也不是存活；結語寫至於你這一次用多少，依你醫院核子醫學科的規定。ESTIMABL1（法國）那張卡片：同樣是每一個人都做了放射碘，隨機分派的是低活度 1.1 與較高活度 3.7 GBq 以及準備方式，主要終點同樣是治療後六到九個月殘餘組織有沒有清乾淨；結語寫把它們拿去回答「要不要做」，是把兩個問題混在一起。兩塊下面是這張圖的重點：同一份指引裡，建議強度的排列是反直覺的。說明先寫 2025 年版把復發風險分成四格，每格掛上機率：低（不到 10%）、低—中間（10 到 15%）、中間—高（16 到 30%）、高（超過 30%），這四個百分比講的是結構性或生化性復發的機率，不是死亡率，也不是期別。接著是四列，每一列寫風險格、建議、強度與確定性：低（不到 10%）——不常規做，強烈建議、高確定性，這一列用粗框標出來；低—中間（10 到 15%）與中間—高（16 到 30%）——可以考慮，有條件建議、低確定性；高（超過 30%）——常規做，強烈建議、中等確定性；一開始就有遠端轉移——要做，強烈建議、中等確定性。黃底橫幅寫：排出來就清楚了，證據最硬的一句是「不要常規做」；指引自己解釋中間那格為什麼講不硬，是單獨針對中間那兩格的研究太少，一份系統性回顧攤得更白、不過它數的是另一批人——舊的三級分層裡被歸為中風險的那一格：11 篇觀察性研究看到好處、13 篇沒有，作者自己還補了一句，其中族群分層做得乾淨的只有少數幾篇；界線後來重畫過，那個中間不等於今天的中間兩格，但分歧的形狀沒有變。再下面一格寫歐洲那份共識：歐洲甲狀腺學會 2022 年的共識同樣把高風險與已知結構性病灶列為適應症，而該共識每一條建議都沒有標註強度與等級；它指出低風險難證明的原因是這些人死於甲狀腺癌的機率不到 1%、殘存或復發只有 2% 到 3%，回溯性研究很難在這種底數上看出好處；它還有一句專給微小癌——一公分以下、沒有其他高風險特徵的乳突微小癌不該做，而這句只適用一公分以下，不能往上套到一到四公分。圖的最後是一個紅框的界線區塊，標題是「這張圖不會把四個試驗串成一串」，內容五條：上下兩塊回答的是兩個不同的問題，把四個串成「這四個都證明放射碘可以少做」是錯的；1.1 與 3.7 GBq 在這張圖上只是那兩個試驗的識別特徵，不是任何人的處方，你這一次用多少、怎麼準備、要不要住進去，依你醫院核子醫學科的規定；ESTIMABL2 的「低風險」永遠帶著它的排除條件，你報告上的「低風險」如果不是這一格，那個結論就不是為你做的；存活這一題沒有任何一個隨機試驗是以總存活當主要終點做的（IoN 的複合終點含死於甲狀腺癌，那不是總存活），把兩個試驗 1,280 人合併分析，無復發存活的風險比 0.96（0.80 到 1.15）、全因死亡 1.28（0.48 到 3.41），區間都寬到橫跨 1，這只能說「看不出差別」，不能說「一樣安全」；2017 年歐美的兩個核醫學會與兩個甲狀腺學會合組了跨學會工作小組來處理放射碘的爭議，2020 年他們的進度報告寫著可得的證據不足以提供任何確定的指引、他們無法達成共識——四個學會談都談不攏，兩個醫師給你兩種說法，是正常的。</desc>
