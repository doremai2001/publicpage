<text x="382.0" y="336.94" font-size="16.5" fill="#F7F1E4" font-weight="800" text-anchor="middle">自費常規</text>
<text x="338" y="376" font-size="15.5" fill="#345963">未滿 19 歲：健保三項</text>
<text x="338" y="400" font-size="15.5" fill="#345963">成人：全自費</text>
<rect x="595" y="314" width="92" height="34" rx="13" fill="#4E7A87"/>
<text x="641.0" y="336.94" font-size="16.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">機器許可</text>
<text x="597" y="376" font-size="15.5" fill="#345963">510(k) 共 92 筆</text>
<text x="597" y="400" font-size="15.5" fill="#345963">給付：查無統一來源</text>
<line x1="579" y1="310" x2="579" y2="408" stroke="#DBD3BF" stroke-width="1"/>
<rect x="854" y="314" width="92" height="34" rx="13" fill="#4E7A87"/>
<text x="900.0" y="336.94" font-size="16.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">機器許可</text>
<text x="856" y="376" font-size="15.5" fill="#345963">CE（MDR）</text>
<text x="856" y="400" font-size="15.5" fill="#345963">給付各會員國不同</text>
<line x1="838" y1="310" x2="838" y2="408" stroke="#DBD3BF" stroke-width="1"/>
<rect x="1113" y="314" width="92" height="34" rx="13" fill="#4E7A87"/>
