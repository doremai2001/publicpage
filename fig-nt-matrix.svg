<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="950" viewBox="0 0 1440 950" role="img" aria-labelledby="t d">
  <title id="t">四種技術 × 四地的法規與給付身分</title>
  <desc id="d">表格：質子、碳離子（重粒子）、FLASH、BNCT在台灣、美國、歐盟、日本的身分。質子：台灣自費常規（未滿19歲有三項健保）、美歐機器許可、日本多項適應症納保。碳離子：台灣自費常規且健保零項目、美國無路徑、歐盟有中心、日本納保多項。FLASH：台灣連註冊試驗都沒有、美歐試驗中、日本不明。BNCT：台灣試驗中另有專案性質緊急管道、美國無核准硼藥、歐盟查無紀錄、日本就頭頸癌有藥證與給付。資料時點2026年8月。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="950" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="86" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">REGULATORY STATUS GRID</text>
<text x="84" y="148" font-size="44" fill="#123641" font-weight="800" class="r">同一種技術，在四個地方是四種身分</text>
<text x="84" y="194" font-size="21" fill="#527078">每格是法規與給付現況的縮寫；「不明」＝查無可引用來源，不以推測補齊。</text>
<rect x="84" y="222" width="114" height="30" rx="11" fill="#8F7418"/>
<text x="141.0" y="242.4" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="middle">有藥證＋給付</text>
<rect x="214" y="222" width="84" height="30" rx="11" fill="#123641"/>
<text x="256.0" y="242.4" font-size="15" fill="#F7F1E4" font-weight="800" text-anchor="middle">自費常規</text>
<rect x="314" y="222" width="84" height="30" rx="11" fill="#4E7A87"/>
<text x="356.0" y="242.4" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="middle">機器許可</text>
<rect x="414" y="222" width="69" height="30" rx="11" fill="#D8C78F"/>
<text x="448.5" y="242.4" font-size="15" fill="#123641" font-weight="800" text-anchor="middle">試驗中</text>
<rect x="499" y="222" width="69" height="30" rx="11" fill="none" stroke="#8A8375" stroke-width="2"/>
<text x="533.5" y="242.4" font-size="15" fill="#6B6455" font-weight="800" text-anchor="middle">無路徑</text>
<rect x="584" y="222" width="54" height="30" rx="11" fill="#EAE3D1" stroke="#9A9282" stroke-width="2" stroke-dasharray="6 4"/>
<text x="611.0" y="242.4" font-size="15" fill="#6B6455" font-weight="800" text-anchor="middle">不明</text>
<text x="1356" y="242" font-size="17" fill="#8F7418" font-weight="800" text-anchor="end">資料時點：2026-08</text>
<text x="449.5" y="282" font-size="21" fill="#123641" font-weight="800" text-anchor="middle">台灣</text>
<text x="708.5" y="282" font-size="21" fill="#123641" font-weight="800" text-anchor="middle">美國</text>
<text x="967.5" y="282" font-size="21" fill="#123641" font-weight="800" text-anchor="middle">歐盟</text>
<text x="1226.5" y="282" font-size="21" fill="#123641" font-weight="800" text-anchor="middle">日本</text>
<g filter="url(#sh)"><rect x="84" y="296" width="1272" height="126" rx="16" fill="#FFFFFF"/></g>
<text x="110" y="363.0" font-size="21" fill="#123641" font-weight="800">質子</text>
