<text x="1115" y="376" font-size="15.5" fill="#345963">多項適應症納保</text>
<text x="1115" y="400" font-size="15.5" fill="#345963">（2026-06 清單）</text>
<line x1="1097" y1="310" x2="1097" y2="408" stroke="#DBD3BF" stroke-width="1"/>
<g filter="url(#sh)"><rect x="84" y="434" width="1272" height="126" rx="16" fill="#F8F3E7"/></g>
