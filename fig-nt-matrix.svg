<rect x="336" y="452" width="92" height="34" rx="13" fill="#123641"/>
<text x="382.0" y="474.94" font-size="16.5" fill="#F7F1E4" font-weight="800" text-anchor="middle">自費常規</text>
<text x="338" y="514" font-size="15.5" fill="#345963">健保零項目</text>
<text x="338" y="538" font-size="15.5" fill="#345963">費用向醫務課確認</text>
<rect x="595" y="452" width="76" height="34" rx="13" fill="none" stroke="#8A8375" stroke-width="2"/>
<text x="632.75" y="474.94" font-size="16.5" fill="#6B6455" font-weight="800" text-anchor="middle">無路徑</text>
<text x="597" y="514" font-size="15.5" fill="#345963">零臨床運轉中心</text>
<text x="597" y="538" font-size="15.5" fill="#345963">（第一家興建中）</text>
<line x1="579" y1="448" x2="579" y2="546" stroke="#DBD3BF" stroke-width="1"/>
<rect x="854" y="452" width="92" height="34" rx="13" fill="#4E7A87"/>
<text x="900.0" y="474.94" font-size="16.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">機器許可</text>
<text x="856" y="514" font-size="15.5" fill="#345963">德、義、奧有中心</text>
<text x="856" y="538" font-size="15.5" fill="#345963">給付各國不同</text>
<line x1="838" y1="448" x2="838" y2="546" stroke="#DBD3BF" stroke-width="1"/>
<rect x="1113" y="452" width="92" height="34" rx="13" fill="#4E7A87"/>
<text x="1159.0" y="474.94" font-size="16.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">機器許可</text>
<text x="1115" y="514" font-size="15.5" fill="#345963">保險收載多項</text>
<text x="1115" y="538" font-size="15.5" fill="#345963">（2024-06 擴大）</text>
<line x1="1097" y1="448" x2="1097" y2="546" stroke="#DBD3BF" stroke-width="1"/>
<g filter="url(#sh)"><rect x="84" y="572" width="1272" height="126" rx="16" fill="#FFFFFF"/></g>
<text x="110" y="639.0" font-size="21" fill="#123641" font-weight="800">FLASH</text>
<rect x="336" y="590" width="76" height="34" rx="13" fill="none" stroke="#8A8375" stroke-width="2"/>
<text x="373.75" y="612.94" font-size="16.5" fill="#6B6455" font-weight="800" text-anchor="middle">無路徑</text>
<text x="338" y="652" font-size="15.5" fill="#345963">註冊試驗 0 筆</text>
<text x="338" y="676" font-size="15.5" fill="#345963">（查證過的陰性）</text>
<rect x="595" y="590" width="76" height="34" rx="13" fill="#D8C78F"/>
<text x="632.75" y="612.94" font-size="16.5" fill="#123641" font-weight="800" text-anchor="middle">試驗中</text>
<text x="597" y="652" font-size="15.5" fill="#345963">FAST-01／02</text>
<text x="597" y="676" font-size="15.5" fill="#345963">試驗用器材（IDE）</text>
<line x1="579" y1="586" x2="579" y2="684" stroke="#DBD3BF" stroke-width="1"/>
<rect x="854" y="590" width="76" height="34" rx="13" fill="#D8C78F"/>
<text x="891.75" y="612.94" font-size="16.5" fill="#123641" font-weight="800" text-anchor="middle">試驗中</text>
<text x="856" y="652" font-size="15.5" fill="#345963">多在可行性階段</text>
<text x="856" y="676" font-size="15.5" fill="#345963">CE 情形不明</text>
<line x1="838" y1="586" x2="838" y2="684" stroke="#DBD3BF" stroke-width="1"/>
<rect x="1113" y="590" width="59" height="34" rx="13" fill="#EAE3D1" stroke="#9A9282" stroke-width="2" stroke-dasharray="6 4"/>
<text x="1142.5" y="612.94" font-size="16.5" fill="#6B6455" font-weight="800" text-anchor="middle">不明</text>
<text x="1115" y="652" font-size="15.5" fill="#345963">查無試驗或核准</text>
<line x1="1097" y1="586" x2="1097" y2="684" stroke="#DBD3BF" stroke-width="1"/>
<g filter="url(#sh)"><rect x="84" y="710" width="1272" height="126" rx="16" fill="#F8F3E7"/></g>
<text x="110" y="777.0" font-size="21" fill="#123641" font-weight="800">BNCT</text>
<rect x="336" y="728" width="76" height="34" rx="13" fill="#D8C78F"/>
<text x="373.75" y="750.94" font-size="16.5" fill="#123641" font-weight="800" text-anchor="middle">試驗中</text>
<text x="338" y="790" font-size="15.5" fill="#345963">試驗招募中</text>
<text x="338" y="814" font-size="15.5" fill="#345963">另有專案性質緊急管道</text>
<rect x="595" y="728" width="76" height="34" rx="13" fill="none" stroke="#8A8375" stroke-width="2"/>
<text x="632.75" y="750.94" font-size="16.5" fill="#6B6455" font-weight="800" text-anchor="middle">無路徑</text>
<text x="597" y="790" font-size="15.5" fill="#345963">無核准硼藥</text>
<line x1="579" y1="724" x2="579" y2="822" stroke="#DBD3BF" stroke-width="1"/>
<rect x="854" y="728" width="59" height="34" rx="13" fill="#EAE3D1" stroke="#9A9282" stroke-width="2" stroke-dasharray="6 4"/>
<text x="883.5" y="750.94" font-size="16.5" fill="#6B6455" font-weight="800" text-anchor="middle">不明</text>
<text x="856" y="790" font-size="15.5" fill="#345963">查無核准紀錄</text>
<line x1="838" y1="724" x2="838" y2="822" stroke="#DBD3BF" stroke-width="1"/>
<rect x="1113" y="728" width="125" height="34" rx="13" fill="#8F7418"/>
<text x="1175.5" y="750.94" font-size="16.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">有藥證＋給付</text>
<text x="1115" y="790" font-size="15.5" fill="#345963">頭頸癌單一適應症</text>
<text x="1115" y="814" font-size="15.5" fill="#345963">（2020；健保給付）</text>
<line x1="1097" y1="724" x2="1097" y2="822" stroke="#DBD3BF" stroke-width="1"/>
<text x="84" y="922" font-size="16" fill="#6B8084">依各地官方來源彙整；美國給付依保險人而異、無統一來源｜示意整理，非個別就醫建議</text>
