<text x="170" y="1080" font-size="13.5" fill="#345963" text-anchor="middle">含硼多的癌細胞</text>
<text x="170" y="1104" font-size="16" fill="#8F7418" font-weight="800" text-anchor="middle">被破壞</text>
<text x="360" y="1080" font-size="13.5" fill="#345963" text-anchor="middle">硼少的正常細胞</text>
<text x="360" y="1104" font-size="16" fill="#00806B" font-weight="800" text-anchor="middle">倖免</text>
<text x="550" y="1080" font-size="13.5" fill="#345963" text-anchor="middle">攝取不足的癌細胞</text>
<text x="550" y="1104" font-size="16" fill="#A94438" font-weight="800" text-anchor="middle">可能漏網</text>
<line x1="118" y1="1130" x2="222" y2="1130" stroke="#123641" stroke-width="2"/>
