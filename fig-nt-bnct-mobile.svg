<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1402" viewBox="0 0 720 1402" role="img" aria-labelledby="t d">
  <title id="t">BNCT 的兩步驟機轉</title>
  <desc id="d">步驟一：靜脈輸注含硼藥物，硼聚積在癌細胞內（正常細胞攝取少）；THOR試驗實測腫瘤對正常組織硼濃度比中位3.4，第二次照射降為2.5。步驟二：熱中子照射，硼10捕獲中子後分裂為α粒子與鋰7（2.38 MeV），射程不到10微米、約一個細胞的直徑：含硼多的癌細胞被破壞，硼少的正常細胞倖免，但攝取不足的癌細胞也可能漏網。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="720" height="1402" rx="34" fill="url(#bg)"/>
  <g class="z">
<text x="50" y="66" font-size="15" fill="#A98722" font-weight="800" letter-spacing="4px">HOW BNCT WORKS</text>
<text x="50" y="118" font-size="36" fill="#123641" font-weight="800" class="r">先讓癌細胞吃進硼，</text>
<text x="50" y="166" font-size="36" fill="#123641" font-weight="800" class="r">再用中子引爆</text>
<text x="50" y="204" font-size="15.5" fill="#527078">爆炸範圍不到 10 微米——約一個細胞的直徑。</text>
<text x="50" y="229" font-size="15.5" fill="#527078">選擇性來自硼的分布，也受限於硼的分布。</text>
<g filter="url(#sh)"><rect x="50" y="270" width="620" height="470" rx="22" fill="#FFFFFF"/></g>
<text x="84" y="316" font-size="15" fill="#A98722" font-weight="800" letter-spacing="3px">步驟一</text>
<text x="84" y="352" font-size="21" fill="#123641" font-weight="800">含硼藥物先聚積在癌細胞</text>
<text x="84" y="384" font-size="15.5" fill="#345963">靜脈輸注含硼藥物（BPA），</text>
<text x="84" y="409" font-size="15.5" fill="#345963">經 LAT1 通道進入癌細胞。</text>
<circle cx="168" cy="497" r="38" fill="#F3E8CD" stroke="#8F7418" stroke-width="2.2"/>
