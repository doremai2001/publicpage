<text x="200" y="602" font-size="15.5" fill="#8F7418" font-weight="800" text-anchor="middle">癌細胞：硼濃度高</text>
<circle cx="473" cy="497" r="38" fill="#FFFFFF" stroke="#527078" stroke-width="2.2"/>
<circle cx="533" cy="486" r="38" fill="#FFFFFF" stroke="#527078" stroke-width="2.2"/>
<circle cx="505" cy="540" r="38" fill="#FFFFFF" stroke="#527078" stroke-width="2.2"/>
<circle cx="464.4" cy="493.5" r="3.4" fill="#96790F"/>
<circle cx="484.2" cy="555.8" r="3.4" fill="#96790F"/>
<text x="505" y="602" font-size="15.5" fill="#527078" font-weight="800" text-anchor="middle">正常細胞：攝取少</text>
<rect x="84" y="622" width="552" height="94" rx="14" fill="#A98722" opacity="0.10"/>
<text x="104" y="650" font-size="14" fill="#345963">THOR 試驗實測腫瘤／正常硼濃度比：</text>
<text x="104" y="675" font-size="14" fill="#345963">中位 3.4 → 第二次照射降為 2.5</text>
<text x="104" y="700" font-size="14" fill="#345963">——比值會變，攝取也不均勻。</text>
<g filter="url(#sh)"><rect x="50" y="762" width="620" height="560" rx="22" fill="#FFFFFF"/></g>
<text x="84" y="808" font-size="15" fill="#A98722" font-weight="800" letter-spacing="3px">步驟二</text>
<text x="84" y="844" font-size="21" fill="#123641" font-weight="800">中子照射：能量只在細胞內釋放</text>
<text x="636" y="872" font-size="14" fill="#527078" font-weight="700" text-anchor="end">熱中子（&lt;0.025 eV）</text>
