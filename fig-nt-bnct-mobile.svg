<text x="236" y="1135" font-size="14.5" fill="#123641" font-weight="800">射程 &lt;10 μm ≈ 一個細胞的直徑</text>
<rect x="84" y="1214" width="552" height="64" rx="14" fill="#123641"/>
<text x="201" y="1254" font-size="18" fill="#F7F1E4" font-weight="800"><tspan font-size="11" dy="-6">10</tspan><tspan font-size="18" dy="6">B ＋ 中子 → α ＋ </tspan><tspan font-size="11" dy="-6">7</tspan><tspan font-size="18" dy="6">Li（2.38 MeV）</tspan></text>
<text x="50" y="1354" font-size="13" fill="#6B8084">示意圖，依 Malouff 2021（CC-BY）重繪</text>
<text x="50" y="1376" font-size="13" fill="#6B8084">硼濃度比為 THOR 試驗 <tspan font-size="8" dy="-6">18</tspan><tspan font-size="13" dy="6">F-BPA-PET 實測</tspan></text>
