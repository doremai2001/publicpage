<circle cx="244.1" cy="470.0" r="3.4" fill="#96790F"/>
<circle cx="205.4" cy="565.9" r="3.4" fill="#96790F"/>
<circle cx="183.5" cy="554.8" r="3.4" fill="#96790F"/>
