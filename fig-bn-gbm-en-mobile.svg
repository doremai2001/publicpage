<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1095" viewBox="0 0 720 1095" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Both numbers are true</title>
  <desc id="d">One trial, the same 27 patients with recurrent glioblastoma. Almost no imaging response, yet nearly eight in ten were alive at one year. 21 of the 27 patients (78%) received bevacizumab after progression. So what this comparison actually contrasts is BNCT followed by bevacizumab against bevacizumab alone - and the control cohort is four to six years older. Grade 3 or higher treatment-related adverse events: 81.5%. Brain oedema: 48.1%.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#123641" opacity=".10"/><line x1="0" y1="0" x2="0" y2="8" stroke="#123641" stroke-width="2.2" opacity=".75"/></pattern><pattern id="hatchlite" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#123641" stroke-width="1.4" opacity=".22"/></pattern><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="720" height="1095" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="48" y="81" font-size="15" fill="#A98722" font-weight="800" letter-spacing="5px">HOW TO READ A TRIAL</text>
<text x="48" y="138" font-size="37" fill="#123641" font-weight="800" class="r">Both numbers are true</text>
<text x="48" y="182" font-size="18" fill="#527078">One trial, the same 27 patients with recurrent glioblastoma.</text>
<text x="48" y="208" font-size="18" fill="#527078">Almost no imaging response, yet nearly eight in ten were alive at</text>
<text x="48" y="234" font-size="18" fill="#527078">one year.</text>
<rect x="48" y="284" width="624" height="172" rx="16" fill="#123641" opacity="0.05"/>
<rect x="48" y="284" width="624" height="5" rx="3" fill="#5C77C4" opacity="0.9"/>
<text x="66" y="323" font-size="17" fill="#5C77C4" font-weight="800">What imaging saw</text>
<text x="66" y="359" font-size="13" fill="#527078">RANO response rate</text>
<text x="654" y="359" font-size="21" fill="#123641" font-weight="800" text-anchor="end">3.7%</text>
<text x="66" y="391" font-size="13" fill="#527078">Median progression-free survival</text>
<text x="654" y="391" font-size="21" fill="#123641" font-weight="800" text-anchor="end">0.9 months</text>
<text x="66" y="426" font-size="12" fill="#6B8084">pseudoprogression is common after brain irradiation, and RANO misreads it</text>
<rect x="48" y="471" width="624" height="172" rx="16" fill="#123641" opacity="0.05"/>
<rect x="48" y="471" width="624" height="5" rx="3" fill="#A98722" opacity="0.9"/>
<text x="66" y="510" font-size="17" fill="#A98722" font-weight="800">What survival saw</text>
<text x="66" y="546" font-size="13" fill="#527078">One-year survival</text>
<text x="654" y="546" font-size="21" fill="#123641" font-weight="800" text-anchor="end">79.2%</text>
<text x="66" y="578" font-size="13" fill="#527078">Median overall survival</text>
<text x="654" y="578" font-size="21" fill="#123641" font-weight="800" text-anchor="end">18.9 months</text>
<text x="66" y="613" font-size="12" fill="#6B8084">95% CI 57.0-90.8</text>
<text x="48" y="668" font-size="15" fill="#123641" font-weight="700">JG002 (BNCT, n=27)</text>
<rect x="48" y="695" width="624" height="29" rx="8" fill="#123641" opacity="0.05"/>
<rect x="48" y="695" width="561" height="29" rx="8" fill="#A98722" opacity="0.88"/>
<text x="60" y="714" font-size="13" fill="#FFFFFF" font-weight="700">18.9 months</text>
<text x="48" y="742" font-size="15" fill="#123641" font-weight="700">JO22506 (bevacizumab alone, n=31, 2012)</text>
<rect x="48" y="769" width="624" height="29" rx="8" fill="#123641" opacity="0.05"/>
<rect x="48" y="769" width="312" height="29" rx="8" fill="#123641" opacity="0.14" stroke="#123641" stroke-width="2"/>
<rect x="48" y="769" width="312" height="29" rx="8" fill="url(#hatchlite)"/>
<text x="60" y="788" font-size="13" fill="#345963" font-weight="700">10.5 months  non-contemporaneous</text>
<text x="60" y="806" font-size="13" fill="#345963" font-weight="700">historical control</text>
<rect x="48" y="836" width="624" height="2" rx="1" fill="#A98722" opacity="0.5"/>
<text x="48" y="865" font-size="16" fill="#345963" font-weight="700">21 of the 27 patients (78%) received bevacizumab after progression. So</text>
<text x="48" y="890" font-size="16" fill="#345963" font-weight="700">what this comparison actually contrasts is</text>
<text x="48" y="915" font-size="16" fill="#345963" font-weight="700">BNCT followed by bevacizumab against bevacizumab alone - and the control</text>
<text x="48" y="940" font-size="16" fill="#345963" font-weight="700">cohort is four to six years older.</text>
<text x="48" y="965" font-size="16" fill="#345963" font-weight="700">Grade 3 or higher treatment-related adverse events: 81.5%. Brain oedema:</text>
<text x="48" y="990" font-size="16" fill="#345963" font-weight="700">48.1%.</text>
<text x="48" y="1021" font-size="13" fill="#6B8084">Schematic, redrawn from Kawabata et al. 2021 (Neuro-Oncology Advances) and Nagane et al.</text>
<text x="48" y="1041" font-size="13" fill="#6B8084">2012 (Jpn J Clin Oncol); bar lengths show relative median survival in months.</text>
  </g>
</svg>
