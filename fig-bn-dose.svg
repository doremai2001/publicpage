<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="942" viewBox="0 0 1440 942" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">一次照射，四種劑量</title>
  <desc id="d">只有第一種需要硼。其餘三種打在所有被中子穿過的組織上， 包括正常組織——這是 BNCT 不能被說成「不傷正常組織」的物理理由。 Gy-Eq 和放射治療的 Gy 不是同一個單位：不能互相比較，也不能相加。 這些係數是從動物與早期臨床推出來的估計值，不是量出來的常數。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#123641" opacity=".10"/><line x1="0" y1="0" x2="0" y2="8" stroke="#123641" stroke-width="2.2" opacity=".75"/></pattern><pattern id="hatchlite" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#123641" stroke-width="1.4" opacity=".22"/></pattern><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="942" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="78" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">DOSE</text>
<text x="84" y="140" font-size="44" fill="#123641" font-weight="800" class="r">一次照射，四種劑量</text>
<text x="84" y="192" font-size="21" fill="#527078">只有第一種需要硼。其餘三種打在所有被中子穿過的組織上，</text>
<text x="84" y="223" font-size="21" fill="#527078">包括正常組織——這是 BNCT 不能被說成「不傷正常組織」的物理理由。</text>
<text x="84" y="282" font-size="19" fill="#123641" font-weight="700">硼劑量（高 LET）</text>
<rect x="84" y="315" width="1272" height="38" rx="8" fill="#123641" opacity="0.05"/>
<rect x="84" y="315" width="1208" height="38" rx="8" fill="#A98722" opacity="0.88"/>
<text x="98" y="341" font-size="16" fill="#FFFFFF" font-weight="700">只發生在有硼的地方</text>
<text x="84" y="377" font-size="19" fill="#123641" font-weight="700">氮劑量　14N(n,p)14C，質子約 0.54 MeV</text>
<rect x="84" y="410" width="1272" height="38" rx="8" fill="#123641" opacity="0.05"/>
<rect x="84" y="410" width="788" height="38" rx="8" fill="#5C77C4" opacity="0.88"/>
<text x="98" y="436" font-size="16" fill="#FFFFFF" font-weight="700">與硼無關</text>
<text x="84" y="472" font-size="19" fill="#123641" font-weight="700">快中子劑量　中子撞氫、撞飛質子</text>
<rect x="84" y="505" width="1272" height="38" rx="8" fill="#123641" opacity="0.05"/>
<rect x="84" y="505" width="610" height="38" rx="8" fill="#5C77C4" opacity="0.88"/>
<text x="98" y="531" font-size="16" fill="#FFFFFF" font-weight="700">與硼無關</text>
<text x="84" y="567" font-size="19" fill="#123641" font-weight="700">光子劑量　組織內 1H(n,γ)2H 與射束污染</text>
<rect x="84" y="600" width="1272" height="38" rx="8" fill="#123641" opacity="0.05"/>
<rect x="84" y="600" width="508" height="38" rx="8" fill="#5C77C4" opacity="0.88"/>
<text x="98" y="626" font-size="16" fill="#FFFFFF" font-weight="700">與硼無關</text>
<rect x="84" y="662" width="1272" height="2" rx="1" fill="#123641" opacity="0.12"/>
<text x="84" y="692" font-size="18" fill="#527078">各成分乘上係數再相加，得到「光子等效劑量」Gy-Eq</text>
<text x="84" y="719" font-size="18" fill="#527078">CBE：腫瘤 3.8　皮膚 2.5　口腔黏膜 2.5　腦與脊髓 1.3　　射束高 LET 成分 RBE 3.2</text>
<rect x="84" y="776" width="1272" height="2" rx="1" fill="#A98722" opacity="0.5"/>
<text x="84" y="810" font-size="19" fill="#345963" font-weight="700">Gy-Eq 和放射治療的 Gy 不是同一個單位：不能互相比較，也不能相加。</text>
<text x="84" y="840" font-size="19" fill="#345963" font-weight="700">這些係數是從動物與早期臨床推出來的估計值，不是量出來的常數。</text>
<text x="84" y="878" font-size="16" fill="#6B8084">示意圖，依 MIT OpenCourseWare 22.55J 講義與 Barth 等 2005 重繪；長條長度為示意，非實際劑量比例。</text>
  </g>
</svg>
