<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1420" viewBox="0 0 720 1420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">每個癌別，爬到哪一階</title>
  <desc id="d">斜線＝該階最大的隨機試驗結果為陰性（未做出差異） 灰色＝目前只有個案報告與前臨床資料 軟組織肉瘤, 乳癌（胸壁復發）, 頭頸癌（再照射）, 黑色素瘤（淺表）, 子宮頸癌, 膀胱癌（腔內灌注）, 膀胱癌（保膀胱）, 肛門癌, 直腸癌, 攝護腺癌, 食道／肺／卵巢／腦, 免疫治療組合, 細胞治療組合, 質子＋熱治療</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#123641" opacity=".14"/><line x1="0" y1="0" x2="0" y2="8" stroke="#123641" stroke-width="2.4" opacity=".85"/></pattern><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0B2832" flood-opacity=".12"/></filter><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="720" height="1420" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="56" y="78" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">EVIDENCE BY SITE</text>
<text x="56" y="140" font-size="30" fill="#123641" font-weight="800" class="r">每個癌別，爬到哪一階</text>
<text x="56" y="182" font-size="18" fill="#527078">位置＝已完成的最高證據層級，不是療效排名。</text>
<text x="56" y="209" font-size="18" fill="#527078">同一階裡，年代、人數與終點仍然差很多。</text>
<line x1="56" y1="292" x2="664" y2="292" stroke="#123641" stroke-width="1.4" stroke-linecap="round" opacity=".22"/>
<text x="56" y="322" font-size="15" fill="#A98722" font-weight="800">第5階</text>
<text x="56" y="350" font-size="16" fill="#123641" font-weight="700">大型隨機第三期（陽性）</text>
<rect x="206" y="388" width="89" height="36" rx="19" fill="#A98722" opacity=".20" stroke="#A98722" stroke-width="2" />
<text x="223" y="412" font-size="15" fill="#123641" font-weight="700">軟組織肉瘤</text>
<line x1="56" y1="460" x2="664" y2="460" stroke="#123641" stroke-width="1.4" stroke-linecap="round" opacity=".22"/>
<text x="56" y="490" font-size="15" fill="#A98722" font-weight="800">第4階</text>
<text x="56" y="518" font-size="16" fill="#123641" font-weight="700">多個隨機試驗或其統合分</text>
<text x="56" y="540" font-size="16" fill="#123641" font-weight="700">析</text>
<rect x="206" y="556" width="122" height="36" rx="19" fill="#A98722" opacity=".20" stroke="#A98722" stroke-width="2" />
<text x="223" y="580" font-size="15" fill="#123641" font-weight="700">乳癌（胸壁復發）</text>
<rect x="340" y="556" width="122" height="36" rx="19" fill="#A98722" opacity=".20" stroke="#A98722" stroke-width="2" />
<text x="357" y="580" font-size="15" fill="#123641" font-weight="700">頭頸癌（再照射）</text>
<rect x="474" y="556" width="122" height="36" rx="19" fill="#A98722" opacity=".20" stroke="#A98722" stroke-width="2" />
<text x="491" y="580" font-size="15" fill="#123641" font-weight="700">黑色素瘤（淺表）</text>
<line x1="56" y1="628" x2="664" y2="628" stroke="#123641" stroke-width="1.4" stroke-linecap="round" opacity=".22"/>
<text x="56" y="658" font-size="15" fill="#A98722" font-weight="800">第3階</text>
<text x="56" y="686" font-size="16" fill="#123641" font-weight="700">隨機試驗，但結果不一致</text>
<text x="56" y="708" font-size="16" fill="#123641" font-weight="700">或提前結束</text>
<rect x="206" y="724" width="78" height="36" rx="19" fill="#5C77C4" opacity=".20" stroke="#5C77C4" stroke-width="2" />
<text x="223" y="748" font-size="15" fill="#123641" font-weight="700">子宮頸癌</text>
<rect x="296" y="724" width="133" height="36" rx="19" fill="#5C77C4" opacity=".20" stroke="#5C77C4" stroke-width="2" />
<rect x="296" y="724" width="133" height="36" rx="19" fill="url(#hatch)" opacity=".5" />
<text x="313" y="748" font-size="15" fill="#123641" font-weight="700">膀胱癌（腔內灌注）</text>
<line x1="56" y1="796" x2="664" y2="796" stroke="#123641" stroke-width="1.4" stroke-linecap="round" opacity=".22"/>
<text x="56" y="826" font-size="15" fill="#A98722" font-weight="800">第2階</text>
<text x="56" y="854" font-size="16" fill="#123641" font-weight="700">前瞻單臂／世代研究</text>
<rect x="206" y="892" width="122" height="36" rx="19" fill="#5C77C4" opacity=".20" stroke="#5C77C4" stroke-width="2" />
<text x="223" y="916" font-size="15" fill="#123641" font-weight="700">膀胱癌（保膀胱）</text>
<rect x="340" y="892" width="67" height="36" rx="19" fill="#5C77C4" opacity=".20" stroke="#5C77C4" stroke-width="2" />
<text x="357" y="916" font-size="15" fill="#123641" font-weight="700">肛門癌</text>
<rect x="419" y="892" width="67" height="36" rx="19" fill="#5C77C4" opacity=".20" stroke="#5C77C4" stroke-width="2" />
<text x="436" y="916" font-size="15" fill="#123641" font-weight="700">直腸癌</text>
<rect x="498" y="892" width="78" height="36" rx="19" fill="#00806B" opacity=".20" stroke="#00806B" stroke-width="2" />
<text x="515" y="916" font-size="15" fill="#123641" font-weight="700">攝護腺癌</text>
<line x1="56" y1="964" x2="664" y2="964" stroke="#123641" stroke-width="1.4" stroke-linecap="round" opacity=".22"/>
<text x="56" y="994" font-size="15" fill="#A98722" font-weight="800">第1階</text>
<text x="56" y="1022" font-size="16" fill="#123641" font-weight="700">回溯、個案與前臨床</text>
<rect x="206" y="1060" width="133" height="36" rx="19" fill="#00806B" opacity=".20" stroke="#00806B" stroke-width="2" />
<text x="223" y="1084" font-size="15" fill="#123641" font-weight="700">食道／肺／卵巢／腦</text>
<rect x="351" y="1060" width="100" height="36" rx="19" fill="#00806B" opacity=".20" stroke="#00806B" stroke-width="2" />
<text x="368" y="1084" font-size="15" fill="#123641" font-weight="700">免疫治療組合</text>
<rect x="463" y="1060" width="100" height="36" rx="19" fill="#9A9282" opacity=".16" stroke="#9A9282" stroke-width="2" />
<text x="480" y="1084" font-size="15" fill="#6B8084" font-weight="700">細胞治療組合</text>
<rect x="206" y="1104" width="100" height="36" rx="19" fill="#9A9282" opacity=".16" stroke="#9A9282" stroke-width="2" />
<text x="223" y="1128" font-size="15" fill="#6B8084" font-weight="700">質子＋熱治療</text>
<rect x="56" y="1148" width="30" height="20" rx="6" fill="#A98722" opacity=".2" stroke="#A98722" stroke-width="2" />
<rect x="56" y="1148" width="30" height="20" rx="6" fill="url(#hatch)" opacity=".5" />
<text x="98" y="1164" font-size="15" fill="#527078">斜線＝該階最大的隨機試驗結果為陰性（未做出差異）</text>
<rect x="56" y="1182" width="30" height="20" rx="6" fill="#9A9282" opacity=".16" stroke="#9A9282" stroke-width="2" />
<text x="98" y="1198" font-size="15" fill="#527078">灰色＝目前只有個案報告與前臨床資料</text>
<text x="56" y="1384" font-size="14" fill="#6B8084">示意圖，依本專題查證過的來源整理；每一個位置的試驗設計、人數與終點，見各癌別文章。</text>
  </g>
</svg>
