<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="942" viewBox="0 0 1440 942" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">One irradiation, four dose components</title>
  <desc id="d">Only the first one needs boron. The other three deposit in every tissue the beam passes through, including normal tissue - which is why BNCT cannot be described as sparing normal tissue entirely. Gy-Eq is not the same unit as the Gy of external-beam radiotherapy: the numbers cannot be compared or added. These factors are estimates derived from animal and early clinical work, not measured constants.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#123641" opacity=".10"/><line x1="0" y1="0" x2="0" y2="8" stroke="#123641" stroke-width="2.2" opacity=".75"/></pattern><pattern id="hatchlite" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#123641" stroke-width="1.4" opacity=".22"/></pattern><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="942" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="78" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">DOSE</text>
<text x="84" y="140" font-size="44" fill="#123641" font-weight="800" class="r">One irradiation, four dose components</text>
<text x="84" y="192" font-size="21" fill="#527078">Only the first one needs boron. The other three deposit in every tissue the beam passes through,</text>
<text x="84" y="223" font-size="21" fill="#527078">including normal tissue - which is why BNCT cannot be described as sparing normal tissue entirely.</text>
<text x="84" y="282" font-size="19" fill="#123641" font-weight="700">Boron dose (high LET)</text>
<rect x="84" y="315" width="1272" height="38" rx="8" fill="#123641" opacity="0.05"/>
<rect x="84" y="315" width="1208" height="38" rx="8" fill="#A98722" opacity="0.88"/>
<text x="98" y="341" font-size="16" fill="#FFFFFF" font-weight="700">only where boron is</text>
<text x="84" y="377" font-size="19" fill="#123641" font-weight="700">Nitrogen dose  14N(n,p)14C, proton about 0.54 MeV</text>
<rect x="84" y="410" width="1272" height="38" rx="8" fill="#123641" opacity="0.05"/>
<rect x="84" y="410" width="788" height="38" rx="8" fill="#5C77C4" opacity="0.88"/>
<text x="98" y="436" font-size="16" fill="#FFFFFF" font-weight="700">independent of boron</text>
<text x="84" y="472" font-size="19" fill="#123641" font-weight="700">Fast neutron dose  recoil protons from hydrogen</text>
<rect x="84" y="505" width="1272" height="38" rx="8" fill="#123641" opacity="0.05"/>
<rect x="84" y="505" width="610" height="38" rx="8" fill="#5C77C4" opacity="0.88"/>
<text x="98" y="531" font-size="16" fill="#FFFFFF" font-weight="700">independent of boron</text>
<text x="84" y="567" font-size="19" fill="#123641" font-weight="700">Photon dose  1H(n,gamma)2H in tissue and beam contamination</text>
<rect x="84" y="600" width="1272" height="38" rx="8" fill="#123641" opacity="0.05"/>
<rect x="84" y="600" width="508" height="38" rx="8" fill="#5C77C4" opacity="0.88"/>
<text x="98" y="626" font-size="16" fill="#FFFFFF" font-weight="700">independent of boron</text>
<rect x="84" y="662" width="1272" height="2" rx="1" fill="#123641" opacity="0.12"/>
<text x="84" y="692" font-size="18" fill="#527078">Each component is weighted and summed into a photon-equivalent dose, Gy-Eq</text>
<text x="84" y="719" font-size="18" fill="#527078">CBE: tumour 3.8  skin 2.5  oral mucosa 2.5  brain and spinal cord 1.3   RBE 3.2 for high-LET beam components</text>
<rect x="84" y="776" width="1272" height="2" rx="1" fill="#A98722" opacity="0.5"/>
<text x="84" y="810" font-size="19" fill="#345963" font-weight="700">Gy-Eq is not the same unit as the Gy of external-beam radiotherapy: the numbers cannot be compared or added.</text>
<text x="84" y="840" font-size="19" fill="#345963" font-weight="700">These factors are estimates derived from animal and early clinical work, not measured constants.</text>
<text x="84" y="878" font-size="16" fill="#6B8084">Schematic, redrawn from the MIT OpenCourseWare 22.55J lecture notes and Barth et al. 2005; bar lengths are indicative, not actual dose ratios.</text>
  </g>
</svg>
