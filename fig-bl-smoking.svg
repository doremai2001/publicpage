<text x="916.48" y="1996.61" font-size="14" fill="#7A6E58" font-weight="800">1.44（0.99 到 2.11）　信賴區間跨過 1</text>
<text x="106" y="2036.61" font-size="14" fill="#345963">已經戒掉的人，估計值落在中間，而且統計上不確定。這是誠實的形狀，不是好消息也不是壞消息。</text>
<text x="84" y="2083.61" font-size="14" fill="#527078">示意圖，依 van Osch 2016（89 篇統合分析）、Freedman 2011（NIH-AARP 世代）、Cumberbatch 2016（83 篇統合分析）、Caini 2022（確診後戒菸統合分析）、van Osch 2018（BCPP 前</text>
<text x="84" y="2105.31" font-size="14" fill="#527078">瞻世代）、歐洲泌尿科醫學會 2026 年非肌肉侵犯型膀胱癌指引、歐洲泌尿科醫學會 2025 年上泌尿道指引與 Luo 2020 台日對照世代重繪，非擷取自原論文圖表；各研究族群、設計與終點不同，數點不可</text>
<text x="84" y="2127.01" font-size="14" fill="#527078">直接互比。</text>
