<text x="84" y="872" font-size="16" fill="#6B8084">示意圖，依 Malouff 2021（CC-BY）重繪｜硼濃度比為 THOR 試驗 <tspan font-size="10" dy="-6">18</tspan><tspan font-size="16" dy="6">F-BPA-PET 實測</tspan></text>
