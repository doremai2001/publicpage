<text x="948" y="609" font-size="16.5" fill="#123641" font-weight="800">射程 &lt;10 μm ≈ 一個細胞的直徑</text>
<text x="876" y="644" font-size="15.5" fill="#345963" text-anchor="middle">含硼多的癌細胞</text>
<text x="876" y="670" font-size="18" fill="#8F7418" font-weight="800" text-anchor="middle">被破壞</text>
<text x="1051" y="644" font-size="15.5" fill="#345963" text-anchor="middle">硼少的正常細胞</text>
<text x="1051" y="670" font-size="18" fill="#00806B" font-weight="800" text-anchor="middle">倖免</text>
<text x="1226" y="644" font-size="15.5" fill="#345963" text-anchor="middle">攝取不足的癌細胞</text>
<text x="1226" y="670" font-size="18" fill="#A94438" font-weight="800" text-anchor="middle">可能漏網</text>
