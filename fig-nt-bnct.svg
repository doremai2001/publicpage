<circle cx="503.8" cy="583.1" r="3.4" fill="#96790F"/>
<text x="529" y="638" font-size="18" fill="#527078" font-weight="800" text-anchor="middle">正常細胞：攝取少</text>
<rect x="124" y="670" width="530" height="112" rx="16" fill="#A98722" opacity="0.10"/>
<text x="146" y="704" font-size="16.5" fill="#345963">THOR 試驗實測腫瘤／正常硼濃度比：</text>
<text x="146" y="732" font-size="16.5" fill="#345963">中位 3.4 → 第二次照射降為 2.5</text>
<text x="146" y="760" font-size="16.5" fill="#345963">——比值會變，攝取也不均勻。</text>
<text x="786" y="310" font-size="18" fill="#A98722" font-weight="800" letter-spacing="3px">步驟二</text>
<text x="786" y="350" font-size="25" fill="#123641" font-weight="800">中子照射：能量只在細胞內釋放</text>
<text x="1316" y="384" font-size="16.5" fill="#527078" font-weight="700" text-anchor="end">熱中子（&lt;0.025 eV）</text>
