<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1511" viewBox="0 0 1440 1511" role="img" aria-labelledby="t d">
  <title id="t">劑量升級試驗一覽：加到 60–66 Gy，沒有一個證明更好</title>
  <desc id="d">示意圖：食道癌放療劑量升級試驗一覽，每列兩條桿代表兩臂劑量。起點 RTOG 85-01（n=121，鱗癌加腺癌）：50 Gy 加 cisplatin/5-FU 對 64 Gy 放療單獨，5 年存活 26% 對 0%，劑量較低那一臂活得久是因為多了化療，嚴重與危及生命副作用 44%／20% 對 25%／3%。INT 0123（218 可分析，鱗癌加腺癌，cisplatin/5-FU）：50.4 對 64.8 Gy，2 年整體存活 40% 對 31% 無顯著差異，局部失敗 52% 對 56%，高劑量臂治療相關死亡 11 例對 2 例（7 例發生在小於等於 50.4 Gy 時）。ARTDECO（n=260，荷蘭，鱗癌 61%，每週 carboplatin/paclitaxel）：50.4 對 61.6 Gy，3 年局部 PFS 70% 對 73% 無顯著差異，G4／G5 毒性 12%／5% 對 14%／10%。CONCORDE／PRODIGE 26（n=217，法國，鱗癌 88%，FOLFOX，會議摘要）：50 對 66 Gy，2 年局部區域 PFS 42.7% 對 43.8%，中位整體存活 25.2 對 23.5 個月，毒性死亡 4.6% 對 6.7%。中國多中心（319 可分析，全鱗癌，每週 docetaxel/cisplatin）：50 對 60 Gy，3 年局部區域 PFS 48.4% 對 49.5%，3 年整體存活 52.7% 對 53.1%，8 年局部區域 PFS 36.3% 對 32.7%，G3 以上放射性肺炎 60 Gy 組較高。四個劑量升級試驗全部標「加量未證明更好」。日本自己把標準從 60 Gy 改回 50.4 Gy。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="1511" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="86" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">DOSE ESCALATION — FIVE RANDOMISED READOUTS</text>
<text x="84" y="148" font-size="44" fill="#123641" font-weight="800" class="r">劑量升級試驗一覽：加到 60–66 Gy，沒有一個證明更好</text>
<text x="84" y="194" font-size="21" fill="#527078">每一列是一個隨機試驗：兩條桿是兩臂的放療劑量，右邊寫主要結果的方向。族群與化療方案寫在列下，不同列不能互比。</text>
<text x="84" y="224" font-size="21" fill="#527078">起點那一列不是劑量升級試驗——它說明為什麼標準是「50 Gy 加化療」，而不是更高的純放療。</text>
<text x="106" y="280" font-size="12.5" fill="#6B8084" text-anchor="middle">0</text>
<text x="179.71" y="280" font-size="12.5" fill="#6B8084" text-anchor="middle">10</text>
<text x="253.43" y="280" font-size="12.5" fill="#6B8084" text-anchor="middle">20</text>
<text x="327.14" y="280" font-size="12.5" fill="#6B8084" text-anchor="middle">30</text>
<text x="400.86" y="280" font-size="12.5" fill="#6B8084" text-anchor="middle">40</text>
<text x="474.57" y="280" font-size="12.5" fill="#6B8084" text-anchor="middle">50</text>
<text x="548.29" y="280" font-size="12.5" fill="#6B8084" text-anchor="middle">60</text>
<text x="622" y="280" font-size="12.5" fill="#6B8084" text-anchor="middle">70</text>
<text x="622" y="298" font-size="12.5" fill="#6B8084" text-anchor="end">Gy</text>
<g filter="url(#sh)"><rect x="84" y="308" width="1272" height="179.9" rx="18" fill="#E3E8F6"/></g>
<text x="106" y="345.3" font-size="18" fill="#123641" font-weight="800">起點｜RTOG 85-01（Herskovic 1992／Cooper 1999）</text>
<text x="106" y="370.2" font-size="14" fill="#6B8084">n=121 隨機，鱗癌＋腺癌，胸段</text>
<rect x="106" y="389.9" width="516" height="26" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="106" y="389.9" width="368.57" height="26" rx="4" fill="#5C77C4" opacity="0.9"/>
<line x1="474.57" y1="387.9" x2="474.57" y2="417.9" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.5"/>
<text x="116" y="407.94" font-size="14" fill="#FFFFFF" font-weight="800">50 Gy＋cisplatin/5-FU</text>
<rect x="106" y="425.9" width="516" height="26" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="106" y="425.9" width="471.77" height="26" rx="4" fill="#96790F" opacity="0.9"/>
<line x1="474.57" y1="423.9" x2="474.57" y2="453.9" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.5"/>
<text x="116" y="443.94" font-size="14" fill="#FFFFFF" font-weight="800">64 Gy 放療單獨</text>
<text x="654" y="403.16" font-size="15.6" fill="#123641" font-weight="800">5 年存活 26% 對 0%</text>
<text x="654" y="423.64" font-size="14" fill="#345963">劑量較低那一臂活得久——因為多了化療；代價：嚴重／危及生命副作用 44%／20% 對 25%／3%</text>
<rect x="654" y="440.04" width="157.75" height="21.88" rx="10.94" fill="#5C77C4"/>
<text x="732.88" y="455.48" font-size="12.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">化療的效應，不是劑量的</text>
<g filter="url(#sh)"><rect x="84" y="501.9" width="1272" height="196.21" rx="18" fill="#FFFFFF"/></g>
<text x="106" y="539.2" font-size="18" fill="#123641" font-weight="800">INT 0123／RTOG 94-05（Minsky 2002）</text>
<text x="106" y="564.1" font-size="14" fill="#6B8084">218 可分析，鱗癌＋腺癌，T1–4 N0/1，cisplatin/5-FU</text>
<rect x="106" y="583.8" width="516" height="26" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="106" y="583.8" width="371.52" height="26" rx="4" fill="#5C77C4" opacity="0.9"/>
<line x1="474.57" y1="581.8" x2="474.57" y2="611.8" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.5"/>
<text x="116" y="601.84" font-size="14" fill="#FFFFFF" font-weight="800">50.4 Gy</text>
<rect x="106" y="619.8" width="516" height="26" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="106" y="619.8" width="477.67" height="26" rx="4" fill="#96790F" opacity="0.9"/>
<line x1="474.57" y1="617.8" x2="474.57" y2="647.8" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.5"/>
<text x="116" y="637.84" font-size="14" fill="#FFFFFF" font-weight="800">64.8 Gy</text>
<text x="654" y="597.06" font-size="15.6" fill="#123641" font-weight="800">2 年 OS 40% 對 31%（無顯著差異）</text>
<text x="654" y="617.54" font-size="14" fill="#345963">中位存活 18.1 對 13.0 個月；局部失敗／持續 52% 對 56%；高劑量臂 11 例治療相關死亡對 2 例（7 例發生在</text>
<text x="654" y="637.84" font-size="14" fill="#345963">≤50.4 Gy 時）；期中分析後停止</text>
<rect x="654" y="654.24" width="221.5" height="21.88" rx="10.94" fill="#9A9282"/>
<text x="764.75" y="669.68" font-size="12.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">加量未證明更好；高劑量臂死亡較多</text>
<g filter="url(#sh)"><rect x="84" y="712.12" width="1272" height="179.9" rx="18" fill="#FFFFFF"/></g>
<text x="106" y="749.41" font-size="18" fill="#123641" font-weight="800">ARTDECO（Hulshof 2021）</text>
<text x="106" y="774.31" font-size="14" fill="#6B8084">n=260，荷蘭，鱗癌 61%／腺癌 39%，每週 carboplatin/paclitaxel</text>
<rect x="106" y="794.01" width="516" height="26" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="106" y="794.01" width="371.52" height="26" rx="4" fill="#5C77C4" opacity="0.9"/>
<line x1="474.57" y1="792.01" x2="474.57" y2="822.01" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.5"/>
<text x="116" y="812.05" font-size="14" fill="#FFFFFF" font-weight="800">50.4 Gy</text>
<rect x="106" y="830.01" width="516" height="26" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="106" y="830.01" width="454.08" height="26" rx="4" fill="#96790F" opacity="0.9"/>
<line x1="474.57" y1="828.01" x2="474.57" y2="858.01" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.5"/>
<text x="116" y="848.05" font-size="14" fill="#FFFFFF" font-weight="800">61.6 Gy（原發腫瘤加量）</text>
<text x="654" y="807.27" font-size="15.6" fill="#123641" font-weight="800">3 年局部 PFS 70% 對 73%（無顯著差異）</text>
<text x="654" y="827.75" font-size="14" fill="#345963">鱗癌 75% 對 79%、腺癌 61% 對 61%；G4／G5 毒性 12%／5% 對 14%／10%（p=0.15）；放療完成率 94%</text>
<rect x="654" y="844.15" width="106.75" height="21.88" rx="10.94" fill="#9A9282"/>
<text x="707.38" y="859.59" font-size="12.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">加量未證明更好</text>
<g filter="url(#sh)"><rect x="84" y="906.01" width="1272" height="179.9" rx="18" fill="#FFFFFF"/></g>
<text x="106" y="943.31" font-size="18" fill="#123641" font-weight="800">CONCORDE／PRODIGE 26（Crehange 2021）</text>
<text x="106" y="968.21" font-size="14" fill="#6B8084">n=217，法國，鱗癌 88%，FOLFOX</text>
<rect x="106" y="987.91" width="516" height="26" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="106" y="987.91" width="368.57" height="26" rx="4" fill="#5C77C4" opacity="0.9"/>
<line x1="474.57" y1="985.91" x2="474.57" y2="1015.91" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.5"/>
<text x="116" y="1005.95" font-size="14" fill="#FFFFFF" font-weight="800">50 Gy／25 次</text>
<rect x="106" y="1023.91" width="516" height="26" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="106" y="1023.91" width="486.51" height="26" rx="4" fill="#96790F" opacity="0.9"/>
<line x1="474.57" y1="1021.91" x2="474.57" y2="1051.91" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.5"/>
<text x="116" y="1041.95" font-size="14" fill="#FFFFFF" font-weight="800">66 Gy／33 次</text>
<text x="654" y="1001.17" font-size="15.6" fill="#123641" font-weight="800">2 年局部區域 PFS 42.7% 對 43.8%（HR 1.03）</text>
<text x="654" y="1021.65" font-size="14" fill="#345963">中位 OS 25.2 對 23.5 個月（HR 1.14，p=0.44）；毒性死亡 4.6% 對 6.7%</text>
<rect x="654" y="1038.05" width="196" height="21.88" rx="10.94" fill="#9A9282"/>
<text x="752" y="1053.49" font-size="12.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">加量未證明更好｜會議摘要層級</text>
<g filter="url(#sh)"><rect x="84" y="1099.91" width="1272" height="196.21" rx="18" fill="#FFFFFF"/></g>
<text x="106" y="1137.21" font-size="18" fill="#123641" font-weight="800">中國多中心 50 對 60 Gy（Xu 2022；Cheng 2026 長期）</text>
<text x="106" y="1162.12" font-size="14" fill="#6B8084">319 可分析，全鱗癌，IIA–IVA，每週 docetaxel/cisplatin</text>
<rect x="106" y="1181.81" width="516" height="26" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="106" y="1181.81" width="368.57" height="26" rx="4" fill="#5C77C4" opacity="0.9"/>
<line x1="474.57" y1="1179.81" x2="474.57" y2="1209.81" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.5"/>
<text x="116" y="1199.85" font-size="14" fill="#FFFFFF" font-weight="800">50 Gy</text>
<rect x="106" y="1217.81" width="516" height="26" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="106" y="1217.81" width="442.29" height="26" rx="4" fill="#96790F" opacity="0.9"/>
<line x1="474.57" y1="1215.81" x2="474.57" y2="1245.81" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.5"/>
<text x="116" y="1235.85" font-size="14" fill="#FFFFFF" font-weight="800">60 Gy</text>
<text x="654" y="1195.07" font-size="15.6" fill="#123641" font-weight="800">3 年局部區域 PFS 48.4% 對 49.5%（HR 1.00）</text>
<text x="654" y="1215.55" font-size="14" fill="#345963">3 年 OS 52.7% 對 53.1%；中位追蹤 99.5 個月：8 年局部區域 PFS 36.3% 對 32.7%（HR 1.06）；G3+ 放射</text>
<text x="654" y="1235.85" font-size="14" fill="#345963">性肺炎 60 Gy 組較高（p=0.03）</text>
<rect x="654" y="1252.25" width="197.43" height="21.88" rx="10.94" fill="#9A9282"/>
<text x="752.72" y="1267.69" font-size="12.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">加量未證明更好；G3+ 肺炎較多</text>
<rect x="84" y="1314.13" width="16" height="16" rx="5" fill="#5C77C4" opacity="0.9"/>
<text x="108" y="1327.13" font-size="14" fill="#345963" font-weight="600">標準臂劑量</text>
<rect x="205.4" y="1314.13" width="16" height="16" rx="5" fill="#96790F" opacity="0.9"/>
<text x="229.4" y="1327.13" font-size="14" fill="#345963" font-weight="600">高劑量臂</text>
<line x1="320.52" y1="1312.13" x2="320.52" y2="1332.13" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.6"/>
<text x="336.52" y="1327.13" font-size="14" fill="#345963" font-weight="600">50 Gy 參考線</text>
<text x="84" y="1366.13" font-size="14" fill="#6B8084" font-weight="600">日本自己也把標準從 60 Gy（JCOG0303）改回 50.4 Gy（JCOG0909），理由原文：「減少不良事件與救援手術的風險」。「未證明更好」不等於「證明相等」——各試驗信賴區間都寬；ESO-Shanghai 12</text>
<text x="84" y="1386.43" font-size="14" fill="#6B8084" font-weight="600">仍在用 PET 反應分層測 61.2 對 50.4 Gy。</text>
<text x="84" y="1432.73" font-size="16" fill="#6B8084">示意圖，依 Herskovic 1992、Cooper 1999、Minsky 2002、Hulshof 2021、Crehange 2021（ASTRO 會議摘要）、Xu 2022、Cheng 2026 與 JES 2022 指引重繪｜各試驗族</text>
<text x="84" y="1456.73" font-size="16" fill="#6B8084">群、化療方案與終點不同，列與列之間不可直接互比</text>
  </g>
</svg>
