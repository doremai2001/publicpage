<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1649" viewBox="0 0 620 1649" role="img" aria-labelledby="t d">
  <title id="t">五到六週怎麼過：食道炎照表來，體重悄悄走</title>
  <desc id="d">示意圖：根治性化放療五到六週的行事曆與症狀曲線。左邊週曆：體外放療以 1.8 Gy 乘 28 次等於 50.4 Gy 為例，週一到週五、共五週又三天（60 Gy 版本約六週）；化療以每週一次為例（carboplatin/paclitaxel 週療），cisplatin/5-FU 為隔數週一輪、排法由團隊決定；第 2 到 3 週旁標示食道炎多在此開始，合併化療平均提早約 1 週。右邊曲線：食道炎症狀曲線在第 2 到 3 週上升、第 4 到 6 週最高、放療結束後 4 週內回落，虛線為合併化療提早一週的版本；體重曲線反向緩降；曲線形狀為肺癌放療文獻類推（Baker 與 Fairchild 2016），食道癌試驗未單獨報告食道炎比例。下方四格：CTCAE v5.0 食道炎第三級定義為嚴重改變進食或吞嚥、需管灌、靜脈營養或住院，肺癌同步化放療第三級約 10 到 20%（類推）；ARTDECO 放療完成率 94%，RTOG 85-01 同步化放療嚴重與危及生命副作用 44% 與 20%；局部控制對總療程時間每延一天減 2.3%（食道癌 1994 年放療單獨 n=88）與 1.4%（頭頸鱗癌類推），為族群回歸斜率非個人風險，2025 年同步化放療回溯中位只延 4 天看不出影響；放射性肺炎第二級以上約 6.6%，多在結束後數週到數月。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="620" height="1649" rx="30" fill="url(#bg)"/>
  <g class="z">
<text x="44" y="62" font-size="14" fill="#A98722" font-weight="800" letter-spacing="3.5px">THE 5–6 WEEK CALENDAR</text>
<text x="44" y="112" font-size="30" fill="#123641" font-weight="800" class="r">五到六週怎麼過：食道炎照表來，體重</text>
<text x="44" y="152" font-size="30" fill="#123641" font-weight="800" class="r">悄悄走</text>
<text x="44" y="194" font-size="14.5" fill="#527078">左邊是療程行事曆（以 50.4 Gy 分 28 次為例）；右邊是症狀與體重的示意曲線——</text>
<text x="44" y="216" font-size="14.5" fill="#527078">食道炎在第 2–3 週開始，是照表走，不是出了問題。</text>
<text x="44" y="238" font-size="14.5" fill="#527078">曲線形狀來自肺癌放療文獻的類推，食道癌試驗沒有單獨報食道炎比例。</text>
