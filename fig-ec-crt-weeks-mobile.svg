<rect x="62" y="1043.6" width="86.48" height="20.12" rx="10.06" fill="#B04A4A"/>
<text x="105.24" y="1057.8" font-size="11.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">第三級是什麼</text>
<text x="62" y="1085.92" font-size="12" fill="#345963">CTCAE v5.0 食道炎 G3：「嚴重改變進食／吞嚥；需管灌、靜脈營養或住院」。G2：有症</text>
<text x="62" y="1103.33" font-size="12" fill="#345963">狀、需改變吃法與口服補充。肺癌同步化放療 G3 約 10–20%（類推）。</text>
<g filter="url(#sh)"><rect x="44" y="1136.52" width="532" height="96.92" rx="18" fill="#FFFFFF"/></g>
<rect x="62" y="1152.52" width="98.21" height="20.12" rx="10.06" fill="#5C77C4"/>
<text x="111.11" y="1166.73" font-size="11.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">大多數人做得完</text>
<text x="62" y="1194.85" font-size="12" fill="#345963">ARTDECO（n=260，鱗癌 61%）放療完成率 94%。RTOG 85-01 同步化放療嚴重／危及生命副作</text>
<text x="62" y="1212.25" font-size="12" fill="#345963">用 44%／20%（1992 年代、n=121）。</text>
<g filter="url(#sh)"><rect x="44" y="1245.45" width="532" height="114.32" rx="18" fill="#FFFFFF"/></g>
<rect x="62" y="1261.45" width="109.94" height="20.12" rx="10.06" fill="#96790F"/>
<text x="116.97" y="1275.65" font-size="11.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">為什麼不要自己停</text>
<text x="62" y="1303.77" font-size="12" fill="#345963">局部控制對總療程時間：−2.3%／天（食道癌，1994 年放療單獨、n=88）；−1.4%／天（頭</text>
<text x="62" y="1321.17" font-size="12" fill="#345963">頸鱗癌，類推）——族群回歸斜率，不是個人風險；2025 年同步化放療回溯（中位只延 4 天）</text>
<text x="62" y="1338.57" font-size="12" fill="#345963">看不出影響，不能當「可以隨便停」的證據。</text>
<g filter="url(#sh)"><rect x="44" y="1371.77" width="532" height="96.92" rx="18" fill="#FFFFFF"/></g>
<rect x="62" y="1387.77" width="63.02" height="20.12" rx="10.06" fill="#00806B"/>
<text x="93.51" y="1401.98" font-size="11.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">不只食道</text>
<text x="62" y="1430.1" font-size="12" fill="#345963">放射性肺炎 ≥G2 約 6.6%（IMRT 時代系統性回顧），多在結束後數週到數月——咳嗽、喘要</text>
<text x="62" y="1447.5" font-size="12" fill="#345963">講。</text>
<text x="44" y="1493.2" font-size="12.5" fill="#6B8084" font-weight="600">第四、五週最痛，也最容易想「休息幾天」——難受要回報，讓團隊處理症狀與營養；要不要暫</text>
<text x="44" y="1511.32" font-size="12.5" fill="#6B8084" font-weight="600">停、怎麼補償，由團隊決定。</text>
<text x="44" y="1551.45" font-size="12" fill="#6B8084">示意圖，依 Baker &amp; Fairchild 2016（肺癌放射性食道炎綜述，類推）、CTCAE v5.0、Hulshof</text>
<text x="44" y="1569.45" font-size="12" fill="#6B8084">2021（ARTDECO）、Herskovic 1992（RTOG 85-01）、Nishimura 1994、Bese 2007、Xiang</text>
<text x="44" y="1587.45" font-size="12" fill="#6B8084">2025 與 Tonison 2019（IMRT 時代放射性肺炎回顧）重繪｜曲線為示意，不代表個人病程；排程以</text>
<text x="44" y="1605.45" font-size="12" fill="#6B8084">你的團隊為準</text>
  </g>
</svg>
