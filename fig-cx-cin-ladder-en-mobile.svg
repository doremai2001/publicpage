<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1355" viewBox="0 0 620 1355" role="img" aria-labelledby="t d">
  <title id="t">The CIN ladder: people step back at every rung</title>
  <desc id="d">Schematic of the CIN ladder and what is done at each grade. CIN 1 mostly regresses (about 60%) and observation is preferred; about half of CIN 2 regresses within 24 months (60% under age 30), treatment is recommended with conditional observation possible; CIN 3 is “carcinoma in situ” — not yet cancer, but observation is unacceptable: with proper treatment only 0.7% progress to invasive cancer over 30 years, against 31.3% untreated (50.3% if the lesion persisted), both numbers in the same frame. Beyond the basement membrane lies invasive cancer: IA1 can be cured by conisation alone, IA2 by conisation or simple hysterectomy, and from IB onwards staging and treatment routing take over.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><pattern id="hz" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#96790F" stroke-width="2" opacity="0.55"/></pattern><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="620" height="1355" rx="30" fill="url(#bg)"/>
  <g class="z">
<text x="44" y="62" font-size="14" fill="#A98722" font-weight="800" letter-spacing="3.5px">THE CIN LADDER</text>
<text x="44" y="112" font-size="30" fill="#123641" font-weight="800" class="r">The CIN ladder: people</text>
<text x="44" y="152" font-size="30" fill="#123641" font-weight="800" class="r">step back at every rung</text>
<text x="44" y="194" font-size="14.5" fill="#527078">“Carcinoma in situ (CIN 3) is not cancer” —</text>
<text x="44" y="216" font-size="14.5" fill="#527078">that sentence holds only when it is treated.</text>
<g filter="url(#sh)"><rect x="44" y="250" width="532" height="146" rx="18" fill="#FFFFFF"/></g>
<text x="66" y="284" font-size="18" fill="#123641" font-weight="800">CIN 1</text>
<text x="123.52" y="284" font-size="12.5" fill="#6B8084"> — low-grade lesion</text>
<text x="66" y="312" font-size="13.5" fill="#345963">~60% regress | ~30% persist</text>
<text x="66" y="333" font-size="13.5" fill="#345963">10% → CIN 3, 1% → invasive cancer</text>
<text x="66" y="354" font-size="13.5" fill="#345963">(older studies; no single timeline)</text>
<text x="66" y="375" font-size="13.5" fill="#00806B" font-weight="800">Management: observation preferred</text>
<line x1="90" y1="402" x2="90" y2="426" stroke="#123641" stroke-width="3" stroke-linecap="round"/>
<line x1="90" y1="426" x2="84.8077" y2="416.303" stroke="#123641" stroke-width="3" stroke-linecap="round"/>
<line x1="90" y1="426" x2="95.1923" y2="416.303" stroke="#123641" stroke-width="3" stroke-linecap="round"/>
<g filter="url(#sh)"><rect x="44" y="438" width="532" height="167" rx="18" fill="#FFFFFF"/></g>
<text x="66" y="472" font-size="18" fill="#123641" font-weight="800">CIN 2</text>
<text x="123.52" y="472" font-size="12.5" fill="#6B8084"> — high-grade lesion</text>
<text x="66" y="500" font-size="13.5" fill="#345963">24 mo: 50% regress (60% if under 30)</text>
<text x="66" y="521" font-size="13.5" fill="#345963">32% persist, 18% progress</text>
<text x="66" y="542" font-size="13.5" fill="#345963">(surveillance cohorts, 3,160 women)</text>
<text x="66" y="563" font-size="13.5" fill="#00806B" font-weight="800">Management: treat; conditional observation </text>
<text x="66" y="584" font-size="13.5" fill="#00806B" font-weight="800">possible</text>
<line x1="90" y1="611" x2="90" y2="635" stroke="#123641" stroke-width="3" stroke-linecap="round"/>
<line x1="90" y1="635" x2="84.8077" y2="625.303" stroke="#123641" stroke-width="3" stroke-linecap="round"/>
<line x1="90" y1="635" x2="95.1923" y2="625.303" stroke="#123641" stroke-width="3" stroke-linecap="round"/>
<g filter="url(#sh)"><rect x="44" y="647" width="532" height="254" rx="18" fill="#FFFFFF"/></g>
<text x="66" y="681" font-size="18" fill="#123641" font-weight="800">CIN 3 = “carcinoma in situ”</text>
<text x="66" y="705" font-size="12.5" fill="#6B8084">not yet cancer; observation is not an option</text>
<text x="66" y="727" font-size="13.5" fill="#00806B" font-weight="800">Management: excision (conisation/LEEP) — the</text>
<text x="66" y="748" font-size="13.5" fill="#00806B" font-weight="800">guideline calls observation “unacceptable”</text>
<text x="90" y="779" font-size="13.5" fill="#00806B" font-weight="800">Properly treated (conisation/LEEP):</text>
<text x="90" y="801" font-size="13.5" fill="#00806B" font-weight="800">0.7% invasive within 30 years</text>
<circle cx="74" cy="783" r="4" fill="#00806B"/>
<text x="90" y="823" font-size="13.5" fill="#8F7418" font-weight="700">Untreated: 31.3% over 30 years</text>
<text x="90" y="845" font-size="13.5" fill="#8F7418" font-weight="700">(50.3% if the lesion persisted at 24 months)</text>
<text x="90" y="867" font-size="13.5" fill="#8F7418" font-weight="700">(New Zealand untreated cohort, 1,063 women)</text>
<circle cx="74" cy="819" r="4" fill="#96790F"/>
<line x1="44" y1="921" x2="576" y2="921" stroke="#8F7418" stroke-width="3" stroke-dasharray="9 7"/>
<text x="310" y="947" font-size="13.5" fill="#8F7418" font-weight="800" text-anchor="middle">Basement membrane — beyond this line</text>
<text x="310" y="967" font-size="13.5" fill="#8F7418" font-weight="800" text-anchor="middle">it is invasive cancer, and the road changes</text>
<rect x="44" y="987" width="532" height="233" rx="18" fill="#A98722" opacity="0.1"/>
<rect x="44" y="987" width="532" height="233" rx="18" fill="none" stroke="#C9A83E" stroke-width="1.5"/>
<text x="66" y="1021" font-size="16.5" fill="#123641" font-weight="800">Invasive cancer: a new road</text>
<text x="66" y="1049" font-size="14" fill="#123641" font-weight="800">IA1 (invasion ≤3 mm)</text>
<text x="66" y="1070" font-size="13.2" fill="#345963">conisation with clear margins can be </text>
<text x="66" y="1091" font-size="13.2" fill="#345963">curative</text>
<text x="66" y="1122" font-size="14" fill="#123641" font-weight="800">IA2 (&gt;3–≤5 mm)</text>
<text x="66" y="1143" font-size="13.2" fill="#345963">conisation or simple hysterectomy</text>
<text x="66" y="1174" font-size="14" fill="#123641" font-weight="800">≥IB</text>
<text x="66" y="1195" font-size="13.2" fill="#345963">staging and treatment routing take over</text>
<text x="44" y="1242" font-size="12.5" fill="#6B8084">Glandular lesions (AIS) follow their own rules: </text>
<text x="44" y="1261" font-size="12.5" fill="#6B8084">diagnostic conisation first, hysterectomy preferred </text>
<text x="44" y="1280" font-size="12.5" fill="#6B8084">(no reliable regression rate to plot).</text>
<text x="44" y="1313" font-size="12" fill="#6B8084">Schematic redrawn from Östör 1993, Tainio 2018,</text>
<text x="44" y="1333" font-size="12" fill="#6B8084">McCredie 2008, ASCCP 2019 / ESGO 2023</text>
  </g>
</svg>
