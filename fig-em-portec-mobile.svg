<text x="80" y="2398.12" font-size="14" fill="#345963">5 年的主要分析，總存活是 81.8% 對 76.7%，風險比 0.76，p＝0.11——沒</text>
<text x="80" y="2419.12" font-size="14" fill="#345963">有達到統計顯著。10 年那一頁的益處集中在第 III 期與漿液性組織型。</text>
<rect x="40" y="2498.12" width="540" height="241.35" rx="18" fill="none" stroke="#C9A83E" stroke-width="2.5"/>
<text x="66" y="2542.12" font-size="18" fill="#8F7418" font-weight="800">這張圖不是判準表，也不是給你自己對號入座用的</text>
<text x="66" y="2573.32" font-size="15.5" fill="#345963">三個試驗的收案條件、分期版本、風險族群都不一樣：PORTEC-1 沒有</text>
<text x="66" y="2597.35" font-size="15.5" fill="#345963">做淋巴結廓清，PORTEC-2 收的是高中度風險，PORTEC-3 收的是高</text>
<text x="66" y="2621.38" font-size="15.5" fill="#345963">風險。三格之間不可以直接比較。風險分組有正式的名字與定義，寫在</text>
<text x="66" y="2645.4" font-size="15.5" fill="#345963">正文裡；分組要同時看期別與版本、組織型、分化度、肌層侵犯、淋巴</text>
<text x="66" y="2669.43" font-size="15.5" fill="#345963">血管腔侵犯的量、有沒有做淋巴結分期，還有分子分型。這是要別人幫</text>
<text x="66" y="2693.45" font-size="15.5" fill="#345963">你算的問題。</text>
<text x="40" y="2763.48" font-size="15" fill="#527078">示意圖，依 PORTEC-1（Creutzberg 2000）、PORTEC-2（Nout 2010）、</text>
<text x="40" y="2785.98" font-size="15" fill="#527078">PORTEC-3 的 5 年最終結果（de Boer 2018）與 10 年結果（Post 2025）重繪；</text>
<text x="40" y="2808.48" font-size="15" fill="#527078">各研究族群、設計與終點不同，數點不可直接互比。</text>
