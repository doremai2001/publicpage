<text x="40" y="66" font-size="16" fill="#A98722" font-weight="800" letter-spacing="3px">THREE PORTEC TRIALS, THREE QUESTIONS</text>
<text x="40" y="118" font-size="40" fill="#123641" font-weight="800" class="r">三個 PORTEC，各回答一題</text>
<text x="40" y="178.4" font-size="19" fill="#527078">三個試驗問的不是同一個問題，收的也不是同一群人。每一格都</text>
<text x="40" y="206.9" font-size="19" fill="#527078">標了 n、族群與分期版本，因為換一群人，答案就換一個。</text>
<text x="40" y="239.4" font-size="19" fill="#527078">這張圖不是判準表：圖上沒有任何可以自己打勾的欄位，落在哪</text>
<text x="40" y="267.9" font-size="19" fill="#527078">一格由婦癌科與放射腫瘤科看完整病理報告一起判定。</text>
