<svg xmlns="http://www.w3.org/2000/svg" width="620" height="2845" viewBox="0 0 620 2845" role="img" aria-labelledby="t d">
  <title id="t">三個 PORTEC 試驗各回答一題：局部控制、範圍能不能縮小、加化療換到什麼</title>
  <desc id="d">示意圖：三個 PORTEC 試驗各回答一題，圖上沒有任何可以自己打勾的判準欄位。第一張大卡片是 PORTEC-1（n=715，FIGO 1988／2009 版第 1 期、類內膜、未做淋巴結廓清），問的是術後骨盆腔放療 46 Gy 換到什麼、付出什麼；三組橫條共用同一把 0 到 100% 的尺，每組上面一條是骨盆腔放療 46 Gy、下面一條是不做進一步治療。第一組是 5 年局部區域復發：放療 4%，觀察 14%，p 小於 0.001，放療組少 10 個百分點，這是放療真正買到的局部控制。第二組是 5 年整體存活：放療 81%，觀察 85%，p 等於 0.31，兩條一樣長；原文結論句是術後放療降低局部區域復發、對整體存活沒有影響。第三組是治療相關併發症：放療 25%，觀察 6%，p 小於 0.0001，放療組多 19 個百分點；三分之二是第 1 級，第 3 到 4 級併發症共 8 人、其中 7 人在放療組、佔該組 2%。卡片下方有一段字：三格要一起讀，只看第一格會讀成當然要照，只看第二格會讀成反正不延長存活，只看第三格會讀成放療很傷別碰；三格放在一起才是這個試驗的意思——放療買到的是局部控制，付出的是併發症，而它沒有把存活曲線拉開。第二張卡片是 PORTEC-2（n=427，高中度風險，FIGO 1988 版第 I 或 IIA 期），問的是可不可以把範圍縮小到只照陰道那一小段。5 年陰道復發：陰道近接治療 1.8%，骨盆腔外照射 46 Gy 分 23 次 1.6%，風險比 0.78（0.17 到 3.49），p 等於 0.74。旁邊畫了一把非劣性的尺：零點在左端，預設的非劣性邊界是 6 個百分點，觀察到的差值是加 0.2 個百分點，落在邊界之內。圖上寫著非劣性成立的意思是差值沒有超過事先講好的那條線，不是兩組一樣好；信賴區間 0.17 到 3.49 很寬，這個人數不足以證明兩者相同。同一張卡片另有一格誠實對照：5 年局部區域復發（陰道或骨盆腔）是近接治療 5.1% 對外照射 2.1%，風險比 2.08（0.71 到 6.09），p 等於 0.17，點估計不利於近接治療，只是沒有達到統計顯著；10 年的骨盆腔復發另有一張圖。第三張卡片是 PORTEC-3（n=660，高風險，FIGO 2009 版），問的是高風險的人在放療上面加化療換到什麼。10 年整體存活：化放療 74.4%，單純放療 67.3%。下面畫一條對數尺的風險比圖，虛線標出 1，校正後風險比 0.73、95% 信賴區間 0.54 到 0.97、p 等於 0.032，信賴區間沒有跨過 1。同一張卡片的誠實對照寫著：5 年的主要分析總存活是 81.8% 對 76.7%，風險比 0.76，p 等於 0.11，沒有達到統計顯著；10 年那一頁的益處集中在第 III 期與漿液性組織型。圖的最下面是一個金框方塊：這張圖不是判準表，也不是給你自己對號入座用的。三個試驗的收案條件、分期版本、風險族群都不一樣——PORTEC-1 沒有做淋巴結廓清，PORTEC-2 收的是高中度風險，PORTEC-3 收的是高風險，三格之間不可以直接比較。風險分組有正式的名字與定義，寫在正文裡；分組要同時看期別與版本、組織型、分化度、肌層侵犯、淋巴血管腔侵犯的量、有沒有做淋巴結分期，還有分子分型。這是要別人幫你算的問題。</desc>
