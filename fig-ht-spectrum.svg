<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">同樣叫「熱」，差幾度是不同的治療</title>
  <desc id="d">示意圖。溫度區間依 Datta 等 2015 綜述所載的臨床範圍繪製；圖中不標出各效應的溫度門檻，因為那要看組織與時間。 臨床熱治療使用的區間：血流增加、含氧量上升／組織間液的壓力下降／缺氧的癌細胞比較怕放射線了／細胞修復 DNA 的能力被干擾／缺氧、偏酸的區域直接受損／同樣的放射劑量，殺傷更多</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#123641" opacity=".14"/><line x1="0" y1="0" x2="0" y2="8" stroke="#123641" stroke-width="2.4" opacity=".85"/></pattern><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0B2832" flood-opacity=".12"/></filter><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="1000" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="86" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">TEMPERATURE</text>
<text x="84" y="148" font-size="44" fill="#123641" font-weight="800" class="r">同樣叫「熱」，差幾度是不同的治療</text>
<text x="84" y="204" font-size="21" fill="#527078">這個專題談的是攝氏 39 到 45 度那一段。</text>
<text x="84" y="234" font-size="21" fill="#527078">更高溫的燒灼是另一種治療，不在這裡。</text>
<rect x="92" y="310" width="96" height="560" rx="18" fill="#123641" opacity=".07" />
<rect x="92" y="590" width="96" height="280" rx="0" fill="#5C77C4" opacity=".28" />
<rect x="92" y="310" width="96" height="280" rx="0" fill="#A98722" opacity=".42" />
<rect x="92" y="310" width="96" height="560" rx="18" fill="none" stroke="#A98722" stroke-width="3" />
<line x1="82" y1="870" x2="198" y2="870" stroke="#123641" stroke-width="1.5" stroke-linecap="round" opacity=".35"/>
<text x="74" y="877" font-size="19" fill="#6B8084" font-weight="700" text-anchor="end">39°C</text>
<line x1="82" y1="683.333" x2="198" y2="683.333" stroke="#123641" stroke-width="1.5" stroke-linecap="round" opacity=".35"/>
<text x="74" y="690.333" font-size="19" fill="#6B8084" font-weight="700" text-anchor="end">41°C</text>
<line x1="82" y1="496.667" x2="198" y2="496.667" stroke="#123641" stroke-width="1.5" stroke-linecap="round" opacity=".35"/>
<text x="74" y="503.667" font-size="19" fill="#6B8084" font-weight="700" text-anchor="end">43°C</text>
<line x1="82" y1="310" x2="198" y2="310" stroke="#123641" stroke-width="1.5" stroke-linecap="round" opacity=".35"/>
<text x="74" y="317" font-size="19" fill="#6B8084" font-weight="700" text-anchor="end">45°C</text>
<line x1="222" y1="310" x2="222" y2="870" stroke="#A98722" stroke-width="5" stroke-linecap="round"/>
<text x="238" y="586" font-size="22" fill="#8F7418" font-weight="800">臨床熱治療使用的區間</text>
<rect x="704" y="310" width="700" height="172" rx="20" fill="#FFFFFF" opacity=".82" filter="url(#sh)"/>
<rect x="704" y="310" width="6" height="172" rx="3" fill="#A98722" />
<text x="730" y="350" font-size="25" fill="#123641" font-weight="800" class="r">溫度較高的一端</text>
<text x="730" y="388" font-size="20" fill="#527078">・細胞修復 DNA 的能力被干擾</text>
<text x="730" y="422" font-size="20" fill="#527078">・缺氧、偏酸的區域直接受損</text>
<text x="730" y="456" font-size="20" fill="#527078">・同樣的放射劑量，殺傷更多</text>
<rect x="704" y="504" width="700" height="172" rx="20" fill="#FFFFFF" opacity=".82" filter="url(#sh)"/>
<rect x="704" y="504" width="6" height="172" rx="3" fill="#5C77C4" />
<text x="730" y="544" font-size="25" fill="#123641" font-weight="800" class="r">溫度較低的一端</text>
<text x="730" y="582" font-size="20" fill="#527078">・血流增加、含氧量上升</text>
<text x="730" y="616" font-size="20" fill="#527078">・組織間液的壓力下降</text>
<text x="730" y="650" font-size="20" fill="#527078">・缺氧的癌細胞比較怕放射線了</text>
<line x1="704" y1="704" x2="1404" y2="704" stroke="#123641" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 9" opacity=".45"/>
<text x="704" y="692" font-size="16" fill="#6B8084" opacity=".9">中間這段刻意留白：39 度以下與 45 度以上之間，沒有一條乾淨的界線</text>
<rect x="704" y="726" width="700" height="172" rx="20" fill="#9A9282" opacity=".13" stroke="#9A9282" stroke-width="2" />
<text x="730" y="766" font-size="25" fill="#345963" font-weight="800" class="r">更高溫：燒灼</text>
<text x="730" y="804" font-size="20" fill="#6B8084">・細胞直接死亡，組織壞死</text>
<text x="730" y="838" font-size="20" fill="#6B8084">・射頻燒灼、微波燒灼、海扶刀</text>
<text x="730" y="872" font-size="20" fill="#6B8084">・這是另一種治療，不是本專題談的</text>
<text x="84" y="958" font-size="16" fill="#6B8084">示意圖。溫度區間依 Datta 等 2015 綜述所載的臨床範圍繪製；圖中不標出各效應的溫度門檻，因為那要看組織與時間。</text>
  </g>
</svg>
