<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1540" viewBox="0 0 720 1540" role="img" aria-labelledby="title desc">
  <title id="title">CT 與 MRI 應依臨床問題選擇</title><desc id="desc">下顎骨侵犯沒有看出 CT 與 MRI 明顯優劣；鼻咽與深部軟組織較偏向 MRI。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A2A35"/><stop offset="1" stop-color="#174653"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#001820" flood-opacity=".26"/></filter><style>.z{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Microsoft JhengHei",serif}.t{fill:#F5EFE6;font-size:46px;font-weight:900}.sub{fill:#B9CECD;font-size:22px}.ct{font-size:33px;font-weight:900}.body{font-size:21px}.metric{font-size:40px;font-weight:900}.sm{fill:#9CB4B4;font-size:17px}</style></defs>
  <rect width="720" height="1540" rx="34" fill="url(#bg)"/>
  <g class="z"><text x="48" y="65" fill="#D0B44F" font-size="17" font-weight="900" letter-spacing="4">CHOOSE BY THE QUESTION</text><text x="48" y="130" class="t r">CT 與 MRI</text><text x="48" y="187" class="t r">看題目，不看等級</text><text x="48" y="235" class="sub">腫瘤部位與臨床問題，才決定用哪一項。</text>
    <g filter="url(#s)"><rect x="48" y="285" width="624" height="455" rx="27" fill="#F4EFE3"/><circle cx="105" cy="344" r="34" fill="#C9A83E"/><path d="M88 344h34M105 327v34" stroke="#123641" stroke-width="5"/><text x="160" y="356" fill="#123641" class="ct">CT</text><text x="82" y="413" fill="#99791B" font-size="22" font-weight="900">骨頭、骨皮質與整體解剖</text><text x="82" y="465" fill="#48666D" class="body">• 口腔癌與下顎骨關係</text><text x="82" y="505" fill="#48666D" class="body">• 手術規劃與放療定位</text><text x="82" y="545" fill="#48666D" class="body">• 檢查速度較快、臨床普及</text><line x1="82" y1="585" x2="638" y2="585" stroke="#CDBF93" stroke-width="2"/><text x="82" y="627" fill="#123641" font-size="20">下顎骨侵犯整合分析</text><text x="82" y="685" fill="#123641" class="metric">76% / 89%</text><text x="340" y="682" fill="#627A7F" font-size="18">敏感度／特異度</text></g>
    <g filter="url(#s)"><rect x="48" y="775" width="624" height="455" rx="27" fill="#173F49" stroke="#52767C" stroke-width="2"/><circle cx="105" cy="834" r="34" fill="#C9A83E"/><path d="M88 825c16-17 32-8 34 7 2 17-15 28-34 16" fill="none" stroke="#123641" stroke-width="5"/><text x="160" y="846" fill="#F7F1E4" class="ct">MRI</text><text x="82" y="903" fill="#F2D879" font-size="22" font-weight="900">深部軟組織、神經與顱底</text><text x="82" y="955" fill="#D4E0DF" class="body">• 鼻咽癌、舌根與顱內延伸</text><text x="82" y="995" fill="#D4E0DF" class="body">• 神經周圍侵犯與骨髓訊號</text><text x="82" y="1035" fill="#D4E0DF" class="body">• 軟組織對比是主要優勢</text><line x1="82" y1="1075" x2="638" y2="1075" stroke="#52767C" stroke-width="2"/><text x="82" y="1117" fill="#D4E0DF" font-size="20">下顎骨侵犯整合分析</text><text x="82" y="1175" fill="#F7F1E4" class="metric">78% / 86%</text><text x="340" y="1172" fill="#9CB4B4" font-size="18">敏感度／特異度</text></g>
    <g filter="url(#s)"><rect x="48" y="1265" width="624" height="180" rx="25" fill="#F4EFE3"/><text x="82" y="1317" fill="#123641" font-size="25" font-weight="900">下顎骨這題：未見明顯優劣</text><text x="82" y="1364" fill="#527078" font-size="20">鼻咽、顱底或深部軟組織問題，</text><text x="82" y="1399" fill="#527078" font-size="20">才是 MRI 明顯更重要的場景。</text></g>
    <text x="48" y="1500" class="sm">資料來源：文章參考資料 [3][4]｜資訊圖為原創重繪</text>
  </g>
</svg>
