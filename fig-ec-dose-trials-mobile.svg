<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1864" viewBox="0 0 620 1864" role="img" aria-labelledby="t d">
  <title id="t">劑量升級試驗一覽：加到 60–66 Gy，沒有一個證明更好</title>
  <desc id="d">示意圖：食道癌放療劑量升級試驗一覽，每列兩條桿代表兩臂劑量。起點 RTOG 85-01（n=121，鱗癌加腺癌）：50 Gy 加 cisplatin/5-FU 對 64 Gy 放療單獨，5 年存活 26% 對 0%，劑量較低那一臂活得久是因為多了化療，嚴重與危及生命副作用 44%／20% 對 25%／3%。INT 0123（218 可分析，鱗癌加腺癌，cisplatin/5-FU）：50.4 對 64.8 Gy，2 年整體存活 40% 對 31% 無顯著差異，局部失敗 52% 對 56%，高劑量臂治療相關死亡 11 例對 2 例（7 例發生在小於等於 50.4 Gy 時）。ARTDECO（n=260，荷蘭，鱗癌 61%，每週 carboplatin/paclitaxel）：50.4 對 61.6 Gy，3 年局部 PFS 70% 對 73% 無顯著差異，G4／G5 毒性 12%／5% 對 14%／10%。CONCORDE／PRODIGE 26（n=217，法國，鱗癌 88%，FOLFOX，會議摘要）：50 對 66 Gy，2 年局部區域 PFS 42.7% 對 43.8%，中位整體存活 25.2 對 23.5 個月，毒性死亡 4.6% 對 6.7%。中國多中心（319 可分析，全鱗癌，每週 docetaxel/cisplatin）：50 對 60 Gy，3 年局部區域 PFS 48.4% 對 49.5%，3 年整體存活 52.7% 對 53.1%，8 年局部區域 PFS 36.3% 對 32.7%，G3 以上放射性肺炎 60 Gy 組較高。四個劑量升級試驗全部標「加量未證明更好」。日本自己把標準從 60 Gy 改回 50.4 Gy。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="620" height="1864" rx="30" fill="url(#bg)"/>
  <g class="z">
<text x="44" y="62" font-size="14" fill="#A98722" font-weight="800" letter-spacing="3.5px">DOSE ESCALATION — FIVE RANDOMISED READOUTS</text>
<text x="44" y="112" font-size="30" fill="#123641" font-weight="800" class="r">劑量升級試驗一覽：加到 60–66 Gy，</text>
<text x="44" y="152" font-size="30" fill="#123641" font-weight="800" class="r">沒有一個證明更好</text>
<text x="44" y="194" font-size="14.5" fill="#527078">每一列是一個隨機試驗：兩條桿是兩臂的放療劑量，右邊寫主要結果的方向。族群</text>
<text x="44" y="216" font-size="14.5" fill="#527078">與化療方案寫在列下，不同列不能互比。</text>
<text x="44" y="238" font-size="14.5" fill="#527078">起點那一列不是劑量升級試驗——它說明為什麼標準是「50 Gy 加化療」，而不是更</text>
<text x="44" y="260" font-size="14.5" fill="#527078">高的純放療。</text>
<g filter="url(#sh)"><rect x="44" y="294" width="532" height="261.52" rx="18" fill="#E3E8F6"/></g>
<text x="62" y="325.18" font-size="15.5" fill="#123641" font-weight="800">起點｜RTOG 85-01（Herskovic 1992／Cooper 1999）</text>
<text x="62" y="347.55" font-size="12.5" fill="#6B8084">n=121 隨機，鱗癌＋腺癌，胸段</text>
<rect x="62" y="366.43" width="496" height="22" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="62" y="366.43" width="354.29" height="22" rx="4" fill="#5C77C4" opacity="0.9"/>
<line x1="416.29" y1="364.43" x2="416.29" y2="390.43" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.5"/>
<text x="72" y="381.93" font-size="12.5" fill="#FFFFFF" font-weight="800">50 Gy＋cisplatin/5-FU</text>
<rect x="62" y="398.43" width="496" height="22" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="62" y="398.43" width="453.49" height="22" rx="4" fill="#96790F" opacity="0.9"/>
<line x1="416.29" y1="396.43" x2="416.29" y2="422.43" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.5"/>
<text x="72" y="413.93" font-size="12.5" fill="#FFFFFF" font-weight="800">64 Gy 放療單獨</text>
<text x="416.29" y="438.43" font-size="11.5" fill="#6B8084" text-anchor="middle">50 Gy</text>
<text x="62" y="461" font-size="14.8" fill="#123641" font-weight="800">5 年存活 26% 對 0%</text>
<text x="62" y="479.77" font-size="12.5" fill="#345963">劑量較低那一臂活得久——因為多了化療；代價：嚴重／危及生命副作用 44%／20% 對 25%／</text>
<text x="62" y="497.9" font-size="12.5" fill="#345963">3%</text>
<rect x="62" y="513.39" width="145.13" height="20.12" rx="10.06" fill="#5C77C4"/>
<text x="134.56" y="527.6" font-size="11.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">化療的效應，不是劑量的</text>
<g filter="url(#sh)"><rect x="44" y="569.52" width="532" height="261.52" rx="18" fill="#FFFFFF"/></g>
<text x="62" y="600.69" font-size="15.5" fill="#123641" font-weight="800">INT 0123／RTOG 94-05（Minsky 2002）</text>
<text x="62" y="623.07" font-size="12.5" fill="#6B8084">218 可分析，鱗癌＋腺癌，T1–4 N0/1，cisplatin/5-FU</text>
<rect x="62" y="641.94" width="496" height="22" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="62" y="641.94" width="357.12" height="22" rx="4" fill="#5C77C4" opacity="0.9"/>
<line x1="416.29" y1="639.94" x2="416.29" y2="665.94" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.5"/>
<text x="72" y="657.44" font-size="12.5" fill="#FFFFFF" font-weight="800">50.4 Gy</text>
<rect x="62" y="673.94" width="496" height="22" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="62" y="673.94" width="459.15" height="22" rx="4" fill="#96790F" opacity="0.9"/>
<line x1="416.29" y1="671.94" x2="416.29" y2="697.94" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.5"/>
<text x="72" y="689.44" font-size="12.5" fill="#FFFFFF" font-weight="800">64.8 Gy</text>
<text x="416.29" y="713.94" font-size="11.5" fill="#6B8084" text-anchor="middle">50 Gy</text>
<text x="62" y="736.52" font-size="14.8" fill="#123641" font-weight="800">2 年 OS 40% 對 31%（無顯著差異）</text>
<text x="62" y="755.29" font-size="12.5" fill="#345963">中位存活 18.1 對 13.0 個月；局部失敗／持續 52% 對 56%；高劑量臂 11 例治療相關死亡</text>
<text x="62" y="773.41" font-size="12.5" fill="#345963">對 2 例（7 例發生在 ≤50.4 Gy 時）；期中分析後停止</text>
<rect x="62" y="788.91" width="203.78" height="20.12" rx="10.06" fill="#9A9282"/>
<text x="163.89" y="803.12" font-size="11.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">加量未證明更好；高劑量臂死亡較多</text>
<g filter="url(#sh)"><rect x="44" y="845.04" width="532" height="261.52" rx="18" fill="#FFFFFF"/></g>
<text x="62" y="876.21" font-size="15.5" fill="#123641" font-weight="800">ARTDECO（Hulshof 2021）</text>
<text x="62" y="898.59" font-size="12.5" fill="#6B8084">n=260，荷蘭，鱗癌 61%／腺癌 39%，每週 carboplatin/paclitaxel</text>
<rect x="62" y="917.46" width="496" height="22" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="62" y="917.46" width="357.12" height="22" rx="4" fill="#5C77C4" opacity="0.9"/>
<line x1="416.29" y1="915.46" x2="416.29" y2="941.46" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.5"/>
<text x="72" y="932.96" font-size="12.5" fill="#FFFFFF" font-weight="800">50.4 Gy</text>
<rect x="62" y="949.46" width="496" height="22" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="62" y="949.46" width="436.48" height="22" rx="4" fill="#96790F" opacity="0.9"/>
<line x1="416.29" y1="947.46" x2="416.29" y2="973.46" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.5"/>
<text x="72" y="964.96" font-size="12.5" fill="#FFFFFF" font-weight="800">61.6 Gy（原發腫瘤加量）</text>
<text x="416.29" y="989.46" font-size="11.5" fill="#6B8084" text-anchor="middle">50 Gy</text>
<text x="62" y="1012.04" font-size="14.8" fill="#123641" font-weight="800">3 年局部 PFS 70% 對 73%（無顯著差異）</text>
<text x="62" y="1030.81" font-size="12.5" fill="#345963">鱗癌 75% 對 79%、腺癌 61% 對 61%；G4／G5 毒性 12%／5% 對 14%／10%（p=0.15</text>
<text x="62" y="1048.93" font-size="12.5" fill="#345963">）；放療完成率 94%</text>
<rect x="62" y="1064.43" width="98.21" height="20.12" rx="10.06" fill="#9A9282"/>
<text x="111.11" y="1078.64" font-size="11.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">加量未證明更好</text>
<g filter="url(#sh)"><rect x="44" y="1120.56" width="532" height="243.4" rx="18" fill="#FFFFFF"/></g>
<text x="62" y="1151.73" font-size="15.5" fill="#123641" font-weight="800">CONCORDE／PRODIGE 26（Crehange 2021）</text>
<text x="62" y="1174.11" font-size="12.5" fill="#6B8084">n=217，法國，鱗癌 88%，FOLFOX</text>
<rect x="62" y="1192.98" width="496" height="22" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="62" y="1192.98" width="354.29" height="22" rx="4" fill="#5C77C4" opacity="0.9"/>
<line x1="416.29" y1="1190.98" x2="416.29" y2="1216.98" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.5"/>
<text x="72" y="1208.48" font-size="12.5" fill="#FFFFFF" font-weight="800">50 Gy／25 次</text>
<rect x="62" y="1224.98" width="496" height="22" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="62" y="1224.98" width="467.66" height="22" rx="4" fill="#96790F" opacity="0.9"/>
<line x1="416.29" y1="1222.98" x2="416.29" y2="1248.98" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.5"/>
<text x="72" y="1240.48" font-size="12.5" fill="#FFFFFF" font-weight="800">66 Gy／33 次</text>
<text x="416.29" y="1264.98" font-size="11.5" fill="#6B8084" text-anchor="middle">50 Gy</text>
<text x="62" y="1287.56" font-size="14.8" fill="#123641" font-weight="800">2 年局部區域 PFS 42.7% 對 43.8%（HR 1.03）</text>
<text x="62" y="1306.33" font-size="12.5" fill="#345963">中位 OS 25.2 對 23.5 個月（HR 1.14，p=0.44）；毒性死亡 4.6% 對 6.7%</text>
<rect x="62" y="1321.83" width="180.32" height="20.12" rx="10.06" fill="#9A9282"/>
<text x="152.16" y="1336.03" font-size="11.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">加量未證明更好｜會議摘要層級</text>
<g filter="url(#sh)"><rect x="44" y="1377.95" width="532" height="261.52" rx="18" fill="#FFFFFF"/></g>
<text x="62" y="1409.13" font-size="15.5" fill="#123641" font-weight="800">中國多中心 50 對 60 Gy（Xu 2022；Cheng 2026 長期）</text>
<text x="62" y="1431.5" font-size="12.5" fill="#6B8084">319 可分析，全鱗癌，IIA–IVA，每週 docetaxel/cisplatin</text>
<rect x="62" y="1450.38" width="496" height="22" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="62" y="1450.38" width="354.29" height="22" rx="4" fill="#5C77C4" opacity="0.9"/>
<line x1="416.29" y1="1448.38" x2="416.29" y2="1474.38" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.5"/>
<text x="72" y="1465.88" font-size="12.5" fill="#FFFFFF" font-weight="800">50 Gy</text>
<rect x="62" y="1482.38" width="496" height="22" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="62" y="1482.38" width="425.14" height="22" rx="4" fill="#96790F" opacity="0.9"/>
<line x1="416.29" y1="1480.38" x2="416.29" y2="1506.38" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.5"/>
<text x="72" y="1497.88" font-size="12.5" fill="#FFFFFF" font-weight="800">60 Gy</text>
<text x="416.29" y="1522.38" font-size="11.5" fill="#6B8084" text-anchor="middle">50 Gy</text>
<text x="62" y="1544.96" font-size="14.8" fill="#123641" font-weight="800">3 年局部區域 PFS 48.4% 對 49.5%（HR 1.00）</text>
<text x="62" y="1563.72" font-size="12.5" fill="#345963">3 年 OS 52.7% 對 53.1%；中位追蹤 99.5 個月：8 年局部區域 PFS 36.3% 對 32.7%（</text>
<text x="62" y="1581.85" font-size="12.5" fill="#345963">HR 1.06）；G3+ 放射性肺炎 60 Gy 組較高（p=0.03）</text>
<rect x="62" y="1597.35" width="181.64" height="20.12" rx="10.06" fill="#9A9282"/>
<text x="152.82" y="1611.55" font-size="11.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">加量未證明更好；G3+ 肺炎較多</text>
<rect x="44" y="1657.47" width="16" height="16" rx="5" fill="#5C77C4" opacity="0.9"/>
<text x="68" y="1670.47" font-size="12.5" fill="#345963" font-weight="600">標準臂劑量</text>
<rect x="157.75" y="1657.47" width="16" height="16" rx="5" fill="#96790F" opacity="0.9"/>
<text x="181.75" y="1670.47" font-size="12.5" fill="#345963" font-weight="600">高劑量臂</text>
<text x="44" y="1707.97" font-size="12.5" fill="#6B8084" font-weight="600">日本自己也把標準從 60 Gy（JCOG0303）改回 50.4 Gy（JCOG0909），理由原文：「減少不</text>
<text x="44" y="1726.1" font-size="12.5" fill="#6B8084" font-weight="600">良事件與救援手術的風險」。「未證明更好」不等於「證明相等」——各試驗信賴區間都寬；</text>
<text x="44" y="1744.22" font-size="12.5" fill="#6B8084" font-weight="600">ESO-Shanghai 12 仍在用 PET 反應分層測 61.2 對 50.4 Gy。</text>
<text x="44" y="1784.35" font-size="12" fill="#6B8084">示意圖，依 Herskovic 1992、Cooper 1999、Minsky 2002、Hulshof 2021、Crehange 2021（</text>
<text x="44" y="1802.35" font-size="12" fill="#6B8084">ASTRO 會議摘要）、Xu 2022、Cheng 2026 與 JES 2022 指引重繪｜各試驗族群、化療方案與終點</text>
<text x="44" y="1820.35" font-size="12" fill="#6B8084">不同，列與列之間不可直接互比</text>
  </g>
</svg>
