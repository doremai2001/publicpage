<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Can the energy reach your tumour?</title>
  <desc id="d">No centimetre figures are drawn: achievable depth depends on device, body habitus and site. Ask your team for the number. Infrared / surface heating；Microwave (superficial applicator)；RF capacitive / phased array (deep)；Focused ultrasound</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#123641" opacity=".14"/><line x1="0" y1="0" x2="0" y2="8" stroke="#123641" stroke-width="2.4" opacity=".85"/></pattern><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0B2832" flood-opacity=".12"/></filter><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="860" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="86" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">PENETRATION</text>
<text x="84" y="148" font-size="44" fill="#123641" font-weight="800" class="r">Can the energy reach your tumour?</text>
<text x="84" y="204" font-size="21" fill="#527078">Heating is an engineering problem: energy must cross skin, fat and muscle.</text>
<text x="84" y="234" font-size="21" fill="#527078">Different devices reach different depths — that is the first question to ask.</text>
<rect x="84" y="308" width="316" height="330" rx="0" fill="#123641" opacity=".05" />
<line x1="84" y1="308" x2="84" y2="638" stroke="#123641" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 7" opacity=".28"/>
<text x="96" y="668" font-size="19" fill="#6B8084" font-weight="700">Skin</text>
<rect x="402" y="308" width="316" height="330" rx="0" fill="#123641" opacity=".05" />
<line x1="402" y1="308" x2="402" y2="638" stroke="#123641" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 7" opacity=".28"/>
<text x="414" y="668" font-size="19" fill="#6B8084" font-weight="700">Subcutaneous fat</text>
<rect x="720" y="308" width="316" height="330" rx="0" fill="#123641" opacity=".05" />
<line x1="720" y1="308" x2="720" y2="638" stroke="#123641" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 7" opacity=".28"/>
<text x="732" y="668" font-size="19" fill="#6B8084" font-weight="700">Muscle</text>
<rect x="1038" y="308" width="316" height="330" rx="0" fill="#123641" opacity=".05" />
<line x1="1038" y1="308" x2="1038" y2="638" stroke="#123641" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 7" opacity=".28"/>
<text x="1050" y="668" font-size="19" fill="#6B8084" font-weight="700">Deep organs</text>
<rect x="84" y="308" width="1272" height="330" rx="16" fill="none" stroke="#123641" stroke-width="1.6" />
<rect x="88" y="334" width="165.36" height="36" rx="8" fill="#5C77C4" opacity=".88" />
<text x="100" y="358" font-size="18" fill="#FFFFFF" font-weight="700">Infrared / surface heating</text>
<rect x="88" y="404" width="381.6" height="36" rx="8" fill="#5C77C4" opacity=".88" />
<text x="100" y="428" font-size="18" fill="#FFFFFF" font-weight="700">Microwave (superficial applicator)</text>
<rect x="88" y="474" width="1170.24" height="36" rx="8" fill="#A98722" opacity=".88" />
<text x="100" y="498" font-size="18" fill="#FFFFFF" font-weight="700">RF capacitive / phased array (deep)</text>
<rect x="88" y="544" width="788.64" height="36" rx="8" fill="#00806B" opacity=".88" />
<text x="100" y="568" font-size="18" fill="#FFFFFF" font-weight="700">Focused ultrasound</text>
<rect x="872.64" y="614" width="381.6" height="36" rx="8" fill="#00806B" opacity=".22" stroke="#00806B" stroke-width="2" />
<text x="888.64" y="638" font-size="16" fill="#00806B" font-weight="800">◆</text>
<text x="910.64" y="638" font-size="16" fill="#00604F" font-weight="700">Placed inside</text>
<text x="84" y="716" font-size="20" fill="#527078">Placed inside: interstitial probes or magnetic nanoparticles</text>
<text x="84" y="746" font-size="20" fill="#527078">reach the tumour without crossing the surface</text>
<rect x="84" y="784" width="1272" height="2" rx="1" fill="#A98722" opacity=".5" />
<text x="84" y="818" font-size="19" fill="#345963" font-weight="700">No centimetre figures are drawn: achievable depth depends on</text>
<text x="84" y="847" font-size="19" fill="#345963" font-weight="700">device, body habitus and site. Ask your team for the number.</text>
<text x="84" y="824" font-size="16" fill="#6B8084">Schematic, redrawn from the technique classification in Kok et al. 2020.</text>
  </g>
</svg>
