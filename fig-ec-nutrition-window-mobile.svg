<g filter="url(#sh)"><rect x="44" y="1198.4" width="532" height="133.12" rx="18" fill="#FFFFFF"/></g>
<rect x="62" y="1216.4" width="55.75" height="21.88" rx="10.94" fill="#5C77C4"/>
<text x="89.88" y="1231.84" font-size="12.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">鼻胃管</text>
<text x="62" y="1264.6" font-size="12" fill="#345963">醫療端：不需麻醉、放最快、隨時可拔；移位風險比 PEG 高（ESPEN）；誤入呼吸道要有確</text>
<text x="62" y="1281.64" font-size="12" fill="#345963">認流程（ESGE）</text>
<text x="62" y="1306.68" font-size="12" fill="#345963">臨床端：吞嚥較少受影響、放療結束後較早脫離（ESPEN）；臉上看得到</text>
<g filter="url(#sh)"><rect x="44" y="1343.52" width="532" height="150.16" rx="18" fill="#FFFFFF"/></g>
<rect x="62" y="1361.52" width="86.02" height="21.88" rx="10.94" fill="#96790F"/>
<text x="105.01" y="1376.96" font-size="12.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">胃造廔 PEG</text>
<text x="62" y="1409.72" font-size="12" fill="#345963">醫療端：內視鏡下放置；食道狹窄時用 introducer（push）法避免拉過腫瘤（ESGE）；4 篇</text>
<text x="62" y="1426.76" font-size="12" fill="#345963">回溯 n=1,027 統合：滲漏、狹窄、併發症、住院天數皆無差，無 PEG 部位滲漏（Fang</text>
<text x="62" y="1443.8" font-size="12" fill="#345963">2022）；1/96 PEG 部位切片為惡性（Bhatti 2015）</text>
<text x="62" y="1468.84" font-size="12" fill="#345963">臨床端：移位少、生活品質可能較好（ESPEN）；在衣服底下</text>
<g filter="url(#sh)"><rect x="44" y="1505.68" width="532" height="133.12" rx="18" fill="#FFFFFF"/></g>
<rect x="62" y="1523.68" width="94" height="21.88" rx="10.94" fill="#00806B"/>
<text x="109" y="1539.12" font-size="12.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">餵食空腸造廔</text>
<text x="62" y="1571.88" font-size="12" fill="#345963">醫療端：腹腔鏡或開腹下放置、多在手術中；統合（Shen 2021）：腸阻塞約 6%（其中 &gt;</text>
<text x="62" y="1588.92" font-size="12" fill="#345963">63% 需再手術）、部位感染 7%、功能不良 7%；常規放置的好處未被證明（Mei 2021）</text>
<text x="62" y="1613.96" font-size="12" fill="#345963">臨床端：術後回家可繼續灌 6 週（小型 RCT n=41：體重掉 &gt;5% 28% 對 82%）</text>
<text x="44" y="1663.3" font-size="12.5" fill="#6B8084" font-weight="600">先放管路對結果有沒有幫助，回溯資料是雙向的（美國兩個外科世代看不出；台灣成大只在腫瘤</text>
<text x="44" y="1681.43" font-size="12.5" fill="#6B8084" font-weight="600">佔管腔 ≥70% 者看得出）——「誰該先放」比「要不要放」更接近真問題。健保：05101B 一般</text>
<text x="44" y="1699.55" font-size="12.5" fill="#6B8084" font-weight="600">灌食適用症明列食道癌；33108B PEG 備註未寫食道癌也未排除、47058B 支架有給付≠建議做</text>
<text x="44" y="1717.68" font-size="12.5" fill="#6B8084" font-weight="600">——問醫務課／個管師。</text>
<text x="44" y="1757.8" font-size="12" fill="#6B8084">示意圖，依 ESPEN 2021 癌症營養與外科營養實務指引、ESGE 2021 腸道管路指引（第 1、2 部</text>
<text x="44" y="1775.8" font-size="12" fill="#6B8084">）、ESGE 2021 食道支架指引、van der Schaaf 2014、Aoyama 2023（OGSG1003）、Huerter</text>
<text x="44" y="1793.8" font-size="12" fill="#6B8084">2016、Chiang 2026、Fang 2022、Bhatti 2015、Shen 2021、Mei 2021、Mariette 2015 與</text>
<text x="44" y="1811.8" font-size="12" fill="#6B8084">Baker 2015 重繪｜各研究族群、設計與終點不同，數字不可直接互比；管路種類由團隊依你的情況</text>
<text x="44" y="1829.8" font-size="12" fill="#6B8084">決定</text>
