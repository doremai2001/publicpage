  <rect width="620" height="1874" rx="30" fill="url(#bg)"/>
  <g class="z">
<text x="44" y="62" font-size="14" fill="#A98722" font-weight="800" letter-spacing="3.5px">WEIGHT × FEEDING ROUTE × TIME</text>
<text x="44" y="112" font-size="30" fill="#123641" font-weight="800" class="r">體重與管路的時間窗：三種管路，指引</text>
<text x="44" y="152" font-size="30" fill="#123641" font-weight="800" class="r">各給了一個位置</text>
<text x="44" y="194" font-size="14.5" fill="#527078">上半是時間軸：掉一成體重是啟動評估的門檻，不是放管指令；三種管路在指引裡</text>
<text x="44" y="216" font-size="14.5" fill="#527078">各有自己的時間點與前提。下半是入口位置。</text>
<text x="44" y="238" font-size="14.5" fill="#527078">沒有一種「最好」；支架不是化放療前的解法。</text>
