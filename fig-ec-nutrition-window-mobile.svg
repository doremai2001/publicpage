<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1874" viewBox="0 0 620 1874" role="img" aria-labelledby="t d">
  <title id="t">體重與管路的時間窗：三種管路，指引各給了一個位置</title>
  <desc id="d">示意圖：體重與管路決策的時間窗，加三種管路的身體位置。上半時間軸分四段：診斷到治療前評估、化放療 5 到 6 週、（三合一）等待與手術、術後回家；體重示意曲線緩降，橫線標「掉 10%」是啟動評估與營養師介入的門檻（ESPEN 措辭），不是放管指令。標註：診斷前 3 個月掉超過 10% 的人佔 17%（鹿特丹手術世代 n=922），5 年死亡 HR 1.34、併發症沒有增加；化療期間掉超過 5% 者術後感染併發症 OR 2.69（OGSG1003 鱗癌 n=134）；術前治療者 80% 有吞嚥困難、48% 放了管路、其中 27.9% 沒好好用（n=127）；化放療後惡病質 60.7%，治療前造口只在腫瘤佔管腔大於等於 70% 者看得出好處（成大 n=260）。四條管路橫桿：鼻胃管，預期腸道營養小於 4 週（ESGE 2021）；胃造廔 PEG，預期大於 4 週、胃路徑優先（ESGE），對後續胃管重建無差（統合 n=1,027）；餵食空腸造廔，上消化道大手術術中考慮（ESPEN 外科 Rec 23，Grade B），ESGE 只在胃不可用、排空差、高吸入風險時選空腸；金屬支架畫成虛線打叉，ESGE 2021 不建議作為術前或化放療前橋接，Mariette 2015 配對 R0 71.0% 對 85.5%、3 年整體存活 25% 對 44%。下半人形側面：鼻胃管由鼻經食道進胃；PEG 由腹壁進胃；空腸造廔由腹壁進空腸。三格好壞：鼻胃管不需麻醉、隨時可拔、移位較多、吞嚥較少受影響、放療後較早脫離；PEG 內視鏡下放置、狹窄時用 introducer 法、統合顯示滲漏狹窄併發症住院天數皆無差、1/96 PEG 部位切片惡性、移位少、生活品質可能較好；空腸造廔腹腔鏡或開腹放置、腸阻塞約 6%（其中超過 63% 需再手術）、部位感染 7%、功能不良 7%、常規放置好處未證明、術後居家灌食 6 週體重掉超過 5% 的比例 28% 對 82%（n=41）。</desc>
