<rect x="63" y="416" width="103.21" height="26" rx="6" fill="#ECE8DE"/>
<text x="114.61" y="434" font-size="12" fill="#123641" font-weight="800" text-anchor="middle">診斷 → 治療前評估</text>
<rect x="168.21" y="416" width="163.33" height="26" rx="6" fill="#E3E8F6"/>
<text x="249.88" y="434" font-size="12" fill="#123641" font-weight="800" text-anchor="middle">化放療 5–6 週</text>
<rect x="333.55" y="416" width="103.21" height="26" rx="6" fill="#ECE8DE"/>
<text x="385.15" y="434" font-size="12" fill="#123641" font-weight="800" text-anchor="middle">（三合一）等待與手術</text>
<rect x="438.76" y="416" width="118.24" height="26" rx="6" fill="#D8EDE7"/>
<text x="497.88" y="434" font-size="12" fill="#123641" font-weight="800" text-anchor="middle">術後、回家</text>
<rect x="77.03" y="460" width="105.21" height="18" rx="9" fill="#5C77C4" opacity="0.9"/>
<text x="190.24" y="474" font-size="12" fill="#5C77C4" font-weight="800" text-anchor="start">鼻胃管</text>
<text x="62" y="494.2" font-size="12" fill="#345963">預期腸道營養 &lt;4 週（ESGE 2021）；ESPEN 放療段點名鼻胃管或 PEG</text>
<rect x="99.58" y="510.8" width="338.18" height="18" rx="9" fill="#96790F" opacity="0.9"/>
<text x="445.76" y="524.8" font-size="12" fill="#96790F" font-weight="800" text-anchor="start">胃造廔 PEG</text>
<text x="62" y="545" font-size="12" fill="#345963">預期 &gt;4 週：考慮經皮管路，胃路徑優先（ESGE 2021）；PEG 對後續胃管重建無差（統合</text>
<text x="62" y="561.8" font-size="12" fill="#345963">n=1,027）</text>
<rect x="355.09" y="578.4" width="202.91" height="18" rx="9" fill="#00806B" opacity="0.9"/>
<text x="347.09" y="592.4" font-size="12" fill="#00806B" font-weight="800" text-anchor="end">餵食空腸造廔</text>
<text x="62" y="612.6" font-size="12" fill="#345963">上消化道大手術時術中考慮（ESPEN 外科 Rec 23，Grade B）；ESGE：胃不可用、排空</text>
<text x="62" y="629.4" font-size="12" fill="#345963">差、高吸入風險才選空腸</text>
<rect x="77.03" y="646" width="97.7" height="18" rx="9" fill="none" stroke="#B04A4A" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="119.88" y1="649" x2="131.88" y2="661" stroke="#B04A4A" stroke-width="2.5" stroke-linecap="round"/>
<line x1="131.88" y1="649" x2="119.88" y2="661" stroke="#B04A4A" stroke-width="2.5" stroke-linecap="round"/>
<text x="182.73" y="660" font-size="12" fill="#B04A4A" font-weight="800" text-anchor="start">金屬支架</text>
<text x="62" y="680.2" font-size="12" fill="#345963">ESGE 2021：不建議作為術前或化放療前的橋接（強建議）。Mariette 2015 配對：R0</text>
<text x="62" y="697" font-size="12" fill="#345963">71.0% 對 85.5%、3 年 OS 25% 對 44%</text>
<circle cx="70" cy="726.2" r="8" fill="#96790F"/>
<text x="70" y="729.7" font-size="10.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">1</text>
<text x="86" y="729.8" font-size="12" fill="#345963">診斷前 3 個月掉 &gt;10%：17% 的人（鹿特丹手術世代 n=922）→ 5 年死亡 HR 1.34；併</text>
<text x="86" y="746.6" font-size="12" fill="#345963">發症沒有增加</text>
<circle cx="70" cy="767.8" r="8" fill="#96790F"/>
<text x="70" y="771.3" font-size="10.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">2</text>
<text x="86" y="771.4" font-size="12" fill="#345963">化療期間掉 &gt;5% → 術後感染併發症 OR 2.69（OGSG1003，鱗癌 n=134）</text>
<circle cx="70" cy="792.6" r="8" fill="#6B8084"/>
<text x="70" y="796.1" font-size="10.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">3</text>
<text x="86" y="796.2" font-size="12" fill="#345963">術前治療者 80% 有吞嚥困難、48% 放了管路，其中 27.9% 沒好好用（n=127）</text>
<circle cx="70" cy="817.4" r="8" fill="#6B8084"/>
<text x="70" y="820.9" font-size="10.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">4</text>
<text x="86" y="821" font-size="12" fill="#345963">化放療後惡病質 60.7%；治療前造口只在腫瘤佔管腔 ≥70% 者看得出好處（成大</text>
<text x="86" y="837.8" font-size="12" fill="#345963">n=260）</text>
