<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1982" viewBox="0 0 720 1982" role="img" aria-labelledby="t d">
  <title id="t">四種技術 × 四地的法規與給付身分</title>
  <desc id="d">表格：質子、碳離子（重粒子）、FLASH、BNCT在台灣、美國、歐盟、日本的身分。質子：台灣自費常規（未滿19歲有三項健保）、美歐機器許可、日本多項適應症納保。碳離子：台灣自費常規且健保零項目、美國無路徑、歐盟有中心、日本納保多項。FLASH：台灣連註冊試驗都沒有、美歐試驗中、日本不明。BNCT：台灣試驗中另有專案性質緊急管道、美國無核准硼藥、歐盟查無紀錄、日本就頭頸癌有藥證與給付。資料時點2026年8月。</desc>
