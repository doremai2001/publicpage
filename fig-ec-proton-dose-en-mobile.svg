<text x="68" y="662" font-size="12" fill="#345963">Each beam keeps going after the tumour: a low-dose bath over both lungs and the heart</text>
<circle cx="315.2" cy="596" r="15.6" fill="#F1DDDD" stroke="#B04A4A" stroke-width="2"/>
<circle cx="315.2" cy="596" r="7.15" fill="#B04A4A"/>
<text x="407.5" y="464.7" font-size="12" fill="#6B8084" font-weight="700" text-anchor="middle">Lung</text>
