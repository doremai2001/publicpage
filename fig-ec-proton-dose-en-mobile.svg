<text x="337.3" y="600" font-size="12" fill="#B04A4A" font-weight="800">Tumour</text>
<text x="310" y="445.2" font-size="11" fill="#6B8084" text-anchor="middle">Anterior (sternum)</text>
<text x="142.3" y="553.2" font-size="12" fill="#6B8084" font-weight="700" text-anchor="end">R</text>
