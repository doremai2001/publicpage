<text x="68" y="1008" font-size="12" fill="#345963">The beam stops at the Bragg peak: almost no exit dose (schematic, not a real dose distribution)</text>
<circle cx="315.2" cy="942" r="15.6" fill="#F1DDDD" stroke="#B04A4A" stroke-width="2"/>
<circle cx="315.2" cy="942" r="7.15" fill="#B04A4A"/>
<text x="407.5" y="810.7" font-size="12" fill="#6B8084" font-weight="700" text-anchor="middle">Lung</text>
<text x="212.5" y="810.7" font-size="12" fill="#6B8084" font-weight="700" text-anchor="middle">Lung</text>
<text x="358.75" y="891.95" font-size="12" fill="#8E5A5A" font-weight="700" text-anchor="middle">Heart</text>
<text x="310" y="981.65" font-size="11" fill="#7A6E58" font-weight="700" text-anchor="middle">Spine</text>
<text x="337.3" y="946" font-size="12" fill="#B04A4A" font-weight="800">Tumour</text>
<text x="310" y="791.2" font-size="11" fill="#6B8084" text-anchor="middle">Anterior (sternum)</text>
<text x="142.3" y="899.2" font-size="12" fill="#6B8084" font-weight="700" text-anchor="end">R</text>
<text x="477.7" y="899.2" font-size="12" fill="#6B8084" font-weight="700" text-anchor="start">L</text>
<g filter="url(#sh)"><rect x="44" y="1050" width="532" height="273.5" rx="18" fill="#FFFFFF"/></g>
<rect x="54" y="1064" width="5" height="245.5" rx="2.5" fill="#96790F"/>
<text x="62" y="1078.62" font-size="12.5" fill="#123641" font-weight="800">Dosimetry: Zhang 2008 (MD Anderson, 15 distal oesophageal cancers, 4D-CT</text>
<text x="62" y="1096.12" font-size="12.5" fill="#123641" font-weight="800">planning comparison)</text>
<circle cx="66" cy="1119.25" r="3" fill="#96790F"/>
<text x="76" y="1123.62" font-size="12.5" fill="#345963">Lung V5: two-beam protons 35.6% lower than IMRT, three-beam 17.4% lower</text>
<circle cx="66" cy="1143.38" r="3" fill="#96790F"/>
<text x="76" y="1147.75" font-size="12.5" fill="#345963">Mean lung dose: 5.1 Gy (two-beam) / 2.9 Gy (three-beam) lower</text>
<circle cx="66" cy="1167.5" r="3" fill="#96790F"/>
<text x="76" y="1171.88" font-size="12.5" fill="#345963">Heart V40: IMRT 35.7%, two-beam protons 41.8% (higher), three-beam</text>
<text x="76" y="1190" font-size="12.5" fill="#345963">27.7% — sparing lung and sparing heart trade off</text>
<text x="62" y="1223" font-size="11.5" fill="#6B8084" font-weight="700">Heart V40 (%, Zhang 2008)</text>
<text x="62" y="1245" font-size="11.5" fill="#345963" font-weight="600">IMRT</text>
<rect x="159.24" y="1234" width="310.76" height="16" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="159.24" y="1234" width="221.88" height="16" rx="4" fill="#96790F" opacity="0.9"/>
<text x="387.12" y="1246" font-size="11.5" fill="#123641" font-weight="800">35.7</text>
<text x="62" y="1271" font-size="11.5" fill="#345963" font-weight="600">2-beam proton</text>
<rect x="159.24" y="1260" width="310.76" height="16" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="159.24" y="1260" width="259.8" height="16" rx="4" fill="#00806B" opacity="0.9"/>
<text x="425.04" y="1272" font-size="11.5" fill="#123641" font-weight="800">41.8</text>
<text x="62" y="1297" font-size="11.5" fill="#345963" font-weight="600">3-beam proton</text>
<rect x="159.24" y="1286" width="310.76" height="16" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="159.24" y="1286" width="172.16" height="16" rx="4" fill="#00806B" opacity="0.9"/>
<text x="337.4" y="1298" font-size="11.5" fill="#123641" font-weight="800">27.7</text>
<g filter="url(#sh)"><rect x="44" y="1337.5" width="532" height="183.62" rx="18" fill="#FFFFFF"/></g>
<rect x="54" y="1351.5" width="5" height="155.62" rx="2.5" fill="#00806B"/>
<text x="62" y="1366.12" font-size="12.5" fill="#123641" font-weight="800">The only completed randomised comparison: Lin 2020 (randomised phase IIB,</text>
<text x="62" y="1383.62" font-size="12.5" fill="#123641" font-weight="800">n=145, 50.4 Gy, SCC + adenocarcinoma)</text>
<circle cx="66" cy="1406.75" r="3" fill="#00806B"/>
<text x="76" y="1411.12" font-size="12.5" fill="#345963">Primary endpoint was 'total toxicity burden' (a composite of 11 adverse</text>
<text x="76" y="1429.25" font-size="12.5" fill="#345963">events and postoperative complications): IMRT 39.9 vs protons 17.4 (2.3-fold)</text>
<circle cx="66" cy="1449" r="3" fill="#00806B"/>
<text x="76" y="1453.38" font-size="12.5" fill="#345963">Postoperative complication score 19.1 vs 2.5</text>
<circle cx="66" cy="1473.12" r="3" fill="#00806B"/>
<text x="76" y="1477.5" font-size="12.5" fill="#345963">3-year PFS 50.8% vs 51.2%; 3-year OS 44.5% vs 44.5% — identical. 80% of the</text>
<text x="76" y="1495.62" font-size="12.5" fill="#345963">protons were passive scattering.</text>
<g filter="url(#sh)"><rect x="44" y="1535.12" width="532" height="183.62" rx="18" fill="#FFFFFF"/></g>
<rect x="54" y="1549.12" width="5" height="155.62" rx="2.5" fill="#5C77C4"/>
<text x="62" y="1563.75" font-size="12.5" fill="#123641" font-weight="800">Lymphocytes: Shiraishi 2018 (propensity-matched 136 vs 136, preoperative</text>
<text x="62" y="1581.25" font-size="12.5" fill="#123641" font-weight="800">chemoradiotherapy, retrospective)</text>
<circle cx="66" cy="1604.38" r="3" fill="#5C77C4"/>
<text x="76" y="1608.75" font-size="12.5" fill="#345963">Grade 4 lymphopenia: IMRT 40.4% vs protons 17.6%</text>
<circle cx="66" cy="1628.5" r="3" fill="#5C77C4"/>
<text x="76" y="1632.88" font-size="12.5" fill="#345963">The low-dose bath hitting circulating lymphocytes is the mechanistic</text>
<text x="76" y="1651" font-size="12.5" fill="#345963">hypothesis; its link to survival is not drawn here.</text>
<circle cx="66" cy="1670.75" r="3" fill="#5C77C4"/>
<text x="76" y="1675.12" font-size="12.5" fill="#345963">Phase III NRG-GI006 (primary endpoint OS) — primary completion estimated</text>
<text x="76" y="1693.25" font-size="12.5" fill="#345963">November 2031.</text>
<text x="44" y="1743.25" font-size="12.5" fill="#6B8084" font-weight="600">Zhou 2023 meta-analysis (45 studies, all non-randomised): protons significantly</text>
<text x="44" y="1761.38" font-size="12.5" fill="#6B8084" font-weight="600">reduced grade 2+ pneumonitis, pericardial effusion and grade 4+ lymphopenia; its pooled</text>
<text x="44" y="1779.5" font-size="12.5" fill="#6B8084" font-weight="600">survival advantage comes entirely from non-randomised, selected patients and is not</text>
<text x="44" y="1797.62" font-size="12.5" fill="#6B8084" font-weight="600">drawn. Retrospective data (Lin 2017): hospital stay 9.3 days with protons vs 11.6 with</text>
<text x="44" y="1815.75" font-size="12.5" fill="#6B8084" font-weight="600">IMRT; 90-day mortality 0.9% vs 4.3%, not significant.</text>
<text x="44" y="1855.88" font-size="12" fill="#6B8084">Schematic (not an actual dose distribution), redrawn from Zhang 2008, Lin 2020 (JCO</text>
<text x="44" y="1873.88" font-size="12" fill="#6B8084">randomised phase IIB), Shiraishi 2018, Lin 2017, Zhou 2023 and the ClinicalTrials.gov</text>
<text x="44" y="1891.88" font-size="12" fill="#6B8084">NRG-GI006 record | dosimetric numbers come from a 15-patient planning comparison; the</text>
<text x="44" y="1909.88" font-size="12" fill="#6B8084">randomised trial's primary endpoint was toxicity burden, not survival; adult proton therapy</text>
<text x="44" y="1927.88" font-size="12" fill="#6B8084">in Taiwan is self-pay — ask the hospital's billing office</text>
  </g>
</svg>
