<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1972" viewBox="0 0 620 1972" role="img" aria-labelledby="t d">
  <title id="t">Photon IMRT versus protons: the low dose the heart and lungs receive</title>
  <desc id="d">Schematic (not an actual dose distribution): two axial thoracic cross-sections. Left, photon IMRT: several crossing beams concentrate the high dose on the oesophageal tumour, but each beam continues after the tumour, leaving a low-dose bath across both lungs and the heart; IMRT is the routine, NHI-covered baseline and already very good. Right, protons: two posterior-oblique beams deposit their dose at the Bragg peak and stop, with almost no exit dose. Three cards below. Dosimetry (Zhang 2008, a 15-patient planning comparison of distal oesophageal cancer at MD Anderson): lung V5 35.6% lower with two-beam protons than IMRT and 17.4% lower with three beams; mean lung dose 5.1 Gy and 2.9 Gy lower; heart V40 35.7% with IMRT, 41.8% with two-beam protons (higher) and 27.7% with three beams — sparing lung and sparing heart trade off. The only completed randomised comparison (Lin 2020, randomised phase IIB, n=145, 50.4 Gy, SCC plus adenocarcinoma): the primary endpoint total toxicity burden is a composite score, IMRT 39.9 vs protons 17.4, postoperative complication score 19.1 vs 2.5; 3-year PFS 50.8% vs 51.2% and 3-year overall survival 44.5% vs 44.5%, identical; 80% of protons were passive scattering. Lymphocytes (Shiraishi 2018, propensity-matched 136 vs 136, retrospective): grade 4 lymphopenia 40.4% with IMRT vs 17.6% with protons; the link to survival is not drawn. Phase III NRG-GI006 has overall survival as its primary endpoint, with primary completion estimated November 2031. There is no survival-advantage arrow on the figure.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><clipPath id="clip_imrt"><ellipse cx="310" cy="549.2" rx="162.5" ry="113.75"/></clipPath><clipPath id="clip_proton"><ellipse cx="310" cy="895.2" rx="162.5" ry="113.75"/></clipPath><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="620" height="1972" rx="30" fill="url(#bg)"/>
  <g class="z">
<text x="44" y="62" font-size="14" fill="#A98722" font-weight="800" letter-spacing="3.5px">PHOTON IMRT vs PROTON — WHERE THE LOW DOSE GOES</text>
<text x="44" y="112" font-size="30" fill="#123641" font-weight="800" class="r">Photon IMRT versus protons: the</text>
<text x="44" y="152" font-size="30" fill="#123641" font-weight="800" class="r">low dose the heart and lungs</text>
<text x="44" y="192" font-size="30" fill="#123641" font-weight="800" class="r">receive</text>
<text x="44" y="234" font-size="14.5" fill="#527078">Same oesophageal tumour, same prescribed dose: the difference is outside</text>
<text x="44" y="256" font-size="14.5" fill="#527078">the tumour. Left is today's baseline — already very good; right is the same</text>
<text x="44" y="278" font-size="14.5" fill="#527078">treatment, engineered further.</text>
<text x="44" y="300" font-size="14.5" fill="#527078">There is no survival arrow on this figure: in the only completed randomised</text>
<text x="44" y="322" font-size="14.5" fill="#527078">comparison, survival was identical.</text>
<g filter="url(#sh)"><rect x="44" y="356" width="532" height="330" rx="18" fill="#FFFFFF"/></g>
<rect x="62" y="374" width="342.71" height="30" rx="15" fill="#96790F"/>
<text x="233.35" y="393.68" font-size="13" fill="#FFFFFF" font-weight="800" text-anchor="middle">Photon IMRT (routine, NHI-covered baseline)</text>
<path d="M147.5 549.2 a162.5 113.75 0 1 0 325 0 a162.5 113.75 0 1 0 -325 0" fill="#F7F3EA" stroke="#C9C0AC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
