<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="t d">
  <title id="t">The five-to-six-week calendar and its finish line</title>
  <desc id="d">Schematic calendar of definitive chemoradiotherapy. External-beam radiotherapy runs Monday to Friday, 45 Gy in 25 fractions over about five weeks with daily image guidance; cisplatin 40 mg/m2 once a week for 5–6 doses; 3–4 brachytherapy insertions fall in the final weeks or within 1–2 weeks after, at least 6–8 hours apart. Three separately sourced finish-line anchors: the ESGO guideline caps overall treatment time including brachytherapy at 7 weeks; EMBRACE-II targets 50 days (21% of EMBRACE-I exceeded it); retrospective data show pelvic recurrence of 26% vs 9% when brachytherapy finished beyond 56 days. Weeks four and five feel worst and are exactly when not to pause on your own — report symptoms and let the team decide.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><pattern id="hz" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#96790F" stroke-width="2" opacity="0.55"/></pattern><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="940" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="86" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">THE 5–6 WEEK CALENDAR</text>
<text x="84" y="148" font-size="44" fill="#123641" font-weight="800" class="r">Five to six weeks: short days, a hard clock</text>
<text x="84" y="194" font-size="21" fill="#527078">A few minutes of external beam Monday–Friday; one chemotherapy day a week; the decisive final days are brachytherapy.</text>
<text x="84" y="224" font-size="21" fill="#527078">The one thing that cannot slip is the overall treatment time.</text>
<text x="254" y="308" font-size="15.5" fill="#6B8084" font-weight="700" text-anchor="middle">Mon</text>
<text x="350" y="308" font-size="15.5" fill="#6B8084" font-weight="700" text-anchor="middle">Tue</text>
<text x="446" y="308" font-size="15.5" fill="#6B8084" font-weight="700" text-anchor="middle">Wed</text>
<text x="542" y="308" font-size="15.5" fill="#6B8084" font-weight="700" text-anchor="middle">Thu</text>
<text x="638" y="308" font-size="15.5" fill="#6B8084" font-weight="700" text-anchor="middle">Fri</text>
<text x="192" y="352" font-size="15.5" fill="#345963" font-weight="700" text-anchor="end">Week 1</text>
