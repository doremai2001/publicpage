<text x="210" y="672" font-size="14.5" fill="#6B8084">Weekends off</text>
<rect x="210" y="689" width="16" height="16" rx="5" fill="#5C77C4" opacity="0.85"/>
<text x="236" y="703" font-size="15" fill="#345963" font-weight="600">External beam: 45 Gy / 25 fractions (IMRT/VMAT + daily image guidance)</text>
<circle cx="218" cy="726" r="7" fill="#C9A83E" stroke="#8F7418" stroke-width="1.5"/>
<text x="236" y="732" font-size="15" fill="#345963" font-weight="600">Weekly chemotherapy: cisplatin 40 mg/m², 5–6 doses (day set by your team)</text>
<rect x="210" y="747" width="16" height="16" rx="5" fill="#00806B"/>
<text x="236" y="761" font-size="15" fill="#345963" font-weight="600">Brachytherapy: 3–4 insertions, ≥6–8 h apart; final weeks or within 1–2 weeks after</text>
<text x="820" y="306" font-size="19" fill="#123641" font-weight="800">Three finish-line anchors, each with its own source</text>
<g filter="url(#sh)"><rect x="820" y="326" width="536" height="102" rx="18" fill="#FFFFFF"/></g>
<text x="846" y="366" font-size="26" fill="#8F7418" font-weight="800">≤ 7 weeks</text>
<text x="846" y="392" font-size="14.8" fill="#345963">ESGO 2023 guideline: cap on overall treatment time, </text>
<text x="846" y="414" font-size="14.8" fill="#345963">brachytherapy included.</text>
<g filter="url(#sh)"><rect x="820" y="442" width="536" height="102" rx="18" fill="#FFFFFF"/></g>
<text x="846" y="482" font-size="26" fill="#8F7418" font-weight="800">≤ 50 days</text>
<text x="846" y="508" font-size="14.8" fill="#345963">EMBRACE-II target — 21% of the EMBRACE-I cohort exceeded</text>
<text x="846" y="530" font-size="14.8" fill="#345963">it; the whole team races this.</text>
<g filter="url(#sh)"><rect x="820" y="558" width="536" height="102" rx="18" fill="#FFFFFF"/></g>
<text x="846" y="598" font-size="26" fill="#8F7418" font-weight="800">56 days</text>
<text x="846" y="624" font-size="14.8" fill="#345963">Retrospective data: pelvic recurrence 26% vs 9% when </text>
<text x="846" y="646" font-size="14.8" fill="#345963">brachytherapy finished later (CCRT era, small series).</text>
<g filter="url(#sh)"><rect x="84" y="772" width="1272" height="112" rx="20" fill="#FFFFFF"/></g>
<line x1="104" y1="792" x2="104" y2="864" stroke="#96790F" stroke-width="5" stroke-linecap="round"/>
<text x="128" y="810" font-size="16.5" fill="#123641" font-weight="700">Weeks four and five feel worst — and are exactly when not to grant yourself a break: longer overall time </text>
<text x="128" y="836" font-size="16.5" fill="#123641" font-weight="700">directly costs local control (“~1% per day” comes from the radiotherapy-alone era).</text>
<text x="128" y="864" font-size="15" fill="#345963">Report symptoms and let the team treat them; pausing is the team's call — your job is to speak up, not to endure in silence.</text>
<text x="84" y="914" font-size="16" fill="#6B8084">Schematic redrawn from ESGO/ESTRO/ESP 2023 and EMBRACE-II | Girinsky 1993, Song 2013 | your own schedule comes from your team</text>
  </g>
</svg>
