<rect x="60" y="1529.18" width="62.5" height="25" rx="12.5" fill="#96790F"/>
<text x="71" y="1546.67" font-size="13.5" fill="#FFFFFF" font-weight="800">第四類</text>
<text x="60" y="1581.18" font-size="18" fill="#123641" font-weight="800">follicular neoplasm</text>
<text x="60" y="1619.3" font-size="14" fill="#527078">濾泡性腫瘤</text>
<text x="60" y="1661.6" font-size="14" fill="#527078" font-weight="700">惡性機率（平均值與範圍）</text>
<text x="60" y="1709.28" font-size="28" fill="#96790F" font-weight="800">30%</text>
<text x="120.87" y="1709.28" font-size="14" fill="#527078">（23–34）</text>
<rect x="60" y="1716.56" width="500" height="14" rx="5" fill="#ECE8DE"/>
<rect x="60" y="1716.56" width="150" height="14" rx="5" fill="#96790F"/>
<text x="60" y="1754.56" font-size="14" fill="#527078" font-weight="700">下一步</text>
<text x="60" y="1790.16" font-size="14" fill="#345963">分子檢測或診斷性單葉切除。</text>
<g filter="url(#sh)">
<rect x="40" y="1843.16" width="540" height="321.98" rx="18" fill="#FFFFFF" stroke="#DBD3BF" stroke-width="2"/>
</g>
<rect x="60" y="1863.16" width="62.5" height="25" rx="12.5" fill="#B04A4A"/>
<text x="71" y="1880.65" font-size="13.5" fill="#FFFFFF" font-weight="800">第五類</text>
<text x="60" y="1915.16" font-size="18" fill="#123641" font-weight="800">suspicious for malignancy</text>
<text x="60" y="1953.28" font-size="14" fill="#527078">疑似惡性</text>
<text x="60" y="1995.58" font-size="14" fill="#527078" font-weight="700">惡性機率（平均值與範圍）</text>
<text x="60" y="2043.26" font-size="28" fill="#B04A4A" font-weight="800">74%</text>
<text x="120.87" y="2043.26" font-size="14" fill="#527078">（67–83）</text>
<rect x="60" y="2050.54" width="500" height="14" rx="5" fill="#ECE8DE"/>
<rect x="60" y="2050.54" width="370" height="14" rx="5" fill="#B04A4A"/>
<text x="60" y="2088.54" font-size="14" fill="#527078" font-weight="700">下一步</text>
<text x="60" y="2124.14" font-size="14" fill="#345963">進到手術的討論。</text>
<g filter="url(#sh)">
<rect x="40" y="2177.14" width="540" height="321.98" rx="18" fill="#FFFFFF" stroke="#DBD3BF" stroke-width="2"/>
</g>
<rect x="60" y="2197.14" width="62.5" height="25" rx="12.5" fill="#B04A4A"/>
<text x="71" y="2214.63" font-size="13.5" fill="#FFFFFF" font-weight="800">第六類</text>
<text x="60" y="2249.14" font-size="18" fill="#123641" font-weight="800">malignant</text>
<text x="60" y="2287.26" font-size="14" fill="#527078">惡性</text>
<text x="60" y="2329.56" font-size="14" fill="#527078" font-weight="700">惡性機率（平均值與範圍）</text>
<text x="60" y="2377.24" font-size="28" fill="#B04A4A" font-weight="800">97%</text>
<text x="120.87" y="2377.24" font-size="14" fill="#527078">（97–100）</text>
<rect x="60" y="2384.52" width="500" height="14" rx="5" fill="#ECE8DE"/>
<rect x="60" y="2384.52" width="485" height="14" rx="5" fill="#B04A4A"/>
<text x="60" y="2422.52" font-size="14" fill="#527078" font-weight="700">下一步</text>
<text x="60" y="2458.12" font-size="14" fill="#345963">進到手術的討論。</text>
<text x="40" y="2549.12" font-size="22" fill="#123641" font-weight="800" class="r">第三類裡面，其實還有兩格</text>
<text x="40" y="2574.6" font-size="14" fill="#527078">第三類是最讓人焦慮的一類，因為 22% 這個數字既不能安心也不足以開刀。第三版在這</text>
<text x="40" y="2595.6" font-size="14" fill="#527078">裡做了一件很實際的事：把它拆成兩個次分類。</text>
<g filter="url(#sh)">
<rect x="40" y="2614.6" width="540" height="177.34" rx="18" fill="#F6E2E0" stroke="#B04A4A" stroke-width="2"/>
</g>
<rect x="58" y="2632.6" width="121.31" height="25" rx="12.5" fill="#B04A4A"/>
<text x="69" y="2650.09" font-size="13.5" fill="#FFFFFF" font-weight="800">AUS-nuclear</text>
<text x="58" y="2681.6" font-size="14" fill="#527078">細胞核有非典型變化</text>
<text x="58" y="2729.98" font-size="28" fill="#B04A4A" font-weight="800">36% 到 44%</text>
<text x="58" y="2752.94" font-size="14" fill="#345963">這一格的惡性機率在切除檢體上明顯較高。</text>
<g filter="url(#sh)">
<rect x="40" y="2805.94" width="540" height="177.34" rx="18" fill="#D8EDE7" stroke="#00806B" stroke-width="2"/>
</g>
<rect x="58" y="2823.94" width="103.49" height="25" rx="12.5" fill="#00806B"/>
<text x="69" y="2841.43" font-size="13.5" fill="#FFFFFF" font-weight="800">AUS-other</text>
<text x="58" y="2872.94" font-size="14" fill="#527078">其他型態的非典型</text>
<text x="58" y="2921.32" font-size="28" fill="#00806B" font-weight="800">15% 到 23%</text>
<text x="58" y="2944.28" font-size="14" fill="#345963">同一份第三版資料裡，這一格明顯較低。</text>
<rect x="40" y="2999.28" width="540" height="163.3" rx="14" fill="#F3E8CD"/>
<text x="56" y="3029.28" font-size="14" fill="#8F7418" font-weight="800">另一篇回顧把「其他型態」再拆得更細</text>
<text x="56" y="3065.58" font-size="14" fill="#345963">細胞核非典型 36% 到 48%、結構非典型 10% 到 20%、嗜酸性細胞型 5% 到 6%。</text>
<text x="56" y="3104.58" font-size="14" fill="#345963">所以當報告寫第三類，值得問的下一個問題是「是哪一種第三類」。這一句問下去，</text>
<text x="56" y="3125.58" font-size="14" fill="#345963">22% 可能會變成 15%，也可能會變成 44%。</text>
<text x="40" y="3212.58" font-size="22" fill="#123641" font-weight="800" class="r">三件會讓新舊報告對不起來的事</text>
<g filter="url(#sh)">
<rect x="40" y="3232.06" width="540" height="249.12" rx="18" fill="#FFFFFF" stroke="#DBD3BF" stroke-width="2"/>
</g>
<text x="62" y="3272.06" font-size="18" fill="#123641" font-weight="800">一、名字換了，不代表當年那張報告判錯</text>
<text x="62" y="3316.18" font-size="14" fill="#527078" font-weight="700">AUS／FLUS</text>
<text x="62" y="3340.18" font-size="14" fill="#345963">現在只叫 AUS</text>
<text x="62" y="3372.18" font-size="14" fill="#527078" font-weight="700">FN／SFN</text>
<text x="62" y="3396.18" font-size="14" fill="#345963">現在只叫 FN，「疑似濾泡性腫瘤」這個詞已經被拿掉了</text>
<text x="62" y="3428.18" font-size="14" fill="#527078" font-weight="700">unsatisfactory</text>
<text x="62" y="3452.18" font-size="14" fill="#345963">現在叫 nondiagnostic</text>
<rect x="40" y="3495.18" width="540" height="163.3" rx="14" fill="#ECE8DE"/>
<text x="56" y="3525.18" font-size="14" fill="#123641" font-weight="800">二、NIFTP 改判之後，每一類的百分比都往下掉了</text>
<text x="56" y="3561.48" font-size="14" fill="#345963">第三版把一種叫 NIFTP 的腫瘤改判為非癌以後，各類的惡性機率都往下掉了</text>
<text x="56" y="3582.48" font-size="14" fill="#345963">1.3% 到 9.1%。</text>
<text x="56" y="3621.48" font-size="14" fill="#345963">所以拿舊報告的百分比去對新報告，會對錯。</text>
<rect x="40" y="3672.48" width="540" height="184.3" rx="14" fill="#ECE8DE"/>
<text x="56" y="3702.48" font-size="14" fill="#123641" font-weight="800">三、第一類與第三類，各自有一條品管線</text>
<text x="56" y="3738.78" font-size="14" fill="#345963">夠不夠判讀是有客觀標準的：至少六群保存良好的濾泡細胞、每一群至少十個細胞，</text>
<text x="56" y="3759.78" font-size="14" fill="#345963">出現在一張或多張玻片上。沒有達到就落到第一類。</text>
<text x="56" y="3798.78" font-size="14" fill="#345963">第三類的判讀最好不要超過全部細針檢體的 7% 到 10%，而第三類對第六類的比值</text>
<text x="56" y="3819.78" font-size="14" fill="#345963">最好在 3 以下——這一類被用得太浮濫，本身就是品質問題。</text>
<rect x="40" y="3878.78" width="540" height="310.1" rx="16" fill="#F6E2E0" stroke="#B04A4A" stroke-width="2.5"/>
<text x="66" y="3924.78" font-size="18" fill="#B04A4A" font-weight="800">這張圖不是你的機率</text>
<text x="66" y="3956.38" font-size="15.5" fill="#345963">這六個數字是平均值，分母是一整批被切除並做了組織病理的檢體，不</text>
<text x="66" y="3979.63" font-size="15.5" fill="#345963">是你那一管。第三類寫 22%，不代表你有 22% 的機會是癌。</text>
<text x="66" y="4012.88" font-size="15.5" fill="#345963">這個編號跟期別無關，也不是「第幾期」。它是細胞學的分類，回答的</text>
<text x="66" y="4036.13" font-size="15.5" fill="#345963">只有「這一管細胞有多大機會是惡性」這一個問題。</text>
<text x="66" y="4069.38" font-size="15.5" fill="#345963">這些機率與下一步都是轉引：兩篇文獻的表格都註明是經授權改編自第</text>
<text x="66" y="4092.63" font-size="15.5" fill="#345963">三版原書，我這次沒有拿到原書。</text>
<text x="66" y="4125.88" font-size="15.5" fill="#345963">拿到編號之後可以照著念的是：我這張報告是第幾類？如果是第三類，</text>
<text x="66" y="4149.13" font-size="15.5" fill="#345963">是細胞核那一種還是其他那一種？這份報告用的是第幾版的分類？</text>
<text x="40" y="4208.88" font-size="15" fill="#527078">示意圖，依 2023 年第三版甲狀腺細胞病理報告系統原始說明、2025 年甲狀腺細</text>
<text x="40" y="4232.13" font-size="15" fill="#527078">胞病理學回顧與 2026 年甲狀腺結節診斷流程回顧重繪，非擷取自原論文圖表；</text>
<text x="40" y="4255.38" font-size="15" fill="#527078">各研究族群、設計與終點不同，數點不可直接互比。</text>
  </g>
</svg>
