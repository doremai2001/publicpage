<text x="254" y="638" font-size="18" fill="#8F7418" font-weight="800" text-anchor="middle">Tumour cells: boron-rich</text>
<circle cx="491" cy="512" r="46" fill="#FFFFFF" stroke="#527078" stroke-width="2.5"/>
<circle cx="563" cy="500" r="46" fill="#FFFFFF" stroke="#527078" stroke-width="2.5"/>
