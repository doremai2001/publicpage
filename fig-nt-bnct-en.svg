<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="t d">
  <title id="t">How BNCT works, in two steps</title>
  <desc id="d">Step one: a boron drug is infused and accumulates in tumour cells (normal cells take up little); the THOR trial measured a median tumour-to-normal boron ratio of 3.4, falling to 2.5 by the second irradiation. Step two: thermal neutrons trigger boron-10 capture, splitting it into an alpha particle and lithium-7 (2.38 MeV) with a range under 10 micrometres, about one cell diameter: boron-rich tumour cells are destroyed, boron-poor normal cells are spared, but tumour cells that took up too little boron can also be missed.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="900" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="86" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">HOW BNCT WORKS</text>
<text x="84" y="148" font-size="44" fill="#123641" font-weight="800" class="r">Load the boron, then trigger it with neutrons</text>
<text x="84" y="194" font-size="21" fill="#527078">The blast radius is under 10 micrometres — about one cell.</text>
<text x="84" y="224" font-size="21" fill="#527078">The selectivity comes from, and is limited by, where the boron goes.</text>
<g filter="url(#sh)"><rect x="84" y="258" width="610" height="560" rx="26" fill="#FFFFFF"/></g>
<g filter="url(#sh)"><rect x="746" y="258" width="610" height="560" rx="26" fill="#FFFFFF"/></g>
<text x="124" y="310" font-size="18" fill="#A98722" font-weight="800" letter-spacing="3px">STEP 1</text>
<text x="124" y="350" font-size="25" fill="#123641" font-weight="800">The boron drug concentrates in tumour cells</text>
<text x="124" y="386" font-size="18" fill="#345963">A boron compound (BPA) is infused and</text>
<text x="124" y="414" font-size="18" fill="#345963">enters tumour cells via the LAT1 transporter.</text>
