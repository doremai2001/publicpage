<text x="529" y="638" font-size="18" fill="#527078" font-weight="800" text-anchor="middle">Normal cells: little uptake</text>
<rect x="124" y="670" width="530" height="112" rx="16" fill="#A98722" opacity="0.10"/>
<text x="146" y="704" font-size="16.5" fill="#345963">THOR trial, measured tumour/normal boron ratio:</text>
<text x="146" y="732" font-size="16.5" fill="#345963">median 3.4 → down to 2.5 at the second session</text>
<text x="146" y="760" font-size="16.5" fill="#345963">— the ratio shifts, and uptake is uneven.</text>
<text x="786" y="310" font-size="18" fill="#A98722" font-weight="800" letter-spacing="3px">STEP 2</text>
<text x="786" y="350" font-size="25" fill="#123641" font-weight="800">Neutrons: the energy is released inside one cell</text>
<text x="1316" y="384" font-size="16.5" fill="#527078" font-weight="700" text-anchor="end">Thermal neutrons (&lt;0.025 eV)</text>
