<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1090" viewBox="0 0 720 1090" role="img" aria-labelledby="t d">
  <title id="t">What FLASH actually compresses</title>
  <desc id="d">Three parts. One: a conventional course, using the RTOG 0617 standard arm as the example, delivers 60 Gy in 30 daily fractions over about six weeks, with a few minutes of beam-on per visit. Two: for the same 8 Gy palliative prescription, a conventional system at about 0.03 Gy/s needs roughly 267 seconds of beam-on, while FLASH at 40 Gy/s or more needs 0.2 seconds or less, over a thousand-fold difference. Three: in the FAST-01 trial, total time on the treatment couch still averaged about 19 minutes, almost all of it set-up and imaging; FLASH compresses the beam-on time, not the visit.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="720" height="1090" rx="34" fill="url(#bg)"/>
  <g class="z">
<text x="50" y="66" font-size="15" fill="#A98722" font-weight="800" letter-spacing="4px">WHAT FLASH COMPRESSES</text>
<text x="50" y="118" font-size="34" fill="#123641" font-weight="800" class="r">The beam is faster.</text>
<text x="50" y="166" font-size="34" fill="#123641" font-weight="800" class="r">The visit is not.</text>
<text x="50" y="204" font-size="15.5" fill="#527078">Dose rates differ by over 1,000-fold (≥40 Gy/s vs ≤0.03 Gy/s) —</text>
<text x="50" y="229" font-size="15.5" fill="#527078">but set-up and imaging do not get a minute shorter.</text>
<g filter="url(#sh)"><rect x="50" y="274" width="620" height="210" rx="20" fill="#FFFFFF"/></g>
<text x="80" y="314" font-size="13.5" fill="#8F7418" font-weight="800">A conventional course (example: RTOG 0617 standard arm)</text>
<rect x="84" y="336" width="10" height="30" rx="3" fill="#D8C78F"/>
<rect x="99" y="336" width="10" height="30" rx="3" fill="#D8C78F"/>
<rect x="114" y="336" width="10" height="30" rx="3" fill="#D8C78F"/>
<rect x="129" y="336" width="10" height="30" rx="3" fill="#D8C78F"/>
<rect x="144" y="336" width="10" height="30" rx="3" fill="#D8C78F"/>
<text x="118" y="386" font-size="12" fill="#6B8084" text-anchor="middle">Wk 1</text>
<rect x="177" y="336" width="10" height="30" rx="3" fill="#D8C78F"/>
<rect x="192" y="336" width="10" height="30" rx="3" fill="#D8C78F"/>
<rect x="207" y="336" width="10" height="30" rx="3" fill="#D8C78F"/>
<rect x="222" y="336" width="10" height="30" rx="3" fill="#D8C78F"/>
<rect x="237" y="336" width="10" height="30" rx="3" fill="#D8C78F"/>
<text x="211" y="386" font-size="12" fill="#6B8084" text-anchor="middle">Wk 2</text>
<rect x="270" y="336" width="10" height="30" rx="3" fill="#D8C78F"/>
<rect x="285" y="336" width="10" height="30" rx="3" fill="#D8C78F"/>
<rect x="300" y="336" width="10" height="30" rx="3" fill="#D8C78F"/>
<rect x="315" y="336" width="10" height="30" rx="3" fill="#D8C78F"/>
<rect x="330" y="336" width="10" height="30" rx="3" fill="#D8C78F"/>
<text x="304" y="386" font-size="12" fill="#6B8084" text-anchor="middle">Wk 3</text>
<rect x="363" y="336" width="10" height="30" rx="3" fill="#D8C78F"/>
<rect x="378" y="336" width="10" height="30" rx="3" fill="#D8C78F"/>
<rect x="393" y="336" width="10" height="30" rx="3" fill="#D8C78F"/>
<rect x="408" y="336" width="10" height="30" rx="3" fill="#D8C78F"/>
<rect x="423" y="336" width="10" height="30" rx="3" fill="#D8C78F"/>
<text x="397" y="386" font-size="12" fill="#6B8084" text-anchor="middle">Wk 4</text>
<rect x="456" y="336" width="10" height="30" rx="3" fill="#D8C78F"/>
<rect x="471" y="336" width="10" height="30" rx="3" fill="#D8C78F"/>
<rect x="486" y="336" width="10" height="30" rx="3" fill="#D8C78F"/>
<rect x="501" y="336" width="10" height="30" rx="3" fill="#D8C78F"/>
<rect x="516" y="336" width="10" height="30" rx="3" fill="#D8C78F"/>
<text x="490" y="386" font-size="12" fill="#6B8084" text-anchor="middle">Wk 5</text>
<rect x="549" y="336" width="10" height="30" rx="3" fill="#D8C78F"/>
<rect x="564" y="336" width="10" height="30" rx="3" fill="#D8C78F"/>
<rect x="579" y="336" width="10" height="30" rx="3" fill="#D8C78F"/>
<rect x="594" y="336" width="10" height="30" rx="3" fill="#D8C78F"/>
<rect x="609" y="336" width="10" height="30" rx="3" fill="#D8C78F"/>
<text x="583" y="386" font-size="12" fill="#6B8084" text-anchor="middle">Wk 6</text>
<text x="80" y="426" font-size="15.5" fill="#123641" font-weight="800">60 Gy / 2 Gy daily × 30 / about 6 weeks</text>
<text x="80" y="452" font-size="13.5" fill="#6B8084">Each visit: a few minutes of beam-on</text>
<g filter="url(#sh)"><rect x="50" y="502" width="620" height="260" rx="20" fill="#FFFFFF"/></g>
<text x="80" y="542" font-size="13.5" fill="#8F7418" font-weight="800">Same 8 Gy palliative prescription — how long is the beam on?</text>
<text x="80" y="578" font-size="15" fill="#345963" font-weight="700">Conventional (~0.03 Gy/s)</text>
<text x="640" y="578" font-size="14.5" fill="#123641" font-weight="800" text-anchor="end">~267 s (≈4.5 min)</text>
<rect x="80" y="590" width="560" height="28" rx="4" fill="#527078"/>
<text x="80" y="654" font-size="15" fill="#345963" font-weight="700">FLASH (≥40 Gy/s)</text>
<rect x="80" y="666" width="4" height="28" rx="2" fill="#8F7418"/>
<text x="96" y="686" font-size="14.5" fill="#8F7418" font-weight="800">≤0.2 s</text>
<text x="160" y="686" font-size="12.5" fill="#6B8084">To scale it would be under 1 pixel wide — a &gt;1,000-fold gap</text>
<text x="80" y="724" font-size="13" fill="#6B8084">Measured: CHUV first patient 15 Gy in 90 ms</text>
<text x="80" y="746" font-size="13" fill="#6B8084">IMPulse: 10 pulses in 90 ms</text>
<g filter="url(#sh)"><rect x="50" y="780" width="620" height="232" rx="20" fill="#123641"/></g>
<text x="80" y="824" font-size="20" fill="#F7F1E4" font-weight="800">But the whole visit did not become one second</text>
<text x="80" y="860" font-size="15.5" fill="#D4E0DF">In FAST-01, beam-on was under 1 second —</text>
<text x="80" y="886" font-size="15.5" fill="#D4E0DF">yet total couch time still averaged about 19</text>
<text x="80" y="912" font-size="15.5" fill="#D4E0DF">minutes, almost all set-up and imaging.</text>
<text x="80" y="948" font-size="16" fill="#F2D879" font-weight="800">FLASH compresses beam-on, not the visit;</text>
<text x="80" y="974" font-size="16" fill="#F2D879" font-weight="800">fractionation is still unsettled.</text>
<text x="50" y="1042" font-size="12.5" fill="#6B8084">Schematic, redrawn from Favaudon 2014 &amp; Mascia 2023 (FAST-01).</text>
<text x="50" y="1064" font-size="13" fill="#6B8084">Beam-on times converted from dose rates.</text>
  </g>
</svg>
