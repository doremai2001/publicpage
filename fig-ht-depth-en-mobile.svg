<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Can the energy reach your tumour?</title>
  <desc id="d">No centimetre figures are drawn: achievable depth depends on device, body habitus and site. Ask your team for the number. Infrared / surface heating；Microwave (superficial applicator)；RF capacitive / phased array (deep)；Focused ultrasound</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#123641" opacity=".14"/><line x1="0" y1="0" x2="0" y2="8" stroke="#123641" stroke-width="2.4" opacity=".85"/></pattern><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0B2832" flood-opacity=".12"/></filter><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="720" height="1080" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="56" y="78" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">PENETRATION</text>
<text x="56" y="140" font-size="30" fill="#123641" font-weight="800" class="r">Can the energy reach your tumour?</text>
<text x="56" y="182" font-size="18" fill="#527078">Heating is an engineering problem: energy must cross skin, fat and muscle.</text>
<text x="56" y="209" font-size="18" fill="#527078">Different devices reach different depths — that is the first question to ask.</text>
<rect x="56" y="292" width="150" height="300" rx="0" fill="#123641" opacity=".05" />
<line x1="56" y1="292" x2="56" y2="592" stroke="#123641" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 7" opacity=".28"/>
<text x="68" y="622" font-size="16" fill="#6B8084" font-weight="700">Skin</text>
<rect x="208" y="292" width="150" height="300" rx="0" fill="#123641" opacity=".05" />
<line x1="208" y1="292" x2="208" y2="592" stroke="#123641" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 7" opacity=".28"/>
<text x="220" y="622" font-size="16" fill="#6B8084" font-weight="700">Subcutaneous fat</text>
<rect x="360" y="292" width="150" height="300" rx="0" fill="#123641" opacity=".05" />
<line x1="360" y1="292" x2="360" y2="592" stroke="#123641" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 7" opacity=".28"/>
<text x="372" y="622" font-size="16" fill="#6B8084" font-weight="700">Muscle</text>
<rect x="512" y="292" width="150" height="300" rx="0" fill="#123641" opacity=".05" />
<line x1="512" y1="292" x2="512" y2="592" stroke="#123641" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 7" opacity=".28"/>
<text x="524" y="622" font-size="16" fill="#6B8084" font-weight="700">Deep organs</text>
<rect x="56" y="292" width="608" height="300" rx="16" fill="none" stroke="#123641" stroke-width="1.6" />
<rect x="60" y="318" width="79.04" height="30" rx="8" fill="#5C77C4" opacity=".88" />
<text x="72" y="339" font-size="15" fill="#FFFFFF" font-weight="700">Infrared / surface heating</text>
<rect x="60" y="382" width="182.4" height="30" rx="8" fill="#5C77C4" opacity=".88" />
<text x="72" y="403" font-size="15" fill="#FFFFFF" font-weight="700">Microwave (superficial applicator)</text>
<rect x="60" y="446" width="559.36" height="30" rx="8" fill="#A98722" opacity=".88" />
<text x="72" y="467" font-size="15" fill="#FFFFFF" font-weight="700">RF capacitive / phased array (deep)</text>
<rect x="60" y="510" width="376.96" height="30" rx="8" fill="#00806B" opacity=".88" />
<text x="72" y="531" font-size="15" fill="#FFFFFF" font-weight="700">Focused ultrasound</text>
<rect x="432.96" y="574" width="182.4" height="30" rx="8" fill="#00806B" opacity=".22" stroke="#00806B" stroke-width="2" />
<text x="448.96" y="595" font-size="16" fill="#00806B" font-weight="800">◆</text>
<text x="470.96" y="595" font-size="14" fill="#00604F" font-weight="700">Placed inside</text>
<text x="56" y="664" font-size="17" fill="#527078">Placed inside: interstitial</text>
<text x="56" y="692" font-size="17" fill="#527078">probes or magnetic</text>
<text x="56" y="720" font-size="17" fill="#527078">nanoparticles reach the tumour</text>
<text x="56" y="748" font-size="17" fill="#527078">without crossing the surface</text>
<rect x="56" y="784" width="608" height="2" rx="1" fill="#A98722" opacity=".5" />
<text x="56" y="818" font-size="16" fill="#345963" font-weight="700">No centimetre figures are</text>
<text x="56" y="845" font-size="16" fill="#345963" font-weight="700">drawn: achievable depth</text>
<text x="56" y="872" font-size="16" fill="#345963" font-weight="700">depends on device, body</text>
<text x="56" y="899" font-size="16" fill="#345963" font-weight="700">habitus and site. Ask your</text>
<text x="56" y="926" font-size="16" fill="#345963" font-weight="700">team for the number.</text>
<text x="56" y="1044" font-size="14" fill="#6B8084">Schematic, redrawn from the technique classification in Kok et al. 2020.</text>
  </g>
</svg>
