<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1178" viewBox="0 0 1440 1178" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Where each cancer actually stands</title>
  <desc id="d">There are no randomised trials in this field. So the question is not whether there is a number, but how many people stand behind it and what design produced it. Only the first row has a drug approval, and only for one indication: unresectable locally advanced or locally recurrent head and neck cancer. The smaller the denominator, the better the numbers tend to look - the ones that went well are the ones that get written up.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#123641" opacity=".10"/><line x1="0" y1="0" x2="0" y2="8" stroke="#123641" stroke-width="2.2" opacity=".75"/></pattern><pattern id="hatchlite" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#123641" stroke-width="1.4" opacity=".22"/></pattern><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="1178" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="78" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">EVIDENCE</text>
<text x="84" y="140" font-size="44" fill="#123641" font-weight="800" class="r">Where each cancer actually stands</text>
<text x="84" y="192" font-size="21" fill="#527078">There are no randomised trials in this field. So the question is not whether there is a number,</text>
<text x="84" y="223" font-size="21" fill="#527078">but how many people stand behind it and what design produced it.</text>
<rect x="84" y="282" width="1272" height="96" rx="12" fill="#123641" opacity="0.05"/>
<rect x="84" y="282" width="8" height="96" rx="4" fill="#A98722" opacity="0.9"/>
<text x="110" y="337" font-size="20" fill="#123641" font-weight="700">Recurrent head and neck cancer</text>
<text x="484" y="324" font-size="17" fill="#527078">single-arm phase II + post-marketing</text>
<text x="484" y="348" font-size="17" fill="#527078">surveillance</text>
<text x="1336" y="337" font-size="18" fill="#A98722" font-weight="800" text-anchor="end">21 / 162 patients</text>
<rect x="84" y="390" width="1272" height="72" rx="12" fill="#123641" opacity="0.05"/>
<rect x="84" y="390" width="8" height="72" rx="4" fill="#A98722" opacity="0.9"/>
<text x="110" y="433" font-size="20" fill="#123641" font-weight="700">Recurrent glioblastoma</text>
<text x="484" y="432" font-size="17" fill="#527078">single-arm phase II + historical cohort control</text>
<text x="1336" y="433" font-size="18" fill="#A98722" font-weight="800" text-anchor="end">27 patients</text>
<rect x="84" y="474" width="1272" height="72" rx="12" fill="#123641" opacity="0.05"/>
<rect x="84" y="474" width="8" height="72" rx="4" fill="#5C77C4" opacity="0.9"/>
<text x="110" y="517" font-size="20" fill="#123641" font-weight="700">Recurrent high-grade meningioma</text>
<text x="484" y="516" font-size="17" fill="#527078">case series</text>
<text x="1336" y="517" font-size="18" fill="#5C77C4" font-weight="800" text-anchor="end">44 patients</text>
<rect x="84" y="558" width="1272" height="72" rx="12" fill="#123641" opacity="0.05"/>
<rect x="84" y="558" width="8" height="72" rx="4" fill="#5C77C4" opacity="0.9"/>
<text x="110" y="601" font-size="20" fill="#123641" font-weight="700">Melanoma</text>
<text x="484" y="600" font-size="17" fill="#527078">case series</text>
<text x="1336" y="601" font-size="18" fill="#5C77C4" font-weight="800" text-anchor="end">roughly 30-40 cases worldwide</text>
<rect x="84" y="642" width="1272" height="72" rx="12" fill="#123641" opacity="0.05"/>
<rect x="84" y="642" width="8" height="72" rx="4" fill="#5C77C4" opacity="0.9"/>
<text x="110" y="685" font-size="20" fill="#123641" font-weight="700">Extramammary Paget disease</text>
<text x="484" y="684" font-size="17" fill="#527078">case series</text>
<text x="1336" y="685" font-size="18" fill="#5C77C4" font-weight="800" text-anchor="end">single digits</text>
<rect x="84" y="726" width="1272" height="72" rx="12" fill="#123641" opacity="0.05"/>
<rect x="84" y="726" width="8" height="72" rx="4" fill="#00806B" opacity="0.9"/>
<rect x="84" y="726" width="1272" height="72" rx="12" fill="url(#hatchlite)"/>
<text x="110" y="769" font-size="20" fill="#123641" font-weight="700">Newly diagnosed glioblastoma</text>
<text x="484" y="768" font-size="17" fill="#527078">phase I, no efficacy results yet</text>
<text x="1336" y="769" font-size="18" fill="#00806B" font-weight="800" text-anchor="end">target 12-18 patients</text>
<rect x="84" y="810" width="1272" height="72" rx="12" fill="#123641" opacity="0.05"/>
<rect x="84" y="810" width="8" height="72" rx="4" fill="#00806B" opacity="0.9"/>
<rect x="84" y="810" width="1272" height="72" rx="12" fill="url(#hatchlite)"/>
<text x="110" y="853" font-size="20" fill="#123641" font-weight="700">Liver, lung and deep organs</text>
<text x="484" y="852" font-size="17" fill="#527078">case reports</text>
<text x="1336" y="853" font-size="18" fill="#00806B" font-weight="800" text-anchor="end">single digits</text>
<text x="84" y="904" font-size="16" fill="#6B8084">Hatching = no efficacy results yet, or case reports only</text>
<rect x="84" y="952" width="1272" height="2" rx="1" fill="#A98722" opacity="0.5"/>
<text x="84" y="986" font-size="19" fill="#345963" font-weight="700">Only the first row has a drug approval, and only for one indication: unresectable locally advanced or locally recurrent head and</text>
<text x="84" y="1016" font-size="19" fill="#345963" font-weight="700">neck cancer.</text>
<text x="84" y="1046" font-size="19" fill="#345963" font-weight="700">The smaller the denominator, the better the numbers tend to look - the ones that went well are the ones that get written</text>
<text x="84" y="1076" font-size="19" fill="#345963" font-weight="700">up.</text>
<text x="84" y="1114" font-size="16" fill="#6B8084">Schematic, compiled from the primary literature cited across this topic; denominators are the enrolled numbers in each report.</text>
  </g>
</svg>
