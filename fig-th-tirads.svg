<text x="1090" y="662.75" font-size="14" fill="#345963">第 5 類：1 公分以上</text>
<text x="1071" y="693.47" font-size="14" fill="#345963">2021 年版改用 1.5 公分切點之後，不必要</text>
<text x="1071" y="714.47" font-size="14" fill="#345963">切片率降到 50%（47–53），敏感度也跟</text>
<text x="1071" y="735.47" font-size="14" fill="#345963">著掉到 76%（74–79）。這就是同一個天</text>
<text x="1071" y="756.47" font-size="14" fill="#345963">平的兩端。</text>
<text x="1071" y="795.97" font-size="12.5" fill="#527078">上面那組切點來自 225 顆結節的比較研究；這</text>
<text x="1071" y="814.1" font-size="12.5" fill="#527078">三個切點和 2021 年韓國那份共識列的一樣。</text>
<rect x="84" y="959.1" width="1272" height="142.3" rx="14" fill="#ECE8DE"/>
<text x="100" y="989.1" font-size="14" fill="#123641" font-weight="800">為什麼這張圖不排名次</text>
<text x="100" y="1025.4" font-size="14" fill="#345963">另一篇納入 67 篇、76,512 顆結節的統合分析，比的是「分類切點」而不是「扎針建議」，排出來的順序就和上面那一篇不一樣。</text>
<text x="100" y="1064.4" font-size="14" fill="#345963">兩篇的問題不同，答案自然不同。所以這裡沒有第一名。</text>
<text x="84" y="1151.4" font-size="22" fill="#123641" font-weight="800" class="r">同一批結節，三套表漏掉的不是同一群</text>
<text x="84" y="1176.88" font-size="14" fill="#527078">一項單中心的前瞻性研究收了 225 顆結節、其中 23.1% 最後證實是惡性，同時用三套表跑一遍。前瞻性的意思是先講好要看什麼、再往前收人追蹤，不是事後翻舊病歷。</text>
<g filter="url(#sh)">
<rect x="84" y="1195.88" width="1272" height="203" rx="18" fill="#FFFFFF" stroke="#DBD3BF" stroke-width="2"/>
</g>
<text x="106" y="1235.88" font-size="14" fill="#527078" font-weight="700">ACR TI-RADS</text>
<rect x="316" y="1217.88" width="848" height="26" rx="7" fill="#F3E8CD"/>
<rect x="316" y="1217.88" width="848" height="26" rx="7" fill="#96790F"/>
<text x="1176" y="1238.44" font-size="21" fill="#96790F" font-weight="800">漏 11 顆</text>
<text x="106" y="1275.88" font-size="14" fill="#527078" font-weight="700">EU-TIRADS</text>
<rect x="316" y="1257.88" width="848" height="26" rx="7" fill="#D8EDE7"/>
<rect x="316" y="1257.88" width="385.45" height="26" rx="7" fill="#00806B"/>
<text x="1176" y="1278.44" font-size="21" fill="#00806B" font-weight="800">漏 5 顆</text>
<text x="106" y="1315.88" font-size="14" fill="#527078" font-weight="700">K-TIRADS</text>
<rect x="316" y="1297.88" width="848" height="26" rx="7" fill="#E3E8F6"/>
<rect x="316" y="1297.88" width="231.27" height="26" rx="7" fill="#5C77C4"/>
<text x="1176" y="1318.44" font-size="21" fill="#5C77C4" font-weight="800">漏 3 顆</text>
<text x="106" y="1355.88" font-size="14" fill="#345963">漏掉的典型長相是同一種：直徑 1.0 到 1.5 公分之間的實質高回音結節。反過來也有——邊緣鈣化這個特徵只有 ACR TI-RADS 給分，另外兩套根本不計。</text>
<text x="84" y="1448.88" font-size="22" fill="#123641" font-weight="800" class="r">那一顆：1.0 到 1.5 公分的實質高回音結節</text>
<text x="84" y="1474.36" font-size="14" fill="#527078">同一顆結節，同一天，同一張超音波影像。下面三格是三套表各自給的答案。</text>
<g filter="url(#sh)">
<rect x="84" y="1493.36" width="410.67" height="200.12" rx="18" fill="#F3E8CD" stroke="#96790F" stroke-width="2"/>
</g>
<rect x="102" y="1511.36" width="126.33" height="25" rx="12.5" fill="#96790F"/>
<text x="113" y="1528.86" font-size="13.5" fill="#FFFFFF" font-weight="800">ACR TI-RADS</text>
<text x="102" y="1564.36" font-size="18" fill="#123641" font-weight="800">第 3 級（只拿到 3 分）</text>
<text x="102" y="1606.48" font-size="14" fill="#345963">扎針切點：2.5 公分以上</text>
<rect x="102" y="1639.48" width="68" height="36" rx="18" fill="#B04A4A"/>
<text x="118" y="1664.14" font-size="18" fill="#FFFFFF" font-weight="800">不扎</text>
<g filter="url(#sh)">
<rect x="514.67" y="1493.36" width="410.67" height="200.12" rx="18" fill="#D8EDE7" stroke="#00806B" stroke-width="2"/>
</g>
<rect x="532.67" y="1511.36" width="110.61" height="25" rx="12.5" fill="#00806B"/>
<text x="543.67" y="1528.86" font-size="13.5" fill="#FFFFFF" font-weight="800">EU-TIRADS</text>
<text x="532.67" y="1564.36" font-size="18" fill="#123641" font-weight="800">第 5 類</text>
<text x="532.67" y="1606.48" font-size="14" fill="#345963">扎針切點：1.0 公分以上</text>
<rect x="532.67" y="1639.48" width="50" height="36" rx="18" fill="#00806B"/>
<text x="548.67" y="1664.14" font-size="18" fill="#FFFFFF" font-weight="800">扎</text>
<g filter="url(#sh)">
<rect x="945.33" y="1493.36" width="410.67" height="200.12" rx="18" fill="#E3E8F6" stroke="#5C77C4" stroke-width="2"/>
</g>
<rect x="963.33" y="1511.36" width="99.44" height="25" rx="12.5" fill="#5C77C4"/>
<text x="974.33" y="1528.86" font-size="13.5" fill="#FFFFFF" font-weight="800">K-TIRADS</text>
<text x="963.33" y="1564.36" font-size="18" fill="#123641" font-weight="800">第 4 類</text>
<text x="963.33" y="1606.48" font-size="14" fill="#345963">扎針切點：1.0 公分以上</text>
<rect x="963.33" y="1639.48" width="50" height="36" rx="18" fill="#00806B"/>
<text x="979.33" y="1664.14" font-size="18" fill="#FFFFFF" font-weight="800">扎</text>
<rect x="84" y="1709.48" width="1272" height="163.3" rx="14" fill="#F3E8CD"/>
<text x="100" y="1739.48" font-size="14" fill="#8F7418" font-weight="800">K-TIRADS 第 4 類那一格，寫的是一個區間不是一個數字</text>
<text x="100" y="1775.78" font-size="14" fill="#345963">同一篇比較研究的表格把 K-TIRADS 第 4 類的切點寫成 1 到 1.5 公分之間，因為那一格本來就是一個區間：切點要在 1 到 1.5 公分之間，依超音波特徵、結節位置與臨床因素決定。所以這一顆 1.0</text>
<text x="100" y="1796.78" font-size="14" fill="#345963">到 1.5 公分的結節落在區間的下緣，用的是 1.0 公分。</text>
<text x="100" y="1835.78" font-size="14" fill="#345963">這三個切點和 2021 年韓國那份共識列的一樣。</text>
<text x="84" y="1922.78" font-size="22" fill="#123641" font-weight="800" class="r">同一套表，在大結節和小結節上表現也不一樣</text>
<text x="84" y="1948.26" font-size="14" fill="#527078">一項 3,826 顆 1 公分以上結節的研究，其中 85.7% 良性、14.3% 惡性。</text>
<g filter="url(#sh)">
<rect x="84" y="1967.26" width="624" height="239.72" rx="18" fill="#FFFFFF" stroke="#DBD3BF" stroke-width="2"/>
</g>
<text x="102" y="2003.26" font-size="18" fill="#123641" font-weight="800">2 公分以下的結節</text>
<text x="102" y="2061.46" font-size="28" fill="#96790F" font-weight="800">76.3%</text>
<text x="102" y="2082.18" font-size="14" fill="#345963">ACR TI-RADS 省下的不必要切片最多</text>
<text x="102" y="2137.26" font-size="28" fill="#96790F" font-weight="800">76.1%</text>
<text x="102" y="2157.98" font-size="14" fill="#345963">但它的敏感度也是五套裡最低的</text>
<g filter="url(#sh)">
<rect x="732" y="1967.26" width="624" height="239.72" rx="18" fill="#FFFFFF" stroke="#DBD3BF" stroke-width="2"/>
</g>
<text x="750" y="2003.26" font-size="18" fill="#123641" font-weight="800">2 公分以上的結節</text>
<text x="750" y="2061.46" font-size="28" fill="#5C77C4" font-weight="800">88.8%</text>
<text x="750" y="2082.18" font-size="14" fill="#345963">ACR TI-RADS 的敏感度</text>
<text x="750" y="2137.26" font-size="28" fill="#5C77C4" font-weight="800">98.7% 到 99.3%</text>
<text x="750" y="2157.98" font-size="14" fill="#345963">其他系統的敏感度</text>
<text x="84" y="2238.48" font-size="15.5" fill="#345963">換句話說，「你的結節被哪一套表看、又剛好是多大」，這兩件事合起來會決定你今天要不要挨那一針。這不是一句抱怨，這是現況。</text>
<rect x="84" y="2284.51" width="1272" height="217.1" rx="16" fill="#F6E2E0" stroke="#B04A4A" stroke-width="2.5"/>
<text x="110" y="2330.51" font-size="18" fill="#B04A4A" font-weight="800">這張圖不是用來替你那一顆打分數的</text>
<text x="110" y="2362.11" font-size="15.5" fill="#345963">圖上沒有任何一欄可以讓你替自己算分數。分數來自超音波影像上的形狀特徵，那是判讀的人在機器前面做的事，不是從一張圖表上對出來的。</text>
<text x="110" y="2395.36" font-size="15.5" fill="#345963">不必要切片率與敏感度是同一個天平的兩端：抓得多就扎得多，扎得少就會漏。所以「哪一套最準」這個問題沒有答案，我也不會替你選一套。</text>
<text x="110" y="2428.61" font-size="15.5" fill="#345963">ACR 的白皮書原文和歐洲那份原始指引，這次都取不到全文，圖上的分級與切點是轉引自那篇把三套表逐欄列出來的比較研究，不是從原始文件抄的。</text>
<text x="110" y="2461.86" font-size="15.5" fill="#345963">你能做的是把它問出口：我這份報告用的是哪一套分類？報告上有寫分級嗎？照這套表，決定的是大小還是形狀？換另一套表來看，答案會不會不一樣？</text>
<text x="84" y="2521.61" font-size="15" fill="#527078">示意圖，依 2023 年超音波風險分層系統診斷表現統合分析、2025 年 K-TIRADS／EU-TIRADS／ACR-TIRADS 比較研究、2021 年依結節大小比較五套指引的研究與美國甲狀腺學會 2015</text>
<text x="84" y="2544.86" font-size="15" fill="#527078">年版指引重繪，非擷取自原論文圖表；各研究族群、設計與終點不同，數點不可直接互比。</text>
  </g>
</svg>
