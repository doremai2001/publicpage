<text x="1338" y="522.11" font-size="14" fill="#5C77C4" font-weight="800" text-anchor="end">2016 年版 79%（74–83）</text>
<rect x="1071" y="527.71" width="267" height="14" rx="5" fill="#ECE8DE"/>
<rect x="1071" y="527.71" width="210.93" height="14" rx="5" fill="#5C77C4"/>
<text x="1071" y="565.71" font-size="14" fill="#527078" font-weight="700">敏感度</text>
<text x="1338" y="565.71" font-size="14" fill="#5C77C4" font-weight="800" text-anchor="end">2016 年版 96%（94–97）</text>
<rect x="1071" y="571.31" width="267" height="14" rx="5" fill="#ECE8DE"/>
<rect x="1071" y="571.31" width="256.32" height="14" rx="5" fill="#5C77C4"/>
