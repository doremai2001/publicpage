<text x="1082" y="435.86" font-size="13.5" fill="#FFFFFF" font-weight="800">K-TIRADS</text>
<text x="1071" y="463.86" font-size="12.5" fill="#527078">韓國甲狀腺影像學會（現行版是 2021，不是</text>
<text x="1071" y="481.99" font-size="12.5" fill="#527078">2016）</text>
