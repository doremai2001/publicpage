<text x="436" y="435.86" font-size="13.5" fill="#FFFFFF" font-weight="800">ATA 2015 五型態</text>
<text x="425" y="463.86" font-size="12.5" fill="#527078">美國甲狀腺學會 2015 年版</text>
<text x="425" y="503.99" font-size="14" fill="#527078" font-weight="700">不必要切片率</text>
<text x="692" y="503.99" font-size="14" fill="#7A6E58" font-weight="800" text-anchor="end">65%（56–74）</text>
<rect x="425" y="509.59" width="267" height="14" rx="5" fill="#ECE8DE"/>
<rect x="425" y="509.59" width="173.55" height="14" rx="5" fill="#7A6E58"/>
<text x="425" y="547.59" font-size="14" fill="#527078" font-weight="700">敏感度</text>
<text x="692" y="547.59" font-size="14" fill="#7A6E58" font-weight="800" text-anchor="end">89%（85–93）</text>
<rect x="425" y="553.19" width="267" height="14" rx="5" fill="#ECE8DE"/>
<rect x="425" y="553.19" width="237.63" height="14" rx="5" fill="#7A6E58"/>
<circle cx="429.5" cy="587.87" r="4" fill="#7A6E58"/>
<text x="444" y="593.19" font-size="14" fill="#345963">高度可疑：1 公分以上，扎（強烈建議，</text>
<text x="444" y="613.91" font-size="14" fill="#345963">中等品質證據）</text>
<circle cx="429.5" cy="634.31" r="4" fill="#7A6E58"/>
<text x="444" y="639.63" font-size="14" fill="#345963">中度可疑：1 公分以上，扎（強烈建議，</text>
<text x="444" y="660.35" font-size="14" fill="#345963">低品質證據）</text>
<circle cx="429.5" cy="680.75" r="4" fill="#7A6E58"/>
<text x="444" y="686.07" font-size="14" fill="#345963">低度可疑：1.5 公分以上才扎，弱建議</text>
<circle cx="429.5" cy="706.47" r="4" fill="#7A6E58"/>
<text x="444" y="711.79" font-size="14" fill="#345963">極低度可疑：2 公分以上才「考慮」扎</text>
<circle cx="429.5" cy="732.19" r="4" fill="#7A6E58"/>
<text x="444" y="737.51" font-size="14" fill="#345963">純囊狀：不必切片（強烈建議）</text>
<text x="425" y="768.23" font-size="14" fill="#345963">同一份文件配的風險估計：高度可疑 70%</text>
<text x="425" y="789.23" font-size="14" fill="#345963">到 90% 以上、中度可疑 10% 到 20%、低度</text>
<text x="425" y="810.23" font-size="14" fill="#345963">可疑 5% 到 10%、極低度可疑低於 3%、純</text>
<text x="425" y="831.23" font-size="14" fill="#345963">囊狀低於 1%。</text>
<text x="425" y="870.73" font-size="12.5" fill="#527078">這個學會 2025 年的新版把「甲狀腺結節」整塊</text>
<text x="425" y="888.85" font-size="12.5" fill="#527078">拿掉了，結節這一塊沒有新版，所以這一欄講的</text>
<text x="425" y="906.98" font-size="12.5" fill="#527078">是 2015 年版，不是「最新版」。</text>
