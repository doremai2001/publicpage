<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1393" viewBox="0 0 620 1393" role="img" aria-labelledby="t d">
  <title id="t">Stupp 療程時間軸：六週同步、一段休息、六個維持療程</title>
  <desc id="d">示意圖：膠質母細胞瘤標準療程（Stupp 規約）的時間軸，分成三段。最上面一條按比例畫出整段療程的形狀：手術之後是①同步期六週、②休息 2 到 6 週、③維持期六個療程（每個療程 28 天）。手術到放療之間標註：資料支持六週以內開始，看不出對存活的影響，這不是越快越好的意思。中間是同步期六週的放大圖，把 42 天一天一格攤開：放療那一排只有週一到週五有格子，六週共 30 格，寫 2 Gy 乘 30 次等於 60 Gy；temozolomide 那一排七天都填滿、含週末，規約寫 75 mg/m²。兩排在週末的落差是這張圖的教學點。下面是維持期的放大圖：六個療程並排，每個療程 28 天，只有前 5 天吃藥、其餘 23 天不吃，規約寫 150 到 200 mg/m²。圖上有一段關於劑量的擋句：這些是隨機試驗規約裡的劑量，不是你的用法用量，也不是可以自己對照的劑量表，你的劑量由你的團隊算，不要自己停藥或補藥。右邊兩張側欄卡片：台灣健保藥品給付規定 9.25 條寫的是需經事前審查核准後使用、每次申請事前審查之療程以三個月為限、再次申請必須提出客觀證據如影像學證實無惡化才可繼續使用，所以真正的節奏器是每三個月一關、續用要附影像，條文裡沒有六個月這三個字；以及延長到 12 個療程的結果是無惡化存活略好、整體存活一樣、副作用比較多。本圖不出現任何存活月數。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#B9AE94" stroke-width="2" opacity="0.55"/></pattern><pattern id="hatchR" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(135)"><line x1="0" y1="0" x2="0" y2="8" stroke="#B04A4A" stroke-width="2" opacity="0.45"/></pattern><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="620" height="1393" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="40" y="62" font-size="13" fill="#A98722" font-weight="800" letter-spacing="2.5px">THE STUPP REGIMEN, LAID OUT IN DAYS</text>
<text x="40" y="108" font-size="27" fill="#123641" font-weight="800" class="r">六週、一段休息、六個療程：這是三段，不是</text>
<text x="40" y="141.48" font-size="27" fill="#123641" font-weight="800" class="r">一段</text>
<text x="40" y="180.96" font-size="15.5" fill="#527078">放療週一到週五照，藥七天都要吃——週末那兩格的落差，是這張圖要你看見的</text>
<text x="40" y="203.43" font-size="15.5" fill="#527078">東西。</text>
<text x="40" y="225.91" font-size="15.5" fill="#527078">圖上的劑量是試驗規約寫的劑量，不是你的用法用量；你的劑量由你的團隊算。</text>
<text x="40" y="284.38" font-size="15.48" fill="#8F7418" font-weight="800">整段療程的形狀（這一條是按比例畫的）</text>
<circle cx="47" cy="321.62" r="7" fill="#123641"/>
<text x="62" y="326.62" font-size="12.9" fill="#123641" font-weight="800">手術</text>
