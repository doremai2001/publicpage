<text x="167.06" y="399.62" font-size="10.32" fill="#527078" text-anchor="middle">2–6 週</text>
<text x="389.41" y="399.62" font-size="10.32" fill="#527078" text-anchor="middle">六個療程（每個療程 28 天）</text>
<text x="40" y="415.62" font-size="12.04" fill="#527078">手術到放療之間：資料支持六週以內開始，看不出對存活的影響——這不是「越快越好」的意思</text>
<text x="40" y="438.82" font-size="12.04" fill="#527078">以下兩張是放大圖，長度不成比例。</text>
