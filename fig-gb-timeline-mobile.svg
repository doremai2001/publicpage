<text x="64" y="1024.22" font-size="14.62" fill="#B04A4A" font-weight="800">關於圖上的 mg 數</text>
<text x="64" y="1044.87" font-size="12.9" fill="#345963" font-weight="600">這些是隨機試驗規約裡的劑量，寫在圖上是為了讓你看得懂療程的形狀。它不是你的用</text>
<text x="64" y="1063.79" font-size="12.9" fill="#345963" font-weight="600">法用量，也不是可以自己對照的劑量表——你的劑量由你的團隊依體表面積、血球與腎</text>
<text x="64" y="1082.71" font-size="12.9" fill="#345963" font-weight="600">肝功能算。不要自己停藥或補藥。</text>
<rect x="40" y="1137.6250000000002" width="6" height="75.66000000000008" rx="3" fill="#8F7418"/>
<rect x="40" y="1123.6250000000002" width="540" height="103.66000000000008" rx="14" fill="none" stroke="#B9AE94" stroke-width="2"/>
<text x="58" y="1151.63" font-size="13.33" fill="#8F7418" font-weight="800">台灣健保怎麼卡這個節奏（藥品給付規定 9.25，附表八之二）</text>
<text x="58" y="1173.69" font-size="12.04" fill="#345963">條文寫的是「需經事前審查核准後使用，每次申請事前審查之療程以三個月為限，再次申請必</text>
<text x="58" y="1190.89" font-size="12.04" fill="#345963">須提出客觀證據（如：影像學）證實無惡化，才可繼續使用」。所以真正的節奏器是每三個月</text>
<text x="58" y="1208.09" font-size="12.04" fill="#345963">一關、續用要附影像——條文裡沒有「六個月」這三個字。</text>
<rect x="40" y="1253.2850000000003" width="6" height="41.25999999999999" rx="3" fill="#00806B"/>
<rect x="40" y="1239.2850000000003" width="540" height="69.25999999999999" rx="14" fill="none" stroke="#B9AE94" stroke-width="2"/>
<text x="58" y="1267.29" font-size="13.33" fill="#00806B" font-weight="800">「可不可以多吃幾個月」</text>
<text x="58" y="1289.35" font-size="12.04" fill="#345963">延長到 12 個療程：無惡化存活略好、整體存活一樣、副作用比較多。本圖只畫規約的六個療程。</text>
<text x="40" y="1328.55" font-size="14" fill="#527078">示意圖，依 Stupp 2005 的療程規約、Stupp 2009、延長療程的合併分析與 GEINO</text>
<text x="40" y="1349.55" font-size="14" fill="#527078">14-01，以及衛生福利部中央健康保險署《全民健康保險藥品給付規定》9.25 條文重繪；</text>
<text x="40" y="1370.55" font-size="14" fill="#527078">各研究族群、設計與終點不同，數點不可直接互比。</text>
  </g>
</svg>
