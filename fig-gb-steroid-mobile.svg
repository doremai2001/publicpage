<rect x="40" y="864.78" width="540" height="22" rx="11" fill="#7A6E58"/>
<text x="40" y="854.78" font-size="14" fill="#123641" font-weight="800">骨質流失</text>
<text x="40" y="906.78" font-size="13" fill="#345963">骨密度年下降超過 5% 的風險，在開始用藥的前兩年最高（丹麥 15,099 位成人的例行 DXA）。</text>
<line x1="40" y1="933.78" x2="40" y2="959.78" stroke="#DBD3BF" stroke-width="1" stroke-linecap="butt" stroke-dasharray="3 5"/>
<line x1="148" y1="933.78" x2="148" y2="959.78" stroke="#DBD3BF" stroke-width="1" stroke-linecap="butt" stroke-dasharray="3 5"/>
<line x1="256" y1="933.78" x2="256" y2="959.78" stroke="#DBD3BF" stroke-width="1" stroke-linecap="butt" stroke-dasharray="3 5"/>
<line x1="364" y1="933.78" x2="364" y2="959.78" stroke="#DBD3BF" stroke-width="1" stroke-linecap="butt" stroke-dasharray="3 5"/>
<line x1="472" y1="933.78" x2="472" y2="959.78" stroke="#DBD3BF" stroke-width="1" stroke-linecap="butt" stroke-dasharray="3 5"/>
<line x1="580" y1="933.78" x2="580" y2="959.78" stroke="#DBD3BF" stroke-width="1" stroke-linecap="butt" stroke-dasharray="3 5"/>
<rect x="40" y="935.78" width="540" height="22" rx="11" fill="#B04A4A"/>
<text x="40" y="925.78" font-size="14" fill="#123641" font-weight="800">腎上腺功能不全</text>
<text x="40" y="977.78" font-size="13" fill="#345963">用藥少於 28 天 1.4%；超過一年 27.4%。依劑量分，低劑量組 2.4%、高劑量組 21.5%。（74</text>
<text x="40" y="996.78" font-size="13" fill="#345963">篇、3,753 位成人，全部以 ACTH 刺激試驗檢測；多為氣喘等非腦瘤族群。）</text>
<text x="580" y="1029.78" font-size="10.32" fill="#527078" text-anchor="end">時間（刻度不等距，只表示先後）</text>
<rect x="40" y="1049.78" width="540" height="142.93999999999983" rx="16" fill="none" stroke="#C9A83E" stroke-width="2.5"/>
<text x="64" y="1079.78" font-size="14.62" fill="#8F7418" font-weight="800">這張圖上唯一的 mg 數，是研究裡的分組</text>
<text x="64" y="1100.42" font-size="12.47" fill="#345963">腦轉移病人的回溯世代（n=97，1982 年）：每天 ≥12 mg 那一組，肌病變 4.5%、消化性</text>
<text x="64" y="1118.48" font-size="12.47" fill="#345963">潰瘍 5.6%、高血糖 6.7%；每天 ≤8 mg 那一組，三項都是 0%。</text>
<text x="64" y="1136.54" font-size="12.47" fill="#345963" font-weight="800">這是研究把病人分成兩組的方式，不是用法用量。</text>
<text x="64" y="1154.6" font-size="12.47" fill="#345963">潰瘍那一項真正的放大器是類固醇加止痛消炎藥：類固醇單獨相對風險 1.1（0.5 到 2.1），</text>
<text x="64" y="1172.66" font-size="12.47" fill="#345963">類固醇加 NSAID 相對風險 4.4（2.0 到 9.7）（1991 年、非腦瘤族群的巢式病例對照）。</text>
