<text x="40" y="603.78" font-size="14" fill="#123641" font-weight="800">症狀改善</text>
<text x="40" y="655.78" font-size="13" fill="#345963">起效 24–72 小時內。擠出去的是水，不是腫瘤。</text>
<line x1="40" y1="682.78" x2="40" y2="708.78" stroke="#DBD3BF" stroke-width="1" stroke-linecap="butt" stroke-dasharray="3 5"/>
<line x1="148" y1="682.78" x2="148" y2="708.78" stroke="#DBD3BF" stroke-width="1" stroke-linecap="butt" stroke-dasharray="3 5"/>
<line x1="256" y1="682.78" x2="256" y2="708.78" stroke="#DBD3BF" stroke-width="1" stroke-linecap="butt" stroke-dasharray="3 5"/>
<line x1="364" y1="682.78" x2="364" y2="708.78" stroke="#DBD3BF" stroke-width="1" stroke-linecap="butt" stroke-dasharray="3 5"/>
<line x1="472" y1="682.78" x2="472" y2="708.78" stroke="#DBD3BF" stroke-width="1" stroke-linecap="butt" stroke-dasharray="3 5"/>
