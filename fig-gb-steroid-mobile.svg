<text x="40" y="575.78" font-size="9.89" fill="#527078" font-weight="700" text-anchor="start">開始用藥</text>
<text x="148" y="575.78" font-size="9.89" fill="#527078" font-weight="700" text-anchor="middle">24–72 小時</text>
