<rect x="256" y="684.78" width="324" height="22" rx="11" fill="#96790F"/>
<text x="40" y="674.78" font-size="14" fill="#123641" font-weight="800">庫欣臉、腳踝水腫</text>
<text x="40" y="726.78" font-size="13" fill="#345963">第 7 天已經測得到差異（P＝0.02），第 28 天更明顯（P＝0.03）；隨劑量與時間增加。這是</text>
<text x="40" y="745.78" font-size="13" fill="#345963">隨機試驗裡唯一一項跟劑量明確有關的副作用。</text>
<line x1="40" y1="772.78" x2="40" y2="798.78" stroke="#DBD3BF" stroke-width="1" stroke-linecap="butt" stroke-dasharray="3 5"/>
<line x1="148" y1="772.78" x2="148" y2="798.78" stroke="#DBD3BF" stroke-width="1" stroke-linecap="butt" stroke-dasharray="3 5"/>
