<text x="64" y="1246.72" font-size="14.62" fill="#123641" font-weight="800">減到後面，會分出兩條路——而它們都很像腫瘤變壞</text>
<rect x="64" y="1270.5" width="492" height="62" rx="12" fill="#F6E2E0"/>
<text x="78" y="1296.5" font-size="15" fill="#B04A4A" font-weight="800">腎上腺功能不全</text>
<text x="78" y="1318.5" font-size="12.5" fill="#345963">沒力氣、頭暈、站起來眼前發黑、噁心</text>
<rect x="64" y="1340.5" width="492" height="62" rx="12" fill="#F6E2E0"/>
<text x="78" y="1366.5" font-size="15" fill="#B04A4A" font-weight="800">症狀反彈</text>
<text x="78" y="1388.5" font-size="12.5" fill="#345963">頭痛回來、原本好轉的神經症狀又出現</text>
<text x="64" y="1416.5" font-size="12.04" fill="#345963" font-weight="600">長得一樣，處理方向相反。所以減量期間出現這些狀況，是打電話回去、不是自己加量或自</text>
<text x="64" y="1433.7" font-size="12.04" fill="#345963" font-weight="600">己停。</text>
<rect x="40" y="1476.8999999999999" width="540" height="95.34000000000015" rx="16" fill="#F6E2E0" stroke="#B04A4A" stroke-width="2.5"/>
<text x="64" y="1506.9" font-size="15.48" fill="#B04A4A" font-weight="800">減量表沒有一份是為你算的</text>
<text x="64" y="1532.4" font-size="12.9" fill="#345963" font-weight="600">這張圖上所有的 mg 數都是研究裡的分組，不是用法用量。不可自行加量、不可自行減</text>
<text x="64" y="1551.32" font-size="12.9" fill="#345963" font-weight="600">量、不可自行停藥；什麼時候減、減多少，由你的團隊依你的症狀與影像決定。</text>
<text x="40" y="1590.24" font-size="14" fill="#527078">示意圖，依 Jessurun 2019、Piper 1991、Kusudo 2026、Hansen 2025、</text>
<text x="40" y="1611.24" font-size="14" fill="#527078">Broersen 2015 與 EANO 2021 重繪；各研究族群、設計與終點不同，數點不可直接互</text>
<text x="40" y="1632.24" font-size="14" fill="#527078">比。</text>
