<rect x="40" y="774.78" width="432" height="22" rx="11" fill="#5C77C4"/>
<text x="40" y="764.78" font-size="14" fill="#123641" font-weight="800">精神症狀</text>
<text x="40" y="816.78" font-size="13" fill="#345963">開始用藥後 8 週內是「急性期」，躁的症狀比鬱常見（勝算比 2.42；勝算比不是機率的幾倍）；</text>
<text x="40" y="835.78" font-size="13" fill="#345963">精神病症狀約 2.4%（0.76 到 7.26）。GRADE 證據確定性低到極低。</text>
<line x1="40" y1="862.78" x2="40" y2="888.78" stroke="#DBD3BF" stroke-width="1" stroke-linecap="butt" stroke-dasharray="3 5"/>
<line x1="148" y1="862.78" x2="148" y2="888.78" stroke="#DBD3BF" stroke-width="1" stroke-linecap="butt" stroke-dasharray="3 5"/>
