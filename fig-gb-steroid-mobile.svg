<text x="66" y="315.38" font-size="11.61" fill="#527078" font-weight="700">起始（症狀性水腫控制住之後）</text>
<text x="554" y="439.38" font-size="11.61" fill="#527078" font-weight="700" text-anchor="end">最低有效劑量，或停藥</text>
<line x1="111.6" y1="449.38" x2="500.12" y2="449.38" stroke="#B9AE94" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="508.4,449.38 500.18,453.05 500.18,445.71" fill="#B9AE94"/>
<text x="62" y="475.38" font-size="12.04" fill="#527078">階數、每一階停多久、每次降多少，這張圖不畫。各家指引的起始劑量與減量速度彼此不一致，</text>
<text x="62" y="492.58" font-size="12.04" fill="#527078">而且部分互相引用；其中一份的證據基礎裡，沒有任何一位膠質瘤病人。</text>
