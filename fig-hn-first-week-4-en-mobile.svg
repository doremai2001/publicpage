<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1500" viewBox="0 0 720 1500" role="img" aria-labelledby="title desc">
  <title id="title">Several work-up tracks move forward together after diagnosis</title><desc id="desc">Pathology review, staging and pre-treatment assessment lead to multidisciplinary review and a treatment plan.</desc>
  <defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A2731"/><stop offset="1" stop-color="#123D48"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#041318" flood-opacity=".25"/></filter><style>.sans{font-family:Arial,"Noto Sans",sans-serif}.serif{font-family:Georgia,"Noto Serif",serif}.t{fill:#F5F0E3;font-size:43px;font-weight:800}.sub{fill:#B7C9CA;font-size:22px}.ct{fill:#F5F0E3;font-size:28px;font-weight:800}.cb{fill:#CAD9D9;font-size:21px}.sm{fill:#9FB7BA;font-size:16px}</style></defs>
  <rect width="720" height="1500" rx="34" fill="url(#b)"/>
  <g class="sans"><text x="54" y="70" fill="#C9A83E" font-size="18" font-weight="800" letter-spacing="4">AFTER THE DIAGNOSIS</text><text x="54" y="137" class="t serif">Not idle waiting</text><text x="54" y="191" class="t serif">several tracks move at once</text><text x="54" y="238" class="sub">Assemble the right information before treatment.</text>
    <g filter="url(#s)"><rect x="54" y="295" width="612" height="150" rx="24" fill="#F3EDDE"/><circle cx="112" cy="345" r="27" fill="#C9A83E"/><text x="112" y="355" text-anchor="middle" fill="#0A2731" font-size="25" font-weight="900">1</text><text x="157" y="355" fill="#143641" font-size="30" font-weight="900">Biopsy confirms diagnosis</text><text x="157" y="400" fill="#46636A" font-size="21">Staging and preparation begin</text></g><path d="M360 446v52" stroke="#C9A83E" stroke-width="6"/>
    <g filter="url(#s)"><rect x="54" y="500" width="612" height="190" rx="24" fill="#173F49" stroke="#3B626A" stroke-width="2"/><circle cx="112" cy="555" r="27" fill="#C9A83E"/><text x="112" y="565" text-anchor="middle" fill="#0A2731" font-size="24" font-weight="900">A</text><text x="157" y="565" class="ct">Pathology review</text><text x="92" y="620" class="cb">Cell type and grade</text><text x="92" y="657" class="cb">p16 when indicated in oropharyngeal cancer</text></g><path d="M360 691v43" stroke="#6D8588" stroke-width="4"/>
    <g filter="url(#s)"><rect x="54" y="736" width="612" height="190" rx="24" fill="#173F49" stroke="#3B626A" stroke-width="2"/><circle cx="112" cy="791" r="27" fill="#C9A83E"/><text x="112" y="801" text-anchor="middle" fill="#0A2731" font-size="24" font-weight="900">B</text><text x="157" y="801" class="ct">Imaging &amp; endoscopic staging</text><text x="92" y="856" class="cb">Head and neck MRI or CT</text><text x="92" y="893" class="cb">PET and mucosal examination when needed</text></g><path d="M360 927v43" stroke="#6D8588" stroke-width="4"/>
    <g filter="url(#s)"><rect x="54" y="972" width="612" height="190" rx="24" fill="#173F49" stroke="#3B626A" stroke-width="2"/><circle cx="112" cy="1027" r="27" fill="#C9A83E"/><text x="112" y="1037" text-anchor="middle" fill="#0A2731" font-size="24" font-weight="900">C</text><text x="157" y="1037" class="ct">Before treatment</text><text x="92" y="1092" class="cb">Dental, nutrition, blood tests, heart and lungs</text><text x="92" y="1129" class="cb">Many steps can run alongside imaging</text></g><path d="M360 1163v45" stroke="#C9A83E" stroke-width="6"/>
    <g filter="url(#s)"><rect x="54" y="1210" width="612" height="185" rx="25" fill="#F3EDDE"/><circle cx="112" cy="1265" r="29" fill="#C9A83E"/><path d="M98 1268h28m-23-10h18m-13-10h8" stroke="#0A2731" stroke-width="5" stroke-linecap="round"/><text x="157" y="1276" fill="#143641" font-size="29" font-weight="900">Multidisciplinary review</text><text x="92" y="1330" fill="#46636A" font-size="21">Pathology, imaging, fitness and personal goals</text><text x="92" y="1372" fill="#99791B" font-size="21" font-weight="800">Plan ready → treatment begins</text></g><text x="54" y="1458" class="sm">Adapted from article reference [7] · Original infographic</text>
  </g>
</svg>
