<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1194" viewBox="0 0 1440 1194" role="img" aria-labelledby="t d">
  <title id="t">深吸氣閉氣：拉開的是距離，降下來的是劑量</title>
  <desc id="d">示意圖（非實際解剖，也非實際劑量分布）：深吸氣閉氣如何把心臟拉離照野，以及降下來的是什麼。左格自由呼吸：心臟貼著胸壁，切線照野的邊緣容易掃到心臟前緣。右格深吸氣閉氣：橫膈下移、肺撐開，心臟被推離照野，兩者之間出現一段距離。量得到的降幅：全心與左前降支的平均劑量降低約 20 到 70%，區間很寬、因人而異（綜述）；12 篇觀察性研究、1,019 位左側病人的統合分析顯示心臟與左前降支劑量顯著較低，而標靶涵蓋沒有差異；文獻平均（2014 到 2017 年發表、左側）有呼吸控制 1.7 Gy、沒有呼吸控制 4.5 Gy，2003 到 2013 年文獻中切線照野加呼吸控制為 1.3 Gy。同樣量得到的另一面：一項研究裡 72 名經過預選與訓練的病人，仍有 29% 無法完成閉氣定位掃描；另一項 112 人中有 20 人無法耐受主動呼吸控制系統；綜述估計約 75% 做閉氣的人有劑量學獲益，練不起來會回到自由呼吸下的心臟閃避去規劃。證據等級是本圖的核心標記：以上每一個數字都是劑量學終點，DIBH 降低心臟事件的直接證據（已讀出的隨機試驗或大型世代比較）查無；事件那一層來自世代研究——平均心臟劑量每多 1 Gy，主要冠狀動脈事件率相對上升 7.4%，看不到明顯的安全下限（瑞典與丹麥 1958 到 2001 年世代）。兩截都硬，但它們是兩截，不能縫成「閉氣已證明減少心臟病發作」。腳註提醒基本款不是沒有保護：一般強度調控與 3D 順形技術做出來的現代左乳平均心臟劑量，文獻平均已落在 2.16 到 3.6 Gy 之間。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><pattern id="hz" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#96790F" stroke-width="2" opacity="0.55"/></pattern><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="1194" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="86" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">DIBH — DOSIMETRY, NOT EVENTS</text>
<text x="84" y="148" font-size="44" fill="#123641" font-weight="800" class="r">深吸氣閉氣：拉開的是距離，降下來的是劑量</text>
<text x="84" y="194" font-size="21" fill="#527078">吸飽氣，橫膈下移、肺張開，心臟被拉離胸壁與照野——這是姿勢，不是機器，可以疊加在任何光子技術上。</text>
<text x="84" y="224" font-size="21" fill="#527078">圖上每一個數字都是劑量學終點；心臟事件那一層另外標，兩層不能縫成一句話。</text>
<g filter="url(#sh)"><rect x="84" y="264" width="600" height="358" rx="18" fill="#FFFFFF"/></g>
<text x="110" y="298" font-size="18" fill="#123641" font-weight="800">自由呼吸</text>
<rect x="184.2" y="328.5" width="399.6" height="225" rx="48.6" fill="#F4EFE3" stroke="#9A9282" stroke-width="2"/>
<ellipse cx="292.2" cy="416" rx="72.9" ry="50" fill="#E9E2CF"/>
<ellipse cx="475.8" cy="416" rx="72.9" ry="50" fill="#E9E2CF"/>
<text x="292.2" y="420.86" font-size="13.5" fill="#6B8084" font-weight="700" text-anchor="middle">肺</text>
<path d="M 192.2,473.5 Q 384,438.5 575.8,473.5" fill="none" stroke="#6B8084" stroke-width="2.5"/>
<text x="246.3" y="495.5" font-size="13.5" fill="#6B8084" text-anchor="middle">橫膈</text>
<path d="M 546,363.5 C 643.2,371 643.2,431 546,438.5" fill="#F4EFE3" stroke="#9A9282" stroke-width="2"/>
<rect x="462.3" y="353.5" width="162" height="92.5" rx="10" fill="url(#hz)" stroke="#96790F" stroke-width="2" stroke-dasharray="7 5"/>
<text x="540.6" y="341" font-size="13.5" fill="#8F7418" font-weight="700" text-anchor="middle">乳房與切線照野</text>
<ellipse cx="419.1" cy="441" rx="56.7" ry="33.75" fill="#5C77C4" opacity="0.88"/>
<text x="419.1" y="445.86" font-size="13.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">心臟</text>
<text x="114" y="600" font-size="14.2" fill="#345963">心臟貼著胸壁，切線照野的邊緣容易掃到心臟前緣。</text>
<g filter="url(#sh)"><rect x="756" y="264" width="600" height="358" rx="18" fill="#FFFFFF"/></g>
<text x="782" y="298" font-size="18" fill="#123641" font-weight="800">深吸氣閉氣（DIBH）</text>
<rect x="856.2" y="328.5" width="399.6" height="225" rx="48.6" fill="#F4EFE3" stroke="#9A9282" stroke-width="2"/>
<ellipse cx="964.2" cy="423.5" rx="72.9" ry="62.5" fill="#E9E2CF"/>
<ellipse cx="1147.8" cy="423.5" rx="72.9" ry="62.5" fill="#E9E2CF"/>
<text x="964.2" y="428.36" font-size="13.5" fill="#6B8084" font-weight="700" text-anchor="middle">肺</text>
<path d="M 864.2,506 Q 1056,471 1247.8,506" fill="none" stroke="#6B8084" stroke-width="2.5"/>
<text x="918.3" y="528" font-size="13.5" fill="#6B8084" text-anchor="middle">橫膈</text>
<path d="M 1218,363.5 C 1315.2,371 1315.2,431 1218,438.5" fill="#F4EFE3" stroke="#9A9282" stroke-width="2"/>
<rect x="1134.3" y="353.5" width="162" height="92.5" rx="10" fill="url(#hz)" stroke="#96790F" stroke-width="2" stroke-dasharray="7 5"/>
<text x="1212.6" y="341" font-size="13.5" fill="#8F7418" font-weight="700" text-anchor="middle">乳房與切線照野</text>
<ellipse cx="1031.7" cy="461" rx="56.7" ry="33.75" fill="#5C77C4" opacity="0.88"/>
<text x="1031.7" y="465.86" font-size="13.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">心臟</text>
<line x1="1098.4" y1="461" x2="1130.3" y2="461" stroke="#123641" stroke-width="2" stroke-linecap="round"/>
<line x1="1130.3" y1="461" x2="1120.6" y2="466.2" stroke="#123641" stroke-width="2" stroke-linecap="round"/>
<line x1="1130.3" y1="461" x2="1120.6" y2="455.8" stroke="#123641" stroke-width="2" stroke-linecap="round"/>
<line x1="1124.3" y1="461" x2="1092.4" y2="461" stroke="#123641" stroke-width="2" stroke-linecap="round"/>
<line x1="1092.4" y1="461" x2="1102.1" y2="466.2" stroke="#123641" stroke-width="2" stroke-linecap="round"/>
<line x1="1092.4" y1="461" x2="1102.1" y2="455.8" stroke="#123641" stroke-width="2" stroke-linecap="round"/>
<text x="1111.35" y="514.75" font-size="13.5" fill="#123641" font-weight="800" text-anchor="middle">距離拉開</text>
<text x="786" y="600" font-size="14.2" fill="#345963">橫膈下移、肺撐開，心臟被推離照野——拉開的是距離。</text>
<g filter="url(#sh)"><rect x="84" y="654" width="600" height="202" rx="18" fill="#FFFFFF"/></g>
<g filter="url(#sh)"><rect x="756" y="654" width="600" height="202" rx="18" fill="#FFFFFF"/></g>
<text x="110" y="690" font-size="18" fill="#123641" font-weight="800">量得到的：降幅</text>
<text x="110" y="720" font-size="14.2" fill="#345963">全心與左前降支（LAD）的平均劑量降低約 20 到 70%——區間很寬，因人而異（綜述）。</text>
<text x="110" y="744" font-size="14.2" fill="#345963">12 篇觀察性研究、1,019 位左側病人的統合分析：心臟與 LAD 劑量顯著較低，標靶</text>
<text x="110" y="768" font-size="14.2" fill="#345963">涵蓋沒有差異。</text>
<text x="110" y="792" font-size="14.2" fill="#345963">文獻平均（2014 到 2017 年發表、左側）：有呼吸控制 1.7 Gy、沒有 4.5 Gy；切</text>
<text x="110" y="816" font-size="14.2" fill="#345963">線照野加呼吸控制 1.3 Gy（2003 到 2013 年文獻）。</text>
<text x="782" y="690" font-size="18" fill="#123641" font-weight="800">同樣量得到的：不是人人做得到</text>
<text x="782" y="720" font-size="14.2" fill="#345963">一項研究裡 72 名經過預選與訓練的病人，仍有 29% 無法完成閉氣定位掃描。</text>
<text x="782" y="744" font-size="14.2" fill="#345963">另一項 112 人中有 20 人無法耐受主動呼吸控制系統；綜述估計約 75% 做閉氣的人</text>
<text x="782" y="768" font-size="14.2" fill="#345963">有劑量學獲益。</text>
<text x="782" y="792" font-size="14.2" fill="#345963">練不起來不是誰的失敗——計畫會回到自由呼吸下的心臟閃避去做。</text>
<rect x="84" y="888" width="1272" height="138" rx="16" fill="none" stroke="#C9A83E" stroke-width="2.5"/>
<text x="110" y="920" font-size="17" fill="#8F7418" font-weight="800">證據等級：這張圖畫的是劑量，不是心臟事件</text>
<text x="110" y="948" font-size="15" fill="#345963">上面每一個數字都是劑量學終點。DIBH 降低心臟事件的直接證據——已讀出的隨機試驗或大型世代比較——查無。</text>
<text x="110" y="976" font-size="15" fill="#345963">事件那一層來自世代研究：平均心臟劑量每多 1 Gy，主要冠狀動脈事件率相對上升 7.4%，看不到明顯的安全下限（瑞典與丹麥 1958 到 2001 年世代）。</text>
<text x="110" y="1004" font-size="15" fill="#345963">兩截都硬，但它們是兩截：劑量降低量得到、劑量與事件的關係有世代證據——不能縫成「閉氣已證明減少心臟病發作」。</text>
<text x="84" y="1070" font-size="14.5" fill="#6B8084" font-weight="600">基本款不是沒有保護：一般強度調控與 3D 順形技術做出來的現代左乳平均心臟劑量，文獻平均已落在 2.16 到 3.6 Gy 之間。</text>
<text x="84" y="1122" font-size="16" fill="#6B8084">示意圖（非實際解剖，也非實際劑量分布），依 Lai 2022、Lu 2020、Taylor 2015、Drost 2018 與 Darby 2013 重繪</text>
<text x="84" y="1146" font-size="16" fill="#6B8084">劑量學與臨床事件是兩層證據，圖上分開標示；適用性與收費身分請與你的治療團隊確認</text>
  </g>
