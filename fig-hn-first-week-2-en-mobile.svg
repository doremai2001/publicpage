<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1660" viewBox="0 0 720 1660" role="img" aria-labelledby="title desc">
  <title id="title">How to read research about waiting time</title><desc id="desc">Large retrospective registries associate longer waits with worse survival, but population data are not a personal countdown.</desc>
  <defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#0B2832" flood-opacity=".14"/></filter><style>.sans{font-family:Arial,"Noto Sans",sans-serif}.serif{font-family:Georgia,"Noto Serif",serif}.t{fill:#123641;font-size:46px;font-weight:900}.sub{fill:#527078;font-size:23px}.m{fill:#123641;font-size:48px;font-weight:900}.l{fill:#345963;font-size:22px}.ct{font-size:29px;font-weight:900}.cb{font-size:22px}.sm{fill:#6B8084;font-size:17px}</style></defs>
  <rect width="720" height="1660" rx="34" fill="url(#b)"/>
  <g class="sans">
    <text x="54" y="70" fill="#A98722" font-size="18" font-weight="900" letter-spacing="4">HOW TO READ THE EVIDENCE</text>
    <text x="54" y="137" class="t serif">Waiting has a cost</text><text x="54" y="195" class="t serif">not a personal countdown</text><text x="54" y="245" class="sub">Association does not prove waiting was the cause.</text>
    <g filter="url(#s)"><rect x="54" y="305" width="612" height="240" rx="24" fill="#FFF"/><text x="92" y="360" fill="#A98722" font-size="22" font-weight="900">TAIWAN · ORAL CAVITY SCC</text><text x="92" y="430" class="m">18,677 patients</text><text x="92" y="480" class="l">Treatment interval associated with</text><text x="92" y="518" class="l">5-year overall survival (2004–2010)</text></g>
    <g filter="url(#s)"><rect x="54" y="585" width="612" height="240" rx="24" fill="#FFF"/><text x="92" y="640" fill="#A98722" font-size="22" font-weight="900">UNITED STATES · H&amp;N SCC</text><text x="92" y="710" class="m">51,655 patients</text><text x="92" y="760" class="l">61–90 days vs within 30 days</text><text x="92" y="798" class="l">HR for death 1.13 (95% CI 1.08–1.19)</text></g>
    <g filter="url(#s)"><rect x="54" y="865" width="612" height="250" rx="24" fill="#123641"/><text x="92" y="925" fill="#F7F1E4" class="ct">The studies show association</text><text x="92" y="978" fill="#D4E0DF" class="cb">Complex disease often takes longer</text><text x="92" y="1015" fill="#D4E0DF" class="cb">to assess — and carries its own risk.</text><line x1="92" y1="1050" x2="628" y2="1050" stroke="#C9A83E" stroke-width="3"/><text x="92" y="1085" fill="#F2D879" font-size="20" font-weight="900">Not “X more days = Y% more danger”</text></g>
    <g filter="url(#s)"><rect x="54" y="1155" width="612" height="200" rx="24" fill="#173F49"/><circle cx="101" cy="1207" r="24" fill="#C9A83E"/><path d="M90 1208l8 8 15-18" fill="none" stroke="#0A2731" stroke-width="5"/><text x="143" y="1219" fill="#F7F1E4" class="ct">The useful reading</text><text x="92" y="1272" fill="#D4E0DF" class="cb">Complete necessary staging efficiently.</text><text x="92" y="1310" fill="#F2D879" font-size="20" font-weight="900">Complete work-up, no avoidable stalls.</text></g>
    <g filter="url(#s)"><rect x="54" y="1395" width="612" height="190" rx="24" fill="#FFF"/><circle cx="101" cy="1447" r="24" fill="#D8C78F"/><path d="M92 1438l18 18m0-18-18 18" stroke="#123641" stroke-width="5"/><text x="143" y="1459" fill="#123641" class="ct">The misleading reading</text><text x="92" y="1512" fill="#45656D" class="cb">Draw one safe / dangerous cutoff,</text><text x="92" y="1550" fill="#99791B" font-size="20" font-weight="900">or skip staging just to start sooner.</text></g>
    <text x="54" y="1625" class="sm">Sources: article references [2][3] · Original infographic</text>
  </g>
</svg>
