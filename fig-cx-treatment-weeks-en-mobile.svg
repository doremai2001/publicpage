<text x="110" y="516" font-size="13.5" fill="#345963" font-weight="700" text-anchor="end">Week 4</text>
<rect x="131" y="487" width="76" height="42" rx="8" fill="#5C77C4" opacity="0.85"/>
<circle cx="169" cy="508" r="6" fill="#C9A83E" stroke="#8F7418" stroke-width="1.5"/>
<rect x="217" y="487" width="76" height="42" rx="8" fill="#5C77C4" opacity="0.85"/>
<rect x="303" y="487" width="76" height="42" rx="8" fill="#5C77C4" opacity="0.85"/>
<rect x="389" y="487" width="76" height="42" rx="8" fill="#5C77C4" opacity="0.85"/>
<rect x="475" y="487" width="76" height="42" rx="8" fill="#5C77C4" opacity="0.85"/>
<text x="110" y="570" font-size="13.5" fill="#345963" font-weight="700" text-anchor="end">Week 5</text>
<rect x="131" y="541" width="76" height="42" rx="8" fill="#5C77C4" opacity="0.85"/>
<circle cx="169" cy="562" r="6" fill="#C9A83E" stroke="#8F7418" stroke-width="1.5"/>
