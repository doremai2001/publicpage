<text x="110" y="624" font-size="13.5" fill="#345963" font-weight="700" text-anchor="end">Week 6</text>
<rect x="131" y="595" width="76" height="42" rx="8" fill="none" stroke="#DBD3BF" stroke-width="1.5"/>
<rect x="217" y="595" width="76" height="42" rx="8" fill="#00806B"/>
