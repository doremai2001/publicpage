<circle cx="169" cy="616" r="6" fill="none" stroke="#8F7418" stroke-width="2"/>
<text x="128" y="674" font-size="13" fill="#6B8084">Weekends off</text>
<rect x="60" y="688" width="14" height="14" rx="4" fill="#5C77C4" opacity="0.85"/>
<rect x="60" y="688" width="14" height="14" rx="4" fill="#5C77C4" opacity="0.85"/>
<text x="84" y="700" font-size="13.2" fill="#345963" font-weight="600">External beam: 45 Gy / 25 fractions (IMRT/VMAT</text>
<text x="84" y="719" font-size="13.2" fill="#345963" font-weight="600">+ daily image guidance)</text>
<circle cx="67" cy="741" r="6.5" fill="#C9A83E" stroke="#8F7418" stroke-width="1.5"/>
<text x="84" y="746" font-size="13.2" fill="#345963" font-weight="600">Weekly chemotherapy: cisplatin 40 mg/m², 5–6 </text>
<text x="84" y="765" font-size="13.2" fill="#345963" font-weight="600">doses (day set by your team)</text>
<rect x="60" y="780" width="14" height="14" rx="4" fill="#00806B"/>
<text x="84" y="792" font-size="13.2" fill="#345963" font-weight="600">Brachytherapy: 3–4 insertions, ≥6–8 h apart; </text>
<text x="84" y="811" font-size="13.2" fill="#345963" font-weight="600">final weeks or within 1–2 weeks after</text>
<text x="44" y="856" font-size="16" fill="#123641" font-weight="800">Three finish-line anchors, each with its own source</text>
<g filter="url(#sh)"><rect x="44" y="870" width="532" height="84" rx="16" fill="#FFFFFF"/></g>
<text x="66" y="904" font-size="22" fill="#8F7418" font-weight="800">≤ 7 weeks</text>
<text x="66" y="928" font-size="13.5" fill="#345963">ESGO 2023 guideline: cap on overall </text>
<text x="66" y="948" font-size="13.5" fill="#345963">treatment time, brachytherapy included.</text>
<g filter="url(#sh)"><rect x="44" y="968" width="532" height="104" rx="16" fill="#FFFFFF"/></g>
<text x="66" y="1002" font-size="22" fill="#8F7418" font-weight="800">≤ 50 days</text>
<text x="66" y="1026" font-size="13.5" fill="#345963">EMBRACE-II target — 21% of the EMBRACE-I</text>
<text x="66" y="1046" font-size="13.5" fill="#345963">cohort exceeded it; the whole team races</text>
<text x="66" y="1066" font-size="13.5" fill="#345963">this.</text>
<g filter="url(#sh)"><rect x="44" y="1086" width="532" height="104" rx="16" fill="#FFFFFF"/></g>
<text x="66" y="1120" font-size="22" fill="#8F7418" font-weight="800">56 days</text>
<text x="66" y="1144" font-size="13.5" fill="#345963">Retrospective data: pelvic recurrence </text>
<text x="66" y="1164" font-size="13.5" fill="#345963">26% vs 9% when brachytherapy finished </text>
<text x="66" y="1184" font-size="13.5" fill="#345963">later (CCRT era, small series).</text>
<rect x="44" y="1212" width="532" height="176" rx="18" fill="none" stroke="#C9A83E" stroke-width="2"/>
<text x="64" y="1246" font-size="14" fill="#123641" font-weight="700">Weeks four and five feel worst — and are</text>
<text x="64" y="1273" font-size="14" fill="#123641" font-weight="700">exactly when not to grant yourself a break:</text>
<text x="64" y="1300" font-size="14" fill="#123641" font-weight="700">longer overall time costs local control</text>
<text x="64" y="1327" font-size="14" fill="#345963">(“~1%/day” is radiotherapy-alone-era data).</text>
<text x="64" y="1354" font-size="14" fill="#345963">Report symptoms; pausing is the team's call —</text>
<text x="64" y="1381" font-size="14" fill="#345963">your job is to speak up, not to endure.</text>
<text x="44" y="1416" font-size="12" fill="#6B8084">Schematic redrawn from ESGO/ESTRO/ESP 2023 and</text>
<text x="44" y="1436" font-size="12" fill="#6B8084">EMBRACE-II | Girinsky 1993, Song 2013</text>
  </g>
</svg>
