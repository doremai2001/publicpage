<rect x="389" y="379" width="76" height="42" rx="8" fill="#5C77C4" opacity="0.85"/>
<rect x="475" y="379" width="76" height="42" rx="8" fill="#5C77C4" opacity="0.85"/>
<text x="110" y="462" font-size="13.5" fill="#345963" font-weight="700" text-anchor="end">Week 3</text>
<rect x="131" y="433" width="76" height="42" rx="8" fill="#5C77C4" opacity="0.85"/>
<circle cx="169" cy="454" r="6" fill="#C9A83E" stroke="#8F7418" stroke-width="1.5"/>
