<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1368" viewBox="0 0 1440 1368" role="img" aria-labelledby="t d">
  <title id="t">The 2021 WHO CNS5 decision tree: three gates first, then the five-item list</title>
  <desc id="d">Schematic decision tree for how the 2021 WHO CNS5 classification arrives at the name glioblastoma. Step one is three entry gates, all of which are required: adult-type (not a paediatric-type diffuse glioma), diffuse (not one of the circumscribed gliomas), and astrocytic glioma. Only once all three gates are passed does step two ask whether IDH (isocitrate dehydrogenase) is mutated. On the IDH-mutant side a second question follows, 1p/19q co-deletion: co-deleted gives oligodendroglioma, IDH-mutant and 1p/19q-codeleted; not co-deleted gives astrocytoma, IDH-mutant, grade 2, 3 or 4, and homozygous deletion of CDKN2A/B makes it grade 4 outright without waiting for histology. The IDH-wildtype side goes to step three, a list of five criteria of which any single one is enough: microvascular proliferation, necrosis, TERT promoter mutation, EGFR amplification, and gain of whole chromosome 7 with loss of whole chromosome 10. Meeting one of them gives glioblastoma, IDH-wildtype, CNS WHO grade 4. Three side notes sit off the main path: first, lack of an IDH mutation alone is not enough to call a tumour grade 4, because plenty of more indolent tumours are also IDH-wildtype, so one of the five criteria must still be met; second, EGFR must show focal high-level amplification, trisomy 7 does not count and immunohistochemistry cannot be used to call amplification; third, in a young patient think of paediatric-type diffuse glioma first, as CNS5 no longer applies the word glioblastoma to paediatric-type tumours. At the foot of the figure two proportion bars carry US registry data from CBTRUS 2018 to 2022: among all brain and other CNS tumours, glioblastoma is 13.7 per cent, meningioma 42.6 per cent and other tumours 43.7 per cent; among malignant tumours only, glioblastoma is 52.2 per cent and other malignant tumours 47.8 per cent. For Taiwan the figure states only that 742 new brain cancers were registered in 2023, with no official breakdown for the glioblastoma share. The figure contains no survival numbers.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#B9AE94" stroke-width="2" opacity="0.55"/></pattern><pattern id="hatchR" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(135)"><line x1="0" y1="0" x2="0" y2="8" stroke="#B04A4A" stroke-width="2" opacity="0.45"/></pattern><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="1368" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="86" font-size="18" fill="#A98722" font-weight="800" letter-spacing="4px">2021 WHO CNS5 — HOW THE NAME IS DECIDED</text>
<text x="84" y="148" font-size="42" fill="#123641" font-weight="800" class="r">Three gates first, then the five-item list</text>
<text x="84" y="206.08" font-size="20" fill="#527078">The 2021 WHO CNS5 classification asks three entry questions first; only once all three are passed do the molecular criteria count.</text>
<text x="84" y="235.08" font-size="20" fill="#527078">This figure shows how a name is reached. It carries no survival numbers — those belong to the article on what the numbers mean.</text>
<text x="84" y="304.08" font-size="19" fill="#8F7418" font-weight="800">Step 1 | Three gates (entry conditions, all three required)</text>
<rect x="84" y="332.08" width="382.67" height="64" rx="16" fill="#FFFFFF" stroke="#B9AE94" stroke-width="2"/>
<text x="104" y="364.08" font-size="20" fill="#123641" font-weight="800">Adult-type</text>
<text x="104" y="388.08" font-size="14.5" fill="#527078">not a paediatric-type diffuse glioma</text>
<line x1="478.67" y1="364.08" x2="508.39" y2="364.08" stroke="#B9AE94" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="516.67,364.08 508.45,367.75 508.45,360.41" fill="#B9AE94"/>
<rect x="528.67" y="332.08" width="382.67" height="64" rx="16" fill="#FFFFFF" stroke="#B9AE94" stroke-width="2"/>
<text x="548.67" y="364.08" font-size="20" fill="#123641" font-weight="800">Diffuse</text>
<text x="548.67" y="388.08" font-size="14.5" fill="#527078">not one of the circumscribed gliomas</text>
<line x1="923.33" y1="364.08" x2="953.05" y2="364.08" stroke="#B9AE94" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="961.33,364.08 953.12,367.75 953.12,360.41" fill="#B9AE94"/>
<rect x="973.33" y="332.08" width="382.67" height="64" rx="16" fill="#FFFFFF" stroke="#B9AE94" stroke-width="2"/>
<text x="993.33" y="364.08" font-size="20" fill="#123641" font-weight="800">Astrocytic glioma</text>
<text x="993.33" y="388.08" font-size="14.5" fill="#527078">a diffuse glioma of astrocytic lineage</text>
<text x="84" y="428.08" font-size="15" fill="#527078">Only after all three gates does the molecular work-up decide the name.</text>
<rect x="84" y="442.08" width="1272" height="46" rx="14" fill="#F3E8CD" stroke="#C9A83E" stroke-width="2.5"/>
<text x="104" y="469.08" font-size="19" fill="#8F7418" font-weight="800">Step 2 | Is IDH (isocitrate dehydrogenase) mutated?</text>
<line x1="392" y1="500.08" x2="392" y2="514.08" stroke="#00806B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="1048" y1="500.08" x2="1048" y2="514.08" stroke="#96790F" stroke-width="2.5" stroke-linecap="round"/>
<line x1="392" y1="500.08" x2="1048" y2="500.08" stroke="#B9AE94" stroke-width="2" stroke-linecap="round"/>
<line x1="720" y1="488.08" x2="720" y2="500.08" stroke="#B9AE94" stroke-width="2" stroke-linecap="round"/>
<rect x="84" y="514.08" width="616" height="34" rx="17" fill="#00806B"/>
<text x="392" y="537.08" font-size="15.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">IDH-mutant</text>
<text x="88" y="578.08" font-size="17" fill="#123641" font-weight="800">Ask once more: 1p/19q co-deletion?</text>
<rect x="84" y="590.08" width="616" height="47" rx="12" fill="#FFFFFF" stroke="#DBD3BF" stroke-width="2"/>
<line x1="84" y1="594.08" x2="84" y2="633.08" stroke="#00806B" stroke-width="5" stroke-linecap="round"/>
<text x="100" y="610.08" font-size="13.5" fill="#00806B" font-weight="800">Co-deleted</text>
<text x="100" y="630.08" font-size="15" fill="#345963" font-weight="600">Oligodendroglioma, IDH-mutant and 1p/19q-codeleted</text>
<rect x="84" y="647.08" width="616" height="47" rx="12" fill="#FFFFFF" stroke="#DBD3BF" stroke-width="2"/>
<line x1="84" y1="651.08" x2="84" y2="690.08" stroke="#00806B" stroke-width="5" stroke-linecap="round"/>
<text x="100" y="667.08" font-size="13.5" fill="#00806B" font-weight="800">Not co-deleted</text>
<text x="100" y="687.08" font-size="15" fill="#345963" font-weight="600">Astrocytoma, IDH-mutant (grade 2 / 3 / 4)</text>
<rect x="84" y="704.08" width="616" height="54" rx="10" fill="none" stroke="#B9AE94" stroke-width="1.6" stroke-dasharray="5 5"/>
<text x="98" y="725.08" font-size="13.5" fill="#527078">On the astrocytoma branch: homozygous deletion of CDKN2A/B makes it grade 4 outright,</text>
<text x="98" y="744.08" font-size="13.5" fill="#527078">without waiting for histology.</text>
<rect x="740" y="514.08" width="616" height="34" rx="17" fill="#96790F"/>
<text x="1048" y="537.08" font-size="15.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">IDH-wildtype (no IDH mutation)</text>
<text x="744" y="578.08" font-size="17" fill="#123641" font-weight="800">Step 3 | Five criteria — any single one is enough</text>
<rect x="740" y="588.08" width="616" height="32" rx="10" fill="#F3E8CD"/>
<circle cx="760" cy="604.08" r="9" fill="#96790F"/>
<text x="760" y="608.58" font-size="12" fill="#FFFFFF" font-weight="800" text-anchor="middle">1</text>
<text x="778" y="608.08" font-size="14.5" fill="#345963" font-weight="600">Microvascular proliferation</text>
<rect x="740" y="626.08" width="616" height="32" rx="10" fill="#F3E8CD"/>
<circle cx="760" cy="642.08" r="9" fill="#96790F"/>
<text x="760" y="646.58" font-size="12" fill="#FFFFFF" font-weight="800" text-anchor="middle">2</text>
<text x="778" y="646.08" font-size="14.5" fill="#345963" font-weight="600">Necrosis</text>
<rect x="740" y="664.08" width="616" height="32" rx="10" fill="#F3E8CD"/>
<circle cx="760" cy="680.08" r="9" fill="#96790F"/>
<text x="760" y="684.58" font-size="12" fill="#FFFFFF" font-weight="800" text-anchor="middle">3</text>
<text x="778" y="684.08" font-size="14.5" fill="#345963" font-weight="600">TERT promoter mutation</text>
<rect x="740" y="702.08" width="616" height="32" rx="10" fill="#F3E8CD"/>
<circle cx="760" cy="718.08" r="9" fill="#96790F"/>
<text x="760" y="722.58" font-size="12" fill="#FFFFFF" font-weight="800" text-anchor="middle">4</text>
<text x="778" y="722.08" font-size="14.5" fill="#345963" font-weight="600">EGFR amplification</text>
<rect x="740" y="740.08" width="616" height="32" rx="10" fill="#F3E8CD"/>
<circle cx="760" cy="756.08" r="9" fill="#96790F"/>
<text x="760" y="760.58" font-size="12" fill="#FFFFFF" font-weight="800" text-anchor="middle">5</text>
<text x="778" y="760.08" font-size="14.5" fill="#345963" font-weight="600">Gain of whole chromosome 7 and loss of whole chromosome 10 (+7 / −10)</text>
<line x1="1048" y1="784.08" x2="1048" y2="794.88" stroke="#96790F" stroke-width="3" stroke-linecap="round"/>
<polygon points="1048,804.08 1043.92,794.95 1052.08,794.95" fill="#96790F"/>
<g filter="url(#sh)"><rect x="740" y="812.08" width="616" height="40" rx="12" fill="#96790F"/></g>
<text x="756" y="838.08" font-size="17" fill="#FFFFFF" font-weight="800">Glioblastoma, IDH-wildtype, CNS WHO grade 4</text>
<rect x="84" y="878.0799999999999" width="1272" height="180.0" rx="16" fill="none" stroke="#C9A83E" stroke-width="2.5"/>
<text x="108" y="908.08" font-size="17" fill="#8F7418" font-weight="800">Side notes (off the main path, and often got wrong)</text>
<circle cx="114" cy="935.08" r="4.5" fill="#C9A83E"/>
<text x="128" y="940.08" font-size="14.5" fill="#345963">Lack of an IDH mutation on its own is not enough to call something grade 4 — plenty of more indolent tumours are also IDH-wildtype, so one of the five criteria above still</text>
<text x="128" y="961.08" font-size="14.5" fill="#345963">has to be met (cIMPACT-NOW update 3).</text>
<circle cx="114" cy="989.08" r="4.5" fill="#C9A83E"/>
<text x="128" y="994.08" font-size="14.5" fill="#345963">EGFR must show focal high-level amplification. Trisomy 7 does not count, and immunohistochemistry cannot be used to call amplification (cIMPACT-NOW update 3).</text>
<circle cx="114" cy="1022.08" r="4.5" fill="#C9A83E"/>
<text x="128" y="1027.08" font-size="14.5" fill="#345963">In a young patient, think of paediatric-type diffuse glioma first; CNS5 no longer applies the word &quot;glioblastoma&quot; to paediatric-type tumours.</text>
<text x="84" y="1092.08" font-size="18" fill="#123641" font-weight="800">How much of all brain tumours it accounts for (US registry data, CBTRUS 2018–2022)</text>
<text x="84" y="1130.08" font-size="14.5" fill="#527078" font-weight="600">All brain and other CNS tumours</text>
<rect x="84" y="1140.08" width="172.26" height="34" rx="6" fill="#96790F"/>
<text x="170.13" y="1161.58" font-size="13.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">Glioblastoma 13.7%</text>
<rect x="258.26" y="1140.08" width="539.87" height="34" rx="6" fill="#5C77C4"/>
<text x="528.2" y="1161.58" font-size="13.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">Meningioma 42.6%</text>
<rect x="800.14" y="1140.08" width="555.86" height="34" rx="6" fill="#ECE8DE"/>
<text x="1078.07" y="1161.58" font-size="13.5" fill="#345963" font-weight="700" text-anchor="middle">Other 43.7%</text>
<text x="84" y="1202.08" font-size="14.5" fill="#527078" font-weight="600">Malignant tumours only</text>
<rect x="84" y="1212.08" width="661.98" height="34" rx="6" fill="#96790F"/>
<text x="414.99" y="1233.58" font-size="13.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">Glioblastoma 52.2%</text>
<rect x="747.98" y="1212.08" width="608.02" height="34" rx="6" fill="#ECE8DE"/>
<text x="1051.99" y="1233.58" font-size="13.5" fill="#345963" font-weight="700" text-anchor="middle">Other malignant tumours 47.8%</text>
<text x="84" y="1276.08" font-size="14" fill="#527078">Both bars are US registry data. For Taiwan: 742 new brain cancers were registered in 2023; what share of them were glioblastoma, I could not find an official breakdown for.</text>
<text x="84" y="1318.08" font-size="16" fill="#527078">Schematic, redrawn from the 2021 WHO CNS5 classification (Louis 2021), cIMPACT-NOW update 3 (Brat 2018) and CBTRUS 2018–2022; the cohorts, designs and</text>
<text x="84" y="1342.08" font-size="16" fill="#527078">endpoints of the underlying studies differ, so the data points must not be compared directly.</text>
  </g>
</svg>
