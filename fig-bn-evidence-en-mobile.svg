<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1263" viewBox="0 0 720 1263" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Where each cancer actually stands</title>
  <desc id="d">There are no randomised trials in this field. So the question is not whether there is a number, but how many people stand behind it and what design produced it. Only the first row has a drug approval, and only for one indication: unresectable locally advanced or locally recurrent head and neck cancer. The smaller the denominator, the better the numbers tend to look - the ones that went well are the ones that get written up.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#123641" opacity=".10"/><line x1="0" y1="0" x2="0" y2="8" stroke="#123641" stroke-width="2.2" opacity=".75"/></pattern><pattern id="hatchlite" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#123641" stroke-width="1.4" opacity=".22"/></pattern><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="720" height="1263" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="48" y="81" font-size="15" fill="#A98722" font-weight="800" letter-spacing="5px">EVIDENCE</text>
<text x="48" y="138" font-size="37" fill="#123641" font-weight="800" class="r">Where each cancer actually</text>
<text x="48" y="183" font-size="37" fill="#123641" font-weight="800" class="r">stands</text>
<text x="48" y="227" font-size="18" fill="#527078">There are no randomised trials in this field. So the question is</text>
<text x="48" y="253" font-size="18" fill="#527078">not whether there is a number,</text>
<text x="48" y="279" font-size="18" fill="#527078">but how many people stand behind it and what design produced</text>
<text x="48" y="305" font-size="18" fill="#527078">it.</text>
<rect x="48" y="355" width="624" height="83" rx="12" fill="#123641" opacity="0.05"/>
<rect x="48" y="355" width="6" height="83" rx="4" fill="#A98722" opacity="0.9"/>
<text x="70" y="380" font-size="16" fill="#123641" font-weight="700">Recurrent head and neck cancer</text>
<text x="70" y="402" font-size="13" fill="#527078">single-arm phase II + post-marketing surveillance</text>
<text x="70" y="434" font-size="14" fill="#A98722" font-weight="800">21 / 162 patients</text>
<rect x="48" y="448" width="624" height="83" rx="12" fill="#123641" opacity="0.05"/>
<rect x="48" y="448" width="6" height="83" rx="4" fill="#A98722" opacity="0.9"/>
<text x="70" y="473" font-size="16" fill="#123641" font-weight="700">Recurrent glioblastoma</text>
<text x="70" y="495" font-size="13" fill="#527078">single-arm phase II + historical cohort control</text>
<text x="70" y="527" font-size="14" fill="#A98722" font-weight="800">27 patients</text>
<rect x="48" y="541" width="624" height="83" rx="12" fill="#123641" opacity="0.05"/>
<rect x="48" y="541" width="6" height="83" rx="4" fill="#5C77C4" opacity="0.9"/>
<text x="70" y="566" font-size="16" fill="#123641" font-weight="700">Recurrent high-grade meningioma</text>
<text x="70" y="588" font-size="13" fill="#527078">case series</text>
<text x="70" y="620" font-size="14" fill="#5C77C4" font-weight="800">44 patients</text>
<rect x="48" y="634" width="624" height="83" rx="12" fill="#123641" opacity="0.05"/>
<rect x="48" y="634" width="6" height="83" rx="4" fill="#5C77C4" opacity="0.9"/>
<text x="70" y="659" font-size="16" fill="#123641" font-weight="700">Melanoma</text>
<text x="70" y="681" font-size="13" fill="#527078">case series</text>
<text x="70" y="713" font-size="14" fill="#5C77C4" font-weight="800">roughly 30-40 cases worldwide</text>
<rect x="48" y="727" width="624" height="83" rx="12" fill="#123641" opacity="0.05"/>
<rect x="48" y="727" width="6" height="83" rx="4" fill="#5C77C4" opacity="0.9"/>
<text x="70" y="752" font-size="16" fill="#123641" font-weight="700">Extramammary Paget disease</text>
<text x="70" y="774" font-size="13" fill="#527078">case series</text>
<text x="70" y="806" font-size="14" fill="#5C77C4" font-weight="800">single digits</text>
<rect x="48" y="820" width="624" height="83" rx="12" fill="#123641" opacity="0.05"/>
<rect x="48" y="820" width="6" height="83" rx="4" fill="#00806B" opacity="0.9"/>
<rect x="48" y="820" width="624" height="83" rx="12" fill="url(#hatchlite)"/>
<text x="70" y="845" font-size="16" fill="#123641" font-weight="700">Newly diagnosed glioblastoma</text>
<text x="70" y="867" font-size="13" fill="#527078">phase I, no efficacy results yet</text>
<text x="70" y="899" font-size="14" fill="#00806B" font-weight="800">target 12-18 patients</text>
<rect x="48" y="913" width="624" height="83" rx="12" fill="#123641" opacity="0.05"/>
<rect x="48" y="913" width="6" height="83" rx="4" fill="#00806B" opacity="0.9"/>
<rect x="48" y="913" width="624" height="83" rx="12" fill="url(#hatchlite)"/>
<text x="70" y="938" font-size="16" fill="#123641" font-weight="700">Liver, lung and deep organs</text>
<text x="70" y="960" font-size="13" fill="#527078">case reports</text>
<text x="70" y="992" font-size="14" fill="#00806B" font-weight="800">single digits</text>
<text x="48" y="1014" font-size="13" fill="#6B8084">Hatching = no efficacy results yet, or case reports only</text>
<rect x="48" y="1054" width="624" height="2" rx="1" fill="#A98722" opacity="0.5"/>
<text x="48" y="1083" font-size="16" fill="#345963" font-weight="700">Only the first row has a drug approval, and only for one indication:</text>
<text x="48" y="1108" font-size="16" fill="#345963" font-weight="700">unresectable locally advanced or locally recurrent head and neck cancer.</text>
<text x="48" y="1133" font-size="16" fill="#345963" font-weight="700">The smaller the denominator, the better the numbers tend to look - the</text>
<text x="48" y="1158" font-size="16" fill="#345963" font-weight="700">ones that went well are the ones that get written up.</text>
<text x="48" y="1189" font-size="13" fill="#6B8084">Schematic, compiled from the primary literature cited across this topic; denominators are</text>
<text x="48" y="1209" font-size="13" fill="#6B8084">the enrolled numbers in each report.</text>
  </g>
</svg>
