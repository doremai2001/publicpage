<text x="1136.76" y="468.65" font-size="13.5" fill="#B04A4A" font-weight="800" text-anchor="start">Oesophagitis symptoms (schematic)</text>
<text x="798.52" y="664.52" font-size="12.5" fill="#B04A4A" font-weight="600" opacity="0.85">With chemotherapy: ~1 week earlier (dashed)</text>
<text x="1324" y="567.3" font-size="13.5" fill="#96790F" font-weight="800" text-anchor="end">Weight (schematic, slow decline)</text>
<text x="712" y="427.7" font-size="12.5" fill="#6B8084" text-anchor="end">high</text>
<text x="712" y="744.8" font-size="12.5" fill="#6B8084" text-anchor="end">low</text>
<text x="686" y="802.8" font-size="12.5" fill="#6B8084">Extrapolated from lung radiotherapy literature (Baker &amp; Fairchild 2016); oesophageal trials did not report</text>
<text x="686" y="818.8" font-size="12.5" fill="#6B8084">oesophagitis separately</text>
<g filter="url(#sh)"><rect x="84" y="856.8" width="306" height="248.05" rx="18" fill="#FFFFFF"/></g>
<rect x="106" y="876.8" width="141.71" height="21.88" rx="10.94" fill="#B04A4A"/>
<text x="176.86" y="892.24" font-size="12.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">What grade 3 means</text>
<text x="106" y="922.15" font-size="13.5" fill="#345963">CTCAE v5.0 oesophagitis grade 3:</text>
<text x="106" y="941.73" font-size="13.5" fill="#345963">'severely altered eating/swallowing;</text>
<text x="106" y="961.3" font-size="13.5" fill="#345963">tube feeding, TPN or hospitalisation</text>
<text x="106" y="980.88" font-size="13.5" fill="#345963">indicated'. Grade 2: symptomatic,</text>
<text x="106" y="1000.45" font-size="13.5" fill="#345963">altered eating, oral supplements. About</text>
<text x="106" y="1020.02" font-size="13.5" fill="#345963">10–20% grade 3 in lung-cancer</text>
<text x="106" y="1039.6" font-size="13.5" fill="#345963">chemoradiotherapy (extrapolated).</text>
<g filter="url(#sh)"><rect x="406" y="856.8" width="306" height="248.05" rx="18" fill="#FFFFFF"/></g>
<rect x="428" y="876.8" width="131.86" height="21.88" rx="10.94" fill="#5C77C4"/>
<text x="493.93" y="892.24" font-size="12.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">Most people finish</text>
<text x="428" y="922.15" font-size="13.5" fill="#345963">ARTDECO (n=260, 61% SCC):</text>
<text x="428" y="941.73" font-size="13.5" fill="#345963">radiotherapy completion 94%. RTOG</text>
<text x="428" y="961.3" font-size="13.5" fill="#345963">85-01 concurrent chemoradiotherapy:</text>
<text x="428" y="980.88" font-size="13.5" fill="#345963">severe/life-threatening toxicity 44%/20% (1992</text>
<text x="428" y="1000.45" font-size="13.5" fill="#345963">era, n=121).</text>
<g filter="url(#sh)"><rect x="728" y="856.8" width="306" height="248.05" rx="18" fill="#FFFFFF"/></g>
<rect x="750" y="876.8" width="194.95" height="21.88" rx="10.94" fill="#96790F"/>
<text x="847.47" y="892.24" font-size="12.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">Why not to stop on your own</text>
<text x="750" y="922.15" font-size="13.5" fill="#345963">Local control vs total treatment time:</text>
<text x="750" y="941.73" font-size="13.5" fill="#345963">−2.3%/day (oesophageal cancer, 1994</text>
<text x="750" y="961.3" font-size="13.5" fill="#345963">radiotherapy alone, n=88); −1.4%/day</text>
<text x="750" y="980.88" font-size="13.5" fill="#345963">(head and neck SCC, extrapolated) —</text>
<text x="750" y="1000.45" font-size="13.5" fill="#345963">population regression slopes, not</text>
<text x="750" y="1020.02" font-size="13.5" fill="#345963">personal risk; a 2025</text>
<text x="750" y="1039.6" font-size="13.5" fill="#345963">chemoradiotherapy series (median</text>
<text x="750" y="1059.17" font-size="13.5" fill="#345963">delay only 4 days) showed no effect and</text>
<text x="750" y="1078.75" font-size="13.5" fill="#345963">is not evidence that stopping is safe.</text>
<g filter="url(#sh)"><rect x="1050" y="856.8" width="306" height="248.05" rx="18" fill="#FFFFFF"/></g>
<rect x="1072" y="876.8" width="169.47" height="21.88" rx="10.94" fill="#00806B"/>
<text x="1156.73" y="892.24" font-size="12.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">Not only the oesophagus</text>
<text x="1072" y="922.15" font-size="13.5" fill="#345963">Radiation pneumonitis grade 2 or higher</text>
<text x="1072" y="941.73" font-size="13.5" fill="#345963">about 6.6% (IMRT-era systematic</text>
<text x="1072" y="961.3" font-size="13.5" fill="#345963">review), mostly weeks to months after</text>
<text x="1072" y="980.88" font-size="13.5" fill="#345963">the end — report cough and</text>
<text x="1072" y="1000.45" font-size="13.5" fill="#345963">breathlessness.</text>
<text x="84" y="1130.85" font-size="14" fill="#6B8084" font-weight="600">Weeks four and five hurt most and are when 'a few days off' is most tempting — report it and let the team handle symptoms and nutrition; whether to pause, and how to compensate, is the</text>
<text x="84" y="1151.15" font-size="14" fill="#6B8084" font-weight="600">team's call.</text>
<text x="84" y="1197.45" font-size="16" fill="#6B8084">Schematic, redrawn from Baker &amp; Fairchild 2016 (lung-cancer radiation oesophagitis review, extrapolated), CTCAE v5.0, Hulshof 2021 (ARTDECO), Herskovic 1992</text>
<text x="84" y="1221.45" font-size="16" fill="#6B8084">(RTOG 85-01), Nishimura 1994, Bese 2007, Xiang 2025 and Tonison 2019 (IMRT-era pneumonitis review) | curves are schematic, not an individual course; your team</text>
<text x="84" y="1245.45" font-size="16" fill="#6B8084">sets the actual schedule</text>
  </g>
</svg>
