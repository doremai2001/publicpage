<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1299" viewBox="0 0 1440 1299" role="img" aria-labelledby="t d">
  <title id="t">Getting through five to six weeks: oesophagitis arrives on schedule, weight slips quietly</title>
  <desc id="d">Schematic calendar and symptom curves for five to six weeks of definitive chemoradiotherapy. Left, the weekly calendar: external-beam radiotherapy shown as 1.8 Gy times 28 fractions equals 50.4 Gy, Monday to Friday, five weeks and three days (a 60 Gy course runs about six weeks); chemotherapy shown as weekly (carboplatin/paclitaxel), whereas cisplatin/5-FU runs in cycles weeks apart and the team sets the schedule; weeks 2–3 are marked as the usual onset of oesophagitis, about one week earlier with concurrent chemotherapy. Right, the curves: the oesophagitis symptom curve rises in weeks 2–3, peaks in weeks 4–6 and settles within 4 weeks after radiotherapy ends, with a dashed version one week earlier for concurrent chemotherapy; the weight curve declines slowly in the opposite direction; the shapes are extrapolated from lung-cancer radiotherapy literature (Baker and Fairchild 2016) because oesophageal trials did not report oesophagitis separately. Four boxes below: CTCAE v5.0 grade 3 oesophagitis means severely altered eating or swallowing with tube feeding, parenteral nutrition or hospitalisation, about 10–20% grade 3 in lung-cancer chemoradiotherapy (extrapolated); ARTDECO radiotherapy completion 94%, RTOG 85-01 concurrent chemoradiotherapy severe and life-threatening toxicity 44% and 20%; local control falls 2.3% per day of prolongation (oesophageal cancer, 1994 radiotherapy alone, n=88) and 1.4% per day (head and neck SCC, extrapolated), population regression slopes rather than personal risk, while a 2025 chemoradiotherapy series with a median delay of only 4 days showed no effect; radiation pneumonitis grade 2 or higher about 6.6%, mostly weeks to months after the end.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="1299" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="86" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">THE 5–6 WEEK CALENDAR</text>
<text x="84" y="148" font-size="38" fill="#123641" font-weight="800" class="r">Getting through five to six weeks: oesophagitis arrives on</text>
<text x="84" y="191.7" font-size="38" fill="#123641" font-weight="800" class="r">schedule, weight slips quietly</text>
<text x="84" y="237.7" font-size="21" fill="#527078">Left, the treatment calendar (50.4 Gy in 28 fractions as the example); right, schematic curves of symptoms and weight —</text>
<text x="84" y="267.7" font-size="21" fill="#527078">oesophagitis starting in weeks 2–3 is on schedule, not a sign that something is wrong.</text>
<text x="84" y="297.7" font-size="21" fill="#527078">The curve shape is extrapolated from the lung-cancer radiotherapy literature; oesophageal trials did not report</text>
<text x="84" y="327.7" font-size="21" fill="#527078">oesophagitis separately.</text>
<g filter="url(#sh)"><rect x="84" y="371.7" width="560" height="467.1" rx="18" fill="#FFFFFF"/></g>
