<text x="128" y="697.75" font-size="13" fill="#345963" font-weight="600">External-beam radiotherapy: 1.8 Gy ×28 = 50.4 Gy, Monday to Friday (dose</text>
<text x="128" y="716.6" font-size="13" fill="#345963" font-weight="600">per prescription; a 60 Gy course runs about 6 weeks)</text>
<circle cx="113" cy="739.4" r="6.5" fill="#C9A83E" stroke="#8F7418" stroke-width="1.5"/>
<text x="128" y="743.45" font-size="13" fill="#345963" font-weight="600">Chemotherapy: weekly shown as the example (carboplatin/paclitaxel);</text>
<text x="128" y="762.3" font-size="13" fill="#345963" font-weight="600">cisplatin/5-FU runs in cycles weeks apart — the team sets the schedule</text>
<line x1="113" y1="778.1" x2="113" y2="792.1" stroke="#B04A4A" stroke-width="3" stroke-linecap="round"/>
<text x="128" y="789.15" font-size="13" fill="#345963" font-weight="600">Weeks 2–3: oesophagitis usually starts here; about 1 week earlier with</text>
<text x="128" y="808" font-size="13" fill="#345963" font-weight="600">concurrent chemotherapy</text>
