<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="842" viewBox="0 0 1440 842" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">A kill radius smaller than one cell</title>
  <desc id="d">Boron-10 captures a thermal neutron and splits into two fragments. They travel only 5-9 micrometres in tissue - about the size of one mammalian cell. So the selectivity is biological: the cell that took up boron is destroyed, its neighbour is not. But the same neutron beam produces three other dose components that have nothing to do with boron.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#123641" opacity=".10"/><line x1="0" y1="0" x2="0" y2="8" stroke="#123641" stroke-width="2.2" opacity=".75"/></pattern><pattern id="hatchlite" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#123641" stroke-width="1.4" opacity=".22"/></pattern><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="842" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="78" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">NEUTRON CAPTURE</text>
<text x="84" y="140" font-size="44" fill="#123641" font-weight="800" class="r">A kill radius smaller than one cell</text>
<text x="84" y="192" font-size="21" fill="#527078">Boron-10 captures a thermal neutron and splits into two fragments.</text>
<text x="84" y="223" font-size="21" fill="#527078">They travel only 5-9 micrometres in tissue - about the size of one mammalian cell.</text>
<rect x="84" y="282" width="1272" height="96" rx="16" fill="#123641" opacity="0.05"/>
<text x="296" y="340" font-size="24" fill="#A98722" font-weight="800" text-anchor="middle">Boron-10</text>
<line x1="508" y1="306" x2="508" y2="354" stroke="#123641" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 6" opacity="0.3"/>
<text x="720" y="340" font-size="24" fill="#6B8084" font-weight="800" text-anchor="middle">+ thermal neutron</text>
<line x1="932" y1="306" x2="932" y2="354" stroke="#123641" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 6" opacity="0.3"/>
<text x="1144" y="340" font-size="24" fill="#00806B" font-weight="800" text-anchor="middle">→ alpha particle + lithium-7</text>
<text x="84" y="402" font-size="18" fill="#527078">・Ground state 93.7%: total energy about 2.31 MeV</text>
<text x="84" y="430" font-size="18" fill="#527078">・Excited state 6.3%: about 2.79 MeV, plus a 0.48 MeV gamma ray</text>
<text x="84" y="476" font-size="19" fill="#123641" font-weight="700">Combined range of the two fragments: 5-9 micrometres</text>
<rect x="84" y="510" width="1272" height="30" rx="8" fill="#123641" opacity="0.05"/>
<rect x="84" y="510" width="381" height="30" rx="8" fill="#A98722" opacity="0.88"/>
<text x="84" y="564" font-size="19" fill="#123641" font-weight="700">Diameter of one mammalian cell (schematic)</text>
<rect x="84" y="598" width="1272" height="30" rx="8" fill="#123641" opacity="0.05"/>
<rect x="84" y="598" width="432" height="30" rx="8" fill="#6B8084" opacity="0.35"/>
<rect x="84" y="676" width="1272" height="2" rx="1" fill="#A98722" opacity="0.5"/>
<text x="84" y="710" font-size="19" fill="#345963" font-weight="700">So the selectivity is biological: the cell that took up boron is destroyed, its neighbour is not.</text>
<text x="84" y="740" font-size="19" fill="#345963" font-weight="700">But the same neutron beam produces three other dose components that have nothing to do with boron.</text>
<text x="84" y="778" font-size="16" fill="#6B8084">Schematic, redrawn from the descriptions in Barth et al. 2005, Terranova 2026 and Current Oncology 2022; lengths are indicative, not to scale.</text>
  </g>
</svg>
