<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1620" viewBox="0 0 620 1620" role="img" aria-labelledby="t d">
  <title id="t">MGMT 甲基化與未甲基化：整體存活與無惡化存活兩張並排的圖</title>
  <desc id="d">示意圖：MGMT 甲基化狀態與 temozolomide，整體存活與無惡化存活分成兩張並排的圖，兩張用同一把月數的尺。左圖是整體存活的中位數。MGMT 甲基化那一組：只做放療 15.3 個月（95% 信賴區間 13.0 到 20.9），放療加 temozolomide 21.7 個月（17.4 到 30.4），P 值 0.007。MGMT 未甲基化那一組：只做放療 11.8 個月（9.7 到 14.1），n=54；放療加 temozolomide 12.7 個月（11.6 到 14.4），n=60——兩個信賴區間大幅重疊，這個試驗看不出差別。右圖是無惡化存活的中位數，只畫未甲基化那一列：只做放療 5.9 個月（5.3 到 7.7），n=46；放療加 temozolomide 10.3 個月（6.5 到 14），n=46。兩張圖之間的一句話是：同一群人、同一個試驗，兩個終點的答案不一樣；下面一行小字是 n 只有五、六十人、信賴區間很寬，看不出來不等於證明沒有。圖上另有一格寫「而那個能一刀切開的比較，從來沒有人做過」：系統回顧與統合分析（Alnahhas 2020）自己寫得很清楚，從來沒有任何研究前瞻性地把未甲基化的病人隨機分到只做放療與放療加 temozolomide 去比，所以這一格不是證據顯示沒用，是沒有人做過那個試驗。再下面是高齡族群的隨機分層資料（Perry 2017，65 歲以上，n=562，兩組放療都是 40 Gy 分 15 次）：甲基化那一層（n=165）13.5 對 7.7 個月，風險比 0.53（0.38 到 0.73），P 小於 0.001；未甲基化那一層（n=189）10.0 對 7.9 個月，風險比 0.75（0.56 到 1.01），P 等於 0.055。風險比 0.75 的白話是加了藥那一組在任一時點的死亡風險大約是沒加藥那一組的四分之三，但 P 等於 0.055 表示沒有達到統計顯著。圖的最下面是一段警語：這張圖不能讀成未甲基化就不用吃；無惡化存活有差、整體存活看不出、沒有人做過針對這個族群的隨機試驗，三件事要一起讀；要不要用藥是你跟醫師討論的內容，不要自己停藥。</desc>
