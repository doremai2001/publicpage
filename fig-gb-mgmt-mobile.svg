<text x="40" y="62" font-size="13" fill="#A98722" font-weight="800" letter-spacing="2.5px">MGMT: TWO ENDPOINTS, TWO ANSWERS</text>
<text x="40" y="108" font-size="27" fill="#123641" font-weight="800" class="r">未甲基化那一格，存活和無惡化存活講的不是</text>
<text x="40" y="141.48" font-size="27" fill="#123641" font-weight="800" class="r">同一件事</text>
<text x="40" y="180.96" font-size="15.5" fill="#527078">同一群人、同一個試驗（EORTC 26981-22981／NCIC CE.3），兩個終點的答</text>
<text x="40" y="203.43" font-size="15.5" fill="#527078">案不一樣。</text>
<text x="40" y="225.91" font-size="15.5" fill="#527078">兩張圖的橫軸是同一把尺（月），所以長度可以互看；但終點不同，意思不同。</text>
