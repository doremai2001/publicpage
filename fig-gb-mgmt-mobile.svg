<text x="64" y="1190.29" font-size="13.76" fill="#123641" font-weight="800">高齡族群裡有直接的隨機分層資料（Perry 2017，≥65 歲，n=562，兩組放療都</text>
<text x="64" y="1209.21" font-size="13.76" fill="#123641" font-weight="800">是 40 Gy／15 次）</text>
<rect x="64" y="1234.13" width="492" height="74" rx="12" fill="#F3E8CD"/>
<text x="78" y="1258.13" font-size="13.5" fill="#527078" font-weight="700">甲基化（n=165）</text>
<text x="78" y="1282.13" font-size="19" fill="#00806B" font-weight="800">13.5 對 7.7 個月</text>
<text x="78" y="1300.13" font-size="12" fill="#345963">風險比 0.53（0.38 到 0.73），P＜0.001</text>
<rect x="64" y="1316.13" width="492" height="74" rx="12" fill="#ECE8DE"/>
<text x="78" y="1340.13" font-size="13.5" fill="#527078" font-weight="700">未甲基化（n=189）</text>
<text x="78" y="1364.13" font-size="19" fill="#96790F" font-weight="800">10.0 對 7.9 個月</text>
<text x="78" y="1382.13" font-size="12" fill="#345963">風險比 0.75（0.56 到 1.01），P＝0.055</text>
<text x="64" y="1406.13" font-size="11.61" fill="#527078">風險比 0.75 的白話是：在追蹤期間的任一時點，加了藥那一組的死亡風險大約是沒加藥那一組</text>
<text x="64" y="1422.9" font-size="11.61" fill="#527078">的四分之三；但 P＝0.055 表示這個差距沒有達到統計上的顯著。</text>
<rect x="40" y="1463.6650000000002" width="540" height="95.34000000000015" rx="16" fill="#F6E2E0" stroke="#B04A4A" stroke-width="2.5"/>
<text x="64" y="1493.67" font-size="15.48" fill="#B04A4A" font-weight="800">這張圖不能讀成「未甲基化就不用吃」</text>
<text x="64" y="1519.17" font-size="12.9" fill="#345963" font-weight="600">無惡化存活有差、整體存活看不出、沒有人做過針對這個族群的隨機試驗——三件事要</text>
<text x="64" y="1538.09" font-size="12.9" fill="#345963" font-weight="600">一起讀。要不要用藥是你跟醫師討論的內容，不是你在家裡的決定；不要自己停藥。</text>
<text x="40" y="1577.01" font-size="14" fill="#527078">示意圖，依 Hegi 2005（EORTC 26981-22981／NCIC CE.3 的分層分析）、Alnahhas</text>
