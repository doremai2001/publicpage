<text x="60" y="935.28" font-size="11.18" fill="#527078">這一格只畫未甲基化，因為兩個終點答案不一樣的就是這一列：腫瘤晚一點長回來這件事看得到，人</text>
<text x="60" y="951.62" font-size="11.18" fill="#527078">活得比較久這件事，這個試驗看不出來。</text>
<text x="40" y="993.97" font-size="12.04" fill="#527078">n 只有五、六十人；信賴區間很寬。看不出來，不等於證明沒有。</text>
<rect x="40" y="1029.165" width="540" height="111.12000000000012" rx="16" fill="none" stroke="#C9A83E" stroke-width="2.5"/>
<text x="64" y="1059.16" font-size="15.48" fill="#123641" font-weight="800">而那個能一刀切開的比較，從來沒有人做過</text>
<text x="64" y="1081.52" font-size="12.9" fill="#345963">系統回顧與統合分析（Alnahhas 2020）自己寫得很清楚：從來沒有任何研究前瞻性地</text>
<text x="64" y="1100.44" font-size="12.9" fill="#345963">把未甲基化的病人隨機分到「只做放療」與「放療＋temozolomide」去比。所以這一</text>
<text x="64" y="1119.37" font-size="12.9" fill="#345963">格不是「證據顯示沒用」，是「沒有人做過那個試驗」。</text>
