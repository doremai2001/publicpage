<text x="108" y="1021.08" font-size="15" fill="#345963" font-weight="600">這些是隨機試驗規約裡的劑量，寫在圖上是為了讓你看得懂療程的形狀。它不是你的用法用量，也不是可以自己對照的劑量表——你的劑量由你的團隊依體表面積、血球與腎肝功能算。不</text>
<text x="108" y="1043.08" font-size="15" fill="#345963" font-weight="600">要自己停藥或補藥。</text>
<rect x="84" y="1101.08" width="6" height="87.0" rx="3" fill="#8F7418"/>
<rect x="84" y="1087.08" width="727.76" height="115.0" rx="14" fill="none" stroke="#B9AE94" stroke-width="2"/>
<text x="102" y="1115.08" font-size="15.5" fill="#8F7418" font-weight="800">台灣健保怎麼卡這個節奏（藥品給付規定 9.25，附表八之二）</text>
<text x="102" y="1140.08" font-size="14" fill="#345963">條文寫的是「需經事前審查核准後使用，每次申請事前審查之療程以三個月為限，再次申請必須提出客觀證據（</text>
<text x="102" y="1160.08" font-size="14" fill="#345963">如：影像學）證實無惡化，才可繼續使用」。所以真正的節奏器是每三個月一關、續用要附影像——條文裡沒有「</text>
<text x="102" y="1180.08" font-size="14" fill="#345963">六個月」這三個字。</text>
<rect x="831.76" y="1101.08" width="6" height="67.0" rx="3" fill="#00806B"/>
<rect x="831.76" y="1087.08" width="524.24" height="95.0" rx="14" fill="none" stroke="#B9AE94" stroke-width="2"/>
<text x="849.76" y="1115.08" font-size="15.5" fill="#00806B" font-weight="800">「可不可以多吃幾個月」</text>
<text x="849.76" y="1140.08" font-size="14" fill="#345963">延長到 12 個療程：無惡化存活略好、整體存活一樣、副作用比較多。本圖只畫</text>
<text x="849.76" y="1160.08" font-size="14" fill="#345963">規約的六個療程。</text>
<text x="84" y="1226.08" font-size="16" fill="#527078">示意圖，依 Stupp 2005 的療程規約、Stupp 2009、延長療程的合併分析與 GEINO 14-01，以及衛生福利部中央健康保險署《全民健康保險藥品給付規定》9.25 條文重繪；各研究</text>
<text x="84" y="1250.08" font-size="16" fill="#527078">族群、設計與終點不同，數點不可直接互比。</text>
  </g>
</svg>
