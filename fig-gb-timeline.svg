<text x="84" y="86" font-size="18" fill="#A98722" font-weight="800" letter-spacing="4px">THE STUPP REGIMEN, LAID OUT IN DAYS</text>
<text x="84" y="148" font-size="42" fill="#123641" font-weight="800" class="r">六週、一段休息、六個療程：這是三段，不是一段</text>
<text x="84" y="206.08" font-size="20" fill="#527078">放療週一到週五照，藥七天都要吃——週末那兩格的落差，是這張圖要你看見的東西。</text>
<text x="84" y="235.08" font-size="20" fill="#527078">圖上的劑量是試驗規約寫的劑量，不是你的用法用量；你的劑量由你的團隊算。</text>
<text x="84" y="304.08" font-size="18" fill="#8F7418" font-weight="800">整段療程的形狀（這一條是按比例畫的）</text>
<circle cx="91" cy="346.08" r="7" fill="#123641"/>
<text x="106" y="351.08" font-size="15" fill="#123641" font-weight="800">手術</text>
<rect x="84" y="364.08" width="222.47" height="46" rx="8" fill="#5C77C4"/>
<text x="195.24" y="392.08" font-size="13.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">①同步期｜六週</text>
<rect x="308.47" y="364.08" width="147.65" height="46" rx="8" fill="url(#hatch)" stroke="#B9AE94" stroke-width="1.5"/>
<text x="382.29" y="392.08" font-size="13.5" fill="#345963" font-weight="800" text-anchor="middle">②休息｜2–6 週</text>
<rect x="458.12" y="364.08" width="897.88" height="46" rx="8" fill="#96790F"/>
<text x="907.06" y="392.08" font-size="13.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">③維持期｜六個療程（每個療程 28 天）</text>
<text x="84" y="446.08" font-size="14" fill="#527078">手術到放療之間：資料支持六週以內開始，看不出對存活的影響——這不是「越快越好」的意思</text>
