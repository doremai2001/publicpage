<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2532" viewBox="0 0 1440 2532" role="img" aria-labelledby="t d">
  <title id="t">卡介苗：療程的形狀、副作用時間軸，與要立刻回診的訊號</title>
  <desc id="d">示意圖，分三大格。第一格「療程的形狀：六週只是開頭」畫一條時間軸：誘導期六週、每週一次，接著維持期在第 3、6、12、18、24、30、36 個月各再連續灌三週，最多加起來 27 次；旁註寫療程長短不是評分，誰該灌、灌幾次由風險分層決定。時間軸下面兩張證據卡：SWOG 8507 是隨機試驗，660 人接受六週誘導，三個月時 550 人隨機分到維持或不維持，主要分析族群是隨機時無病的 384 人，中位無復發存活 35.7 個月（不維持）對 76.8 個月（維持），p 小於 0.0001，中位無惡化存活 111.5 個月對未達到，五年整體存活 78% 對 83%；卡片底下標明作者自己註記副作用大的人就把維持停掉了，所以試驗看不到重度毒性。第二張卡是 EORTC 30962，隨機 2×2 設計（三分之一劑量或全劑量 × 打一年或打三年），中、高風險 Ta 與 T1，意向治療 1,355 人，中位追蹤 7.1 年：高風險病人多打兩年可以減少復發（風險比 1.61，95% 信賴區間 1.13 到 2.30，p=0.009），但只有在用全劑量時成立；中風險用全劑量多打兩年沒有好處；進展與存活在四組之間沒有差異。第二格「灌完那幾天，以及有多少人撐得完」：三段時間軸——灌注後 4 到 6 小時膀胱刺激症狀開始，持續 24 到 72 小時，第三次灌注之後才明顯；大約 60% 的人會有膀胱刺激症狀。仿單 674 人（含 153 位原位癌病人）的不良事件表：排尿疼痛 60%（第 3 級以上 11%）、頻尿 40%（7%）、類流感症候群 33%（9%）、發燒 20%（8%）。完成率：指引寫超過一半的病人無法完成一年的維持療程，EORTC 30962 的三年維持組只有 34% 完成全程。同一格另列常被誤會成禁忌、其實不是的三件事（驗尿有白血球、看不見的血尿、沒有症狀的細菌尿），以及真正要延後的那一組，逐字引仿單「Treatment should be postponed for at least 1 week following transurethral resection, biopsy, traumatic catheterization, or gross hematuria」，指引則建議刮除後至少兩週才開始灌，禁忌欄另列免疫抑制狀態與活動性結核。第三格是紅框「什麼情況是同一天回診，不是等下次」，逐字列出仿單暗示全身性卡介苗感染的四種訊號：類流感的發燒症狀持續超過 72 小時；發燒達到 103°F（換算約 39.4°C），或體溫 38.5°C（101.3°F）以上、且持續超過兩到三天；全身性的症狀隨著每一次灌注愈來愈重，或肝功能指數持續異常；局部的急性發炎——攝護腺炎、副睪炎、睪丸炎——持續超過兩到三天。紅框上方引仿單原句「Deaths have been reported as a result of systemic BCG infection and sepsis.」，並寫仿單也說持續一到兩天的倦怠、發燒、發冷通常反映的是過敏反應。紅框下方寫你要做的只有一件：當天回去，並說清楚最後一次灌注是哪一天；停藥、培養、影像與會診是醫療端的處置，指引的門檻是持續高燒超過 38.5°C 且超過 48 小時就永久停止灌注。最後並列三個發生率：嚴重副作用不到 5%、全身性卡介苗感染 1% 到 2%、瑞典全國資料庫 5,033 名曝露者五年累積的結核病通報診斷率 1.1%。圖末聲明：這張圖不是用來判斷「我這樣算不算嚴重」的工具，嚴不嚴重由看得到你報告的那個人判斷。</desc>
