<text x="84" y="88" font-size="16" fill="#A98722" font-weight="800" letter-spacing="3px">BCG INTRAVESICAL - COURSE, SIDE EFFECTS, RED FLAGS</text>
<text x="84" y="140" font-size="40" fill="#123641" font-weight="800" class="r">卡介苗的療程形狀、灌完那幾天，以及什麼情況是同一天回診</text>
<text x="84" y="200.4" font-size="19" fill="#527078">這張圖畫三件事：一輪卡介苗實際上有多長、灌完之後身體會怎樣、以及哪些訊號代表要當天回去，不是等下一次排定的門診。</text>
<text x="84" y="232.9" font-size="19" fill="#527078">每一格都標了出處與那一群人是誰。各研究的族群、設計與終點不同，數點不可直接互比。</text>
<rect x="84" y="281.4" width="1272" height="61" rx="16" fill="#F6E2E0" stroke="#B04A4A" stroke-width="2.5"/>
<text x="110" y="311.4" font-size="16" fill="#B04A4A" font-weight="800">紅框裡那幾句是仿單逐字寫的訊號，不是我整理出來的門檻；仿單同一段寫著「Deaths have been reported as a result of systemic BCG infection and sepsis.」</text>
<g filter="url(#sh)"><rect x="84" y="368.4" width="1272" height="703" rx="18" fill="#FFFFFF" stroke="#C9A83E" stroke-width="3"/></g>
<text x="110" y="404.4" font-size="22" fill="#123641" font-weight="800">療程的形狀：六週只是開頭</text>
<text x="110" y="442.4" font-size="15.5" fill="#527078">指引描述的完整排程：誘導期六週、每週一次；接著進入維持期，在第 3、6、12、18、24、30、36 個月各再連續灌三週，最多加起來 27 次。</text>
