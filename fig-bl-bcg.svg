<text x="740" y="1312.4" font-size="16" fill="#123641" font-weight="800">撐得完的人有多少</text>
<circle cx="745" cy="1345.4" r="4.5" fill="#B04A4A"/>
<text x="760" y="1350.4" font-size="15" fill="#345963">指引寫：超過一半的病人無法完成一年的維持療程。</text>
<circle cx="745" cy="1375.4" r="4.5" fill="#B04A4A"/>
<text x="760" y="1380.4" font-size="15" fill="#345963">EORTC 30962 的三年維持組，只有 34% 完成全程。</text>
<text x="740" y="1418.4" font-size="16" fill="#123641" font-weight="800">常被誤會成禁忌、其實不是的三件事</text>
<rect x="740" y="1448.4" width="101" height="24" rx="12" fill="#D8EDE7"/>
<text x="750" y="1465.26" font-size="13.5" fill="#00806B" font-weight="800">驗尿有白血球</text>
<rect x="849" y="1448.4" width="101" height="24" rx="12" fill="#D8EDE7"/>
<text x="859" y="1465.26" font-size="13.5" fill="#00806B" font-weight="800">看不見的血尿</text>
<rect x="958" y="1448.4" width="128" height="24" rx="12" fill="#D8EDE7"/>
<text x="968" y="1465.26" font-size="13.5" fill="#00806B" font-weight="800">沒有症狀的細菌尿</text>
<text x="740" y="1496.4" font-size="14" fill="#345963">這三件都不需要因此吃預防性抗生素；結核菌素皮膚試驗陽性也不該因此被排除。</text>
<line x1="720" y1="1306.4" x2="720" y2="1565.4" stroke="#DBD3BF" stroke-width="1.6" stroke-linecap="round"/>
<rect x="110" y="1595.4" width="1220" height="179.0" rx="14" fill="#F3E8CD"/>
<text x="128" y="1619.4" font-size="16" fill="#8F7418" font-weight="800">真正要延後的是這一組</text>
<rect x="128" y="1651.4" width="6" height="43" rx="3" fill="#C9A83E"/>
<text x="138" y="1669.4" font-size="15.5" fill="#123641" font-weight="700">Treatment should be postponed for at least 1 week following transurethral resection, biopsy, traumatic catheterization, or gross hematuria</text>
<text x="128" y="1718.4" font-size="14.5" fill="#345963">仿單：黏膜正在出血時灌注可能促成全身性感染，所以刮除、切片、導尿受傷或肉眼血尿之後，至少要隔一週；指引則建議刮除後至少兩週才開始灌。禁忌欄另列免疫抑制狀態與活動性</text>
<text x="128" y="1739.4" font-size="14.5" fill="#345963">結核。</text>
<g filter="url(#sh)"><rect x="84" y="1806.4" width="1272" height="649" rx="18" fill="#F6E2E0" stroke="#B04A4A" stroke-width="3.5"/></g>
<text x="110" y="1842.4" font-size="23" fill="#B04A4A" font-weight="800">什麼情況是同一天回診，不是等下次</text>
<text x="110" y="1881.4" font-size="15.5" fill="#345963">「發燒是正常反應」這句話不能整句成立，它要分成兩層。仿單寫：持續一到兩天的倦怠、發燒、發冷，通常反映的是過敏反應；但下面這四種，仿單寫的是暗示全身性卡介苗感</text>
<text x="110" y="1904.4" font-size="15.5" fill="#345963">染，可能需要抗結核治療。</text>
<rect x="110" y="1943.4" width="601" height="82" rx="14" fill="#FFFFFF" stroke="#B04A4A" stroke-width="2"/>
<rect x="128" y="1961.4" width="30" height="30" rx="15" fill="#B04A4A"/>
<text x="143" y="1982.4" font-size="20" fill="#FFFFFF" font-weight="800" text-anchor="middle">!</text>
<text x="170" y="1967.4" font-size="16" fill="#123641" font-weight="700">類流感的發燒症狀持續超過 72 小時</text>
<rect x="729" y="1943.4" width="601" height="82" rx="14" fill="#FFFFFF" stroke="#B04A4A" stroke-width="2"/>
<rect x="747" y="1961.4" width="30" height="30" rx="15" fill="#B04A4A"/>
<text x="762" y="1982.4" font-size="20" fill="#FFFFFF" font-weight="800" text-anchor="middle">!</text>
<text x="789" y="1967.4" font-size="16" fill="#123641" font-weight="700">發燒達到 103°F（換算約 39.4°C），或體溫 38.5°C（101.3°F）以上、</text>
<text x="789" y="1990.4" font-size="16" fill="#123641" font-weight="700">且持續超過兩到三天</text>
<rect x="110" y="2043.4" width="601" height="60" rx="14" fill="#FFFFFF" stroke="#B04A4A" stroke-width="2"/>
<rect x="128" y="2061.4" width="30" height="30" rx="15" fill="#B04A4A"/>
<text x="143" y="2082.4" font-size="20" fill="#FFFFFF" font-weight="800" text-anchor="middle">!</text>
<text x="170" y="2067.4" font-size="16" fill="#123641" font-weight="700">全身性的症狀隨著每一次灌注愈來愈重，或肝功能指數持續異常</text>
<rect x="729" y="2043.4" width="601" height="60" rx="14" fill="#FFFFFF" stroke="#B04A4A" stroke-width="2"/>
<rect x="747" y="2061.4" width="30" height="30" rx="15" fill="#B04A4A"/>
<text x="762" y="2082.4" font-size="20" fill="#FFFFFF" font-weight="800" text-anchor="middle">!</text>
<text x="789" y="2067.4" font-size="16" fill="#123641" font-weight="700">局部的急性發炎——攝護腺炎、副睪炎、睪丸炎——持續超過兩到三天</text>
<rect x="110" y="2143.4" width="1220" height="71.0" rx="14" fill="#B04A4A"/>
<text x="130" y="2171.4" font-size="19" fill="#FFFFFF" font-weight="800">你要做的只有一件：當天回去，並說清楚最後一次灌注是哪一天。</text>
<text x="110" y="2228.4" font-size="14.5" fill="#345963">停藥、培養、影像與會診是醫療端的處置——指引的門檻是持續高燒超過 38.5°C 且超過 48 小時，就永久停止卡介苗灌注，並立即安排尿液培養、血液檢查與胸部 X 光、會診感染科。</text>
<text x="110" y="2267.4" font-size="16" fill="#123641" font-weight="800">機率放在同一段，不另外藏</text>
<rect x="110" y="2305.4" width="396" height="82" rx="12" fill="#ECE8DE"/>
<text x="126" y="2331.4" font-size="14.5" fill="#96790F" font-weight="800">嚴重副作用</text>
<text x="126" y="2355.4" font-size="14.5" fill="#345963">不到 5% 的病人，幾乎都能有效處理</text>
<rect x="522" y="2305.4" width="396" height="82" rx="12" fill="#ECE8DE"/>
<text x="538" y="2331.4" font-size="14.5" fill="#B04A4A" font-weight="800">全身性卡介苗感染</text>
<text x="538" y="2355.4" font-size="14.5" fill="#345963">1% 到 2%</text>
<rect x="934" y="2305.4" width="396" height="82" rx="12" fill="#ECE8DE"/>
<text x="950" y="2331.4" font-size="14.5" fill="#5C77C4" font-weight="800">瑞典全國資料庫 5,033 名曝露者</text>
<text x="950" y="2355.4" font-size="14.5" fill="#345963">五年累積的結核病通報診斷率 1.1%</text>
<circle cx="125" cy="2420.4" r="15" fill="#FFFFFF" stroke="#B04A4A" stroke-width="2.4"/>
<line x1="117.8" y1="2413.2" x2="132.2" y2="2427.6" stroke="#B04A4A" stroke-width="2.6" stroke-linecap="round"/>
<line x1="117.8" y1="2427.6" x2="132.2" y2="2413.2" stroke="#B04A4A" stroke-width="2.6" stroke-linecap="round"/>
<text x="154" y="2413.4" font-size="14.5" fill="#527078">這張圖不是用來判斷「我這樣算不算嚴重」的工具。訊號是給你當天打電話、當天回診用的；嚴不嚴重由看得到你報告的那個人判斷。</text>
<text x="84" y="2473.4" font-size="15" fill="#527078">示意圖，依 TICE BCG 美國仿單（Revised 2/2026）、EAU 非肌肉侵犯型膀胱癌指引 2026 版、SWOG 8507（Lamm 2000）與 EORTC 30962（Oddens 2013）重繪，非擷取自原論文圖表；</text>
<text x="84" y="2495.9" font-size="15" fill="#527078">各研究族群、設計與終點不同，數點不可直接互比。</text>
  </g>
</svg>
