<text x="404.4" y="495.4" font-size="17" fill="#5C77C4" font-weight="800">維持</text>
<text x="450.4" y="495.4" font-size="13.5" fill="#527078">每一次連續三週</text>
<rect x="110" y="585.4" width="86.08" height="24" rx="12" fill="#C9A83E"/>
<text x="120" y="602.44" font-size="14" fill="#FFFFFF" font-weight="800">最多 27 次</text>
<text x="110" y="631.4" font-size="15" fill="#345963">療程長短不是評分。它是風險層、耐受度與藥物供應一起談出來的結果——誰該灌、灌幾次由風險分層決定。</text>
<rect x="110" y="669.4" width="599" height="390" rx="14" fill="#F7F1E4" stroke="#DBD3BF" stroke-width="2"/>
<text x="130" y="699.4" font-size="18" fill="#00806B" font-weight="800">維持有沒有用</text>
<rect x="130" y="728.4" width="92.41" height="24" rx="12" fill="#00806B"/>
<text x="140" y="745.08" font-size="13" fill="#FFFFFF" font-weight="800">SWOG 8507</text>
<rect x="130" y="760.4" width="68" height="20" rx="5" fill="#ECE8DE"/>
<text x="138" y="774.9" font-size="13" fill="#7A6E58" font-weight="800">研究設計</text>
<text x="130" y="793.4" font-size="13.5" fill="#345963" font-weight="600">隨機試驗</text>
<rect x="130" y="818.4" width="42" height="20" rx="5" fill="#ECE8DE"/>
<text x="138" y="832.9" font-size="13" fill="#7A6E58" font-weight="800">族群</text>
<text x="130" y="851.4" font-size="13.5" fill="#345963" font-weight="600">復發的 Ta、T1 與原位癌；660 人接受六週誘導，三個月時 550 人隨機分到維持或不維持</text>
<rect x="130" y="876.4" width="94" height="20" rx="5" fill="#ECE8DE"/>
<text x="138" y="890.9" font-size="13" fill="#7A6E58" font-weight="800">主要分析族群</text>
<text x="130" y="909.4" font-size="13.5" fill="#345963" font-weight="600">隨機時無病的 384 人</text>
<rect x="130" y="934.4" width="42" height="20" rx="5" fill="#ECE8DE"/>
<text x="138" y="948.9" font-size="13" fill="#7A6E58" font-weight="800">結果</text>
<text x="130" y="967.4" font-size="13.5" fill="#345963" font-weight="600">中位無復發存活 35.7 個月（不維持）對 76.8 個月（維持），p 小於 0.0001；中位無惡化存</text>
<text x="130" y="986.4" font-size="13.5" fill="#345963" font-weight="600">活 111.5 個月對未達到；五年整體存活 78% 對 83%</text>
<text x="130" y="1025.4" font-size="14" fill="#527078">作者自己註明：副作用大的人就把維持停掉了，所以這個試驗看不到重度毒性。</text>
<rect x="731" y="669.4" width="599" height="390" rx="14" fill="#F7F1E4" stroke="#DBD3BF" stroke-width="2"/>
<text x="751" y="699.4" font-size="18" fill="#5C77C4" font-weight="800">那要打多久</text>
<rect x="751" y="728.4" width="106.19" height="24" rx="12" fill="#5C77C4"/>
<text x="761" y="745.08" font-size="13" fill="#FFFFFF" font-weight="800">EORTC 30962</text>
<rect x="751" y="760.4" width="68" height="20" rx="5" fill="#ECE8DE"/>
<text x="759" y="774.9" font-size="13" fill="#7A6E58" font-weight="800">研究設計</text>
<text x="751" y="793.4" font-size="13.5" fill="#345963" font-weight="600">隨機試驗，2×2 設計（三分之一劑量或全劑量 × 打一年或打三年）</text>
<rect x="751" y="818.4" width="42" height="20" rx="5" fill="#ECE8DE"/>
<text x="759" y="832.9" font-size="13" fill="#7A6E58" font-weight="800">族群</text>
<text x="751" y="851.4" font-size="13.5" fill="#345963" font-weight="600">中、高風險 Ta 與 T1；意向治療 1,355 人</text>
<rect x="751" y="876.4" width="42" height="20" rx="5" fill="#ECE8DE"/>
<text x="759" y="890.9" font-size="13" fill="#7A6E58" font-weight="800">追蹤</text>
<text x="751" y="909.4" font-size="13.5" fill="#345963" font-weight="600">中位 7.1 年</text>
<rect x="751" y="934.4" width="42" height="20" rx="5" fill="#ECE8DE"/>
<text x="759" y="948.9" font-size="13" fill="#7A6E58" font-weight="800">結果</text>
<text x="751" y="967.4" font-size="13.5" fill="#345963" font-weight="600">高風險病人多打兩年可以減少復發（風險比 1.61，95% 信賴區間 1.13 到 2.30，p=0.009），</text>
<text x="751" y="986.4" font-size="13.5" fill="#345963" font-weight="600">但只有在用全劑量時成立；中風險用全劑量多打兩年沒有好處</text>
<text x="751" y="1025.4" font-size="14" fill="#527078">進展與存活在四組之間沒有差異。多出來的兩年買到的是少一些復發，不是少一些死亡。</text>
<g filter="url(#sh)"><rect x="84" y="1097.4" width="1272" height="683" rx="18" fill="#FFFFFF"/></g>
<text x="110" y="1133.4" font-size="22" fill="#123641" font-weight="800">灌完那幾天，以及有多少人撐得完</text>
<text x="110" y="1171.4" font-size="15.5" fill="#527078">仿單寫得具體：大約 60% 的人會有膀胱刺激症狀。一次比一次難受是這個藥的常態，不是你變弱了。</text>
