<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1090" viewBox="0 0 1440 1090" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">每個癌別，爬到哪一階</title>
  <desc id="d">斜線＝該階最大的隨機試驗結果為陰性（未做出差異） 灰色＝目前只有個案報告與前臨床資料 軟組織肉瘤, 乳癌（胸壁復發）, 頭頸癌（再照射）, 黑色素瘤（淺表）, 子宮頸癌, 膀胱癌（腔內灌注）, 膀胱癌（保膀胱）, 肛門癌, 直腸癌, 攝護腺癌, 食道／肺／卵巢／腦, 免疫治療組合, 細胞治療組合, 質子＋熱治療</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#123641" opacity=".14"/><line x1="0" y1="0" x2="0" y2="8" stroke="#123641" stroke-width="2.4" opacity=".85"/></pattern><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0B2832" flood-opacity=".12"/></filter><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="1090" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="86" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">EVIDENCE BY SITE</text>
<text x="84" y="148" font-size="44" fill="#123641" font-weight="800" class="r">每個癌別，爬到哪一階</text>
<text x="84" y="204" font-size="21" fill="#527078">位置＝已完成的最高證據層級，不是療效排名。</text>
<text x="84" y="234" font-size="21" fill="#527078">同一階裡，年代、人數與終點仍然差很多。</text>
<line x1="92" y1="304" x2="1356" y2="304" stroke="#123641" stroke-width="1.4" stroke-linecap="round" opacity=".22"/>
<text x="92" y="334" font-size="17" fill="#A98722" font-weight="800">第5階</text>
<text x="92" y="362" font-size="20" fill="#123641" font-weight="700">大型隨機第三期（陽性）</text>
<rect x="432" y="330" width="99" height="38" rx="19" fill="#A98722" opacity=".20" stroke="#A98722" stroke-width="2" />
<text x="449" y="355" font-size="17" fill="#123641" font-weight="700">軟組織肉瘤</text>
<line x1="92" y1="432" x2="1356" y2="432" stroke="#123641" stroke-width="1.4" stroke-linecap="round" opacity=".22"/>
<text x="92" y="462" font-size="17" fill="#A98722" font-weight="800">第4階</text>
<text x="92" y="490" font-size="20" fill="#123641" font-weight="700">多個隨機試驗或其統合分析</text>
<rect x="432" y="458" width="138" height="38" rx="19" fill="#A98722" opacity=".20" stroke="#A98722" stroke-width="2" />
<text x="449" y="483" font-size="17" fill="#123641" font-weight="700">乳癌（胸壁復發）</text>
<rect x="582" y="458" width="138" height="38" rx="19" fill="#A98722" opacity=".20" stroke="#A98722" stroke-width="2" />
<text x="599" y="483" font-size="17" fill="#123641" font-weight="700">頭頸癌（再照射）</text>
<rect x="732" y="458" width="138" height="38" rx="19" fill="#A98722" opacity=".20" stroke="#A98722" stroke-width="2" />
<text x="749" y="483" font-size="17" fill="#123641" font-weight="700">黑色素瘤（淺表）</text>
<line x1="92" y1="560" x2="1356" y2="560" stroke="#123641" stroke-width="1.4" stroke-linecap="round" opacity=".22"/>
<text x="92" y="590" font-size="17" fill="#A98722" font-weight="800">第3階</text>
<text x="92" y="618" font-size="20" fill="#123641" font-weight="700">隨機試驗，但結果不一致或提前結束</text>
<rect x="432" y="586" width="86" height="38" rx="19" fill="#5C77C4" opacity=".20" stroke="#5C77C4" stroke-width="2" />
<text x="449" y="611" font-size="17" fill="#123641" font-weight="700">子宮頸癌</text>
<rect x="530" y="586" width="151" height="38" rx="19" fill="#5C77C4" opacity=".20" stroke="#5C77C4" stroke-width="2" />
<rect x="530" y="586" width="151" height="38" rx="19" fill="url(#hatch)" opacity=".5" />
<text x="547" y="611" font-size="17" fill="#123641" font-weight="700">膀胱癌（腔內灌注）</text>
<line x1="92" y1="688" x2="1356" y2="688" stroke="#123641" stroke-width="1.4" stroke-linecap="round" opacity=".22"/>
<text x="92" y="718" font-size="17" fill="#A98722" font-weight="800">第2階</text>
<text x="92" y="746" font-size="20" fill="#123641" font-weight="700">前瞻單臂／世代研究</text>
<rect x="432" y="714" width="138" height="38" rx="19" fill="#5C77C4" opacity=".20" stroke="#5C77C4" stroke-width="2" />
<text x="449" y="739" font-size="17" fill="#123641" font-weight="700">膀胱癌（保膀胱）</text>
<rect x="582" y="714" width="73" height="38" rx="19" fill="#5C77C4" opacity=".20" stroke="#5C77C4" stroke-width="2" />
<text x="599" y="739" font-size="17" fill="#123641" font-weight="700">肛門癌</text>
<rect x="667" y="714" width="73" height="38" rx="19" fill="#5C77C4" opacity=".20" stroke="#5C77C4" stroke-width="2" />
<text x="684" y="739" font-size="17" fill="#123641" font-weight="700">直腸癌</text>
<rect x="752" y="714" width="86" height="38" rx="19" fill="#00806B" opacity=".20" stroke="#00806B" stroke-width="2" />
<text x="769" y="739" font-size="17" fill="#123641" font-weight="700">攝護腺癌</text>
<line x1="92" y1="816" x2="1356" y2="816" stroke="#123641" stroke-width="1.4" stroke-linecap="round" opacity=".22"/>
<text x="92" y="846" font-size="17" fill="#A98722" font-weight="800">第1階</text>
<text x="92" y="874" font-size="20" fill="#123641" font-weight="700">回溯、個案與前臨床</text>
<rect x="432" y="842" width="151" height="38" rx="19" fill="#00806B" opacity=".20" stroke="#00806B" stroke-width="2" />
<text x="449" y="867" font-size="17" fill="#123641" font-weight="700">食道／肺／卵巢／腦</text>
<rect x="595" y="842" width="112" height="38" rx="19" fill="#00806B" opacity=".20" stroke="#00806B" stroke-width="2" />
<text x="612" y="867" font-size="17" fill="#123641" font-weight="700">免疫治療組合</text>
<rect x="719" y="842" width="112" height="38" rx="19" fill="#9A9282" opacity=".16" stroke="#9A9282" stroke-width="2" />
<text x="736" y="867" font-size="17" fill="#6B8084" font-weight="700">細胞治療組合</text>
<rect x="843" y="842" width="112" height="38" rx="19" fill="#9A9282" opacity=".16" stroke="#9A9282" stroke-width="2" />
<text x="860" y="867" font-size="17" fill="#6B8084" font-weight="700">質子＋熱治療</text>
<rect x="84" y="966" width="30" height="20" rx="6" fill="#A98722" opacity=".2" stroke="#A98722" stroke-width="2" />
<rect x="84" y="966" width="30" height="20" rx="6" fill="url(#hatch)" opacity=".5" />
<text x="126" y="982" font-size="18" fill="#527078">斜線＝該階最大的隨機試驗結果為陰性（未做出差異）</text>
<rect x="84" y="1000" width="30" height="20" rx="6" fill="#9A9282" opacity=".16" stroke="#9A9282" stroke-width="2" />
<text x="126" y="1016" font-size="18" fill="#527078">灰色＝目前只有個案報告與前臨床資料</text>
<text x="84" y="1054" font-size="16" fill="#6B8084">示意圖，依本專題查證過的來源整理；每一個位置的試驗設計、人數與終點，見各癌別文章。</text>
  </g>
</svg>
