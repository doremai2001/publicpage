<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1323" viewBox="0 0 1440 1323" role="img" aria-labelledby="t d">
  <title id="t">2021 WHO CNS5 分子分類決策樹：先過三道門，才輪到那五個選項</title>
  <desc id="d">示意圖：2021 年 WHO CNS5 決定膠質母細胞瘤這個名字的決策樹。第一步是三道入口門，缺一不可：成人型（不是小兒型瀰漫性膠質瘤）、瀰漫性（不是局限型的那一群）、星細胞性膠質瘤。三道門都過了，才問第二步：IDH（異檸檬酸脫氫酶）有沒有突變。IDH 有突變的那一側再問 1p/19q 共缺失：有共缺失是寡樹突膠質瘤，IDH-mutant 且 1p/19q-codeleted；沒有共缺失是星細胞瘤，IDH-mutant，grade 2、3 或 4，其中 CDKN2A/B 同型合子缺失就直接算 grade 4，不必等組織學。IDH 沒有突變的那一側進入第三步：五個條件裡任何一個成立就夠——微血管增生、壞死、TERT 啟動子突變、EGFR 擴增、第 7 號染色體整條增加加上第 10 號整條減少；成立即為膠質母細胞瘤，IDH-wildtype，CNS WHO grade 4。兩個旁註不在主流程上：第一，光是 IDH 沒有突變不足以定 grade 4，很多良性一點的腫瘤也是 IDH-wildtype，所以還要看那五個條件；第二，EGFR 要看到局部的高倍數擴增才算，trisomy 7 不算，免疫染色也不能用來判定擴增；第三，年輕病人先想小兒型瀰漫性膠質瘤，CNS5 已經不把 glioblastoma 這個詞用在小兒型腫瘤上。圖的最下方是兩條佔比條，來自美國登記資料 CBTRUS 2018 到 2022：在全部腦瘤與中樞神經系統腫瘤裡，膠質母細胞瘤佔 13.7%、腦膜瘤佔 42.6%、其他佔 43.7%；在惡性的那一群裡，膠質母細胞瘤佔 52.2%、其他惡性腦瘤佔 47.8%。台灣的部分只寫 2023 年腦癌新發 742 人，膠質母細胞瘤佔多少查不到官方拆分。本圖不含任何存活數字。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#B9AE94" stroke-width="2" opacity="0.55"/></pattern><pattern id="hatchR" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(135)"><line x1="0" y1="0" x2="0" y2="8" stroke="#B04A4A" stroke-width="2" opacity="0.45"/></pattern><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="1323" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="86" font-size="18" fill="#A98722" font-weight="800" letter-spacing="4px">2021 WHO CNS5 — HOW THE NAME IS DECIDED</text>
<text x="84" y="148" font-size="42" fill="#123641" font-weight="800" class="r">先過三道門，才輪到那五個選項</text>
<text x="84" y="206.08" font-size="20" fill="#527078">2021 年的 WHO CNS5 先問三個入口條件，三道門都過了，分子條件才開始算數。</text>
<text x="84" y="235.08" font-size="20" fill="#527078">這張圖畫的是「名字怎麼決定的」。本圖不含任何存活數字——那些在〈那個數字，我要怎麼跟你講〉。</text>
<text x="84" y="304.08" font-size="19" fill="#8F7418" font-weight="800">第一步｜三道門（入口條件，缺一不可）</text>
<rect x="84" y="332.08" width="382.67" height="64" rx="16" fill="#FFFFFF" stroke="#B9AE94" stroke-width="2"/>
<text x="104" y="364.08" font-size="20" fill="#123641" font-weight="800">成人型</text>
<text x="104" y="388.08" font-size="14.5" fill="#527078">不是小兒型瀰漫性膠質瘤</text>
<line x1="478.67" y1="364.08" x2="508.39" y2="364.08" stroke="#B9AE94" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="516.67,364.08 508.45,367.75 508.45,360.41" fill="#B9AE94"/>
<rect x="528.67" y="332.08" width="382.67" height="64" rx="16" fill="#FFFFFF" stroke="#B9AE94" stroke-width="2"/>
<text x="548.67" y="364.08" font-size="20" fill="#123641" font-weight="800">瀰漫性</text>
<text x="548.67" y="388.08" font-size="14.5" fill="#527078">不是局限型（circumscribed）的那一群</text>
<line x1="923.33" y1="364.08" x2="953.05" y2="364.08" stroke="#B9AE94" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="961.33,364.08 953.12,367.75 953.12,360.41" fill="#B9AE94"/>
<rect x="973.33" y="332.08" width="382.67" height="64" rx="16" fill="#FFFFFF" stroke="#B9AE94" stroke-width="2"/>
<text x="993.33" y="364.08" font-size="20" fill="#123641" font-weight="800">星細胞性膠質瘤</text>
<text x="993.33" y="388.08" font-size="14.5" fill="#527078">星細胞來源的瀰漫性膠質瘤</text>
<text x="84" y="428.08" font-size="15" fill="#527078">三道門都過了，才輪到下面的分子條件。</text>
<rect x="84" y="442.08" width="1272" height="46" rx="14" fill="#F3E8CD" stroke="#C9A83E" stroke-width="2.5"/>
<text x="104" y="469.08" font-size="19" fill="#8F7418" font-weight="800">第二步｜IDH（異檸檬酸脫氫酶）有沒有突變？</text>
<line x1="392" y1="500.08" x2="392" y2="514.08" stroke="#00806B" stroke-width="2.5" stroke-linecap="round"/>
<line x1="1048" y1="500.08" x2="1048" y2="514.08" stroke="#96790F" stroke-width="2.5" stroke-linecap="round"/>
<line x1="392" y1="500.08" x2="1048" y2="500.08" stroke="#B9AE94" stroke-width="2" stroke-linecap="round"/>
<line x1="720" y1="488.08" x2="720" y2="500.08" stroke="#B9AE94" stroke-width="2" stroke-linecap="round"/>
<rect x="84" y="514.08" width="616" height="34" rx="17" fill="#00806B"/>
<text x="392" y="537.08" font-size="15.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">IDH 有突變</text>
<text x="88" y="578.08" font-size="17" fill="#123641" font-weight="800">再問一次：1p/19q 共缺失？</text>
<rect x="84" y="590.08" width="616" height="47" rx="12" fill="#FFFFFF" stroke="#DBD3BF" stroke-width="2"/>
<line x1="84" y1="594.08" x2="84" y2="633.08" stroke="#00806B" stroke-width="5" stroke-linecap="round"/>
<text x="100" y="610.08" font-size="13.5" fill="#00806B" font-weight="800">有共缺失</text>
<text x="100" y="630.08" font-size="15" fill="#345963" font-weight="600">寡樹突膠質瘤，IDH-mutant 且 1p/19q-codeleted</text>
<rect x="84" y="647.08" width="616" height="47" rx="12" fill="#FFFFFF" stroke="#DBD3BF" stroke-width="2"/>
<line x1="84" y1="651.08" x2="84" y2="690.08" stroke="#00806B" stroke-width="5" stroke-linecap="round"/>
<text x="100" y="667.08" font-size="13.5" fill="#00806B" font-weight="800">沒有共缺失</text>
<text x="100" y="687.08" font-size="15" fill="#345963" font-weight="600">星細胞瘤，IDH-mutant（grade 2／3／4）</text>
<rect x="84" y="704.08" width="616" height="35" rx="10" fill="none" stroke="#B9AE94" stroke-width="1.6" stroke-dasharray="5 5"/>
<text x="98" y="725.08" font-size="13.5" fill="#527078">星細胞瘤這一支：CDKN2A/B 同型合子缺失 → 直接算 grade 4，不必等組織學。</text>
<rect x="740" y="514.08" width="616" height="34" rx="17" fill="#96790F"/>
<text x="1048" y="537.08" font-size="15.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">IDH 沒有突變（IDH-wildtype）</text>
<text x="744" y="578.08" font-size="17" fill="#123641" font-weight="800">第三步｜五個條件，任何一個成立就夠</text>
<rect x="740" y="588.08" width="616" height="32" rx="10" fill="#F3E8CD"/>
<circle cx="760" cy="604.08" r="9" fill="#96790F"/>
<text x="760" y="608.58" font-size="12" fill="#FFFFFF" font-weight="800" text-anchor="middle">1</text>
<text x="778" y="608.08" font-size="14.5" fill="#345963" font-weight="600">微血管增生</text>
<rect x="740" y="626.08" width="616" height="32" rx="10" fill="#F3E8CD"/>
<circle cx="760" cy="642.08" r="9" fill="#96790F"/>
<text x="760" y="646.58" font-size="12" fill="#FFFFFF" font-weight="800" text-anchor="middle">2</text>
<text x="778" y="646.08" font-size="14.5" fill="#345963" font-weight="600">壞死</text>
<rect x="740" y="664.08" width="616" height="32" rx="10" fill="#F3E8CD"/>
<circle cx="760" cy="680.08" r="9" fill="#96790F"/>
<text x="760" y="684.58" font-size="12" fill="#FFFFFF" font-weight="800" text-anchor="middle">3</text>
<text x="778" y="684.08" font-size="14.5" fill="#345963" font-weight="600">TERT 啟動子突變</text>
<rect x="740" y="702.08" width="616" height="32" rx="10" fill="#F3E8CD"/>
<circle cx="760" cy="718.08" r="9" fill="#96790F"/>
<text x="760" y="722.58" font-size="12" fill="#FFFFFF" font-weight="800" text-anchor="middle">4</text>
<text x="778" y="722.08" font-size="14.5" fill="#345963" font-weight="600">EGFR 擴增</text>
<rect x="740" y="740.08" width="616" height="32" rx="10" fill="#F3E8CD"/>
<circle cx="760" cy="756.08" r="9" fill="#96790F"/>
<text x="760" y="760.58" font-size="12" fill="#FFFFFF" font-weight="800" text-anchor="middle">5</text>
<text x="778" y="760.08" font-size="14.5" fill="#345963" font-weight="600">第 7 號染色體整條增加＋第 10 號整條減少（+7／−10）</text>
<line x1="1048" y1="784.08" x2="1048" y2="794.88" stroke="#96790F" stroke-width="3" stroke-linecap="round"/>
<polygon points="1048,804.08 1043.92,794.95 1052.08,794.95" fill="#96790F"/>
<g filter="url(#sh)"><rect x="740" y="812.08" width="616" height="40" rx="12" fill="#96790F"/></g>
<text x="756" y="838.08" font-size="17" fill="#FFFFFF" font-weight="800">膠質母細胞瘤，IDH-wildtype，CNS WHO grade 4</text>
<rect x="84" y="878.0799999999999" width="1272" height="159.0" rx="16" fill="none" stroke="#C9A83E" stroke-width="2.5"/>
<text x="108" y="908.08" font-size="17" fill="#8F7418" font-weight="800">旁註（這兩件事不在主流程上，但常被弄錯）</text>
<circle cx="114" cy="935.08" r="4.5" fill="#C9A83E"/>
<text x="128" y="940.08" font-size="14.5" fill="#345963">光是「IDH 沒有突變」不足以定 grade 4——很多良性一點的腫瘤也是 IDH-wildtype，所以還要看上面那五個條件（cIMPACT-NOW update 3）。</text>
<circle cx="114" cy="968.08" r="4.5" fill="#C9A83E"/>
<text x="128" y="973.08" font-size="14.5" fill="#345963">EGFR 要看到局部的高倍數擴增才算；trisomy 7（第 7 號染色體三體）不算，免疫染色也不能用來判定擴增（cIMPACT-NOW update 3）。</text>
<circle cx="114" cy="1001.08" r="4.5" fill="#C9A83E"/>
<text x="128" y="1006.08" font-size="14.5" fill="#345963">年輕的病人先想小兒型瀰漫性膠質瘤；CNS5 已經不把「glioblastoma」這個詞用在小兒型腫瘤上。</text>
<text x="84" y="1071.08" font-size="18" fill="#123641" font-weight="800">它在腦瘤裡佔多少（美國登記資料，CBTRUS 2018–2022）</text>
<text x="84" y="1109.08" font-size="14.5" fill="#527078" font-weight="600">全部腦瘤與中樞神經系統腫瘤</text>
<rect x="84" y="1119.08" width="172.26" height="34" rx="6" fill="#96790F"/>
<text x="170.13" y="1140.58" font-size="13.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">膠質母細胞瘤 13.7%</text>
<rect x="258.26" y="1119.08" width="539.87" height="34" rx="6" fill="#5C77C4"/>
<text x="528.2" y="1140.58" font-size="13.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">腦膜瘤 42.6%</text>
<rect x="800.14" y="1119.08" width="555.86" height="34" rx="6" fill="#ECE8DE"/>
<text x="1078.07" y="1140.58" font-size="13.5" fill="#345963" font-weight="700" text-anchor="middle">其他 43.7%</text>
<text x="84" y="1181.08" font-size="14.5" fill="#527078" font-weight="600">其中屬於惡性的那一群</text>
<rect x="84" y="1191.08" width="661.98" height="34" rx="6" fill="#96790F"/>
<text x="414.99" y="1212.58" font-size="13.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">膠質母細胞瘤 52.2%</text>
<rect x="747.98" y="1191.08" width="608.02" height="34" rx="6" fill="#ECE8DE"/>
<text x="1051.99" y="1212.58" font-size="13.5" fill="#345963" font-weight="700" text-anchor="middle">其他惡性腦瘤 47.8%</text>
<text x="84" y="1255.08" font-size="14" fill="#527078">這兩條是美國的登記資料。台灣的部分：2023 年腦癌新發 742 人；膠質母細胞瘤佔多少，我查不到官方拆分。</text>
<text x="84" y="1297.08" font-size="16" fill="#527078">示意圖，依 2021 WHO CNS5（Louis 2021）、cIMPACT-NOW update 3（Brat 2018）與 CBTRUS 2018–2022 重繪；各研究族群、設計與終點不同，數點不可直接互比。</text>
  </g>
</svg>
