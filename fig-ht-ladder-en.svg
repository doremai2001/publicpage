<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1090" viewBox="0 0 1440 1090" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Which rung each cancer site has reached</title>
  <desc id="d">Hatched = the largest randomised trial on that rung was negative Grey = case reports and preclinical work only Soft tissue sarcoma, Breast (chest wall recurrence), Head and neck (reirradiation), Melanoma (superficial), Cervix, Bladder (intravesical), Bladder (preservation), Anus, Rectum, Prostate, Oesophagus / lung / ovary / brain, With immunotherapy, With cell therapy, Proton + hyperthermia</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#123641" opacity=".14"/><line x1="0" y1="0" x2="0" y2="8" stroke="#123641" stroke-width="2.4" opacity=".85"/></pattern><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0B2832" flood-opacity=".12"/></filter><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="1090" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="86" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">EVIDENCE BY SITE</text>
<text x="84" y="148" font-size="44" fill="#123641" font-weight="800" class="r">Which rung each cancer site has reached</text>
<text x="84" y="204" font-size="21" fill="#527078">Position = highest completed level of evidence, not a ranking of benefit.</text>
<text x="84" y="234" font-size="21" fill="#527078">Within a rung, era, sample size and endpoint still differ widely.</text>
<line x1="92" y1="304" x2="1356" y2="304" stroke="#123641" stroke-width="1.4" stroke-linecap="round" opacity=".22"/>
<text x="92" y="334" font-size="17" fill="#A98722" font-weight="800">Rung 5</text>
<text x="92" y="362" font-size="20" fill="#123641" font-weight="700">Large positive</text>
<text x="92" y="388" font-size="20" fill="#123641" font-weight="700">randomised phase</text>
<text x="92" y="414" font-size="20" fill="#123641" font-weight="700">3</text>
<rect x="432" y="330" width="205" height="38" rx="19" fill="#A98722" opacity=".20" stroke="#A98722" stroke-width="2" />
<text x="449" y="355" font-size="17" fill="#123641" font-weight="700">Soft tissue sarcoma</text>
<line x1="92" y1="432" x2="1356" y2="432" stroke="#123641" stroke-width="1.4" stroke-linecap="round" opacity=".22"/>
<text x="92" y="462" font-size="17" fill="#A98722" font-weight="800">Rung 4</text>
<text x="92" y="490" font-size="20" fill="#123641" font-weight="700">Several</text>
<text x="92" y="516" font-size="20" fill="#123641" font-weight="700">randomised</text>
<text x="92" y="542" font-size="20" fill="#123641" font-weight="700">trials or their</text>
<text x="92" y="568" font-size="20" fill="#123641" font-weight="700">meta-analysis</text>
<rect x="432" y="458" width="304" height="38" rx="19" fill="#A98722" opacity=".20" stroke="#A98722" stroke-width="2" />
<text x="449" y="483" font-size="17" fill="#123641" font-weight="700">Breast (chest wall recurrence)</text>
<rect x="748" y="458" width="295" height="38" rx="19" fill="#A98722" opacity=".20" stroke="#A98722" stroke-width="2" />
<text x="765" y="483" font-size="17" fill="#123641" font-weight="700">Head and neck (reirradiation)</text>
<rect x="1055" y="458" width="232" height="38" rx="19" fill="#A98722" opacity=".20" stroke="#A98722" stroke-width="2" />
<text x="1072" y="483" font-size="17" fill="#123641" font-weight="700">Melanoma (superficial)</text>
<line x1="92" y1="560" x2="1356" y2="560" stroke="#123641" stroke-width="1.4" stroke-linecap="round" opacity=".22"/>
<text x="92" y="590" font-size="17" fill="#A98722" font-weight="800">Rung 3</text>
<text x="92" y="618" font-size="20" fill="#123641" font-weight="700">Randomised, but</text>
<text x="92" y="644" font-size="20" fill="#123641" font-weight="700">inconsistent or</text>
<text x="92" y="670" font-size="20" fill="#123641" font-weight="700">stopped early</text>
<rect x="432" y="586" width="88" height="38" rx="19" fill="#5C77C4" opacity=".20" stroke="#5C77C4" stroke-width="2" />
<text x="449" y="611" font-size="17" fill="#123641" font-weight="700">Cervix</text>
<rect x="532" y="586" width="232" height="38" rx="19" fill="#5C77C4" opacity=".20" stroke="#5C77C4" stroke-width="2" />
<rect x="532" y="586" width="232" height="38" rx="19" fill="url(#hatch)" opacity=".5" />
<text x="549" y="611" font-size="17" fill="#123641" font-weight="700">Bladder (intravesical)</text>
<line x1="92" y1="688" x2="1356" y2="688" stroke="#123641" stroke-width="1.4" stroke-linecap="round" opacity=".22"/>
<text x="92" y="718" font-size="17" fill="#A98722" font-weight="800">Rung 2</text>
<text x="92" y="746" font-size="20" fill="#123641" font-weight="700">Prospective</text>
<text x="92" y="772" font-size="20" fill="#123641" font-weight="700">single-arm /</text>
<text x="92" y="798" font-size="20" fill="#123641" font-weight="700">cohort</text>
<rect x="432" y="714" width="232" height="38" rx="19" fill="#5C77C4" opacity=".20" stroke="#5C77C4" stroke-width="2" />
<text x="449" y="739" font-size="17" fill="#123641" font-weight="700">Bladder (preservation)</text>
<rect x="676" y="714" width="70" height="38" rx="19" fill="#5C77C4" opacity=".20" stroke="#5C77C4" stroke-width="2" />
<text x="693" y="739" font-size="17" fill="#123641" font-weight="700">Anus</text>
<rect x="758" y="714" width="88" height="38" rx="19" fill="#5C77C4" opacity=".20" stroke="#5C77C4" stroke-width="2" />
<text x="775" y="739" font-size="17" fill="#123641" font-weight="700">Rectum</text>
<rect x="858" y="714" width="106" height="38" rx="19" fill="#00806B" opacity=".20" stroke="#00806B" stroke-width="2" />
<text x="875" y="739" font-size="17" fill="#123641" font-weight="700">Prostate</text>
<line x1="92" y1="816" x2="1356" y2="816" stroke="#123641" stroke-width="1.4" stroke-linecap="round" opacity=".22"/>
<text x="92" y="846" font-size="17" fill="#A98722" font-weight="800">Rung 1</text>
<text x="92" y="874" font-size="20" fill="#123641" font-weight="700">Retrospective,</text>
<text x="92" y="900" font-size="20" fill="#123641" font-weight="700">case reports,</text>
<text x="92" y="926" font-size="20" fill="#123641" font-weight="700">preclinical</text>
<rect x="432" y="842" width="331" height="38" rx="19" fill="#00806B" opacity=".20" stroke="#00806B" stroke-width="2" />
<text x="449" y="867" font-size="17" fill="#123641" font-weight="700">Oesophagus / lung / ovary / brain</text>
<rect x="775" y="842" width="196" height="38" rx="19" fill="#00806B" opacity=".20" stroke="#00806B" stroke-width="2" />
<text x="792" y="867" font-size="17" fill="#123641" font-weight="700">With immunotherapy</text>
<rect x="983" y="842" width="187" height="38" rx="19" fill="#9A9282" opacity=".16" stroke="#9A9282" stroke-width="2" />
<text x="1000" y="867" font-size="17" fill="#6B8084" font-weight="700">With cell therapy</text>
<rect x="432" y="888" width="223" height="38" rx="19" fill="#9A9282" opacity=".16" stroke="#9A9282" stroke-width="2" />
<text x="449" y="913" font-size="17" fill="#6B8084" font-weight="700">Proton + hyperthermia</text>
<rect x="84" y="966" width="30" height="20" rx="6" fill="#A98722" opacity=".2" stroke="#A98722" stroke-width="2" />
<rect x="84" y="966" width="30" height="20" rx="6" fill="url(#hatch)" opacity=".5" />
<text x="126" y="982" font-size="18" fill="#527078">Hatched = the largest randomised trial on that rung was negative</text>
<rect x="84" y="1000" width="30" height="20" rx="6" fill="#9A9282" opacity=".16" stroke="#9A9282" stroke-width="2" />
<text x="126" y="1016" font-size="18" fill="#527078">Grey = case reports and preclinical work only</text>
<text x="84" y="1054" font-size="16" fill="#6B8084">Schematic built from the sources verified for this topic; see each article for design, sample size and endpoint.</text>
  </g>
</svg>
