<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1294" viewBox="0 0 620 1294" role="img" aria-labelledby="t d">
  <title id="t">從 CIN 到侵襲癌：每一階都有人回頭</title>
  <desc id="d">示意圖：CIN 階梯與各階處置。CIN 1 約六成自行消退，觀察為首選；CIN 2 在 24 個月內約一半消退（30 歲以下六成），建議治療、特定條件下可觀察；CIN 3 即「原位癌」，還不是癌，但沒有觀察這個選項——治療得當者 30 年內變成侵襲癌的只有 0.7%，未治療者 31.3%（病灶持續者 50.3%），兩個數字同框。越過基底膜即為侵襲癌：IA1 錐切可為根治治療、IA2 錐切或單純子宮切除、IB 起進入分期與治療分流。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><pattern id="hz" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#96790F" stroke-width="2" opacity="0.55"/></pattern><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="620" height="1294" rx="30" fill="url(#bg)"/>
  <g class="z">
<text x="44" y="62" font-size="14" fill="#A98722" font-weight="800" letter-spacing="3.5px">THE CIN LADDER</text>
<text x="44" y="112" font-size="30" fill="#123641" font-weight="800" class="r">從 CIN 到侵襲癌：</text>
<text x="44" y="152" font-size="30" fill="#123641" font-weight="800" class="r">每一階都有人回頭</text>
<text x="44" y="194" font-size="14.5" fill="#527078">「原位癌（CIN 3）不是癌」——這句話</text>
<text x="44" y="216" font-size="14.5" fill="#527078">成立的條件，是「有治療」。</text>
<g filter="url(#sh)"><rect x="44" y="250" width="532" height="146" rx="18" fill="#FFFFFF"/></g>
<text x="66" y="284" font-size="18" fill="#123641" font-weight="800">CIN 1</text>
<text x="123.52" y="284" font-size="12.5" fill="#6B8084">｜低度病變</text>
<text x="66" y="312" font-size="13.5" fill="#345963">約 60% 自行消退｜約 30% 持續</text>
<text x="66" y="333" font-size="13.5" fill="#345963">10% →CIN 3、1% →侵襲癌</text>
<text x="66" y="354" font-size="13.5" fill="#345963">（舊研究合成值，無統一時間軸）</text>
<text x="66" y="375" font-size="13.5" fill="#00806B" font-weight="800">處置：觀察為首選</text>
<line x1="90" y1="402" x2="90" y2="426" stroke="#123641" stroke-width="3" stroke-linecap="round"/>
<line x1="90" y1="426" x2="84.8077" y2="416.303" stroke="#123641" stroke-width="3" stroke-linecap="round"/>
<line x1="90" y1="426" x2="95.1923" y2="416.303" stroke="#123641" stroke-width="3" stroke-linecap="round"/>
<g filter="url(#sh)"><rect x="44" y="438" width="532" height="146" rx="18" fill="#FFFFFF"/></g>
<text x="66" y="472" font-size="18" fill="#123641" font-weight="800">CIN 2</text>
<text x="123.52" y="472" font-size="12.5" fill="#6B8084">｜高度病變</text>
<text x="66" y="500" font-size="13.5" fill="#345963">24 個月內：50% 消退（&lt;30 歲 60%）</text>
<text x="66" y="521" font-size="13.5" fill="#345963">32% 持續、18% 進展</text>
<text x="66" y="542" font-size="13.5" fill="#345963">（3,160 人觀察世代）</text>
<text x="66" y="563" font-size="13.5" fill="#00806B" font-weight="800">處置：建議治療；生育考量下可條件式觀察</text>
<line x1="90" y1="590" x2="90" y2="614" stroke="#123641" stroke-width="3" stroke-linecap="round"/>
<line x1="90" y1="614" x2="84.8077" y2="604.303" stroke="#123641" stroke-width="3" stroke-linecap="round"/>
<line x1="90" y1="614" x2="95.1923" y2="604.303" stroke="#123641" stroke-width="3" stroke-linecap="round"/>
<g filter="url(#sh)"><rect x="44" y="626" width="532" height="254" rx="18" fill="#FFFFFF"/></g>
<text x="66" y="660" font-size="18" fill="#123641" font-weight="800">CIN 3＝「原位癌」</text>
<text x="66" y="684" font-size="12.5" fill="#6B8084">還不是癌，但沒有「觀察」這個選項</text>
<text x="66" y="706" font-size="13.5" fill="#00806B" font-weight="800">處置：一律切除治療（錐切／LEEP）——指引原文：「觀察</text>
<text x="66" y="727" font-size="13.5" fill="#00806B" font-weight="800">是不可接受的」</text>
<text x="90" y="758" font-size="13.5" fill="#00806B" font-weight="800">治療得當（錐切／LEEP）：</text>
<text x="90" y="780" font-size="13.5" fill="#00806B" font-weight="800">30 年內變成侵襲癌 0.7%</text>
<circle cx="74" cy="762" r="4" fill="#00806B"/>
<text x="90" y="802" font-size="13.5" fill="#8F7418" font-weight="700">未治療：30 年 31.3%</text>
<text x="90" y="824" font-size="13.5" fill="#8F7418" font-weight="700">（24 個月病灶仍在者 50.3%）</text>
<text x="90" y="846" font-size="13.5" fill="#8F7418" font-weight="700">（紐西蘭未治療世代，1,063 人）</text>
<circle cx="74" cy="798" r="4" fill="#96790F"/>
<line x1="44" y1="900" x2="576" y2="900" stroke="#8F7418" stroke-width="3" stroke-dasharray="9 7"/>
<text x="310" y="926" font-size="13.5" fill="#8F7418" font-weight="800" text-anchor="middle">基底膜——越過這裡就是侵襲癌，</text>
<text x="310" y="946" font-size="13.5" fill="#8F7418" font-weight="800" text-anchor="middle">路從這裡開始不一樣</text>
<rect x="44" y="966" width="532" height="212" rx="18" fill="#A98722" opacity="0.1"/>
<rect x="44" y="966" width="532" height="212" rx="18" fill="none" stroke="#C9A83E" stroke-width="1.5"/>
<text x="66" y="1000" font-size="16.5" fill="#123641" font-weight="800">侵襲癌：另一條路</text>
<text x="66" y="1028" font-size="14" fill="#123641" font-weight="800">IA1（浸潤 ≤3 mm）</text>
<text x="66" y="1049" font-size="13.2" fill="#345963">錐切（切緣乾淨）可為根治治療</text>
<text x="66" y="1080" font-size="14" fill="#123641" font-weight="800">IA2（&gt;3–≤5 mm）</text>
<text x="66" y="1101" font-size="13.2" fill="#345963">錐切或單純子宮切除</text>
<text x="66" y="1132" font-size="14" fill="#123641" font-weight="800">≥IB</text>
<text x="66" y="1153" font-size="13.2" fill="#345963">進入分期與治療分流 →〈開刀還是放療〉</text>
<text x="44" y="1200" font-size="12.5" fill="#6B8084">腺體病變（AIS）另有規則：先診斷性錐切、子宮切除為首選（本圖無可靠</text>
<text x="44" y="1219" font-size="12.5" fill="#6B8084">消退率可標）。</text>
<text x="44" y="1252" font-size="12" fill="#6B8084">示意圖，依 Östör 1993、Tainio 2018、McCredie 2008、</text>
<text x="44" y="1272" font-size="12" fill="#6B8084">ASCCP 2019／ESGO 2023 重繪｜各階時間軸不同</text>
  </g>
</svg>
