<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">五種頭頸癌檢查的分工</title>
  <desc id="desc">CT 看骨頭與解剖，MRI 看深部軟組織與神經，PET-CT 看全身分期，內視鏡看黏膜表面，切片確認細胞與分型。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E7DFCF"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B2832" flood-opacity=".13"/></filter>
    <style>.z{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Microsoft JhengHei",serif}.t{fill:#123641;font-size:50px;font-weight:900}.sub{fill:#527078;font-size:23px}.ct{fill:#123641;font-size:29px;font-weight:900}.cb{fill:#48666D;font-size:20px}.q{fill:#9A791C;font-size:19px;font-weight:800}.sm{fill:#6B8084;font-size:17px}</style>
  </defs>
  <rect width="1440" height="900" rx="36" fill="url(#bg)"/>
  <g class="z">
    <text x="78" y="74" fill="#A98722" font-size="18" font-weight="900" letter-spacing="5">FIVE TOOLS · FIVE QUESTIONS</text>
    <text x="78" y="140" class="t r">五種檢查，不是在比賽</text>
    <text x="78" y="184" class="sub">先問「這項檢查要回答什麼」，再談它對治療決策有沒有幫助。</text>

    <g filter="url(#s)"><rect x="78" y="238" width="404" height="236" rx="27" fill="#FFF"/>
      <circle cx="132" cy="295" r="31" fill="#C9A83E"/><path d="M116 295h32M132 279v32" stroke="#123641" stroke-width="5" stroke-linecap="round"/>
      <text x="180" y="305" class="ct">CT</text><text x="112" y="357" class="q">問題：骨頭與整體解剖</text>
      <text x="112" y="399" class="cb">腫瘤大小、方向、骨皮質侵犯</text><text x="112" y="433" class="cb">手術範圍與放療靶區的重要依據</text>
    </g>
    <g filter="url(#s)"><rect x="518" y="238" width="404" height="236" rx="27" fill="#173F49"/>
      <circle cx="572" cy="295" r="31" fill="#C9A83E"/><path d="M557 286c14-15 28-8 30 5 2 15-12 25-30 14" fill="none" stroke="#123641" stroke-width="5"/>
      <text x="620" y="305" style="fill:#F7F1E4" class="ct">MRI</text><text x="552" y="357" style="fill:#F2D879" class="q">問題：深部軟組織與神經</text>
      <text x="552" y="399" style="fill:#D4E0DF" class="cb">舌根、鼻咽、顱底、顱內延伸</text><text x="552" y="433" style="fill:#D4E0DF" class="cb">軟組織對比是主要長處</text>
    </g>
    <g filter="url(#s)"><rect x="958" y="238" width="404" height="236" rx="27" fill="#FFF"/>
      <circle cx="1012" cy="295" r="31" fill="#C9A83E"/><circle cx="1012" cy="288" r="9" fill="#123641"/><path d="M997 318c3-18 27-18 30 0" fill="none" stroke="#123641" stroke-width="5"/>
      <text x="1060" y="305" class="ct">PET-CT</text><text x="992" y="357" class="q">問題：全身分期</text>
      <text x="992" y="399" class="cb">遠端轉移、第二個原發癌</text><text x="992" y="433" class="cb">代謝熱點需要結合其他資訊判讀</text>
    </g>

    <g filter="url(#s)"><rect x="188" y="520" width="500" height="240" rx="27" fill="#FFF"/>
      <circle cx="246" cy="580" r="31" fill="#D8C78F"/><path d="M232 569c25 0 30 21 16 33-11 10-21 4-18-7 3-10 18-7 18 3" fill="none" stroke="#123641" stroke-width="5" stroke-linecap="round"/>
      <text x="296" y="590" class="ct">內視鏡</text><text x="226" y="643" class="q">問題：黏膜表面長什麼樣子</text>
      <text x="226" y="687" class="cb">聲帶、下咽隱窩、鼻咽頂的直接觀察</text><text x="226" y="723" class="cb">表淺病灶不是影像的強項</text>
    </g>
    <g filter="url(#s)"><rect x="752" y="520" width="500" height="240" rx="27" fill="#123641"/>
      <circle cx="810" cy="580" r="31" fill="#C9A83E"/><path d="M795 595l14-30 10 5-14 30zM792 601h34" fill="none" stroke="#123641" stroke-width="5" stroke-linejoin="round"/>
      <text x="860" y="590" style="fill:#F7F1E4" class="ct">切片與病理</text><text x="790" y="643" style="fill:#F2D879" class="q">問題：這到底是什麼</text>
      <text x="790" y="687" style="fill:#D4E0DF" class="cb">細胞型態、分化程度、p16 等分型</text><text x="790" y="723" style="fill:#D4E0DF" class="cb">影像與內視鏡都不能取代病理</text>
    </g>
    <path d="M120 814H1320" stroke="#B9AA78" stroke-width="2"/>
    <text x="78" y="856" class="sm">依文章參考資料 [1][9] 整理｜資訊圖為原創重繪；實際檢查依腫瘤部位與臨床情況決定</text>
  </g>
</svg>
