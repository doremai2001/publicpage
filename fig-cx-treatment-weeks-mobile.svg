<rect x="475" y="573" width="76" height="42" rx="8" fill="none" stroke="#DBD3BF" stroke-width="1.5"/>
<circle cx="169" cy="594" r="6" fill="none" stroke="#8F7418" stroke-width="2"/>
<text x="128" y="652" font-size="13" fill="#6B8084">週六、日休息</text>
<rect x="60" y="666" width="14" height="14" rx="4" fill="#5C77C4" opacity="0.85"/>
<rect x="60" y="666" width="14" height="14" rx="4" fill="#5C77C4" opacity="0.85"/>
<text x="84" y="678" font-size="13.2" fill="#345963" font-weight="600">體外放療：45 Gy／25 次（IMRT/VMAT＋每日影像導引）</text>
<circle cx="67" cy="719" r="6.5" fill="#C9A83E" stroke="#8F7418" stroke-width="1.5"/>
<text x="84" y="724" font-size="13.2" fill="#345963" font-weight="600">每週化療：cisplatin 40 mg/m²，共 5–6 次（哪</text>
<text x="84" y="743" font-size="13.2" fill="#345963" font-weight="600">一天由團隊排）</text>
<rect x="60" y="758" width="14" height="14" rx="4" fill="#00806B"/>
<text x="84" y="770" font-size="13.2" fill="#345963" font-weight="600">近接治療：3–4 次，間隔 ≥6–8 小時；排在療程尾聲，或結束後</text>
<text x="84" y="789" font-size="13.2" fill="#345963" font-weight="600">1–2 週內</text>
<text x="44" y="834" font-size="16" fill="#123641" font-weight="800">終點線的三個錨點（各自的出處，不可混用）</text>
<g filter="url(#sh)"><rect x="44" y="848" width="532" height="64" rx="16" fill="#FFFFFF"/></g>
<text x="66" y="882" font-size="22" fill="#8F7418" font-weight="800">≤ 7 週</text>
<text x="66" y="906" font-size="13.5" fill="#345963">ESGO 2023 指引：含近接在內的總治療時間上限。</text>
<g filter="url(#sh)"><rect x="44" y="926" width="532" height="104" rx="16" fill="#FFFFFF"/></g>
<text x="66" y="960" font-size="22" fill="#8F7418" font-weight="800">≤ 50 天</text>
<text x="66" y="984" font-size="13.5" fill="#345963">EMBRACE-II 的目標上限</text>
<text x="66" y="1004" font-size="13.5" fill="#345963">——EMBRACE-I 世代有 21% 超過，要整個</text>
<text x="66" y="1024" font-size="13.5" fill="#345963">團隊去搶。</text>
<g filter="url(#sh)"><rect x="44" y="1044" width="532" height="84" rx="16" fill="#FFFFFF"/></g>
<text x="66" y="1078" font-size="22" fill="#8F7418" font-weight="800">56 天</text>
<text x="66" y="1102" font-size="13.5" fill="#345963">回溯資料：近接超過 56 天才完成者，骨盆復發 </text>
<text x="66" y="1122" font-size="13.5" fill="#345963">26% 對 9%（CCRT 年代、樣本小）。</text>
<rect x="44" y="1150" width="532" height="176" rx="18" fill="none" stroke="#C9A83E" stroke-width="2"/>
<text x="64" y="1184" font-size="14" fill="#123641" font-weight="700">第四、五週最難受，也最不能自行「請假」：</text>
<text x="64" y="1211" font-size="14" fill="#123641" font-weight="700">總治療時間拖長，直接損失局部控制</text>
<text x="64" y="1238" font-size="14" fill="#123641" font-weight="700">（「每天約 1%」出自純放療年代）。</text>
<text x="64" y="1265" font-size="14" fill="#345963">難受要回報，讓團隊處理症狀；要不要暫停，</text>
<text x="64" y="1292" font-size="14" fill="#345963">由團隊決定——你的工作是講，不是撐。</text>
<text x="44" y="1354" font-size="12" fill="#6B8084">示意圖，依 ESGO/ESTRO/ESP 2023 與 EMBRACE-II 重繪｜</text>
<text x="44" y="1374" font-size="12" fill="#6B8084">Girinsky 1993、Song 2013｜實際排程以你的團隊為準</text>
  </g>
</svg>
