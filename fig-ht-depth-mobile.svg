<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">能量到不到得了你的腫瘤</title>
  <desc id="d">圖中不標公分數：實際能到的深度取決於機型、體型與部位，要向治療團隊問具體數字。 紅外線／體表加熱；微波（淺部加熱裝置）；射頻電容式／相位陣列（深部）；聚焦超音波</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#123641" opacity=".14"/><line x1="0" y1="0" x2="0" y2="8" stroke="#123641" stroke-width="2.4" opacity=".85"/></pattern><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0B2832" flood-opacity=".12"/></filter><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="720" height="1080" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="56" y="78" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">PENETRATION</text>
<text x="56" y="140" font-size="30" fill="#123641" font-weight="800" class="r">能量到不到得了你的腫瘤</text>
<text x="56" y="182" font-size="18" fill="#527078">加熱是一個工程問題：能量要穿過皮膚、脂肪與肌肉才到得了深處。</text>
<text x="56" y="209" font-size="18" fill="#527078">機型能到的深度不同，這是第一個要問的問題。</text>
<rect x="56" y="292" width="150" height="300" rx="0" fill="#123641" opacity=".05" />
<line x1="56" y1="292" x2="56" y2="592" stroke="#123641" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 7" opacity=".28"/>
<text x="68" y="622" font-size="16" fill="#6B8084" font-weight="700">皮膚</text>
<rect x="208" y="292" width="150" height="300" rx="0" fill="#123641" opacity=".05" />
<line x1="208" y1="292" x2="208" y2="592" stroke="#123641" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 7" opacity=".28"/>
<text x="220" y="622" font-size="16" fill="#6B8084" font-weight="700">皮下脂肪</text>
<rect x="360" y="292" width="150" height="300" rx="0" fill="#123641" opacity=".05" />
<line x1="360" y1="292" x2="360" y2="592" stroke="#123641" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 7" opacity=".28"/>
<text x="372" y="622" font-size="16" fill="#6B8084" font-weight="700">肌肉</text>
<rect x="512" y="292" width="150" height="300" rx="0" fill="#123641" opacity=".05" />
<line x1="512" y1="292" x2="512" y2="592" stroke="#123641" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 7" opacity=".28"/>
<text x="524" y="622" font-size="16" fill="#6B8084" font-weight="700">深部器官</text>
<rect x="56" y="292" width="608" height="300" rx="16" fill="none" stroke="#123641" stroke-width="1.6" />
<rect x="60" y="318" width="79.04" height="30" rx="8" fill="#5C77C4" opacity=".88" />
<text x="72" y="339" font-size="15" fill="#FFFFFF" font-weight="700">紅外線／體表加熱</text>
<rect x="60" y="382" width="182.4" height="30" rx="8" fill="#5C77C4" opacity=".88" />
<text x="72" y="403" font-size="15" fill="#FFFFFF" font-weight="700">微波（淺部加熱裝置）</text>
<rect x="60" y="446" width="559.36" height="30" rx="8" fill="#A98722" opacity=".88" />
<text x="72" y="467" font-size="15" fill="#FFFFFF" font-weight="700">射頻電容式／相位陣列（深部）</text>
<rect x="60" y="510" width="376.96" height="30" rx="8" fill="#00806B" opacity=".88" />
<text x="72" y="531" font-size="15" fill="#FFFFFF" font-weight="700">聚焦超音波</text>
<rect x="432.96" y="574" width="182.4" height="30" rx="8" fill="#00806B" opacity=".22" stroke="#00806B" stroke-width="2" />
<text x="448.96" y="595" font-size="16" fill="#00806B" font-weight="800">◆</text>
<text x="470.96" y="595" font-size="14" fill="#00604F" font-weight="700">體內置入式</text>
<text x="56" y="664" font-size="17" fill="#527078">體內置入式：探針或磁性奈米粒子直接送到腫瘤，不必從體表穿透</text>
<rect x="56" y="700" width="608" height="2" rx="1" fill="#A98722" opacity=".5" />
<text x="56" y="734" font-size="16" fill="#345963" font-weight="700">圖中不標公分數：實際能到的深度取決於機型、體型與部位，要向治</text>
<text x="56" y="761" font-size="16" fill="#345963" font-weight="700">療團隊問具體數字。</text>
<text x="56" y="1044" font-size="14" fill="#6B8084">示意圖，依 Kok 等 2020 綜述的技術分類重繪。</text>
  </g>
</svg>
