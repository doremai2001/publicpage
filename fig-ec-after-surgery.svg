<line x1="1005.46" y1="639.69" x2="1001.38" y2="630.56" stroke="#5C77C4" stroke-width="2.5" stroke-linecap="round"/>
<text x="996.08" y="545.85" font-size="13" fill="#5C77C4" font-weight="800" text-anchor="end">食物走管狀胃</text>
<text x="996.08" y="563.4" font-size="12" fill="#5C77C4" font-weight="600" text-anchor="end">靠重力，容易逆流</text>
<text x="967.92" y="724.15" font-size="12" fill="#6B8084" font-weight="600" text-anchor="middle">原本放胃的位置空了</text>
<g filter="url(#sh)"><rect x="84" y="846" width="412" height="208.76" rx="18" fill="#FFFFFF"/></g>
<rect x="106" y="868" width="73.98" height="23.62" rx="11.81" fill="#96790F"/>
<text x="142.99" y="884.67" font-size="13.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">少量多餐</text>
<circle cx="110" cy="912.5" r="3" fill="#96790F"/>
<text x="120" y="917.05" font-size="13" fill="#345963">胃變成一條管子、容量變小，一次吃不了原本的量。</text>
<circle cx="110" cy="938.96" r="3" fill="#96790F"/>
<text x="120" y="943.51" font-size="13" fill="#345963">瑞典全國世代（n=226）：術後 6 個月 63.7% 體重掉 &gt;10%、</text>
<text x="120" y="961.97" font-size="13" fill="#345963">20.4% 掉 &gt;20%；體重可持續掉到 3 年。</text>
<circle cx="110" cy="983.88" r="3" fill="#96790F"/>
<text x="120" y="988.43" font-size="13" fill="#345963">延遲性胃排空：早期 15.9%、晚期 9.4%（125 篇統合）；幽</text>
<text x="120" y="1006.89" font-size="13" fill="#345963">門處置各院不同、證據不站邊。</text>
<g filter="url(#sh)"><rect x="514" y="846" width="412" height="208.76" rx="18" fill="#FFFFFF"/></g>
<rect x="536" y="868" width="87.75" height="23.62" rx="11.81" fill="#5C77C4"/>
<text x="579.88" y="884.67" font-size="13.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">傾倒症候群</text>
<circle cx="540" cy="912.5" r="3" fill="#5C77C4"/>
<text x="550" y="917.05" font-size="13" fill="#345963">食物太快進小腸：早期（30 分內）心悸、冒汗、想躺下；晚</text>
<text x="550" y="935.51" font-size="13" fill="#345963">期（1–3 小時）低血糖。</text>
<circle cx="540" cy="957.42" r="3" fill="#5C77C4"/>
<text x="550" y="961.97" font-size="13" fill="#345963">多常見看定義：顯著症狀 11%（瑞典 n=384，1 年）；問卷式</text>
<text x="550" y="980.43" font-size="13" fill="#345963">問到 67–78%。</text>
<circle cx="540" cy="1002.34" r="3" fill="#5C77C4"/>
<text x="550" y="1006.89" font-size="13" fill="#345963">國際共識：飲食調整是第一步（少量多餐、固液分開、少單純</text>
<text x="550" y="1025.35" font-size="13" fill="#345963">糖）；晚期傾倒可用 acarbose。</text>
<g filter="url(#sh)"><rect x="944" y="846" width="412" height="208.76" rx="18" fill="#FFFFFF"/></g>
<rect x="966" y="868" width="87.75" height="23.62" rx="11.81" fill="#B04A4A"/>
<text x="1009.88" y="884.67" font-size="13.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">逆流與夜咳</text>
<circle cx="970" cy="912.5" r="3" fill="#B04A4A"/>
<text x="980" y="917.05" font-size="13" fill="#345963">下食道括約肌沒了、胃在胸腔——躺平就容易回流。</text>
<circle cx="970" cy="938.96" r="3" fill="#B04A4A"/>
<text x="980" y="943.51" font-size="13" fill="#345963">瑞典世代（n=241，1 年）：27% 嚴重逆流；有逆流者睡眠障</text>
<text x="980" y="961.97" font-size="13" fill="#345963">礙 OR 2.3。殘存食道黏膜損傷 5 年 55%（德國 n=50，常規</text>
<text x="980" y="980.43" font-size="13" fill="#345963">PPI 下）。</text>
<circle cx="970" cy="1002.34" r="3" fill="#B04A4A"/>
<text x="980" y="1006.89" font-size="13" fill="#345963">墊高上半身、餐後不平躺是門診慣例——沒有食道切除術後的</text>
<text x="980" y="1025.35" font-size="13" fill="#345963">對照研究，所以不標公分數。</text>
<text x="84" y="1080.76" font-size="14" fill="#6B8084" font-weight="600">晚期傾倒的低血糖可能昏厥——有這種症狀要回診，不要自行斷食。體重掉超過一成、吞嚥又變差，先排除狹窄與復發，不要只當「吃太少」。</text>
<text x="84" y="1127.06" font-size="16" fill="#6B8084">示意圖，依 Martin 2007／2009（瑞典體重世代）、Lin 2025（傾倒統合）、Lagergren 2026（瑞典傾倒世代）、Scarpellini 2020（傾倒國際共識）、Lagergren 2021（瑞典逆</text>
<text x="84" y="1151.06" font-size="16" fill="#6B8084">流世代）、Fuchs 2018（Ivor Lewis 術後內視鏡世代 n=50）與 Sivakumar 2025（延遲排空統合 125 篇）重繪｜術式、吻合位置與幽門處置依外科醫師與各院慣例而異，數字來</text>
<text x="84" y="1175.06" font-size="16" fill="#6B8084">自不同世代、不可直接互比</text>
  </g>
</svg>
