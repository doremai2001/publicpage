<text x="1063.65" y="419.34" font-size="13" fill="#B04A4A" font-weight="800">吻合口</text>
<text x="1063.65" y="436.89" font-size="12" fill="#B04A4A" font-weight="600">胸內（Ivor Lewis）或頸部（McKeown）</text>
<text x="1058.02" y="508.31" font-size="13" fill="#7A6E58" font-weight="700">胃被拉進胸腔，做成一條管子</text>
<text x="1058.02" y="525.86" font-size="12" fill="#7A6E58" font-weight="600">沒有括約肌、容量變小</text>
<circle cx="1110.57" cy="658.46" r="8.45" fill="#B9AF98"/>
<text x="1123.71" y="665.22" font-size="13" fill="#7A6E58" font-weight="700">幽門（靠近橫膈）</text>
<path d="M1116.2 664.09 C 1155.62 677.23, 1155.62 733.54, 1118.08 742.92" fill="none" stroke="#DED6C4" stroke-width="8.45" stroke-linecap="round" stroke-linejoin="round"/>
