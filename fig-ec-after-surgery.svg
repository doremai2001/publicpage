<text x="866.13" y="310.22" font-size="14.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">術後（食道切除＋胃管重建）</text>
<path d="M1014.85 339.38 L1071.15 339.38 L1071.15 386.31 C 1136.85 395.69, 1193.15 419.15, 1193.15 470.77 L1193.15 789.85 Q 1193.15 808.62 1174.38 808.62 L911.62 808.62 Q 892.85 808.62 892.85 789.85 L892.85 470.77 C 892.85 419.15, 949.15 395.69, 1014.85 386.31 Z" fill="#F3EDE0" stroke="#C9C0AC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
