<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1229" viewBox="0 0 1440 1229" role="img" aria-labelledby="t d">
  <title id="t">術前、術後：胃被拉到哪裡，食物走哪裡</title>
  <desc id="d">示意圖：食道切除術前與術後的解剖。左格術前：食道由頸部經胸腔穿過橫膈接到腹腔內完整的胃袋，下食道括約肌在橫膈處，幽門在胃的右下方接十二指腸，迷走神經沿食道走，食物往下。中下段食道畫出腫瘤位置。右格術後：中下段食道連同腫瘤被切除，只剩頸部與上胸段一小段食道；胃被做成一條管子拉進胸腔，在胸內（Ivor Lewis）或頸部（McKeown）與殘存食道吻合；沒有括約肌、容量變小；幽門被拉到靠近橫膈；迷走神經切斷；食物靠重力走管狀胃，容易逆流；原本放胃的位置空了。下方三格：少量多餐——瑞典世代（n=226）術後 6 個月 63.7% 體重掉超過 10%、20.4% 掉超過 20%，體重可持續掉到 3 年；延遲性胃排空早期 15.9%、晚期 9.4%，幽門處置證據不站邊。傾倒症候群——早期 30 分內心悸冒汗、晚期 1 到 3 小時低血糖；顯著症狀 11%（瑞典 n=384，1 年），問卷式 67 到 78%；飲食調整第一步，晚期可用 acarbose。逆流與夜咳——瑞典世代（n=241，1 年）27% 嚴重逆流，睡眠障礙 OR 2.3；殘存食道黏膜損傷 5 年 55%（德國 n=50）；墊高與餐後不平躺是門診慣例，沒有對照研究、不標公分數。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="1229" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="86" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">ANATOMY BEFORE AND AFTER OESOPHAGECTOMY</text>
<text x="84" y="148" font-size="44" fill="#123641" font-weight="800" class="r">術前、術後：胃被拉到哪裡，食物走哪裡</text>
<text x="84" y="194" font-size="21" fill="#527078">開刀拿掉一段食道與周圍淋巴結，胃被做成一條管子拉進胸腔接上去。少量多餐、傾倒、逆流三件事，都從這張圖來。</text>
<text x="84" y="224" font-size="21" fill="#527078">示意圖，術式與吻合位置依你的外科醫師而異。</text>
