<line x1="1060.83" y1="412.58" x2="1049.57" y2="423.85" stroke="#96790F" stroke-width="1.8" stroke-linecap="round"/>
<text x="1005.46" y="386.31" font-size="12" fill="#96790F" font-weight="700" text-anchor="end">迷走神經切斷</text>
<line x1="1005.46" y1="442.62" x2="1005.46" y2="639.69" stroke="#5C77C4" stroke-width="2.5" stroke-linecap="round"/>
