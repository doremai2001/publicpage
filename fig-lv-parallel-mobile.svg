<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1516" viewBox="0 0 620 1516" role="img" aria-labelledby="t d">
  <title id="t">肝是「平均劑量」器官：省下低劑量浴，就是省肝功能</title>
  <desc id="d">示意圖（非實際劑量分布）：決定放射性肝損傷的是平均肝劑量與被照到的體積（QUANTEC），規則是保留至少 700 立方公分正常肝在 15 Gy 以下（3 至 5 次分次）。左格：光子 SBRT 把高劑量集中在腫瘤，但每道光束穿過腫瘤前後都在正常肝留下低劑量浴，並帶著出射劑量穿出體外；右格：質子在布拉格峰把劑量放完就停，幾乎無出射劑量，更多正常肝幾乎沒被照到。臨床對照：隨機試驗（質子對 RFA）治療後 Child-Pugh 分數上升 7.5% 對 19.6%；回溯比較（質子對光子）非古典放射性肝損傷較少（OR 0.26，選擇偏差不可排除）。質子不是零代價；質子對光子的隨機試驗 NRG-GI003 尚未發表。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="620" height="1516" rx="30" fill="url(#bg)"/>
  <g class="z">
<text x="44" y="62" font-size="14" fill="#A98722" font-weight="800" letter-spacing="3.5px">PARALLEL ORGAN</text>
<text x="44" y="112" font-size="30" fill="#123641" font-weight="800" class="r">肝是「平均劑量」器官：</text>
<text x="44" y="152" font-size="30" fill="#123641" font-weight="800" class="r">省下低劑量浴，</text>
<text x="44" y="192" font-size="30" fill="#123641" font-weight="800" class="r">就是省肝功能</text>
<text x="44" y="234" font-size="14.5" fill="#527078">決定肝損傷的是平均肝劑量與被照到的體積，</text>
<text x="44" y="256" font-size="14.5" fill="#527078">不是最高點（QUANTEC）。質子幾乎無出射劑量，</text>
<text x="44" y="278" font-size="14.5" fill="#527078">省下的正是灑在正常肝上的低劑量浴。</text>
<g filter="url(#sh)"><rect x="44" y="308" width="532" height="358" rx="18" fill="#FFFFFF"/></g>
<rect x="64" y="328" width="9" height="22" rx="4" fill="#5C77C4"/>
<text x="84" y="345" font-size="16" fill="#123641" font-weight="800">光子 SBRT——健保給付，已經很好</text>
<g transform="translate(58,366) scale(0.93)">
<path d="M 18,142 C 26,58 132,14 252,22 C 372,30 462,58 494,116 C 510,152 486,196 428,218 C 338,250 218,252 138,236 C 68,222 10,206 18,142 Z" fill="#E9E2CF" stroke="#9A9282" stroke-width="2.5"/>
<polygon points="65.6,93.9 528.5,175.5 534.4,142.1 71.5,60.5" fill="#5C77C4" opacity="0.16"/>
<polygon points="547.2,161.6 529.9,167.7 533.0,149.9" fill="#5C77C4" opacity="0.42"/>
<polygon points="118.0,242.7 499.0,22.7 482.0,-6.7 101.0,213.3" fill="#5C77C4" opacity="0.16"/>
<polygon points="504.4,0.0 495.0,15.8 486.0,0.2" fill="#5C77C4" opacity="0.42"/>
<polygon points="154.9,10.2 422.4,251.1 445.1,225.8 177.6,-15.1" fill="#5C77C4" opacity="0.16"/>
<polygon points="445.7,249.1 427.7,245.1 439.8,231.8" fill="#5C77C4" opacity="0.42"/>
<text x="95" y="208" font-size="14" fill="#5C77C4" font-weight="700">低劑量浴</text>
<text x="455" y="22" font-size="14" fill="#5C77C4" font-weight="700">出射劑量</text>
<circle cx="300" cy="118" r="25" fill="#A98722"/>
<text x="300" y="166" font-size="14" fill="#8F7418" font-weight="800" text-anchor="middle">腫瘤</text>
</g>
<text x="64" y="614" font-size="13.8" fill="#345963" font-weight="600">高劑量集中在腫瘤；每道光束來回掃過正常肝，</text>
<text x="64" y="635" font-size="13.8" fill="#345963" font-weight="600">留下低劑量浴，並帶著出射劑量穿出體外。</text>
<g filter="url(#sh)"><rect x="44" y="684" width="532" height="358" rx="18" fill="#FFFFFF"/></g>
<rect x="64" y="704" width="9" height="22" rx="4" fill="#00806B"/>
<text x="84" y="721" font-size="16" fill="#123641" font-weight="800">質子——同一個治療，工程升級</text>
<g transform="translate(58,742) scale(0.93)">
<path d="M 18,142 C 26,58 132,14 252,22 C 372,30 462,58 494,116 C 510,152 486,196 428,218 C 338,250 218,252 138,236 C 68,222 10,206 18,142 Z" fill="#E9E2CF" stroke="#9A9282" stroke-width="2.5"/>
<polygon points="3.0,72.3 296.5,134.6 303.5,101.4 10.1,39.0" fill="#00806B" opacity="0.2"/>
<polygon points="271.0,129.2 296.5,134.6 303.5,101.4 278.1,96.0" fill="#00806B" opacity="0.56"/>
<polygon points="69.6,259.8 308.0,133.0 292.0,103.0 53.6,229.7" fill="#00806B" opacity="0.2"/>
<polygon points="285.0,145.2 308.0,133.0 292.0,103.0 269.1,115.2" fill="#00806B" opacity="0.56"/>
<text x="338" y="62" font-size="14" fill="#00806B" font-weight="700">布拉格峰</text>
<line x1="330" y1="70" x2="312" y2="96" stroke="#6B8084" stroke-width="1.5"/>
<text x="60" y="208" font-size="14" fill="#00806B" font-weight="700">幾乎沒被照到的正常肝</text>
<circle cx="300" cy="118" r="25" fill="#A98722"/>
<text x="300" y="166" font-size="14" fill="#8F7418" font-weight="800" text-anchor="middle">腫瘤</text>
</g>
<text x="64" y="990" font-size="13.8" fill="#345963" font-weight="600">劑量在布拉格峰放完就停：幾乎無出射劑量，</text>
<text x="64" y="1011" font-size="13.8" fill="#345963" font-weight="600">更多正常肝幾乎沒被照到。</text>
<g filter="url(#sh)"><rect x="44" y="1060" width="532" height="98" rx="18" fill="#FFFFFF"/></g>
<text x="64" y="1088" font-size="14.5" fill="#8F7418" font-weight="800">肝的規則（QUANTEC）</text>
<text x="64" y="1112" font-size="13" fill="#345963">決定肝損傷的是「平均肝劑量 × 體積」；至少</text>
<text x="64" y="1133" font-size="13" fill="#345963">700 cc 正常肝壓在 15 Gy 以下（3–5 次分次）。</text>
<g filter="url(#sh)"><rect x="44" y="1172" width="532" height="98" rx="18" fill="#FFFFFF"/></g>
<text x="64" y="1200" font-size="14.5" fill="#8F7418" font-weight="800">隨機試驗（質子 對 RFA・復發性小肝癌）</text>
<text x="64" y="1224" font-size="13" fill="#345963">治療後 Child-Pugh 分數上升 7.5% 對 19.6%</text>
<text x="64" y="1245" font-size="13" fill="#345963">（AASLD 轉述）——證明的是不劣於，不是優於。</text>
<g filter="url(#sh)"><rect x="44" y="1284" width="532" height="98" rx="18" fill="#FFFFFF"/></g>
<text x="64" y="1312" font-size="14.5" fill="#8F7418" font-weight="800">回溯比較（質子 對 光子・MGH）</text>
<text x="64" y="1336" font-size="13" fill="#345963">非古典放射性肝損傷較少（OR 0.26）——</text>
<text x="64" y="1357" font-size="13" fill="#345963">回溯性，選擇偏差不可排除。</text>
<text x="44" y="1404" font-size="12.8" fill="#6B8084" font-weight="600">質子不是零代價（日本前瞻登錄 ≥G3 晚期不良事件 4.7%）；</text>
<text x="44" y="1424" font-size="12.8" fill="#6B8084" font-weight="600">質子對光子的隨機試驗 NRG-GI003 收案完成、尚未發表。</text>
<text x="44" y="1454" font-size="12" fill="#6B8084">示意圖（非實際劑量分布），依 Pan 2010（QUANTEC）、</text>
<text x="44" y="1474" font-size="12" fill="#6B8084">Newhauser &amp; Zhang 2015、Kim TH 2021、AASLD 2023、</text>
<text x="44" y="1494" font-size="12" fill="#6B8084">Sanford 2019 重繪</text>
  </g>
</svg>
