<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Many specialties combine their answers into one treatment plan</title><desc id="desc">The patient and treatment goals sit at the centre of surgery, radiation oncology, medical oncology, imaging, pathology, dental and nutrition care, and case management.</desc>
  <defs><radialGradient id="b" cx="50%" cy="35%" r="80%"><stop stop-color="#164652"/><stop offset="1" stop-color="#082730"/></radialGradient><filter id="s" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#021114" flood-opacity=".35"/></filter><style>.sans{font-family:Arial,"Noto Sans",sans-serif}.serif{font-family:Georgia,"Noto Serif",serif}.title{fill:#F4EFE3;font-size:47px;font-weight:800}.sub{fill:#ABC1C3;font-size:22px}.node{fill:#F4EFE3;font-size:21px;font-weight:800}.centre{fill:#0B2A34;font-size:26px;font-weight:900}.stat{fill:#F4EFE3;font-size:50px;font-weight:900}.body{fill:#D4E0DF;font-size:19px}.small{fill:#91ADB1;font-size:16px}</style></defs>
  <rect width="1440" height="900" rx="36" fill="url(#b)"/>
  <g class="sans">
    <text x="80" y="82" fill="#C9A83E" font-size="18" font-weight="800" letter-spacing="5">MULTIDISCIPLINARY CARE</text>
    <text x="80" y="146" class="title serif">Not another delay: one plan from many specialties</text>
    <text x="80" y="190" class="sub">Site, depth, nodes, distant spread, fitness and the patient’s goals all shape the final recommendation.</text>
    <g opacity=".65" stroke="#5E7B80" stroke-width="3"><line x1="700" y1="490" x2="340" y2="310"/><line x1="700" y1="490" x2="700" y2="280"/><line x1="700" y1="490" x2="1065" y2="310"/><line x1="700" y1="490" x2="335" y2="665"/><line x1="700" y1="490" x2="700" y2="720"/><line x1="700" y1="490" x2="1065" y2="665"/></g>
    <g filter="url(#s)"><circle cx="700" cy="490" r="150" fill="#F2ECDE" stroke="#C9A83E" stroke-width="6"/><circle cx="700" cy="435" r="34" fill="#C9A83E"/><path d="M635 530q65-58 130 0v33H635z" fill="#C9A83E"/><text x="700" y="590" text-anchor="middle" class="centre">Patient &amp; goals</text></g>
    <g filter="url(#s)">
      <circle cx="340" cy="310" r="93" fill="#174753" stroke="#C9A83E" stroke-width="3"/><path d="M310 298h60m-50-16h40m-40 33h40" stroke="#F2D879" stroke-width="5" stroke-linecap="round"/><text x="340" y="351" text-anchor="middle" class="node">Surgery / ENT</text>
      <circle cx="700" cy="280" r="93" fill="#174753" stroke="#C9A83E" stroke-width="3"/><circle cx="700" cy="267" r="30" fill="none" stroke="#F2D879" stroke-width="5"/><path d="M700 227v80m-40-40h80" stroke="#F2D879" stroke-width="4" opacity=".75"/><text x="700" y="321" text-anchor="middle" class="node">Radiation oncology</text>
      <circle cx="1065" cy="310" r="93" fill="#174753" stroke="#C9A83E" stroke-width="3"/><path d="M1038 272h54v48h-54zm12 12h30m-30 12h24" fill="none" stroke="#F2D879" stroke-width="5"/><text x="1065" y="351" text-anchor="middle" class="node">Medical oncology</text>
      <circle cx="335" cy="665" r="93" fill="#174753" stroke="#C9A83E" stroke-width="3"/><rect x="302" y="622" width="66" height="52" rx="7" fill="none" stroke="#F2D879" stroke-width="5"/><circle cx="335" cy="648" r="13" fill="none" stroke="#F2D879" stroke-width="4"/><text x="335" y="709" text-anchor="middle" class="node">Imaging</text>
      <circle cx="700" cy="720" r="93" fill="#174753" stroke="#C9A83E" stroke-width="3"/><circle cx="687" cy="692" r="18" fill="none" stroke="#F2D879" stroke-width="5"/><circle cx="716" cy="709" r="20" fill="none" stroke="#F2D879" stroke-width="5"/><path d="M675 726h55" stroke="#F2D879" stroke-width="5" stroke-linecap="round"/><text x="700" y="765" text-anchor="middle" class="node">Pathology</text>
      <circle cx="1065" cy="665" r="93" fill="#174753" stroke="#C9A83E" stroke-width="3"/><path d="M1035 637q30-24 60 0m-55 13h50m-42 12h34" fill="none" stroke="#F2D879" stroke-width="5" stroke-linecap="round"/><text x="1065" y="697" text-anchor="middle" class="node">Dental · nutrition</text><text x="1065" y="726" text-anchor="middle" fill="#C9D7D7" font-size="17" font-weight="700">Case management</text>
