    <g filter="url(#s)"><rect x="1180" y="242" width="190" height="448" rx="28" fill="#0D303A" stroke="#496970" stroke-width="2"/><text x="1275" y="320" text-anchor="middle" class="stat">~27%</text><text x="1275" y="362" text-anchor="middle" class="body">had a change in</text><text x="1275" y="395" text-anchor="middle" class="body">diagnosis, stage</text><text x="1275" y="428" text-anchor="middle" class="body">or treatment plan</text><line x1="1215" y1="470" x2="1335" y2="470" stroke="#C9A83E" stroke-width="3"/><text x="1275" y="516" text-anchor="middle" fill="#F2D879" font-size="18" font-weight="800">120-case series</text><text x="1275" y="553" text-anchor="middle" fill="#AFC4C6" font-size="16">Meetings often</text><text x="1275" y="580" text-anchor="middle" fill="#AFC4C6" font-size="16">change decisions;</text><text x="1275" y="607" text-anchor="middle" fill="#AFC4C6" font-size="16">not every plan changes.</text></g>
    <text x="80" y="852" class="small">Team roles vary by centre · Source: article reference [5] Wheless et al., 2010 · Original infographic</text>
