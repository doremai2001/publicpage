<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="t d">
  <title id="t">Where each technology sits on the evidence ladder</title>
  <desc id="d">Evidence ladder from bottom to top: cell and animal studies, phase I safety, single-arm series, randomised trials, routine care and reimbursement. FLASH sits at phase I (about 30 patients worldwide); carbon-ion therapy at single-arm series (its only randomised readout is a safety trial versus protons, no difference); BNCT sits between single-arm and randomised, with a Japanese approval and reimbursement for one head-and-neck indication; protons sit at randomised trials with mixed readouts and a paediatric consensus. A greyed placeholder marks cell therapy, to be covered later.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="900" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="86" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">EVIDENCE LADDER</text>
<text x="84" y="148" font-size="44" fill="#123641" font-weight="800" class="r">How far has each technology climbed?</text>
<text x="84" y="194" font-size="21" fill="#527078">Position = highest completed evidence, not a ranking of merit.</text>
<text x="84" y="224" font-size="21" fill="#527078">Every new technology still has to climb rung by rung.</text>
<line x1="360" y1="270" x2="360" y2="810" stroke="#123641" stroke-width="8" stroke-linecap="round"/>
<line x1="520" y1="270" x2="520" y2="810" stroke="#123641" stroke-width="8" stroke-linecap="round"/>
<line x1="360" y1="300" x2="520" y2="300" stroke="#123641" stroke-width="6"/>
<text x="338" y="284" font-size="15" fill="#A98722" font-weight="800" text-anchor="end">Rung 5</text>
<text x="338" y="310" font-size="22" fill="#123641" font-weight="800" text-anchor="end">Routine care &amp; coverage</text>
<line x1="360" y1="412" x2="520" y2="412" stroke="#123641" stroke-width="6"/>
<text x="338" y="396" font-size="15" fill="#A98722" font-weight="800" text-anchor="end">Rung 4</text>
<text x="338" y="422" font-size="22" fill="#123641" font-weight="800" text-anchor="end">Randomised trials</text>
<line x1="360" y1="524" x2="520" y2="524" stroke="#123641" stroke-width="6"/>
<text x="338" y="508" font-size="15" fill="#A98722" font-weight="800" text-anchor="end">Rung 3</text>
<text x="338" y="534" font-size="22" fill="#123641" font-weight="800" text-anchor="end">Single-arm series</text>
<line x1="360" y1="636" x2="520" y2="636" stroke="#123641" stroke-width="6"/>
<text x="338" y="620" font-size="15" fill="#A98722" font-weight="800" text-anchor="end">Rung 2</text>
<text x="338" y="646" font-size="22" fill="#123641" font-weight="800" text-anchor="end">Phase I (safety)</text>
<line x1="360" y1="748" x2="520" y2="748" stroke="#123641" stroke-width="6"/>
<text x="338" y="732" font-size="15" fill="#A98722" font-weight="800" text-anchor="end">Rung 1</text>
<text x="338" y="758" font-size="22" fill="#123641" font-weight="800" text-anchor="end">Cell &amp; animal studies</text>
<line x1="524" y1="412" x2="564" y2="412" stroke="#6B8084" stroke-width="1.5"/>
<rect x="564" y="388" width="102" height="44" rx="20" fill="#00806B"/>
<text x="615.0" y="417.2" font-size="20" fill="#FFFFFF" font-weight="800" text-anchor="middle">Proton</text>
<text x="688.0" y="406" font-size="19" fill="#345963" font-weight="600">Several randomised readouts, mixed (non-inferiority, no-difference);</text>
<text x="688.0" y="432" font-size="17" fill="#6B8084">consensus supports paediatric use.</text>
<line x1="524" y1="468" x2="564" y2="468" stroke="#6B8084" stroke-width="1.5" stroke-dasharray="5 4"/>
<path d="M440.0,457.0 L442.9,464.0 L450.5,464.6 L444.7,469.5 L446.5,476.9 L440.0,472.9 L433.5,476.9 L435.3,469.5 L429.5,464.6 L437.1,464.0 Z" fill="#C9A83E" stroke="#8F7418" stroke-width="1"/>
<rect x="564" y="444" width="80" height="44" rx="20" fill="#123641"/>
<text x="604.0" y="473.2" font-size="20" fill="#FFFFFF" font-weight="800" text-anchor="middle">BNCT</text>
<text x="666.0" y="462.0" font-size="19" fill="#345963" font-weight="600">Between two rungs: approved and reimbursed in Japan for one</text>
<text x="666.0" y="488.0" font-size="17" fill="#6B8084">head &amp; neck indication (2020); everything else still in trials.</text>
<line x1="524" y1="524" x2="564" y2="524" stroke="#6B8084" stroke-width="1.5"/>
<rect x="564" y="500" width="146" height="44" rx="20" fill="#96790F"/>
<text x="637.0" y="529.2" font-size="20" fill="#FFFFFF" font-weight="800" text-anchor="middle">Carbon ion</text>
<text x="732.0" y="518" font-size="19" fill="#345963" font-weight="600">Large single-arm series (&gt;50,000 patients worldwide)※</text>
<text x="732.0" y="544" font-size="17" fill="#6B8084">※ Its only randomised readout: a phase II safety trial</text>
<text x="732.0" y="570" font-size="17" fill="#6B8084">vs protons (n=82) — no difference.</text>
<line x1="524" y1="636" x2="564" y2="636" stroke="#6B8084" stroke-width="1.5"/>
<rect x="564" y="612" width="91" height="44" rx="20" fill="#5C77C4"/>
<text x="609.5" y="641.2" font-size="20" fill="#FFFFFF" font-weight="800" text-anchor="middle">FLASH</text>
<text x="677.0" y="630" font-size="19" fill="#345963" font-weight="600">Phase I feasibility/safety; about 30 patients worldwide.</text>
<text x="677.0" y="656" font-size="17" fill="#6B8084">No efficacy comparison of any kind yet.</text>
<line x1="524" y1="748" x2="564" y2="748" stroke="#6B8084" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="564" y="724" width="333" height="44" rx="20" fill="none" stroke="#9A9282" stroke-width="2" stroke-dasharray="7 5"/>
<text x="730.5" y="753.2" font-size="20" fill="#9A9282" font-weight="800" text-anchor="middle">Cell therapy (coming later)</text>
<text x="919.0" y="742" font-size="19" fill="#345963" font-weight="600">Placeholder: this topic will grow.</text>
<text x="84" y="872" font-size="16" fill="#6B8084">Positions per published trials and regulatory status (as of 2026-08). Schematic.</text>
  </g>
</svg>
