<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">正子乾淨不等於頸部零風險</title><desc id="desc">臨床無淋巴結轉移的頭頸癌病人中，PET 以病人為單位敏感度約 58%，以頸部分區為單位約 53%；它適合全身分期，但不能單獨決定是否省略頸部治療。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F5F0E5"/><stop offset="1" stop-color="#E8E0D0"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B2832" flood-opacity=".14"/></filter><style>.z{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Microsoft JhengHei",serif}.t{fill:#123641;font-size:52px;font-weight:900}.sub{fill:#527078;font-size:23px}.big{font-size:68px;font-weight:900}.ct{font-size:29px;font-weight:900}.body{font-size:21px}.sm{fill:#6B8084;font-size:17px}</style></defs>
  <rect width="1440" height="920" rx="36" fill="url(#bg)"/>
  <g class="z"><text x="78" y="73" fill="#A98722" font-size="18" font-weight="900" letter-spacing="5">PET-CT · READ THE NEGATIVE CORRECTLY</text><text x="78" y="143" class="t r">正子乾淨，不等於頸部零風險</text><text x="78" y="188" class="sub">微小或代謝不明顯的淋巴結轉移可能不會亮；陰性結果不能單獨推翻原本的頸部處理計畫。</text>
    <g filter="url(#s)"><rect x="78" y="242" width="410" height="304" rx="28" fill="#123641"/><circle cx="283" cy="362" r="82" fill="#173F49" stroke="#C9A83E" stroke-width="12"/><text x="283" y="384" text-anchor="middle" fill="#F7F1E4" class="big">58%</text><text x="118" y="479" fill="#F2D879" font-size="22" font-weight="900">以病人為單位的敏感度</text><text x="118" y="516" fill="#D4E0DF" class="body">約四成隱藏轉移可能未被偵測</text></g>
    <g filter="url(#s)"><rect x="515" y="242" width="410" height="304" rx="28" fill="#FFF"/><circle cx="720" cy="362" r="82" fill="#F4EFE3" stroke="#C9A83E" stroke-width="12" stroke-dasharray="274 242" transform="rotate(-90 720 362)"/><text x="720" y="384" text-anchor="middle" fill="#123641" class="big">53%</text><text x="555" y="479" fill="#99791B" font-size="22" font-weight="900">以頸部分區為單位的敏感度</text><text x="555" y="516" fill="#48666D" class="body">越小的病灶，越容易低於解析能力</text></g>
    <g filter="url(#s)"><rect x="952" y="242" width="410" height="304" rx="28" fill="#173F49"/><text x="992" y="307" fill="#F7F1E4" class="ct">亮起來，也不是診斷</text><circle cx="1020" cy="368" r="20" fill="#EF8A55"/><circle cx="1078" cy="368" r="14" fill="#F0C65E"/><circle cx="1129" cy="368" r="10" fill="#D68C60"/><text x="992" y="420" fill="#D4E0DF" class="body">發炎、感染、切片後反應都可能亮</text><text x="992" y="458" fill="#D4E0DF" class="body">熱點的意思是「需要再確認」</text><line x1="992" y1="486" x2="1322" y2="486" stroke="#C9A83E" stroke-width="3"/><text x="992" y="522" fill="#F2D879" font-size="20" font-weight="900">特異度約 87–97%</text></g>

    <g filter="url(#s)"><rect x="78" y="594" width="620" height="228" rx="28" fill="#173F49"/><circle cx="130" cy="650" r="25" fill="#C9A83E"/><path d="M119 651l8 8 16-20" fill="none" stroke="#123641" stroke-width="5"/><text x="176" y="661" fill="#F7F1E4" class="ct">正子真正擅長</text><text x="118" y="716" fill="#D4E0DF" class="body">全身分期、遠端轉移、第二個原發癌</text><text x="118" y="758" fill="#F2D879" font-size="20" font-weight="900">它提供全身地圖，常能找到意料外的病灶。</text></g>
    <g filter="url(#s)"><rect x="742" y="594" width="620" height="228" rx="28" fill="#FFF"/><circle cx="794" cy="650" r="25" fill="#D8C78F"/><path d="M784 640l20 20M804 640l-20 20" stroke="#123641" stroke-width="5"/><text x="840" y="661" fill="#123641" class="ct">正子不能代替</text><text x="782" y="716" fill="#48666D" class="body">依原發腫瘤位置、厚度與分期做的風險判斷</text><text x="782" y="758" fill="#99791B" font-size="20" font-weight="900">不能只因為「沒亮」就省略頸部手術或照射。</text></g>
    <text x="78" y="875" class="sm">資料來源：文章參考資料 [5] Kim et al., 2019；[6] Hellums et al., 2023｜資訊圖為原創重繪</text>
  </g>
</svg>
