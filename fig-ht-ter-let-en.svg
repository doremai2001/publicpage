<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="930" viewBox="0 0 1440 930" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Two good things need not add up</title>
  <desc id="d">A single experiment, at the cellular level. It shows a direction; it supports no clinical dose or outcome conclusion. Low LET: an interactive (synergistic) thermal enhancement appears Above roughly 70 keV/µm: additive only, no longer synergistic Across all LET levels: only additive enhancement was seen</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#123641" opacity=".14"/><line x1="0" y1="0" x2="0" y2="8" stroke="#123641" stroke-width="2.4" opacity=".85"/></pattern><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0B2832" flood-opacity=".12"/></filter><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="930" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="86" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">A HONEST CAVEAT</text>
<text x="84" y="148" font-size="44" fill="#123641" font-weight="800" class="r">Two good things need not add up</text>
<text x="84" y="204" font-size="21" fill="#527078">One cell experiment compared thermal enhancement across levels of linear energy transfer (LET).</text>
<text x="84" y="234" font-size="21" fill="#527078">It is the least favourable datum in this topic for proton-plus-hyperthermia, so it sits in the middle.</text>
<line x1="84" y1="316" x2="1356" y2="316" stroke="#123641" stroke-width="3" stroke-linecap="round"/>
<path d="M 1358 316 l -10 -7 l 0 14 Z" fill="#123641"/>
<text x="84" y="346" font-size="19" fill="#6B8084" font-weight="700">Low LET</text>
<text x="1356" y="346" font-size="19" fill="#6B8084" font-weight="700" text-anchor="end">High LET</text>
<text x="84" y="300" font-size="18" fill="#6B8084">Linear energy transfer of the radiation (LET) →</text>
<rect x="84" y="378" width="706.32" height="122" rx="16" fill="#A98722" opacity=".20" stroke="#A98722" stroke-width="2" />
<rect x="802.32" y="378" width="553.68" height="122" rx="16" fill="#123641" opacity=".08" stroke="#123641" stroke-width="1.6" />
<text x="104" y="412" font-size="21" fill="#123641" font-weight="800" class="r">Cells with functional p53</text>
<text x="104" y="448" font-size="17" fill="#345963" font-weight="700">Low LET: an interactive (synergistic)</text>
<text x="104" y="472" font-size="17" fill="#345963" font-weight="700">thermal enhancement appears</text>
<text x="822.32" y="426" font-size="17" fill="#527078" font-weight="700">Above roughly 70 keV/µm:</text>
<text x="822.32" y="452" font-size="17" fill="#527078" font-weight="700">additive only, no longer</text>
<text x="822.32" y="478" font-size="17" fill="#527078" font-weight="700">synergistic</text>
<line x1="796.32" y1="368" x2="796.32" y2="584" stroke="#123641" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 8" opacity=".5"/>
<rect x="84" y="518" width="1272" height="80" rx="16" fill="#9A9282" opacity=".14" stroke="#9A9282" stroke-width="1.6" />
<text x="104" y="550" font-size="21" fill="#123641" font-weight="800" class="r">Cells with mutated p53</text>
<text x="104" y="580" font-size="17" fill="#527078" font-weight="700">Across all LET levels: only additive enhancement was seen</text>
<rect x="84" y="622" width="1272" height="132" rx="18" fill="#FFFFFF" opacity=".78" />
<rect x="84" y="622" width="5" height="132" rx="3" fill="#00806B" />
<text x="106" y="658" font-size="22" fill="#123641" font-weight="800" class="r">What about protons</text>
<text x="106" y="692" font-size="18" fill="#527078">Protons are low-LET along most of their track; LET rises only</text>
<text x="106" y="720" font-size="18" fill="#527078">at the end of range.</text>
<text x="106" y="748" font-size="18" fill="#527078">So the concern applies differently than for carbon ions — and</text>
<text x="106" y="776" font-size="18" fill="#527078">nobody has measured how differently.</text>
<rect x="84" y="776" width="1272" height="2" rx="1" fill="#A98722" opacity=".55" />
<text x="84" y="810" font-size="21" fill="#123641" font-weight="800" class="r">A single experiment, at the cellular level. It shows a</text>
<text x="84" y="843" font-size="21" fill="#123641" font-weight="800" class="r">direction; it supports no clinical dose or outcome</text>
<text x="84" y="876" font-size="21" fill="#123641" font-weight="800" class="r">conclusion.</text>
<text x="84" y="894" font-size="16" fill="#6B8084">Schematic from the cell experiment of Takahashi et al. 2001; no curve is drawn, because the source data do not support one.</text>
  </g>
</svg>
