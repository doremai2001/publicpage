<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1160" viewBox="0 0 720 1160" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">它加在上面，不取代任何一格</title>
  <desc id="d">它不會讓你少照幾次、少打幾次，也不會讓原本治療的副作用變少。 每週 1–2 次，不是每天——組織加熱後會有一段時間對熱不敏感；試驗多要求在放射治療後兩小時內完成；加熱 40–60 分鐘，連同準備約一個半小時；有沒有測溫、熱劑量是多少，決定這一次做到了什麼</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#123641" opacity=".14"/><line x1="0" y1="0" x2="0" y2="8" stroke="#123641" stroke-width="2.4" opacity=".85"/></pattern><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0B2832" flood-opacity=".12"/></filter><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="720" height="1160" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="56" y="78" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">WHERE IT SITS</text>
<text x="56" y="140" font-size="30" fill="#123641" font-weight="800" class="r">它加在上面，不取代任何一格</text>
<text x="56" y="182" font-size="18" fill="#527078">熱治療不是療程裡的一站，是掛在放療或化療上面的增效手段。</text>
<text x="56" y="209" font-size="18" fill="#527078">所以它排擠掉的不是治療，是錢、時間與體力。</text>
<rect x="56" y="476" width="185.333" height="78" rx="16" fill="#123641" opacity=".10" />
<text x="148.667" y="524" font-size="15" fill="#123641" font-weight="700" text-anchor="middle">診斷與分期</text>
<path d="M 245.333 518 L 261.333 518" fill="none" stroke="#6B8084" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 263.333 518 l -8 -6 l 0 12 Z" fill="#6B8084"/>
<rect x="267.333" y="476" width="185.333" height="78" rx="16" fill="#123641" opacity=".92" />
<text x="360" y="510" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">標準治療（手術／放</text>
<text x="360" y="536" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">療／化療）</text>
<path d="M 456.667 518 L 472.667 518" fill="none" stroke="#6B8084" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 474.667 518 l -8 -6 l 0 12 Z" fill="#6B8084"/>
<rect x="478.667" y="476" width="185.333" height="78" rx="16" fill="#123641" opacity=".10" />
<text x="571.333" y="524" font-size="15" fill="#123641" font-weight="700" text-anchor="middle">追蹤</text>
<rect x="267.333" y="348" width="185.333" height="76" rx="16" fill="#A98722" opacity=".92" />
<text x="360" y="394" font-size="20" fill="#FFFFFF" font-weight="800" text-anchor="middle" class="r">熱治療</text>
<path d="M 360 424 L 360 462" fill="none" stroke="#A98722" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 8"/>
<path d="M 360 472 l -7 -11 l 14 0 Z" fill="#A98722"/>
<rect x="56" y="584" width="608" height="78" rx="16" fill="#FFFFFF" opacity=".78" />
<rect x="56" y="584" width="5" height="78" rx="3" fill="#5C77C4" />
<text x="76" y="614" font-size="16" fill="#123641" font-weight="800">排程</text>
<text x="76" y="638" font-size="14" fill="#527078">每週 1–2 次，不是每天——組織加熱後會有一段時間</text>
<text x="76" y="661" font-size="14" fill="#527078">對熱不敏感</text>
<rect x="56" y="676" width="608" height="78" rx="16" fill="#FFFFFF" opacity=".78" />
<rect x="56" y="676" width="5" height="78" rx="3" fill="#5C77C4" />
<text x="76" y="706" font-size="16" fill="#123641" font-weight="800">時間窗</text>
<text x="76" y="730" font-size="14" fill="#527078">試驗多要求在放射治療後兩小時內完成</text>
<rect x="56" y="768" width="608" height="78" rx="16" fill="#FFFFFF" opacity=".78" />
<rect x="56" y="768" width="5" height="78" rx="3" fill="#5C77C4" />
<text x="76" y="798" font-size="16" fill="#123641" font-weight="800">每次</text>
<text x="76" y="822" font-size="14" fill="#527078">加熱 40–60 分鐘，連同準備約一個半小時</text>
<rect x="56" y="860" width="608" height="78" rx="16" fill="#FFFFFF" opacity=".78" />
<rect x="56" y="860" width="5" height="78" rx="3" fill="#5C77C4" />
<text x="76" y="890" font-size="16" fill="#123641" font-weight="800">查核</text>
<text x="76" y="914" font-size="14" fill="#527078">有沒有測溫、熱劑量是多少，決定這一次做到了什麼</text>
<rect x="56" y="966" width="608" height="2" rx="1" fill="#A98722" opacity=".55" />
<text x="56" y="1000" font-size="18" fill="#123641" font-weight="800" class="r">它不會讓你少照幾次、少打幾次，也不會讓原本治療的副作用</text>
<text x="56" y="1030" font-size="18" fill="#123641" font-weight="800" class="r">變少。</text>
<text x="56" y="1124" font-size="14" fill="#6B8084">示意圖。排程與時間窗依本專題引用的臨床試驗所載的做法（Yang 等 2025、Riest</text>
<text x="56" y="1144" font-size="14" fill="#6B8084">erer 等 2022、ESHO 1-85）。</text>
  </g>
</svg>
