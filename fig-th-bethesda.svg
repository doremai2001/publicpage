<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2649" viewBox="0 0 1440 2649" role="img" aria-labelledby="t d">
  <title id="t">第三版 Bethesda 六個類別與各自的下一步</title>
  <desc id="d">示意圖，把 2023 年第三版甲狀腺細胞病理報告系統的六個類別、各自的惡性機率與各自的下一步排成六列。每一列左邊是類別編號與第三版的英文名稱，中間是惡性機率的平均值、括號裡的範圍與一條比例條，右邊是這一類接下來會走的路。這一組數字有四個標籤要一起帶：第三版、成人、給的是平均值與括號裡的範圍、終點是「切除後組織病理確認為惡性」。六列由第一類排到第六類，每一列的比例條用同一把 0 到 100 的尺畫，顏色隨機率由淺到深，從第一列的中性色、經過綠與金，到最後兩列的紅。第一類 nondiagnostic（不足以判讀）13%（5–20），下一步是在超音波導引下重扎；圖上註明第一類不是「沒事」，是「這次沒抽到東西」。第二類 benign（良性）4%（2–7），下一步是臨床與超音波追蹤。第三類 atypia of undetermined significance（意義未明的非典型）22%（13–30），下一步是重扎、分子檢測、診斷性單葉切除或監測。第四類 follicular neoplasm（濾泡性腫瘤）30%（23–34），下一步是分子檢測或診斷性單葉切除。第五類 suspicious for malignancy（疑似惡性）74%（67–83），下一步是進到手術的討論。第六類 malignant（惡性）97%（97–100），下一步同樣是進到手術的討論。第二段處理第三類裡面的兩格：第三版把第三類拆成兩個次分類，AUS-nuclear（細胞核有非典型變化）在切除檢體上是 36% 到 44%，AUS-other（其他型態的非典型）是 15% 到 23%。旁邊的黃底說明寫另一篇回顧把「其他型態」再拆得更細：細胞核非典型 36% 到 48%、結構非典型 10% 到 20%、嗜酸性細胞型 5% 到 6%；所以當報告寫第三類，值得問的下一個問題是「是哪一種第三類」，這一句問下去，22% 可能會變成 15%，也可能會變成 44%。第三段是三件會讓新舊報告對不起來的事。第一件是名字換了，不代表當年那張報告判錯：AUS／FLUS 現在只叫 AUS；FN／SFN 現在只叫 FN，「疑似濾泡性腫瘤」這個詞已經被拿掉了；unsatisfactory 現在叫 nondiagnostic。第二件是 NIFTP 改判之後每一類的百分比都往下掉了：第三版把一種叫 NIFTP 的腫瘤改判為非癌以後，各類的惡性機率都往下掉了 1.3% 到 9.1%，所以拿舊報告的百分比去對新報告會對錯。第三件是第一類與第三類各自有一條品管線：夠不夠判讀有客觀標準，至少六群保存良好的濾泡細胞、每一群至少十個細胞，出現在一張或多張玻片上，沒有達到就落到第一類；第三類的判讀最好不要超過全部細針檢體的 7% 到 10%，而第三類對第六類的比值最好在 3 以下，這一類被用得太浮濫本身就是品質問題。圖上沒有任何一格把編號直接換成一個決定：每一列的機率旁邊都配著它自己的下一步，最低的兩類走的是再取一次檢體或追蹤，最高的兩類走的是「進到手術的討論」，而不是手術本身。圖的最後是一個紅框的界線區塊，標題是「這張圖不是你的機率」，內容有四條：這六個數字是平均值，分母是一整批被切除並做了組織病理的檢體，不是你那一管，第三類寫 22% 不代表你有 22% 的機會是癌；這個編號跟期別無關，也不是「第幾期」，它是細胞學的分類，回答的只有「這一管細胞有多大機會是惡性」這一個問題；這些機率與下一步都是轉引，兩篇文獻的表格都註明是經授權改編自第三版原書，這次沒有拿到原書；拿到編號之後可以照著念的是——我這張報告是第幾類？如果是第三類，是細胞核那一種還是其他那一種？這份報告用的是第幾版的分類？</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#B9AE94" stroke-width="2" opacity="0.55"/></pattern><pattern id="hatchR" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(135)"><line x1="0" y1="0" x2="0" y2="8" stroke="#B04A4A" stroke-width="2" opacity="0.45"/></pattern><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="2649" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="88" font-size="16" fill="#A98722" font-weight="800" letter-spacing="3px">THE BETHESDA SYSTEM, THIRD EDITION (2023) - SIX NUMBERS, SIX NEXT STEPS</text>
<text x="84" y="142" font-size="38" fill="#123641" font-weight="800" class="r">細針報告上的那個編號，第三版怎麼讀</text>
<text x="84" y="201.88" font-size="19" fill="#527078">這個編號跟期別無關。它是細胞學的分類，回答的是「這一管細胞有多大機會是惡性」，而每一類後面配的下一步也不一樣。</text>
<text x="84" y="236.38" font-size="19" fill="#527078">現在通行的是 2023 年出的第三版。它把每一類只留一個名字，用語也和 2022 年那一版世界衛生組織的甲狀腺腫瘤分類對齊。</text>
<text x="84" y="334.88" font-size="22" fill="#123641" font-weight="800" class="r">六個編號、六個機率、六條路</text>
<text x="84" y="360.36" font-size="14" fill="#527078">下面這一組數字有四個標籤要一起帶：第三版、成人、給的是平均值與括號裡的範圍、終點是「切除後組織病理確認為惡性」。</text>
<g filter="url(#sh)">
<rect x="84" y="379.36" width="1272" height="150.42" rx="18" fill="#FFFFFF" stroke="#DBD3BF" stroke-width="2"/>
</g>
<rect x="104" y="399.36" width="62.5" height="25" rx="12.5" fill="#7A6E58"/>
<text x="115" y="416.86" font-size="13.5" fill="#FFFFFF" font-weight="800">第一類</text>
<text x="104" y="451.36" font-size="18" fill="#123641" font-weight="800">nondiagnostic</text>
<text x="104" y="489.48" font-size="14" fill="#527078">不足以判讀</text>
<text x="484" y="413.36" font-size="14" fill="#527078" font-weight="700">惡性機率（平均值與範圍）</text>
<text x="484" y="461.04" font-size="28" fill="#7A6E58" font-weight="800">13%</text>
<text x="544.87" y="461.04" font-size="14" fill="#527078">（5–20）</text>
<rect x="484" y="468.32" width="306.8" height="14" rx="5" fill="#ECE8DE"/>
<rect x="484" y="468.32" width="39.88" height="14" rx="5" fill="#7A6E58"/>
<text x="816.8" y="413.36" font-size="14" fill="#527078" font-weight="700">下一步</text>
<text x="816.8" y="448.96" font-size="14" fill="#345963">在超音波導引下重扎。第一類不是「沒事」，是「這次沒抽到東西」。</text>
<g filter="url(#sh)">
<rect x="84" y="541.78" width="1272" height="150.42" rx="18" fill="#FFFFFF" stroke="#DBD3BF" stroke-width="2"/>
</g>
<rect x="104" y="561.78" width="62.5" height="25" rx="12.5" fill="#00806B"/>
<text x="115" y="579.27" font-size="13.5" fill="#FFFFFF" font-weight="800">第二類</text>
<text x="104" y="613.78" font-size="18" fill="#123641" font-weight="800">benign</text>
<text x="104" y="651.9" font-size="14" fill="#527078">良性</text>
<text x="484" y="575.78" font-size="14" fill="#527078" font-weight="700">惡性機率（平均值與範圍）</text>
<text x="484" y="623.46" font-size="28" fill="#00806B" font-weight="800">4%</text>
<text x="527.14" y="623.46" font-size="14" fill="#527078">（2–7）</text>
<rect x="484" y="630.74" width="306.8" height="14" rx="5" fill="#ECE8DE"/>
<rect x="484" y="630.74" width="12.27" height="14" rx="5" fill="#00806B"/>
<text x="816.8" y="575.78" font-size="14" fill="#527078" font-weight="700">下一步</text>
<text x="816.8" y="611.38" font-size="14" fill="#345963">臨床與超音波追蹤。</text>
<g filter="url(#sh)">
<rect x="84" y="704.2" width="1272" height="150.42" rx="18" fill="#FFFFFF" stroke="#DBD3BF" stroke-width="2"/>
</g>
<rect x="104" y="724.2" width="62.5" height="25" rx="12.5" fill="#96790F"/>
<text x="115" y="741.69" font-size="13.5" fill="#FFFFFF" font-weight="800">第三類</text>
<text x="104" y="776.2" font-size="18" fill="#123641" font-weight="800">atypia of undetermined significance</text>
<text x="104" y="814.32" font-size="14" fill="#527078">意義未明的非典型</text>
<text x="484" y="738.2" font-size="14" fill="#527078" font-weight="700">惡性機率（平均值與範圍）</text>
<text x="484" y="785.88" font-size="28" fill="#96790F" font-weight="800">22%</text>
<text x="544.87" y="785.88" font-size="14" fill="#527078">（13–30）</text>
<rect x="484" y="793.16" width="306.8" height="14" rx="5" fill="#ECE8DE"/>
<rect x="484" y="793.16" width="67.5" height="14" rx="5" fill="#96790F"/>
<text x="816.8" y="738.2" font-size="14" fill="#527078" font-weight="700">下一步</text>
<text x="816.8" y="773.8" font-size="14" fill="#345963">重扎、分子檢測、診斷性單葉切除或監測。這一類下面還有兩格，見下一段。</text>
<g filter="url(#sh)">
<rect x="84" y="866.62" width="1272" height="150.42" rx="18" fill="#FFFFFF" stroke="#DBD3BF" stroke-width="2"/>
</g>
<rect x="104" y="886.62" width="62.5" height="25" rx="12.5" fill="#96790F"/>
<text x="115" y="904.11" font-size="13.5" fill="#FFFFFF" font-weight="800">第四類</text>
<text x="104" y="938.62" font-size="18" fill="#123641" font-weight="800">follicular neoplasm</text>
<text x="104" y="976.74" font-size="14" fill="#527078">濾泡性腫瘤</text>
<text x="484" y="900.62" font-size="14" fill="#527078" font-weight="700">惡性機率（平均值與範圍）</text>
<text x="484" y="948.3" font-size="28" fill="#96790F" font-weight="800">30%</text>
<text x="544.87" y="948.3" font-size="14" fill="#527078">（23–34）</text>
<rect x="484" y="955.58" width="306.8" height="14" rx="5" fill="#ECE8DE"/>
<rect x="484" y="955.58" width="92.04" height="14" rx="5" fill="#96790F"/>
<text x="816.8" y="900.62" font-size="14" fill="#527078" font-weight="700">下一步</text>
<text x="816.8" y="936.22" font-size="14" fill="#345963">分子檢測或診斷性單葉切除。</text>
<g filter="url(#sh)">
<rect x="84" y="1029.04" width="1272" height="150.42" rx="18" fill="#FFFFFF" stroke="#DBD3BF" stroke-width="2"/>
</g>
<rect x="104" y="1049.04" width="62.5" height="25" rx="12.5" fill="#B04A4A"/>
<text x="115" y="1066.53" font-size="13.5" fill="#FFFFFF" font-weight="800">第五類</text>
<text x="104" y="1101.04" font-size="18" fill="#123641" font-weight="800">suspicious for malignancy</text>
<text x="104" y="1139.16" font-size="14" fill="#527078">疑似惡性</text>
<text x="484" y="1063.04" font-size="14" fill="#527078" font-weight="700">惡性機率（平均值與範圍）</text>
<text x="484" y="1110.72" font-size="28" fill="#B04A4A" font-weight="800">74%</text>
<text x="544.87" y="1110.72" font-size="14" fill="#527078">（67–83）</text>
<rect x="484" y="1118" width="306.8" height="14" rx="5" fill="#ECE8DE"/>
<rect x="484" y="1118" width="227.03" height="14" rx="5" fill="#B04A4A"/>
<text x="816.8" y="1063.04" font-size="14" fill="#527078" font-weight="700">下一步</text>
<text x="816.8" y="1098.64" font-size="14" fill="#345963">進到手術的討論。</text>
<g filter="url(#sh)">
<rect x="84" y="1191.46" width="1272" height="150.42" rx="18" fill="#FFFFFF" stroke="#DBD3BF" stroke-width="2"/>
</g>
<rect x="104" y="1211.46" width="62.5" height="25" rx="12.5" fill="#B04A4A"/>
<text x="115" y="1228.95" font-size="13.5" fill="#FFFFFF" font-weight="800">第六類</text>
<text x="104" y="1263.46" font-size="18" fill="#123641" font-weight="800">malignant</text>
<text x="104" y="1301.58" font-size="14" fill="#527078">惡性</text>
<text x="484" y="1225.46" font-size="14" fill="#527078" font-weight="700">惡性機率（平均值與範圍）</text>
<text x="484" y="1273.14" font-size="28" fill="#B04A4A" font-weight="800">97%</text>
<text x="544.87" y="1273.14" font-size="14" fill="#527078">（97–100）</text>
<rect x="484" y="1280.42" width="306.8" height="14" rx="5" fill="#ECE8DE"/>
<rect x="484" y="1280.42" width="297.6" height="14" rx="5" fill="#B04A4A"/>
<text x="816.8" y="1225.46" font-size="14" fill="#527078" font-weight="700">下一步</text>
<text x="816.8" y="1261.06" font-size="14" fill="#345963">進到手術的討論。</text>
<text x="84" y="1391.88" font-size="22" fill="#123641" font-weight="800" class="r">第三類裡面，其實還有兩格</text>
<text x="84" y="1417.36" font-size="14" fill="#527078">第三類是最讓人焦慮的一類，因為 22% 這個數字既不能安心也不足以開刀。第三版在這裡做了一件很實際的事：把它拆成兩個次分類。</text>
<g filter="url(#sh)">
<rect x="84" y="1436.36" width="624" height="177.34" rx="18" fill="#F6E2E0" stroke="#B04A4A" stroke-width="2"/>
</g>
<rect x="102" y="1454.36" width="121.31" height="25" rx="12.5" fill="#B04A4A"/>
<text x="113" y="1471.85" font-size="13.5" fill="#FFFFFF" font-weight="800">AUS-nuclear</text>
<text x="102" y="1503.36" font-size="14" fill="#527078">細胞核有非典型變化</text>
<text x="102" y="1551.74" font-size="28" fill="#B04A4A" font-weight="800">36% 到 44%</text>
<text x="102" y="1574.7" font-size="14" fill="#345963">這一格的惡性機率在切除檢體上明顯較高。</text>
<g filter="url(#sh)">
<rect x="732" y="1436.36" width="624" height="177.34" rx="18" fill="#D8EDE7" stroke="#00806B" stroke-width="2"/>
</g>
<rect x="750" y="1454.36" width="103.49" height="25" rx="12.5" fill="#00806B"/>
<text x="761" y="1471.85" font-size="13.5" fill="#FFFFFF" font-weight="800">AUS-other</text>
<text x="750" y="1503.36" font-size="14" fill="#527078">其他型態的非典型</text>
<text x="750" y="1551.74" font-size="28" fill="#00806B" font-weight="800">15% 到 23%</text>
<text x="750" y="1574.7" font-size="14" fill="#345963">同一份第三版資料裡，這一格明顯較低。</text>
<rect x="84" y="1629.7" width="1272" height="142.3" rx="14" fill="#F3E8CD"/>
<text x="100" y="1659.7" font-size="14" fill="#8F7418" font-weight="800">另一篇回顧把「其他型態」再拆得更細</text>
<text x="100" y="1696" font-size="14" fill="#345963">細胞核非典型 36% 到 48%、結構非典型 10% 到 20%、嗜酸性細胞型 5% 到 6%。</text>
<text x="100" y="1735" font-size="14" fill="#345963">所以當報告寫第三類，值得問的下一個問題是「是哪一種第三類」。這一句問下去，22% 可能會變成 15%，也可能會變成 44%。</text>
<text x="84" y="1822" font-size="22" fill="#123641" font-weight="800" class="r">三件會讓新舊報告對不起來的事</text>
<g filter="url(#sh)">
<rect x="84" y="1841.48" width="1272" height="177.12" rx="18" fill="#FFFFFF" stroke="#DBD3BF" stroke-width="2"/>
</g>
<text x="106" y="1881.48" font-size="18" fill="#123641" font-weight="800">一、名字換了，不代表當年那張報告判錯</text>
<text x="106" y="1925.6" font-size="14" fill="#527078" font-weight="700">AUS／FLUS</text>
<text x="523.52" y="1925.6" font-size="14" fill="#345963">現在只叫 AUS</text>
<text x="106" y="1957.6" font-size="14" fill="#527078" font-weight="700">FN／SFN</text>
<text x="523.52" y="1957.6" font-size="14" fill="#345963">現在只叫 FN，「疑似濾泡性腫瘤」這個詞已經被拿掉了</text>
<text x="106" y="1989.6" font-size="14" fill="#527078" font-weight="700">unsatisfactory</text>
<text x="523.52" y="1989.6" font-size="14" fill="#345963">現在叫 nondiagnostic</text>
<rect x="84" y="2032.6" width="1272" height="142.3" rx="14" fill="#ECE8DE"/>
<text x="100" y="2062.6" font-size="14" fill="#123641" font-weight="800">二、NIFTP 改判之後，每一類的百分比都往下掉了</text>
<text x="100" y="2098.9" font-size="14" fill="#345963">第三版把一種叫 NIFTP 的腫瘤改判為非癌以後，各類的惡性機率都往下掉了 1.3% 到 9.1%。</text>
<text x="100" y="2137.9" font-size="14" fill="#345963">所以拿舊報告的百分比去對新報告，會對錯。</text>
<rect x="84" y="2188.9" width="1272" height="142.3" rx="14" fill="#ECE8DE"/>
<text x="100" y="2218.9" font-size="14" fill="#123641" font-weight="800">三、第一類與第三類，各自有一條品管線</text>
<text x="100" y="2255.2" font-size="14" fill="#345963">夠不夠判讀是有客觀標準的：至少六群保存良好的濾泡細胞、每一群至少十個細胞，出現在一張或多張玻片上。沒有達到就落到第一類。</text>
<text x="100" y="2294.2" font-size="14" fill="#345963">第三類的判讀最好不要超過全部細針檢體的 7% 到 10%，而第三類對第六類的比值最好在 3 以下——這一類被用得太浮濫，本身就是品質問題。</text>
<rect x="84" y="2353.2" width="1272" height="217.1" rx="16" fill="#F6E2E0" stroke="#B04A4A" stroke-width="2.5"/>
<text x="110" y="2399.2" font-size="18" fill="#B04A4A" font-weight="800">這張圖不是你的機率</text>
<text x="110" y="2430.8" font-size="15.5" fill="#345963">這六個數字是平均值，分母是一整批被切除並做了組織病理的檢體，不是你那一管。第三類寫 22%，不代表你有 22% 的機會是癌。</text>
<text x="110" y="2464.05" font-size="15.5" fill="#345963">這個編號跟期別無關，也不是「第幾期」。它是細胞學的分類，回答的只有「這一管細胞有多大機會是惡性」這一個問題。</text>
<text x="110" y="2497.3" font-size="15.5" fill="#345963">這些機率與下一步都是轉引：兩篇文獻的表格都註明是經授權改編自第三版原書，我這次沒有拿到原書。</text>
<text x="110" y="2530.55" font-size="15.5" fill="#345963">拿到編號之後可以照著念的是：我這張報告是第幾類？如果是第三類，是細胞核那一種還是其他那一種？這份報告用的是第幾版的分類？</text>
<text x="84" y="2590.3" font-size="15" fill="#527078">示意圖，依 2023 年第三版甲狀腺細胞病理報告系統原始說明、2025 年甲狀腺細胞病理學回顧與 2026 年甲狀腺結節診斷流程回顧重繪，非擷取自原論文圖表；各研究族群、設計與終點不同，</text>
<text x="84" y="2613.55" font-size="15" fill="#527078">數點不可直接互比。</text>
  </g>
</svg>
