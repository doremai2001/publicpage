<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="930" viewBox="0 0 1440 930" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">兩個都好，不代表加起來更好</title>
  <desc id="d">這是單一研究、細胞層次。它能說明方向，不能推導出任何臨床劑量或療效結論。 低 LET：熱與放射線之間出現互動式（協同）的增強 超過約 70 keV/µm：只剩相加，不再是協同 所有 LET 範圍：都只觀察到相加效果</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#123641" opacity=".14"/><line x1="0" y1="0" x2="0" y2="8" stroke="#123641" stroke-width="2.4" opacity=".85"/></pattern><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0B2832" flood-opacity=".12"/></filter><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="930" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="86" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">A HONEST CAVEAT</text>
<text x="84" y="148" font-size="44" fill="#123641" font-weight="800" class="r">兩個都好，不代表加起來更好</text>
<text x="84" y="204" font-size="21" fill="#527078">一個細胞實驗比較了不同能量轉移密度（LET）下的熱增強效果。</text>
<text x="84" y="234" font-size="21" fill="#527078">它的結果是這一組裡對「質子加熱治療」最不利的一筆，所以我把它放在正中間。</text>
<line x1="84" y1="316" x2="1356" y2="316" stroke="#123641" stroke-width="3" stroke-linecap="round"/>
<path d="M 1358 316 l -10 -7 l 0 14 Z" fill="#123641"/>
<text x="84" y="346" font-size="19" fill="#6B8084" font-weight="700">低 LET</text>
<text x="1356" y="346" font-size="19" fill="#6B8084" font-weight="700" text-anchor="end">高 LET</text>
<text x="84" y="300" font-size="18" fill="#6B8084">放射線的能量轉移密度（LET）→</text>
<rect x="84" y="378" width="706.32" height="122" rx="16" fill="#A98722" opacity=".20" stroke="#A98722" stroke-width="2" />
<rect x="802.32" y="378" width="553.68" height="122" rx="16" fill="#123641" opacity=".08" stroke="#123641" stroke-width="1.6" />
<text x="104" y="412" font-size="21" fill="#123641" font-weight="800" class="r">p53 功能正常的細胞</text>
<text x="104" y="448" font-size="17" fill="#345963" font-weight="700">低 LET：熱與放射線之間出現互動式（協同）的增強</text>
<text x="822.32" y="426" font-size="17" fill="#527078" font-weight="700">超過約 70 keV/µm：只剩相加，不再是協同</text>
<line x1="796.32" y1="368" x2="796.32" y2="584" stroke="#123641" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 8" opacity=".5"/>
<rect x="84" y="518" width="1272" height="80" rx="16" fill="#9A9282" opacity=".14" stroke="#9A9282" stroke-width="1.6" />
<text x="104" y="550" font-size="21" fill="#123641" font-weight="800" class="r">p53 突變的細胞</text>
<text x="104" y="580" font-size="17" fill="#527078" font-weight="700">所有 LET 範圍：都只觀察到相加效果</text>
<rect x="84" y="622" width="1272" height="132" rx="18" fill="#FFFFFF" opacity=".78" />
<rect x="84" y="622" width="5" height="132" rx="3" fill="#00806B" />
<text x="106" y="658" font-size="22" fill="#123641" font-weight="800" class="r">那質子呢</text>
<text x="106" y="692" font-size="18" fill="#527078">質子在射程的大部分路徑上屬於低 LET，只有布拉格峰末端明顯上升。</text>
<text x="106" y="720" font-size="18" fill="#527078">所以這個疑慮對質子的適用程度和對碳離子不同——而那個「不同」有多大，目前沒有人量過。</text>
<rect x="84" y="776" width="1272" height="2" rx="1" fill="#A98722" opacity=".55" />
<text x="84" y="810" font-size="21" fill="#123641" font-weight="800" class="r">這是單一研究、細胞層次。它能說明方向，不能推導出任何臨床劑量或療效結論。</text>
<text x="84" y="894" font-size="16" fill="#6B8084">示意圖，依 Takahashi 等 2001 的細胞實驗結果繪製；圖中不畫曲線，因為原始資料不足以支持一條連續曲線。</text>
  </g>
</svg>
