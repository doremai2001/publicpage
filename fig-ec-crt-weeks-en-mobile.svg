<text x="84" y="653.2" font-size="12" fill="#345963" font-weight="600">External-beam radiotherapy: 1.8 Gy ×28 = 50.4 Gy, Monday to Friday (dose per</text>
<text x="84" y="670.6" font-size="12" fill="#345963" font-weight="600">prescription; a 60 Gy course runs about 6 weeks)</text>
<circle cx="69" cy="692.8" r="6.5" fill="#C9A83E" stroke="#8F7418" stroke-width="1.5"/>
<text x="84" y="696" font-size="12" fill="#345963" font-weight="600">Chemotherapy: weekly shown as the example (carboplatin/paclitaxel);</text>
<text x="84" y="713.4" font-size="12" fill="#345963" font-weight="600">cisplatin/5-FU runs in cycles weeks apart — the team sets the schedule</text>
<line x1="69" y1="728.6" x2="69" y2="742.6" stroke="#B04A4A" stroke-width="3" stroke-linecap="round"/>
<text x="84" y="738.8" font-size="12" fill="#345963" font-weight="600">Weeks 2–3: oesophagitis usually starts here; about 1 week earlier with</text>
<text x="84" y="756.2" font-size="12" fill="#345963" font-weight="600">concurrent chemotherapy</text>
<g filter="url(#sh)"><rect x="44" y="798.4" width="532" height="330" rx="18" fill="#FFFFFF"/></g>
<rect x="96" y="846.4" width="253.12" height="192" fill="#E3E8F6" opacity="0.7"/>
<text x="222.56" y="836.4" font-size="12" fill="#5C77C4" font-weight="800" text-anchor="middle">Radiotherapy, 5–6 weeks</text>
<text x="448.56" y="836.4" font-size="12" fill="#6B8084" font-weight="700" text-anchor="middle">Settles within 4 weeks after</text>
<line x1="96" y1="1038.4" x2="548" y2="1038.4" stroke="#B9B1A0" stroke-width="1.5" stroke-linecap="round"/>
<line x1="96" y1="1038.4" x2="96" y2="1043.4" stroke="#B9B1A0" stroke-width="1.5" stroke-linecap="round"/>
