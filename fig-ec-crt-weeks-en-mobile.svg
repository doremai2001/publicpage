<text x="407.88" y="873.28" font-size="12.5" fill="#B04A4A" font-weight="800" text-anchor="start">Oesophagitis symptoms (schematic)</text>
<text x="154.76" y="990.4" font-size="11.5" fill="#B04A4A" font-weight="600" opacity="0.85">With chemotherapy: ~1 week earlier (dashed)</text>
<text x="548" y="943.52" font-size="12.5" fill="#96790F" font-weight="800" text-anchor="end">Weight (schematic, slow decline)</text>
<text x="88" y="850.4" font-size="11.5" fill="#6B8084" text-anchor="end">high</text>
<text x="88" y="1038.4" font-size="11.5" fill="#6B8084" text-anchor="end">low</text>
<text x="62" y="1096.4" font-size="11.5" fill="#6B8084">Extrapolated from lung radiotherapy literature (Baker &amp; Fairchild 2016); oesophageal</text>
<text x="62" y="1112.4" font-size="11.5" fill="#6B8084">trials did not report oesophagitis separately</text>
<g filter="url(#sh)"><rect x="44" y="1146.4" width="532" height="131.72" rx="18" fill="#FFFFFF"/></g>
<rect x="62" y="1162.4" width="130.37" height="20.12" rx="10.06" fill="#B04A4A"/>
<text x="127.19" y="1176.6" font-size="11.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">What grade 3 means</text>
<text x="62" y="1204.73" font-size="12" fill="#345963">CTCAE v5.0 oesophagitis grade 3: 'severely altered eating/swallowing; tube feeding,</text>
<text x="62" y="1222.13" font-size="12" fill="#345963">TPN or hospitalisation indicated'. Grade 2: symptomatic, altered eating, oral</text>
<text x="62" y="1239.53" font-size="12" fill="#345963">supplements. About 10–20% grade 3 in lung-cancer chemoradiotherapy</text>
<text x="62" y="1256.93" font-size="12" fill="#345963">(extrapolated).</text>
<g filter="url(#sh)"><rect x="44" y="1290.12" width="532" height="96.92" rx="18" fill="#FFFFFF"/></g>
<rect x="62" y="1306.12" width="121.31" height="20.12" rx="10.06" fill="#5C77C4"/>
<text x="122.66" y="1320.33" font-size="11.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">Most people finish</text>
<text x="62" y="1348.45" font-size="12" fill="#345963">ARTDECO (n=260, 61% SCC): radiotherapy completion 94%. RTOG 85-01 concurrent</text>
<text x="62" y="1365.85" font-size="12" fill="#345963">chemoradiotherapy: severe/life-threatening toxicity 44%/20% (1992 era, n=121).</text>
<g filter="url(#sh)"><rect x="44" y="1399.05" width="532" height="131.72" rx="18" fill="#FFFFFF"/></g>
<rect x="62" y="1415.05" width="179.35" height="20.12" rx="10.06" fill="#96790F"/>
<text x="151.67" y="1429.25" font-size="11.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">Why not to stop on your own</text>
<text x="62" y="1457.38" font-size="12" fill="#345963">Local control vs total treatment time: −2.3%/day (oesophageal cancer, 1994</text>
<text x="62" y="1474.78" font-size="12" fill="#345963">radiotherapy alone, n=88); −1.4%/day (head and neck SCC, extrapolated) —</text>
<text x="62" y="1492.17" font-size="12" fill="#345963">population regression slopes, not personal risk; a 2025 chemoradiotherapy series</text>
<text x="62" y="1509.58" font-size="12" fill="#345963">(median delay only 4 days) showed no effect and is not evidence that stopping is safe.</text>
<g filter="url(#sh)"><rect x="44" y="1542.77" width="532" height="96.92" rx="18" fill="#FFFFFF"/></g>
<rect x="62" y="1558.77" width="155.91" height="20.12" rx="10.06" fill="#00806B"/>
<text x="139.95" y="1572.98" font-size="11.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">Not only the oesophagus</text>
<text x="62" y="1601.1" font-size="12" fill="#345963">Radiation pneumonitis grade 2 or higher about 6.6% (IMRT-era systematic review),</text>
<text x="62" y="1618.5" font-size="12" fill="#345963">mostly weeks to months after the end — report cough and breathlessness.</text>
<text x="44" y="1664.2" font-size="12.5" fill="#6B8084" font-weight="600">Weeks four and five hurt most and are when 'a few days off' is most tempting — report</text>
<text x="44" y="1682.32" font-size="12.5" fill="#6B8084" font-weight="600">it and let the team handle symptoms and nutrition; whether to pause, and how to</text>
<text x="44" y="1700.45" font-size="12.5" fill="#6B8084" font-weight="600">compensate, is the team's call.</text>
<text x="44" y="1740.57" font-size="12" fill="#6B8084">Schematic, redrawn from Baker &amp; Fairchild 2016 (lung-cancer radiation oesophagitis</text>
<text x="44" y="1758.57" font-size="12" fill="#6B8084">review, extrapolated), CTCAE v5.0, Hulshof 2021 (ARTDECO), Herskovic 1992 (RTOG</text>
<text x="44" y="1776.57" font-size="12" fill="#6B8084">85-01), Nishimura 1994, Bese 2007, Xiang 2025 and Tonison 2019 (IMRT-era pneumonitis</text>
<text x="44" y="1794.57" font-size="12" fill="#6B8084">review) | curves are schematic, not an individual course; your team sets the actual schedule</text>
  </g>
</svg>
