<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1301" viewBox="0 0 620 1301" role="img" aria-labelledby="t d">
  <title id="t">Local control vs tumour size</title>
  <desc id="d">Schematic: each additional centimetre raises the risk of local failure after RFA (HR 1.54) while SBRT shows no detectable size effect (HR 1.21, p=0.617); at 2 cm and above the local progression risk after RFA is 3.35 times that of SBRT (Wahl 2016, retrospective). Paired points: Wahl 2-year freedom from local progression 80.2% RFA vs 83.8% SBRT; Xi 2025 randomised trial (recurrent single tumour up to 5 cm) 2-year local progression-free survival 75.8% vs 92.7%; Yoon 2020 prospective phase II SBRT 100% at 2 years; HyTEC pooled 89%. Overall survival shows no demonstrable difference.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="620" height="1301" rx="30" fill="url(#bg)"/>
  <g class="z">
<text x="44" y="62" font-size="14" fill="#A98722" font-weight="800" letter-spacing="3.5px">LOCAL CONTROL × SIZE</text>
<text x="44" y="112" font-size="30" fill="#123641" font-weight="800" class="r">Local control vs</text>
<text x="44" y="152" font-size="30" fill="#123641" font-weight="800" class="r">tumour size</text>
<text x="44" y="194" font-size="14.5" fill="#527078">RFA falls as tumours grow; SBRT shows no</text>
<text x="44" y="216" font-size="14.5" fill="#527078">detectable size effect. About local control,</text>
<text x="44" y="238" font-size="14.5" fill="#527078">not overall survival; endpoints differ.</text>
<line x1="44" y1="270" x2="70" y2="270" stroke="#96790F" stroke-width="5" stroke-linecap="round"/>
<text x="78" y="275" font-size="14" fill="#345963" font-weight="600">RFA</text>
<line x1="140" y1="270" x2="166" y2="270" stroke="#00806B" stroke-width="5" stroke-linecap="round"/>
<text x="174" y="275" font-size="14" fill="#345963" font-weight="600">SBRT</text>
<rect x="44" y="296" width="532" height="241" rx="16" fill="none" stroke="#C9A83E" stroke-width="2"/>
<text x="64" y="326" font-size="15.5" fill="#8F7418" font-weight="800">The size effect (Wahl 2016 · retrospective ·</text>
<text x="64" y="349" font-size="15.5" fill="#8F7418" font-weight="800">inoperable; median 1.8 cm RFA vs 2.2 cm SBRT)</text>
<text x="64" y="372" font-size="13.8" fill="#345963">Each extra centimetre: RFA local-failure risk</text>
<text x="64" y="395" font-size="13.8" fill="#345963">×1.54 (p=0.006); SBRT ×1.21 (p=0.617, none seen)</text>
<text x="64" y="418" font-size="13.8" fill="#345963" font-weight="600">At 2 cm and above: RFA local progression risk is</text>
<text x="64" y="441" font-size="13.8" fill="#345963" font-weight="600">3.35× that of SBRT; resectable and beyond 2 cm —</text>
<text x="64" y="464" font-size="13.8" fill="#345963" font-weight="600">BCLC favours resection</text>
<text x="64" y="487" font-size="12.5" fill="#6B8084">Location: RFA local failure 48% beside vessels vs</text>
<text x="64" y="510" font-size="12.5" fill="#6B8084">7% (Lu 2003); periportal recurrence 15% (Kang 2015)</text>
<g filter="url(#sh)"><rect x="44" y="559" width="532" height="444" rx="18" fill="#FFFFFF"/></g>
<line x1="80.0" y1="577" x2="80.0" y2="945" stroke="#DBD3BF" stroke-width="1"/>
<text x="80.0" y="967" font-size="12" fill="#6B8084" text-anchor="middle">50</text>
<line x1="174.4" y1="577" x2="174.4" y2="945" stroke="#DBD3BF" stroke-width="1"/>
<text x="174.4" y="967" font-size="12" fill="#6B8084" text-anchor="middle">60</text>
<line x1="268.8" y1="577" x2="268.8" y2="945" stroke="#DBD3BF" stroke-width="1"/>
<text x="268.8" y="967" font-size="12" fill="#6B8084" text-anchor="middle">70</text>
<line x1="363.2" y1="577" x2="363.2" y2="945" stroke="#DBD3BF" stroke-width="1"/>
<text x="363.2" y="967" font-size="12" fill="#6B8084" text-anchor="middle">80</text>
<line x1="457.6" y1="577" x2="457.6" y2="945" stroke="#DBD3BF" stroke-width="1"/>
<text x="457.6" y="967" font-size="12" fill="#6B8084" text-anchor="middle">90</text>
<line x1="552.0" y1="577" x2="552.0" y2="945" stroke="#DBD3BF" stroke-width="1"/>
<text x="552.0" y="967" font-size="12" fill="#6B8084" text-anchor="middle">100</text>
<text x="316" y="987" font-size="11.5" fill="#6B8084" text-anchor="middle">% (as each study defines it)</text>
<text x="64" y="597" font-size="14" fill="#123641" font-weight="800">Wahl 2016 · retrospective (US, inoperable)</text>
<text x="64" y="616" font-size="12.5" fill="#6B8084">2-yr freedom from local progression</text>
<line x1="365.1" y1="639" x2="399.1" y2="639" stroke="#B9AE94" stroke-width="2"/>
<circle cx="365.1" cy="639" r="7" fill="#96790F"/>
<circle cx="399.1" cy="639" r="7" fill="#00806B"/>
<text x="354.088" y="643.5" font-size="12.5" fill="#96790F" font-weight="800" text-anchor="end">80.2%</text>
<text x="410.07199999999995" y="643.5" font-size="12.5" fill="#00806B" font-weight="800">83.8%</text>
<text x="64" y="689" font-size="14" fill="#123641" font-weight="800">Xi 2025 · randomised (recurrent ≤5 cm)</text>
<text x="64" y="708" font-size="12.5" fill="#6B8084">2-yr local progression-free survival</text>
<line x1="323.6" y1="731" x2="483.1" y2="731" stroke="#B9AE94" stroke-width="2"/>
<circle cx="323.6" cy="731" r="7" fill="#96790F"/>
<circle cx="483.1" cy="731" r="7" fill="#00806B"/>
<text x="312.55199999999996" y="735.5" font-size="12.5" fill="#96790F" font-weight="800" text-anchor="end">75.8%</text>
<text x="494.088" y="735.5" font-size="12.5" fill="#00806B" font-weight="800">92.7%</text>
<text x="64" y="781" font-size="14" fill="#123641" font-weight="800">Yoon 2020 · prospective II (single arm)</text>
<text x="64" y="800" font-size="12.5" fill="#6B8084">2-yr local control (97.1% at 5 yr)</text>
<circle cx="552.0" cy="823" r="7" fill="#00806B"/>
<text x="541.0" y="827.5" font-size="12.5" fill="#00806B" font-weight="800" text-anchor="end">100%</text>
<text x="64" y="873" font-size="14" fill="#123641" font-weight="800">HyTEC 2021 · pooled (single arm)</text>
<text x="64" y="892" font-size="12.5" fill="#6B8084">2-yr local control</text>
<circle cx="448.2" cy="915" r="7" fill="#00806B"/>
<text x="437.16" y="919.5" font-size="12.5" fill="#00806B" font-weight="800" text-anchor="end">89%</text>
<rect x="44" y="1025" width="532" height="190" rx="16" fill="none" stroke="#C9A83E" stroke-width="2"/>
<text x="64" y="1055" font-size="15" fill="#8F7418" font-weight="800">Overall survival: no demonstrable difference —</text>
<text x="64" y="1077" font-size="15" fill="#8F7418" font-weight="800">not 'SBRT is better across the board'</text>
<text x="64" y="1099" font-size="13" fill="#345963">Wahl 2-yr OS 53% vs 46% (similar); matched NCDB</text>
<text x="64" y="1121" font-size="13" fill="#345963">data favoured RFA at 5 yr (29.8% vs 19.3%, liver</text>
<text x="64" y="1143" font-size="13" fill="#345963">function unrecorded); meta-analysis: none at 3/5 yr.</text>
<text x="64" y="1165" font-size="13" fill="#345963">Kim 2020: SBRT arm started worse (BCLC B–C 65%</text>
<text x="64" y="1187" font-size="13" fill="#345963">vs 16%) yet local recurrence was lower.</text>
<text x="44" y="1239" font-size="12" fill="#6B8084">Schematic, redrawn from Wahl 2016, Xi 2025, Yoon 2020,</text>
<text x="44" y="1259" font-size="12" fill="#6B8084">Ohri 2021, Kim 2020, Lu 2003, Kang 2015 and BCLC 2022 |</text>
<text x="44" y="1279" font-size="12" fill="#6B8084">cohorts and endpoints differ; not directly comparable</text>
  </g>
</svg>
