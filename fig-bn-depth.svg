<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="757" viewBox="0 0 1440 757" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">中子走得到哪裡</title>
  <desc id="d">深度限制不是「還沒研究到」，是物理。這張圖是 BNCT 適應症清單 為什麼這麼短的主要理由。 八公分是可引用的最深數據點，不是一條被量出來的界線；再深下去，正常組織的代價開始追上好處。 肝、肺、胰臟、深部骨盆腔落在這條線之外——那不是還沒輪到，是中子到不了。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#123641" opacity=".10"/><line x1="0" y1="0" x2="0" y2="8" stroke="#123641" stroke-width="2.2" opacity=".75"/></pattern><pattern id="hatchlite" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#123641" stroke-width="1.4" opacity=".22"/></pattern><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="757" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="78" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">PENETRATION</text>
<text x="84" y="140" font-size="44" fill="#123641" font-weight="800" class="r">中子走得到哪裡</text>
<text x="84" y="192" font-size="21" fill="#527078">深度限制不是「還沒研究到」，是物理。這張圖是 BNCT 適應症清單</text>
<text x="84" y="223" font-size="21" fill="#527078">為什麼這麼短的主要理由。</text>
<text x="84" y="282" font-size="19" fill="#123641" font-weight="700">熱中子束　通量峰值在皮下約 2–3 公分</text>
<rect x="84" y="315" width="1272" height="38" rx="8" fill="#123641" opacity="0.05"/>
<rect x="84" y="315" width="356" height="38" rx="8" fill="#5C77C4" opacity="0.88"/>
<text x="98" y="341" font-size="16" fill="#FFFFFF" font-weight="700">十公分處只剩峰值約十分之一</text>
<text x="84" y="377" font-size="19" fill="#123641" font-weight="700">超熱中子　可涵蓋皮下約 6–8 公分的腫瘤</text>
<rect x="84" y="410" width="1272" height="38" rx="8" fill="#123641" opacity="0.05"/>
<rect x="84" y="410" width="890" height="38" rx="8" fill="#A98722" opacity="0.88"/>
<text x="98" y="436" font-size="16" fill="#FFFFFF" font-weight="700">現行治療用的就是這一種</text>
<text x="84" y="472" font-size="19" fill="#123641" font-weight="700">腦部中線腫瘤　約 8 公分深處，治療比仍大於 1</text>
<rect x="84" y="505" width="1272" height="38" rx="8" fill="#123641" opacity="0.05"/>
<rect x="84" y="505" width="1017" height="38" rx="8" fill="#00806B" opacity="0.88"/>
<text x="98" y="531" font-size="16" fill="#FFFFFF" font-weight="700">文獻上找得到最深的可引用數據點</text>
<rect x="84" y="591" width="1272" height="2" rx="1" fill="#A98722" opacity="0.5"/>
<text x="84" y="625" font-size="19" fill="#345963" font-weight="700">八公分是可引用的最深數據點，不是一條被量出來的界線；再深下去，正常組織的代價開始追上好處。</text>
<text x="84" y="655" font-size="19" fill="#345963" font-weight="700">肝、肺、胰臟、深部骨盆腔落在這條線之外——那不是還沒輪到，是中子到不了。</text>
<text x="84" y="693" font-size="16" fill="#6B8084">示意圖，依 Current Oncology 2022 與 Barth 等 2012 的敘述重繪；長條長度為示意，非深度比例尺。</text>
  </g>
</svg>
