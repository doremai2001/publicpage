<rect x="336" y="452" width="180" height="34" rx="13" fill="#123641"/>
<text x="426.1375" y="474.94" font-size="16.5" fill="#F7F1E4" font-weight="800" text-anchor="middle">Routine, self-pay</text>
<text x="338" y="514" font-size="15.5" fill="#345963">zero NHI items</text>
