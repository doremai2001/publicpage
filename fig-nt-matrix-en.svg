<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="950" viewBox="0 0 1440 950" role="img" aria-labelledby="t d">
  <title id="t">Four technologies, four jurisdictions</title>
  <desc id="d">Grid of proton, carbon-ion, FLASH and BNCT status in Taiwan, the US, the EU and Japan. Protons: routine self-pay in Taiwan (NHI covers three codes under age 19), device-cleared in the US and EU, many covered indications in Japan. Carbon ions: routine self-pay in Taiwan with zero NHI items, no pathway in the US, centres in Europe, covered in Japan. FLASH: not even a registered trial in Taiwan, in trials in the US and EU, unknown in Japan. BNCT: trials plus a special emergency-access route in Taiwan, no approved boron drug in the US, no record found in the EU, approved and covered for head and neck cancer in Japan. As of August 2026.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="950" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="86" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">REGULATORY STATUS GRID</text>
<text x="84" y="148" font-size="44" fill="#123641" font-weight="800" class="r">One technology, four identities</text>
<text x="84" y="194" font-size="21" fill="#527078">Each cell abbreviates regulatory + coverage status; “Unknown” = no citable source found.</text>
<rect x="84" y="222" width="172" height="30" rx="11" fill="#8F7418"/>
<text x="170.25" y="242.4" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="middle">Approved + covered</text>
<rect x="272" y="222" width="164" height="30" rx="11" fill="#123641"/>
<text x="354.625" y="242.4" font-size="15" fill="#F7F1E4" font-weight="800" text-anchor="middle">Routine, self-pay</text>
<rect x="453" y="222" width="140" height="30" rx="11" fill="#4E7A87"/>
<text x="522.5" y="242.4" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="middle">Device cleared</text>
<rect x="608" y="222" width="98" height="30" rx="11" fill="#D8C78F"/>
<text x="657.375" y="242.4" font-size="15" fill="#123641" font-weight="800" text-anchor="middle">In trials</text>
<rect x="722" y="222" width="106" height="30" rx="11" fill="none" stroke="#8A8375" stroke-width="2"/>
<text x="775.75" y="242.4" font-size="15" fill="#6B6455" font-weight="800" text-anchor="middle">No pathway</text>
<rect x="845" y="222" width="82" height="30" rx="11" fill="#EAE3D1" stroke="#9A9282" stroke-width="2" stroke-dasharray="6 4"/>
<text x="885.875" y="242.4" font-size="15" fill="#6B6455" font-weight="800" text-anchor="middle">Unknown</text>
<text x="1356" y="242" font-size="17" fill="#8F7418" font-weight="800" text-anchor="end">As of 2026-08</text>
<text x="449.5" y="282" font-size="21" fill="#123641" font-weight="800" text-anchor="middle">Taiwan</text>
<text x="708.5" y="282" font-size="21" fill="#123641" font-weight="800" text-anchor="middle">United States</text>
