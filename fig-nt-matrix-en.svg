<rect x="336" y="590" width="117" height="34" rx="13" fill="none" stroke="#8A8375" stroke-width="2"/>
<text x="394.375" y="612.94" font-size="16.5" fill="#6B6455" font-weight="800" text-anchor="middle">No pathway</text>
