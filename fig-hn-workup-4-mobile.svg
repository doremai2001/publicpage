<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1600" viewBox="0 0 720 1600" role="img" aria-labelledby="title desc">
  <title id="title">正子乾淨不等於頸部零風險</title><desc id="desc">PET 對隱藏性頸部淋巴結轉移的敏感度有限，不能單獨決定是否省略頸部治療。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F5F0E5"/><stop offset="1" stop-color="#E8E0D0"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".14"/></filter><style>.z{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Microsoft JhengHei",serif}.t{fill:#123641;font-size:46px;font-weight:900}.sub{fill:#527078;font-size:22px}.big{font-size:64px;font-weight:900}.ct{font-size:29px;font-weight:900}.body{font-size:21px}.sm{fill:#6B8084;font-size:17px}</style></defs>
  <rect width="720" height="1600" rx="34" fill="url(#bg)"/>
  <g class="z"><text x="48" y="64" fill="#A98722" font-size="17" font-weight="900" letter-spacing="3">PET-CT · READ THE NEGATIVE</text><text x="48" y="128" class="t r">正子乾淨</text><text x="48" y="184" class="t r">不等於頸部零風險</text><text x="48" y="232" class="sub">微小轉移可能不會亮；陰性不能單獨</text><text x="48" y="268" class="sub">推翻原本的頸部處理計畫。</text>
    <g filter="url(#s)"><rect x="48" y="315" width="624" height="300" rx="27" fill="#123641"/><circle cx="185" cy="440" r="78" fill="#173F49" stroke="#C9A83E" stroke-width="11"/><text x="185" y="461" text-anchor="middle" fill="#F7F1E4" class="big">58%</text><text x="302" y="405" fill="#F2D879" font-size="22" font-weight="900">以病人為單位</text><text x="302" y="446" fill="#D4E0DF" class="body">約四成隱藏轉移</text><text x="302" y="482" fill="#D4E0DF" class="body">可能未被偵測</text><line x1="82" y1="550" x2="638" y2="550" stroke="#52767C" stroke-width="2"/><text x="82" y="588" fill="#B9CECD" font-size="19">頸部分區為單位的敏感度更降至 53%</text></g>
    <g filter="url(#s)"><rect x="48" y="650" width="624" height="265" rx="27" fill="#173F49"/><text x="82" y="706" fill="#F7F1E4" class="ct">亮起來，也不是診斷</text><circle cx="100" cy="761" r="18" fill="#EF8A55"/><circle cx="151" cy="761" r="13" fill="#F0C65E"/><circle cx="197" cy="761" r="9" fill="#D68C60"/><text x="235" y="768" fill="#D4E0DF" class="body">發炎、感染也可能亮</text><text x="82" y="820" fill="#D4E0DF" class="body">熱點的意思是「需要再確認」</text><text x="82" y="869" fill="#F2D879" font-size="20" font-weight="900">特異度約 87–97%</text></g>
    <g filter="url(#s)"><rect x="48" y="950" width="624" height="235" rx="27" fill="#173F49"/><circle cx="99" cy="1007" r="24" fill="#C9A83E"/><path d="M88 1008l8 8 16-20" fill="none" stroke="#123641" stroke-width="5"/><text x="144" y="1018" fill="#F7F1E4" class="ct">正子真正擅長</text><text x="82" y="1070" fill="#D4E0DF" class="body">全身分期、遠端轉移、第二個原發癌</text><text x="82" y="1112" fill="#F2D879" font-size="20" font-weight="900">它提供全身地圖，找到意料外病灶。</text></g>
    <g filter="url(#s)"><rect x="48" y="1220" width="624" height="250" rx="27" fill="#FFF"/><circle cx="99" cy="1277" r="24" fill="#D8C78F"/><path d="M89 1267l20 20M109 1267l-20 20" stroke="#123641" stroke-width="5"/><text x="144" y="1288" fill="#123641" class="ct">正子不能代替</text><text x="82" y="1340" fill="#48666D" class="body">依位置、厚度與分期做的風險判斷</text><text x="82" y="1382" fill="#99791B" font-size="20" font-weight="900">不能因為沒亮，就省略頸部治療。</text></g>
    <text x="48" y="1542" class="sm">資料來源：文章參考資料 [5][6]｜資訊圖為原創重繪</text>
  </g>
</svg>
