<line x1="324.32" y1="872.34" x2="315.28" y2="881.38" stroke="#96790F" stroke-width="1.8" stroke-linecap="round"/>
<text x="279.85" y="851.23" font-size="11" fill="#96790F" font-weight="700" text-anchor="end">迷走神經切斷</text>
<line x1="279.85" y1="896.46" x2="279.85" y2="1054.77" stroke="#5C77C4" stroke-width="2.5" stroke-linecap="round"/>
<line x1="279.85" y1="1054.77" x2="283.92" y2="1045.64" stroke="#5C77C4" stroke-width="2.5" stroke-linecap="round"/>
<line x1="279.85" y1="1054.77" x2="275.77" y2="1045.64" stroke="#5C77C4" stroke-width="2.5" stroke-linecap="round"/>
<text x="272.31" y="979.38" font-size="12" fill="#5C77C4" font-weight="800" text-anchor="end">食物走管狀胃</text>
<text x="272.31" y="995.58" font-size="11" fill="#5C77C4" font-weight="600" text-anchor="end">靠重力，容易逆流</text>
<text x="249.69" y="1122.62" font-size="11" fill="#6B8084" font-weight="600" text-anchor="middle">原本放胃的位置空了</text>
<g filter="url(#sh)"><rect x="44" y="1226" width="532" height="175.2" rx="18" fill="#FFFFFF"/></g>
<rect x="62" y="1244" width="68.5" height="21.88" rx="10.94" fill="#96790F"/>
<text x="96.25" y="1259.44" font-size="12.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">少量多餐</text>
<circle cx="66" cy="1288" r="3" fill="#96790F"/>
<text x="76" y="1292.2" font-size="12" fill="#345963">胃變成一條管子、容量變小，一次吃不了原本的量。</text>
<circle cx="66" cy="1313.04" r="3" fill="#96790F"/>
<text x="76" y="1317.24" font-size="12" fill="#345963">瑞典全國世代（n=226）：術後 6 個月 63.7% 體重掉 &gt;10%、20.4% 掉 &gt;20%；體重可持續</text>
<text x="76" y="1334.28" font-size="12" fill="#345963">掉到 3 年。</text>
<circle cx="66" cy="1355.12" r="3" fill="#96790F"/>
<text x="76" y="1359.32" font-size="12" fill="#345963">延遲性胃排空：早期 15.9%、晚期 9.4%（125 篇統合）；幽門處置各院不同、證據不站</text>
<text x="76" y="1376.36" font-size="12" fill="#345963">邊。</text>
<g filter="url(#sh)"><rect x="44" y="1413.2" width="532" height="158.16" rx="18" fill="#FFFFFF"/></g>
<rect x="62" y="1431.2" width="81.25" height="21.88" rx="10.94" fill="#5C77C4"/>
<text x="102.62" y="1446.64" font-size="12.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">傾倒症候群</text>
<circle cx="66" cy="1475.2" r="3" fill="#5C77C4"/>
<text x="76" y="1479.4" font-size="12" fill="#345963">食物太快進小腸：早期（30 分內）心悸、冒汗、想躺下；晚期（1–3 小時）低血糖。</text>
<circle cx="66" cy="1500.24" r="3" fill="#5C77C4"/>
<text x="76" y="1504.44" font-size="12" fill="#345963">多常見看定義：顯著症狀 11%（瑞典 n=384，1 年）；問卷式問到 67–78%。</text>
<circle cx="66" cy="1525.28" r="3" fill="#5C77C4"/>
<text x="76" y="1529.48" font-size="12" fill="#345963">國際共識：飲食調整是第一步（少量多餐、固液分開、少單純糖）；晚期傾倒可用</text>
<text x="76" y="1546.52" font-size="12" fill="#345963">acarbose。</text>
<g filter="url(#sh)"><rect x="44" y="1583.36" width="532" height="158.16" rx="18" fill="#FFFFFF"/></g>
<rect x="62" y="1601.36" width="81.25" height="21.88" rx="10.94" fill="#B04A4A"/>
<text x="102.62" y="1616.8" font-size="12.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">逆流與夜咳</text>
<circle cx="66" cy="1645.36" r="3" fill="#B04A4A"/>
<text x="76" y="1649.56" font-size="12" fill="#345963">下食道括約肌沒了、胃在胸腔——躺平就容易回流。</text>
<circle cx="66" cy="1670.4" r="3" fill="#B04A4A"/>
<text x="76" y="1674.6" font-size="12" fill="#345963">瑞典世代（n=241，1 年）：27% 嚴重逆流；有逆流者睡眠障礙 OR 2.3。殘存食道黏膜損</text>
<text x="76" y="1691.64" font-size="12" fill="#345963">傷 5 年 55%（德國 n=50，常規 PPI 下）。</text>
<circle cx="66" cy="1712.48" r="3" fill="#B04A4A"/>
<text x="76" y="1716.68" font-size="12" fill="#345963">墊高上半身、餐後不平躺是門診慣例——沒有食道切除術後的對照研究，所以不標公分數。</text>
<text x="44" y="1766.02" font-size="12.5" fill="#6B8084" font-weight="600">晚期傾倒的低血糖可能昏厥——有這種症狀要回診，不要自行斷食。體重掉超過一成、吞嚥又變</text>
<text x="44" y="1784.15" font-size="12.5" fill="#6B8084" font-weight="600">差，先排除狹窄與復發，不要只當「吃太少」。</text>
<text x="44" y="1824.27" font-size="12" fill="#6B8084">示意圖，依 Martin 2007／2009（瑞典體重世代）、Lin 2025（傾倒統合）、Lagergren 2026（瑞</text>
<text x="44" y="1842.27" font-size="12" fill="#6B8084">典傾倒世代）、Scarpellini 2020（傾倒國際共識）、Lagergren 2021（瑞典逆流世代）、Fuchs</text>
<text x="44" y="1860.27" font-size="12" fill="#6B8084">2018（Ivor Lewis 術後內視鏡世代 n=50）與 Sivakumar 2025（延遲排空統合 125 篇）重繪｜術</text>
<text x="44" y="1878.27" font-size="12" fill="#6B8084">式、吻合位置與幽門處置依外科醫師與各院慣例而異，數字來自不同世代、不可直接互比</text>
  </g>
</svg>
