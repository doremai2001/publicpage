<text x="166.19" y="785.68" font-size="13" fill="#FFFFFF" font-weight="800" text-anchor="middle">術後（食道切除＋胃管重建）</text>
<path d="M287.38 813.54 L332.62 813.54 L332.62 851.23 C 385.38 858.77, 430.62 877.62, 430.62 919.08 L430.62 1175.38 Q 430.62 1190.46 415.54 1190.46 L204.46 1190.46 Q 189.38 1190.46 189.38 1175.38 L189.38 919.08 C 189.38 877.62, 234.62 858.77, 287.38 851.23 Z" fill="#F3EDE0" stroke="#C9C0AC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
