<circle cx="310" cy="877.62" r="11.31" fill="none" stroke="#B04A4A" stroke-width="3"/>
<text x="326.58" y="878.35" font-size="12" fill="#B04A4A" font-weight="800">吻合口</text>
<text x="326.58" y="894.55" font-size="11" fill="#B04A4A" font-weight="600">胸內（Ivor Lewis）或頸部（McKeown）</text>
<text x="322.06" y="949.23" font-size="12" fill="#7A6E58" font-weight="700">胃被拉進胸腔，做成一條管子</text>
<text x="322.06" y="965.43" font-size="11" fill="#7A6E58" font-weight="600">沒有括約肌、容量變小</text>
<circle cx="364.28" cy="1069.85" r="6.78" fill="#B9AF98"/>
<text x="374.83" y="1075.86" font-size="12" fill="#7A6E58" font-weight="700">幽門（靠近橫膈）</text>
<path d="M368.8 1074.37 C 400.46 1084.92, 400.46 1130.15, 370.31 1137.69" fill="none" stroke="#DED6C4" stroke-width="6.78" stroke-linecap="round" stroke-linejoin="round"/>
