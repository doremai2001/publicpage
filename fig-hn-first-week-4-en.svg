<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">Several work-up tracks move forward together after diagnosis</title><desc id="desc">After biopsy, pathology review, imaging and endoscopic staging, and dental, nutrition and fitness assessment can run in parallel before multidisciplinary review and a treatment plan.</desc>
  <defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A2731"/><stop offset="1" stop-color="#123D48"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#041318" flood-opacity=".25"/></filter><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#C9A83E"/></marker><style>.sans{font-family:Arial,"Noto Sans",sans-serif}.serif{font-family:Georgia,"Noto Serif",serif}.title{fill:#F5F0E3;font-size:49px;font-weight:700}.sub{fill:#AFC3C5;font-size:23px}.ct{fill:#F5F0E3;font-size:27px;font-weight:700}.cb{fill:#C8D7D7;font-size:20px}.small{fill:#9FB7BA;font-size:16px}.step{fill:#0A2731;font-size:22px;font-weight:800}</style></defs>
  <rect width="1440" height="920" rx="36" fill="url(#b)"/><circle cx="1275" cy="80" r="310" fill="none" stroke="#31535A" stroke-width="2" opacity=".45"/><circle cx="1275" cy="80" r="230" fill="none" stroke="#C9A83E" stroke-width="2" opacity=".18"/>
  <g class="sans"><text x="92" y="92" class="small" fill="#C9A83E" letter-spacing="5">AFTER THE DIAGNOSIS</text><text x="92" y="160" class="title serif">Not idle waiting: several tracks move forward at once</text><text x="92" y="207" class="sub">The exact order varies. The goal is to assemble the right information before choosing the whole treatment course.</text>
    <g filter="url(#s)"><rect x="92" y="320" width="208" height="205" rx="24" fill="#F3EDDE"/><circle cx="142" cy="370" r="25" fill="#C9A83E"/><text x="142" y="378" text-anchor="middle" class="step">1</text><text x="126" y="423" fill="#143641" font-size="24" font-weight="800">Biopsy</text><text x="126" y="452" fill="#143641" font-size="24" font-weight="800">confirms</text><text x="126" y="481" fill="#143641" font-size="24" font-weight="800">diagnosis</text><text x="126" y="507" fill="#46636A" font-size="14">Staging &amp; preparation begin</text></g>
    <path d="M315 422h55" stroke="#C9A83E" stroke-width="5" marker-end="url(#a)"/><path d="M360 422V316m0 106v260" stroke="#6D8588" stroke-width="3" opacity=".8"/>
    <g filter="url(#s)"><rect x="395" y="258" width="455" height="165" rx="24" fill="#173F49" stroke="#3B626A" stroke-width="2"/><circle cx="443" cy="305" r="23" fill="#C9A83E"/><text x="443" y="313" text-anchor="middle" class="step">A</text><text x="485" y="316" class="ct">Pathology review</text><text x="435" y="361" class="cb">Cell type and grade</text><text x="435" y="393" class="cb">p16 when indicated in oropharyngeal cancer</text></g>
    <g filter="url(#s)"><rect x="395" y="453" width="455" height="165" rx="24" fill="#173F49" stroke="#3B626A" stroke-width="2"/><circle cx="443" cy="500" r="23" fill="#C9A83E"/><text x="443" y="508" text-anchor="middle" class="step">B</text><text x="485" y="511" class="ct">Imaging &amp; endoscopic staging</text><text x="435" y="556" class="cb">Head and neck MRI or CT</text><text x="435" y="588" class="cb">PET and mucosal examination when needed</text></g>
    <g filter="url(#s)"><rect x="395" y="648" width="455" height="165" rx="24" fill="#173F49" stroke="#3B626A" stroke-width="2"/><circle cx="443" cy="695" r="23" fill="#C9A83E"/><text x="443" y="703" text-anchor="middle" class="step">C</text><text x="485" y="706" class="ct">Before treatment</text><text x="435" y="751" class="cb">Dental, nutrition, blood tests, heart and lungs</text><text x="435" y="783" class="cb">Many of these can run alongside imaging</text></g>
    <path d="M870 340h62m-62 195h62m-62 195h62" stroke="#6D8588" stroke-width="3"/><path d="M930 340v390m0-195h55" stroke="#C9A83E" stroke-width="5" marker-end="url(#a)"/>
    <g filter="url(#s)"><rect x="1010" y="374" width="338" height="323" rx="28" fill="#F3EDDE"/><circle cx="1179" cy="429" r="37" fill="#C9A83E"/><path d="M1160 434h38m-32-12h26m-20-12h14" stroke="#0A2731" stroke-width="5" stroke-linecap="round"/><text x="1179" y="501" text-anchor="middle" fill="#143641" font-size="25" font-weight="800">Multidisciplinary</text><text x="1179" y="533" text-anchor="middle" fill="#143641" font-size="25" font-weight="800">review</text><text x="1179" y="578" text-anchor="middle" fill="#46636A" font-size="18">Pathology, imaging, fitness</text><text x="1179" y="607" text-anchor="middle" fill="#46636A" font-size="18">and the patient’s goals</text><rect x="1049" y="633" width="260" height="46" rx="23" fill="#143641"/><text x="1179" y="663" text-anchor="middle" fill="#F5F0E3" font-size="15" font-weight="700">Plan ready → treatment begins</text></g>
    <text x="92" y="870" class="small">Adapted from article reference [7], Taipei Medical University healthcare system guideline · Original infographic</text>
  </g>
</svg>
