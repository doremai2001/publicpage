<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="913" viewBox="0 0 1440 913" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">兩個都是真的數字</title>
  <desc id="d">同一個試驗，同一批 27 位復發膠質母細胞瘤病人。 影像幾乎沒有反應，一年後卻有近八成的人還活著。 27 人裡有 21 人（78%）在惡化後接受了 bevacizumab。所以這個比較的實際內容是 「BNCT 之後再接 bevacizumab」對上「bevacizumab 單藥」，而且對照組是四到六年前的世代。 第三級以上治療相關不良事件 81.5%；腦水腫 48.1%。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#123641" opacity=".10"/><line x1="0" y1="0" x2="0" y2="8" stroke="#123641" stroke-width="2.2" opacity=".75"/></pattern><pattern id="hatchlite" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#123641" stroke-width="1.4" opacity=".22"/></pattern><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="913" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="78" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">HOW TO READ A TRIAL</text>
<text x="84" y="140" font-size="44" fill="#123641" font-weight="800" class="r">兩個都是真的數字</text>
<text x="84" y="192" font-size="21" fill="#527078">同一個試驗，同一批 27 位復發膠質母細胞瘤病人。</text>
<text x="84" y="223" font-size="21" fill="#527078">影像幾乎沒有反應，一年後卻有近八成的人還活著。</text>
<rect x="84" y="282" width="620" height="203" rx="16" fill="#123641" opacity="0.05"/>
<rect x="84" y="282" width="620" height="6" rx="3" fill="#5C77C4" opacity="0.9"/>
<text x="106" y="328" font-size="20" fill="#5C77C4" font-weight="800">影像看到的</text>
<text x="106" y="370" font-size="16" fill="#527078">RANO 影像反應率</text>
<text x="682" y="370" font-size="25" fill="#123641" font-weight="800" text-anchor="end">3.7%</text>
<text x="106" y="408" font-size="16" fill="#527078">中位無惡化存活</text>
<text x="682" y="408" font-size="25" fill="#123641" font-weight="800" text-anchor="end">0.9 個月</text>
<text x="106" y="450" font-size="15" fill="#6B8084">腦部照射後常有假性惡化，RANO 在這個情境下會失真</text>
<rect x="736" y="282" width="620" height="203" rx="16" fill="#123641" opacity="0.05"/>
<rect x="736" y="282" width="620" height="6" rx="3" fill="#A98722" opacity="0.9"/>
<text x="758" y="328" font-size="20" fill="#A98722" font-weight="800">存活看到的</text>
<text x="758" y="370" font-size="16" fill="#527078">1 年存活率</text>
<text x="1334" y="370" font-size="25" fill="#123641" font-weight="800" text-anchor="end">79.2%</text>
<text x="758" y="408" font-size="16" fill="#527078">中位總存活</text>
<text x="1334" y="408" font-size="25" fill="#123641" font-weight="800" text-anchor="end">18.9 個月</text>
<text x="758" y="450" font-size="15" fill="#6B8084">95% 信賴區間 57.0–90.8</text>
<text x="84" y="517" font-size="18" fill="#123641" font-weight="700">JG002（BNCT，n=27）</text>
<rect x="84" y="549" width="1272" height="34" rx="8" fill="#123641" opacity="0.05"/>
<rect x="84" y="549" width="1144" height="34" rx="8" fill="#A98722" opacity="0.88"/>
<text x="98" y="572" font-size="16" fill="#FFFFFF" font-weight="700">18.9 個月</text>
<text x="84" y="605" font-size="18" fill="#123641" font-weight="700">JO22506（bevacizumab 單藥，n=31，2012 年）</text>
<rect x="84" y="637" width="1272" height="34" rx="8" fill="#123641" opacity="0.05"/>
<rect x="84" y="637" width="636" height="34" rx="8" fill="#123641" opacity="0.14" stroke="#123641" stroke-width="2"/>
<rect x="84" y="637" width="636" height="34" rx="8" fill="url(#hatchlite)"/>
<text x="98" y="660" font-size="16" fill="#345963" font-weight="700">10.5 個月　非同期歷史對照</text>
<rect x="84" y="717" width="1272" height="2" rx="1" fill="#A98722" opacity="0.5"/>
<text x="84" y="751" font-size="19" fill="#345963" font-weight="700">27 人裡有 21 人（78%）在惡化後接受了 bevacizumab。所以這個比較的實際內容是</text>
<text x="84" y="781" font-size="19" fill="#345963" font-weight="700">「BNCT 之後再接 bevacizumab」對上「bevacizumab 單藥」，而且對照組是四到六年前的世代。</text>
<text x="84" y="811" font-size="19" fill="#345963" font-weight="700">第三級以上治療相關不良事件 81.5%；腦水腫 48.1%。</text>
<text x="84" y="849" font-size="16" fill="#6B8084">示意圖，依 Kawabata 等 2021（Neuro-Oncology Advances）與 Nagane 等 2012（Jpn J Clin Oncol）重繪；長條為存活月數的相對長度。</text>
  </g>
</svg>
