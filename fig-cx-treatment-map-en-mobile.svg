<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1518" viewBox="0 0 620 1518" role="img" aria-labelledby="t d">
  <title id="t">Primary treatment by stage: no surgery is not giving up</title>
  <desc id="d">Schematic map of primary treatment by stage, after the ESGO/ESTRO/ESP 2023 guideline. IA1: conisation alone is definitive treatment; IA2: conisation or simple hysterectomy; IB1–IB2/IIA1 node-negative: radical surgery OR definitive chemoradiotherapy plus brachytherapy — one route, not both, since over half of those operated on later need radiotherapy too and severe complications are highest with combined treatment; IB3/IIA2 node-negative is a grey zone for specialist discussion; IB3–IVA (including node-positive) is treated with definitive concurrent chemoradiotherapy plus image-guided brachytherapy with curative intent — the chemoradiotherapy arm of a contemporary trial reached 72% five-year overall survival, so no surgery is not giving up; routine hysterectomy after chemoradiotherapy adds nothing.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><pattern id="hz" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#96790F" stroke-width="2" opacity="0.55"/></pattern><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="620" height="1518" rx="30" fill="url(#bg)"/>
  <g class="z">
<text x="44" y="62" font-size="14" fill="#A98722" font-weight="800" letter-spacing="3.5px">STAGE → PRIMARY TREATMENT</text>
<text x="44" y="112" font-size="30" fill="#123641" font-weight="800" class="r">Primary treatment by stage:</text>
<text x="44" y="152" font-size="30" fill="#123641" font-weight="800" class="r">not giving up</text>
<text x="44" y="194" font-size="14.5" fill="#527078">The principle: surgery or radiotherapy —</text>
<text x="44" y="216" font-size="14.5" fill="#527078">pick one route and finish it;</text>
<text x="44" y="238" font-size="14.5" fill="#527078">avoid doing both (double toxicity).</text>
<rect x="44" y="292" width="532" height="74" rx="16" fill="none" stroke="#C9A83E" stroke-width="2"/>
<text x="66" y="322" font-size="14.5" fill="#8F7418" font-weight="800">The principle: avoid doing both surgery and</text>
<text x="66" y="346" font-size="14.5" fill="#8F7418" font-weight="800">radiotherapy (double toxicity) — ESGO [IV, A]</text>
<g filter="url(#sh)"><rect x="44" y="388" width="532" height="146" rx="18" fill="#FFFFFF"/></g>
<rect x="66" y="406" width="200" height="30" rx="13" fill="#5C77C4"/>
<text x="166" y="427" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="middle">IA1</text>
<text x="280" y="427" font-size="13.5" fill="#6B8084">invasion ≤3 mm</text>
<text x="66" y="460" font-size="16.5" fill="#123641" font-weight="800">Conisation alone is definitive (clear margins)</text>
<text x="66" y="484" font-size="13.8" fill="#345963">Hysterectomy does not improve the outcome;</text>
<text x="66" y="506" font-size="13.8" fill="#345963">radical surgery is overtreatment.</text>
<g filter="url(#sh)"><rect x="44" y="550" width="532" height="96" rx="18" fill="#FFFFFF"/></g>
<rect x="66" y="568" width="200" height="30" rx="13" fill="#5C77C4"/>
<text x="166" y="589" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="middle">IA2</text>
<text x="280" y="589" font-size="13.5" fill="#6B8084">invasion &gt;3–≤5 mm</text>
<text x="66" y="622" font-size="16.5" fill="#123641" font-weight="800">Conisation or simple hysterectomy</text>
<g filter="url(#sh)"><rect x="44" y="662" width="532" height="256" rx="18" fill="#FFFFFF"/></g>
<rect x="66" y="680" width="100" height="30" rx="13" fill="#5C77C4"/>
<rect x="166" y="680" width="100" height="30" rx="13" fill="#00806B"/>
<text x="166" y="701" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="middle">IB1–IB2 / IIA1</text>
<text x="280" y="701" font-size="13.5" fill="#6B8084">node-negative</text>
<text x="66" y="734" font-size="16.5" fill="#123641" font-weight="800">Surgery OR chemoradiotherapy — one, not both</text>
<text x="66" y="758" font-size="13.8" fill="#345963">Survival is equivalent: 72% vs 77% at 20 years,</text>
<text x="66" y="780" font-size="13.8" fill="#345963">no difference (Landoni RCT, FIGO IB–IIA).</text>
<text x="66" y="802" font-size="13.8" fill="#345963">The trap: over half of those operated on later</text>
<text x="66" y="824" font-size="13.8" fill="#345963">needed radiotherapy too (54% if ≤4 cm,</text>
<text x="66" y="846" font-size="13.8" fill="#345963">84% if &gt;4 cm); complications are highest when</text>
<text x="66" y="868" font-size="13.8" fill="#345963">both are done — if predictable, go straight</text>
<text x="66" y="890" font-size="13.8" fill="#345963">to chemoradiotherapy.</text>
<g filter="url(#sh)"><rect x="44" y="934" width="532" height="146" rx="18" fill="#FFFFFF"/></g>
<rect x="66" y="952" width="200" height="30" rx="13" fill="none" stroke="#9A9282" stroke-width="2" stroke-dasharray="6 5"/>
<text x="166" y="973" font-size="15" fill="#9A9282" font-weight="800" text-anchor="middle">IB3 / IIA2</text>
<text x="280" y="973" font-size="13.5" fill="#6B8084">node-negative</text>
<text x="66" y="1006" font-size="16.5" fill="#123641" font-weight="800">Grey zone: both routes on the table</text>
<text x="66" y="1030" font-size="13.8" fill="#345963">Evidence is limited; discuss both options with</text>
<text x="66" y="1052" font-size="13.8" fill="#345963">a multidisciplinary team at a high-volume centre.</text>
<g filter="url(#sh)"><rect x="44" y="1096" width="532" height="168" rx="18" fill="#FFFFFF"/></g>
<rect x="66" y="1114" width="200" height="30" rx="13" fill="#00806B"/>
<text x="166" y="1135" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="middle">IB3–IVA</text>
<text x="280" y="1135" font-size="13.5" fill="#6B8084">incl. node-positive</text>
<text x="66" y="1168" font-size="16.5" fill="#123641" font-weight="800">Definitive CCRT + brachytherapy — curative</text>
<text x="66" y="1192" font-size="13.8" fill="#345963">Not giving up: the chemoradiotherapy arm of a</text>
<text x="66" y="1214" font-size="13.8" fill="#345963">contemporary trial reached 72% 5-year overall</text>
<text x="66" y="1236" font-size="13.8" fill="#345963">survival. Brachytherapy is essential, not a boost.</text>
<g filter="url(#sh)"><rect x="44" y="1280" width="532" height="168" rx="18" fill="#FFFFFF"/></g>
<rect x="66" y="1298" width="200" height="30" rx="13" fill="none" stroke="#9A9282" stroke-width="2" stroke-dasharray="6 5"/>
<text x="166" y="1319" font-size="15" fill="#9A9282" font-weight="800" text-anchor="middle">After CCRT</text>
<text x="66" y="1352" font-size="16.5" fill="#123641" font-weight="800">No routine hysterectomy afterwards</text>
<text x="66" y="1376" font-size="13.8" fill="#345963">Randomised trials and meta-analysis show no</text>
<text x="66" y="1398" font-size="13.8" fill="#345963">survival benefit; residual disease is a separate</text>
<text x="66" y="1420" font-size="13.8" fill="#345963">question for a specialist centre.</text>
<text x="44" y="1476" font-size="12" fill="#6B8084">Schematic redrawn from ESGO/ESTRO/ESP 2023 |</text>
<text x="44" y="1496" font-size="12" fill="#6B8084">Landoni 1997/2017, INTERLACE chemoradiotherapy arm</text>
  </g>
</svg>
