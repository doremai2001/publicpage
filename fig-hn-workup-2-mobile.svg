<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1740" viewBox="0 0 720 1740" role="img" aria-labelledby="title desc">
  <title id="title">五種頭頸癌檢查的分工</title><desc id="desc">CT、MRI、PET-CT、內視鏡與切片各自回答不同問題。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E7DFCF"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><style>.z{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Microsoft JhengHei",serif}.t{fill:#123641;font-size:47px;font-weight:900}.sub{fill:#527078;font-size:23px}.ct{font-size:31px;font-weight:900}.q{font-size:21px;font-weight:900}.cb{font-size:21px}.sm{fill:#6B8084;font-size:17px}</style></defs>
  <rect width="720" height="1740" rx="34" fill="url(#bg)"/>
  <g class="z"><text x="48" y="65" fill="#A98722" font-size="17" font-weight="900" letter-spacing="4">FIVE TOOLS · FIVE QUESTIONS</text>
    <text x="48" y="130" class="t r">五種檢查，不是在比賽</text><text x="48" y="178" class="sub">每一項都在回答不同的臨床問題。</text>
    <g filter="url(#s)"><rect x="48" y="225" width="624" height="245" rx="25" fill="#FFF"/><circle cx="101" cy="281" r="29" fill="#C9A83E"/><path d="M87 281h28M101 267v28" stroke="#123641" stroke-width="5"/><text x="146" y="291" fill="#123641" class="ct">CT</text><text x="82" y="342" fill="#9A791C" class="q">骨頭與整體解剖</text><text x="82" y="389" fill="#48666D" class="cb">腫瘤大小、方向、骨皮質侵犯</text><text x="82" y="426" fill="#48666D" class="cb">手術範圍與放療靶區的重要依據</text></g>
    <g filter="url(#s)"><rect x="48" y="500" width="624" height="245" rx="25" fill="#173F49"/><circle cx="101" cy="556" r="29" fill="#C9A83E"/><path d="M87 548c14-14 27-7 29 5 2 14-12 23-29 13" fill="none" stroke="#123641" stroke-width="5"/><text x="146" y="566" style="fill:#F7F1E4" class="ct">MRI</text><text x="82" y="617" style="fill:#F2D879" class="q">深部軟組織與神經</text><text x="82" y="664" style="fill:#D4E0DF" class="cb">舌根、鼻咽、顱底、顱內延伸</text><text x="82" y="701" style="fill:#D4E0DF" class="cb">軟組織對比是主要長處</text></g>
    <g filter="url(#s)"><rect x="48" y="775" width="624" height="245" rx="25" fill="#FFF"/><circle cx="101" cy="831" r="29" fill="#C9A83E"/><circle cx="101" cy="823" r="8" fill="#123641"/><path d="M87 852c3-17 25-17 28 0" fill="none" stroke="#123641" stroke-width="5"/><text x="146" y="841" fill="#123641" class="ct">PET-CT</text><text x="82" y="892" fill="#9A791C" class="q">全身分期</text><text x="82" y="939" fill="#48666D" class="cb">遠端轉移、第二個原發癌</text><text x="82" y="976" fill="#48666D" class="cb">代謝熱點仍需結合其他資訊判讀</text></g>
    <g filter="url(#s)"><rect x="48" y="1050" width="624" height="245" rx="25" fill="#FFF"/><circle cx="101" cy="1106" r="29" fill="#D8C78F"/><path d="M87 1096c24 0 28 20 15 31-10 9-19 4-16-7 3-9 16-6 16 3" fill="none" stroke="#123641" stroke-width="5"/><text x="146" y="1116" fill="#123641" class="ct">內視鏡</text><text x="82" y="1167" fill="#9A791C" class="q">黏膜表面長什麼樣子</text><text x="82" y="1214" fill="#48666D" class="cb">直接看聲帶、下咽隱窩與鼻咽頂</text><text x="82" y="1251" fill="#48666D" class="cb">表淺病灶不是影像的強項</text></g>
    <g filter="url(#s)"><rect x="48" y="1325" width="624" height="260" rx="25" fill="#123641"/><circle cx="101" cy="1381" r="29" fill="#C9A83E"/><path d="M88 1395l13-28 10 5-14 29zM86 1402h35" fill="none" stroke="#123641" stroke-width="5"/><text x="146" y="1391" style="fill:#F7F1E4" class="ct">切片與病理</text><text x="82" y="1442" style="fill:#F2D879" class="q">這到底是什麼</text><text x="82" y="1489" style="fill:#D4E0DF" class="cb">細胞型態、分化程度、p16 等分型</text><text x="82" y="1526" style="fill:#D4E0DF" class="cb">其他檢查全部加起來也不能取代</text></g>
    <text x="48" y="1660" class="sm">依文章參考資料 [1][9] 整理｜資訊圖為原創重繪</text><text x="48" y="1694" class="sm">實際檢查依腫瘤部位與臨床情況決定</text>
  </g>
</svg>
