<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="t d">
  <title id="t">HPV natural history: the clock runs in decades</title>
  <desc id="d">Schematic timeline of HPV natural history. Infection is near-universal (modelled estimate: about 85% of people acquire HPV in their lifetime); most infections clear within one to two years (67% by 12 months, 91% by 24 months); the minority persisting beyond a year may form precancer (CIN), usually over 5 to 10 years and in under 10% of new infections; the modelled median from CIN2/3 to invasive cancer is 23.5 years, with about 1.6% progressing within 10 years. The timeline itself shows why today's diagnosis cannot reveal a partner's recent behaviour.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><pattern id="hz" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#96790F" stroke-width="2" opacity="0.55"/></pattern><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="920" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="86" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">HPV NATURAL HISTORY</text>
<text x="84" y="148" font-size="44" fill="#123641" font-weight="800" class="r">From infection to cancer, the clock runs in decades</text>
<text x="84" y="194" font-size="21" fill="#527078">Infection is the norm and so is clearance; the few that persist still take many years.</text>
<text x="84" y="224" font-size="21" fill="#527078">So today's diagnosis says nothing about a partner's recent behaviour.</text>
<path d="M190,330 C 310,341.6 330,451.8 380,504 C 415,544.6 440,582.3 470,593.9 C 600,601.15 700,605.5 800,607.82 C 950,611.3 1100,615.36 1230,616.52 L 1360,616.81 L 1360,620 L 190,620 Z" fill="#5C77C4" opacity="0.15"/>
<path d="M190,330 C 310,341.6 330,451.8 380,504 C 415,544.6 440,582.3 470,593.9" fill="none" stroke="#5C77C4" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M470,593.9 C 600,601.15 700,605.5 800,607.82 C 950,611.3 1100,615.36 1230,616.52 L 1360,616.81" fill="none" stroke="#96790F" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="470" y1="300" x2="470" y2="620" stroke="#6B8084" stroke-width="1.2" stroke-dasharray="4 5" opacity="0.7"/>
<line x1="800" y1="300" x2="800" y2="620" stroke="#6B8084" stroke-width="1.2" stroke-dasharray="4 5" opacity="0.7"/>
<line x1="1230" y1="300" x2="1230" y2="620" stroke="#6B8084" stroke-width="1.2" stroke-dasharray="4 5" opacity="0.7"/>
<line x1="150" y1="620" x2="1360" y2="620" stroke="#6B8084" stroke-width="1.5"/>
<line x1="190" y1="620" x2="190" y2="627" stroke="#6B8084" stroke-width="1.5"/>
<text x="160" y="650" font-size="18" fill="#345963" font-weight="600">Year of infection</text>
<line x1="470" y1="620" x2="470" y2="627" stroke="#6B8084" stroke-width="1.5"/>
<text x="470" y="650" font-size="18" fill="#345963" font-weight="600" text-anchor="middle">1–2 years</text>
<line x1="800" y1="620" x2="800" y2="627" stroke="#6B8084" stroke-width="1.5"/>
<text x="800" y="650" font-size="18" fill="#345963" font-weight="600" text-anchor="middle">5–10 years</text>
<line x1="1230" y1="620" x2="1230" y2="627" stroke="#6B8084" stroke-width="1.5"/>
<text x="1356" y="650" font-size="18" fill="#345963" font-weight="600" text-anchor="end">~20 years (median 23.5)</text>
<text x="1360" y="676" font-size="15" fill="#6B8084" text-anchor="end">Conceptual timeline, not to scale</text>
<text x="208" y="268" font-size="19" fill="#345963" font-weight="600">Ever infected with HPV, among people</text>
<text x="208" y="296" font-size="24" fill="#5C77C4" font-weight="800">with a partner: modelled ~85%</text>
<text x="208" y="318" font-size="15.5" fill="#6B8084">(women 84.6% / men 91.3%; US, pre-vaccine)</text>
<text x="430" y="388" font-size="19" fill="#5C77C4" font-weight="700">Most clear on their own: 67% by 12 months, 91% by 24 months</text>
<text x="430" y="412" font-size="15.5" fill="#6B8084">(clearance = no longer detectable; different cohorts)</text>
<line x1="444" y1="422" x2="392" y2="509.8" stroke="#6B8084" stroke-width="1.8" stroke-linecap="round"/>
<line x1="392" y1="509.8" x2="392.474" y2="498.81" stroke="#6B8084" stroke-width="1.8" stroke-linecap="round"/>
<line x1="392" y1="509.8" x2="401.409" y2="504.102" stroke="#6B8084" stroke-width="1.8" stroke-linecap="round"/>
<text x="486" y="520" font-size="18" fill="#345963" font-weight="600">The persisting minority is the one to watch:</text>
<text x="486" y="544" font-size="18" fill="#96790F" font-weight="800">21% develop CIN2+ within 30 months</text>
<text x="814" y="430" font-size="18" fill="#345963" font-weight="600">Precancer (CIN) takes shape, usually over 5–10 years,</text>
<text x="814" y="454" font-size="18" fill="#96790F" font-weight="800">in under 10% of new infections</text>
<text x="1352" y="330" font-size="18" fill="#345963" font-weight="600" text-anchor="end">From CIN2/3 to invasive cancer:</text>
<text x="1352" y="356" font-size="20" fill="#123641" font-weight="800" text-anchor="end">modelled median 23.5 years</text>
<line x1="1230" y1="366" x2="1230" y2="608.52" stroke="#6B8084" stroke-width="1.5"/>
<rect x="950" y="480" width="396" height="74" rx="16" fill="none" stroke="#C9A83E" stroke-width="2" stroke-dasharray="7 5"/>
<text x="972" y="510" font-size="15.5" fill="#8F7418" font-weight="700">* ~1.6% progress within 10 years (2.4% if HPV16)</text>
<text x="972" y="536" font-size="15.5" fill="#8F7418" font-weight="700">— “usually over ten years”, not “always”.</text>
<g filter="url(#sh)"><rect x="84" y="706" width="1272" height="108" rx="20" fill="#FFFFFF"/></g>
<text x="116" y="742" font-size="18" fill="#123641" font-weight="700">This timeline is the answer: it is not possible to determine who transmitted the infection, or when.</text>
<text x="116" y="768" font-size="15.5" fill="#345963">Having HPV does not mean either partner strayed; partners do not need testing (US CDC).</text>
<text x="116" y="792" font-size="15.5" fill="#345963">At ages 35–60, 85% of newly detected HPV arose with no sex or one steady partner — old infections resurfacing.</text>
<text x="84" y="894" font-size="16" fill="#6B8084">Schematic redrawn from Chesson 2014, Rodríguez 2008, Plummer 2007, Schiffman 2007, Vink 2013 and CDC 2021 | cohorts differ; not a personal forecast</text>
  </g>
</svg>
