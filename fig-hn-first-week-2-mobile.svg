<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1660" viewBox="0 0 720 1660" role="img" aria-labelledby="title desc">
  <title id="title">等待時間研究的正確讀法</title>
  <desc id="desc">大型回溯登記研究發現治療等待拉長與較差存活相關，但不能把族群資料當成個人的倒數計時。</desc>
  <defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#0B2832" flood-opacity=".14"/></filter><style>.z{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Microsoft JhengHei",serif}.t{fill:#123641;font-size:48px;font-weight:900}.sub{fill:#527078;font-size:24px}.m{fill:#123641;font-size:50px;font-weight:900}.l{fill:#345963;font-size:23px}.ct{font-size:31px;font-weight:900}.cb{font-size:23px}.sm{fill:#6B8084;font-size:18px}</style></defs>
  <rect width="720" height="1660" rx="34" fill="url(#b)"/>
  <g class="z">
    <text x="54" y="70" fill="#A98722" font-size="18" font-weight="900" letter-spacing="4">HOW TO READ THE EVIDENCE</text>
    <text x="54" y="137" class="t r">等待有代價</text><text x="54" y="197" class="t r">但不是個人的倒數計時</text>
    <text x="54" y="247" class="sub">研究看見相關，仍不能證明等待本身就是原因。</text>

    <g filter="url(#s)"><rect x="54" y="305" width="612" height="240" rx="24" fill="#FFF"/><text x="92" y="360" fill="#A98722" font-size="23" font-weight="900">台灣・口腔鱗狀細胞癌</text><text x="92" y="430" class="m">18,677 人</text><text x="92" y="480" class="l">診斷至治療間隔與 5 年整體存活</text><text x="92" y="518" class="l">呈獨立相關（2004–2010 登記資料）</text></g>
    <g filter="url(#s)"><rect x="54" y="585" width="612" height="240" rx="24" fill="#FFF"/><text x="92" y="640" fill="#A98722" font-size="23" font-weight="900">美國・頭頸部鱗狀細胞癌</text><text x="92" y="710" class="m">51,655 人</text><text x="92" y="760" class="l">61–90 天相較 30 天內開始</text><text x="92" y="798" class="l">死亡風險比 1.13（95% CI 1.08–1.19）</text></g>
    <g filter="url(#s)"><rect x="54" y="865" width="612" height="250" rx="24" fill="#123641"/><text x="92" y="925" fill="#F7F1E4" class="ct">研究看見的是「相關」</text><text x="92" y="978" fill="#D4E0DF" class="cb">病情越複雜，通常檢查越久；</text><text x="92" y="1015" fill="#D4E0DF" class="cb">複雜病情本身也可能影響預後。</text><line x1="92" y1="1050" x2="628" y2="1050" stroke="#C9A83E" stroke-width="3"/><text x="92" y="1085" fill="#F2D879" font-size="21" font-weight="900">不能換算成「多等幾天就多幾％危險」</text></g>
    <g filter="url(#s)"><rect x="54" y="1155" width="612" height="200" rx="24" fill="#173F49"/><circle cx="101" cy="1207" r="24" fill="#C9A83E"/><path d="M90 1208l8 8 15-18" fill="none" stroke="#0A2731" stroke-width="5"/><text x="143" y="1219" fill="#F7F1E4" class="ct">正確讀法</text><text x="92" y="1272" fill="#D4E0DF" class="cb">有效率完成必要分期與準備，</text><text x="92" y="1310" fill="#F2D879" font-size="21" font-weight="900">完整，而且不讓流程無故停住。</text></g>
    <g filter="url(#s)"><rect x="54" y="1395" width="612" height="190" rx="24" fill="#FFF"/><circle cx="101" cy="1447" r="24" fill="#D8C78F"/><path d="M92 1438l18 18M110 1438l-18 18" stroke="#123641" stroke-width="5"/><text x="143" y="1459" fill="#123641" class="ct">錯誤讀法</text><text x="92" y="1512" fill="#45656D" class="cb">把某一天畫成安全／危險分界，</text><text x="92" y="1550" fill="#99791B" font-size="21" font-weight="900">或為了搶快而省略該做的檢查。</text></g>
    <text x="54" y="1625" class="sm">資料來源：文章參考資料 [2][3]｜資訊圖為原創重繪</text>
  </g>
</svg>
