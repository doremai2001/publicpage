<text x="120" y="789.1" font-size="14" fill="#345963">肺 V5：兩束質子比 IMRT 少 35.6%、三束少 17.4%</text>
<circle cx="110" cy="810.5" r="3" fill="#96790F"/>
<text x="120" y="815.4" font-size="14" fill="#345963">平均肺劑量：少 5.1 Gy（兩束）／2.9 Gy（三束）</text>
<circle cx="110" cy="836.8" r="3" fill="#96790F"/>
<text x="120" y="841.7" font-size="14" fill="#345963">心臟 V40：IMRT 35.7%、兩束質子 41.8%（反而高）、</text>
<text x="120" y="862" font-size="14" fill="#345963">三束 27.7%——省肺與省心要取捨</text>
<text x="106" y="896.9" font-size="12.5" fill="#6B8084" font-weight="700">心臟 V40（%，Zhang 2008）</text>
<text x="106" y="918.9" font-size="12.5" fill="#345963" font-weight="600">IMRT</text>
<rect x="169" y="907.9" width="177" height="16" rx="4" fill="#DBD3BF" opacity="0.5"/>
