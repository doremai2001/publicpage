<text x="536" y="739.9" font-size="14" fill="#123641" font-weight="800">唯一完成的隨機比較：Lin 2020（隨機第二期，n=145，</text>
<text x="536" y="759.5" font-size="14" fill="#123641" font-weight="800">50.4 Gy，鱗癌＋腺癌）</text>
<circle cx="540" cy="784.2" r="3" fill="#00806B"/>
<text x="550" y="789.1" font-size="14" fill="#345963">主要終點是「總毒性負擔」（11 種不良事件與術後併發</text>
<text x="550" y="809.4" font-size="14" fill="#345963">症的複合分數）：IMRT 39.9 對質子 17.4（2.3 倍）</text>
<circle cx="540" cy="830.8" r="3" fill="#00806B"/>
<text x="550" y="835.7" font-size="14" fill="#345963">術後併發症分數 19.1 對 2.5</text>
<circle cx="540" cy="857.1" r="3" fill="#00806B"/>
<text x="550" y="862" font-size="14" fill="#345963">3 年 PFS 50.8% 對 51.2%；3 年 OS 44.5% 對 44.5%——</text>
<text x="550" y="882.3" font-size="14" fill="#345963">相同。80% 的質子是被動散射。</text>
<g filter="url(#sh)"><rect x="944" y="706" width="412" height="294.4" rx="18" fill="#FFFFFF"/></g>
<rect x="954" y="720" width="5" height="266.4" rx="2.5" fill="#5C77C4"/>
<text x="966" y="739.9" font-size="14" fill="#123641" font-weight="800">淋巴球：Shiraishi 2018（傾向配對 136 對 136，術前化</text>
<text x="966" y="759.5" font-size="14" fill="#123641" font-weight="800">放療，回溯）</text>
<circle cx="970" cy="784.2" r="3" fill="#5C77C4"/>
<text x="980" y="789.1" font-size="14" fill="#345963">G4 淋巴球低下：IMRT 40.4% 對質子 17.6%</text>
<circle cx="970" cy="810.5" r="3" fill="#5C77C4"/>
<text x="980" y="815.4" font-size="14" fill="#345963">低劑量浴照到循環中的淋巴球，是機轉假說；它跟存活的</text>
<text x="980" y="835.7" font-size="14" fill="#345963">連結本圖不畫。</text>
<circle cx="970" cy="857.1" r="3" fill="#5C77C4"/>
<text x="980" y="862" font-size="14" fill="#345963">第三期 NRG-GI006（主要終點 OS）主要完成估 2031</text>
<text x="980" y="882.3" font-size="14" fill="#345963">年 11 月。</text>
<text x="84" y="1026.4" font-size="14" fill="#6B8084" font-weight="600">Zhou 2023 統合（45 篇、全部非隨機）：質子顯著減少 G2+ 放射性肺炎、心包積液、G4+ 淋巴球低下；統合的存活優勢全來自非隨機資料、病人經過選擇，本圖不畫。回溯資料（Lin 2017）：住院天數質</text>
<text x="84" y="1046.7" font-size="14" fill="#6B8084" font-weight="600">子 9.3 對 IMRT 11.6 天；90 天死亡 0.9% 對 4.3% 未達顯著。</text>
<text x="84" y="1093" font-size="16" fill="#6B8084">示意圖（非實際劑量分布），依 Zhang 2008、Lin 2020（JCO 隨機第二期）、Shiraishi 2018、Lin 2017、Zhou 2023 與 ClinicalTrials.gov NRG-GI006 登錄重繪｜劑量學數字</text>
<text x="84" y="1117" font-size="16" fill="#6B8084">來自 15 人的計畫比較，隨機試驗主要終點是毒性負擔不是存活；成人質子在台灣為自費，費用問醫務課</text>
