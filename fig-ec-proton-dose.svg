<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1171" viewBox="0 0 1440 1171" role="img" aria-labelledby="t d">
  <title id="t">光子 IMRT 對質子：心與肺吃到的低劑量</title>
  <desc id="d">示意圖（非實際劑量分布）：胸腔橫切面兩格。左格光子 IMRT：多道光束交叉把高劑量集中在食道腫瘤，但每道光束穿過腫瘤後繼續往外走，低劑量浴覆蓋兩肺與心臟；IMRT 是健保常規的基本款、已經很好。右格質子：後斜方向兩束光束在布拉格峰放完劑量就停，幾乎沒有出射劑量。下方三張卡。劑量學（Zhang 2008，MD Anderson 遠端食道癌 15 人的計畫比較）：肺 V5 兩束質子比 IMRT 少 35.6%、三束少 17.4%；平均肺劑量少 5.1 Gy 與 2.9 Gy；心臟 V40 IMRT 35.7%、兩束質子 41.8% 反而較高、三束 27.7%，省肺與省心要取捨。唯一完成的隨機比較（Lin 2020，隨機第二期 n=145，50.4 Gy，鱗癌加腺癌）：主要終點總毒性負擔為複合分數，IMRT 39.9 對質子 17.4，術後併發症分數 19.1 對 2.5；3 年 PFS 50.8% 對 51.2%、3 年整體存活 44.5% 對 44.5% 相同；80% 質子為被動散射。淋巴球（Shiraishi 2018，傾向配對 136 對 136，回溯）：G4 淋巴球低下 IMRT 40.4% 對質子 17.6%；與存活的連結不畫。第三期 NRG-GI006 主要終點為整體存活，主要完成估 2031 年 11 月。圖上沒有存活優勢箭頭。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><clipPath id="clip_imrt"><ellipse cx="397" cy="509.92" rx="216.25" ry="151.38"/></clipPath><clipPath id="clip_proton"><ellipse cx="1043" cy="509.92" rx="216.25" ry="151.38"/></clipPath><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="1171" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="86" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">PHOTON IMRT vs PROTON — WHERE THE LOW DOSE GOES</text>
<text x="84" y="148" font-size="44" fill="#123641" font-weight="800" class="r">光子 IMRT 對質子：心與肺吃到的低劑量</text>
<text x="84" y="194" font-size="21" fill="#527078">同一顆食道腫瘤、同樣的處方劑量：差別在腫瘤以外的地方。左邊是今天的基本款、已經很好；右邊是同一個治療的工程升級。</text>
<text x="84" y="224" font-size="21" fill="#527078">圖上沒有存活箭頭：唯一完成的隨機比較，存活相同。</text>
<g filter="url(#sh)"><rect x="84" y="268" width="626" height="420" rx="18" fill="#FFFFFF"/></g>
