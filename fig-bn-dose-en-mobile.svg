<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1003" viewBox="0 0 720 1003" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">One irradiation, four dose components</title>
  <desc id="d">Only the first one needs boron. The other three deposit in every tissue the beam passes through, including normal tissue - which is why BNCT cannot be described as sparing normal tissue entirely. Gy-Eq is not the same unit as the Gy of external-beam radiotherapy: the numbers cannot be compared or added. These factors are estimates derived from animal and early clinical work, not measured constants.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#123641" opacity=".10"/><line x1="0" y1="0" x2="0" y2="8" stroke="#123641" stroke-width="2.2" opacity=".75"/></pattern><pattern id="hatchlite" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#123641" stroke-width="1.4" opacity=".22"/></pattern><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="720" height="1003" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="48" y="81" font-size="15" fill="#A98722" font-weight="800" letter-spacing="5px">DOSE</text>
<text x="48" y="138" font-size="37" fill="#123641" font-weight="800" class="r">One irradiation, four dose</text>
<text x="48" y="183" font-size="37" fill="#123641" font-weight="800" class="r">components</text>
<text x="48" y="227" font-size="18" fill="#527078">Only the first one needs boron. The other three deposit in every</text>
<text x="48" y="253" font-size="18" fill="#527078">tissue the beam passes through,</text>
<text x="48" y="279" font-size="18" fill="#527078">including normal tissue - which is why BNCT cannot be described</text>
<text x="48" y="305" font-size="18" fill="#527078">as sparing normal tissue entirely.</text>
<text x="48" y="355" font-size="16" fill="#123641" font-weight="700">Boron dose (high LET)</text>
<rect x="48" y="383" width="624" height="32" rx="8" fill="#123641" opacity="0.05"/>
<rect x="48" y="383" width="592" height="32" rx="8" fill="#A98722" opacity="0.88"/>
<text x="60" y="405" font-size="13" fill="#FFFFFF" font-weight="700">only where boron is</text>
<text x="48" y="435" font-size="16" fill="#123641" font-weight="700">Nitrogen dose  14N(n,p)14C, proton about 0.54 MeV</text>
<rect x="48" y="463" width="624" height="32" rx="8" fill="#123641" opacity="0.05"/>
<rect x="48" y="463" width="386" height="32" rx="8" fill="#5C77C4" opacity="0.88"/>
<text x="60" y="485" font-size="13" fill="#FFFFFF" font-weight="700">independent of boron</text>
<text x="48" y="515" font-size="16" fill="#123641" font-weight="700">Fast neutron dose  recoil protons from hydrogen</text>
<rect x="48" y="543" width="624" height="32" rx="8" fill="#123641" opacity="0.05"/>
<rect x="48" y="543" width="299" height="32" rx="8" fill="#5C77C4" opacity="0.88"/>
<text x="60" y="565" font-size="13" fill="#FFFFFF" font-weight="700">independent of boron</text>
<text x="48" y="595" font-size="16" fill="#123641" font-weight="700">Photon dose  1H(n,gamma)2H in tissue and beam contamination</text>
<rect x="48" y="623" width="624" height="32" rx="8" fill="#123641" opacity="0.05"/>
<rect x="48" y="623" width="249" height="32" rx="8" fill="#5C77C4" opacity="0.88"/>
<text x="60" y="645" font-size="13" fill="#FFFFFF" font-weight="700">independent of boron</text>
<rect x="48" y="675" width="624" height="2" rx="1" fill="#123641" opacity="0.12"/>
<text x="48" y="700" font-size="15" fill="#527078">Each component is weighted and summed into a photon-equivalent dose, Gy-Eq</text>
<text x="48" y="723" font-size="15" fill="#527078">CBE: tumour 3.8  skin 2.5  oral mucosa 2.5  brain and spinal cord 1.3   RBE 3.2</text>
<text x="48" y="746" font-size="15" fill="#527078">for high-LET beam components</text>
<rect x="48" y="794" width="624" height="2" rx="1" fill="#A98722" opacity="0.5"/>
<text x="48" y="823" font-size="16" fill="#345963" font-weight="700">Gy-Eq is not the same unit as the Gy of external-beam radiotherapy: the</text>
<text x="48" y="848" font-size="16" fill="#345963" font-weight="700">numbers cannot be compared or added.</text>
<text x="48" y="873" font-size="16" fill="#345963" font-weight="700">These factors are estimates derived from animal and early clinical work,</text>
<text x="48" y="898" font-size="16" fill="#345963" font-weight="700">not measured constants.</text>
<text x="48" y="929" font-size="13" fill="#6B8084">Schematic, redrawn from the MIT OpenCourseWare 22.55J lecture notes and Barth et al.</text>
<text x="48" y="949" font-size="13" fill="#6B8084">2005; bar lengths are indicative, not actual dose ratios.</text>
  </g>
</svg>
