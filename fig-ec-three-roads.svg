<text x="857.2" y="1059.85" font-size="14" fill="#123641" font-weight="800">長期？</text>
<text x="857.2" y="1080.75" font-size="13" fill="#345963">54 個月時只有 25% 維</text>
<text x="857.2" y="1098.95" font-size="13" fill="#345963">持 cCR；作者自承長期</text>
<text x="857.2" y="1117.15" font-size="13" fill="#345963">可能反映在 OS</text>
<rect x="1032" y="1033.95" width="300" height="149.2" rx="12" fill="#ECE8DE" stroke="#9A9282" stroke-width="2" stroke-dasharray="6 5"/>
<text x="1046" y="1072.35" font-size="28" fill="#345963" font-weight="800">2 年 OS 74% 對 71%</text>
<text x="1046" y="1099.85" font-size="14" fill="#345963">非劣性成立（邊界 15%）；中位 OS 43 對</text>
<text x="1046" y="1120.15" font-size="14" fill="#345963">53 個月（HR 1.14，無統計差異）；遠端轉</text>
<text x="1046" y="1140.45" font-size="14" fill="#345963">移方向偏向手術組。6 個月時吞嚥困難等生</text>
<text x="1046" y="1160.75" font-size="14" fill="#345963">活品質較好。</text>
<circle cx="113" cy="1206.15" r="3.5" fill="#B04A4A"/>
<text x="126" y="1211.05" font-size="14" fill="#345963">「看不到」不等於沒有：preSANO 一般切片漏掉 31% 的 TRG3–4 殘存，bite-on-bite＋FNA 仍漏 10%；鱗癌 preSINO 陰性預測值 68.7%；SANO 手術組被判 cCR 的 101 人開刀後 pT0 只有</text>
<text x="126" y="1231.35" font-size="14" fill="#345963">36 人（35.6%，批評方引附錄）。</text>
<circle cx="113" cy="1252.75" r="3.5" fill="#B04A4A"/>
<text x="126" y="1257.65" font-size="14" fill="#345963">還在驗證：NEEDS（限鱗癌，估 1,020 人）收案中，主要完成估 2026 年 12 月；ESOSTRATE（法國）因收案不足終止（188 人）；SANO-2 在查試驗外環境能否複製。</text>
<circle cx="113" cy="1279.05" r="3.5" fill="#B04A4A"/>
<text x="126" y="1283.95" font-size="14" fill="#345963">反向也要記得：對化放療有反應的鱗癌，加手術不增加整體存活（Cochrane HR 0.99）但治療死亡風險 RR 5.11；計畫性食道切除 90 天死亡 4.5%（Esodata）、救援手術 9.5%（Markar</text>
<text x="126" y="1304.25" font-size="14" fill="#345963">2014）。</text>
<text x="84" y="1368.65" font-size="14" fill="#6B8084" font-weight="600">三條路的族群不同：第一條 75% 腺癌、第二條全鱗癌、第三條四分之三腺癌；期別、年代、追蹤年限也不同——同一列的數字只能在該列裡讀。</text>
<text x="84" y="1414.95" font-size="16" fill="#6B8084">示意圖，依 CROSS（van Hagen 2012、Shapiro 2015、Eyck 2021）、NEOCRTEC5010（Yang 2021）、JCOG0909（Takeuchi 2021；JES 2022 引最終分析）、SANO（</text>
<text x="84" y="1438.95" font-size="16" fill="#6B8084">Noordman 2018 設計、van der Wilk 2025、Gangaram Panday 2026、Housman 2025 評論）、preSANO（Noordman 2018）、preSINO（Yang 2025）、Cochrane 2017、</text>
<text x="84" y="1462.95" font-size="16" fill="#6B8084">Esodata（Kuppusamy 2022）、Markar 2014 與 ClinicalTrials.gov NEEDS／ESOSTRATE 登錄重繪｜各試驗族群、設計與終點不同，數字不可直接互比</text>
  </g>
</svg>
