<text x="246.57" y="314.58" font-size="15.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">第一條｜三合一：先化放療再開刀</text>
<text x="108" y="356.15" font-size="19" fill="#123641" font-weight="800">這是院內建議、也是 CROSS／NEOCRTEC5010 證明「比只開刀好」的那條路</text>
<text x="108" y="381.55" font-size="14" fill="#6B8084">CROSS：荷蘭，n=366，腺癌 75%／鱗癌 23%，cT1N1／T2–3N0–1；兩個試驗都沒有「不開刀」那一臂。</text>
