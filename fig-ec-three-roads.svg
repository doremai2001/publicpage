<text x="226.58" y="944.58" font-size="15.5" fill="#9A9282" font-weight="800" text-anchor="middle">第三條｜主動監測——試驗中</text>
<text x="108" y="986.15" font-size="19" fill="#123641" font-weight="800">SANO 讀出「兩年非劣」，但族群是荷蘭腺癌、追蹤三年多、遠端轉移方向不利、長期結果未出</text>
<text x="108" y="1011.55" font-size="14" fill="#6B8084">SANO：荷蘭 12 院，階梯楔形群集隨機，n=309 位 cCR（監測 198／手術 111），腺癌約四分之三、鱗癌約兩成，中位追蹤 38 個月。沒有任何指引把它列為標準選項。</text>
