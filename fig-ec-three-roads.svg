<text x="487.6" y="1080.75" font-size="13" fill="#345963">PET-CT＋切片＋</text>
<text x="487.6" y="1098.95" font-size="13" fill="#345963">EUS-FNA → cCR 37%</text>
<text x="487.6" y="1117.15" font-size="13" fill="#345963">（274/750）</text>
