<text x="672.4" y="1080.75" font-size="13" fill="#345963">6、9、12、16、20、</text>
<text x="672.4" y="1098.95" font-size="13" fill="#345963">24、30、36、48、60</text>
<text x="672.4" y="1117.15" font-size="13" fill="#345963">個月重複評估；局部再</text>
<text x="672.4" y="1135.35" font-size="13" fill="#345963">生長 48%→延後手術；</text>
<text x="672.4" y="1153.55" font-size="13" fill="#345963">遠端轉移 17%</text>
