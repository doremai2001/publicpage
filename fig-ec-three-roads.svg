<text x="84" y="86" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">THREE ROADS AFTER CHEMORADIOTHERAPY</text>
<text x="84" y="148" font-size="44" fill="#123641" font-weight="800" class="r">化放療之後的三條路：三合一、根治性化放療加救援、主動監測</text>
<text x="84" y="194" font-size="21" fill="#527078">三條路各有自己的試驗、族群與追蹤年限，數字不能橫著比。第三條路目前只在試驗設計裡成立。</text>
<text x="84" y="224" font-size="21" fill="#527078">院內在鱗癌化放療後仍建議開刀的理由，寫在第三條路的下方。</text>
