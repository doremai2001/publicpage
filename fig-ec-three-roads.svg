<text x="230.76" y="639.73" font-size="15.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">第二條｜根治性化放療＋救援</text>
<text x="108" y="681.3" font-size="19" fill="#123641" font-weight="800">不開刀不是放棄：有前瞻試驗把「救援」寫進療程</text>
<text x="108" y="706.7" font-size="14" fill="#6B8084">JCOG0909：日本，cStage II/III 鱗癌，n=94，單臂確認性試驗、無對照組；ESMO 2025：不願或不適合手術者、頸段——首選。</text>
