<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">CT 與 MRI 應依臨床問題選擇</title><desc id="desc">口腔癌下顎骨侵犯的整合分析沒有看出 CT 與 MRI 明顯優劣；MRI 在鼻咽、顱底、深部軟組織與神經侵犯較有優勢。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A2A35"/><stop offset="1" stop-color="#174653"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#001820" flood-opacity=".28"/></filter><style>.z{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Microsoft JhengHei",serif}.t{fill:#F5EFE6;font-size:50px;font-weight:900}.sub{fill:#B9CECD;font-size:23px}.ct{font-size:34px;font-weight:900}.metric{font-size:40px;font-weight:900}.label{font-size:20px}.body{font-size:21px}.sm{fill:#9CB4B4;font-size:17px}</style></defs>
  <rect width="1440" height="860" rx="36" fill="url(#bg)"/>
  <g class="z"><text x="78" y="72" fill="#D0B44F" font-size="18" font-weight="900" letter-spacing="5">CHOOSE BY THE QUESTION</text>
    <text x="78" y="138" class="t r">CT 與 MRI：看題目，不看等級</text><text x="78" y="181" class="sub">「比較高級」不是選檢查的理由；腫瘤部位與要回答的問題才是。</text>
    <g filter="url(#s)"><rect x="78" y="235" width="620" height="400" rx="29" fill="#F4EFE3"/>
      <circle cx="142" cy="303" r="39" fill="#C9A83E"/><path d="M121 303h42M142 282v42" stroke="#123641" stroke-width="6" stroke-linecap="round"/><text x="204" y="315" fill="#123641" class="ct">CT</text>
      <text x="122" y="377" fill="#99791B" font-size="22" font-weight="900">擅長：骨頭、骨皮質與整體解剖</text>
      <text x="122" y="428" fill="#48666D" class="body">• 口腔癌與下顎骨關係</text><text x="122" y="468" fill="#48666D" class="body">• 手術規劃與放療定位</text><text x="122" y="508" fill="#48666D" class="body">• 檢查速度較快、臨床普及</text>
      <line x1="122" y1="548" x2="654" y2="548" stroke="#CDBF93" stroke-width="2"/><text x="122" y="588" fill="#123641" class="label">下顎骨侵犯整合分析</text><text x="397" y="592" fill="#123641" class="metric">76% / 89%</text><text x="397" y="619" fill="#627A7F" font-size="16">敏感度／特異度</text>
    </g>
    <g filter="url(#s)"><rect x="742" y="235" width="620" height="400" rx="29" fill="#173F49" stroke="#52767C" stroke-width="2"/>
      <circle cx="806" cy="303" r="39" fill="#C9A83E"/><path d="M786 292c17-19 36-10 38 7 2 20-16 31-38 18" fill="none" stroke="#123641" stroke-width="6"/><text x="868" y="315" fill="#F7F1E4" class="ct">MRI</text>
      <text x="786" y="377" fill="#F2D879" font-size="22" font-weight="900">擅長：深部軟組織、神經與顱底</text>
      <text x="786" y="428" fill="#D4E0DF" class="body">• 鼻咽癌、舌根與顱內延伸</text><text x="786" y="468" fill="#D4E0DF" class="body">• 神經周圍侵犯與骨髓訊號</text><text x="786" y="508" fill="#D4E0DF" class="body">• 軟組織對比是主要優勢</text>
      <line x1="786" y1="548" x2="1318" y2="548" stroke="#52767C" stroke-width="2"/><text x="786" y="588" fill="#D4E0DF" class="label">下顎骨侵犯整合分析</text><text x="1061" y="592" fill="#F7F1E4" class="metric">78% / 86%</text><text x="1061" y="619" fill="#9CB4B4" font-size="16">敏感度／特異度</text>
    </g>
    <g filter="url(#s)"><rect x="194" y="675" width="1052" height="112" rx="26" fill="#F4EFE3"/>
      <circle cx="253" cy="731" r="29" fill="#C9A83E"/><path d="M240 731l9 9 18-22" fill="none" stroke="#123641" stroke-width="5"/>
      <text x="307" y="720" fill="#123641" font-size="26" font-weight="900">口腔癌下顎骨侵犯：這份整合分析未見兩者明顯優劣</text><text x="307" y="758" fill="#527078" font-size="20">鼻咽、顱底或深部軟組織問題，才是 MRI 明顯更重要的場景。</text>
    </g>
    <text x="78" y="828" class="sm">資料來源：文章參考資料 [3] Brandão Neto et al., 2018；[4] Liao et al., 2008｜資訊圖為原創重繪</text>
  </g>
</svg>
