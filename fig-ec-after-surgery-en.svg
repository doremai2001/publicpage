<g filter="url(#sh)"><rect x="730" y="341.7" width="626" height="560" rx="18" fill="#FFFFFF"/></g>
<rect x="752" y="363.7" width="410.94" height="30" rx="15" fill="#00806B"/>
<text x="957.47" y="383.92" font-size="14.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">After surgery (oesophagectomy + gastric conduit)</text>
<path d="M1014.85 413.08 L1071.15 413.08 L1071.15 460.01 C 1136.85 469.39, 1193.15 492.85, 1193.15 544.47 L1193.15 863.55 Q 1193.15 882.32 1174.38 882.32 L911.62 882.32 Q 892.85 882.32 892.85 863.55 L892.85 544.47 C 892.85 492.85, 949.15 469.39, 1014.85 460.01 Z" fill="#F3EDE0" stroke="#C9C0AC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M900.35 685.24 Q 1043 638.32 1185.65 685.24" fill="none" stroke="#C9C0AC" stroke-width="1.8" stroke-dasharray="6 4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1183.77" y="671.73" font-size="12" fill="#6B8084" font-weight="600" text-anchor="end">Diaphragm</text>
<path d="M1043 414.96 L1043 492.85" fill="none" stroke="#D9D2C2" stroke-width="15.02" stroke-linecap="butt" stroke-linejoin="round"/>
<path d="M1043 492.85 L1043 685.24 C 1043 722.78, 1071.15 736.85, 1108.69 732.16" fill="none" stroke="#E7DFCF" stroke-width="24.4" stroke-linecap="butt" stroke-linejoin="round"/>
<path d="M1043 492.85 L1043 685.24 C 1043 722.78, 1071.15 736.85, 1108.69 732.16" fill="none" stroke="#B9AF98" stroke-width="27.4" opacity="0.35" stroke-linecap="butt" stroke-linejoin="round"/>
<circle cx="1043" cy="492.85" r="14.08" fill="none" stroke="#B04A4A" stroke-width="3"/>
<text x="1063.65" y="493.04" font-size="13" fill="#B04A4A" font-weight="800">Anastomosis</text>
<text x="1063.65" y="510.59" font-size="12" fill="#B04A4A" font-weight="600">intrathoracic (Ivor Lewis) or cervical (McKeown)</text>
<text x="1058.02" y="582.01" font-size="13" fill="#7A6E58" font-weight="700">Stomach pulled into the chest as a tube</text>
<text x="1058.02" y="599.56" font-size="12" fill="#7A6E58" font-weight="600">No sphincter; smaller capacity</text>
<circle cx="1110.57" cy="732.16" r="8.45" fill="#B9AF98"/>
<text x="1123.71" y="738.92" font-size="13" fill="#7A6E58" font-weight="700">Pylorus (near the diaphragm)</text>
<path d="M1116.2 737.79 C 1155.62 750.93, 1155.62 807.24, 1118.08 816.62" fill="none" stroke="#DED6C4" stroke-width="8.45" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1030.8 431.85 L1030.8 483.47" fill="none" stroke="#96790F" stroke-width="1.5" stroke-dasharray="3 3" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="1025.17" y1="486.28" x2="1036.43" y2="497.55" stroke="#96790F" stroke-width="1.8" stroke-linecap="round"/>
<line x1="1036.43" y1="486.28" x2="1025.17" y2="497.55" stroke="#96790F" stroke-width="1.8" stroke-linecap="round"/>
<path d="M1055.2 431.85 L1055.2 483.47" fill="none" stroke="#96790F" stroke-width="1.5" stroke-dasharray="3 3" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="1049.57" y1="486.28" x2="1060.83" y2="497.55" stroke="#96790F" stroke-width="1.8" stroke-linecap="round"/>
<line x1="1060.83" y1="486.28" x2="1049.57" y2="497.55" stroke="#96790F" stroke-width="1.8" stroke-linecap="round"/>
<text x="1005.46" y="460.01" font-size="12" fill="#96790F" font-weight="700" text-anchor="end">Vagus nerves cut</text>
<line x1="1005.46" y1="516.32" x2="1005.46" y2="713.39" stroke="#5C77C4" stroke-width="2.5" stroke-linecap="round"/>
<line x1="1005.46" y1="713.39" x2="1009.54" y2="704.26" stroke="#5C77C4" stroke-width="2.5" stroke-linecap="round"/>
<line x1="1005.46" y1="713.39" x2="1001.38" y2="704.26" stroke="#5C77C4" stroke-width="2.5" stroke-linecap="round"/>
<text x="996.08" y="619.55" font-size="13" fill="#5C77C4" font-weight="800" text-anchor="end">Food travels down the conduit</text>
<text x="996.08" y="637.1" font-size="12" fill="#5C77C4" font-weight="600" text-anchor="end">by gravity — reflux is easy</text>
<text x="967.92" y="797.85" font-size="12" fill="#6B8084" font-weight="600" text-anchor="middle">Where the stomach used to sit is empty</text>
<g filter="url(#sh)"><rect x="84" y="919.7" width="412" height="264.14" rx="18" fill="#FFFFFF"/></g>
<rect x="106" y="941.7" width="167.17" height="23.62" rx="11.81" fill="#96790F"/>
<text x="189.58" y="958.37" font-size="13.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">Small, frequent meals</text>
<circle cx="110" cy="986.2" r="3" fill="#96790F"/>
<text x="120" y="990.75" font-size="13" fill="#345963">The stomach is now a tube with a smaller capacity —</text>
<text x="120" y="1009.21" font-size="13" fill="#345963">you cannot eat the old portion at once.</text>
<circle cx="110" cy="1031.12" r="3" fill="#96790F"/>
<text x="120" y="1035.67" font-size="13" fill="#345963">Swedish national cohort (n=226): at 6 months 63.7%</text>
<text x="120" y="1054.13" font-size="13" fill="#345963">had lost &gt;10% of weight and 20.4% &gt;20%; weight can</text>
<text x="120" y="1072.59" font-size="13" fill="#345963">keep falling for 3 years.</text>
<circle cx="110" cy="1094.5" r="3" fill="#96790F"/>
<text x="120" y="1099.05" font-size="13" fill="#345963">Delayed gastric emptying: early 15.9%, late 9.4%</text>
<text x="120" y="1117.51" font-size="13" fill="#345963">(meta-analysis of 125 studies); pyloric procedures</text>
<text x="120" y="1135.97" font-size="13" fill="#345963">vary by hospital and the evidence takes no side.</text>
<g filter="url(#sh)"><rect x="514" y="919.7" width="412" height="264.14" rx="18" fill="#FFFFFF"/></g>
<rect x="536" y="941.7" width="143.51" height="23.62" rx="11.81" fill="#5C77C4"/>
<text x="607.76" y="958.37" font-size="13.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">Dumping syndrome</text>
<circle cx="540" cy="986.2" r="3" fill="#5C77C4"/>
<text x="550" y="990.75" font-size="13" fill="#345963">Food enters the small bowel too fast: early (within 30</text>
<text x="550" y="1009.21" font-size="13" fill="#345963">minutes) palpitations, sweating, needing to lie down;</text>
<text x="550" y="1027.67" font-size="13" fill="#345963">late (1–3 hours) hypoglycaemia.</text>
<circle cx="540" cy="1049.58" r="3" fill="#5C77C4"/>
<text x="550" y="1054.13" font-size="13" fill="#345963">How common depends on the definition: significant</text>
<text x="550" y="1072.59" font-size="13" fill="#345963">symptoms 11% (Sweden, n=384, 1 year);</text>
<text x="550" y="1091.05" font-size="13" fill="#345963">questionnaire-based 67–78%.</text>
<circle cx="540" cy="1112.96" r="3" fill="#5C77C4"/>
<text x="550" y="1117.51" font-size="13" fill="#345963">International consensus: dietary change first (small</text>
<text x="550" y="1135.97" font-size="13" fill="#345963">meals, separate solids and liquids, less simple sugar);</text>
<text x="550" y="1154.43" font-size="13" fill="#345963">acarbose for late dumping.</text>
<g filter="url(#sh)"><rect x="944" y="919.7" width="412" height="264.14" rx="18" fill="#FFFFFF"/></g>
<rect x="966" y="941.7" width="171.62" height="23.62" rx="11.81" fill="#B04A4A"/>
<text x="1051.81" y="958.37" font-size="13.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">Reflux and night cough</text>
<circle cx="970" cy="986.2" r="3" fill="#B04A4A"/>
<text x="980" y="990.75" font-size="13" fill="#345963">No lower oesophageal sphincter and the stomach sits in</text>
<text x="980" y="1009.21" font-size="13" fill="#345963">the chest — lying flat invites reflux.</text>
<circle cx="970" cy="1031.12" r="3" fill="#B04A4A"/>
<text x="980" y="1035.67" font-size="13" fill="#345963">Swedish cohort (n=241, 1 year): 27% severe reflux;</text>
<text x="980" y="1054.13" font-size="13" fill="#345963">reflux raised sleep disturbance OR 2.3. Remnant</text>
<text x="980" y="1072.59" font-size="13" fill="#345963">oesophageal mucosal injury 55% at 5 years (Germany,</text>
<text x="980" y="1091.05" font-size="13" fill="#345963">n=50, on routine PPI).</text>
<circle cx="970" cy="1112.96" r="3" fill="#B04A4A"/>
<text x="980" y="1117.51" font-size="13" fill="#345963">Raising the upper body and not lying down after meals is</text>
<text x="980" y="1135.97" font-size="13" fill="#345963">clinic routine — there is no controlled study after</text>
<text x="980" y="1154.43" font-size="13" fill="#345963">oesophagectomy, so no centimetres are given.</text>
<text x="84" y="1209.84" font-size="14" fill="#6B8084" font-weight="600">Late-dumping hypoglycaemia can cause fainting — report it rather than fasting on your own. If you lose more than a tenth of your weight and swallowing worsens again, rule out stricture</text>
<text x="84" y="1230.14" font-size="14" fill="#6B8084" font-weight="600">and recurrence first; do not assume 'just eating too little'.</text>
<text x="84" y="1276.44" font-size="16" fill="#6B8084">Schematic, redrawn from Martin 2007/2009 (Swedish weight cohort), Lin 2025 (dumping meta-analysis), Lagergren 2026 (Swedish dumping cohort), Scarpellini</text>
<text x="84" y="1300.44" font-size="16" fill="#6B8084">2020 (international dumping consensus), Lagergren 2021 (Swedish reflux cohort), Fuchs 2018 (post-Ivor Lewis endoscopic cohort, n=50) and Sivakumar 2025</text>
<text x="84" y="1324.44" font-size="16" fill="#6B8084">(delayed-emptying meta-analysis, 125 studies) | the operation, anastomosis site and pyloric management vary by surgeon and hospital; numbers come from</text>
<text x="84" y="1348.44" font-size="16" fill="#6B8084">different cohorts and are not directly comparable</text>
  </g>
</svg>
