<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1402" viewBox="0 0 1440 1402" role="img" aria-labelledby="t d">
  <title id="t">Before and after surgery: where the stomach goes, where food goes</title>
  <desc id="d">Schematic anatomy before and after oesophagectomy. Left, before: the oesophagus runs from the neck through the chest, through the diaphragm to an intact stomach in the abdomen; the lower oesophageal sphincter sits at the diaphragm, the pylorus at the lower right of the stomach leads to the duodenum, the vagus nerves run along the oesophagus and food goes down; a tumour is marked in the mid-to-lower oesophagus. Right, after: the mid-to-lower oesophagus with the tumour has been removed, leaving a short remnant in the neck and upper chest; the stomach has been made into a tube and pulled into the chest, joined to the remnant either in the chest (Ivor Lewis) or in the neck (McKeown); there is no sphincter and capacity is smaller; the pylorus now sits near the diaphragm; the vagus nerves are cut; food travels down the conduit by gravity and reflux is easy; the space where the stomach used to sit is empty. Three boxes below. Small frequent meals: in a Swedish cohort (n=226), 63.7% had lost more than 10% of weight and 20.4% more than 20% at 6 months, and weight can keep falling for 3 years; delayed gastric emptying early 15.9% and late 9.4%, with the evidence on pyloric procedures taking no side. Dumping syndrome: early palpitations and sweating within 30 minutes, late hypoglycaemia at 1–3 hours; significant symptoms 11% (Sweden, n=384, 1 year), 67–78% by questionnaire; dietary change first, acarbose for late dumping. Reflux and night cough: 27% severe reflux in a Swedish cohort (n=241, 1 year), sleep disturbance OR 2.3; remnant oesophageal mucosal injury 55% at 5 years (Germany, n=50); raising the upper body and not lying down after meals is clinic routine, with no controlled study and no centimetres given.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="1402" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="86" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">ANATOMY BEFORE AND AFTER OESOPHAGECTOMY</text>
<text x="84" y="148" font-size="38" fill="#123641" font-weight="800" class="r">Before and after surgery: where the stomach goes, where food</text>
<text x="84" y="191.7" font-size="38" fill="#123641" font-weight="800" class="r">goes</text>
<text x="84" y="237.7" font-size="21" fill="#527078">Surgery removes a segment of oesophagus with its lymph nodes; the stomach is made into a tube, pulled into the chest and</text>
<text x="84" y="267.7" font-size="21" fill="#527078">joined on. Small frequent meals, dumping and reflux all follow from this picture.</text>
<text x="84" y="297.7" font-size="21" fill="#527078">Schematic; the operation and the anastomosis site depend on your surgeon.</text>
<g filter="url(#sh)"><rect x="84" y="341.7" width="626" height="560" rx="18" fill="#FFFFFF"/></g>
<rect x="106" y="363.7" width="150.01" height="30" rx="15" fill="#9A9282"/>
<text x="181.01" y="383.92" font-size="14.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">Before surgery</text>
