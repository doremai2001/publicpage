<text x="84" y="86" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">THE 5–6 WEEK CALENDAR</text>
<text x="84" y="148" font-size="44" fill="#123641" font-weight="800" class="r">五到六週怎麼過：食道炎照表來，體重悄悄走</text>
<text x="84" y="194" font-size="21" fill="#527078">左邊是療程行事曆（以 50.4 Gy 分 28 次為例）；右邊是症狀與體重的示意曲線——食道炎在第 2–3 週開始，是照表走，不是出了問題。</text>
<text x="84" y="224" font-size="21" fill="#527078">曲線形狀來自肺癌放療文獻的類推，食道癌試驗沒有單獨報食道炎比例。</text>
