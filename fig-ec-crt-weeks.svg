<text x="1106.25" y="750.84" font-size="12.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">不只食道</text>
<text x="1072" y="780.75" font-size="13.5" fill="#345963">放射性肺炎 ≥G2 約 6.6%（IMRT 時代系統</text>
<text x="1072" y="800.33" font-size="13.5" fill="#345963">性回顧），多在結束後數週到數月——咳</text>
<text x="1072" y="819.9" font-size="13.5" fill="#345963">嗽、喘要講。</text>
<text x="84" y="930.72" font-size="14" fill="#6B8084" font-weight="600">第四、五週最痛，也最容易想「休息幾天」——難受要回報，讓團隊處理症狀與營養；要不要暫停、怎麼補償，由團隊決定。</text>
<text x="84" y="977.02" font-size="16" fill="#6B8084">示意圖，依 Baker &amp; Fairchild 2016（肺癌放射性食道炎綜述，類推）、CTCAE v5.0、Hulshof 2021（ARTDECO）、Herskovic 1992（RTOG 85-01）、Nishimura 1994、</text>
<text x="84" y="1001.02" font-size="16" fill="#6B8084">Bese 2007、Xiang 2025 與 Tonison 2019（IMRT 時代放射性肺炎回顧）重繪｜曲線為示意，不代表個人病程；排程以你的團隊為準</text>
