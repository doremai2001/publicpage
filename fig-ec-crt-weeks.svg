<text x="809.75" y="750.84" font-size="12.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">為什麼不要自己停</text>
<text x="750" y="780.75" font-size="13.5" fill="#345963">局部控制對總療程時間：−2.3%／天（食道</text>
<text x="750" y="800.33" font-size="13.5" fill="#345963">癌，1994 年放療單獨、n=88）；−1.4%／</text>
<text x="750" y="819.9" font-size="13.5" fill="#345963">天（頭頸鱗癌，類推）——族群回歸斜率，</text>
