<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1708" viewBox="0 0 620 1708" role="img" aria-labelledby="t d">
  <title id="t">定位到治療：節點畫得出來，天數畫不出來</title>
  <desc id="d">示意圖：從定位到治療的流程，只畫節點、不畫天數。八個節點依序是：一，門診與決定——照哪裡、照幾次先在門診定下來；二，模擬定位電腦斷層——取得治療姿勢下的立體地圖，做深吸氣閉氣的人這天至少照兩套，自由呼吸一套、閉氣一套；三，深吸氣閉氣練習——有寫明時間的研究裡，典型訓練時段 15 到 30 分鐘，這是整張圖唯一的時間數字；四，畫線與皮膚標記——留下之後每天對位用的座標，線和點不要自己補、也不要自己擦；五，勾畫標靶與正常器官——醫師在定位影像上逐層畫出要照的範圍與要避開的器官；六，計畫設計與劑量計算——物理師排照野、算劑量；七，上機品質驗證——確認機器實際打出來的劑量和電腦算出來的一致；八，第一次治療與每週評估——報到、擺位、影像確認、照射，擺位與確認占大部分時間，過程不痛不熱。另有一段說明閉氣的操作：吸氣位置的容許範圍典型只有 2 到 5 公釐，一超出範圍機器自動停束；每一個照野開始前都要重新吸氣、重新閉住，文獻的一致觀察是配合度很高；但預選訓練後仍有約三成無法完成閉氣定位掃描，練不起來會改用其他方式規劃。圖上明白標示：這張圖沒有天數，也沒有分鐘數——定位到第一次治療隔幾天、單次治療躺幾分鐘、一口氣要閉幾秒，三個問題在文獻裡都查不到可引用的通則，所以不畫、不編，依你醫院的排程與說明為準；查得到的只有訓練時段 15 到 30 分鐘（38 篇研究的系統性回顧，涵蓋 2000 到 2014 年間文獻），那是練習要花多久，不是治療要花多久。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><pattern id="hz" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#96790F" stroke-width="2" opacity="0.55"/></pattern><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="620" height="1708" rx="30" fill="url(#bg)"/>
  <g class="z">
<text x="44" y="62" font-size="14" fill="#A98722" font-weight="800" letter-spacing="3.5px">SIMULATION → FIRST TREATMENT</text>
<text x="44" y="112" font-size="30" fill="#123641" font-weight="800" class="r">定位到治療：節點畫得出來，天數</text>
<text x="44" y="152" font-size="30" fill="#123641" font-weight="800" class="r">畫不出來</text>
<text x="44" y="194" font-size="14.5" fill="#527078">這張流程圖只畫「發生什麼事」，不畫「要等幾天」——那個數字文獻裡查不到，</text>
<text x="44" y="216" font-size="14.5" fill="#527078">我不編。</text>
<text x="44" y="238" font-size="14.5" fill="#527078">整張圖唯一可以引用的時間數字，是深吸氣閉氣的訓練時段。</text>
<g filter="url(#sh)"><rect x="44" y="272" width="532" height="88" rx="18" fill="#FFFFFF"/></g>
<text x="66" y="304" font-size="16.5" fill="#123641" font-weight="800">① 門診與決定</text>
<text x="66" y="330" font-size="13.8" fill="#345963">照哪裡、照幾次，先在門診定下來。</text>
<line x1="84" y1="366" x2="84" y2="386" stroke="#123641" stroke-width="2.5" stroke-linecap="round"/>
<line x1="84" y1="386" x2="78.8" y2="376.3" stroke="#123641" stroke-width="2.5" stroke-linecap="round"/>
<line x1="84" y1="386" x2="89.2" y2="376.3" stroke="#123641" stroke-width="2.5" stroke-linecap="round"/>
<g filter="url(#sh)"><rect x="44" y="394" width="532" height="110" rx="18" fill="#FFFFFF"/></g>
<text x="66" y="426" font-size="16.5" fill="#123641" font-weight="800">② 模擬定位電腦斷層</text>
<text x="66" y="452" font-size="13.8" fill="#345963">取得治療姿勢下的立體地圖。做 DIBH 的人這天至少照兩套：自由呼吸一套、閉</text>
<text x="66" y="474" font-size="13.8" fill="#345963">氣一套。</text>
<line x1="84" y1="510" x2="84" y2="530" stroke="#123641" stroke-width="2.5" stroke-linecap="round"/>
<line x1="84" y1="530" x2="78.8" y2="520.3" stroke="#123641" stroke-width="2.5" stroke-linecap="round"/>
<line x1="84" y1="530" x2="89.2" y2="520.3" stroke="#123641" stroke-width="2.5" stroke-linecap="round"/>
<g filter="url(#sh)"><rect x="44" y="538" width="532" height="88" rx="18" fill="#FFFFFF"/></g>
<text x="66" y="570" font-size="16.5" fill="#123641" font-weight="800">③ DIBH 練習</text>
<text x="66" y="596" font-size="13.8" fill="#345963">有寫明時間的研究裡，典型訓練時段 15 到 30 分鐘——本圖唯一的時間數字。</text>
<line x1="84" y1="632" x2="84" y2="652" stroke="#123641" stroke-width="2.5" stroke-linecap="round"/>
<line x1="84" y1="652" x2="78.8" y2="642.3" stroke="#123641" stroke-width="2.5" stroke-linecap="round"/>
<line x1="84" y1="652" x2="89.2" y2="642.3" stroke="#123641" stroke-width="2.5" stroke-linecap="round"/>
<g filter="url(#sh)"><rect x="44" y="660" width="532" height="88" rx="18" fill="#FFFFFF"/></g>
<text x="66" y="692" font-size="16.5" fill="#123641" font-weight="800">④ 畫線與皮膚標記</text>
<text x="66" y="718" font-size="13.8" fill="#345963">留下之後每天對位用的座標；線和點不要自己補、也不要自己擦。</text>
<line x1="84" y1="754" x2="84" y2="774" stroke="#123641" stroke-width="2.5" stroke-linecap="round"/>
<line x1="84" y1="774" x2="78.8" y2="764.3" stroke="#123641" stroke-width="2.5" stroke-linecap="round"/>
<line x1="84" y1="774" x2="89.2" y2="764.3" stroke="#123641" stroke-width="2.5" stroke-linecap="round"/>
<g filter="url(#sh)"><rect x="44" y="782" width="532" height="88" rx="18" fill="#FFFFFF"/></g>
<text x="66" y="814" font-size="16.5" fill="#123641" font-weight="800">⑤ 勾畫標靶與正常器官</text>
<text x="66" y="840" font-size="13.8" fill="#345963">醫師在定位影像上逐層畫出要照的範圍與要避開的器官。</text>
<line x1="84" y1="876" x2="84" y2="896" stroke="#123641" stroke-width="2.5" stroke-linecap="round"/>
<line x1="84" y1="896" x2="78.8" y2="886.3" stroke="#123641" stroke-width="2.5" stroke-linecap="round"/>
<line x1="84" y1="896" x2="89.2" y2="886.3" stroke="#123641" stroke-width="2.5" stroke-linecap="round"/>
<g filter="url(#sh)"><rect x="44" y="904" width="532" height="88" rx="18" fill="#FFFFFF"/></g>
<text x="66" y="936" font-size="16.5" fill="#123641" font-weight="800">⑥ 計畫設計與劑量計算</text>
<text x="66" y="962" font-size="13.8" fill="#345963">物理師排照野、算劑量；等的那幾天，你的計畫正在被畫、被算。</text>
<line x1="84" y1="998" x2="84" y2="1018" stroke="#123641" stroke-width="2.5" stroke-linecap="round"/>
<line x1="84" y1="1018" x2="78.8" y2="1008.3" stroke="#123641" stroke-width="2.5" stroke-linecap="round"/>
<line x1="84" y1="1018" x2="89.2" y2="1008.3" stroke="#123641" stroke-width="2.5" stroke-linecap="round"/>
<g filter="url(#sh)"><rect x="44" y="1026" width="532" height="88" rx="18" fill="#FFFFFF"/></g>
<text x="66" y="1058" font-size="16.5" fill="#123641" font-weight="800">⑦ 上機品質驗證</text>
<text x="66" y="1084" font-size="13.8" fill="#345963">確認機器實際打出來的劑量，和電腦算出來的一致。</text>
<line x1="84" y1="1120" x2="84" y2="1140" stroke="#123641" stroke-width="2.5" stroke-linecap="round"/>
<line x1="84" y1="1140" x2="78.8" y2="1130.3" stroke="#123641" stroke-width="2.5" stroke-linecap="round"/>
<line x1="84" y1="1140" x2="89.2" y2="1130.3" stroke="#123641" stroke-width="2.5" stroke-linecap="round"/>
<g filter="url(#sh)"><rect x="44" y="1148" width="532" height="88" rx="18" fill="#FFFFFF"/></g>
<text x="66" y="1180" font-size="16.5" fill="#123641" font-weight="800">⑧ 第一次治療與每週評估</text>
<text x="66" y="1206" font-size="13.8" fill="#345963">報到、擺位、影像確認、照射；擺位與確認占大部分時間，過程不痛不熱。</text>
<g filter="url(#sh)"><rect x="44" y="1260" width="532" height="154" rx="18" fill="#FFFFFF"/></g>
<text x="66" y="1292" font-size="16.5" fill="#123641" font-weight="800">閉氣這件事，設備只負責盯著</text>
<text x="66" y="1318" font-size="13.8" fill="#345963">吸氣位置的容許範圍典型只有 2 到 5 公釐，一超出範圍機器自動停束。</text>
<text x="66" y="1340" font-size="13.8" fill="#345963">每一個照野開始前都要重新吸氣、重新閉住；文獻的一致觀察是配合度很高。</text>
<text x="66" y="1362" font-size="13.8" fill="#345963">但預選訓練後仍有約三成無法完成閉氣定位掃描——練不起來會改用其他方</text>
<text x="66" y="1384" font-size="13.8" fill="#345963">式規劃。</text>
<rect x="44" y="1438" width="532" height="174" rx="16" fill="none" stroke="#C9A83E" stroke-width="2.5"/>
<text x="66" y="1470" font-size="15.5" fill="#8F7418" font-weight="800">這張圖上沒有天數，也沒有分鐘數</text>
<text x="66" y="1494" font-size="13.8" fill="#345963">定位到第一次治療隔幾天、單次治療躺幾分鐘、一口氣要閉幾秒——三個問題我</text>
<text x="66" y="1518" font-size="13.8" fill="#345963">在文獻裡都查不到可引用的通則，所以不畫、不編；依你醫院的排程與說明為準。</text>
<text x="66" y="1542" font-size="13.8" fill="#345963">查得到的只有訓練時段 15 到 30 分鐘（38 篇研究的系統性回顧，涵蓋 2000</text>
<text x="66" y="1566" font-size="13.8" fill="#345963">到 2014 年間文獻）——那是「練習要花多久」，不是「治療要花多久」，兩者</text>
<text x="66" y="1590" font-size="13.8" fill="#345963">不能混用。</text>
<text x="44" y="1648" font-size="12" fill="#6B8084">示意圖，依 Latty 2015、Bergom 2018 與 Lai 2022 重繪</text>
<text x="44" y="1668" font-size="12" fill="#6B8084">流程節點依一般臨床順序繪製，各院的名稱、順序與排程不同，以你醫院的說明為準</text>
  </g>
</svg>
