<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1400" viewBox="0 0 620 1400" role="img" aria-labelledby="t d">
  <title id="t">The demand-versus-limit gap: why brachytherapy exists</title>
  <desc id="d">Schematic: dose axis 0 to 100 Gy EQD2. The tumour (CTV-HR D90) needs 85–95 Gy; external-beam radiotherapy gives the whole pelvis 45 Gy in 25 fractions, and brachytherapy adds 40–45 Gy EQD2 to the tumour alone; meanwhile the rectum D2cm3 must stay below 65 (hard limit 75) and the bladder below 80 (hard limit 90). External beam cannot bridge a demand that sits above the organ limits; a source inside the tumour, with dose falling steeply with distance, can. Brachytherapy is an essential component of definitive radiotherapy, not an optional boost.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><pattern id="hz" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#96790F" stroke-width="2" opacity="0.55"/></pattern><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="620" height="1400" rx="30" fill="url(#bg)"/>
  <g class="z">
<text x="44" y="62" font-size="14" fill="#A98722" font-weight="800" letter-spacing="3.5px">DOSE: DEMAND VS LIMIT</text>
<text x="44" y="112" font-size="30" fill="#123641" font-weight="800" class="r">The tumour needs 85–95;</text>
<text x="44" y="152" font-size="30" fill="#123641" font-weight="800" class="r">the rectum allows 65–75</text>
<text x="44" y="194" font-size="14.5" fill="#527078">From outside, tumour and organs get much</text>
<text x="44" y="216" font-size="14.5" fill="#527078">the same dose — push higher and the organs</text>
<text x="44" y="238" font-size="14.5" fill="#527078">overshoot first. Put the source inside and</text>
<text x="44" y="260" font-size="14.5" fill="#527078">dose falls steeply with distance.</text>
<line x1="60" y1="324" x2="60" y2="812" stroke="#DBD3BF" stroke-width="1"/>
<text x="60" y="834" font-size="13.5" fill="#6B8084" text-anchor="middle">0</text>
<line x1="163.2" y1="324" x2="163.2" y2="812" stroke="#DBD3BF" stroke-width="1"/>
<text x="163.2" y="834" font-size="13.5" fill="#6B8084" text-anchor="middle">20</text>
<line x1="266.4" y1="324" x2="266.4" y2="812" stroke="#DBD3BF" stroke-width="1"/>
<text x="266.4" y="834" font-size="13.5" fill="#6B8084" text-anchor="middle">40</text>
<line x1="369.6" y1="324" x2="369.6" y2="812" stroke="#DBD3BF" stroke-width="1"/>
<text x="369.6" y="834" font-size="13.5" fill="#6B8084" text-anchor="middle">60</text>
<line x1="472.8" y1="324" x2="472.8" y2="812" stroke="#DBD3BF" stroke-width="1"/>
<text x="472.8" y="834" font-size="13.5" fill="#6B8084" text-anchor="middle">80</text>
<line x1="576" y1="324" x2="576" y2="812" stroke="#DBD3BF" stroke-width="1"/>
<text x="576" y="834" font-size="13.5" fill="#6B8084" text-anchor="middle">100</text>
<rect x="447" y="324" width="51.6" height="488" fill="#A98722" opacity="0.13"/>
<line x1="60" y1="812" x2="576" y2="812" stroke="#6B8084" stroke-width="1.5"/>
<text x="576" y="856" font-size="13.5" fill="#345963" font-weight="600" text-anchor="end">EQD2 dose (Gy)</text>
<text x="472.8" y="314" font-size="13" fill="#8F7418" font-weight="800" text-anchor="middle">the demand-vs-limit gap</text>
<text x="60" y="342" font-size="15" fill="#345963" font-weight="700">Tumour demand (CTV-HR D90)</text>
<rect x="498.6" y="368" width="51.6" height="20" rx="4" fill="#96790F"/>
<text x="493.44" y="383" font-size="14" fill="#96790F" font-weight="800" text-anchor="end">85–95</text>
<text x="60" y="460" font-size="15" fill="#345963" font-weight="700">How it is delivered</text>
<rect x="60" y="486" width="232.2" height="20" rx="4" fill="#5C77C4"/>
<rect x="294.2" y="486" width="230.2" height="20" rx="4" fill="url(#hz)"/>
<rect x="294.2" y="486" width="230.2" height="20" rx="4" fill="none" stroke="#96790F" stroke-width="1.8"/>
<text x="60" y="528" font-size="13" fill="#5C77C4" font-weight="700">External beam 45 Gy / 25 fx (whole pelvis)</text>
<text x="163.2" y="548" font-size="13" fill="#8F7418" font-weight="700">Brachytherapy adds 40–45 Gy (tumour only)</text>
<text x="60" y="578" font-size="15" fill="#345963" font-weight="700">Rectum (D2cm³)</text>
<rect x="60" y="604" width="335.4" height="20" rx="4" fill="#00806B" opacity="0.3"/>
<rect x="397.4" y="604" width="49.6" height="20" rx="4" fill="none" stroke="#00806B" stroke-width="1.8" stroke-dasharray="5 4"/>
<line x1="395.4" y1="599" x2="395.4" y2="629" stroke="#00806B" stroke-width="3"/>
<line x1="447" y1="599" x2="447" y2="629" stroke="#00806B" stroke-width="3"/>
<text x="439" y="646" font-size="13.5" fill="#00806B" font-weight="700" text-anchor="end">aim &lt;65, limit &lt;75</text>
<text x="60" y="696" font-size="15" fill="#345963" font-weight="700">Bladder (D2cm³)</text>
<rect x="60" y="722" width="412.8" height="20" rx="4" fill="#00806B" opacity="0.3"/>
<rect x="474.8" y="722" width="49.6" height="20" rx="4" fill="none" stroke="#00806B" stroke-width="1.8" stroke-dasharray="5 4"/>
<line x1="472.8" y1="717" x2="472.8" y2="747" stroke="#00806B" stroke-width="3"/>
<line x1="524.4" y1="717" x2="524.4" y2="747" stroke="#00806B" stroke-width="3"/>
<text x="516.4" y="764" font-size="13.5" fill="#00806B" font-weight="700" text-anchor="end">aim &lt;80, limit &lt;90</text>
<g filter="url(#sh)"><rect x="44" y="878" width="532" height="250" rx="18" fill="#FFFFFF"/></g>
<text x="68" y="914" font-size="16" fill="#123641" font-weight="800">Irradiating from inside (schematic)</text>
<line x1="90" y1="1068" x2="520" y2="1068" stroke="#6B8084" stroke-width="1.5"/>
<line x1="90" y1="1068" x2="90" y2="948" stroke="#6B8084" stroke-width="1.5"/>
<path d="M96,954 L106.5,954 L117,954 L127.5,954 L138,960.136 L148.5,986.337 L159,1003.89 L169.5,1016.22 L180,1025.22 L190.5,1031.97 L201,1037.18 L211.5,1041.28 L222,1044.56 L232.5,1047.23 L243,1049.43 L253.5,1051.27 L264,1052.81 L274.5,1054.13 L285,1055.26 L295.5,1056.23 L306,1057.08 L316.5,1057.82 L327,1058.47 L337.5,1059.05 L348,1059.56 L358.5,1060.02 L369,1060.43 L379.5,1060.8 L390,1061.14 L400.5,1061.44 L411,1061.72 L421.5,1061.97 L432,1062.2 L442.5,1062.41 L453,1062.6 L463.5,1062.78 L474,1062.95 L484.5,1063.1 L495,1063.24 L505.5,1063.37 L516,1063.49" fill="none" stroke="#96790F" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="92" y="948" width="60" height="120" fill="#96790F" opacity="0.14"/>
<circle cx="104" cy="964" r="5" fill="#96790F"/>
<text x="122" y="1088" font-size="13" fill="#8F7418" font-weight="700" text-anchor="middle">Tumour</text>
<text x="450" y="1088" font-size="13" fill="#00806B" font-weight="700" text-anchor="middle">Rectum / bladder</text>
<line x1="450" y1="1068" x2="450" y2="1042" stroke="#00806B" stroke-width="2" stroke-dasharray="4 3"/>
<text x="520" y="1108" font-size="12" fill="#6B8084" text-anchor="end">Distance from source →</text>
<g filter="url(#sh)"><rect x="44" y="1154" width="532" height="176" rx="18" fill="#FFFFFF"/></g>
<line x1="62" y1="1174" x2="62" y2="1310" stroke="#96790F" stroke-width="4" stroke-linecap="round"/>
<text x="80" y="1192" font-size="14.5" fill="#123641" font-weight="700">Brachytherapy is an essential component</text>
<text x="80" y="1218" font-size="14.5" fill="#123641" font-weight="700">of definitive radiotherapy, not an optional</text>
<text x="80" y="1244" font-size="14.5" fill="#123641" font-weight="700">boost — it must not be replaced by an</text>
<text x="80" y="1270" font-size="14.5" fill="#123641" font-weight="700">external boost, photon or proton.</text>
<text x="80" y="1296" font-size="14.5" fill="#345963">Skipping it (SEER, matched, IB2–IVA):</text>
<text x="80" y="1322" font-size="14.5" fill="#345963">4-yr overall survival 64.0% vs 51.4%.</text>
<text x="44" y="1358" font-size="12" fill="#6B8084">Schematic redrawn from ESGO/ESTRO/ESP 2023 and</text>
<text x="44" y="1378" font-size="12" fill="#6B8084">the EMBRACE-II protocol dose aims | Han 2024 (SEER)</text>
  </g>
</svg>
