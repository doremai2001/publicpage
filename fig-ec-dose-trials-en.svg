<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1603" viewBox="0 0 1440 1603" role="img" aria-labelledby="t d">
  <title id="t">Dose-escalation trials at a glance: 60–66 Gy never proved better</title>
  <desc id="d">Schematic overview of radiation dose-escalation trials in oesophageal cancer; each row's two bars are the two arms' doses. Starting point RTOG 85-01 (n=121, SCC plus adenocarcinoma): 50 Gy with cisplatin/5-FU vs 64 Gy radiotherapy alone, 5-year survival 26% vs 0% — the lower-dose arm lived longer because chemotherapy was added; severe and life-threatening toxicity 44%/20% vs 25%/3%. INT 0123 (218 analysable, SCC plus adenocarcinoma, cisplatin/5-FU): 50.4 vs 64.8 Gy, 2-year overall survival 40% vs 31%, not significant; local failure 52% vs 56%; 11 treatment-related deaths in the high-dose arm vs 2 (7 occurred at 50.4 Gy or less). ARTDECO (n=260, the Netherlands, 61% SCC, weekly carboplatin/paclitaxel): 50.4 vs 61.6 Gy, 3-year local PFS 70% vs 73%, not significant; grade 4/5 toxicity 12%/5% vs 14%/10%. CONCORDE/PRODIGE 26 (n=217, France, 88% SCC, FOLFOX, conference abstract): 50 vs 66 Gy, 2-year locoregional PFS 42.7% vs 43.8%, median overall survival 25.2 vs 23.5 months, toxic deaths 4.6% vs 6.7%. Chinese multicentre trial (319 analysable, all SCC, weekly docetaxel/cisplatin): 50 vs 60 Gy, 3-year locoregional PFS 48.4% vs 49.5%, 3-year overall survival 52.7% vs 53.1%, 8-year locoregional PFS 36.3% vs 32.7%, more grade 3 or higher pneumonitis at 60 Gy. All four escalation trials are tagged 'escalation not shown better'. Japan itself moved its standard from 60 Gy back to 50.4 Gy.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="1603" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="86" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">DOSE ESCALATION — FIVE RANDOMISED READOUTS</text>
<text x="84" y="148" font-size="38" fill="#123641" font-weight="800" class="r">Dose-escalation trials at a glance: 60–66 Gy never proved better</text>
<text x="84" y="194" font-size="21" fill="#527078">Each row is one randomised trial: the two bars are the two arms' radiation doses, the result direction is on the right.</text>
<text x="84" y="224" font-size="21" fill="#527078">Cohort and chemotherapy are noted under each row; rows do not compare with each other.</text>
<text x="84" y="254" font-size="21" fill="#527078">The first row is not a dose-escalation trial — it explains why the standard became '50 Gy with chemotherapy' rather than</text>
<text x="84" y="284" font-size="21" fill="#527078">higher-dose radiotherapy alone.</text>
<text x="106" y="340" font-size="12.5" fill="#6B8084" text-anchor="middle">0</text>
<text x="179.71" y="340" font-size="12.5" fill="#6B8084" text-anchor="middle">10</text>
<text x="253.43" y="340" font-size="12.5" fill="#6B8084" text-anchor="middle">20</text>
<text x="327.14" y="340" font-size="12.5" fill="#6B8084" text-anchor="middle">30</text>
<text x="400.86" y="340" font-size="12.5" fill="#6B8084" text-anchor="middle">40</text>
<text x="474.57" y="340" font-size="12.5" fill="#6B8084" text-anchor="middle">50</text>
<text x="548.29" y="340" font-size="12.5" fill="#6B8084" text-anchor="middle">60</text>
<text x="622" y="340" font-size="12.5" fill="#6B8084" text-anchor="middle">70</text>
<text x="622" y="358" font-size="12.5" fill="#6B8084" text-anchor="end">Gy</text>
<g filter="url(#sh)"><rect x="84" y="368" width="1272" height="196.21" rx="18" fill="#E3E8F6"/></g>
<text x="106" y="405.3" font-size="18" fill="#123641" font-weight="800">Starting point | RTOG 85-01 (Herskovic 1992 / Cooper 1999)</text>
<text x="106" y="430.2" font-size="14" fill="#6B8084">n=121 randomised, SCC + adenocarcinoma, thoracic</text>
<rect x="106" y="449.9" width="516" height="26" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="106" y="449.9" width="368.57" height="26" rx="4" fill="#5C77C4" opacity="0.9"/>
<line x1="474.57" y1="447.9" x2="474.57" y2="477.9" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.5"/>
<text x="116" y="467.94" font-size="14" fill="#FFFFFF" font-weight="800">50 Gy + cisplatin/5-FU</text>
<rect x="106" y="485.9" width="516" height="26" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="106" y="485.9" width="471.77" height="26" rx="4" fill="#96790F" opacity="0.9"/>
<line x1="474.57" y1="483.9" x2="474.57" y2="513.9" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.5"/>
<text x="116" y="503.94" font-size="14" fill="#FFFFFF" font-weight="800">64 Gy radiotherapy alone</text>
<text x="654" y="463.16" font-size="15.6" fill="#123641" font-weight="800">5-year survival 26% vs 0%</text>
<text x="654" y="483.64" font-size="14" fill="#345963">The lower-dose arm lived longer — because chemotherapy was added; cost: severe/life-threatening toxicity</text>
<text x="654" y="503.94" font-size="14" fill="#345963">44%/20% vs 25%/3%</text>
<rect x="654" y="520.34" width="283.23" height="21.88" rx="10.94" fill="#5C77C4"/>
<text x="795.62" y="535.78" font-size="12.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">A chemotherapy effect, not a dose effect</text>
<g filter="url(#sh)"><rect x="84" y="578.21" width="1272" height="196.21" rx="18" fill="#FFFFFF"/></g>
<text x="106" y="615.51" font-size="18" fill="#123641" font-weight="800">INT 0123 / RTOG 94-05 (Minsky 2002)</text>
<text x="106" y="640.41" font-size="14" fill="#6B8084">218 analysable, SCC + adenocarcinoma, T1–4 N0/1, cisplatin/5-FU</text>
<rect x="106" y="660.11" width="516" height="26" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="106" y="660.11" width="371.52" height="26" rx="4" fill="#5C77C4" opacity="0.9"/>
<line x1="474.57" y1="658.11" x2="474.57" y2="688.11" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.5"/>
<text x="116" y="678.15" font-size="14" fill="#FFFFFF" font-weight="800">50.4 Gy</text>
<rect x="106" y="696.11" width="516" height="26" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="106" y="696.11" width="477.67" height="26" rx="4" fill="#96790F" opacity="0.9"/>
<line x1="474.57" y1="694.11" x2="474.57" y2="724.11" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.5"/>
<text x="116" y="714.15" font-size="14" fill="#FFFFFF" font-weight="800">64.8 Gy</text>
<text x="654" y="673.37" font-size="15.6" fill="#123641" font-weight="800">2-year OS 40% vs 31% (not significant)</text>
<text x="654" y="693.85" font-size="14" fill="#345963">median survival 18.1 vs 13.0 months; local failure/persistence 52% vs 56%; 11 treatment-related</text>
<text x="654" y="714.15" font-size="14" fill="#345963">deaths in the high-dose arm vs 2 (7 occurred at ≤50.4 Gy); stopped after interim analysis</text>
<rect x="654" y="730.55" width="415.09" height="21.88" rx="10.94" fill="#9A9282"/>
<text x="861.54" y="745.99" font-size="12.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">Escalation not shown better; more deaths in the high-dose arm</text>
<g filter="url(#sh)"><rect x="84" y="788.43" width="1272" height="196.21" rx="18" fill="#FFFFFF"/></g>
<text x="106" y="825.73" font-size="18" fill="#123641" font-weight="800">ARTDECO (Hulshof 2021)</text>
<text x="106" y="850.63" font-size="14" fill="#6B8084">n=260, the Netherlands, 61% SCC / 39% adenocarcinoma, weekly carboplatin/paclitaxel</text>
<rect x="106" y="870.33" width="516" height="26" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="106" y="870.33" width="371.52" height="26" rx="4" fill="#5C77C4" opacity="0.9"/>
<line x1="474.57" y1="868.33" x2="474.57" y2="898.33" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.5"/>
<text x="116" y="888.37" font-size="14" fill="#FFFFFF" font-weight="800">50.4 Gy</text>
<rect x="106" y="906.33" width="516" height="26" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="106" y="906.33" width="454.08" height="26" rx="4" fill="#96790F" opacity="0.9"/>
<line x1="474.57" y1="904.33" x2="474.57" y2="934.33" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.5"/>
<text x="116" y="924.37" font-size="14" fill="#FFFFFF" font-weight="800">61.6 Gy (boost to primary)</text>
<text x="654" y="883.59" font-size="15.6" fill="#123641" font-weight="800">3-year local PFS 70% vs 73% (not significant)</text>
<text x="654" y="904.07" font-size="14" fill="#345963">SCC 75% vs 79%, adenocarcinoma 61% vs 61%; grade 4/5 toxicity 12%/5% vs 14%/10% (p=0.15);</text>
<text x="654" y="924.37" font-size="14" fill="#345963">radiotherapy completion 94%</text>
<rect x="654" y="940.77" width="197.78" height="21.88" rx="10.94" fill="#9A9282"/>
<text x="752.89" y="956.21" font-size="12.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">Escalation not shown better</text>
<g filter="url(#sh)"><rect x="84" y="998.64" width="1272" height="179.9" rx="18" fill="#FFFFFF"/></g>
<text x="106" y="1035.94" font-size="18" fill="#123641" font-weight="800">CONCORDE / PRODIGE 26 (Crehange 2021)</text>
<text x="106" y="1060.84" font-size="14" fill="#6B8084">n=217, France, 88% SCC, FOLFOX</text>
<rect x="106" y="1080.54" width="516" height="26" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="106" y="1080.54" width="368.57" height="26" rx="4" fill="#5C77C4" opacity="0.9"/>
<line x1="474.57" y1="1078.54" x2="474.57" y2="1108.54" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.5"/>
<text x="116" y="1098.58" font-size="14" fill="#FFFFFF" font-weight="800">50 Gy in 25 fractions</text>
<rect x="106" y="1116.54" width="516" height="26" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="106" y="1116.54" width="486.51" height="26" rx="4" fill="#96790F" opacity="0.9"/>
<line x1="474.57" y1="1114.54" x2="474.57" y2="1144.54" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.5"/>
<text x="116" y="1134.58" font-size="14" fill="#FFFFFF" font-weight="800">66 Gy in 33 fractions</text>
<text x="654" y="1093.8" font-size="15.6" fill="#123641" font-weight="800">2-year locoregional PFS 42.7% vs 43.8% (HR 1.03)</text>
<text x="654" y="1114.28" font-size="14" fill="#345963">median OS 25.2 vs 23.5 months (HR 1.14, p=0.44); toxic deaths 4.6% vs 6.7%</text>
<rect x="654" y="1130.68" width="369.53" height="21.88" rx="10.94" fill="#9A9282"/>
<text x="838.76" y="1146.12" font-size="12.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">Escalation not shown better | conference abstract only</text>
<g filter="url(#sh)"><rect x="84" y="1192.54" width="1272" height="196.21" rx="18" fill="#FFFFFF"/></g>
<text x="106" y="1229.84" font-size="18" fill="#123641" font-weight="800">Chinese multicentre 50 vs 60 Gy (Xu 2022; Cheng 2026 long-term)</text>
<text x="106" y="1254.74" font-size="14" fill="#6B8084">319 analysable, all SCC, stages IIA–IVA, weekly docetaxel/cisplatin</text>
<rect x="106" y="1274.44" width="516" height="26" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="106" y="1274.44" width="368.57" height="26" rx="4" fill="#5C77C4" opacity="0.9"/>
<line x1="474.57" y1="1272.44" x2="474.57" y2="1302.44" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.5"/>
<text x="116" y="1292.48" font-size="14" fill="#FFFFFF" font-weight="800">50 Gy</text>
<rect x="106" y="1310.44" width="516" height="26" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="106" y="1310.44" width="442.29" height="26" rx="4" fill="#96790F" opacity="0.9"/>
<line x1="474.57" y1="1308.44" x2="474.57" y2="1338.44" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.5"/>
<text x="116" y="1328.48" font-size="14" fill="#FFFFFF" font-weight="800">60 Gy</text>
<text x="654" y="1287.7" font-size="15.6" fill="#123641" font-weight="800">3-year locoregional PFS 48.4% vs 49.5% (HR 1.00)</text>
<text x="654" y="1308.18" font-size="14" fill="#345963">3-year OS 52.7% vs 53.1%; median follow-up 99.5 months: 8-year locoregional PFS 36.3% vs 32.7%</text>
<text x="654" y="1328.48" font-size="14" fill="#345963">(HR 1.06); more grade 3+ pneumonitis in the 60 Gy arm (p=0.03)</text>
<rect x="654" y="1344.88" width="372.51" height="21.88" rx="10.94" fill="#9A9282"/>
<text x="840.25" y="1360.32" font-size="12.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">Escalation not shown better; more grade 3+ pneumonitis</text>
<rect x="84" y="1406.76" width="16" height="16" rx="5" fill="#5C77C4" opacity="0.9"/>
<text x="108" y="1419.76" font-size="14" fill="#345963" font-weight="600">Standard-dose arm</text>
<rect x="271.59" y="1406.76" width="16" height="16" rx="5" fill="#96790F" opacity="0.9"/>
<text x="295.59" y="1419.76" font-size="14" fill="#345963" font-weight="600">High-dose arm</text>
<line x1="431.3" y1="1404.76" x2="431.3" y2="1424.76" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.6"/>
<text x="447.3" y="1419.76" font-size="14" fill="#345963" font-weight="600">50 Gy reference</text>
<text x="84" y="1458.76" font-size="14" fill="#6B8084" font-weight="600">Japan itself moved its standard from 60 Gy (JCOG0303) back to 50.4 Gy (JCOG0909), 'in an attempt to reduce the risk of adverse events and the risk associated with salvage</text>
<text x="84" y="1479.06" font-size="14" fill="#6B8084" font-weight="600">esophagectomy'. 'Not shown better' is not 'shown equal' — every trial's confidence interval is wide, and ESO-Shanghai 12 is still testing 61.2 vs 50.4 Gy with PET-based stratification.</text>
<text x="84" y="1525.36" font-size="16" fill="#6B8084">Schematic, redrawn from Herskovic 1992, Cooper 1999, Minsky 2002, Hulshof 2021, Crehange 2021 (ASTRO conference abstract), Xu 2022, Cheng 2026 and the JES</text>
<text x="84" y="1549.36" font-size="16" fill="#6B8084">2022 guideline | cohorts, chemotherapy regimens and endpoints differ — rows are not directly comparable</text>
  </g>
</svg>
