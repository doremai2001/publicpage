<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1019" viewBox="0 0 720 1019" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">兩個都是真的數字</title>
  <desc id="d">同一個試驗，同一批 27 位復發膠質母細胞瘤病人。 影像幾乎沒有反應，一年後卻有近八成的人還活著。 27 人裡有 21 人（78%）在惡化後接受了 bevacizumab。所以這個比較的實際內容是 「BNCT 之後再接 bevacizumab」對上「bevacizumab 單藥」，而且對照組是四到六年前的世代。 第三級以上治療相關不良事件 81.5%；腦水腫 48.1%。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#123641" opacity=".10"/><line x1="0" y1="0" x2="0" y2="8" stroke="#123641" stroke-width="2.2" opacity=".75"/></pattern><pattern id="hatchlite" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#123641" stroke-width="1.4" opacity=".22"/></pattern><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="720" height="1019" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="48" y="81" font-size="15" fill="#A98722" font-weight="800" letter-spacing="5px">HOW TO READ A TRIAL</text>
<text x="48" y="138" font-size="37" fill="#123641" font-weight="800" class="r">兩個都是真的數字</text>
<text x="48" y="182" font-size="18" fill="#527078">同一個試驗，同一批 27 位復發膠質母細胞瘤病人。</text>
<text x="48" y="208" font-size="18" fill="#527078">影像幾乎沒有反應，一年後卻有近八成的人還活著。</text>
<rect x="48" y="258" width="624" height="172" rx="16" fill="#123641" opacity="0.05"/>
<rect x="48" y="258" width="624" height="5" rx="3" fill="#5C77C4" opacity="0.9"/>
<text x="66" y="297" font-size="17" fill="#5C77C4" font-weight="800">影像看到的</text>
<text x="66" y="333" font-size="13" fill="#527078">RANO 影像反應率</text>
<text x="654" y="333" font-size="21" fill="#123641" font-weight="800" text-anchor="end">3.7%</text>
<text x="66" y="365" font-size="13" fill="#527078">中位無惡化存活</text>
<text x="654" y="365" font-size="21" fill="#123641" font-weight="800" text-anchor="end">0.9 個月</text>
<text x="66" y="400" font-size="12" fill="#6B8084">腦部照射後常有假性惡化，RANO 在這個情境下會失真</text>
<rect x="48" y="445" width="624" height="172" rx="16" fill="#123641" opacity="0.05"/>
<rect x="48" y="445" width="624" height="5" rx="3" fill="#A98722" opacity="0.9"/>
<text x="66" y="484" font-size="17" fill="#A98722" font-weight="800">存活看到的</text>
<text x="66" y="520" font-size="13" fill="#527078">1 年存活率</text>
<text x="654" y="520" font-size="21" fill="#123641" font-weight="800" text-anchor="end">79.2%</text>
<text x="66" y="552" font-size="13" fill="#527078">中位總存活</text>
<text x="654" y="552" font-size="21" fill="#123641" font-weight="800" text-anchor="end">18.9 個月</text>
<text x="66" y="587" font-size="12" fill="#6B8084">95% 信賴區間 57.0–90.8</text>
<text x="48" y="642" font-size="15" fill="#123641" font-weight="700">JG002（BNCT，n=27）</text>
<rect x="48" y="669" width="624" height="29" rx="8" fill="#123641" opacity="0.05"/>
<rect x="48" y="669" width="561" height="29" rx="8" fill="#A98722" opacity="0.88"/>
<text x="60" y="688" font-size="13" fill="#FFFFFF" font-weight="700">18.9 個月</text>
<text x="48" y="716" font-size="15" fill="#123641" font-weight="700">JO22506（bevacizumab 單藥，n=31，2012 年）</text>
<rect x="48" y="743" width="624" height="29" rx="8" fill="#123641" opacity="0.05"/>
<rect x="48" y="743" width="312" height="29" rx="8" fill="#123641" opacity="0.14" stroke="#123641" stroke-width="2"/>
<rect x="48" y="743" width="312" height="29" rx="8" fill="url(#hatchlite)"/>
<text x="60" y="762" font-size="13" fill="#345963" font-weight="700">10.5 個月　非同期歷史對照</text>
<rect x="48" y="810" width="624" height="2" rx="1" fill="#A98722" opacity="0.5"/>
<text x="48" y="839" font-size="16" fill="#345963" font-weight="700">27 人裡有 21 人（78%）在惡化後接受了 bevacizumab。所以這個比較的實際內容是</text>
<text x="48" y="864" font-size="16" fill="#345963" font-weight="700">「BNCT 之後再接 bevacizumab」對上「bevacizumab 單藥」，而且對照組是四到六</text>
<text x="48" y="889" font-size="16" fill="#345963" font-weight="700">年前的世代。</text>
<text x="48" y="914" font-size="16" fill="#345963" font-weight="700">第三級以上治療相關不良事件 81.5%；腦水腫 48.1%。</text>
<text x="48" y="945" font-size="13" fill="#6B8084">示意圖，依 Kawabata 等 2021（Neuro-Oncology Advances）與 Nagane 等 2012（Jpn J Clin Oncol</text>
<text x="48" y="965" font-size="13" fill="#6B8084">）重繪；長條為存活月數的相對長度。</text>
  </g>
</svg>
