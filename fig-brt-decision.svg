<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1426" viewBox="0 0 1440 1426" role="img" aria-labelledby="t d">
  <title id="t">誰需要術後放療：手術型式 × 淋巴結的診間地圖</title>
  <desc id="d">示意圖：誰需要術後放射治療的診間地圖，兩個變數是手術型式（乳房保留手術或全切除）與腋下淋巴結狀態（陰性、陽性、幾顆）。格上的標籤有三種，不可互換：建議、要談的決定、不是常規適應症。保留手術加淋巴結陰性，標籤是建議——全乳照射是配套不是加購：EBCTCG 統合（17 個試驗、pN0 共 7,287 人）10 年任何首次復發從 31.0% 降到 15.6%、15 年乳癌死亡從 20.5% 降到 17.2%；地標 NSABP B-06 追 20 年，單純腫瘤切除不照的同側乳房復發累積 39.2%、加上照射 14.3%；年紀較大、腫瘤小、荷爾蒙受體陽性的一群有省略照射可談，條件與代價另有專篇。保留手術加淋巴結陽性，標籤同樣是建議：同一份統合（pN+ 共 1,050 人，人數少、信賴區間較寬）10 年復發從 63.7% 降到 42.5%、15 年乳癌死亡從 51.3% 降到 42.8%；要不要連區域淋巴一起照是另一個決定。全切除加淋巴結陰性（腋下廓清後 0 顆陽性），標籤是不是常規適應症：EBCTCG 統合的 700 人裡，照了復發與乳癌死亡都沒有降，率比 1.06 與 1.18、兩個都不顯著。全切除加淋巴結陽性分成兩格。1 到 3 顆陽性的標籤是要談的決定：老統合 1,314 人顯示照胸壁加區域淋巴把乳癌死亡率比壓到 0.80（95% 信賴區間 0.67 到 0.95），但 2025 年讀出的 SUPREMO 用現代全身治療重做（1,607 人、中位追蹤 9.6 年），10 年總存活 81.4% 對 81.9%（風險比 1.04、p 值 0.80，沒有差），胸壁復發 1.1% 對 2.5%（風險比 0.45，有差）；兩份的介入也不同，老試驗照胸壁加區域淋巴、SUPREMO 只照胸壁——所以這一格不是自動要、也不是自動不要，是把顆數、腫瘤大小、分化等級、淋巴血管侵犯攤開來談的決定。4 顆以上陽性的標籤才是建議：老統合 1,772 人顯示整體復發率比 0.79、乳癌死亡率比 0.87，而且沒有任何用現代藥物重做的隨機試驗挑戰過這一格。圖末提醒兩件事：EBCTCG 兩份統合的族群在 1960 到 80 年代收案，今日病人的絕對數字普遍比表上低、比例效應比較可信，這個標籤不可省；這張圖是診間地圖不是判決，最終落點由你的團隊依完整病理、影像與全身治療計畫判定，照射改變的是機率、不是保單。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><pattern id="hz" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#96790F" stroke-width="2" opacity="0.55"/></pattern><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="1426" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="86" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">WHO NEEDS POST-OPERATIVE RADIOTHERAPY</text>
<text x="84" y="148" font-size="44" fill="#123641" font-weight="800" class="r">誰需要術後放療：手術型式 × 淋巴結的診間地圖</text>
<text x="84" y="194" font-size="21" fill="#527078">兩個變數決定你落在哪一格：做的是保留手術還是全切除、腋下淋巴結有沒有轉移、幾顆。</text>
<text x="84" y="224" font-size="21" fill="#527078">格子上的標籤有三種——建議、要談的決定、不是常規適應症——它們不一樣，不可以互換。</text>
<text x="390" y="286" font-size="20" fill="#123641" font-weight="800" text-anchor="middle">乳房保留手術（PM）</text>
<text x="1050" y="286" font-size="20" fill="#123641" font-weight="800" text-anchor="middle">全切除（含改良型根除手術，MRM）</text>
<text x="84" y="316" font-size="17" fill="#8F7418" font-weight="800">淋巴結陰性</text>
<g filter="url(#sh)"><rect x="84" y="336" width="612" height="258" rx="18" fill="#FFFFFF"/></g>
<g filter="url(#sh)"><rect x="744" y="336" width="612" height="258" rx="18" fill="#FFFFFF"/></g>
<rect x="110" y="358" width="150" height="34" rx="14.98" fill="#00806B"/>
<text x="185" y="381.46" font-size="17.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">建議</text>
<text x="110" y="424" font-size="18" fill="#123641" font-weight="800">全乳照射是配套，不是加購</text>
<text x="110" y="460" font-size="14.2" fill="#345963">EBCTCG 統合（17 個試驗、pN0 共 7,287 人）：10 年任何首次復發 31.0% 降到</text>
<text x="110" y="484" font-size="14.2" fill="#345963">15.6%、15 年乳癌死亡 20.5% 降到 17.2%。</text>
<text x="110" y="508" font-size="14.2" fill="#345963">地標 NSABP B-06 追 20 年：單純腫瘤切除不照，同側乳房復發累積 39.2%；加上照射</text>
<text x="110" y="532" font-size="14.2" fill="#345963">14.3%。</text>
<text x="110" y="556" font-size="14.2" fill="#345963">年紀較大、腫瘤小、荷爾蒙受體陽性的一群有「省略照射」可談，條件與代價另有專篇。</text>
<rect x="770" y="358" width="184" height="34" rx="14.98" fill="none" stroke="#6B8084" stroke-width="2"/>
<text x="862" y="381.46" font-size="17.5" fill="#6B8084" font-weight="800" text-anchor="middle">不是常規適應症</text>
<text x="770" y="424" font-size="18" fill="#123641" font-weight="800">腋下廓清後 0 顆陽性</text>
<text x="770" y="460" font-size="14.2" fill="#345963">EBCTCG 統合（700 人）：照了，復發與乳癌死亡都沒有降——率比 1.06 與 1.18，兩</text>
<text x="770" y="484" font-size="14.2" fill="#345963">個都不顯著。</text>
<text x="770" y="508" font-size="14.2" fill="#345963">所以全切除後淋巴結陰性，不是常規適應症。</text>
<text x="84" y="628" font-size="17" fill="#8F7418" font-weight="800">淋巴結陽性</text>
<g filter="url(#sh)"><rect x="84" y="648" width="612" height="518" rx="18" fill="#FFFFFF"/></g>
<g filter="url(#sh)"><rect x="744" y="648" width="612" height="518" rx="18" fill="#FFFFFF"/></g>
<rect x="110" y="670" width="150" height="34" rx="14.98" fill="#00806B"/>
<text x="185" y="693.46" font-size="17.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">建議</text>
<text x="110" y="736" font-size="18" fill="#123641" font-weight="800">淋巴結陽性的保留手術</text>
<text x="110" y="772" font-size="14.2" fill="#345963">同一份統合（pN+ 共 1,050 人，人數少、信賴區間較寬）：10 年復發 63.7% 降到</text>
<text x="110" y="796" font-size="14.2" fill="#345963">42.5%、15 年乳癌死亡 51.3% 降到 42.8%。</text>
<text x="110" y="820" font-size="14.2" fill="#345963">要不要連區域淋巴一起照，是另一個決定。</text>
<text x="110" y="844" font-size="14.2" fill="#345963">比例上砍掉的幅度各族群差不多，但你本來的風險越高，照射替你擋掉的絕對數字就越大</text>
<text x="110" y="868" font-size="14.2" fill="#345963">——所以同一張表，每個人讀出來的獲益不一樣。</text>
<rect x="770" y="670" width="150" height="34" rx="14.98" fill="none" stroke="#9A9282" stroke-width="2" stroke-dasharray="6 5"/>
<text x="845" y="693.46" font-size="17.5" fill="#9A9282" font-weight="800" text-anchor="middle">要談的決定</text>
<text x="770" y="736" font-size="18" fill="#123641" font-weight="800">1 到 3 顆陽性</text>
<text x="770" y="772" font-size="14.2" fill="#345963">老統合（1,314 人）：照胸壁加區域淋巴，把乳癌死亡率比壓到 0.80（95% 信賴區間</text>
<text x="770" y="796" font-size="14.2" fill="#345963">0.67 到 0.95）。</text>
<text x="770" y="820" font-size="14.2" fill="#345963">2025 年讀出的 SUPREMO 用現代全身治療重做（1,607 人、中位追蹤 9.6 年）：10 年</text>
<text x="770" y="844" font-size="14.2" fill="#345963">總存活 81.4% 對 81.9%（風險比 1.04、p=0.80，沒有差）；胸壁復發 1.1% 對 2.5%</text>
<text x="770" y="868" font-size="14.2" fill="#345963">（風險比 0.45，有差）。</text>
<text x="770" y="892" font-size="14.2" fill="#345963">兩份的介入也不同：老試驗照胸壁加區域淋巴，SUPREMO 只照胸壁。所以這一格不是自動</text>
<text x="770" y="916" font-size="14.2" fill="#345963">要、也不是自動不要，是把顆數、腫瘤大小、分化等級、淋巴血管侵犯攤開來談的決定。</text>
<line x1="770" y1="960" x2="1330" y2="960" stroke="#DBD3BF" stroke-width="1.5"/>
<rect x="770" y="994" width="150" height="34" rx="14.98" fill="#00806B"/>
<text x="845" y="1017.46" font-size="17.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">建議</text>
<text x="770" y="1060" font-size="18" fill="#123641" font-weight="800">4 顆以上陽性</text>
<text x="770" y="1096" font-size="14.2" fill="#345963">老統合（1,772 人）：整體復發率比 0.79、乳癌死亡率比 0.87。</text>
<text x="770" y="1120" font-size="14.2" fill="#345963">而且沒有任何用現代藥物重做的隨機試驗挑戰過這一格。</text>
<rect x="84" y="1200" width="1272" height="110" rx="16" fill="none" stroke="#C9A83E" stroke-width="2.5"/>
<text x="110" y="1232" font-size="17" fill="#8F7418" font-weight="800">這些數字怎麼讀</text>
<text x="110" y="1260" font-size="15" fill="#345963">EBCTCG 兩份統合的族群在 1960 到 80 年代收案：今日病人的絕對數字普遍比表上低，比例效應比較可信——這個標籤不可省。</text>
<text x="110" y="1288" font-size="15" fill="#345963">這張圖是診間地圖，不是判決：最終落點由你的團隊依完整病理、影像與全身治療計畫判定；照射改變的是機率，不是保單。</text>
<text x="84" y="1354" font-size="16" fill="#6B8084">示意圖，依 EBCTCG 2011、EBCTCG 2014、Kunkler 2025（SUPREMO）與 Fisher 2002（NSABP B-06）重繪</text>
<text x="84" y="1378" font-size="16" fill="#6B8084">各研究的年代、族群與照射範圍不同，格與格之間的數字不可直接互比</text>
  </g>
</svg>
