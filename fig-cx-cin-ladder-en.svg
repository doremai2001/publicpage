<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="t d">
  <title id="t">The CIN ladder: people step back at every rung</title>
  <desc id="d">Schematic of the CIN ladder and what is done at each grade. CIN 1 mostly regresses (about 60%) and observation is preferred; about half of CIN 2 regresses within 24 months (60% under age 30), treatment is recommended with conditional observation possible; CIN 3 is “carcinoma in situ” — not yet cancer, but observation is unacceptable: with proper treatment only 0.7% progress to invasive cancer over 30 years, against 31.3% untreated (50.3% if the lesion persisted), both numbers in the same frame. Beyond the basement membrane lies invasive cancer: IA1 can be cured by conisation alone, IA2 by conisation or simple hysterectomy, and from IB onwards staging and treatment routing take over.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><pattern id="hz" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#96790F" stroke-width="2" opacity="0.55"/></pattern><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="1000" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="86" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">THE CIN LADDER</text>
<text x="84" y="148" font-size="44" fill="#123641" font-weight="800" class="r">The CIN ladder: people step back at every rung</text>
<text x="84" y="194" font-size="21" fill="#527078">“Carcinoma in situ (CIN 3) is not cancer” — that sentence holds only when it is treated.</text>
<text x="84" y="224" font-size="21" fill="#527078">Beyond the basement membrane (invasive cancer), the road changes.</text>
<line x1="120" y1="806" x2="470" y2="806" stroke="#123641" stroke-width="7" stroke-linecap="round"/>
<line x1="470" y1="806" x2="470" y2="700" stroke="#123641" stroke-width="7" stroke-linecap="round"/>
<line x1="470" y1="700" x2="800" y2="700" stroke="#123641" stroke-width="7" stroke-linecap="round"/>
<line x1="800" y1="700" x2="800" y2="594" stroke="#123641" stroke-width="7" stroke-linecap="round"/>
<line x1="800" y1="594" x2="1058" y2="594" stroke="#123641" stroke-width="7" stroke-linecap="round"/>
<g filter="url(#sh)"><rect x="126" y="620" width="336" height="158" rx="18" fill="#FFFFFF"/></g>
<text x="148" y="652" font-size="20" fill="#123641" font-weight="800">CIN 1</text>
<text x="208.8" y="652" font-size="14" fill="#6B8084">— low-grade lesion</text>
<text x="148" y="680" font-size="14.2" fill="#345963">~60% regress | ~30% persist</text>
<text x="148" y="702" font-size="14.2" fill="#345963">10% → CIN 3, 1% → invasive cancer</text>
<text x="148" y="724" font-size="14.2" fill="#345963">(older studies; no single timeline)</text>
<text x="148" y="752" font-size="14.5" fill="#00806B" font-weight="800">Management: observation preferred</text>
<g filter="url(#sh)"><rect x="470" y="512" width="336" height="160" rx="18" fill="#FFFFFF"/></g>
<text x="492" y="544" font-size="20" fill="#123641" font-weight="800">CIN 2</text>
<text x="552.8" y="544" font-size="14" fill="#6B8084">— high-grade lesion</text>
<text x="492" y="572" font-size="14.2" fill="#345963">24 mo: 50% regress (60% if under 30)</text>
<text x="492" y="594" font-size="14.2" fill="#345963">32% persist, 18% progress</text>
<text x="492" y="616" font-size="14.2" fill="#345963">(surveillance cohorts, 3,160 women)</text>
<text x="492" y="644" font-size="14.5" fill="#00806B" font-weight="800">Management: treat; conditional </text>
<text x="492" y="665" font-size="14.5" fill="#00806B" font-weight="800">observation possible</text>
<g filter="url(#sh)"><rect x="700" y="296" width="404" height="154" rx="18" fill="#FFFFFF"/></g>
<text x="724" y="330" font-size="20" fill="#123641" font-weight="800">CIN 3 = “carcinoma in situ”</text>
<text x="724" y="356" font-size="14.2" fill="#6B8084">not yet cancer; observation is not an option</text>
<text x="724" y="388" font-size="14.8" fill="#00806B" font-weight="800">Management: excision (conisation/LEEP) — </text>
<text x="724" y="410" font-size="14.8" fill="#00806B" font-weight="800">the guideline calls observation </text>
<text x="724" y="432" font-size="14.8" fill="#00806B" font-weight="800">“unacceptable”</text>
<line x1="980" y1="602" x2="918" y2="636" stroke="#00806B" stroke-width="4" stroke-linecap="round"/>
<line x1="918" y1="636" x2="924.006" y2="626.784" stroke="#00806B" stroke-width="4" stroke-linecap="round"/>
<line x1="918" y1="636" x2="928.999" y2="635.89" stroke="#00806B" stroke-width="4" stroke-linecap="round"/>
<text x="824" y="664" font-size="15.5" fill="#00806B" font-weight="800">Properly treated (conisation/LEEP):</text>
<text x="824" y="686" font-size="15.5" fill="#00806B" font-weight="800">0.7% invasive within 30 years</text>
<line x1="1062" y1="592" x2="1150" y2="566" stroke="#96790F" stroke-width="4" stroke-linecap="round"/>
<line x1="1150" y1="566" x2="1142.17" y2="573.727" stroke="#96790F" stroke-width="4" stroke-linecap="round"/>
<line x1="1150" y1="566" x2="1139.23" y2="563.768" stroke="#96790F" stroke-width="4" stroke-linecap="round"/>
<text x="1108" y="484" font-size="14.4" fill="#8F7418" font-weight="700" text-anchor="end">Untreated: 31.3% over 30 years</text>
<text x="1108" y="505" font-size="14.4" fill="#8F7418" font-weight="700" text-anchor="end">(50.3% if the lesion persisted at 24 months)</text>
<text x="1108" y="526" font-size="14.4" fill="#8F7418" font-weight="700" text-anchor="end">(New Zealand untreated cohort, 1,063 women)</text>
<line x1="1120" y1="296" x2="1120" y2="862" stroke="#8F7418" stroke-width="3" stroke-dasharray="9 7"/>
<text x="1106" y="806" font-size="15.5" fill="#8F7418" font-weight="800" text-anchor="end">Basement membrane — beyond this line</text>
<text x="1106" y="830" font-size="15.5" fill="#8F7418" font-weight="800" text-anchor="end">it is invasive cancer, and the road changes</text>
<rect x="1156" y="330" width="268" height="287" rx="18" fill="#A98722" opacity="0.1"/>
<rect x="1156" y="330" width="268" height="287" rx="18" fill="none" stroke="#C9A83E" stroke-width="1.5"/>
<text x="1178" y="366" font-size="15" fill="#123641" font-weight="800">Invasive cancer: a new road</text>
<text x="1178" y="398" font-size="15" fill="#123641" font-weight="800">IA1 (invasion ≤3 mm)</text>
<text x="1178" y="419" font-size="13.5" fill="#345963">conisation with clear </text>
<text x="1178" y="440" font-size="13.5" fill="#345963">margins can be curative</text>
<text x="1178" y="473" font-size="15" fill="#123641" font-weight="800">IA2 (&gt;3–≤5 mm)</text>
<text x="1178" y="494" font-size="13.5" fill="#345963">conisation or simple </text>
<text x="1178" y="515" font-size="13.5" fill="#345963">hysterectomy</text>
<text x="1178" y="548" font-size="15" fill="#123641" font-weight="800">≥IB</text>
<text x="1178" y="569" font-size="13.5" fill="#345963">staging and treatment </text>
<text x="1178" y="590" font-size="13.5" fill="#345963">routing take over</text>
<text x="84" y="906" font-size="15" fill="#6B8084">Glandular lesions (AIS) follow their own rules: diagnostic conisation first, hysterectomy preferred (no reliable regression rate to plot).</text>
<text x="84" y="974" font-size="16" fill="#6B8084">Schematic redrawn from Östör 1993, Tainio 2018, McCredie 2008 and ASCCP 2019 / ESGO 2023 | CIN 2 figures are 24-month data, CIN 3 figures 30-year data</text>
  </g>
</svg>
