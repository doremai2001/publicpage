<rect x="40" y="2447.57" width="540" height="491.48" rx="18" fill="#FFFFFF"/>
</g>
<text x="66" y="2489.07" font-size="15.5" fill="#527078" font-weight="700">鹿特丹世代裡因偶然發現被轉給專科醫師的人</text>
<text x="66" y="2515.32" font-size="15.5" fill="#345963">188 人（3.2%）</text>
<text x="66" y="2548.57" font-size="15.5" fill="#527078" font-weight="700">其中繼續觀察、或第一次門診之後就結案的</text>
<text x="66" y="2574.82" font-size="15.5" fill="#345963">144 人（76.6%）</text>
<text x="66" y="2616.57" font-size="14" fill="#527078" font-weight="700">20 篇、2,130 位偶然發現腦膜瘤病人的統合分析：診斷當下的處置分布</text>
<rect x="66" y="2634.87" width="244.42" height="34" rx="6" fill="#96790F"/>
<text x="188.21" y="2657.87" font-size="16" fill="#FFFFFF" font-weight="800" text-anchor="middle">50.7%</text>
<rect x="313.42" y="2634.87" width="130.22" height="34" rx="6" fill="#5C77C4"/>
<text x="378.53" y="2657.87" font-size="16" fill="#FFFFFF" font-weight="800" text-anchor="middle">27.3%</text>
<rect x="446.64" y="2634.87" width="104.36" height="34" rx="6" fill="#B04A4A"/>
<text x="498.82" y="2657.87" font-size="16" fill="#FFFFFF" font-weight="800" text-anchor="middle">22.0%</text>
<rect x="66" y="2682.87" width="12" height="12" rx="3" fill="#96790F"/>
<text x="85" y="2692.87" font-size="13.5" fill="#527078" font-weight="700">主動監測 50.7%</text>
<rect x="207.6" y="2682.87" width="12" height="12" rx="3" fill="#5C77C4"/>
<text x="226.6" y="2692.87" font-size="13.5" fill="#527078" font-weight="700">手術 27.3%</text>
<rect x="320.57" y="2682.87" width="12" height="12" rx="3" fill="#B04A4A"/>
<text x="339.57" y="2692.87" font-size="13.5" fill="#527078" font-weight="700">立體定位放射手術 22.0%</text>
<text x="66" y="2724.87" font-size="14" fill="#345963">作者寫在結論裡的是「在診斷當下就介入，可能導致不必要的過度治療」。</text>
<text x="66" y="2763.87" font-size="14" fill="#527078" font-weight="700">但主動監測那一格不是空白（同一份統合分析，連同 2019 年的勘誤）</text>
<circle cx="70.5" cy="2789.78" r="4" fill="#96790F"/>
<text x="85" y="2795.67" font-size="15.5" fill="#345963">追蹤期間出現症狀 8.4%（95% 信賴區間 2.8 到 16.7%）。</text>
<circle cx="70.5" cy="2820.72" r="4" fill="#96790F"/>
<text x="85" y="2826.61" font-size="15.5" fill="#345963">最後接受介入 24.8%。</text>
<text x="66" y="2864.05" font-size="14" fill="#345963">另一邊也要放上：33 中心、15 國、1,248 人、1,010 顆未治療腦膜瘤的世代裡，</text>
<text x="66" y="2885.05" font-size="14" fill="#345963">383 人（40.5%）在腦膜瘤還沒動靜、也沒接受治療的情況下，死於跟腦膜瘤無</text>
<text x="66" y="2906.05" font-size="14" fill="#345963">關的原因。</text>
<text x="40" y="2991.05" font-size="22" fill="#123641" font-weight="800" class="r">哪些情況從一開始就不是觀察題</text>
<text x="40" y="3019.53" font-size="15" fill="#527078">下面三欄來自三個專科的指引，各管各的瘤。</text>
<g filter="url(#sh)">
<rect x="40" y="3039.03" width="540" height="812.18" rx="18" fill="#FFFFFF"/>
</g>
<rect x="66" y="3065.03" width="103" height="25" rx="12.5" fill="#5C77C4"/>
<text x="77" y="3082.53" font-size="13.5" fill="#FFFFFF" font-weight="800">腦下垂體腺瘤</text>
<text x="66" y="3116.03" font-size="14" fill="#527078" font-weight="700">美國內分泌學會 2011 偶然瘤指引</text>
<text x="66" y="3147.83" font-size="15.5" fill="#345963">列出建議轉介手術的情形：</text>
<circle cx="70.5" cy="3175.19" r="4" fill="#5C77C4"/>
<text x="85" y="3181.08" font-size="15.5" fill="#345963">視野缺損。</text>
<circle cx="70.5" cy="3206.13" r="4" fill="#5C77C4"/>
<text x="85" y="3212.02" font-size="15.5" fill="#345963">腫瘤壓迫造成的其他視覺異常，例如眼肌麻痺。</text>
<circle cx="70.5" cy="3237.07" r="4" fill="#5C77C4"/>
<text x="85" y="3242.96" font-size="15.5" fill="#345963">病灶壓迫造成的神經功能受損。</text>
<circle cx="70.5" cy="3268.01" r="4" fill="#5C77C4"/>
<text x="85" y="3273.9" font-size="15.5" fill="#345963">病灶已經貼到視神經或視交叉。</text>
<circle cx="70.5" cy="3298.95" r="4" fill="#5C77C4"/>
<text x="85" y="3304.84" font-size="15.5" fill="#345963">合併視覺障礙的垂體中風。</text>
<circle cx="70.5" cy="3329.89" r="4" fill="#5C77C4"/>
<text x="85" y="3335.78" font-size="15.5" fill="#345963">泌乳素瘤以外、正在過度分泌荷爾蒙的腫瘤。</text>
<line x1="40" y1="3373.22" x2="580" y2="3373.22" stroke="#B9AE94" stroke-width="2" stroke-linecap="butt" stroke-dasharray="2 7"/>
<rect x="218.75" y="3361.22" width="182.5" height="24" rx="12" fill="#F7F1E4"/>
<text x="310" y="3377.72" font-size="12.5" fill="#527078" font-weight="700" text-anchor="middle">三欄不可合併成一張通用清單</text>
<rect x="66" y="3395.22" width="62.5" height="25" rx="12.5" fill="#96790F"/>
<text x="77" y="3412.72" font-size="13.5" fill="#FFFFFF" font-weight="800">腦膜瘤</text>
<text x="66" y="3446.22" font-size="14" fill="#527078" font-weight="700">歐洲神經腫瘤學會 2021 指引</text>
<text x="66" y="3478.02" font-size="15.5" fill="#345963">寫得很短：</text>
<circle cx="70.5" cy="3505.38" r="4" fill="#96790F"/>
<text x="85" y="3511.27" font-size="15.5" fill="#345963">「對大多數有症狀或正在長大的腦膜瘤，第一線治療是手術」。</text>
<circle cx="70.5" cy="3536.32" r="4" fill="#96790F"/>
<text x="85" y="3542.21" font-size="15.5" fill="#345963">同一份指引也寫：第 1 級腦膜瘤仍可能早期復發，第 2 級完全切除</text>
<text x="85" y="3565.15" font-size="15.5" fill="#345963">的人也可能長期無事，分級與臨床病程之間有相當的個體差異。</text>
<line x1="40" y1="3602.59" x2="580" y2="3602.59" stroke="#B9AE94" stroke-width="2" stroke-linecap="butt" stroke-dasharray="2 7"/>
<rect x="218.75" y="3590.59" width="182.5" height="24" rx="12" fill="#F7F1E4"/>
<text x="310" y="3607.09" font-size="12.5" fill="#527078" font-weight="700" text-anchor="middle">三欄不可合併成一張通用清單</text>
<rect x="66" y="3624.59" width="76" height="25" rx="12.5" fill="#00806B"/>
<text x="77" y="3642.09" font-size="13.5" fill="#FFFFFF" font-weight="800">聽神經瘤</text>
<text x="66" y="3675.59" font-size="14" fill="#527078" font-weight="700">美國神經外科醫學會 2018 聽力保存指引</text>
<text x="66" y="3707.39" font-size="15.5" fill="#345963">要反過來理解：已經有單側聽力損失，代表的不是「必須馬上治療」，</text>
<text x="66" y="3730.64" font-size="15.5" fill="#345963">而是「不能當成沒事」。</text>
<circle cx="70.5" cy="3758" r="4" fill="#00806B"/>
<text x="85" y="3763.89" font-size="15.5" fill="#345963">走觀察這條路的人到第十年還維持可用聽力的機率只剩「中等偏低（</text>
<text x="85" y="3786.83" font-size="15.5" fill="#345963">超過 25% 到 50%）」。</text>
<circle cx="70.5" cy="3811.88" r="4" fill="#00806B"/>
<text x="85" y="3817.77" font-size="15.5" fill="#345963">所以單側聽力變差的人，第一輪要先正式量一次聽力當基準線。</text>
<text x="40" y="3903.21" font-size="22" fill="#123641" font-weight="800" class="r">「良性」和「惡性」在顱內是什麼意思</text>
<g filter="url(#sh)">
<rect x="40" y="3922.69" width="540" height="480.66" rx="18" fill="#FFFFFF"/>
</g>
<text x="66" y="3962.69" font-size="14" fill="#527078" font-weight="700">美國腦瘤登記 2018–2022：非惡性腫瘤的五年相對存活率</text>
<text x="66" y="3997.35" font-size="26" fill="#7A6E58" font-weight="800">91.7%</text>
<text x="66" y="4020.23" font-size="13" fill="#345963">這個登記把非惡性腫瘤也收進去。</text>
<text x="66" y="4058.23" font-size="14" fill="#527078" font-weight="700">同一份報告：惡性腫瘤的五年相對存活率</text>
<text x="66" y="4092.89" font-size="26" fill="#B04A4A" font-weight="800">34.8%</text>
<text x="66" y="4115.77" font-size="13" fill="#345963">兩個數字的距離，就是「良性」兩個字的重量。</text>
<text x="66" y="4153.77" font-size="14" fill="#527078" font-weight="700">美國腦瘤登記 2017–2021：全體腦膜瘤 195,297 例，其中惡性腦膜瘤</text>
<text x="66" y="4188.43" font-size="26" fill="#96790F" font-weight="800">1,608 例</text>
<text x="66" y="4211.31" font-size="13" fill="#345963">全體腦膜瘤發生率每 10 萬人 10.15，惡性腦膜瘤 0.08。</text>
<text x="66" y="4249.31" font-size="14" fill="#527078" font-weight="700">腦下垂體腫瘤：局部侵襲的比例</text>
<text x="66" y="4283.97" font-size="26" fill="#5C77C4" font-weight="800">1／2,000</text>
<text x="66" y="4306.85" font-size="13" fill="#345963">惡性只有每 10 萬顆 1 顆。</text>
<text x="66" y="4346.35" font-size="15.5" fill="#345963">91.7% 不是 100%，這個落差也是真的。「腦瘤等於腦癌」這個等號在這</text>
<text x="66" y="4369.6" font-size="15.5" fill="#345963">三種病上不成立，但「良性」也不是結論，只是起點。</text>
<rect x="40" y="4429.35" width="540" height="245.6" rx="16" fill="#F6E2E0" stroke="#B04A4A" stroke-width="2.5"/>
<text x="66" y="4477.35" font-size="18" fill="#B04A4A" font-weight="800">這張圖不收在「良性所以安心」</text>
<text x="66" y="4508.95" font-size="15.5" fill="#345963">圖上沒有一條線通往「所以不用管」，也沒有一條通往「所以要開刀」。</text>
<text x="66" y="4532.2" font-size="15.5" fill="#345963">要不要治療、什麼時候治療，是醫師依位置、大小、影像特徵與你整體</text>
<text x="66" y="4555.45" font-size="15.5" fill="#345963">狀況做的判斷。</text>
<text x="66" y="4588.7" font-size="15.5" fill="#345963">這張圖能替你做的只有一件事：把你的報告換成幾個可以問出口的問題</text>
<text x="66" y="4611.95" font-size="15.5" fill="#345963">——我這顆判讀上是哪一種瘤？它有沒有貼到或壓到視神經、視交叉、內</text>
<text x="66" y="4635.2" font-size="15.5" fill="#345963">耳道、腦幹、靜脈竇？下一次追蹤是幾個月後、照哪一種序列？</text>
<text x="40" y="4694.95" font-size="15" fill="#527078">示意圖，依 Bos 2016、Morris 2009、Hall 1994、EANO 2021 腦膜瘤指引、</text>
<text x="40" y="4718.2" font-size="15" fill="#527078">Marinelli 2022、Islim 2019 統合分析與其 2019 年勘誤、IMPACT 外部驗證（</text>
<text x="40" y="4741.45" font-size="15" fill="#527078">JAMA Oncology 2026）、CBTRUS 2018–2022 與 2017–2021 兩份報告、美</text>
<text x="40" y="4764.7" font-size="15" fill="#527078">國內分泌學會 2011 偶然瘤指引、美國神經外科醫學會 2018 聽力保存指引與 Ho</text>
<text x="40" y="4787.95" font-size="15" fill="#527078">2022 重繪，非擷取自原論文圖表；各研究族群、設計與終點不同，數點不可直接</text>
<text x="40" y="4811.2" font-size="15" fill="#527078">互比。</text>
  </g>
</svg>
