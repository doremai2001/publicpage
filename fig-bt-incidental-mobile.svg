<svg xmlns="http://www.w3.org/2000/svg" width="620" height="4846" viewBox="0 0 620 4846" role="img" aria-labelledby="t d">
  <title id="t">偶然發現的分母有三個，以及哪些情況從一開始就不是觀察題</title>
  <desc id="d">示意圖：影像上偶然發現一顆腦部病灶時，「常不常見」這個問題有三個不同的分母，以及哪些情況從一開始就不是觀察題。第一段是四個數字、四個分母，每一條都標了族群、年齡與影像條件。Bos 2016 鹿特丹世代研究，5,800 位一般民眾、平均 64.9 歲、做研究用腦部磁振造影，腦膜瘤 2.5%，143 人；同一批人 9.5% 有偶然發現，腦動脈瘤 2.3%，屬非腫瘤性。Morris 2009 的 BMJ 統合分析，16 篇、19,559 位沒有神經症狀的人，各篇影像解析度不同，腫瘤性偶然發現（不分瘤別）0.70%，95% 信賴區間 0.47 到 0.98%；同一份分析裡高解析度序列找到 4.3%、標準解析度只找到 1.7%，機器越好找到的越多。Hall 1994，100 位正常志願者，用專門掃腦下垂體的高解析加對比磁振造影，10% 有 3 到 6 公釐病灶、至少兩位判讀者診斷為腦下垂體腺瘤；這個 10% 不能拿來講一般腦部磁振造影。歐洲神經腫瘤學會 2021 指引自己的講法是一般族群腦部磁振造影 0.9% 到 1.0% 的腦膜瘤，跟上面那條 2.5% 的分母不一樣。圖上註明這四條不可以平均，也不可以挑一條當機率。第三種瘤的分母連單位都換了：一份彙整丹麥、荷蘭、台灣與美國四個族群的系統性回顧指出，散發性前庭神經鞘瘤（聽神經瘤）的發生率是每 10 萬人年 3.0 到 5.2，其中無症狀、偶然診斷的那一小塊，美國 2012 到 2016 年那一筆是每 10 萬人年 1.3；這是每年新診斷的人數，不是掃了有多少人會被找到，放不進同一條軸。那份統合分析的結論句也放在圖上：這些發現在取得腦部磁振造影的知情同意時值得被提及，但不足以支持對健康無症狀的人做篩檢。第二段是「當下沒有動刀，不等於結案」。鹿特丹世代裡因偶然發現被轉給專科醫師的是 188 人、3.2%，其中繼續觀察或第一次門診之後就結案的是 144 人、76.6%。一份 20 篇、2,130 位偶然發現腦膜瘤病人的統合分析顯示，診斷當下的處置分布是主動監測 50.7%、手術 27.3%、立體定位放射手術 22.0%，作者寫在結論裡的是在診斷當下就介入可能導致不必要的過度治療。但主動監測那一格不是空白：同一份統合分析連同 2019 年的勘誤顯示，追蹤期間出現症狀 8.4%，95% 信賴區間 2.8 到 16.7%，最後接受介入 24.8%。另一邊也放上：33 中心、15 國、1,248 人、1,010 顆未治療腦膜瘤的世代裡，383 人、40.5% 在腦膜瘤還沒動靜也沒接受治療的情況下，死於跟腦膜瘤無關的原因。第三段是哪些情況從一開始就不是觀察題，分成三欄，三欄之間畫著「不可合併成一張通用清單」的分隔。腦下垂體腺瘤那一欄來自美國內分泌學會 2011 年偶然瘤指引，列出建議轉介手術的情形：視野缺損；腫瘤壓迫造成的其他視覺異常，例如眼肌麻痺；病灶壓迫造成的神經功能受損；病灶已經貼到視神經或視交叉；合併視覺障礙的垂體中風；泌乳素瘤以外、正在過度分泌荷爾蒙的腫瘤。腦膜瘤那一欄來自歐洲神經腫瘤學會 2021 指引，寫得很短：對大多數有症狀或正在長大的腦膜瘤，第一線治療是手術；同一份指引也寫，第 1 級腦膜瘤仍可能早期復發，第 2 級完全切除的人也可能長期無事，分級與臨床病程之間有相當的個體差異。聽神經瘤那一欄來自美國神經外科醫學會 2018 年聽力保存指引，要反過來理解：已經有單側聽力損失，代表的不是必須馬上治療，而是不能當成沒事；走觀察這條路的人到第十年還維持可用聽力的機率只剩中等偏低，也就是超過 25% 到 50%；所以單側聽力變差的人，第一輪要先正式量一次聽力當基準線。第四段是「良性」和「惡性」在顱內是什麼意思。美國腦瘤登記 2018 到 2022 年的資料裡，非惡性腫瘤的五年相對存活率 91.7%、惡性 34.8%，兩個數字的距離就是良性兩個字的重量。同一個登記 2017 到 2021 年的細項：全體腦膜瘤 195,297 例，其中惡性腦膜瘤 1,608 例；全體腦膜瘤發生率每 10 萬人 10.15，惡性腦膜瘤 0.08。腦下垂體腫瘤的局部侵襲只有每 2,000 顆 1 顆，惡性只有每 10 萬顆 1 顆。圖上註明 91.7% 不是 100%，這個落差也是真的；腦瘤等於腦癌這個等號在這三種病上不成立，但良性也不是結論，只是起點。圖的最後一格是不准的讀法：這張圖不收在「良性所以安心」。圖上沒有一條線通往「所以不用管」，也沒有一條通往「所以要開刀」；要不要治療、什麼時候治療，是醫師依位置、大小、影像特徵與你整體狀況做的判斷。這張圖能替你做的只有一件事：把報告換成可以問出口的問題——我這顆判讀上是哪一種瘤？它有沒有貼到或壓到視神經、視交叉、內耳道、腦幹、靜脈竇？下一次追蹤是幾個月後、照哪一種序列？</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#B9AE94" stroke-width="2" opacity="0.55"/></pattern><pattern id="hatchR" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(135)"><line x1="0" y1="0" x2="0" y2="8" stroke="#B04A4A" stroke-width="2" opacity="0.45"/></pattern><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="620" height="4846" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="40" y="66" font-size="16" fill="#A98722" font-weight="800" letter-spacing="3px">WHAT AN INCIDENTAL FINDING IS, AND IS NOT</text>
<text x="40" y="120" font-size="38" fill="#123641" font-weight="800" class="r">同一個問題，三種掃法三個</text>
<text x="40" y="167.88" font-size="38" fill="#123641" font-weight="800" class="r">答案</text>
<text x="40" y="227.76" font-size="19" fill="#527078">「這種東西常不常見」沒有單一答案：掃了誰、掃哪裡、用什麼</text>
<text x="40" y="256.26" font-size="19" fill="#527078">機器，換一個就換一個分母。</text>
<text x="40" y="290.76" font-size="19" fill="#527078">分母不同，不是誰對誰錯。這張圖不告訴你該不該治療——那是醫</text>
<text x="40" y="319.26" font-size="19" fill="#527078">師依位置、大小、影像特徵與你整體狀況做的判斷。</text>
<text x="40" y="419.76" font-size="22" fill="#123641" font-weight="800" class="r">四個數字，四個分母</text>
<text x="40" y="448.24" font-size="15" fill="#527078">每一條都標了族群、年齡與影像條件。標籤拿掉，數字就沒有意義。</text>
<rect x="40" y="467.74" width="540" height="364.3" rx="16" fill="#FFFFFF" stroke="#DBD3BF" stroke-width="1.6"/>
<rect x="62" y="489.74" width="62.5" height="25" rx="12.5" fill="#96790F"/>
<text x="73" y="507.24" font-size="13.5" fill="#FFFFFF" font-weight="800">腦膜瘤</text>
<text x="62" y="544.74" font-size="18" fill="#123641" font-weight="800">Bos 2016（鹿特丹世代研究）</text>
<text x="62" y="575.94" font-size="14" fill="#527078" font-weight="700">族群</text>
<text x="62" y="599.94" font-size="14" fill="#345963">一般民眾 5,800 人</text>
<text x="62" y="627.94" font-size="14" fill="#527078" font-weight="700">年齡</text>
<text x="62" y="651.94" font-size="14" fill="#345963">平均 64.9 歲</text>
<text x="62" y="679.94" font-size="14" fill="#527078" font-weight="700">影像條件</text>
<text x="62" y="703.94" font-size="14" fill="#345963">研究用腦部磁振造影</text>
<text x="62" y="749.02" font-size="28" fill="#96790F" font-weight="800">2.5%</text>
<text x="62" y="771.54" font-size="13" fill="#527078">143 人</text>
<text x="62" y="803.04" font-size="14" fill="#345963">同一批人 9.5% 有偶然發現，腦動脈瘤 2.3%（非腫瘤性）。</text>
<rect x="40" y="848.04" width="540" height="385.3" rx="16" fill="#FFFFFF" stroke="#DBD3BF" stroke-width="1.6"/>
<rect x="62" y="870.04" width="197.5" height="25" rx="12.5" fill="#7A6E58"/>
<text x="73" y="887.54" font-size="13.5" fill="#FFFFFF" font-weight="800">腫瘤性偶然發現（不分瘤別）</text>
<text x="62" y="925.04" font-size="18" fill="#123641" font-weight="800">Morris 2009（BMJ 統合分析）</text>
<text x="62" y="956.24" font-size="14" fill="#527078" font-weight="700">族群</text>
<text x="62" y="980.24" font-size="14" fill="#345963">16 篇、19,559 位沒有神經症狀的人</text>
<text x="62" y="1008.24" font-size="14" fill="#527078" font-weight="700">年齡</text>
<text x="62" y="1032.24" font-size="14" fill="#345963">未分層</text>
<text x="62" y="1060.24" font-size="14" fill="#527078" font-weight="700">影像條件</text>
<text x="62" y="1084.24" font-size="14" fill="#345963">各篇混合，解析度不同</text>
<text x="62" y="1129.32" font-size="28" fill="#7A6E58" font-weight="800">0.70%</text>
<text x="62" y="1151.84" font-size="13" fill="#527078">95% 信賴區間 0.47 到 0.98%</text>
<text x="62" y="1183.34" font-size="14" fill="#345963">同一份分析裡：高解析度序列找到 4.3%，標準解析度只找到 1.7%。機器越好，</text>
<text x="62" y="1204.34" font-size="14" fill="#345963">找到的越多。</text>
<rect x="40" y="1249.34" width="540" height="364.3" rx="16" fill="#FFFFFF" stroke="#DBD3BF" stroke-width="1.6"/>
<rect x="62" y="1271.34" width="103" height="25" rx="12.5" fill="#5C77C4"/>
<text x="73" y="1288.84" font-size="13.5" fill="#FFFFFF" font-weight="800">腦下垂體腺瘤</text>
<text x="62" y="1326.34" font-size="18" fill="#123641" font-weight="800">Hall 1994</text>
<text x="62" y="1357.54" font-size="14" fill="#527078" font-weight="700">族群</text>
<text x="62" y="1381.54" font-size="14" fill="#345963">100 位正常志願者</text>
<text x="62" y="1409.54" font-size="14" fill="#527078" font-weight="700">年齡</text>
<text x="62" y="1433.54" font-size="14" fill="#345963">未分層</text>
<text x="62" y="1461.54" font-size="14" fill="#527078" font-weight="700">影像條件</text>
<text x="62" y="1485.54" font-size="14" fill="#345963">專門掃腦下垂體的高解析加對比磁振造影</text>
<text x="62" y="1530.62" font-size="28" fill="#5C77C4" font-weight="800">10%</text>
<text x="62" y="1553.14" font-size="13" fill="#527078">3 到 6 公釐病灶，至少兩位判讀者診斷為腺瘤</text>
<text x="62" y="1584.64" font-size="14" fill="#345963">這個 10% 不能拿來講一般腦部磁振造影——它掃的是另一個東西。</text>
<rect x="40" y="1629.64" width="540" height="364.3" rx="16" fill="#FFFFFF" stroke="#DBD3BF" stroke-width="1.6"/>
<rect x="62" y="1651.64" width="62.5" height="25" rx="12.5" fill="#96790F"/>
<text x="73" y="1669.13" font-size="13.5" fill="#FFFFFF" font-weight="800">腦膜瘤</text>
<text x="62" y="1706.64" font-size="18" fill="#123641" font-weight="800">歐洲神經腫瘤學會 2021 指引</text>
<text x="62" y="1737.84" font-size="14" fill="#527078" font-weight="700">族群</text>
<text x="62" y="1761.84" font-size="14" fill="#345963">一般族群</text>
<text x="62" y="1789.84" font-size="14" fill="#527078" font-weight="700">年齡</text>
<text x="62" y="1813.84" font-size="14" fill="#345963">未分層</text>
<text x="62" y="1841.84" font-size="14" fill="#527078" font-weight="700">影像條件</text>
<text x="62" y="1865.84" font-size="14" fill="#345963">一般族群腦部磁振造影</text>
<text x="62" y="1910.92" font-size="28" fill="#96790F" font-weight="800">0.9–1.0%</text>
<text x="62" y="1933.44" font-size="13" fill="#527078">指引自己的講法</text>
<text x="62" y="1964.94" font-size="14" fill="#345963">同一種瘤、同一個問題，跟上面那條 2.5% 的分母不一樣。</text>
<text x="40" y="2025.44" font-size="15.5" fill="#B04A4A" font-weight="800">這四條不可以平均，也不可以挑一條當「機率」。</text>
<rect x="40" y="2059.19" width="540" height="157.2" rx="14" fill="none" stroke="#B9AE94" stroke-width="2"/>
<text x="60" y="2097.19" font-size="16" fill="#8F7418" font-weight="800">第三種瘤的分母連單位都換了</text>
<text x="60" y="2126.39" font-size="14" fill="#345963">一份彙整丹麥、荷蘭、台灣與美國四個族群的系統性回顧：散發性前庭神經鞘瘤</text>
<text x="60" y="2147.39" font-size="14" fill="#345963">（聽神經瘤）的發生率落在每 10 萬人年 3.0 到 5.2；其中「無症狀、偶然診斷」</text>
<text x="60" y="2168.39" font-size="14" fill="#345963">的那一小塊，美國 2012 到 2016 年那一筆是每 10 萬人年 1.3。這是每年新診斷</text>
<text x="60" y="2189.39" font-size="14" fill="#345963">的人數，不是「掃了有多少人會被找到」，放不進上面同一條軸。</text>
<rect x="40" y="2232.39" width="540" height="115.2" rx="14" fill="#F3E8CD" stroke="#C9A83E" stroke-width="2"/>
<text x="60" y="2270.39" font-size="16" fill="#8F7418" font-weight="800">那份統合分析自己的結論句</text>
<text x="60" y="2299.59" font-size="14" fill="#345963">這些發現「在取得腦部磁振造影的知情同意時值得被提及，但不足以支持對健康</text>
<text x="60" y="2320.59" font-size="14" fill="#345963">無症狀的人做篩檢」。</text>
<text x="40" y="2399.59" font-size="22" fill="#123641" font-weight="800" class="r">當下沒有動刀，不等於結案</text>
<text x="40" y="2428.07" font-size="15" fill="#527078">這一段同時擋住兩個方向的誤讀——「發現了就要開刀」，和「沒開刀就等於沒事」。</text>
