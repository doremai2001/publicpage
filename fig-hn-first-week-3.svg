<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">多專科團隊把各科答案合成一個治療計畫</title>
  <desc id="desc">病人位於中心，周圍包含外科、放射腫瘤、腫瘤內科、影像、病理、牙科營養與個案管理等角色。120例前瞻研究中約27%的診斷、分期或治療計畫在會後有變動。</desc>
  <defs>
    <radialGradient id="bg3" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#164652"/>
      <stop offset="1" stop-color="#082730"/>
    </radialGradient>
    <filter id="shadow3" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#021114" flood-opacity=".35"/>
    </filter>
    <style>
      .zh { font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
      .serif { font-family: "Noto Serif TC", "Microsoft JhengHei", serif; }
      .title { fill:#F4EFE3; font-size:50px; font-weight:800; }
      .sub { fill:#ABC1C3; font-size:23px; }
      .node { fill:#F4EFE3; font-size:23px; font-weight:800; }
      .center-title { fill:#0B2A34; font-size:29px; font-weight:900; }
      .center-body { fill:#425F66; font-size:20px; }
      .stat { fill:#F4EFE3; font-size:54px; font-weight:900; }
      .statbody { fill:#D4E0DF; font-size:21px; }
      .small { fill:#91ADB1; font-size:17px; }
    </style>
  </defs>

  <rect width="1440" height="900" rx="36" fill="url(#bg3)"/>
  <g class="zh">
    <text x="80" y="82" fill="#C9A83E" font-size="18" font-weight="800" style="letter-spacing:5px">MULTIDISCIPLINARY CARE</text>
    <text x="80" y="146" class="title serif">不是多等一次，是把各科答案合成一個計畫</text>
    <text x="80" y="190" class="sub">同一個癌別，治療會因部位、侵犯深度、淋巴結、遠端轉移與身體狀況而不同。</text>

    <g opacity=".65" stroke="#5E7B80" stroke-width="3">
      <line x1="700" y1="490" x2="340" y2="310"/>
      <line x1="700" y1="490" x2="700" y2="280"/>
      <line x1="700" y1="490" x2="1065" y2="310"/>
      <line x1="700" y1="490" x2="335" y2="665"/>
      <line x1="700" y1="490" x2="700" y2="720"/>
      <line x1="700" y1="490" x2="1065" y2="665"/>
    </g>

    <g filter="url(#shadow3)">
      <circle cx="700" cy="490" r="150" fill="#F2ECDE" stroke="#C9A83E" stroke-width="6"/>
      <circle cx="700" cy="435" r="34" fill="#C9A83E"/>
      <path d="M635 530 Q700 472 765 530 V563 H635 Z" fill="#C9A83E"/>
      <text x="700" y="592" text-anchor="middle" class="center-title">病人與治療目標</text>
    </g>

    <g filter="url(#shadow3)">
      <circle cx="340" cy="310" r="93" fill="#174753" stroke="#C9A83E" stroke-width="3"/>
      <path d="M310 298 h60 M320 282 h40 M320 315 h40" stroke="#F2D879" stroke-width="5" stroke-linecap="round"/>
      <text x="340" y="351" text-anchor="middle" class="node">外科／耳鼻喉</text>

      <circle cx="700" cy="280" r="93" fill="#174753" stroke="#C9A83E" stroke-width="3"/>
      <circle cx="700" cy="267" r="30" fill="none" stroke="#F2D879" stroke-width="5"/>
      <path d="M700 227 v80 M660 267 h80" stroke="#F2D879" stroke-width="4" opacity=".75"/>
      <text x="700" y="321" text-anchor="middle" class="node">放射腫瘤</text>

      <circle cx="1065" cy="310" r="93" fill="#174753" stroke="#C9A83E" stroke-width="3"/>
      <path d="M1038 272 h54 v48 h-54 z M1050 284 h30 M1050 296 h24" fill="none" stroke="#F2D879" stroke-width="5"/>
      <text x="1065" y="351" text-anchor="middle" class="node">腫瘤內科</text>

      <circle cx="335" cy="665" r="93" fill="#174753" stroke="#C9A83E" stroke-width="3"/>
      <rect x="302" y="622" width="66" height="52" rx="7" fill="none" stroke="#F2D879" stroke-width="5"/>
      <circle cx="335" cy="648" r="13" fill="none" stroke="#F2D879" stroke-width="4"/>
      <text x="335" y="709" text-anchor="middle" class="node">影像診斷</text>

      <circle cx="700" cy="720" r="93" fill="#174753" stroke="#C9A83E" stroke-width="3"/>
      <circle cx="687" cy="692" r="18" fill="none" stroke="#F2D879" stroke-width="5"/>
      <circle cx="716" cy="709" r="20" fill="none" stroke="#F2D879" stroke-width="5"/>
      <path d="M675 726 h55" stroke="#F2D879" stroke-width="5" stroke-linecap="round"/>
      <text x="700" y="765" text-anchor="middle" class="node">病理</text>

      <circle cx="1065" cy="665" r="93" fill="#174753" stroke="#C9A83E" stroke-width="3"/>
      <path d="M1035 637 q30-24 60 0 M1040 650 h50 M1048 662 h34" fill="none" stroke="#F2D879" stroke-width="5" stroke-linecap="round"/>
      <text x="1065" y="697" text-anchor="middle" class="node">牙科・營養</text>
      <text x="1065" y="726" text-anchor="middle" fill="#C9D7D7" font-size="19" font-weight="700">個案管理</text>
    </g>

    <g filter="url(#shadow3)">
      <rect x="1180" y="242" width="190" height="448" rx="28" fill="#0D303A" stroke="#496970" stroke-width="2"/>
      <text x="1275" y="320" text-anchor="middle" class="stat">約 27%</text>
      <text x="1275" y="362" text-anchor="middle" class="statbody">在會後出現</text>
      <text x="1275" y="395" text-anchor="middle" class="statbody">診斷、分期</text>
      <text x="1275" y="428" text-anchor="middle" class="statbody">或治療計畫變動</text>
      <line x1="1215" y1="470" x2="1335" y2="470" stroke="#C9A83E" stroke-width="3"/>
      <text x="1275" y="516" text-anchor="middle" fill="#F2D879" font-size="20" font-weight="800">120 例前瞻觀察</text>
      <text x="1275" y="553" text-anchor="middle" fill="#AFC4C6" font-size="18">這顯示會議常改變</text>
      <text x="1275" y="582" text-anchor="middle" fill="#AFC4C6" font-size="18">決策，但不等於每個人</text>
      <text x="1275" y="611" text-anchor="middle" fill="#AFC4C6" font-size="18">都會改變療程</text>
    </g>

    <text x="80" y="852" class="small">團隊角色依院所而異｜數據來源：文章參考資料 [5] Wheless et al., 2010｜資訊圖為原創重繪</text>
  </g>
</svg>
