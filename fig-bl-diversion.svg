<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2654" viewBox="0 0 1440 2654" role="img" aria-labelledby="t d">
  <title id="t">三種尿路改道的日子：迴腸導管、原位新膀胱、輸尿管皮膚吻合，不畫高下</title>
  <desc id="d">示意圖，畫三種尿路改道的日子，三欄平列、順序不代表優劣。圖的最上面是指引自己的兩句原文：「Randomised controlled trials comparing conduit diversion with neobladder or continent cutaneous diversion have not been performed.」與「Currently, it is not possible to recommend a particular type of urinary diversion.」——沒有隨機試驗比較過三種改道，指引因此無法推薦其中任何一種；EAU 同時寫改道的方式不影響腫瘤結果，NICE 的措辭是選擇膀胱全切除的人要提供尿路造口或禁尿型改道，除非有認知功能障礙、腎功能受損或明顯腸道疾病這類強烈禁忌。第一欄是迴腸導管（肚皮上一個造口接尿袋）：EAU 形容它是「結果可預期」的成熟做法；30 天併發症 48%，以泌尿道感染、腎盂腎炎、輸尿管與迴腸接合處漏或狹窄為主；長期造口相關併發症最高到 24%；上泌尿道功能或形態變化最高到 30%；而它的晚期併發症在三種做法裡最少；要學的是造口與尿袋的照顧。第二欄是原位新膀胱（用腸子做一個袋子接回尿道，靠腹壓與放鬆括約肌排尿）：荷蘭、德國、西班牙的登記資料顯示男女各約一到兩成的人做這個；EAU 表列的新膀胱相關問題發生率 30% 到 64%；男性的前瞻評估顯示日間禁尿從術後三個月內的 59% 升到 12 到 18 個月時的 92%，夜間從 28% 升到 18 到 36 個月時的 51%；56 位女性新膀胱病人日間禁尿 70.4%、夜間 64.8%，但排空困難在女性特別常見——約三分之二需要自行導尿、將近 45% 完全無法自行排尿；要學的是定時排尿與（部分人）自行導尿。第三欄是輸尿管皮膚吻合（輸尿管直接接到肚皮）：EAU 寫它是最簡單的皮膚改道，手術時間、併發症率、失血、輸血率、加護病房停留與住院天數都比迴腸導管低；代價是輸尿管口徑小，造口狹窄與上行性泌尿道感染比用腸子做的造口多；對體弱者、或只有一顆腎而需要上泌尿道改道的人，它是首選；要學的是造口照顧以及導管更換的節奏。三欄底下標明：三欄的數字不是同一把尺——一欄報的是 30 天併發症，一欄報的是幾年後的禁尿率，一欄報的是跟另一種做法相比低的項目，它們不能互相相減，也不能排名。接著一格寫三段讀完會發現的事：最不像原本膀胱的那一種，晚期併發症最少；最像原本膀胱的那一種，夜間禁尿到一年半以上還只有一半；最簡單的那一種，是某些人的首選，而不是將就；所以這不是排名，是三組不同的日子。再下一格是長期的那張帳，三種做法一起算、不分欄：3,360 位因肌肉侵犯型膀胱癌接受膀胱全切除的人，29% 在 12 個月內進展到晚期慢性腎病；良性的輸尿管與腸道接合處狹窄最高到 20%；做腸道改道的人維生素 B12 偏低的比例 17%，EAU 建議每年驗一次；SEER 資料顯示膀胱全切除與骨折風險上升 21% 相關，推測與長期代謝性酸中毒和骨質流失有關，那是相關不是已經證明的因果；改道相關併發症在追蹤的前五年會偵測到 45%，一個 131 人的系列裡活過 15 年的人上升到 94%，15 年追蹤時 50% 出現上泌尿道變化、38% 有尿路結石；另有一份 1,383 人的回溯資料顯示迴腸導管與原位新膀胱在腎絲球過濾率下降的風險上沒有顯著差異，真正跟下降相關的是年齡與接合處狹窄。再下一格列出不必等下一次回診的訊號（沒有可引用的量化門檻，所以寫的是症狀不是數字）：發燒合併單側腰痛；造口的尿量突然變少或整天沒有尿；傷口或造口周圍一直滲出液體；做了新膀胱卻解不出尿而且腹脹——出現任何一樣，當天就聯絡手術團隊或回急診。同一格寫「怎麼選」比「選哪一種」更重要：EAU 記了讓病人在充分被告知之後做出改道的決定，與術後較少的決策後悔相關，而且「independent of the method selected」，跟最後選了哪一種無關；NICE 要求造口護理師在手術前後都要能談。最後一格列出兩句不准的讀法：「這三種有高下之分」與「照這張圖我就知道要選哪一種」。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#B9AE94" stroke-width="2" opacity="0.55"/></pattern><pattern id="hatchR" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(135)"><line x1="0" y1="0" x2="0" y2="8" stroke="#B04A4A" stroke-width="2" opacity="0.45"/></pattern><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="2654" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="88" font-size="16" fill="#A98722" font-weight="800" letter-spacing="3px">URINARY DIVERSION - THREE DIFFERENT DAYS, NOT A RANKING</text>
<text x="84" y="140" font-size="40" fill="#123641" font-weight="800" class="r">三種尿路改道的日子，各自長什麼樣——這張圖沒有排名，指引自己也不</text>
<text x="84" y="190.4" font-size="40" fill="#123641" font-weight="800" class="r">排</text>
<text x="84" y="250.8" font-size="19" fill="#527078">被告知要拿掉膀胱的人，第一個問題幾乎都不是存活率，是「那以後尿怎麼辦」。這張圖把三種改道的日子攤開：要學什麼、併發症的量級，以及每一</text>
<text x="84" y="279.3" font-size="19" fill="#527078">個數字出自哪一群人。</text>
<text x="84" y="311.8" font-size="19" fill="#527078">三欄的數字不是同一把尺——每一欄報的項目不一樣，沒有任何一組可以互相相減，也沒有任何一欄可以排在另一欄前面。</text>
<rect x="84" y="360.3" width="1272" height="61" rx="16" fill="#E3E8F6" stroke="#5C77C4" stroke-width="2.5"/>
<text x="110" y="390.3" font-size="16" fill="#5C77C4" font-weight="800">這一段最重要的授權來自指引自己：沒有隨機試驗比較過這三種改道，所以指引無法推薦其中任何一種。</text>
<g filter="url(#sh)"><rect x="84" y="447.3" width="1272" height="298" rx="18" fill="#FFFFFF" stroke="#5C77C4" stroke-width="3"/></g>
<text x="110" y="483.3" font-size="22" fill="#123641" font-weight="800">指引自己說不能排高下</text>
<rect x="110" y="525.3" width="6" height="70" rx="3" fill="#5C77C4"/>
<text x="120" y="543.3" font-size="16" fill="#123641" font-weight="700">Randomised controlled trials comparing conduit diversion with neobladder or continent cutaneous diversion have not been performed.</text>
<text x="120" y="572.3" font-size="15" fill="#527078">沒有隨機試驗比較過尿路導管與新膀胱或禁尿型皮膚改道。</text>
<rect x="110" y="613.3" width="6" height="70" rx="3" fill="#5C77C4"/>
<text x="120" y="631.3" font-size="16" fill="#123641" font-weight="700">Currently, it is not possible to recommend a particular type of urinary diversion.</text>
<text x="120" y="660.3" font-size="15" fill="#527078">目前無法推薦特定的尿路改道方式。</text>
<text x="110" y="709.3" font-size="15" fill="#345963">EAU 同時寫，改道的方式不影響腫瘤結果。NICE 的措辭是：選擇膀胱全切除的人，要提供尿路造口或禁尿型改道，除非有認知功能障礙、腎功能受損或明顯腸道疾病這類強烈禁忌。</text>
<text x="84" y="789.3" font-size="25" fill="#123641" font-weight="800" class="r">三種做法的日子</text>
<text x="84" y="824.3" font-size="16" fill="#527078">三欄平列，順序不代表優劣。每一欄底下標的是「這一欄的數字是什麼」——三欄報的不是同一組項目，所以它們之間沒有可比的分數。</text>
<g filter="url(#sh)"><rect x="84" y="855.3" width="409.33" height="515" rx="18" fill="#FFFFFF"/></g>
<rect x="84" y="855.3" width="409.33" height="6" rx="3" fill="#96790F"/>
<text x="104" y="899.3" font-size="21" fill="#96790F" font-weight="800">迴腸導管</text>
<text x="104" y="931.3" font-size="14" fill="#527078">肚皮上一個造口接尿袋</text>
<rect x="104" y="965.3" width="107" height="20" rx="5" fill="#ECE8DE"/>
<text x="112" y="979.8" font-size="13" fill="#7A6E58" font-weight="800">指引怎麼形容它</text>
<text x="104" y="998.3" font-size="13.5" fill="#345963" font-weight="600">EAU 形容它是「結果可預期」的成熟做法。</text>
<rect x="104" y="1023.3" width="86.72" height="20" rx="5" fill="#ECE8DE"/>
<text x="112" y="1037.8" font-size="13" fill="#7A6E58" font-weight="800">30 天併發症</text>
<text x="104" y="1056.3" font-size="13.5" fill="#345963" font-weight="600">48%，以泌尿道感染、腎盂腎炎、輸尿管與迴腸接合處漏或狹</text>
<text x="104" y="1075.3" font-size="13.5" fill="#345963" font-weight="600">窄為主</text>
<rect x="104" y="1100.3" width="133" height="20" rx="5" fill="#ECE8DE"/>
<text x="112" y="1114.8" font-size="13" fill="#7A6E58" font-weight="800">長期造口相關併發症</text>
<text x="104" y="1133.3" font-size="13.5" fill="#345963" font-weight="600">最高到 24%</text>
<rect x="104" y="1158.3" width="159" height="20" rx="5" fill="#ECE8DE"/>
<text x="112" y="1172.8" font-size="13" fill="#7A6E58" font-weight="800">上泌尿道功能或形態變化</text>
<text x="104" y="1191.3" font-size="13.5" fill="#345963" font-weight="600">最高到 30%</text>
<rect x="104" y="1216.3" width="107" height="20" rx="5" fill="#ECE8DE"/>
<text x="112" y="1230.8" font-size="13" fill="#7A6E58" font-weight="800">這一欄的另一面</text>
<text x="104" y="1249.3" font-size="13.5" fill="#345963" font-weight="600">它的晚期併發症在三種做法裡最少</text>
<rect x="104.0" y="1290.3" width="369.3333333333333" height="59.0" rx="10" fill="#F3E8CD"/>
<text x="118" y="1312.3" font-size="14.5" fill="#8F7418" font-weight="800">要學的是造口與尿袋的照顧。</text>
<g filter="url(#sh)"><rect x="515.33" y="855.3" width="409.33" height="515" rx="18" fill="#FFFFFF"/></g>
<rect x="515.33" y="855.3" width="409.33" height="6" rx="3" fill="#00806B"/>
<text x="535.33" y="899.3" font-size="21" fill="#00806B" font-weight="800">原位新膀胱</text>
<text x="535.33" y="931.3" font-size="14" fill="#527078">用腸子做一個袋子接回尿道，靠腹壓與放鬆括約肌排尿</text>
<rect x="535.33" y="965.3" width="81" height="20" rx="5" fill="#ECE8DE"/>
<text x="543.33" y="979.8" font-size="13" fill="#7A6E58" font-weight="800">有多少人做</text>
<text x="535.33" y="998.3" font-size="13.5" fill="#345963" font-weight="600">荷蘭、德國、西班牙的登記資料顯示男女各約一到兩成的人做</text>
<text x="535.33" y="1017.3" font-size="13.5" fill="#345963" font-weight="600">這個</text>
<rect x="535.33" y="1042.3" width="107" height="20" rx="5" fill="#ECE8DE"/>
<text x="543.33" y="1056.8" font-size="13" fill="#7A6E58" font-weight="800">新膀胱相關問題</text>
<text x="535.33" y="1075.3" font-size="13.5" fill="#345963" font-weight="600">EAU 表列發生率 30% 到 64%</text>
<rect x="535.33" y="1100.3" width="107" height="20" rx="5" fill="#ECE8DE"/>
<text x="543.33" y="1114.8" font-size="13" fill="#7A6E58" font-weight="800">男性的前瞻評估</text>
<text x="535.33" y="1133.3" font-size="13.5" fill="#345963" font-weight="600">日間禁尿從術後三個月內的 59% 升到 12 到 18 個月時的 92%；</text>
<text x="535.33" y="1152.3" font-size="13.5" fill="#345963" font-weight="600">夜間從 28% 升到 18 到 36 個月時的 51%</text>
<rect x="535.33" y="1177.3" width="138.72" height="20" rx="5" fill="#ECE8DE"/>
<text x="543.33" y="1191.8" font-size="13" fill="#7A6E58" font-weight="800">56 位女性新膀胱病人</text>
<text x="535.33" y="1210.3" font-size="13.5" fill="#345963" font-weight="600">日間禁尿 70.4%、夜間 64.8%</text>
<rect x="535.33" y="1235.3" width="107" height="20" rx="5" fill="#ECE8DE"/>
<text x="543.33" y="1249.8" font-size="13" fill="#7A6E58" font-weight="800">女性的排空困難</text>
<text x="535.33" y="1268.3" font-size="13.5" fill="#345963" font-weight="600">約三分之二需要自行導尿、將近 45% 完全無法自行排尿</text>
<rect x="535.3333333333333" y="1309.3" width="369.3333333333333" height="59.0" rx="10" fill="#F3E8CD"/>
<text x="549.33" y="1331.3" font-size="14.5" fill="#8F7418" font-weight="800">要學的是定時排尿與（部分人）自行導尿。</text>
<g filter="url(#sh)"><rect x="946.67" y="855.3" width="409.33" height="515" rx="18" fill="#FFFFFF"/></g>
<rect x="946.67" y="855.3" width="409.33" height="6" rx="3" fill="#5C77C4"/>
<text x="966.67" y="899.3" font-size="21" fill="#5C77C4" font-weight="800">輸尿管皮膚吻合</text>
<text x="966.67" y="931.3" font-size="14" fill="#527078">輸尿管直接接到肚皮</text>
<rect x="966.67" y="965.3" width="107" height="20" rx="5" fill="#ECE8DE"/>
<text x="974.67" y="979.8" font-size="13" fill="#7A6E58" font-weight="800">指引怎麼形容它</text>
<text x="966.67" y="998.3" font-size="13.5" fill="#345963" font-weight="600">EAU 寫它是最簡單的皮膚改道。</text>
<rect x="966.67" y="1023.3" width="133" height="20" rx="5" fill="#ECE8DE"/>
<text x="974.67" y="1037.8" font-size="13" fill="#7A6E58" font-weight="800">比迴腸導管低的項目</text>
<text x="966.67" y="1056.3" font-size="13.5" fill="#345963" font-weight="600">手術時間、併發症率、失血、輸血率、加護病房停留與住院天</text>
<text x="966.67" y="1075.3" font-size="13.5" fill="#345963" font-weight="600">數</text>
<rect x="966.67" y="1100.3" width="42" height="20" rx="5" fill="#ECE8DE"/>
<text x="974.67" y="1114.8" font-size="13" fill="#7A6E58" font-weight="800">代價</text>
<text x="966.67" y="1133.3" font-size="13.5" fill="#345963" font-weight="600">輸尿管口徑小，造口狹窄與上行性泌尿道感染比用腸子做的造</text>
<text x="966.67" y="1152.3" font-size="13.5" fill="#345963" font-weight="600">口多</text>
<rect x="966.67" y="1177.3" width="68" height="20" rx="5" fill="#ECE8DE"/>
<text x="974.67" y="1191.8" font-size="13" fill="#7A6E58" font-weight="800">誰的首選</text>
<text x="966.67" y="1210.3" font-size="13.5" fill="#345963" font-weight="600">對體弱者、或只有一顆腎而需要上泌尿道改道的人，它是首選</text>
<rect x="966.6666666666666" y="1251.3" width="369.3333333333333" height="59.0" rx="10" fill="#F3E8CD"/>
<text x="980.67" y="1273.3" font-size="14.5" fill="#8F7418" font-weight="800">要學的是造口照顧，以及導管更換的節奏。</text>
<text x="84" y="1396.3" font-size="15" fill="#527078">三欄的數字不是同一把尺：一欄報的是 30 天併發症，一欄報的是幾年後的禁尿率，一欄報的是跟另一種做法相比低的項目。它們不能互相相減，也不能排名。</text>
<rect x="84" y="1444.3" width="1272" height="225" rx="16" fill="#F3E8CD" stroke="#C9A83E" stroke-width="2.5"/>
<text x="110" y="1478.3" font-size="20" fill="#123641" font-weight="800">三段讀完會發現一件事</text>
<rect x="110" y="1515.3" width="396" height="80" rx="12" fill="#FFFFFF"/>
<text x="126" y="1541.3" font-size="15" fill="#345963">最不像原本膀胱的那一種，晚期併發症最少。</text>
<rect x="522" y="1515.3" width="396" height="80" rx="12" fill="#FFFFFF"/>
<text x="538" y="1541.3" font-size="15" fill="#345963">最像原本膀胱的那一種，夜間禁尿到一年半以上還只有</text>
<text x="538" y="1562.3" font-size="15" fill="#345963">一半。</text>
<rect x="934" y="1515.3" width="396" height="80" rx="12" fill="#FFFFFF"/>
<text x="950" y="1541.3" font-size="15" fill="#345963">最簡單的那一種，是某些人的首選，而不是將就。</text>
<text x="110" y="1629.3" font-size="19" fill="#8F7418" font-weight="800">所以這不是排名，是三組不同的日子。</text>
<g filter="url(#sh)"><rect x="84" y="1695.3" width="1272" height="331" rx="18" fill="#FFFFFF"/></g>
<text x="110" y="1731.3" font-size="20" fill="#123641" font-weight="800">長期的那張帳：這一格三種做法一起算，不分欄</text>
<rect x="110" y="1768.3" width="55" height="20" rx="5" fill="#ECE8DE"/>
<text x="118" y="1782.8" font-size="13" fill="#7A6E58" font-weight="800">腎功能</text>
<text x="110" y="1801.3" font-size="13.5" fill="#345963" font-weight="600">3,360 位因肌肉侵犯型膀胱癌接受膀胱全切除的人，29% 在 12 個月內進展到晚期慢性腎病</text>
<rect x="110" y="1826.3" width="81" height="20" rx="5" fill="#ECE8DE"/>
<text x="118" y="1840.8" font-size="13" fill="#7A6E58" font-weight="800">接合處狹窄</text>
<text x="110" y="1859.3" font-size="13.5" fill="#345963" font-weight="600">良性的輸尿管與腸道接合處狹窄最高到 20%</text>
<rect x="110" y="1884.3" width="82.69" height="20" rx="5" fill="#ECE8DE"/>
<text x="118" y="1898.8" font-size="13" fill="#7A6E58" font-weight="800">維生素 B12</text>
<text x="110" y="1917.3" font-size="13.5" fill="#345963" font-weight="600">做腸道改道的人偏低的比例 17%，EAU 建議每年驗一次</text>
<rect x="738" y="1768.3" width="42" height="20" rx="5" fill="#ECE8DE"/>
<text x="746" y="1782.8" font-size="13" fill="#7A6E58" font-weight="800">骨頭</text>
<text x="738" y="1801.3" font-size="13.5" fill="#345963" font-weight="600">SEER 資料顯示膀胱全切除與骨折風險上升 21% 相關，推測與長期代謝性酸中毒和骨質流失有關——</text>
<text x="738" y="1820.3" font-size="13.5" fill="#345963" font-weight="600">那是相關，不是已經證明的因果</text>
<rect x="738" y="1845.3" width="55" height="20" rx="5" fill="#ECE8DE"/>
<text x="746" y="1859.8" font-size="13" fill="#7A6E58" font-weight="800">時間軸</text>
<text x="738" y="1878.3" font-size="13.5" fill="#345963" font-weight="600">改道相關併發症在追蹤的前五年會偵測到 45%；一個 131 人的系列裡，活過 15 年的人上升到 94%，</text>
<text x="738" y="1897.3" font-size="13.5" fill="#345963" font-weight="600">15 年追蹤時 50% 出現上泌尿道變化、38% 有尿路結石</text>
<rect x="110" y="1960.3" width="1220" height="62.0" rx="12" fill="#D8EDE7"/>
<text x="128" y="1984.3" font-size="15" fill="#00806B" font-weight="700">而且有一份 1,383 人的回溯資料顯示：迴腸導管與原位新膀胱在腎絲球過濾率下降的風險上沒有顯著差異，真正跟下降相關的是年齡與接合處狹窄。</text>
<g filter="url(#sh)"><rect x="84" y="2052.3" width="1272" height="314" rx="18" fill="#F6E2E0" stroke="#B04A4A" stroke-width="3"/></g>
<text x="110" y="2088.3" font-size="20" fill="#B04A4A" font-weight="800">這幾樣不必等下一次回診</text>
<text x="110" y="2121.3" font-size="14.5" fill="#345963">這幾樣沒有可引用的量化門檻，所以這裡寫的是症狀，不是數字。出現任何一樣，當天就聯絡你的手術團隊或回急診。</text>
<rect x="110" y="2156.3" width="602" height="58" rx="12" fill="#FFFFFF" stroke="#B04A4A" stroke-width="2"/>
<rect x="126" y="2176.3" width="26" height="26" rx="13" fill="#B04A4A"/>
<text x="139" y="2194.3" font-size="17" fill="#FFFFFF" font-weight="800" text-anchor="middle">!</text>
<text x="162" y="2181.3" font-size="14.5" fill="#123641" font-weight="700">發燒合併單側腰痛（腎盂腎炎或輸尿管接合處狹窄常是這個樣子）</text>
<rect x="728" y="2156.3" width="602" height="58" rx="12" fill="#FFFFFF" stroke="#B04A4A" stroke-width="2"/>
<rect x="744" y="2176.3" width="26" height="26" rx="13" fill="#B04A4A"/>
<text x="757" y="2194.3" font-size="17" fill="#FFFFFF" font-weight="800" text-anchor="middle">!</text>
<text x="780" y="2181.3" font-size="14.5" fill="#123641" font-weight="700">造口的尿量突然變少，或整天沒有尿</text>
<rect x="110" y="2230.3" width="602" height="58" rx="12" fill="#FFFFFF" stroke="#B04A4A" stroke-width="2"/>
<rect x="126" y="2250.3" width="26" height="26" rx="13" fill="#B04A4A"/>
<text x="139" y="2268.3" font-size="17" fill="#FFFFFF" font-weight="800" text-anchor="middle">!</text>
<text x="162" y="2255.3" font-size="14.5" fill="#123641" font-weight="700">傷口或造口周圍一直滲出液體（接合處滲漏的樣子）</text>
<rect x="728" y="2230.3" width="602" height="58" rx="12" fill="#FFFFFF" stroke="#B04A4A" stroke-width="2"/>
<rect x="744" y="2250.3" width="26" height="26" rx="13" fill="#B04A4A"/>
<text x="757" y="2268.3" font-size="17" fill="#FFFFFF" font-weight="800" text-anchor="middle">!</text>
<text x="780" y="2255.3" font-size="14.5" fill="#123641" font-weight="700">做了新膀胱卻解不出尿，而且腹脹</text>
<text x="110" y="2308.3" font-size="15" fill="#345963">「怎麼選」比「選哪一種」更重要：EAU 記了一件事——讓病人在充分被告知之後做出改道的決定，與術後較少的決策後悔相關，而且「independent of the method selected」，跟最</text>
<text x="110" y="2330.3" font-size="15" fill="#345963">後選了哪一種無關。NICE 則要求造口護理師在手術前後都要能談。</text>
<rect x="84" y="2392.3" width="1272" height="207" rx="16" fill="#ECE8DE" stroke="#B9AE94" stroke-width="2"/>
<text x="110" y="2426.3" font-size="20" fill="#7A6E58" font-weight="800">這張圖不准被讀成的兩句話</text>
<rect x="110" y="2463.3" width="601" height="122" rx="14" fill="#FFFFFF" stroke="#B9AE94" stroke-width="2"/>
<circle cx="143" cy="2495.3" r="15" fill="#FFFFFF" stroke="#7A6E58" stroke-width="2.4"/>
<line x1="135.8" y1="2488.1" x2="150.2" y2="2502.5" stroke="#7A6E58" stroke-width="2.6" stroke-linecap="round"/>
<line x1="135.8" y1="2502.5" x2="150.2" y2="2488.1" stroke="#7A6E58" stroke-width="2.6" stroke-linecap="round"/>
<text x="170" y="2487.3" font-size="16.5" fill="#123641" font-weight="800">「這三種有高下之分」</text>
<text x="128" y="2529.3" font-size="14.5" fill="#345963">指引自己寫沒有隨機試驗比較過，也無法推薦其中任何一種；改道的方式不影響腫瘤結</text>
<text x="128" y="2550.3" font-size="14.5" fill="#345963">果。</text>
<rect x="729" y="2463.3" width="601" height="122" rx="14" fill="#FFFFFF" stroke="#B9AE94" stroke-width="2"/>
<circle cx="762" cy="2495.3" r="15" fill="#FFFFFF" stroke="#7A6E58" stroke-width="2.4"/>
<line x1="754.8" y1="2488.1" x2="769.2" y2="2502.5" stroke="#7A6E58" stroke-width="2.6" stroke-linecap="round"/>
<line x1="754.8" y1="2502.5" x2="769.2" y2="2488.1" stroke="#7A6E58" stroke-width="2.6" stroke-linecap="round"/>
<text x="789" y="2487.3" font-size="16.5" fill="#123641" font-weight="800">「照這張圖我就知道要選哪一種」</text>
<text x="747" y="2529.3" font-size="14.5" fill="#345963">哪一種適合你，要看腎功能、腸道狀況、手部靈活度、認知功能與你自己的日子怎麼過；</text>
<text x="747" y="2550.3" font-size="14.5" fill="#345963">這是你跟手術團隊與造口護理師一起談出來的，不是從表上挑出來的。</text>
<text x="84" y="2617.3" font-size="15" fill="#527078">示意圖，依 EAU 肌肉侵犯型與轉移性膀胱癌指引 2026 版與 NICE NG2 重繪，非擷取自原文件圖表；各研究族群、設計與終點不同，數點不可直接互比。</text>
  </g>
</svg>
