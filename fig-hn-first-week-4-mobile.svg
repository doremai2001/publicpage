<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1500" viewBox="0 0 720 1500" role="img" aria-labelledby="title desc">
  <title id="title">確診後的三、四週，多項檢查與準備會平行進行</title>
  <desc id="desc">從切片確診後，病理確認、影像與內視鏡分期、牙科營養與身體評估可平行進行，資料到齊後進入多專科團隊討論並形成治療計畫。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A2731"/><stop offset="1" stop-color="#123D48"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#041318" flood-opacity=".25"/></filter>
    <style>.z{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Microsoft JhengHei",serif}.t{fill:#F5F0E3;font-size:48px;font-weight:800}.sub{fill:#B7C9CA;font-size:25px}.ct{fill:#F5F0E3;font-size:32px;font-weight:800}.cb{fill:#CAD9D9;font-size:25px}.sm{fill:#9FB7BA;font-size:19px}</style>
  </defs>
  <rect width="720" height="1500" rx="34" fill="url(#bg)"/>
  <g class="z">
    <text x="54" y="70" fill="#C9A83E" font-size="18" font-weight="800" letter-spacing="4">AFTER THE DIAGNOSIS</text>
    <text x="54" y="137" class="t r">不是在「乾等」</text>
    <text x="54" y="197" class="t r">是幾條線同時往前走</text>
    <text x="54" y="246" class="sub">資訊到齊，再決定整套治療。</text>

    <g filter="url(#s)"><rect x="54" y="305" width="612" height="150" rx="24" fill="#F3EDDE"/><circle cx="112" cy="355" r="27" fill="#C9A83E"/><text x="112" y="365" text-anchor="middle" fill="#0A2731" font-size="25" font-weight="900">1</text><text x="157" y="365" fill="#143641" font-size="34" font-weight="900">切片確診</text><text x="157" y="410" fill="#46636A" font-size="24">啟動後續分期與治療前準備</text></g>
    <path d="M360 456 V508" stroke="#C9A83E" stroke-width="6"/>

    <g filter="url(#s)"><rect x="54" y="510" width="612" height="190" rx="24" fill="#173F49" stroke="#3B626A" stroke-width="2"/><circle cx="112" cy="565" r="27" fill="#C9A83E"/><text x="112" y="575" text-anchor="middle" fill="#0A2731" font-size="24" font-weight="900">A</text><text x="157" y="575" class="ct">病理確認</text><text x="92" y="630" class="cb">細胞類型、分化程度</text><text x="92" y="667" class="cb">口咽癌依情況加做 p16</text></g>
    <path d="M360 701 V744" stroke="#6D8588" stroke-width="4"/>

    <g filter="url(#s)"><rect x="54" y="746" width="612" height="190" rx="24" fill="#173F49" stroke="#3B626A" stroke-width="2"/><circle cx="112" cy="801" r="27" fill="#C9A83E"/><text x="112" y="811" text-anchor="middle" fill="#0A2731" font-size="24" font-weight="900">B</text><text x="157" y="811" class="ct">影像與內視鏡分期</text><text x="92" y="866" class="cb">頭頸部 MRI 或 CT</text><text x="92" y="903" class="cb">必要時 PET、黏膜表面檢查</text></g>
    <path d="M360 937 V980" stroke="#6D8588" stroke-width="4"/>

    <g filter="url(#s)"><rect x="54" y="982" width="612" height="190" rx="24" fill="#173F49" stroke="#3B626A" stroke-width="2"/><circle cx="112" cy="1037" r="27" fill="#C9A83E"/><text x="112" y="1047" text-anchor="middle" fill="#0A2731" font-size="24" font-weight="900">C</text><text x="157" y="1047" class="ct">治療前準備</text><text x="92" y="1102" class="cb">牙科、營養、抽血、心肺功能</text><text x="92" y="1139" class="cb">很多項目可與影像平行進行</text></g>
    <path d="M360 1173 V1218" stroke="#C9A83E" stroke-width="6"/>

    <g filter="url(#s)"><rect x="54" y="1220" width="612" height="185" rx="25" fill="#F3EDDE"/><circle cx="112" cy="1275" r="29" fill="#C9A83E"/><path d="M98 1278h28M103 1268h18M108 1258h8" stroke="#0A2731" stroke-width="5" stroke-linecap="round"/><text x="157" y="1286" fill="#143641" font-size="32" font-weight="900">多專科團隊討論</text><text x="92" y="1340" fill="#46636A" font-size="24">整合病理、影像、身體狀況與需求</text><text x="92" y="1382" fill="#99791B" font-size="24" font-weight="800">形成治療計畫 → 開始治療</text></g>
    <text x="54" y="1458" class="sm">依文章參考資料 [7] 整理｜資訊圖為原創重繪</text>
  </g>
</svg>
