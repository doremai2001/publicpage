<rect x="107" y="446" width="258.48" height="26" rx="6" fill="#ECE8DE"/>
<text x="236.24" y="464" font-size="13" fill="#123641" font-weight="800" text-anchor="middle">診斷 → 治療前評估</text>
<rect x="367.48" y="446" width="407.33" height="26" rx="6" fill="#E3E8F6"/>
<text x="571.15" y="464" font-size="13" fill="#123641" font-weight="800" text-anchor="middle">化放療 5–6 週</text>
<rect x="776.82" y="446" width="258.48" height="26" rx="6" fill="#ECE8DE"/>
<text x="906.06" y="464" font-size="13" fill="#123641" font-weight="800" text-anchor="middle">（三合一）等待與手術</text>
<rect x="1037.3" y="446" width="295.7" height="26" rx="6" fill="#D8EDE7"/>
<text x="1185.15" y="464" font-size="13" fill="#123641" font-weight="800" text-anchor="middle">術後、回家</text>
<rect x="143.21" y="490" width="260.48" height="18" rx="9" fill="#5C77C4" opacity="0.9"/>
<text x="413.7" y="504" font-size="13" fill="#5C77C4" font-weight="800">鼻胃管</text>
<text x="286" y="525.05" font-size="13" fill="#345963">預期腸道營養 &lt;4 週（ESGE 2021）；ESPEN 放療段點名鼻胃管或 PEG</text>
<rect x="199.03" y="542.2" width="837.27" height="18" rx="9" fill="#96790F" opacity="0.9"/>
<text x="1046.3" y="556.2" font-size="13" fill="#96790F" font-weight="800">胃造廔 PEG</text>
<text x="286" y="577.25" font-size="13" fill="#345963">預期 &gt;4 週：考慮經皮管路，胃路徑優先（ESGE 2021）；PEG 對後續胃管重建無差（統合 n=1,027）</text>
<rect x="831.64" y="594.4" width="502.36" height="18" rx="9" fill="#00806B" opacity="0.9"/>
<text x="821.64" y="608.4" font-size="13" fill="#00806B" font-weight="800" text-anchor="end">餵食空腸造廔</text>
<text x="286" y="629.45" font-size="13" fill="#345963">上消化道大手術時術中考慮（ESPEN 外科 Rec 23，Grade B）；ESGE：胃不可用、排空差、高吸入風險才選空腸</text>
<rect x="143.21" y="646.6" width="241.88" height="18" rx="9" fill="none" stroke="#B04A4A" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="258.15" y1="649.6" x2="270.15" y2="661.6" stroke="#B04A4A" stroke-width="2.5" stroke-linecap="round"/>
<line x1="270.15" y1="649.6" x2="258.15" y2="661.6" stroke="#B04A4A" stroke-width="2.5" stroke-linecap="round"/>
<text x="395.09" y="660.6" font-size="13" fill="#B04A4A" font-weight="800">金屬支架</text>
<text x="286" y="681.65" font-size="13" fill="#345963">ESGE 2021：不建議作為術前或化放療前的橋接（強建議）。Mariette 2015 配對：R0 71.0% 對 85.5%、3 年 OS 25% 對 44%</text>
<circle cx="114" cy="711.95" r="8" fill="#96790F"/>
<text x="114" y="715.45" font-size="11.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">1</text>
<text x="130" y="715.85" font-size="13" fill="#345963">診斷前 3 個月掉 &gt;10%：17% 的人（鹿特丹手術世代 n=922）→ 5 年死亡 HR 1.34；併發症沒有增加</text>
<circle cx="114" cy="738.15" r="8" fill="#96790F"/>
<text x="114" y="741.65" font-size="11.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">2</text>
<text x="130" y="742.05" font-size="13" fill="#345963">化療期間掉 &gt;5% → 術後感染併發症 OR 2.69（OGSG1003，鱗癌 n=134）</text>
<circle cx="114" cy="764.35" r="8" fill="#6B8084"/>
<text x="114" y="767.85" font-size="11.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">3</text>
<text x="130" y="768.25" font-size="13" fill="#345963">術前治療者 80% 有吞嚥困難、48% 放了管路，其中 27.9% 沒好好用（n=127）</text>
<circle cx="114" cy="790.55" r="8" fill="#6B8084"/>
<text x="114" y="794.05" font-size="11.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">4</text>
<text x="130" y="794.45" font-size="13" fill="#345963">化放療後惡病質 60.7%；治療前造口只在腫瘤佔管腔 ≥70% 者看得出好處（成大 n=260）</text>
