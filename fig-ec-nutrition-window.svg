<text x="319" y="967.21" font-size="13" fill="#7A6E58" font-weight="700">食道</text>
<text x="361.93" y="1188.73" font-size="13" fill="#7A6E58" font-weight="700">空腸</text>
<text x="396.27" y="1059.09" font-size="12" fill="#6B8084" font-weight="600" text-anchor="end">橫膈</text>
<g filter="url(#sh)"><rect x="524" y="845.6" width="408" height="182.3" rx="18" fill="#FFFFFF"/></g>
<rect x="546" y="867.6" width="60.21" height="23.62" rx="11.81" fill="#5C77C4"/>
<text x="576.11" y="884.27" font-size="13.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">鼻胃管</text>
<text x="546" y="916.65" font-size="13" fill="#345963">醫療端：不需麻醉、放最快、隨時可拔；移位風險比 PEG 高（</text>
<text x="546" y="935.11" font-size="13" fill="#345963">ESPEN）；誤入呼吸道要有確認流程（ESGE）</text>
<text x="546" y="961.57" font-size="13" fill="#345963">臨床端：吞嚥較少受影響、放療結束後較早脫離（ESPEN）；</text>
<text x="546" y="980.03" font-size="13" fill="#345963">臉上看得到</text>
<g filter="url(#sh)"><rect x="948" y="845.6" width="408" height="182.3" rx="18" fill="#FFFFFF"/></g>
<rect x="970" y="867.6" width="92.91" height="23.62" rx="11.81" fill="#96790F"/>
<text x="1016.45" y="884.27" font-size="13.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">胃造廔 PEG</text>
<text x="970" y="916.65" font-size="13" fill="#345963">醫療端：內視鏡下放置；食道狹窄時用 introducer（push）法</text>
<text x="970" y="935.11" font-size="13" fill="#345963">避免拉過腫瘤（ESGE）；4 篇回溯 n=1,027 統合：滲漏、狹</text>
<text x="970" y="953.57" font-size="13" fill="#345963">窄、併發症、住院天數皆無差，無 PEG 部位滲漏（Fang</text>
<text x="970" y="972.03" font-size="13" fill="#345963">2022）；1/96 PEG 部位切片為惡性（Bhatti 2015）</text>
<text x="970" y="998.49" font-size="13" fill="#345963">臨床端：移位少、生活品質可能較好（ESPEN）；在衣服底下</text>
<g filter="url(#sh)"><rect x="524" y="1043.9" width="832" height="182.3" rx="18" fill="#FFFFFF"/></g>
<rect x="546" y="1065.9" width="101.52" height="23.62" rx="11.81" fill="#00806B"/>
<text x="596.76" y="1082.57" font-size="13.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">餵食空腸造廔</text>
<text x="546" y="1114.95" font-size="13" fill="#345963">醫療端：腹腔鏡或開腹下放置、多在手術中；統合（Shen 2021）：腸阻塞約 6%（其中 &gt;63% 需再手術）、部位感染 7%、功能不良</text>
<text x="546" y="1133.41" font-size="13" fill="#345963">7%；常規放置的好處未被證明（Mei 2021）</text>
<text x="546" y="1159.87" font-size="13" fill="#345963">臨床端：術後回家可繼續灌 6 週（小型 RCT n=41：體重掉 &gt;5% 28% 對 82%）</text>
<text x="84" y="1252.2" font-size="14" fill="#6B8084" font-weight="600">先放管路對結果有沒有幫助，回溯資料是雙向的（美國兩個外科世代看不出；台灣成大只在腫瘤佔管腔 ≥70% 者看得出）——「誰該先放」比「要不要放」更接近真問題。健保：05101B 一般灌食適用症明列</text>
<text x="84" y="1272.5" font-size="14" fill="#6B8084" font-weight="600">食道癌；33108B PEG 備註未寫食道癌也未排除、47058B 支架有給付≠建議做——問醫務課／個管師。</text>
<text x="84" y="1318.8" font-size="16" fill="#6B8084">示意圖，依 ESPEN 2021 癌症營養與外科營養實務指引、ESGE 2021 腸道管路指引（第 1、2 部）、ESGE 2021 食道支架指引、van der Schaaf 2014、Aoyama 2023（</text>
<text x="84" y="1342.8" font-size="16" fill="#6B8084">OGSG1003）、Huerter 2016、Chiang 2026、Fang 2022、Bhatti 2015、Shen 2021、Mei 2021、Mariette 2015 與 Baker 2015 重繪｜各研究族群、設計與終點不同，數字不</text>
<text x="84" y="1366.8" font-size="16" fill="#6B8084">可直接互比；管路種類由團隊依你的情況決定</text>
