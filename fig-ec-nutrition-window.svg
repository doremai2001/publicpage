  <rect width="1440" height="1421" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="86" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">WEIGHT × FEEDING ROUTE × TIME</text>
<text x="84" y="148" font-size="44" fill="#123641" font-weight="800" class="r">體重與管路的時間窗：三種管路，指引各給了一個位置</text>
<text x="84" y="194" font-size="21" fill="#527078">上半是時間軸：掉一成體重是啟動評估的門檻，不是放管指令；三種管路在指引裡各有自己的時間點與前提。下半是入口位置。</text>
<text x="84" y="224" font-size="21" fill="#527078">沒有一種「最好」；支架不是化放療前的解法。</text>
