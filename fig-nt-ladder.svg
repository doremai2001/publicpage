<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="t d">
  <title id="t">四種技術在證據階梯上的位置</title>
  <desc id="d">證據階梯由低到高：細胞與動物實驗、第一期安全性試驗、單臂系列、隨機試驗、常規與給付。FLASH位於第一期（全球人體經驗約30人）；重粒子位於單臂系列（唯一讀出的隨機試驗是對質子的安全性試驗，無差異）；BNCT介於單臂與隨機之間，日本已就頭頸癌單一適應症取得藥證與給付；質子位於隨機試驗（多個讀出、結果不一，兒童使用有共識）。另有灰色的細胞治療佔位。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="900" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="86" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">EVIDENCE LADDER</text>
<text x="84" y="148" font-size="44" fill="#123641" font-weight="800" class="r">每種技術，爬到證據階梯的哪一階？</text>
<text x="84" y="194" font-size="21" fill="#527078">位置＝已完成的最高證據層級，不是優劣排名。</text>
<text x="84" y="224" font-size="21" fill="#527078">再新的技術，也要一階一階把證據爬完。</text>
<line x1="300" y1="270" x2="300" y2="810" stroke="#123641" stroke-width="8" stroke-linecap="round"/>
<line x1="460" y1="270" x2="460" y2="810" stroke="#123641" stroke-width="8" stroke-linecap="round"/>
<line x1="300" y1="300" x2="460" y2="300" stroke="#123641" stroke-width="6"/>
<text x="278" y="284" font-size="15" fill="#A98722" font-weight="800" text-anchor="end">第5階</text>
<text x="278" y="310" font-size="22" fill="#123641" font-weight="800" text-anchor="end">常規與給付</text>
<line x1="300" y1="412" x2="460" y2="412" stroke="#123641" stroke-width="6"/>
<text x="278" y="396" font-size="15" fill="#A98722" font-weight="800" text-anchor="end">第4階</text>
<text x="278" y="422" font-size="22" fill="#123641" font-weight="800" text-anchor="end">隨機試驗</text>
<line x1="300" y1="524" x2="460" y2="524" stroke="#123641" stroke-width="6"/>
<text x="278" y="508" font-size="15" fill="#A98722" font-weight="800" text-anchor="end">第3階</text>
<text x="278" y="534" font-size="22" fill="#123641" font-weight="800" text-anchor="end">單臂系列</text>
<line x1="300" y1="636" x2="460" y2="636" stroke="#123641" stroke-width="6"/>
<text x="278" y="620" font-size="15" fill="#A98722" font-weight="800" text-anchor="end">第2階</text>
<text x="278" y="646" font-size="22" fill="#123641" font-weight="800" text-anchor="end">第一期（安全性）</text>
<line x1="300" y1="748" x2="460" y2="748" stroke="#123641" stroke-width="6"/>
<text x="278" y="732" font-size="15" fill="#A98722" font-weight="800" text-anchor="end">第1階</text>
<text x="278" y="758" font-size="22" fill="#123641" font-weight="800" text-anchor="end">細胞與動物實驗</text>
<line x1="464" y1="412" x2="504" y2="412" stroke="#6B8084" stroke-width="1.5"/>
<rect x="504" y="388" width="76" height="44" rx="20" fill="#00806B"/>
<text x="542.0" y="417.2" font-size="20" fill="#FFFFFF" font-weight="800" text-anchor="middle">質子</text>
<text x="602" y="406" font-size="19" fill="#345963" font-weight="600">多個隨機讀出、結果不一（非劣性、無差異都有）；</text>
<text x="602" y="432" font-size="17" fill="#6B8084">兒童使用已有專業共識。</text>
<line x1="464" y1="468" x2="504" y2="468" stroke="#6B8084" stroke-width="1.5" stroke-dasharray="5 4"/>
<path d="M380.0,457.0 L382.9,464.0 L390.5,464.6 L384.7,469.5 L386.5,476.9 L380.0,472.9 L373.5,476.9 L375.3,469.5 L369.5,464.6 L377.1,464.0 Z" fill="#C9A83E" stroke="#8F7418" stroke-width="1"/>
<rect x="504" y="444" width="80" height="44" rx="20" fill="#123641"/>
<text x="544.0" y="473.2" font-size="20" fill="#FFFFFF" font-weight="800" text-anchor="middle">BNCT</text>
<text x="606.0" y="462.0" font-size="19" fill="#345963" font-weight="600">介於兩階之間：日本就「頭頸癌」單一適應症</text>
<text x="606.0" y="488.0" font-size="17" fill="#6B8084">取得藥證＋健保給付（2020）；其餘適應症仍在試驗。</text>
<line x1="464" y1="524" x2="504" y2="524" stroke="#6B8084" stroke-width="1.5"/>
<rect x="504" y="500" width="96" height="44" rx="20" fill="#96790F"/>
<text x="552.0" y="529.2" font-size="20" fill="#FFFFFF" font-weight="800" text-anchor="middle">重粒子</text>
<text x="622" y="518" font-size="19" fill="#345963" font-weight="600">大量單臂系列（全球逾 5 萬人）※</text>
<text x="622" y="544" font-size="17" fill="#6B8084">※ 唯一讀出的隨機試驗：對質子的第二期安全性試驗（n=82），兩臂無差異。</text>
<line x1="464" y1="636" x2="504" y2="636" stroke="#6B8084" stroke-width="1.5"/>
<rect x="504" y="612" width="91" height="44" rx="20" fill="#5C77C4"/>
<text x="549.5" y="641.2" font-size="20" fill="#FFFFFF" font-weight="800" text-anchor="middle">FLASH</text>
<text x="617.0" y="630" font-size="19" fill="#345963" font-weight="600">第一期可行性／安全性；全球人體經驗約 30 人。</text>
<text x="617.0" y="656" font-size="17" fill="#6B8084">還沒有任何療效比較。</text>
<line x1="464" y1="748" x2="504" y2="748" stroke="#6B8084" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="504" y="724" width="236" height="44" rx="20" fill="none" stroke="#9A9282" stroke-width="2" stroke-dasharray="7 5"/>
<text x="622.0" y="753.2" font-size="20" fill="#9A9282" font-weight="800" text-anchor="middle">細胞治療（未來收錄）</text>
<text x="762" y="742" font-size="19" fill="#345963" font-weight="600">佔位：本專題未來將加入。</text>
<text x="84" y="872" font-size="16" fill="#6B8084">依各技術已發表試驗與法規現況標定（2026-08）｜示意圖</text>
  </g>
</svg>
