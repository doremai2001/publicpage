<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1101" viewBox="0 0 720 1101" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">The gates before irradiation</title>
  <desc id="d">One of the fairer things about BNCT is that its necessary condition can be measured in advance. Which also means some people are told here that they are not suitable. Clearing the threshold is a necessary condition, not a sufficient one: it measures whether boron gets in, not whether treatment works. Gate four is the one most often skipped. If the person assessing you does not have your previous plan, that question has not been answered.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#123641" opacity=".10"/><line x1="0" y1="0" x2="0" y2="8" stroke="#123641" stroke-width="2.2" opacity=".75"/></pattern><pattern id="hatchlite" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#123641" stroke-width="1.4" opacity=".22"/></pattern><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="720" height="1101" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="48" y="81" font-size="15" fill="#A98722" font-weight="800" letter-spacing="5px">SCREENING</text>
<text x="48" y="138" font-size="37" fill="#123641" font-weight="800" class="r">The gates before irradiation</text>
<text x="48" y="182" font-size="18" fill="#527078">One of the fairer things about BNCT is that its necessary</text>
<text x="48" y="208" font-size="18" fill="#527078">condition can be measured in advance.</text>
<text x="48" y="234" font-size="18" fill="#527078">Which also means some people are told here that they are not</text>
<text x="48" y="260" font-size="18" fill="#527078">suitable.</text>
<rect x="48" y="310" width="624" height="101" rx="14" fill="#123641" opacity="0.05"/>
<rect x="48" y="310" width="6" height="101" rx="4" fill="#A98722" opacity="0.9"/>
<text x="70" y="339" font-size="17" fill="#A98722" font-weight="800">1</text>
<text x="95" y="339" font-size="17" fill="#123641" font-weight="700">Standard treatment exhausted or unsuitable</text>
<text x="95" y="366" font-size="14" fill="#527078">prior conventional radiotherapy, and surgery, radiotherapy and chemotherapy all</text>
<text x="95" y="387" font-size="14" fill="#527078">unsuitable as salvage</text>
<text x="360" y="431" font-size="12" fill="#6B8084" text-anchor="middle">▼</text>
<rect x="48" y="441" width="624" height="80" rx="14" fill="#123641" opacity="0.05"/>
<rect x="48" y="441" width="6" height="80" rx="4" fill="#A98722" opacity="0.9"/>
<text x="70" y="470" font-size="17" fill="#A98722" font-weight="800">2</text>
<text x="95" y="470" font-size="17" fill="#123641" font-weight="700">Site and depth assessment</text>
<text x="95" y="497" font-size="14" fill="#527078">the lesion has to sit within the few centimetres the neutrons still reach</text>
<text x="360" y="541" font-size="12" fill="#6B8084" text-anchor="middle">▼</text>
<rect x="48" y="551" width="624" height="80" rx="14" fill="#123641" opacity="0.05"/>
<rect x="48" y="551" width="6" height="80" rx="4" fill="#A98722" opacity="0.9"/>
<text x="70" y="580" font-size="17" fill="#A98722" font-weight="800">3</text>
<text x="95" y="580" font-size="17" fill="#123641" font-weight="700">18F-BPA PET, tumour-to-normal uptake ratio</text>
<text x="95" y="607" font-size="14" fill="#527078">trials commonly use a threshold of T/N above 2.5</text>
<text x="360" y="651" font-size="12" fill="#6B8084" text-anchor="middle">▼</text>
<rect x="48" y="661" width="624" height="80" rx="14" fill="#123641" opacity="0.05"/>
<rect x="48" y="661" width="6" height="80" rx="4" fill="#A98722" opacity="0.9"/>
<text x="70" y="690" font-size="17" fill="#A98722" font-weight="800">4</text>
<text x="95" y="690" font-size="17" fill="#123641" font-weight="700">Re-irradiation risk assessment</text>
<text x="95" y="717" font-size="14" fill="#527078">someone has to sit down with your previous dose distribution</text>
<text x="360" y="761" font-size="12" fill="#6B8084" text-anchor="middle">▼</text>
<rect x="48" y="771" width="624" height="101" rx="14" fill="#00806B" opacity="0.09" stroke="#00806B" stroke-width="2"/>
<rect x="48" y="771" width="624" height="101" rx="14" fill="url(#hatchlite)"/>
<text x="70" y="800" font-size="17" fill="#00604F" font-weight="800">Below the threshold: not suitable</text>
<text x="70" y="827" font-size="14" fill="#345963">full cost, no benefit - what is saved is not only money but the one</text>
<text x="70" y="848" font-size="14" fill="#345963">re-irradiation allowance and a stretch of physical reserve</text>
<rect x="48" y="892" width="624" height="2" rx="1" fill="#A98722" opacity="0.5"/>
<text x="48" y="921" font-size="16" fill="#345963" font-weight="700">Clearing the threshold is a necessary condition, not a sufficient one: it</text>
<text x="48" y="946" font-size="16" fill="#345963" font-weight="700">measures whether boron gets in, not whether treatment works.</text>
<text x="48" y="971" font-size="16" fill="#345963" font-weight="700">Gate four is the one most often skipped. If the person assessing you</text>
<text x="48" y="996" font-size="16" fill="#345963" font-weight="700">does not have your previous plan, that question has not been answered.</text>
<text x="48" y="1027" font-size="13" fill="#6B8084">Schematic, compiled and redrawn from the eligibility criteria of NCT01173172 and the</text>
<text x="48" y="1047" font-size="13" fill="#6B8084">descriptions in Barth et al. 2012.</text>
  </g>
</svg>
