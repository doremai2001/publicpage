<text x="534.67" y="954.08" font-size="14" fill="#345963">真實世界｜Poon 2020 統合分析，1,291／28,748 人，</text>
<text x="534.67" y="974.58" font-size="14" fill="#345963">2005 年以後收案的族群。兩年與三年那一段真的有進步；</text>
<text x="534.67" y="995.08" font-size="14" fill="#345963">五年這一段沒有。</text>
<g filter="url(#sh)"><rect x="945.33" y="847.08" width="410.67" height="183" rx="16" fill="#FFFFFF"/></g>
<rect x="945.33" y="847.08" width="410.67" height="7" fill="#5C77C4"/>
<text x="965.33" y="893.08" font-size="26" fill="#5C77C4" font-weight="800">十年 約 0.71%</text>
<text x="965.33" y="921.08" font-size="13" fill="#527078">36 篇研究、162 例</text>
<text x="965.33" y="954.08" font-size="14" fill="#345963">舊分類｜Tykocki 2018 系統回顧，1950–2014 年發表，大</text>
<text x="965.33" y="974.58" font-size="14" fill="#345963">多沒有做 IDH 檢測。依 2021 年的分類，有相當比例今天不</text>
<text x="965.33" y="995.08" font-size="14" fill="#345963">會被叫做膠質母細胞瘤——正確的說法是「在舊分類下有人活</text>
<text x="965.33" y="1015.58" font-size="14" fill="#345963">了十年」。</text>
<rect x="84" y="1056.08" width="1272" height="155.5" rx="16" fill="none" stroke="#B9AE94" stroke-width="2"/>
<text x="106" y="1084.08" font-size="17" fill="#123641" font-weight="800">走過一段之後，前面的機率會變</text>
<text x="106" y="1110.08" font-size="14" fill="#527078" font-weight="600">「再活兩年」的機率</text>
<circle cx="146" cy="1146.08" r="9" fill="#5C77C4"/>
<text x="164" y="1152.08" font-size="22" fill="#5C77C4" font-weight="800">19.8%</text>
<text x="164" y="1172.08" font-size="13" fill="#527078">診斷當下</text>
<circle cx="1134" cy="1146.08" r="9" fill="#00806B"/>
<text x="1152" y="1152.08" font-size="22" fill="#00806B" font-weight="800">65.9%</text>
<text x="1152" y="1172.08" font-size="13" fill="#527078">診斷後五年</text>
<line x1="276" y1="1146.08" x2="1109.72" y2="1146.08" stroke="#B9AE94" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="1118,1146.08 1109.78,1149.75 1109.78,1142.41" fill="#B9AE94"/>
<text x="106" y="1190.08" font-size="13.5" fill="#527078">Johnson 2012，SEER 1998–2008 年、接受含放療方案的病人，n=10,022。這是族群層次的條件機率，不是誰的個人預測。</text>
<rect x="84" y="1233.58" width="1272" height="102.0" rx="16" fill="#F6E2E0" stroke="#B04A4A" stroke-width="2.5"/>
<text x="108" y="1263.58" font-size="18" fill="#B04A4A" font-weight="800">這條曲線不是任何一個人的預測</text>
<text x="108" y="1289.58" font-size="15" fill="#345963" font-weight="600">它是一群人的統計。中位數不是期限；尾巴不是承諾。同一個人身上，年齡、體能狀態、切除程度與 MGMT 會把他往左或往右推，而分級工具只解釋了其中大約兩成的差異——剩下的八</text>
<text x="108" y="1311.58" font-size="15" fill="#345963" font-weight="600">成，我們不知道是什麼。</text>
<text x="84" y="1357.58" font-size="16" fill="#527078">示意圖，依 Stupp 2009（EORTC 26981-22981／NCIC CE.3）、Poon 2020、Tykocki 2018 與 Johnson 2012 重繪；曲線形狀為示意，只有標出的數點是原文報告的數字；各研</text>
<text x="84" y="1381.58" font-size="16" fill="#527078">究族群、設計與終點不同，數點不可直接互比。</text>
  </g>
</svg>
