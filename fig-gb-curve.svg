<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1408" viewBox="0 0 1440 1408" role="img" aria-labelledby="t d">
  <title id="t">存活曲線的正確讀法：中位數在哪裡、尾巴上那幾個數字各有各的分母</title>
  <desc id="d">示意圖：怎麼讀膠質母細胞瘤的存活曲線。主圖是兩條存活曲線，時間軸從隨機分派起算 0 到 5 年，縱軸是還活著的比例。上面那條是放療加 temozolomide 組（n=287），標出的數點為：兩年 27.2%（95% 信賴區間 22.2 到 32.5）、三年 16.0%（12.0 到 20.6）、四年 12.1%（8.5 到 16.4）、五年 9.8%（6.4 到 14.0）。下面那條是只做放療組（n=286）：兩年 10.9%、三年 4.4%、四年 3.0%、五年 1.9%。中位存活 14.6 個月處畫一條垂直虛線，線的左邊寫「一半的人在這條線之前」、右邊寫「一半的人在這條線之後」。曲線到五年還沒有碰到底，圖上標註尾巴上的人是真的。曲線形狀為示意，只有標出的點是原文報告的數字。下方三張同樣大小的卡片，是尾巴上三個數字各自的分母：第一，試驗族群五年 9.8%（95% 信賴區間 6.4 到 14.0），來自 EORTC 26981-22981／NCIC CE.3 的放療加 temozolomide 組、n=287、2000 到 2002 年收案，是被隨機分派、體能狀態與年齡足以進試驗的那一群人；第二，真實世界五年 4%（95% 信賴區間 2 到 5），來自 Poon 2020 統合分析、1,291 除以 28,748 人、2005 年以後收案的族群，兩年與三年那一段真的有進步、五年這一段沒有；第三，十年約 0.71%，來自 Tykocki 2018 系統回顧、36 篇研究、162 例、1950 到 2014 年發表，大多沒有做 IDH 檢測，依 2021 年的分類有相當比例今天不會被叫做膠質母細胞瘤，所以正確的說法是「在舊分類下有人活了十年」。另有一格條件機率：再活兩年的機率，診斷當下是 19.8%，診斷後五年是 65.9%（Johnson 2012，SEER 1998 到 2008 年、接受含放療方案的病人，n=10,022），這是族群層次的條件機率，不是誰的個人預測。圖的最下方是一句警語：這條曲線不是任何一個人的預測，它是一群人的統計；中位數不是期限、尾巴不是承諾；年齡、體能狀態、切除程度與 MGMT 會把人往左或往右推，而分級工具只解釋了其中大約兩成的差異，剩下的八成我們不知道是什麼。</desc>
