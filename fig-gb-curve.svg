  <g class="z">
<text x="84" y="86" font-size="18" fill="#A98722" font-weight="800" letter-spacing="4px">HOW TO READ A SURVIVAL CURVE</text>
<text x="84" y="148" font-size="42" fill="#123641" font-weight="800" class="r">尾巴上那幾個數字，每一個有自己的分母</text>
<text x="84" y="206.08" font-size="20" fill="#527078">這張圖要你看兩件事：中位數那條線的意思，以及尾巴是真的存在的。</text>
<text x="84" y="235.08" font-size="20" fill="#527078">尾巴上的三個數字來自三個不同的族群，各帶各的分母——不可以挑最高的那一個當自己的預期。</text>
