<text x="493.14" y="441.68" font-size="14.5" fill="#5C77C4" font-weight="800" text-anchor="middle">6.0</text>
<circle cx="225.71" cy="405.4" r="7.22" fill="#5C77C4" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="225.71" y="392.18" font-size="14.5" fill="#5C77C4" font-weight="800" text-anchor="middle">7.5</text>
<circle cx="92" cy="379" r="7.22" fill="#96790F" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="92" y="365.78" font-size="14.5" fill="#96790F" font-weight="800" text-anchor="middle">8.3</text>
