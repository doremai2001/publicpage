<circle cx="292.57" cy="346" r="10.2" fill="#00806B" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="292.57" y="329.8" font-size="14.5" fill="#00806B" font-weight="800" text-anchor="middle">9.3</text>
<text x="466.4" y="379.8" font-size="12.9" fill="#123641" font-weight="800" text-anchor="middle">Keime-Guibert 2007</text>
<text x="466.4" y="397.8" font-size="10.75" fill="#527078" font-weight="600" text-anchor="middle">50 Gy／28 次</text>
<text x="306.57" y="502.11" font-size="12.9" fill="#123641" font-weight="800" text-anchor="start">Roa 2004</text>
<text x="106" y="327" font-size="12.9" fill="#123641" font-weight="800" text-anchor="start">Nordic 2012</text>
<text x="172.86" y="340.2" font-size="12.9" fill="#123641" font-weight="800" text-anchor="start">Roa 2015</text>
<text x="306.57" y="294" font-size="12.9" fill="#123641" font-weight="800" text-anchor="start">Perry 2017</text>
<text x="40" y="752.9" font-size="12.5" fill="#527078">橫軸的其餘刻度：1 週＝25 Gy／5 次、2 週＝34 Gy／10 次；約 5.6 週＝50 Gy／28 次。</text>
<text x="40" y="788.9" font-size="14" fill="#123641" font-weight="800">Keime-Guibert 2007</text>
<text x="40" y="806.9" font-size="12.5" fill="#527078">≥70 歲、KPS ≥70，n=81｜風險比 0.47（0.29 到 0.76），P＝0.002；原文以週報告（29.1 對</text>
<text x="40" y="824.9" font-size="12.5" fill="#527078">16.9 週），此處換算為月</text>
<text x="40" y="848.9" font-size="14" fill="#123641" font-weight="800">Roa 2004</text>
<text x="40" y="866.9" font-size="12.5" fill="#527078">≥60 歲，n=100｜P＝.57，看不出差別</text>
<text x="40" y="890.9" font-size="14" fill="#123641" font-weight="800">Nordic 2012</text>
<text x="40" y="908.9" font-size="12.5" fill="#527078">≥60 歲，三組隨機｜只吃 temozolomide 對標準放療 風險比 0.70（0.52 到 0.93），p＝0.01</text>
<text x="40" y="932.9" font-size="14" fill="#123641" font-weight="800">Roa 2015</text>
<text x="40" y="950.9" font-size="12.5" fill="#527078">高齡或體能較差，n=98；中位追蹤只有 6.3 個月｜P＝.988，看不出差別</text>
<text x="40" y="974.9" font-size="14" fill="#123641" font-weight="800">Perry 2017</text>
<text x="40" y="992.9" font-size="12.5" fill="#527078">≥65 歲，n=562，兩組放療都是 40 Gy／15 次｜風險比 0.67（0.56 到 0.80），P＜0.001</text>
<text x="40" y="1022.9" font-size="12.47" fill="#00806B" font-weight="700">先立的那一條：Keime-Guibert 把「不放療」也放進了隨機分派，答案是放療有用。有了這一條，</text>
<text x="40" y="1040.96" font-size="12.47" fill="#00806B" font-weight="700">才輪到「要不要縮短」。</text>
<rect x="40" y="1079.0249999999999" width="540" height="101.66000000000008" rx="14" fill="none" stroke="#C9A83E" stroke-width="2.5"/>
<text x="58" y="1105.02" font-size="12.9" fill="#8F7418" font-weight="800">Perry 2017 的 MGMT 分層（必看的第二層）</text>
<text x="58" y="1127.08" font-size="12.04" fill="#345963">甲基化（n=165）：13.5 對 7.7 個月，風險比 0.53（0.38 到 0.73），P＜0.001。未甲基化（</text>
<text x="58" y="1144.28" font-size="12.04" fill="#345963">n=189）：10.0 對 7.9 個月，風險比 0.75（0.56 到 1.01），P＝0.055——沒有達到統計顯著。</text>
<text x="58" y="1161.48" font-size="12.04" fill="#345963">加不加藥這件事在兩層裡不是同一個強度。</text>
<rect x="40" y="1192.685" width="540" height="84.46000000000004" rx="14" fill="none" stroke="#C9A83E" stroke-width="2.5"/>
<text x="58" y="1218.68" font-size="12.9" fill="#8F7418" font-weight="800">Roa 2004 的類固醇（差別不只在存活）</text>
<text x="58" y="1240.74" font-size="12.04" fill="#345963">需要增加類固醇劑量的人：60 Gy／30 次那一組 49%，40 Gy／15 次那一組 23%（χ² P＝.02）。</text>
<text x="58" y="1257.94" font-size="12.04" fill="#345963">存活看不出差別（P＝.57）——差別在這一項上。</text>
<rect x="40" y="1309.145" width="540" height="133.1800000000003" rx="16" fill="#F6E2E0" stroke="#B04A4A" stroke-width="2.5"/>
<text x="64" y="1339.14" font-size="15.48" fill="#B04A4A" font-weight="800">決定的是體能狀態，不是生日那一年</text>
<text x="64" y="1364.64" font-size="12.9" fill="#345963" font-weight="600">短程不劣的結論限在 ≥60 歲的膠質母細胞瘤族群，不能寫成「年紀大就該縮短」。而</text>
<text x="64" y="1383.57" font-size="12.9" fill="#345963" font-weight="600">體能狀態很差、幾乎臥床的人，被排除在幾乎所有隨機試驗之外；在這一群人身上，從</text>
<text x="64" y="1402.49" font-size="12.9" fill="#345963" font-weight="600">來沒有隨機試驗把舒適導向照護和積極的放療或化療拿來比——那時候的討論是另一種</text>
<text x="64" y="1421.41" font-size="12.9" fill="#345963" font-weight="600">討論。</text>
<text x="40" y="1460.33" font-size="14" fill="#527078">示意圖，依 Keime-Guibert 2007、Roa 2004、Malmström 2012（Nordic）、Roa</text>
<text x="40" y="1481.33" font-size="14" fill="#527078">2015 與 Perry 2017 重繪；各研究族群、設計與終點不同，數點不可直接互比。</text>
