<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1503" viewBox="0 0 620 1503" role="img" aria-labelledby="t d">
  <title id="t">高齡膠質母細胞瘤的五個隨機試驗：療程長度與中位存活</title>
  <desc id="d">示意圖：高齡膠質母細胞瘤的五個隨機試驗，畫在同一張散布圖上。橫軸是療程長度（週），縱軸是中位存活（月）。Keime-Guibert 2007（≥70 歲、KPS ≥70，n=81）：只做支持性照護 16.9 週（約 3.9 個月），支持性照護加 50 Gy 分 28 次 29.1 週（約 6.7 個月），風險比 0.47（0.29 到 0.76），P 等於 0.002；原文以週報告，此處換算為月。Roa 2004（≥60 歲，n=100）：60 Gy 分 30 次 5.1 個月，40 Gy 分 15 次 5.6 個月，P 等於 .57，看不出差別。Nordic 2012（≥60 歲，三組隨機）：60 Gy 分 30 次 6.0 個月，34 Gy 分 10 次 7.5 個月，只吃 temozolomide 不放療 8.3 個月；temozolomide 對標準放療的風險比 0.70（0.52 到 0.93），p 等於 0.01。Roa 2015（高齡或體能較差，n=98，中位追蹤只有 6.3 個月）：40 Gy 分 15 次 6.4 個月，25 Gy 分 5 次 7.9 個月，P 等於 .988，看不出差別。Perry 2017（≥65 歲，n=562，兩組放療都是 40 Gy 分 15 次，圖上用最粗的標記）：只做放療 7.6 個月，放療加 temozolomide 9.3 個月，風險比 0.67（0.56 到 0.80），P 小於 0.001。圖上兩個必要的註記：第一，Perry 的 MGMT 分層——甲基化（n=165）13.5 對 7.7 個月、風險比 0.53（0.38 到 0.73）、P 小於 0.001；未甲基化（n=189）10.0 對 7.9 個月、風險比 0.75（0.56 到 1.01）、P 等於 0.055，沒有達到統計顯著。第二，Roa 2004 的類固醇——需要增加類固醇劑量的人在 60 Gy 分 30 次那一組是 49%、在 40 Gy 分 15 次那一組是 23%（卡方檢定 P 等於 .02），而存活看不出差別（P 等於 .57）。圖說一句：橫軸變短，縱軸沒有掉下來，這就是可以縮短的意思。最下面的警語：決定的是體能狀態，不是生日那一年；短程不劣的結論限在 60 歲以上的膠質母細胞瘤族群，不能寫成年紀大就該縮短；體能狀態很差、幾乎臥床的人被排除在幾乎所有隨機試驗之外，在這一群人身上從來沒有隨機試驗把舒適導向照護和積極的放療或化療拿來比。</desc>
