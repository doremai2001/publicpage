<text x="40" y="62" font-size="13" fill="#A98722" font-weight="800" letter-spacing="2.5px">FIVE RANDOMISED TRIALS IN OLDER PATIENTS</text>
<text x="40" y="108" font-size="27" fill="#123641" font-weight="800" class="r">今天大多數人被建議的，是短程放療再加上藥</text>
<text x="40" y="147.48" font-size="15.5" fill="#527078">橫軸是療程長度（週），縱軸是中位存活（月）。橫軸變短，縱軸沒有掉下來</text>
<text x="40" y="169.95" font-size="15.5" fill="#527078">——這就是「可以縮短」的意思。</text>
<text x="40" y="192.43" font-size="15.5" fill="#527078">五個試驗的收案條件、年代與終點都不一樣，點與點之間不可以直接連起來比。</text>
