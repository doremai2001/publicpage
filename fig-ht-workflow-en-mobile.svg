<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1160" viewBox="0 0 720 1160" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">It is added on top; it replaces nothing</title>
  <desc id="d">It will not reduce your radiation fractions or chemotherapy cycles, and it does not lessen their side effects. 1–2 times a week, not daily — tissue becomes heat-tolerant for a while；Trials generally require it within two hours of radiotherapy；40–60 minutes of heating; about 90 minutes door to door；Whether temperature was measured, and what dose was reached</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#123641" opacity=".14"/><line x1="0" y1="0" x2="0" y2="8" stroke="#123641" stroke-width="2.4" opacity=".85"/></pattern><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0B2832" flood-opacity=".12"/></filter><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="720" height="1160" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="56" y="78" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">WHERE IT SITS</text>
<text x="56" y="140" font-size="30" fill="#123641" font-weight="800" class="r">It is added on top; it replaces nothing</text>
<text x="56" y="182" font-size="18" fill="#527078">Hyperthermia is not a step in the pathway — it rides on radiotherapy or chemotherapy.</text>
<text x="56" y="209" font-size="18" fill="#527078">So what it displaces is not treatment: it is money, time and stamina.</text>
<rect x="56" y="476" width="185.333" height="78" rx="16" fill="#123641" opacity=".10" />
<text x="148.667" y="510" font-size="15" fill="#123641" font-weight="700" text-anchor="middle"></text>
<text x="148.667" y="536" font-size="15" fill="#123641" font-weight="700" text-anchor="middle">Diagnosis</text>
<text x="148.667" y="562" font-size="15" fill="#123641" font-weight="700" text-anchor="middle">and</text>
<text x="148.667" y="588" font-size="15" fill="#123641" font-weight="700" text-anchor="middle">staging</text>
<path d="M 245.333 518 L 261.333 518" fill="none" stroke="#6B8084" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 263.333 518 l -8 -6 l 0 12 Z" fill="#6B8084"/>
<rect x="267.333" y="476" width="185.333" height="78" rx="16" fill="#123641" opacity=".92" />
<text x="360" y="510" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">Standard</text>
<text x="360" y="536" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">treatment</text>
<text x="360" y="562" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">(surgery</text>
<text x="360" y="588" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">/</text>
<text x="360" y="614" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">radiotherapy</text>
<text x="360" y="640" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">/</text>
<text x="360" y="666" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">chemotherapy)</text>
<path d="M 456.667 518 L 472.667 518" fill="none" stroke="#6B8084" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 474.667 518 l -8 -6 l 0 12 Z" fill="#6B8084"/>
<rect x="478.667" y="476" width="185.333" height="78" rx="16" fill="#123641" opacity=".10" />
<text x="571.333" y="524" font-size="15" fill="#123641" font-weight="700" text-anchor="middle">Follow-up</text>
<rect x="267.333" y="348" width="185.333" height="76" rx="16" fill="#A98722" opacity=".92" />
<text x="360" y="394" font-size="20" fill="#FFFFFF" font-weight="800" text-anchor="middle" class="r">Hyperthermia</text>
<path d="M 360 424 L 360 462" fill="none" stroke="#A98722" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 8"/>
<path d="M 360 472 l -7 -11 l 14 0 Z" fill="#A98722"/>
<rect x="56" y="584" width="608" height="78" rx="16" fill="#FFFFFF" opacity=".78" />
<rect x="56" y="584" width="5" height="78" rx="3" fill="#5C77C4" />
<text x="76" y="614" font-size="16" fill="#123641" font-weight="800">Schedule</text>
<text x="76" y="638" font-size="14" fill="#527078">1–2 times a week, not</text>
<text x="76" y="661" font-size="14" fill="#527078">daily — tissue becomes</text>
<text x="76" y="684" font-size="14" fill="#527078">heat-tolerant for a while</text>
<rect x="56" y="676" width="608" height="78" rx="16" fill="#FFFFFF" opacity=".78" />
<rect x="56" y="676" width="5" height="78" rx="3" fill="#5C77C4" />
<text x="76" y="706" font-size="16" fill="#123641" font-weight="800">Time window</text>
<text x="76" y="730" font-size="14" fill="#527078">Trials generally require</text>
<text x="76" y="753" font-size="14" fill="#527078">it within two hours of</text>
<text x="76" y="776" font-size="14" fill="#527078">radiotherapy</text>
<rect x="56" y="768" width="608" height="78" rx="16" fill="#FFFFFF" opacity=".78" />
<rect x="56" y="768" width="5" height="78" rx="3" fill="#5C77C4" />
<text x="76" y="798" font-size="16" fill="#123641" font-weight="800">Each session</text>
<text x="76" y="822" font-size="14" fill="#527078">40–60 minutes of heating;</text>
<text x="76" y="845" font-size="14" fill="#527078">about 90 minutes door to</text>
<text x="76" y="868" font-size="14" fill="#527078">door</text>
<rect x="56" y="860" width="608" height="78" rx="16" fill="#FFFFFF" opacity=".78" />
<rect x="56" y="860" width="5" height="78" rx="3" fill="#5C77C4" />
<text x="76" y="890" font-size="16" fill="#123641" font-weight="800">Verification</text>
<text x="76" y="914" font-size="14" fill="#527078">Whether temperature was</text>
<text x="76" y="937" font-size="14" fill="#527078">measured, and what dose</text>
<text x="76" y="960" font-size="14" fill="#527078">was reached</text>
<rect x="56" y="966" width="608" height="2" rx="1" fill="#A98722" opacity=".55" />
<text x="56" y="1000" font-size="18" fill="#123641" font-weight="800" class="r">It will not reduce your</text>
<text x="56" y="1030" font-size="18" fill="#123641" font-weight="800" class="r">radiation fractions or</text>
<text x="56" y="1060" font-size="18" fill="#123641" font-weight="800" class="r">chemotherapy cycles, and it</text>
<text x="56" y="1090" font-size="18" fill="#123641" font-weight="800" class="r">does not lessen their side</text>
<text x="56" y="1120" font-size="18" fill="#123641" font-weight="800" class="r">effects.</text>
<text x="56" y="1124" font-size="14" fill="#6B8084">Schematic. Scheduling and timing follow the </text>
<text x="56" y="1144" font-size="14" fill="#6B8084">protocols of the trials cited in this topic (Yan</text>
  </g>
