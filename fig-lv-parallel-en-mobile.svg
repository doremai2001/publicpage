<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1476" viewBox="0 0 620 1476" role="img" aria-labelledby="t d">
  <title id="t">The liver is a mean-dose organ</title>
  <desc id="d">Schematic (not an actual dose distribution): radiation-induced liver injury tracks mean liver dose and irradiated volume (QUANTEC); the rule is to keep at least 700 cc of normal liver at 15 Gy or less over 3 to 5 fractions. Left: photon SBRT concentrates the high dose on the tumour, but every beam leaves a low-dose bath across normal liver on its way in and out, and exits the body. Right: protons deposit their dose at the Bragg peak and stop — almost no exit dose, so more normal liver goes largely untouched. Clinical anchors: in a randomised trial against RFA, Child-Pugh scores worsened in 7.5% vs 19.6%; a retrospective proton-vs-photon comparison found less non-classic radiation-induced liver injury (OR 0.26; selection bias cannot be excluded). Protons are not cost-free, and the proton-vs-photon randomised trial NRG-GI003 is unpublished.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="620" height="1476" rx="30" fill="url(#bg)"/>
  <g class="z">
<text x="44" y="62" font-size="14" fill="#A98722" font-weight="800" letter-spacing="3.5px">PARALLEL ORGAN</text>
<text x="44" y="112" font-size="30" fill="#123641" font-weight="800" class="r">The liver is a</text>
<text x="44" y="152" font-size="30" fill="#123641" font-weight="800" class="r">mean-dose organ</text>
<text x="44" y="194" font-size="14.5" fill="#527078">Liver injury tracks mean dose and irradiated</text>
<text x="44" y="216" font-size="14.5" fill="#527078">volume, not the hottest spot (QUANTEC). Protons</text>
<text x="44" y="238" font-size="14.5" fill="#527078">have almost no exit dose — sparing the low-dose bath.</text>
<g filter="url(#sh)"><rect x="44" y="268" width="532" height="358" rx="18" fill="#FFFFFF"/></g>
<rect x="64" y="288" width="9" height="22" rx="4" fill="#5C77C4"/>
<text x="84" y="305" font-size="16" fill="#123641" font-weight="800">Photon SBRT — NHI-covered, already very good</text>
<g transform="translate(58,326) scale(0.93)">
<path d="M 18,142 C 26,58 132,14 252,22 C 372,30 462,58 494,116 C 510,152 486,196 428,218 C 338,250 218,252 138,236 C 68,222 10,206 18,142 Z" fill="#E9E2CF" stroke="#9A9282" stroke-width="2.5"/>
<polygon points="65.6,93.9 528.5,175.5 534.4,142.1 71.5,60.5" fill="#5C77C4" opacity="0.16"/>
<polygon points="547.2,161.6 529.9,167.7 533.0,149.9" fill="#5C77C4" opacity="0.42"/>
<polygon points="118.0,242.7 499.0,22.7 482.0,-6.7 101.0,213.3" fill="#5C77C4" opacity="0.16"/>
<polygon points="504.4,0.0 495.0,15.8 486.0,0.2" fill="#5C77C4" opacity="0.42"/>
<polygon points="154.9,10.2 422.4,251.1 445.1,225.8 177.6,-15.1" fill="#5C77C4" opacity="0.16"/>
<polygon points="445.7,249.1 427.7,245.1 439.8,231.8" fill="#5C77C4" opacity="0.42"/>
<text x="95" y="208" font-size="14" fill="#5C77C4" font-weight="700">Low-dose bath</text>
<text x="455" y="22" font-size="14" fill="#5C77C4" font-weight="700">Exit dose</text>
<circle cx="300" cy="118" r="25" fill="#A98722"/>
<text x="300" y="166" font-size="14" fill="#8F7418" font-weight="800" text-anchor="middle">Tumour</text>
</g>
<text x="64" y="574" font-size="13.4" fill="#345963" font-weight="600">High dose on the tumour, but each beam sweeps normal</text>
<text x="64" y="595" font-size="13.4" fill="#345963" font-weight="600">liver in and out — a low-dose bath, plus exit dose.</text>
<g filter="url(#sh)"><rect x="44" y="644" width="532" height="358" rx="18" fill="#FFFFFF"/></g>
<rect x="64" y="664" width="9" height="22" rx="4" fill="#00806B"/>
<text x="84" y="681" font-size="16" fill="#123641" font-weight="800">Proton — the same treatment, engineered</text>
<g transform="translate(58,702) scale(0.93)">
<path d="M 18,142 C 26,58 132,14 252,22 C 372,30 462,58 494,116 C 510,152 486,196 428,218 C 338,250 218,252 138,236 C 68,222 10,206 18,142 Z" fill="#E9E2CF" stroke="#9A9282" stroke-width="2.5"/>
<polygon points="3.0,72.3 296.5,134.6 303.5,101.4 10.1,39.0" fill="#00806B" opacity="0.2"/>
<polygon points="271.0,129.2 296.5,134.6 303.5,101.4 278.1,96.0" fill="#00806B" opacity="0.56"/>
<polygon points="69.6,259.8 308.0,133.0 292.0,103.0 53.6,229.7" fill="#00806B" opacity="0.2"/>
<polygon points="285.0,145.2 308.0,133.0 292.0,103.0 269.1,115.2" fill="#00806B" opacity="0.56"/>
<text x="338" y="62" font-size="14" fill="#00806B" font-weight="700">Bragg peak</text>
<line x1="330" y1="70" x2="312" y2="96" stroke="#6B8084" stroke-width="1.5"/>
<text x="60" y="208" font-size="14" fill="#00806B" font-weight="700">Liver largely untouched</text>
<circle cx="300" cy="118" r="25" fill="#A98722"/>
<text x="300" y="166" font-size="14" fill="#8F7418" font-weight="800" text-anchor="middle">Tumour</text>
</g>
<text x="64" y="950" font-size="13.4" fill="#345963" font-weight="600">The dose stops at the Bragg peak: almost no exit dose;</text>
<text x="64" y="971" font-size="13.4" fill="#345963" font-weight="600">more normal liver goes largely untouched.</text>
<g filter="url(#sh)"><rect x="44" y="1020" width="532" height="98" rx="18" fill="#FFFFFF"/></g>
<text x="64" y="1048" font-size="14.5" fill="#8F7418" font-weight="800">The liver's rule (QUANTEC)</text>
<text x="64" y="1072" font-size="13" fill="#345963">Injury tracks mean liver dose × volume; keep at least</text>
<text x="64" y="1093" font-size="13" fill="#345963">700 cc of normal liver at 15 Gy or less (3–5 fractions).</text>
<g filter="url(#sh)"><rect x="44" y="1132" width="532" height="98" rx="18" fill="#FFFFFF"/></g>
<text x="64" y="1160" font-size="14.5" fill="#8F7418" font-weight="800">Randomised trial (proton vs RFA, recurrent HCC)</text>
<text x="64" y="1184" font-size="13" fill="#345963">Child-Pugh worsened in 7.5% vs 19.6% (cited by</text>
<text x="64" y="1205" font-size="13" fill="#345963">AASLD) — it proves 'not inferior', not 'superior'.</text>
<g filter="url(#sh)"><rect x="44" y="1244" width="532" height="98" rx="18" fill="#FFFFFF"/></g>
<text x="64" y="1272" font-size="14.5" fill="#8F7418" font-weight="800">Retrospective (proton vs photon, MGH)</text>
<text x="64" y="1296" font-size="13" fill="#345963">Less non-classic liver injury (OR 0.26) —</text>
<text x="64" y="1317" font-size="13" fill="#345963">retrospective; selection bias cannot be excluded.</text>
<text x="44" y="1364" font-size="12.8" fill="#6B8084" font-weight="600">Protons are not cost-free (registry: grade 3+ late events 4.7%);</text>
<text x="44" y="1384" font-size="12.8" fill="#6B8084" font-weight="600">NRG-GI003 (proton vs photon) is fully accrued and unpublished.</text>
<text x="44" y="1414" font-size="12" fill="#6B8084">Schematic (not an actual dose distribution), redrawn from</text>
<text x="44" y="1434" font-size="12" fill="#6B8084">Pan 2010 (QUANTEC), Newhauser &amp; Zhang 2015, Kim TH 2021,</text>
<text x="44" y="1454" font-size="12" fill="#6B8084">AASLD 2023 and Sanford 2019</text>
  </g>
</svg>
