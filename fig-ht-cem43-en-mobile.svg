<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1330" viewBox="0 0 720 1330" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Same 60 minutes, six times the dose</title>
  <desc id="d">“Six sessions delivered” is not “six sessions that reached dose.” Ask what your thermal dose was. Schematic. The two temperature curves are hypothetical; dose is computed with the Sapareto &amp; Dewey 1984 conversion.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#123641" opacity=".14"/><line x1="0" y1="0" x2="0" y2="8" stroke="#123641" stroke-width="2.4" opacity=".85"/></pattern><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0B2832" flood-opacity=".12"/></filter><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="720" height="1330" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="56" y="78" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">THERMAL DOSE</text>
<text x="56" y="140" font-size="30" fill="#123641" font-weight="800" class="r">Same 60 minutes, six times the dose</text>
<text x="56" y="182" font-size="18" fill="#527078">Thermal dose converts “how hot, how long” into minutes-equivalent at 43 °C.</text>
<text x="56" y="209" font-size="18" fill="#527078">A 1.5 °C difference changes the total several-fold — and you are billed per session.</text>
<rect x="58" y="278" width="608" height="400" rx="20" fill="#FFFFFF" opacity=".78" />
<text x="78" y="310" font-size="19" fill="#123641" font-weight="800" class="r">A session that reached target</text>
<line x1="78" y1="500.831" x2="646" y2="500.831" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 8" opacity=".3"/>
<text x="70" y="506.831" font-size="14" fill="#6B8084" font-weight="700" text-anchor="end">40</text>
<line x1="78" y1="448.883" x2="646" y2="448.883" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 8" opacity=".3"/>
<text x="70" y="454.883" font-size="14" fill="#6B8084" font-weight="700" text-anchor="end">41</text>
<line x1="78" y1="396.935" x2="646" y2="396.935" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 8" opacity=".3"/>
<text x="70" y="402.935" font-size="14" fill="#6B8084" font-weight="700" text-anchor="end">42</text>
<line x1="78" y1="344.987" x2="646" y2="344.987" stroke="#A98722" stroke-width="2" stroke-linecap="round" opacity=".55"/>
<text x="70" y="350.987" font-size="14" fill="#8F7418" font-weight="800" text-anchor="end">43</text>
<line x1="78" y1="532" x2="646" y2="532" stroke="#123641" stroke-width="2" stroke-linecap="round"/>
<path d="M 78 532 L 78 448.883 L 220 448.883 L 220 396.935 L 504 396.935 L 504 422.909 L 646 422.909 L 646 532 Z" fill="#A98722" opacity=".22"/>
<path d="M 78 448.883 L 220 448.883 M 220 396.935 L 504 396.935 M 504 422.909 L 646 422.909 " fill="none" stroke="#A98722" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="149" y="434.883" font-size="14" fill="#123641" font-weight="800" text-anchor="middle">41.0°C</text>
<text x="149" y="558" font-size="15" fill="#A98722" font-weight="800" text-anchor="middle">0.94</text>
<text x="149" y="578" font-size="13" fill="#6B8084" text-anchor="middle">15 min</text>
<text x="362" y="382.935" font-size="14" fill="#123641" font-weight="800" text-anchor="middle">42.0°C</text>
<text x="362" y="558" font-size="15" fill="#A98722" font-weight="800" text-anchor="middle">7.5</text>
<text x="362" y="578" font-size="13" fill="#6B8084" text-anchor="middle">30 min</text>
<line x1="220" y1="338" x2="220" y2="532" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 6" opacity=".25"/>
<text x="575" y="408.909" font-size="14" fill="#123641" font-weight="800" text-anchor="middle">41.5°C</text>
<text x="575" y="558" font-size="15" fill="#A98722" font-weight="800" text-anchor="middle">1.9</text>
<text x="575" y="578" font-size="13" fill="#6B8084" text-anchor="middle">15 min</text>
<line x1="504" y1="338" x2="504" y2="532" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 6" opacity=".25"/>
<text x="78" y="616" font-size="15" fill="#6B8084" font-weight="700">Total</text>
<text x="78" y="660" font-size="38" fill="#A98722" font-weight="800">10.3</text>
<text x="174" y="658" font-size="15" fill="#6B8084" font-weight="700">CEM43 minutes</text>
<rect x="58" y="728" width="608" height="400" rx="20" fill="#FFFFFF" opacity=".78" />
<text x="78" y="760" font-size="19" fill="#123641" font-weight="800" class="r">A session that did not</text>
<line x1="78" y1="950.831" x2="646" y2="950.831" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 8" opacity=".3"/>
<text x="70" y="956.831" font-size="14" fill="#6B8084" font-weight="700" text-anchor="end">40</text>
<line x1="78" y1="898.883" x2="646" y2="898.883" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 8" opacity=".3"/>
<text x="70" y="904.883" font-size="14" fill="#6B8084" font-weight="700" text-anchor="end">41</text>
<line x1="78" y1="846.935" x2="646" y2="846.935" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 8" opacity=".3"/>
<text x="70" y="852.935" font-size="14" fill="#6B8084" font-weight="700" text-anchor="end">42</text>
<line x1="78" y1="794.987" x2="646" y2="794.987" stroke="#A98722" stroke-width="2" stroke-linecap="round" opacity=".55"/>
<text x="70" y="800.987" font-size="14" fill="#8F7418" font-weight="800" text-anchor="end">43</text>
<line x1="78" y1="982" x2="646" y2="982" stroke="#123641" stroke-width="2" stroke-linecap="round"/>
<path d="M 78 982 L 78 924.857 L 220 924.857 L 220 924.857 L 504 924.857 L 504 950.831 L 646 950.831 L 646 982 Z" fill="#5C77C4" opacity=".22"/>
<path d="M 78 924.857 L 220 924.857 M 220 924.857 L 504 924.857 M 504 950.831 L 646 950.831 " fill="none" stroke="#5C77C4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="149" y="910.857" font-size="14" fill="#123641" font-weight="800" text-anchor="middle">40.5°C</text>
<text x="149" y="1008" font-size="15" fill="#5C77C4" font-weight="800" text-anchor="middle">0.47</text>
<text x="149" y="1028" font-size="13" fill="#6B8084" text-anchor="middle">15 min</text>
<text x="362" y="910.857" font-size="14" fill="#123641" font-weight="800" text-anchor="middle">40.5°C</text>
<text x="362" y="1008" font-size="15" fill="#5C77C4" font-weight="800" text-anchor="middle">0.94</text>
<text x="362" y="1028" font-size="13" fill="#6B8084" text-anchor="middle">30 min</text>
<line x1="220" y1="788" x2="220" y2="982" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 6" opacity=".25"/>
<text x="575" y="936.831" font-size="14" fill="#123641" font-weight="800" text-anchor="middle">40.0°C</text>
<text x="575" y="1008" font-size="15" fill="#5C77C4" font-weight="800" text-anchor="middle">0.23</text>
<text x="575" y="1028" font-size="13" fill="#6B8084" text-anchor="middle">15 min</text>
<line x1="504" y1="788" x2="504" y2="982" stroke="#123641" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 6" opacity=".25"/>
<text x="78" y="1066" font-size="15" fill="#6B8084" font-weight="700">Total</text>
<text x="78" y="1110" font-size="38" fill="#5C77C4" font-weight="800">1.6</text>
<text x="153" y="1108" font-size="15" fill="#6B8084" font-weight="700">CEM43 minutes</text>
<text x="56" y="1092" font-size="16" fill="#6B8084">Each segment is converted, then summed; below 43 °C, one degree lower counts for a quarter of the time</text>
<rect x="56" y="1100" width="608" height="2" rx="1" fill="#A98722" opacity=".55" />
<text x="56" y="1148" font-size="19" fill="#123641" font-weight="800" class="r">“Six sessions delivered” is</text>
<text x="56" y="1180" font-size="19" fill="#123641" font-weight="800" class="r">not “six sessions that</text>
<text x="56" y="1212" font-size="19" fill="#123641" font-weight="800" class="r">reached dose.” Ask what your</text>
<text x="56" y="1244" font-size="19" fill="#123641" font-weight="800" class="r">thermal dose was.</text>
<text x="56" y="1294" font-size="14" fill="#6B8084">Schematic. The two temperature curves are hypothetical; dose is computed with the Sapareto &amp; Dewey 1984 conversion.</text>
  </g>
</svg>
