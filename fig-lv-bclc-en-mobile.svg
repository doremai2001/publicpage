<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1381" viewBox="0 0 620 1381" role="img" aria-labelledby="t d">
  <title id="t">BCLC in brief, and the time lag</title>
  <desc id="d">Schematic: the BCLC system puts tumour burden, liver function and performance status into five boxes (0 very early, A early, B intermediate, C advanced, D terminal), each linked to a first-line recommendation: stage 0, ablation or resection (resection first if transplant and surgery are both options); stage A, a choice among curative options (resection, transplant, ablation); stage B defaults to TACE but is a spectrum, not one box — limited burden (within up-to-7) may merit curative-intent options, while beyond up-to-11 TACE is strongly discouraged (Taiwan Liver Cancer Association 2025 consensus, 100% agreement); stage C, systemic therapy; stage D, best supportive care. Two footnotes: the BCLC 2022 text itself says the final decision belongs to the physician and multidisciplinary team, with treatment-stage migration built in; and for the same SBRT, APASL 2017 wrote 'not shown to improve outcomes', BCLC 2022 'further prospective studies are needed', AASLD 2023 gave it a concrete slot, and Taiwan's NHI has actually reimbursed it since 2015 (37047B) — guideline wording takes time to catch up with evidence. The 2026 BCLC update is paywalled; this figure follows the 2022 version.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="620" height="1381" rx="30" fill="url(#bg)"/>
  <g class="z">
<defs><linearGradient id="spec" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00806B"/><stop offset="0.5" stop-color="#C9A83E"/><stop offset="1" stop-color="#9A9282"/></linearGradient></defs>
<text x="44" y="62" font-size="14" fill="#A98722" font-weight="800" letter-spacing="3.5px">BCLC — MAP, NOT VERDICT</text>
<text x="44" y="112" font-size="30" fill="#123641" font-weight="800" class="r">BCLC in brief, and</text>
<text x="44" y="152" font-size="30" fill="#123641" font-weight="800" class="r">the time lag</text>
<text x="44" y="194" font-size="14.5" fill="#527078">Five boxes, each with a first-line recommendation;</text>
<text x="44" y="216" font-size="14.5" fill="#527078">the two footnotes are what patients rarely see.</text>
<g filter="url(#sh)"><rect x="44" y="246" width="532" height="118" rx="18" fill="#FFFFFF"/></g>
<rect x="66" y="264" width="200" height="30" rx="13" fill="#5C77C4"/>
<text x="166.0" y="284.04" font-size="14" fill="#FFFFFF" font-weight="800" text-anchor="middle">0 · very early</text>
<text x="280" y="285" font-size="12.5" fill="#6B8084">Single small lesion</text>
<text x="66" y="322" font-size="15.5" fill="#123641" font-weight="800">Ablation or resection; resection first</text>
<text x="66" y="345" font-size="15.5" fill="#123641" font-weight="800">if transplant and surgery both fit</text>
<g filter="url(#sh)"><rect x="44" y="378" width="532" height="118" rx="18" fill="#FFFFFF"/></g>
<rect x="66" y="396" width="200" height="30" rx="13" fill="#5C77C4"/>
<text x="166.0" y="416.04" font-size="14" fill="#FFFFFF" font-weight="800" text-anchor="middle">A · early</text>
<text x="280" y="417" font-size="12.5" fill="#6B8084">Single or a few nodules</text>
<text x="66" y="454" font-size="15.5" fill="#123641" font-weight="800">Choose among curative options:</text>
<text x="66" y="477" font-size="15.5" fill="#123641" font-weight="800">resection / transplant / ablation</text>
<g filter="url(#sh)"><rect x="44" y="510" width="532" height="204" rx="18" fill="#FFFFFF"/></g>
<rect x="66" y="528" width="200" height="30" rx="13" fill="#96790F"/>
<text x="166.0" y="548.04" font-size="14" fill="#FFFFFF" font-weight="800" text-anchor="middle">B · intermediate</text>
<text x="280" y="549" font-size="12.5" fill="#6B8084">Multinodular, liver-confined</text>
<text x="66" y="586" font-size="15.5" fill="#123641" font-weight="800">TACE by default — but stage B is</text>
<text x="66" y="609" font-size="15.5" fill="#123641" font-weight="800">a spectrum, not one box (TLCA 2025)</text>
<rect x="66" y="634" width="488" height="12" rx="6" fill="url(#spec)" opacity="0.85"/>
<text x="66" y="666" font-size="12.8" fill="#00806B" font-weight="700">Within up-to-7: curative-intent options possible</text>
<text x="66" y="688" font-size="12.8" fill="#6F675A" font-weight="700">Beyond up-to-11: TACE strongly discouraged</text>
<g filter="url(#sh)"><rect x="44" y="728" width="532" height="95" rx="18" fill="#FFFFFF"/></g>
<rect x="66" y="746" width="200" height="30" rx="13" fill="#9A9282"/>
<text x="166.0" y="766.04" font-size="14" fill="#FFFFFF" font-weight="800" text-anchor="middle">C · advanced</text>
<text x="280" y="767" font-size="12.5" fill="#6B8084">Vascular invasion or spread</text>
<text x="66" y="804" font-size="15.5" fill="#123641" font-weight="800">Systemic therapy leads</text>
<g filter="url(#sh)"><rect x="44" y="837" width="532" height="118" rx="18" fill="#FFFFFF"/></g>
<rect x="66" y="855" width="200" height="30" rx="13" fill="none" stroke="#9A9282" stroke-width="2" stroke-dasharray="6 5"/>
<text x="166.0" y="875.04" font-size="14" fill="#9A9282" font-weight="800" text-anchor="middle">D · terminal</text>
<text x="280" y="876" font-size="12.5" fill="#6B8084">Decompensated liver, poor status</text>
<text x="66" y="913" font-size="15.5" fill="#123641" font-weight="800">Best supportive care leads;</text>
<text x="66" y="936" font-size="15.5" fill="#123641" font-weight="800">individual cases judged by the team</text>
<rect x="44" y="975" width="532" height="122" rx="16" fill="none" stroke="#C9A83E" stroke-width="2"/>
<text x="64" y="1005" font-size="13.5" fill="#8F7418" font-weight="800">In the map's own words (BCLC 2022): the final</text>
<text x="64" y="1027" font-size="13.5" fill="#345963">decision belongs to the physician and tumour</text>
<text x="64" y="1049" font-size="13.5" fill="#345963">board, not a simplified figure. Treatment-stage</text>
<text x="64" y="1071" font-size="13.5" fill="#345963">migration is built in: the road can move.</text>
<g filter="url(#sh)"><rect x="44" y="1113" width="532" height="188" rx="18" fill="#FFFFFF"/></g>
<text x="64" y="1143" font-size="13.5" fill="#8F7418" font-weight="800">The time lag — the same SBRT, four wordings:</text>
<text x="64" y="1165" font-size="13.5" fill="#345963">APASL 2017: 'not shown to improve outcomes' (C2)</text>
<text x="64" y="1187" font-size="13.5" fill="#345963">BCLC 2022: 'further prospective studies needed'</text>
<text x="64" y="1209" font-size="13.5" fill="#345963">AASLD 2023: a concrete slot</text>
<text x="64" y="1231" font-size="13.5" fill="#345963">Taiwan NHI: actually reimbursed since 2015 (37047B)</text>
<text x="64" y="1253" font-size="13.5" fill="#345963">Convention takes time to catch up — 'delayed</text>
<text x="64" y="1275" font-size="13.5" fill="#345963">acceptance' (Moon 2026). The 2026 update is paywalled.</text>
<text x="44" y="1339" font-size="12" fill="#6B8084">Schematic, redrawn from BCLC 2022, the TLCA 2025 consensus,</text>
<text x="44" y="1359" font-size="12" fill="#6B8084">APASL 2017, AASLD 2023, Moon 2026 and NHI 37047B</text>
  </g>
</svg>
