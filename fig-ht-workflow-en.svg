<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">It is added on top; it replaces nothing</title>
  <desc id="d">It will not reduce your radiation fractions or chemotherapy cycles, and it does not lessen their side effects. 1–2 times a week, not daily — tissue becomes heat-tolerant for a while；Trials generally require it within two hours of radiotherapy；40–60 minutes of heating; about 90 minutes door to door；Whether temperature was measured, and what dose was reached</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#123641" opacity=".14"/><line x1="0" y1="0" x2="0" y2="8" stroke="#123641" stroke-width="2.4" opacity=".85"/></pattern><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0B2832" flood-opacity=".12"/></filter><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="900" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="86" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">WHERE IT SITS</text>
<text x="84" y="148" font-size="44" fill="#123641" font-weight="800" class="r">It is added on top; it replaces nothing</text>
<text x="84" y="204" font-size="21" fill="#527078">Hyperthermia is not a step in the pathway — it rides on radiotherapy or chemotherapy.</text>
<text x="84" y="234" font-size="21" fill="#527078">So what it displaces is not treatment: it is money, time and stamina.</text>
<rect x="84" y="450" width="406.667" height="84" rx="16" fill="#123641" opacity=".10" />
<text x="287.333" y="484" font-size="19" fill="#123641" font-weight="700" text-anchor="middle">Diagnosis and</text>
<text x="287.333" y="510" font-size="19" fill="#123641" font-weight="700" text-anchor="middle">staging</text>
<path d="M 494.667 492 L 510.667 492" fill="none" stroke="#6B8084" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 512.667 492 l -8 -6 l 0 12 Z" fill="#6B8084"/>
<rect x="516.667" y="450" width="406.667" height="84" rx="16" fill="#123641" opacity=".92" />
<text x="720" y="484" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="middle">Standard treatment</text>
<text x="720" y="510" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="middle">(surgery /</text>
<text x="720" y="536" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="middle">radiotherapy /</text>
<text x="720" y="562" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="middle">chemotherapy)</text>
<path d="M 927.333 492 L 943.333 492" fill="none" stroke="#6B8084" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 945.333 492 l -8 -6 l 0 12 Z" fill="#6B8084"/>
<rect x="949.333" y="450" width="406.667" height="84" rx="16" fill="#123641" opacity=".10" />
<text x="1152.67" y="498" font-size="19" fill="#123641" font-weight="700" text-anchor="middle">Follow-up</text>
<rect x="516.667" y="332" width="406.667" height="82" rx="16" fill="#A98722" opacity=".92" />
<text x="720" y="382" font-size="26" fill="#FFFFFF" font-weight="800" text-anchor="middle" class="r">Hyperthermia</text>
<path d="M 720 414 L 720 436" fill="none" stroke="#A98722" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 8"/>
<path d="M 720 446 l -7 -11 l 14 0 Z" fill="#A98722"/>
<rect x="84" y="566" width="624" height="88" rx="16" fill="#FFFFFF" opacity=".78" />
<rect x="84" y="566" width="5" height="88" rx="3" fill="#5C77C4" />
<text x="104" y="596" font-size="19" fill="#123641" font-weight="800">Schedule</text>
<text x="104" y="624" font-size="17" fill="#527078">1–2 times a week, not daily —</text>
<text x="104" y="649" font-size="17" fill="#527078">tissue becomes heat-tolerant for a</text>
<text x="104" y="674" font-size="17" fill="#527078">while</text>
<rect x="732" y="566" width="624" height="88" rx="16" fill="#FFFFFF" opacity=".78" />
<rect x="732" y="566" width="5" height="88" rx="3" fill="#5C77C4" />
<text x="752" y="596" font-size="19" fill="#123641" font-weight="800">Time window</text>
<text x="752" y="624" font-size="17" fill="#527078">Trials generally require it within</text>
<text x="752" y="649" font-size="17" fill="#527078">two hours of radiotherapy</text>
<rect x="84" y="670" width="624" height="88" rx="16" fill="#FFFFFF" opacity=".78" />
<rect x="84" y="670" width="5" height="88" rx="3" fill="#5C77C4" />
<text x="104" y="700" font-size="19" fill="#123641" font-weight="800">Each session</text>
<text x="104" y="728" font-size="17" fill="#527078">40–60 minutes of heating; about 90</text>
<text x="104" y="753" font-size="17" fill="#527078">minutes door to door</text>
<rect x="732" y="670" width="624" height="88" rx="16" fill="#FFFFFF" opacity=".78" />
<rect x="732" y="670" width="5" height="88" rx="3" fill="#5C77C4" />
<text x="752" y="700" font-size="19" fill="#123641" font-weight="800">Verification</text>
<text x="752" y="728" font-size="17" fill="#527078">Whether temperature was measured,</text>
<text x="752" y="753" font-size="17" fill="#527078">and what dose was reached</text>
<rect x="84" y="792" width="1272" height="2" rx="1" fill="#A98722" opacity=".55" />
<text x="84" y="826" font-size="22" fill="#123641" font-weight="800" class="r">It will not reduce your radiation fractions or chemotherapy</text>
<text x="84" y="860" font-size="22" fill="#123641" font-weight="800" class="r">cycles, and it does not lessen their side effects.</text>
<text x="84" y="864" font-size="16" fill="#6B8084">Schematic. Scheduling and timing follow the protocols of the trials cited in this topic (Yang 2025, Riesterer 2022, ESHO 1-85).</text>
  </g>
</svg>
