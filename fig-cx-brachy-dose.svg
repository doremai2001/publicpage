<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="t d">
  <title id="t">要求與上限的落差：近接治療存在的理由</title>
  <desc id="d">示意圖：橫軸為 EQD2 劑量 0 至 100 Gy。腫瘤（CTV-HR D90）需要 85–95 Gy；體外放療全骨盆給 45 Gy／25 次，近接治療只對腫瘤再加 40–45 Gy EQD2；同時直腸 D2cm³ 目標小於 65（上限 75）、膀胱目標小於 80（上限 90）。「要求」高於「上限」的落差，體外放療跨不過去；把放射源放進腫瘤、劑量隨距離急遽下降的近接治療跨得過去。近接是根治性放療的必要組成，不是加分的加強。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><pattern id="hz" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#96790F" stroke-width="2" opacity="0.55"/></pattern><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="900" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="86" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">DOSE: DEMAND VS LIMIT</text>
<text x="84" y="148" font-size="44" fill="#123641" font-weight="800" class="r">腫瘤要 85–95，直腸只准 65–75——落差怎麼跨</text>
<text x="84" y="194" font-size="21" fill="#527078">體外放療照進來，腫瘤和旁邊的直腸膀胱拿到的差不多——多給，先超標的是器官。</text>
<text x="84" y="224" font-size="21" fill="#527078">把放射源放進腫瘤裡，劑量隨距離急遽下降——這就是近接治療。</text>
<line x1="380" y1="292" x2="380" y2="660" stroke="#DBD3BF" stroke-width="1"/>
<text x="380" y="684" font-size="17" fill="#6B8084" text-anchor="middle">0</text>
<line x1="500" y1="292" x2="500" y2="660" stroke="#DBD3BF" stroke-width="1"/>
<text x="500" y="684" font-size="17" fill="#6B8084" text-anchor="middle">20</text>
<line x1="620" y1="292" x2="620" y2="660" stroke="#DBD3BF" stroke-width="1"/>
<text x="620" y="684" font-size="17" fill="#6B8084" text-anchor="middle">40</text>
<line x1="740" y1="292" x2="740" y2="660" stroke="#DBD3BF" stroke-width="1"/>
<text x="740" y="684" font-size="17" fill="#6B8084" text-anchor="middle">60</text>
<line x1="860" y1="292" x2="860" y2="660" stroke="#DBD3BF" stroke-width="1"/>
<text x="860" y="684" font-size="17" fill="#6B8084" text-anchor="middle">80</text>
<line x1="980" y1="292" x2="980" y2="660" stroke="#DBD3BF" stroke-width="1"/>
<text x="980" y="684" font-size="17" fill="#6B8084" text-anchor="middle">100</text>
<line x1="380" y1="660" x2="980" y2="660" stroke="#6B8084" stroke-width="1.5"/>
<text x="980" y="710" font-size="18" fill="#345963" font-weight="600" text-anchor="end">EQD2 劑量（Gy）</text>
<rect x="830" y="292" width="60" height="368" fill="#A98722" opacity="0.13"/>
<line x1="830" y1="292" x2="830" y2="660" stroke="#8F7418" stroke-width="1.4" stroke-dasharray="5 4"/>
<line x1="890" y1="292" x2="890" y2="660" stroke="#8F7418" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="860" y="282" font-size="16.5" fill="#8F7418" font-weight="800" text-anchor="middle">「要求」與「上限」的落差</text>
<text x="364" y="346" font-size="19" fill="#345963" font-weight="700" text-anchor="end">腫瘤需要（CTV-HR D90）</text>
<text x="364" y="436" font-size="19" fill="#345963" font-weight="700" text-anchor="end">體外＋近接怎麼給</text>
<text x="364" y="526" font-size="19" fill="#345963" font-weight="700" text-anchor="end">直腸（D2cm³）</text>
<text x="364" y="606" font-size="19" fill="#345963" font-weight="700" text-anchor="end">膀胱（D2cm³）</text>
<rect x="890" y="327" width="60" height="26" rx="4" fill="#96790F"/>
<text x="920" y="316" font-size="18" fill="#96790F" font-weight="800" text-anchor="middle">85–95 Gy EQD2</text>
<rect x="380" y="417" width="270" height="26" rx="4" fill="#5C77C4"/>
<rect x="653" y="417" width="267" height="26" rx="4" fill="url(#hz)"/>
<rect x="653" y="417" width="267" height="26" rx="4" fill="none" stroke="#96790F" stroke-width="2"/>
<text x="515" y="408" font-size="15.5" fill="#5C77C4" font-weight="700" text-anchor="middle">體外 45 Gy／25 次（全骨盆）</text>
<text x="782" y="470" font-size="15.5" fill="#8F7418" font-weight="700" text-anchor="middle">近接再加 40–45 Gy（只加在腫瘤）</text>
<rect x="380" y="507" width="390" height="26" rx="4" fill="#00806B" opacity="0.3"/>
<rect x="772" y="507" width="58" height="26" rx="4" fill="none" stroke="#00806B" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="770" y1="502" x2="770" y2="538" stroke="#00806B" stroke-width="3.5"/>
<line x1="830" y1="502" x2="830" y2="538" stroke="#00806B" stroke-width="3.5"/>
<text x="844" y="526" font-size="17" fill="#00806B" font-weight="700">目標 &lt;65、上限 &lt;75</text>
<rect x="380" y="587" width="480" height="26" rx="4" fill="#00806B" opacity="0.3"/>
<rect x="862" y="587" width="58" height="26" rx="4" fill="none" stroke="#00806B" stroke-width="2" stroke-dasharray="6 4"/>
<line x1="860" y1="582" x2="860" y2="618" stroke="#00806B" stroke-width="3.5"/>
<line x1="920" y1="582" x2="920" y2="618" stroke="#00806B" stroke-width="3.5"/>
<text x="934" y="606" font-size="17" fill="#00806B" font-weight="700">目標 &lt;80、上限 &lt;90</text>
<g filter="url(#sh)"><rect x="1046" y="292" width="310" height="300" rx="20" fill="#FFFFFF"/></g>
<text x="1070" y="330" font-size="18" fill="#123641" font-weight="800">從腫瘤裡面照（示意）</text>
<line x1="1086" y1="522" x2="1326" y2="522" stroke="#6B8084" stroke-width="1.5"/>
<line x1="1086" y1="522" x2="1086" y2="382" stroke="#6B8084" stroke-width="1.5"/>
<path d="M1092,388 L1097.75,388 L1103.5,388 L1109.25,388 L1115,395.231 L1120.75,426.111 L1126.5,446.799 L1132.25,461.333 L1138,471.932 L1143.75,479.898 L1149.5,486.037 L1155.25,490.866 L1161,494.734 L1166.75,497.88 L1172.5,500.473 L1178.25,502.636 L1184,504.458 L1189.75,506.008 L1195.5,507.337 L1201.25,508.485 L1207,509.484 L1212.75,510.358 L1218.5,511.128 L1224.25,511.809 L1230,512.414 L1235.75,512.955 L1241.5,513.44 L1247.25,513.876 L1253,514.271 L1258.75,514.628 L1264.5,514.953 L1270.25,515.25 L1276,515.521 L1281.75,515.769 L1287.5,515.998 L1293.25,516.208 L1299,516.402 L1304.75,516.582 L1310.5,516.748 L1316.25,516.903 L1322,517.047" fill="none" stroke="#96790F" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="1088" y="382" width="52" height="140" fill="#96790F" opacity="0.14"/>
<text x="1114" y="542" font-size="14.5" fill="#8F7418" font-weight="700" text-anchor="middle">腫瘤</text>
<circle cx="1098" cy="398" r="5.5" fill="#96790F"/>
<text x="1268" y="542" font-size="14.5" fill="#00806B" font-weight="700" text-anchor="middle">直腸／膀胱</text>
<line x1="1268" y1="522" x2="1268" y2="492" stroke="#00806B" stroke-width="2" stroke-dasharray="4 3"/>
<text x="1070" y="564" font-size="13" fill="#345963">腫瘤緊貼放射源，拿到 85–95 Gy；</text>
<text x="1070" y="583" font-size="13" fill="#345963">幾公分外的直腸膀胱，已降到上限之下。</text>
<g filter="url(#sh)"><rect x="84" y="724" width="1272" height="96" rx="20" fill="#FFFFFF"/></g>
<line x1="104" y1="744" x2="104" y2="800" stroke="#96790F" stroke-width="5" stroke-linecap="round"/>
<text x="128" y="762" font-size="17.5" fill="#123641" font-weight="700">近接治療是根治性放療的「必要組成」，不是加分的加強（boost）——指引原文：不能用體外加強取代，光子不行、質子也不行。</text>
<text x="128" y="794" font-size="15.5" fill="#345963">不做近接的代價（美國 SEER 資料庫、配對分析、IB2–IVA）：4 年整體存活 64.0% 對 51.4%。</text>
<text x="84" y="874" font-size="16" fill="#6B8084">示意圖，依 ESGO/ESTRO/ESP 2023 指引與 EMBRACE-II 計畫書之劑量目標重繪｜Han 2024（SEER）</text>
  </g>
</svg>
