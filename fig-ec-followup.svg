<text x="106" y="820.18" font-size="13" fill="#345963">n=6,483）；60.3% 在下咽、85.3% 為低期別；同時性 48%、異</text>
<text x="106" y="838.64" font-size="13" fill="#345963">時性 52%。</text>
<text x="106" y="865.1" font-size="13" fill="#123641" font-weight="700">台灣兩中心（n=435，鱗癌根治手術後）：&lt;50 歲是唯一獨立</text>
<text x="106" y="883.3" font-size="13" fill="#123641" font-weight="700">因子（HR 4.13）；&lt;50 歲者累積發生率</text>
