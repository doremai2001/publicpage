<text x="536" y="995.5" font-size="13" fill="#6B8084">0.25–0.91）；戒菸在該分析未達顯著——不等於沒用</text>
<g filter="url(#sh)"><rect x="944" y="736.8" width="412" height="306.31" rx="18" fill="#FFFFFF"/></g>
