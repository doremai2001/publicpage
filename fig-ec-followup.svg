<text x="1098.21" y="937.72" font-size="13" fill="#123641" font-weight="800">20.3%</text>
<text x="966" y="963.72" font-size="13" fill="#345963" font-weight="700">預設標準</text>
<rect x="1029.04" y="951.72" width="248.96" height="16" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="1029.04" y="951.72" width="217.84" height="16" rx="4" fill="#9A9282" opacity="0.9"/>
<text x="1252.88" y="963.72" font-size="13" fill="#123641" font-weight="800">70%</text>
<text x="966" y="995.76" font-size="13" fill="#6B8084">PET 找復發：敏感度 96%、特異度 78%（8 篇統合 n=486）——</text>
<text x="966" y="1013.97" font-size="13" fill="#6B8084">幾乎不漏，但陽性要切片證實</text>
<text x="84" y="1069.12" font-size="14" fill="#6B8084" font-weight="600">復發多在兩年內，但五年後仍有可治療的復發被報告；「追蹤到五年就安全」不成立。第二原發的頭頸檢查有沒有改善存活，正向資料沒有；反向（口腔癌→食道篩檢）的台灣登記顯示篩檢組死亡較低（</text>
<text x="84" y="1089.41" font-size="14" fill="#6B8084" font-weight="600">aHR 0.80）。</text>
<text x="84" y="1135.71" font-size="16" fill="#6B8084">示意圖，依 ESMO 2022 食道癌指引（Obermannová）、Lou 2013（MSKCC 復發型態）、van de Ven 2019（頭頸第二原發統合）、Tsai 2025（台灣兩中心）、Wang 2016（台灣</text>
<text x="84" y="1159.71" font-size="16" fill="#6B8084">頭頸癌前瞻）、Katada 2016、Sakanaka 2026（JCOG0502＋0909 腫瘤標記）與 PET 復發統合分析重繪｜各研究族群、設計與終點不同，數字不可直接互比；追蹤間隔由你的團</text>
<text x="84" y="1183.71" font-size="16" fill="#6B8084">隊依風險調整</text>
