<text x="273.86" y="485.05" font-size="13" fill="#345963">症狀、營養（體重）、心理社會支持——ESMO 2022 [V, A]（V＝專家意見）</text>
<text x="106" y="527.88" font-size="13" fill="#5C77C4" font-weight="800">開過刀的人</text>
<rect x="273.86" y="516.2" width="815.49" height="14" rx="7" fill="#5C77C4" opacity="0.2"/>
<rect x="1089.35" y="516.2" width="228.34" height="14" rx="7" fill="#5C77C4" opacity="0.06"/>
<text x="681.61" y="527.88" font-size="12.5" fill="#123641" font-weight="600" text-anchor="middle">常規 CT（頻率依團隊）；內視鏡對無症狀局部復發價值有限</text>
<text x="273.86" y="553.25" font-size="13" fill="#345963">MSKCC 手術世代（n=1,147）：復發一半靠症狀發現、45% 靠常規 CT、追蹤內視鏡只抓到 1%；作者結論第 6 年後追蹤影像大概不必要</text>
<text x="106" y="596.08" font-size="13" fill="#00806B" font-weight="800">根治性化放療後完全反應</text>
<rect x="307.63" y="582.4" width="14" height="18" rx="4" fill="#00806B" opacity="0.9"/>
