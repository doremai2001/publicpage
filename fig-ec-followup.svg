<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1238" viewBox="0 0 1440 1238" role="img" aria-labelledby="t d">
  <title id="t">五年追蹤怎麼排：九成復發在兩年內，還有一個喉嚨</title>
  <desc id="d">示意圖：食道癌五年追蹤時程加頭頸部第二原發。上方時間軸：確診或治療結束到第 5 年，第 6 年後影像淡出。前兩年塗色標「約 90% 的復發在這兩年內（ESMO [V, A]）」；MSKCC 手術世代（n=1,147）復發率第 1 年每 100 人年 27 次、第 6 年 4 次，兩點之間為示意連線。四條軌道：每次回診（兩組都一樣）症狀、營養、心理社會支持，ESMO 2022 [V, A]，V 為專家意見；開過刀的人，MSKCC 世代復發一半靠症狀、45% 靠常規 CT、追蹤內視鏡只抓到 1%，作者結論第 6 年後影像大概不必要；根治性化放療後完全反應者，每 3 個月內視鏡加切片加 CT 以抓救援手術窗口，ESMO 2022 [IV, B]，指引未寫持續多久，圖畫到第 2 年，之後由團隊決定；頭頸部檢查，ESMO 2022 寫食道鱗癌病人應接受合格的頭頸部臨床檢查，頻率沒有來源、不標。下方三格：頭頸部第二原發 6.7%（12 篇日本統合 n=6,483，60.3% 下咽、85.3% 低期別），台灣兩中心（n=435）小於 50 歲是唯一獨立因子 HR 4.13，小於 50 歲者 3、5、10 年累積發生率 14.3%、22.1%、34.2%，反向台灣頭頸癌病人 21.9% 同時有食道病灶；Lugol 空白區 0 個、1 到 9 個、10 個以上者 2 年異時性食道加頭頸鱗癌合計 4.0%、10.0%、31.4%（Katada 2016，早期鱗癌 ESD 後 n=331），戒酒 aHR 0.47，戒菸在該分析未達顯著；腫瘤標記 SCC-Ag 與 CEA 在敏感度 60% 時特異度只有 19.6% 與 20.3%，未達預設 70%（JCOG0502 加 0909 合併 n=239），PET 找復發敏感度 96%、特異度 78%、陽性要切片。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="1238" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="86" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">FIVE-YEAR FOLLOW-UP — AND THE SECOND PRIMARY</text>
<text x="84" y="148" font-size="44" fill="#123641" font-weight="800" class="r">五年追蹤怎麼排：九成復發在兩年內，還有一個喉嚨</text>
<text x="84" y="194" font-size="21" fill="#527078">指引自己承認：除了要抓救援手術機會的人，沒有證據顯示規律追蹤能改善存活——所以圖上每一格都寫了它的證據等級與理由。</text>
<text x="84" y="224" font-size="21" fill="#527078">開過刀和只做化放療的人，追蹤長得不一樣；第二個癌常長在喉嚨。</text>
