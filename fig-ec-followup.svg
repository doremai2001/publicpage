<text x="966" y="801.72" font-size="13" fill="#345963">JCOG0502＋JCOG0909 合併（n=239，根治性化放療後密集</text>
<text x="966" y="820.18" font-size="13" fill="#345963">CT＋內視鏡追蹤）：SCC-Ag 與 CEA 在敏感度 ≥60% 時，最</text>
<text x="966" y="838.64" font-size="13" fill="#345963">高特異度只有 19.6%／20.3%，未達預設標準（敏感度 ≥60%</text>
<text x="966" y="857.1" font-size="13" fill="#345963">且特異度 ≥70%）。</text>
<text x="966" y="883.56" font-size="13" fill="#123641" font-weight="700">敏感度 60% 時的特異度</text>
<text x="966" y="911.72" font-size="13" fill="#345963" font-weight="700">SCC-Ag</text>
<rect x="1029.04" y="899.72" width="248.96" height="16" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="1029.04" y="899.72" width="61" height="16" rx="4" fill="#9A9282" opacity="0.9"/>
<text x="1096.04" y="911.72" font-size="13" fill="#123641" font-weight="800">19.6%</text>
<text x="966" y="937.72" font-size="13" fill="#345963" font-weight="700">CEA</text>
<rect x="1029.04" y="925.72" width="248.96" height="16" rx="4" fill="#DBD3BF" opacity="0.5"/>
