<rect x="616.37" y="584.4" width="472.99" height="14" rx="7" fill="#00806B" opacity="0.12"/>
<text x="852.86" y="596.08" font-size="12.5" fill="#123641" font-weight="600" text-anchor="middle">之後怎麼排：指引未定，由團隊決定</text>
<text x="273.86" y="621.45" font-size="13" fill="#345963">每 3 個月：內視鏡＋切片＋CT，目的是抓救援手術的窗口——ESMO 2022 [IV, B]（IV＝回溯世代）；指引沒寫持續多久，本圖畫到第 2 年，因九成復發在兩年內</text>
<text x="106" y="664.28" font-size="13" fill="#96790F" font-weight="800">頭頸部檢查（鱗癌）</text>
<rect x="273.86" y="652.6" width="1043.83" height="14" rx="7" fill="none" stroke="#96790F" stroke-width="2" stroke-dasharray="7 5"/>
<rect x="690.15" y="649.6" width="211.25" height="20" rx="6" fill="#FFFFFF"/>
<text x="795.78" y="664.28" font-size="12.5" fill="#96790F" font-weight="700" text-anchor="middle">持續：耳鼻喉科檢查；頻率無來源</text>
<text x="273.86" y="689.65" font-size="13" fill="#345963">ESMO 2022：食道鱗癌病人「應接受合格的頭頸部臨床檢查」以排除第二原發；頻率沒有來源，本圖不標</text>
