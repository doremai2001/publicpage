<text x="560" y="608.12" font-size="9.89" fill="#527078" text-anchor="end">(11.6–14.4), n=60</text>
<line x1="168" y1="634.12" x2="456" y2="634.12" stroke="#B9AE94" stroke-width="1.6" stroke-linecap="butt"/>
<line x1="168" y1="634.12" x2="168" y2="639.12" stroke="#B9AE94" stroke-width="1.6" stroke-linecap="round"/>
