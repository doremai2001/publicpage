<text x="312" y="654.12" font-size="9.89" fill="#527078" text-anchor="middle">16</text>
<line x1="384" y1="634.12" x2="384" y2="639.12" stroke="#B9AE94" stroke-width="1.6" stroke-linecap="round"/>
<text x="384" y="654.12" font-size="9.89" fill="#527078" text-anchor="middle">24</text>
<line x1="456" y1="634.12" x2="456" y2="639.12" stroke="#B9AE94" stroke-width="1.6" stroke-linecap="round"/>
<text x="456" y="654.12" font-size="9.89" fill="#527078" text-anchor="middle">32</text>
<text x="470" y="654.12" font-size="9.89" fill="#527078">months</text>
<text x="60" y="672.12" font-size="11.18" fill="#527078">In the unmethylated row the two confidence intervals overlap heavily: this trial cannot show</text>
<text x="60" y="688.46" font-size="11.18" fill="#527078">a difference.</text>
<line x1="310" y1="720.8" x2="310" y2="729.6" stroke="#C9A83E" stroke-width="3" stroke-linecap="round"/>
