<text x="60" y="815.8" font-size="14.62" fill="#123641" font-weight="800">Progression-free survival (median, months)</text>
<line x1="168" y1="841.58" x2="168" y2="845.58" stroke="#DBD3BF" stroke-width="1.4" stroke-linecap="round"/>
<line x1="240" y1="841.58" x2="240" y2="845.58" stroke="#DBD3BF" stroke-width="1.4" stroke-linecap="round"/>
