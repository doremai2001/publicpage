<text x="560" y="564.12" font-size="9.89" fill="#527078" text-anchor="end">(9.7–14.1), n=54</text>
<line x1="168" y1="594.12" x2="456" y2="594.12" stroke="#DBD3BF" stroke-width="1" stroke-linecap="butt" stroke-dasharray="3 5"/>
<text x="60" y="591.12" font-size="10.75" fill="#527078" font-weight="600">Radiotherapy plus</text>
<text x="60" y="606.12" font-size="10.75" fill="#527078" font-weight="600">temozolomide</text>
