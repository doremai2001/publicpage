<line x1="168" y1="885.58" x2="456" y2="885.58" stroke="#DBD3BF" stroke-width="1" stroke-linecap="butt" stroke-dasharray="3 5"/>
<text x="60" y="882.58" font-size="10.75" fill="#527078" font-weight="600">Radiotherapy</text>
<text x="60" y="897.58" font-size="10.75" fill="#527078" font-weight="600">alone</text>
<line x1="215.7" y1="885.58" x2="237.3" y2="885.58" stroke="#96790F" stroke-width="3.4" stroke-linecap="round"/>
<line x1="215.7" y1="878.58" x2="215.7" y2="892.58" stroke="#96790F" stroke-width="2.4" stroke-linecap="round"/>
<line x1="237.3" y1="878.58" x2="237.3" y2="892.58" stroke="#96790F" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="221.1" cy="885.58" r="7.5" fill="#96790F" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="560" y="883.58" font-size="16.34" fill="#96790F" font-weight="800" text-anchor="end">5.9</text>
<text x="560" y="899.58" font-size="9.89" fill="#527078" text-anchor="end">(5.3–7.7), n=46</text>
<line x1="168" y1="929.58" x2="456" y2="929.58" stroke="#DBD3BF" stroke-width="1" stroke-linecap="butt" stroke-dasharray="3 5"/>
<text x="60" y="926.58" font-size="10.75" fill="#527078" font-weight="600">Radiotherapy plus</text>
<text x="60" y="941.58" font-size="10.75" fill="#527078" font-weight="600">temozolomide</text>
<line x1="226.5" y1="929.58" x2="294" y2="929.58" stroke="#00806B" stroke-width="3.4" stroke-linecap="round"/>
<line x1="226.5" y1="922.58" x2="226.5" y2="936.58" stroke="#00806B" stroke-width="2.4" stroke-linecap="round"/>
<line x1="294" y1="922.58" x2="294" y2="936.58" stroke="#00806B" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="260.7" cy="929.58" r="7.5" fill="#00806B" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="560" y="927.58" font-size="16.34" fill="#00806B" font-weight="800" text-anchor="end">10.3</text>
<text x="560" y="943.58" font-size="9.89" fill="#527078" text-anchor="end">(6.5–14), n=46</text>
<line x1="168" y1="969.58" x2="456" y2="969.58" stroke="#B9AE94" stroke-width="1.6" stroke-linecap="butt"/>
<line x1="168" y1="969.58" x2="168" y2="974.58" stroke="#B9AE94" stroke-width="1.6" stroke-linecap="round"/>
<text x="168" y="989.58" font-size="9.89" fill="#527078" text-anchor="middle">0</text>
<line x1="240" y1="969.58" x2="240" y2="974.58" stroke="#B9AE94" stroke-width="1.6" stroke-linecap="round"/>
<text x="240" y="989.58" font-size="9.89" fill="#527078" text-anchor="middle">8</text>
<line x1="312" y1="969.58" x2="312" y2="974.58" stroke="#B9AE94" stroke-width="1.6" stroke-linecap="round"/>
<text x="312" y="989.58" font-size="9.89" fill="#527078" text-anchor="middle">16</text>
<line x1="384" y1="969.58" x2="384" y2="974.58" stroke="#B9AE94" stroke-width="1.6" stroke-linecap="round"/>
<text x="384" y="989.58" font-size="9.89" fill="#527078" text-anchor="middle">24</text>
<line x1="456" y1="969.58" x2="456" y2="974.58" stroke="#B9AE94" stroke-width="1.6" stroke-linecap="round"/>
<text x="456" y="989.58" font-size="9.89" fill="#527078" text-anchor="middle">32</text>
<text x="470" y="989.58" font-size="9.89" fill="#527078">months</text>
<text x="60" y="1007.58" font-size="11.18" fill="#527078">Only the unmethylated row is drawn here, because that is the row where the two endpoints</text>
<text x="60" y="1023.92" font-size="11.18" fill="#527078">disagree: the tumour coming back later is visible, the person living longer is not — not in this</text>
<text x="60" y="1040.26" font-size="11.18" fill="#527078">trial.</text>
<text x="40" y="1082.6" font-size="12.04" fill="#527078">These are groups of only fifty or sixty people, with wide confidence intervals. Not being able</text>
<text x="40" y="1099.8" font-size="12.04" fill="#527078">to show a difference is not the same as showing there is none.</text>
<rect x="40" y="1135.0" width="540" height="130.0400000000002" rx="16" fill="none" stroke="#C9A83E" stroke-width="2.5"/>
<text x="64" y="1165" font-size="15.48" fill="#123641" font-weight="800">And the comparison that would settle it has never been done</text>
<text x="64" y="1187.36" font-size="12.9" fill="#345963">The systematic review and meta-analysis (Alnahhas 2020) says it plainly: no</text>
<text x="64" y="1206.28" font-size="12.9" fill="#345963">study has ever prospectively randomised unmethylated patients between</text>
<text x="64" y="1225.2" font-size="12.9" fill="#345963">radiotherapy alone and radiotherapy plus temozolomide. So this box is not</text>
<text x="64" y="1244.12" font-size="12.9" fill="#345963">&quot;the evidence shows it does not work&quot; — it is &quot;nobody has run that trial&quot;.</text>
<g filter="url(#sh)">
<rect x="40" y="1285.0400000000002" width="540" height="302.1500000000001" rx="16" fill="#FFFFFF"/>
</g>
<text x="64" y="1315.04" font-size="13.76" fill="#123641" font-weight="800">In older patients there are direct randomised stratified data (Perry 2017,</text>
<text x="64" y="1333.96" font-size="13.76" fill="#123641" font-weight="800">aged 65 and over, n=562; both arms had 40 Gy in 15 fractions)</text>
<rect x="64" y="1358.88" width="492" height="74" rx="12" fill="#F3E8CD"/>
<text x="78" y="1382.88" font-size="13.5" fill="#527078" font-weight="700">Methylated (n=165)</text>
<text x="78" y="1406.88" font-size="19" fill="#00806B" font-weight="800">13.5 vs 7.7 months</text>
<text x="78" y="1424.88" font-size="12" fill="#345963">hazard ratio 0.53 (0.38 to 0.73), P &lt; 0.001</text>
<rect x="64" y="1440.88" width="492" height="74" rx="12" fill="#ECE8DE"/>
<text x="78" y="1464.88" font-size="13.5" fill="#527078" font-weight="700">Unmethylated (n=189)</text>
<text x="78" y="1488.88" font-size="19" fill="#96790F" font-weight="800">10.0 vs 7.9 months</text>
<text x="78" y="1506.88" font-size="12" fill="#345963">hazard ratio 0.75 (0.56 to 1.01), P = 0.055</text>
<text x="64" y="1530.88" font-size="11.61" fill="#527078">In plain words, a hazard ratio of 0.75 means that at any point during follow-up the risk</text>
<text x="64" y="1547.65" font-size="11.61" fill="#527078">of death in the arm that added the drug was about three-quarters of the risk in the arm</text>
<text x="64" y="1564.42" font-size="11.61" fill="#527078">that did not; but P = 0.055 means that gap did not reach statistical significance.</text>
<rect x="40" y="1605.1900000000003" width="540" height="154.6800000000003" rx="16" fill="#F6E2E0" stroke="#B04A4A" stroke-width="2.5"/>
<text x="64" y="1635.19" font-size="15.48" fill="#B04A4A" font-weight="800">This figure must not be read as &quot;unmethylated means you can</text>
<text x="64" y="1656.69" font-size="15.48" fill="#B04A4A" font-weight="800">skip the drug&quot;</text>
<text x="64" y="1682.19" font-size="12.9" fill="#345963" font-weight="600">Progression-free survival differs, overall survival cannot be shown to differ,</text>
<text x="64" y="1701.11" font-size="12.9" fill="#345963" font-weight="600">and nobody has run a randomised trial in this group — the three have to be</text>
<text x="64" y="1720.03" font-size="12.9" fill="#345963" font-weight="600">read together. Whether to use the drug is a conversation with your team, not a</text>
<text x="64" y="1738.95" font-size="12.9" fill="#345963" font-weight="600">decision to make at home; do not stop your own treatment.</text>
<text x="40" y="1777.87" font-size="14" fill="#527078">Schematic, redrawn from Hegi 2005 (the stratified analysis of EORTC</text>
<text x="40" y="1798.87" font-size="14" fill="#527078">26981-22981 / NCIC CE.3), Alnahhas 2020 and Perry 2017; the cohorts, designs</text>
<text x="40" y="1819.87" font-size="14" fill="#527078">and endpoints of the underlying studies differ, so the data points must not be</text>
<text x="40" y="1840.87" font-size="14" fill="#527078">compared directly.</text>
  </g>
</svg>
