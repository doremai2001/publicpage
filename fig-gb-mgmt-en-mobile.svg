<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1863" viewBox="0 0 620 1863" role="img" aria-labelledby="t d">
  <title id="t">MGMT methylated versus unmethylated: overall survival and progression-free survival side by side</title>
  <desc id="d">Schematic on MGMT methylation status and temozolomide, with overall survival and progression-free survival drawn as two panels side by side on the same scale in months. The left panel gives median overall survival. In the MGMT methylated group: radiotherapy alone 15.3 months (95 per cent confidence interval 13.0 to 20.9), radiotherapy plus temozolomide 21.7 months (17.4 to 30.4), P value 0.007. In the MGMT unmethylated group: radiotherapy alone 11.8 months (9.7 to 14.1), n=54; radiotherapy plus temozolomide 12.7 months (11.6 to 14.4), n=60 — the two confidence intervals overlap heavily and this trial cannot show a difference. The right panel gives median progression-free survival and draws only the unmethylated row: radiotherapy alone 5.9 months (5.3 to 7.7), n=46; radiotherapy plus temozolomide 10.3 months (6.5 to 14), n=46. Between the panels a line reads: same patients, same trial, two endpoints, two answers; and beneath, in small type, that these are groups of only fifty or sixty people with wide confidence intervals, so not being able to show a difference is not the same as showing there is none. A further box states that the comparison which would settle it has never been done: the systematic review and meta-analysis (Alnahhas 2020) says plainly that no study has ever prospectively randomised unmethylated patients between radiotherapy alone and radiotherapy plus temozolomide, so this box is not the evidence shows it does not work but nobody has run that trial. Below that are the randomised stratified data in older patients (Perry 2017, aged 65 and over, n=562, both arms 40 Gy in 15 fractions): in the methylated stratum (n=165) 13.5 versus 7.7 months, hazard ratio 0.53 (0.38 to 0.73), P less than 0.001; in the unmethylated stratum (n=189) 10.0 versus 7.9 months, hazard ratio 0.75 (0.56 to 1.01), P equal to 0.055. In plain words a hazard ratio of 0.75 means the risk of death in the arm that added the drug was about three-quarters of the risk in the arm that did not, at any point during follow-up, but P equal to 0.055 means the gap did not reach statistical significance. The figure closes with a warning: it must not be read as unmethylated means you can skip the drug; progression-free survival differs, overall survival cannot be shown to differ, and nobody has run a randomised trial in this group, and the three have to be read together; whether to use the drug is a conversation with your team, and you should not stop your own treatment.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#B9AE94" stroke-width="2" opacity="0.55"/></pattern><pattern id="hatchR" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(135)"><line x1="0" y1="0" x2="0" y2="8" stroke="#B04A4A" stroke-width="2" opacity="0.45"/></pattern><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="620" height="1863" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="40" y="62" font-size="13" fill="#A98722" font-weight="800" letter-spacing="2.5px">MGMT: TWO ENDPOINTS, TWO ANSWERS</text>
<text x="40" y="108" font-size="27" fill="#123641" font-weight="800" class="r">In the unmethylated box, survival and</text>
<text x="40" y="141.48" font-size="27" fill="#123641" font-weight="800" class="r">progression-free survival say different</text>
<text x="40" y="174.96" font-size="27" fill="#123641" font-weight="800" class="r">things</text>
<text x="40" y="214.44" font-size="15.5" fill="#527078">The same patients, the same trial (EORTC 26981-22981 / NCIC CE.3) —</text>
<text x="40" y="236.91" font-size="15.5" fill="#527078">and two endpoints that do not agree.</text>
<text x="40" y="259.39" font-size="15.5" fill="#527078">Both panels use the same scale in months, so the lengths can be read</text>
<text x="40" y="281.87" font-size="15.5" fill="#527078">against each other; but the endpoints differ, and so does their meaning.</text>
<g filter="url(#sh)">
<rect x="40" y="320.34000000000003" width="540" height="392.46000000000004" rx="18" fill="#FFFFFF"/>
</g>
