<text x="62" y="1505.94" font-size="12" fill="#345963">JCOG0502＋JCOG0909 合併（n=239，根治性化放療後密集 CT＋內視鏡追蹤）：SCC-Ag</text>
<text x="62" y="1522.98" font-size="12" fill="#345963">與 CEA 在敏感度 ≥60% 時，最高特異度只有 19.6%／20.3%，未達預設標準（敏感度 ≥60%</text>
<text x="62" y="1540.02" font-size="12" fill="#345963">且特異度 ≥70%）。</text>
<text x="62" y="1565.06" font-size="12" fill="#123641" font-weight="700">敏感度 60% 時的特異度</text>
<text x="62" y="1592.65" font-size="12" fill="#345963" font-weight="700">SCC-Ag</text>
<rect x="120.96" y="1580.65" width="381.04" height="16" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="120.96" y="1580.65" width="93.35" height="16" rx="4" fill="#9A9282" opacity="0.9"/>
<text x="220.31" y="1592.65" font-size="12" fill="#123641" font-weight="800">19.6%</text>
<text x="62" y="1618.65" font-size="12" fill="#345963" font-weight="700">CEA</text>
<rect x="120.96" y="1606.65" width="381.04" height="16" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="120.96" y="1606.65" width="96.69" height="16" rx="4" fill="#9A9282" opacity="0.9"/>
<text x="223.65" y="1618.65" font-size="12" fill="#123641" font-weight="800">20.3%</text>
<text x="62" y="1644.65" font-size="12" fill="#345963" font-weight="700">預設標準</text>
<rect x="120.96" y="1632.65" width="381.04" height="16" rx="4" fill="#DBD3BF" opacity="0.5"/>
<rect x="120.96" y="1632.65" width="333.41" height="16" rx="4" fill="#9A9282" opacity="0.9"/>
<text x="460.37" y="1644.65" font-size="12" fill="#123641" font-weight="800">70%</text>
<text x="62" y="1675.86" font-size="12" fill="#6B8084">PET 找復發：敏感度 96%、特異度 78%（8 篇統合 n=486）——幾乎不漏，但陽性要切片證實</text>
<text x="44" y="1724.96" font-size="12.5" fill="#6B8084" font-weight="600">復發多在兩年內，但五年後仍有可治療的復發被報告；「追蹤到五年就安全」不成立。第二原發</text>
<text x="44" y="1743.08" font-size="12.5" fill="#6B8084" font-weight="600">的頭頸檢查有沒有改善存活，正向資料沒有；反向（口腔癌→食道篩檢）的台灣登記顯示篩檢組</text>
<text x="44" y="1761.21" font-size="12.5" fill="#6B8084" font-weight="600">死亡較低（aHR 0.80）。</text>
<text x="44" y="1801.33" font-size="12" fill="#6B8084">示意圖，依 ESMO 2022 食道癌指引（Obermannová）、Lou 2013（MSKCC 復發型態）、van de</text>
<text x="44" y="1819.33" font-size="12" fill="#6B8084">Ven 2019（頭頸第二原發統合）、Tsai 2025（台灣兩中心）、Wang 2016（台灣頭頸癌前瞻）、</text>
<text x="44" y="1837.33" font-size="12" fill="#6B8084">Katada 2016、Sakanaka 2026（JCOG0502＋0909 腫瘤標記）與 PET 復發統合分析重繪｜各研究</text>
<text x="44" y="1855.33" font-size="12" fill="#6B8084">族群、設計與終點不同，數字不可直接互比；追蹤間隔由你的團隊依風險調整</text>
