<text x="252.77" y="588.12" font-size="11.5" fill="#123641" font-weight="600" text-anchor="middle">常規 CT（頻率依團隊）；內視鏡對無症狀局部復發價值有限</text>
<text x="62" y="621" font-size="12" fill="#345963">MSKCC 手術世代（n=1,147）：復發一半靠症狀發現、45% 靠常規 CT、追蹤內視鏡只抓到</text>
<text x="62" y="637.8" font-size="12" fill="#345963">1%；作者結論第 6 年後追蹤影像大概不必要</text>
<text x="62" y="670.4" font-size="12" fill="#00806B" font-weight="800">根治性化放療後完全反應</text>
<rect x="74.08" y="684.4" width="14" height="18" rx="4" fill="#00806B" opacity="0.9"/>
