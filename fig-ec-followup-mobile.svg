<text x="62" y="528.2" font-size="12" fill="#345963">症狀、營養（體重）、心理社會支持——ESMO 2022 [V, A]（V＝專家意見）</text>
<text x="62" y="560.8" font-size="12" fill="#5C77C4" font-weight="800">開過刀的人</text>
