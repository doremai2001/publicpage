<text x="62" y="955.93" font-size="12" fill="#345963">食道鱗癌病人 6.7% 會有頭頸部第二原發（12 篇統合、全日本、n=6,483）；60.3% 在下咽、</text>
<text x="62" y="972.97" font-size="12" fill="#345963">85.3% 為低期別；同時性 48%、異時性 52%。</text>
<text x="62" y="998.01" font-size="12" fill="#123641" font-weight="700">台灣兩中心（n=435，鱗癌根治手術後）：&lt;50 歲是唯一獨立因子（HR 4.13）；&lt;50 歲者</text>
