<text x="424.13" y="1361.01" font-size="12" fill="#123641" font-weight="800">31.4%</text>
<text x="62" y="1392.21" font-size="12" fill="#6B8084">同一研究：戒酒使多發鱗癌風險減半（aHR 0.47，95% CI 0.25–0.91）；戒菸在該分析未達</text>
<text x="62" y="1409.01" font-size="12" fill="#6B8084">顯著——不等於沒用</text>
