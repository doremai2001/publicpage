<text x="332.89" y="697.72" font-size="11.5" fill="#123641" font-weight="600" text-anchor="middle">之後怎麼排：指引未定，由團隊決定</text>
<text x="62" y="730.6" font-size="12" fill="#345963">每 3 個月：內視鏡＋切片＋CT，目的是抓救援手術的窗口——ESMO 2022 [IV, B]（IV＝回</text>
<text x="62" y="747.4" font-size="12" fill="#345963">溯世代）；指引沒寫持續多久，本圖畫到第 2 年，因九成復發在兩年內</text>
<text x="62" y="780" font-size="12" fill="#96790F" font-weight="800">頭頸部檢查（鱗癌）</text>
<rect x="62" y="796" width="488.37" height="14" rx="7" fill="none" stroke="#96790F" stroke-width="2" stroke-dasharray="7 5"/>
