<text x="215.43" y="1335.01" font-size="12" fill="#123641" font-weight="800">10%</text>
<text x="62" y="1361.01" font-size="12" fill="#345963" font-weight="700">≥10 個</text>
<rect x="111.91" y="1349.01" width="390.09" height="16" rx="4" fill="#DBD3BF" opacity="0.5"/>
