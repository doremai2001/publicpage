<text x="62" y="840.2" font-size="12" fill="#345963">ESMO 2022：食道鱗癌病人「應接受合格的頭頸部臨床檢查」以排除第二原發；頻率沒有來</text>
<text x="62" y="857" font-size="12" fill="#345963">源，本圖不標</text>
