<text x="1105.9" y="570.66" font-size="15.5" fill="#5C77C4" font-weight="800" text-anchor="start">6.7</text>
<circle cx="1155.14" cy="629.16" r="8.5" fill="#5C77C4" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="1172.64" y="634.66" font-size="15.5" fill="#5C77C4" font-weight="800" text-anchor="start">5.1</text>
<circle cx="654.57" cy="609.16" r="8.5" fill="#5C77C4" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="672.07" y="614.66" font-size="15.5" fill="#5C77C4" font-weight="800" text-anchor="start">5.6</text>
<circle cx="1155.14" cy="593.16" r="8.5" fill="#5C77C4" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="1172.64" y="598.66" font-size="15.5" fill="#5C77C4" font-weight="800" text-anchor="start">6.0</text>
<circle cx="487.71" cy="533.16" r="8.5" fill="#5C77C4" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="505.21" y="538.66" font-size="15.5" fill="#5C77C4" font-weight="800" text-anchor="start">7.5</text>
<circle cx="154" cy="501.16" r="8.5" fill="#96790F" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="171.5" y="506.66" font-size="15.5" fill="#96790F" font-weight="800" text-anchor="start">8.3</text>
<circle cx="654.57" cy="577.16" r="8.5" fill="#5C77C4" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="637.07" y="582.66" font-size="15.5" fill="#5C77C4" font-weight="800" text-anchor="end">6.4</text>
<circle cx="320.86" cy="517.16" r="8.5" fill="#5C77C4" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="338.36" y="522.66" font-size="15.5" fill="#5C77C4" font-weight="800" text-anchor="start">7.9</text>
<circle cx="654.57" cy="529.16" r="12" fill="#5C77C4" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="633.57" y="534.66" font-size="15.5" fill="#5C77C4" font-weight="800" text-anchor="end">7.6</text>
<circle cx="654.57" cy="461.16" r="12" fill="#00806B" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="675.57" y="466.66" font-size="15.5" fill="#00806B" font-weight="800" text-anchor="start">9.3</text>
<text x="1088.4" y="525.16" font-size="15" fill="#123641" font-weight="800" text-anchor="middle">Keime-Guibert 2007</text>
<text x="1088.4" y="543.16" font-size="12.5" fill="#527078" font-weight="600" text-anchor="middle">50 Gy / 28 fr</text>
<text x="668.57" y="643.16" font-size="15" fill="#123641" font-weight="800" text-anchor="start">Roa 2004</text>
<text x="168" y="461.16" font-size="15" fill="#123641" font-weight="800" text-anchor="start">Nordic 2012</text>
<text x="334.86" y="477.16" font-size="15" fill="#123641" font-weight="800" text-anchor="start">Roa 2015</text>
<text x="668.57" y="421.16" font-size="15" fill="#123641" font-weight="800" text-anchor="start">Perry 2017</text>
<text x="84" y="933.16" font-size="14" fill="#123641" font-weight="800">Keime-Guibert 2007</text>
<text x="228.12" y="933.16" font-size="12.5" fill="#527078">aged 70 and over, KPS 70 or more, n=81</text>
<text x="84" y="951.16" font-size="12.5" fill="#527078">hazard ratio 0.47 (0.29 to 0.76), P = 0.002; reported in weeks (29.1 vs 16.9), converted to months here</text>
<text x="732" y="933.16" font-size="14" fill="#123641" font-weight="800">Roa 2004</text>
<text x="804.02" y="933.16" font-size="12.5" fill="#527078">aged 60 and over, n=100</text>
<text x="732" y="951.16" font-size="12.5" fill="#527078">P = .57, no difference shown</text>
<text x="84" y="977.16" font-size="14" fill="#123641" font-weight="800">Nordic 2012</text>
<text x="176.18" y="977.16" font-size="12.5" fill="#527078">aged 60 and over, three randomised arms</text>
<text x="84" y="995.16" font-size="12.5" fill="#527078">temozolomide alone versus standard radiotherapy, hazard ratio 0.70 (0.52 to 0.93), p = 0.01</text>
<text x="732" y="977.16" font-size="14" fill="#123641" font-weight="800">Roa 2015</text>
<text x="804.02" y="977.16" font-size="12.5" fill="#527078">elderly or frail, n=98; median follow-up only 6.3 months</text>
<text x="732" y="995.16" font-size="12.5" fill="#527078">P = .988, no difference shown</text>
<text x="84" y="1021.16" font-size="14" fill="#123641" font-weight="800">Perry 2017</text>
<text x="171.98" y="1021.16" font-size="12.5" fill="#527078">aged 65 and over, n=562; both arms had 40 Gy in 15 fractions</text>
<text x="84" y="1039.16" font-size="12.5" fill="#527078">hazard ratio 0.67 (0.56 to 0.80), P &lt; 0.001</text>
<text x="84" y="1071.16" font-size="14.5" fill="#00806B" font-weight="700">The one that had to come first: Keime-Guibert randomised patients to no radiotherapy as well, and the answer was that radiotherapy helps. Only with that established does the</text>
<text x="84" y="1092.16" font-size="14.5" fill="#00806B" font-weight="700">question of shortening arise.</text>
<rect x="84.0" y="1133.1599999999999" width="624.0" height="138.0" rx="14" fill="none" stroke="#C9A83E" stroke-width="2.5"/>
<text x="102" y="1161.16" font-size="15.5" fill="#8F7418" font-weight="800">The MGMT strata in Perry 2017 (the second layer, and it matters)</text>
<text x="102" y="1187.16" font-size="14" fill="#345963">Methylated (n=165): 13.5 versus 7.7 months, hazard ratio 0.53 (0.38 to 0.73), P &lt; 0.001.</text>
<text x="102" y="1207.66" font-size="14" fill="#345963">Unmethylated (n=189): 10.0 versus 7.9 months, hazard ratio 0.75 (0.56 to 1.01), P =</text>
<text x="102" y="1228.16" font-size="14" fill="#345963">0.055 — which did not reach statistical significance. Adding the drug is not the same</text>
<text x="102" y="1248.66" font-size="14" fill="#345963">size of effect in the two strata.</text>
<rect x="732.0" y="1133.1599999999999" width="624.0" height="117.5" rx="14" fill="none" stroke="#C9A83E" stroke-width="2.5"/>
<text x="750" y="1161.16" font-size="15.5" fill="#8F7418" font-weight="800">The steroids in Roa 2004 (the difference is not only in survival)</text>
<text x="750" y="1187.16" font-size="14" fill="#345963">Patients needing an increase in steroid dose: 49% in the 60 Gy in 30 fractions arm, 23%</text>
<text x="750" y="1207.66" font-size="14" fill="#345963">in the 40 Gy in 15 fractions arm (chi-squared P = .02). Survival showed no difference</text>
<text x="750" y="1228.16" font-size="14" fill="#345963">(P = .57) — the difference showed up here instead.</text>
<rect x="84" y="1289.1599999999999" width="1272" height="127.0" rx="16" fill="#F6E2E0" stroke="#B04A4A" stroke-width="2.5"/>
<text x="108" y="1319.16" font-size="18" fill="#B04A4A" font-weight="800">What decides this is performance status, not the year on the birth certificate</text>
<text x="108" y="1348.16" font-size="15" fill="#345963" font-weight="600">The non-inferiority of the short course applies to glioblastoma patients aged 60 and over; it cannot be turned into &quot;old means shorten it&quot;. And people with poor</text>
<text x="108" y="1370.16" font-size="15" fill="#345963" font-weight="600">performance status, largely bedbound, have been excluded from almost every randomised trial; in that group no randomised trial has ever compared best supportive</text>
<text x="108" y="1392.16" font-size="15" fill="#345963" font-weight="600">care with active radiotherapy or chemotherapy — the conversation there is a different one.</text>
<text x="84" y="1438.16" font-size="16" fill="#527078">Schematic, redrawn from Keime-Guibert 2007, Roa 2004, Malmström 2012 (Nordic), Roa 2015 and Perry 2017; the cohorts, designs and endpoints of the underlying</text>
<text x="84" y="1462.16" font-size="16" fill="#527078">studies differ, so the data points must not be compared directly.</text>
  </g>
