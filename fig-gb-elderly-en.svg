<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1488" viewBox="0 0 1440 1488" role="img" aria-labelledby="t d">
  <title id="t">Five randomised trials in older glioblastoma patients: length of course against median survival</title>
  <desc id="d">Schematic scatter plot placing five randomised trials in older glioblastoma patients on one pair of axes: length of the course in weeks on the horizontal axis, median survival in months on the vertical axis. Keime-Guibert 2007 (aged 70 and over, KPS 70 or more, n=81): supportive care alone 16.9 weeks (about 3.9 months) versus supportive care plus 50 Gy in 28 fractions 29.1 weeks (about 6.7 months), hazard ratio 0.47 (0.29 to 0.76), P = 0.002; the paper reports weeks, converted to months here. Roa 2004 (aged 60 and over, n=100): 60 Gy in 30 fractions 5.1 months versus 40 Gy in 15 fractions 5.6 months, P = .57, no difference shown. Nordic 2012 (aged 60 and over, three randomised arms): 60 Gy in 30 fractions 6.0 months, 34 Gy in 10 fractions 7.5 months, temozolomide alone without radiotherapy 8.3 months; temozolomide versus standard radiotherapy hazard ratio 0.70 (0.52 to 0.93), p = 0.01. Roa 2015 (elderly or frail, n=98, median follow-up only 6.3 months): 40 Gy in 15 fractions 6.4 months versus 25 Gy in 5 fractions 7.9 months, P = .988, no difference shown. Perry 2017 (aged 65 and over, n=562, both arms 40 Gy in 15 fractions, drawn with the heaviest markers): radiotherapy alone 7.6 months versus radiotherapy plus temozolomide 9.3 months, hazard ratio 0.67 (0.56 to 0.80), P &lt; 0.001. Two annotations are required on the figure. First, the MGMT strata of Perry: methylated (n=165) 13.5 versus 7.7 months, hazard ratio 0.53 (0.38 to 0.73), P &lt; 0.001; unmethylated (n=189) 10.0 versus 7.9 months, hazard ratio 0.75 (0.56 to 1.01), P = 0.055, which did not reach statistical significance. Second, the steroids in Roa 2004: 49 per cent of the 60 Gy in 30 fractions arm needed an increase in steroid dose versus 23 per cent of the 40 Gy in 15 fractions arm (chi-squared P = .02), while survival showed no difference (P = .57). The caption line reads: the course gets shorter and the survival does not fall, and that is what it can be shortened means. The closing warning: what decides this is performance status, not the year on the birth certificate; the non-inferiority of the short course applies to glioblastoma patients aged 60 and over and cannot be turned into old means shorten it; and people with poor performance status, largely bedbound, have been excluded from almost every randomised trial, so that in that group no randomised trial has ever compared best supportive care with active radiotherapy or chemotherapy.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#B9AE94" stroke-width="2" opacity="0.55"/></pattern><pattern id="hatchR" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(135)"><line x1="0" y1="0" x2="0" y2="8" stroke="#B04A4A" stroke-width="2" opacity="0.45"/></pattern><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="1488" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="86" font-size="18" fill="#A98722" font-weight="800" letter-spacing="4px">FIVE RANDOMISED TRIALS IN OLDER PATIENTS</text>
<text x="84" y="148" font-size="42" fill="#123641" font-weight="800" class="r">What most people are offered today is a short course of</text>
<text x="84" y="200.08" font-size="42" fill="#123641" font-weight="800" class="r">radiotherapy plus the drug</text>
<text x="84" y="258.16" font-size="20" fill="#527078">The horizontal axis is the length of the course in weeks; the vertical axis is median survival in months. The course gets shorter</text>
<text x="84" y="287.16" font-size="20" fill="#527078">and the survival does not fall — that is what &quot;it can be shortened&quot; means.</text>
<text x="84" y="316.16" font-size="20" fill="#527078">The five trials differ in entry criteria, era and endpoints, so the points must not be joined up across trials.</text>
<circle cx="92" cy="374.16" r="7.5" fill="#7A6E58"/>
<text x="106" y="379.16" font-size="13.5" fill="#345963" font-weight="600">Supportive care alone</text>
<circle cx="284.99" cy="374.16" r="7.5" fill="#5C77C4"/>
<text x="298.99" y="379.16" font-size="13.5" fill="#345963" font-weight="600">Radiotherapy alone</text>
<circle cx="458.81" cy="374.16" r="7.5" fill="#00806B"/>
<text x="472.81" y="379.16" font-size="13.5" fill="#345963" font-weight="600">Radiotherapy plus temozolomide</text>
<circle cx="719.57" cy="374.16" r="7.5" fill="#96790F"/>
<text x="733.57" y="379.16" font-size="13.5" fill="#345963" font-weight="600">Temozolomide alone</text>
<g filter="url(#sh)">
