<text x="1155.14" y="873.16" font-size="11.5" fill="#527078" text-anchor="middle">60 Gy / 30 fr</text>
<line x1="1322" y1="433.16" x2="1322" y2="833.16" stroke="#DBD3BF" stroke-width="1.2" stroke-linecap="round"/>
<text x="1322" y="855.16" font-size="12.5" fill="#527078" font-weight="700" text-anchor="middle">7 wk</text>
<text x="144" y="421.16" font-size="12.5" fill="#527078">Median survival (months)</text>
<text x="1322" y="895.16" font-size="12.5" fill="#527078" text-anchor="end">Length of the course (weeks)</text>
