<line x1="654.57" y1="433.16" x2="654.57" y2="833.16" stroke="#DBD3BF" stroke-width="1.2" stroke-linecap="round"/>
<text x="654.57" y="855.16" font-size="12.5" fill="#527078" font-weight="700" text-anchor="middle">3 wk</text>
<text x="654.57" y="873.16" font-size="11.5" fill="#527078" text-anchor="middle">40 Gy / 15 fr</text>
<line x1="821.43" y1="433.16" x2="821.43" y2="833.16" stroke="#DBD3BF" stroke-width="1.2" stroke-linecap="round"/>
<text x="821.43" y="855.16" font-size="12.5" fill="#527078" font-weight="700" text-anchor="middle">4 wk</text>
