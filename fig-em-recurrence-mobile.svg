<text x="58" y="1122" font-size="17" fill="#FFFFFF" font-weight="800">陰道／陰道頂端孤立復發，先前沒照過放療</text>
<text x="58" y="1158" font-size="14" fill="#527078" font-weight="700">族群標籤：GOG-0238，n=165 隨機（這一格唯一的隨機試驗）；82% 是低惡性度</text>
<text x="58" y="1178" font-size="14" fill="#527078" font-weight="700">（第 1 或 2 級）類內膜、86% 的復發侷限在陰道。</text>
