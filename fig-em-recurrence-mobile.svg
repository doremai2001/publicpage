<text x="86" y="839" font-size="14.5" fill="#527078">做過輔助陰道近接治療的 960 人裡，孤立陰道復發 19 人，一樣是 2%。</text>
<circle cx="72" cy="871" r="3.5" fill="#B9AE94"/>
<text x="86" y="876" font-size="14.5" fill="#527078">時間上：孤立陰道復發中位 11 個月，陰道以外 20 個月。</text>
<rect x="66" y="913" width="488" height="99" rx="14" fill="#ECE8DE"/>
<text x="82" y="933" font-size="15.5" fill="#345963" font-weight="600">這組數字兩個方向都要讀：多數第 1 期的人不會復發；而「陰道頂</text>
<text x="82" y="956" font-size="15.5" fill="#345963" font-weight="600">端復發、還救得回來」那一格雖然是真的，卻只佔第 1 期病人的</text>
<text x="82" y="979" font-size="15.5" fill="#345963" font-weight="600">2%——它不是復發的典型樣貌，是復發裡條件最有利的一種。</text>
<text x="40" y="1056" font-size="20" fill="#123641" font-weight="800" class="r">三種位置各自的分母與救援路徑（照過放療的區域另立一格）</text>
