<text x="70" y="1475" font-size="14.5" fill="#B04A4A" font-weight="700">同一份資料裡，非類內膜組織型的復發風險是 12.5 倍；日本 43 人的救援近</text>
<text x="70" y="1496" font-size="14.5" fill="#B04A4A" font-weight="700">接治療系列裡，原發手術時分化度第 1 到 2 級對第 3 級的 5 年整體存活</text>
<text x="70" y="1517" font-size="14.5" fill="#B04A4A" font-weight="700">96% 對 40%、無惡化存活 58% 對 0%。73% 屬於那個特定族群，不能借給別</text>
