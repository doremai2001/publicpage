<text x="70" y="1793" font-size="14.5" fill="#123641" font-weight="700">骨盆廓清術是這時候最重的選項：COREPEX 登錄收 862 位婦癌病人（含子</text>
<text x="70" y="1814" font-size="14.5" fill="#123641" font-weight="700">宮內膜癌），676 人（78.4%）切緣無腫瘤；依預後分數分四組，5 年無疾病</text>
