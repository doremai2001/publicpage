<text x="58" y="2417" font-size="17" fill="#FFFFFF" font-weight="800">遠端轉移／播散性復發</text>
<text x="58" y="2453" font-size="14" fill="#527078" font-weight="700">這一格不放療效數字——那兩條路各有多少效果，數字在另外兩篇，這裡只標位置。</text>
<rect x="58" y="2487" width="3" height="46" rx="1.5" fill="#527078" opacity="0.7"/>
<text x="70" y="2499" font-size="14.5" fill="#527078">指引把 1 到 5 顆、分布在最多 3 個部位的轉移定義成寡轉移，可考慮手術、</text>
<text x="70" y="2520" font-size="14.5" fill="#527078">根治性放療（含立體定位放療）或局部消融（IV, B）。</text>
<rect x="58" y="2555" width="3" height="67" rx="1.5" fill="#527078" opacity="0.7"/>
<text x="70" y="2567" font-size="14.5" fill="#527078">播散性復發的第一線分成兩條路（都是 I, A）：MMR 缺損的人是化療併用</text>
<text x="70" y="2588" font-size="14.5" fill="#527078">免疫檢查點抑制劑再接續維持；非 MMR 缺損而且進展快或有症狀的人是</text>
<text x="70" y="2609" font-size="14.5" fill="#527078">carboplatin 加 paclitaxel。</text>
<line x1="58" y1="2650" x2="76.64" y2="2650" stroke="#5C77C4" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="84,2650 76.7,2653.26 76.7,2646.74" fill="#5C77C4"/>
<text x="94" y="2655" font-size="15" fill="#5C77C4" font-weight="800">〈免疫治療，誰真的有效〉</text>
<line x1="58" y1="2697" x2="76.64" y2="2697" stroke="#5C77C4" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="84,2697 76.7,2700.26 76.7,2693.74" fill="#5C77C4"/>
<text x="94" y="2702" font-size="15" fill="#5C77C4" font-weight="800">〈要不要加化療，加了換到什麼〉</text>
<text x="44" y="2784" font-size="14.5" fill="#7A6E58" font-weight="700">標了「歷史對照」的每一筆都來自 PORTEC-1：1990 年代的試驗、沒有影像導引</text>
<text x="44" y="2805" font-size="14.5" fill="#7A6E58" font-weight="700">近接治療的年代，只能當歷史對照，不能當今天的療效預期。</text>
<rect x="40" y="2842" width="540" height="366" rx="16" fill="#F6E2E0" stroke="#B04A4A" stroke-width="2.5"/>
<text x="66" y="2872" font-size="18" fill="#B04A4A" font-weight="800">這張圖要同時擋住兩種讀法</text>
<rect x="66" y="2898" width="488" height="129" rx="14" fill="#FFFFFF"/>
<text x="82" y="2928" font-size="16" fill="#B04A4A" font-weight="800">復發不等於末期</text>
<text x="82" y="2957" font-size="15" fill="#345963">低惡性度、類內膜、只在陰道、而且之前沒照過放療的復發，在唯一</text>
<text x="82" y="2979" font-size="15" fill="#345963">的隨機試驗裡 3 年有 73% 的人活著而且沒有惡化——單純放療就好，</text>
<text x="82" y="3001" font-size="15" fill="#345963">加化療反而更差、毒性更高。</text>
<rect x="66" y="3043" width="488" height="151" rx="14" fill="#FFFFFF"/>
<text x="82" y="3073" font-size="16" fill="#B04A4A" font-weight="800">也不是所有復發都救得回來</text>
<text x="82" y="3102" font-size="15" fill="#345963">骨盆復發後 3 年存活 8%（歷史對照）、照過放療者 19% 對未照過</text>
<text x="82" y="3124" font-size="15" fill="#345963">51%（歷史對照）；非類內膜組織型復發風險 12.5 倍、原發第 3 級</text>
<text x="82" y="3146" font-size="15" fill="#345963">的 5 年無惡化存活 0%；骨盆廓清術的 30 天死亡是 3.1%。每一格的</text>
<text x="82" y="3168" font-size="15" fill="#345963">分母都不一樣，不能互相借用。</text>
<text x="40" y="3232" font-size="16" fill="#527078">示意圖，依 Rios-Doria 2023、Klopp 2024（GOG-0238）、Creutzberg</text>
<text x="40" y="3256" font-size="16" fill="#527078">2003（PORTEC-1，歷史對照）、Alban 2021、Baek 2016、Ling 2019、</text>
<text x="40" y="3280" font-size="16" fill="#527078">Lee 2022、Bizzarri COREPEX 與 ESGO-ESTRO-ESP 2025 指引重繪，</text>
<text x="40" y="3304" font-size="16" fill="#527078">非擷取自原論文圖表；各研究族群、設計與終點不同，數點不可直接互比。</text>
  </g>
</svg>
