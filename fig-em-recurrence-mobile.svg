  <rect width="620" height="3334" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="40" y="74" font-size="17" fill="#A98722" font-weight="800" letter-spacing="2px">AFTER A RECURRENCE</text>
<text x="40" y="128" font-size="40" fill="#123641" font-weight="800" class="r">復發的是十分之一；條件最好</text>
<text x="40" y="178" font-size="40" fill="#123641" font-weight="800" class="r">的那一種，只佔 2%</text>
<text x="40" y="236" font-size="19" fill="#527078">上半是分母：第 1 期的人裡，多數不會復發；而「還救得回來」</text>
<text x="40" y="264" font-size="19" fill="#527078">那一格，是復發裡條件最有利的一種。</text>
<text x="40" y="292" font-size="19" fill="#527078">下半是三種位置各自的分母與救援路徑。你落在哪一格，是婦癌</text>
<text x="40" y="320" font-size="19" fill="#527078">科、放射腫瘤科加影像一起判的。</text>
<g filter="url(#sh)">
