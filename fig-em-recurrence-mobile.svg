<text x="70" y="2311" font-size="14.5" fill="#123641" font-weight="700">上腸道或膀胱毒性；波士頓 32 人，3 年與 5 年陰道控制 64% 與 56%，晚期</text>
<text x="70" y="2332" font-size="14.5" fill="#123641" font-weight="700">第 3 級毒性腸胃道 16%、泌尿道 13%、陰道 16%。</text>
