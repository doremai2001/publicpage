<text x="70" y="1882" font-size="14.5" fill="#B04A4A" font-weight="700">代價寫在同一格：嚴重早期術後併發症 225 人（26.1%）、30 天內死亡 27</text>
<text x="70" y="1903" font-size="14.5" fill="#B04A4A" font-weight="700">人（3.1%）、嚴重晚期併發症 87 人（10.1%）。落在哪一組，由切緣能不能</text>
<text x="70" y="1924" font-size="14.5" fill="#B04A4A" font-weight="700">乾淨、有沒有骨盆外病灶決定。</text>
