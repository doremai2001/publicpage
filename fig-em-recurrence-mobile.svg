<svg xmlns="http://www.w3.org/2000/svg" width="620" height="3334" viewBox="0 0 620 3334" role="img" aria-labelledby="t d">
  <title id="t">復發的三種位置：各自的分母，各自的救援路徑</title>
  <desc id="d">示意圖：子宮內膜癌復發的分母，與三種復發位置各自的救援路徑。上半是分母：FIGO 2009 版第 1 期、兩家中心 2009 到 2017 年的 2,815 人，其中 278 人復發、佔 10%，其餘 90% 沒有復發。把那 278 人再拆開（比例仍以全體 2,815 人為分母）：孤立陰道復發只有 61 人，佔全體的 2%；陰道以外的復發 217 人，佔全體的 8%。附註三條：那 61 位孤立陰道復發的人裡，42 人、也就是 69% 長在陰道頂端；做過輔助陰道近接治療的 960 人裡，孤立陰道復發 19 人，一樣是 2%；時間上孤立陰道復發中位 11 個月、陰道以外 20 個月。並標明這組數字兩個方向都要讀：多數第 1 期的人不會復發；而「陰道頂端復發、還救得回來」那一格雖然是真的，卻只佔第 1 期病人的 2%，它不是復發的典型樣貌，是復發裡條件最有利的一種。下半是四格。第一格，陰道或陰道頂端孤立復發、先前沒照過放療：族群標籤是 GOG-0238，n=165 隨機，這一格唯一的隨機試驗，82% 是低惡性度、也就是第 1 或 2 級類內膜，86% 的復發侷限在陰道；3 年無惡化存活單純放療 73%、化放療 62%，風險比 1.25（95% 信賴區間 0.75 到 2.07）；加化療在這個情境是失敗的介入，無惡化存活沒有變好、急性毒性反而更高；指引建議陰道頂端復發用骨盆外照射加腔內影像導引近接治療（IV, A），表淺病灶可只做腔內影像導引近接治療（IV, A）；單中心系列 Alban 2021 收 62 位第 1 到 2 期、先前未做輔助放療者，5 年陰道控制 82%、5 年整體存活 61%；但同一份資料裡非類內膜組織型的復發風險是 12.5 倍，日本 43 人的救援近接治療系列裡原發分化度第 1 到 2 級對第 3 級的 5 年整體存活是 96% 對 40%、無惡化存活 58% 對 0%，所以 73% 屬於那個特定族群，不能借給別人用。第二格，骨盆內與淋巴結復發：PORTEC-1（歷史對照）骨盆復發後 3 年存活 8%，作者明講骨盆復發與遠端轉移的存活沒有差別；骨盆廓清術是這時候最重的選項，COREPEX 登錄收 862 位婦癌病人，676 人、78.4% 切緣無腫瘤，依預後分數分四組，5 年無疾病存活 43.7% 到 8.0%；代價寫在同一格——嚴重早期術後併發症 225 人、26.1%，30 天內死亡 27 人、3.1%，嚴重晚期併發症 87 人、10.1%，落在哪一組由切緣能不能乾淨、有沒有骨盆外病灶決定。第三格，照過放療的區域：PORTEC-1（歷史對照）首次復發後 3 年存活，沒照過放療的對照組 51%、照過放療的那一組 19%，P 等於 0.004；指引寫先前只做過陰道近接治療者加外照射與影像導引近接治療加強（IV, C），做過骨盆外照射者要把分子型納入手術或系統性治療的決定、根治性手術只有在切緣乾淨、根治意圖、併發症可接受時才做（IV, A），手術不可行時有經驗的中心可考慮再照射（IV, C）；再照射的分母都很小——匹茲堡 22 人，3 年局部控制 65.8%、整體存活 68.1%，無第 3 級以上腸道或膀胱毒性；波士頓 32 人，3 年與 5 年陰道控制 64% 與 56%，晚期第 3 級毒性腸胃道 16%、泌尿道 13%、陰道 16%。第四格，遠端轉移與播散性復發：這一格不放任何療效數字。指引把 1 到 5 顆、分布在最多 3 個部位的轉移定義成寡轉移，可考慮手術、根治性放療（含立體定位放療）或局部消融（IV, B）；播散性復發的第一線分成兩條路，都是 I, A——MMR 缺損的人是化療併用免疫檢查點抑制劑再接續維持，非 MMR 缺損而且進展快或有症狀的人是 carboplatin 加 paclitaxel。這一格只畫兩個箭頭，指向〈免疫治療，誰真的有效〉與〈要不要加化療，加了換到什麼〉，數字在那兩篇。四格下方註明：標了歷史對照的每一筆都來自 PORTEC-1，1990 年代的試驗、沒有影像導引近接治療的年代，只能當歷史對照，不能當今天的療效預期。圖的最後是兩個方向的警語。左邊：復發不等於末期——低惡性度、類內膜、只在陰道、而且之前沒照過放療的復發，在唯一的隨機試驗裡 3 年有 73% 的人活著而且沒有惡化，單純放療就好，加化療反而更差、毒性更高。右邊：也不是所有復發都救得回來——骨盆復發後 3 年存活 8%、照過放療者 19% 對未照過 51%（都是歷史對照），非類內膜組織型復發風險 12.5 倍、原發第 3 級的 5 年無惡化存活 0%，骨盆廓清術的 30 天死亡是 3.1%；每一格的分母都不一樣，不能互相借用。</desc>
