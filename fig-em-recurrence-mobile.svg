<text x="70" y="1245" font-size="14.5" fill="#123641" font-weight="700">0.75 到 2.07）。</text>
<rect x="58" y="1280" width="3" height="25" rx="1.5" fill="#B04A4A" opacity="0.7"/>
<text x="70" y="1292" font-size="14.5" fill="#B04A4A" font-weight="700">加化療在這個情境是失敗的介入：無惡化存活沒有變好，急性毒性反而更高。</text>
<rect x="58" y="1327" width="3" height="46" rx="1.5" fill="#527078" opacity="0.7"/>
<text x="70" y="1339" font-size="14.5" fill="#527078">指引：陰道頂端復發用骨盆外照射加腔內影像導引近接治療（IV, A）；表淺</text>
<text x="70" y="1360" font-size="14.5" fill="#527078">病灶可只做腔內影像導引近接治療（IV, A）。</text>
<rect x="58" y="1395" width="3" height="46" rx="1.5" fill="#123641" opacity="0.7"/>
<text x="70" y="1407" font-size="14.5" fill="#123641" font-weight="700">單中心系列（Alban 2021，n=62，第 1 到 2 期、先前未做輔助放療）：5</text>
<text x="70" y="1428" font-size="14.5" fill="#123641" font-weight="700">年陰道控制 82%、5 年整體存活 61%。</text>
