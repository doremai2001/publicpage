<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1278" viewBox="0 0 620 1278" role="img" aria-labelledby="t d">
  <title id="t">局部控制與腫瘤大小：RFA 的效果隨大小下降</title>
  <desc id="d">示意圖：腫瘤每大 1 公分，RFA 局部失敗風險上升（HR 1.54），SBRT 看不出大小效應（HR 1.21，p=0.617）；2 公分以上，RFA 局部惡化風險是 SBRT 的 3.35 倍（Wahl 2016，回溯）。成對數點：Wahl 2 年免於局部惡化 RFA 80.2% 對 SBRT 83.8%；Xi 2025 隨機試驗（復發性單顆 5 公分以內）2 年局部無惡化存活 75.8% 對 92.7%；Yoon 2020 前瞻二期 SBRT 2 年局部控制 100%；HyTEC 合併 2 年 89%。整體存活看不出差別。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="620" height="1278" rx="30" fill="url(#bg)"/>
  <g class="z">
<text x="44" y="62" font-size="14" fill="#A98722" font-weight="800" letter-spacing="3.5px">LOCAL CONTROL × SIZE</text>
<text x="44" y="112" font-size="30" fill="#123641" font-weight="800" class="r">局部控制與腫瘤大小：</text>
<text x="44" y="152" font-size="30" fill="#123641" font-weight="800" class="r">RFA 隨大小下降</text>
<text x="44" y="194" font-size="14.5" fill="#527078">SBRT 看不出大小效應——這張圖談局部控制，</text>
<text x="44" y="216" font-size="14.5" fill="#527078">不談整體存活；各研究族群與終點不同，</text>
<text x="44" y="238" font-size="14.5" fill="#527078">數點不可直接互比。</text>
<line x1="44" y1="270" x2="70" y2="270" stroke="#96790F" stroke-width="5" stroke-linecap="round"/>
<text x="78" y="275" font-size="14" fill="#345963" font-weight="600">RFA</text>
<line x1="140" y1="270" x2="166" y2="270" stroke="#00806B" stroke-width="5" stroke-linecap="round"/>
<text x="174" y="275" font-size="14" fill="#345963" font-weight="600">SBRT</text>
<rect x="44" y="296" width="532" height="218" rx="16" fill="none" stroke="#C9A83E" stroke-width="2"/>
<text x="64" y="326" font-size="15.5" fill="#8F7418" font-weight="800">大小效應（Wahl 2016・回溯・不可手術）</text>
<text x="64" y="349" font-size="13.8" fill="#345963">腫瘤每大 1 公分，RFA 局部失敗風險 ×1.54</text>
<text x="64" y="372" font-size="13.8" fill="#345963">（p=0.006）；SBRT ×1.21（p=0.617，看不出）</text>
<text x="64" y="395" font-size="13.8" fill="#345963" font-weight="600">≥2 公分：RFA 局部惡化風險是 SBRT 的</text>
<text x="64" y="418" font-size="13.8" fill="#345963" font-weight="600">3.35 倍（HR 3.35，p=0.025）；可切除且超過</text>
<text x="64" y="441" font-size="13.8" fill="#345963" font-weight="600">2 公分——BCLC 建議優先考慮切除</text>
<text x="64" y="464" font-size="12.5" fill="#6B8084">位置：血管旁 RFA 局部失敗 48% 對 7%（Lu</text>
<text x="64" y="487" font-size="12.5" fill="#6B8084">2003）；門脈旁侵襲性復發 15%（Kang 2015）</text>
<g filter="url(#sh)"><rect x="44" y="536" width="532" height="444" rx="18" fill="#FFFFFF"/></g>
<line x1="80.0" y1="554" x2="80.0" y2="922" stroke="#DBD3BF" stroke-width="1"/>
<text x="80.0" y="944" font-size="12" fill="#6B8084" text-anchor="middle">50</text>
<line x1="174.4" y1="554" x2="174.4" y2="922" stroke="#DBD3BF" stroke-width="1"/>
<text x="174.4" y="944" font-size="12" fill="#6B8084" text-anchor="middle">60</text>
<line x1="268.8" y1="554" x2="268.8" y2="922" stroke="#DBD3BF" stroke-width="1"/>
<text x="268.8" y="944" font-size="12" fill="#6B8084" text-anchor="middle">70</text>
<line x1="363.2" y1="554" x2="363.2" y2="922" stroke="#DBD3BF" stroke-width="1"/>
<text x="363.2" y="944" font-size="12" fill="#6B8084" text-anchor="middle">80</text>
<line x1="457.6" y1="554" x2="457.6" y2="922" stroke="#DBD3BF" stroke-width="1"/>
<text x="457.6" y="944" font-size="12" fill="#6B8084" text-anchor="middle">90</text>
<line x1="552.0" y1="554" x2="552.0" y2="922" stroke="#DBD3BF" stroke-width="1"/>
<text x="552.0" y="944" font-size="12" fill="#6B8084" text-anchor="middle">100</text>
<text x="316" y="964" font-size="11.5" fill="#6B8084" text-anchor="middle">％（各研究自報，定義不同）</text>
<text x="64" y="574" font-size="14" fill="#123641" font-weight="800">Wahl 2016・回溯（美國・不可手術）</text>
<text x="64" y="593" font-size="12.5" fill="#6B8084">2 年免於局部惡化</text>
<line x1="365.1" y1="616" x2="399.1" y2="616" stroke="#B9AE94" stroke-width="2"/>
<circle cx="365.1" cy="616" r="7" fill="#96790F"/>
<circle cx="399.1" cy="616" r="7" fill="#00806B"/>
<text x="354.088" y="620.5" font-size="12.5" fill="#96790F" font-weight="800" text-anchor="end">80.2%</text>
<text x="410.07199999999995" y="620.5" font-size="12.5" fill="#00806B" font-weight="800">83.8%</text>
<text x="64" y="666" font-size="14" fill="#123641" font-weight="800">Xi 2025・隨機試驗（復發性單顆 ≤5 cm）</text>
<text x="64" y="685" font-size="12.5" fill="#6B8084">2 年局部無惡化存活（HR 0.45）</text>
<line x1="323.6" y1="708" x2="483.1" y2="708" stroke="#B9AE94" stroke-width="2"/>
<circle cx="323.6" cy="708" r="7" fill="#96790F"/>
<circle cx="483.1" cy="708" r="7" fill="#00806B"/>
<text x="312.55199999999996" y="712.5" font-size="12.5" fill="#96790F" font-weight="800" text-anchor="end">75.8%</text>
<text x="494.088" y="712.5" font-size="12.5" fill="#00806B" font-weight="800">92.7%</text>
<text x="64" y="758" font-size="14" fill="#123641" font-weight="800">Yoon 2020・前瞻二期（≤5 cm・單臂）</text>
<text x="64" y="777" font-size="12.5" fill="#6B8084">2 年局部控制（5 年 97.1%）</text>
<circle cx="552.0" cy="800" r="7" fill="#00806B"/>
<text x="541.0" y="804.5" font-size="12.5" fill="#00806B" font-weight="800" text-anchor="end">100%</text>
<text x="64" y="850" font-size="14" fill="#123641" font-weight="800">HyTEC 2021・合併分析（單臂）</text>
<text x="64" y="869" font-size="12.5" fill="#6B8084">2 年局部控制</text>
<circle cx="448.2" cy="892" r="7" fill="#00806B"/>
<text x="437.16" y="896.5" font-size="12.5" fill="#00806B" font-weight="800" text-anchor="end">89%</text>
<rect x="44" y="1002" width="532" height="190" rx="16" fill="none" stroke="#C9A83E" stroke-width="2"/>
<text x="64" y="1032" font-size="15" fill="#8F7418" font-weight="800">整體存活：看不出差別——不可讀成</text>
<text x="64" y="1054" font-size="15" fill="#8F7418" font-weight="800">「SBRT 全面較好」</text>
<text x="64" y="1076" font-size="13" fill="#345963">Wahl 2 年 OS 53% 對 46%（統計相當）；NCDB</text>
<text x="64" y="1098" font-size="13" fill="#345963">回溯偏 RFA（5 年 29.8% 對 19.3%，缺肝功能</text>
<text x="64" y="1120" font-size="13" fill="#345963">變數）；統合分析 3、5 年無差異。Kim 2020：</text>
<text x="64" y="1142" font-size="13" fill="#345963">SBRT 組基線更差（BCLC B–C 65% 對 16%），</text>
<text x="64" y="1164" font-size="13" fill="#345963">3 年局部復發仍較低（21.2% 對 27.9%）。</text>
<text x="44" y="1216" font-size="12" fill="#6B8084">示意圖，依 Wahl 2016、Xi 2025、Yoon 2020、Ohri 2021、</text>
<text x="44" y="1236" font-size="12" fill="#6B8084">Kim 2020、Lu 2003、Kang 2015 與 BCLC 2022 重繪｜</text>
<text x="44" y="1256" font-size="12" fill="#6B8084">各研究族群與終點不同，數點不可直接互比</text>
  </g>
</svg>
