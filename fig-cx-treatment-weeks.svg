<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="t d">
  <title id="t">五到六週的療程行事曆：終點線在哪裡</title>
  <desc id="d">示意圖：根治性化放療的行事曆。體外放療每週一到週五各一次、45 Gy 分 25 次約五週，配每日影像導引；每週一次 cisplatin 40 mg/m²，共 5–6 次；近接治療 3–4 次排在療程尾聲或結束後 1–2 週內完成，每次間隔至少 6–8 小時。總治療時間的三個錨點各自標註：ESGO 指引含近接不超過 7 週；EMBRACE-II 目標 50 天內（EMBRACE-I 有 21% 超過）；回溯資料顯示近接超過 56 天完成者骨盆復發 26% 對 9%。第四、五週最難受也最不能自行中斷——症狀要回報，由團隊處理與決定。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><pattern id="hz" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#96790F" stroke-width="2" opacity="0.55"/></pattern><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="940" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="86" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">THE 5–6 WEEK CALENDAR</text>
<text x="84" y="148" font-size="44" fill="#123641" font-weight="800" class="r">五到六週怎麼過：每天很短，總時間很硬</text>
<text x="84" y="194" font-size="21" fill="#527078">體外放療每天幾分鐘、週一到週五；每週一天化療；最後的關鍵幾天是近接。</text>
<text x="84" y="224" font-size="21" fill="#527078">唯一不能讓步的，是「總治療時間」這條終點線。</text>
<text x="254" y="308" font-size="15.5" fill="#6B8084" font-weight="700" text-anchor="middle">一</text>
<text x="350" y="308" font-size="15.5" fill="#6B8084" font-weight="700" text-anchor="middle">二</text>
<text x="446" y="308" font-size="15.5" fill="#6B8084" font-weight="700" text-anchor="middle">三</text>
<text x="542" y="308" font-size="15.5" fill="#6B8084" font-weight="700" text-anchor="middle">四</text>
<text x="638" y="308" font-size="15.5" fill="#6B8084" font-weight="700" text-anchor="middle">五</text>
<text x="192" y="352" font-size="15.5" fill="#345963" font-weight="700" text-anchor="end">第 1 週</text>
<rect x="213" y="323" width="86" height="42" rx="8" fill="#5C77C4" opacity="0.85"/>
<circle cx="256" cy="344" r="7" fill="#C9A83E" stroke="#8F7418" stroke-width="1.5"/>
