<rect x="597" y="539" width="86" height="42" rx="8" fill="#5C77C4" opacity="0.85"/>
<rect x="597" y="539" width="86" height="42" rx="8" fill="#00806B"/>
<text x="192" y="622" font-size="15.5" fill="#345963" font-weight="700" text-anchor="end">第 6 週</text>
<rect x="213" y="593" width="86" height="42" rx="8" fill="none" stroke="#DBD3BF" stroke-width="1.5"/>
<rect x="309" y="593" width="86" height="42" rx="8" fill="#00806B"/>
<rect x="405" y="593" width="86" height="42" rx="8" fill="none" stroke="#DBD3BF" stroke-width="1.5"/>
<rect x="501" y="593" width="86" height="42" rx="8" fill="#00806B"/>
<rect x="597" y="593" width="86" height="42" rx="8" fill="none" stroke="#DBD3BF" stroke-width="1.5"/>
<circle cx="256" cy="614" r="7" fill="none" stroke="#8F7418" stroke-width="2"/>
<text x="210" y="672" font-size="14.5" fill="#6B8084">週六、日休息</text>
<rect x="210" y="689" width="16" height="16" rx="5" fill="#5C77C4" opacity="0.85"/>
<text x="236" y="703" font-size="15" fill="#345963" font-weight="600">體外放療：45 Gy／25 次（IMRT/VMAT＋每日影像導引）</text>
<circle cx="218" cy="726" r="7" fill="#C9A83E" stroke="#8F7418" stroke-width="1.5"/>
<text x="236" y="732" font-size="15" fill="#345963" font-weight="600">每週化療：cisplatin 40 mg/m²，共 5–6 次（哪一天由團隊排）</text>
<rect x="210" y="747" width="16" height="16" rx="5" fill="#00806B"/>
<text x="236" y="761" font-size="15" fill="#345963" font-weight="600">近接治療：3–4 次，間隔 ≥6–8 小時；排在療程尾聲，或結束後 1–2 週內</text>
<text x="820" y="306" font-size="19" fill="#123641" font-weight="800">終點線的三個錨點（各自的出處，不可混用）</text>
<g filter="url(#sh)"><rect x="820" y="326" width="536" height="80" rx="18" fill="#FFFFFF"/></g>
<text x="846" y="366" font-size="26" fill="#8F7418" font-weight="800">≤ 7 週</text>
<text x="846" y="392" font-size="14.8" fill="#345963">ESGO 2023 指引：含近接在內的總治療時間上限。</text>
<g filter="url(#sh)"><rect x="820" y="420" width="536" height="102" rx="18" fill="#FFFFFF"/></g>
<text x="846" y="460" font-size="26" fill="#8F7418" font-weight="800">≤ 50 天</text>
<text x="846" y="486" font-size="14.8" fill="#345963">EMBRACE-II 的目標上限——EMBRACE-I 世代</text>
<text x="846" y="508" font-size="14.8" fill="#345963">有 21% 超過，要整個團隊去搶。</text>
<g filter="url(#sh)"><rect x="820" y="536" width="536" height="102" rx="18" fill="#FFFFFF"/></g>
<text x="846" y="576" font-size="26" fill="#8F7418" font-weight="800">56 天</text>
<text x="846" y="602" font-size="14.8" fill="#345963">回溯資料：近接超過 56 天才完成者，骨盆復發 26% 對 </text>
<text x="846" y="624" font-size="14.8" fill="#345963">9%（CCRT 年代、樣本小）。</text>
<g filter="url(#sh)"><rect x="84" y="786" width="1272" height="96" rx="20" fill="#FFFFFF"/></g>
<line x1="104" y1="806" x2="104" y2="862" stroke="#96790F" stroke-width="5" stroke-linecap="round"/>
<text x="128" y="824" font-size="17" fill="#123641" font-weight="700">第四、五週最難受，也最不能自行「請假」：總治療時間拖長，直接損失局部控制（「每天約 1%」出自純放療年代的資料）。</text>
<text x="128" y="856" font-size="15.5" fill="#345963">難受要回報，讓團隊處理症狀；要不要暫停，由團隊決定——你的工作是講，不是撐。</text>
<text x="84" y="914" font-size="16" fill="#6B8084">示意圖，依 ESGO/ESTRO/ESP 2023 與 EMBRACE-II 之療程設計重繪｜Girinsky 1993、Song 2013｜實際排程以你的團隊為準</text>
  </g>
</svg>
