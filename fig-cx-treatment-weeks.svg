<circle cx="256" cy="398" r="7" fill="#C9A83E" stroke="#8F7418" stroke-width="1.5"/>
<rect x="309" y="377" width="86" height="42" rx="8" fill="#5C77C4" opacity="0.85"/>
<rect x="405" y="377" width="86" height="42" rx="8" fill="#5C77C4" opacity="0.85"/>
<rect x="501" y="377" width="86" height="42" rx="8" fill="#5C77C4" opacity="0.85"/>
<rect x="597" y="377" width="86" height="42" rx="8" fill="#5C77C4" opacity="0.85"/>
<text x="192" y="460" font-size="15.5" fill="#345963" font-weight="700" text-anchor="end">第 3 週</text>
<rect x="213" y="431" width="86" height="42" rx="8" fill="#5C77C4" opacity="0.85"/>
<circle cx="256" cy="452" r="7" fill="#C9A83E" stroke="#8F7418" stroke-width="1.5"/>
<rect x="309" y="431" width="86" height="42" rx="8" fill="#5C77C4" opacity="0.85"/>
<rect x="405" y="431" width="86" height="42" rx="8" fill="#5C77C4" opacity="0.85"/>
<rect x="501" y="431" width="86" height="42" rx="8" fill="#5C77C4" opacity="0.85"/>
<rect x="597" y="431" width="86" height="42" rx="8" fill="#5C77C4" opacity="0.85"/>
<text x="192" y="514" font-size="15.5" fill="#345963" font-weight="700" text-anchor="end">第 4 週</text>
<rect x="213" y="485" width="86" height="42" rx="8" fill="#5C77C4" opacity="0.85"/>
<circle cx="256" cy="506" r="7" fill="#C9A83E" stroke="#8F7418" stroke-width="1.5"/>
<rect x="309" y="485" width="86" height="42" rx="8" fill="#5C77C4" opacity="0.85"/>
<rect x="405" y="485" width="86" height="42" rx="8" fill="#5C77C4" opacity="0.85"/>
<rect x="501" y="485" width="86" height="42" rx="8" fill="#5C77C4" opacity="0.85"/>
<rect x="597" y="485" width="86" height="42" rx="8" fill="#5C77C4" opacity="0.85"/>
<text x="192" y="568" font-size="15.5" fill="#345963" font-weight="700" text-anchor="end">第 5 週</text>
<rect x="213" y="539" width="86" height="42" rx="8" fill="#5C77C4" opacity="0.85"/>
<circle cx="256" cy="560" r="7" fill="#C9A83E" stroke="#8F7418" stroke-width="1.5"/>
<rect x="309" y="539" width="86" height="42" rx="8" fill="#5C77C4" opacity="0.85"/>
<rect x="405" y="539" width="86" height="42" rx="8" fill="#5C77C4" opacity="0.85"/>
