<rect x="501" y="323" width="86" height="42" rx="8" fill="#5C77C4" opacity="0.85"/>
<rect x="597" y="323" width="86" height="42" rx="8" fill="#5C77C4" opacity="0.85"/>
<text x="192" y="406" font-size="15.5" fill="#345963" font-weight="700" text-anchor="end">第 2 週</text>
