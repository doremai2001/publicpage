<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1008" viewBox="0 0 1440 1008" role="img" aria-labelledby="t d">
  <title id="t">局部控制與腫瘤大小：RFA 的效果隨大小下降</title>
  <desc id="d">示意圖：腫瘤每大 1 公分，RFA 局部失敗風險上升（HR 1.54），SBRT 看不出大小效應（HR 1.21，p=0.617）；2 公分以上，RFA 局部惡化風險是 SBRT 的 3.35 倍（Wahl 2016，回溯）。成對數點：Wahl 2 年免於局部惡化 RFA 80.2% 對 SBRT 83.8%；Xi 2025 隨機試驗（復發性單顆 5 公分以內）2 年局部無惡化存活 75.8% 對 92.7%；Yoon 2020 前瞻二期 SBRT 2 年局部控制 100%；HyTEC 合併 2 年 89%。整體存活看不出差別。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4EFE3"/><stop offset="1" stop-color="#E8E1D1"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2832" flood-opacity=".13"/></filter><style>.z{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}.r{font-family:"Noto Serif TC","Noto Serif CJK TC","PingFang TC","Microsoft JhengHei",serif}</style></defs>
  <rect width="1440" height="1008" rx="36" fill="url(#bg)"/>
  <g class="z">
<text x="84" y="86" font-size="18" fill="#A98722" font-weight="800" letter-spacing="5px">LOCAL CONTROL × TUMOUR SIZE</text>
<text x="84" y="148" font-size="44" fill="#123641" font-weight="800" class="r">局部控制與腫瘤大小：RFA 的效果隨大小下降</text>
<text x="84" y="194" font-size="21" fill="#527078">燒灼的局部控制隨腫瘤變大而下降；SBRT 看不出大小效應——這張圖談局部控制，不談整體存活。</text>
<text x="84" y="224" font-size="21" fill="#527078">各研究的族群、設計與終點不同，數點不可直接互比；每個數點都帶著它的族群標籤。</text>
<line x1="84" y1="248" x2="118" y2="248" stroke="#96790F" stroke-width="5" stroke-linecap="round"/>
<text x="128" y="254" font-size="19" fill="#345963" font-weight="600">RFA（射頻燒灼）</text>
<line x1="330" y1="248" x2="364" y2="248" stroke="#00806B" stroke-width="5" stroke-linecap="round"/>
<text x="374" y="254" font-size="19" fill="#345963" font-weight="600">SBRT（立體定位放射治療）</text>
<rect x="84" y="274" width="1272" height="148" rx="16" fill="none" stroke="#C9A83E" stroke-width="2.5"/>
<text x="108" y="304" font-size="19" fill="#8F7418" font-weight="800">大小效應（Wahl 2016・回溯・224 人不可手術；腫瘤中位 RFA 1.8 cm、SBRT 2.2 cm）</text>
<text x="108" y="334" font-size="17" fill="#345963">腫瘤每大 1 公分，RFA 的局部失敗風險 ×1.54（p=0.006）；SBRT ×1.21（p=0.617，看不出大小效應）</text>
<text x="108" y="362" font-size="17" fill="#345963" font-weight="600">≥2 公分：RFA 局部惡化風險是 SBRT 的 3.35 倍（HR 3.35，p=0.025）；可切除且超過 2 公分——BCLC 建議優先考慮切除</text>
<text x="108" y="392" font-size="15" fill="#6B8084">位置也是邊界：緊鄰大血管的腫瘤 RFA 後殘留／局部復發 48% 對非血管旁 7%（Lu 2003）；門脈旁侵襲性節段內復發 15%，整體 3.7%（Kang 2015）</text>
<g filter="url(#sh)"><rect x="84" y="452" width="1272" height="366" rx="18" fill="#FFFFFF"/></g>
<line x1="560.0" y1="474" x2="560.0" y2="738" stroke="#DBD3BF" stroke-width="1"/>
<text x="560.0" y="762" font-size="14" fill="#6B8084" text-anchor="middle">50</text>
<line x1="712.0" y1="474" x2="712.0" y2="738" stroke="#DBD3BF" stroke-width="1"/>
<text x="712.0" y="762" font-size="14" fill="#6B8084" text-anchor="middle">60</text>
<line x1="864.0" y1="474" x2="864.0" y2="738" stroke="#DBD3BF" stroke-width="1"/>
<text x="864.0" y="762" font-size="14" fill="#6B8084" text-anchor="middle">70</text>
<line x1="1016.0" y1="474" x2="1016.0" y2="738" stroke="#DBD3BF" stroke-width="1"/>
<text x="1016.0" y="762" font-size="14" fill="#6B8084" text-anchor="middle">80</text>
<line x1="1168.0" y1="474" x2="1168.0" y2="738" stroke="#DBD3BF" stroke-width="1"/>
<text x="1168.0" y="762" font-size="14" fill="#6B8084" text-anchor="middle">90</text>
<line x1="1320.0" y1="474" x2="1320.0" y2="738" stroke="#DBD3BF" stroke-width="1"/>
<text x="1320.0" y="762" font-size="14" fill="#6B8084" text-anchor="middle">100</text>
<text x="940" y="792" font-size="14" fill="#6B8084" text-anchor="middle">％（各研究自報之局部控制／免於局部惡化，非同一定義）</text>
<text x="104" y="504" font-size="15" fill="#123641" font-weight="800">Wahl 2016・回溯（美國・不可手術）</text>
<text x="104" y="526" font-size="13.5" fill="#6B8084">2 年免於局部惡化（FFLP）</text>
<line x1="1019.0" y1="516" x2="1073.8" y2="516" stroke="#B9AE94" stroke-width="2"/>
<circle cx="1019.0" cy="516" r="8" fill="#96790F"/>
<circle cx="1073.8" cy="516" r="8" fill="#00806B"/>
<text x="1005.0400000000001" y="521" font-size="14" fill="#96790F" font-weight="800" text-anchor="end">80.2%</text>
<text x="1087.76" y="521" font-size="14" fill="#00806B" font-weight="800">83.8%</text>
<text x="104" y="576" font-size="15" fill="#123641" font-weight="800">Xi 2025・隨機試驗（復發性單顆 ≤5 cm・中國單中心）</text>
<text x="104" y="598" font-size="13.5" fill="#6B8084">2 年局部無惡化存活（HR 0.45，p=0.014）</text>
<line x1="952.2" y1="588" x2="1209.0" y2="588" stroke="#B9AE94" stroke-width="2"/>
<circle cx="952.2" cy="588" r="8" fill="#96790F"/>
<circle cx="1209.0" cy="588" r="8" fill="#00806B"/>
<text x="938.1599999999999" y="593" font-size="14" fill="#96790F" font-weight="800" text-anchor="end">75.8%</text>
<text x="1223.04" y="593" font-size="14" fill="#00806B" font-weight="800">92.7%</text>
<text x="104" y="648" font-size="15" fill="#123641" font-weight="800">Yoon 2020・前瞻二期（≤5 cm、中位 1.3 cm・單臂）</text>
<text x="104" y="670" font-size="13.5" fill="#6B8084">2 年局部控制——無 RFA 對照</text>
<circle cx="1320.0" cy="660" r="8" fill="#00806B"/>
<text x="1306.0" y="665" font-size="14" fill="#00806B" font-weight="800" text-anchor="end">100%（5 年 97.1%）</text>
<text x="104" y="720" font-size="15" fill="#123641" font-weight="800">HyTEC 2021・合併分析（原發性肝腫瘤 431 顆・單臂）</text>
<text x="104" y="742" font-size="13.5" fill="#6B8084">2 年局部控制（1 年 93%、3 年 86%）</text>
<circle cx="1152.8" cy="732" r="8" fill="#00806B"/>
<text x="1138.8000000000002" y="737" font-size="14" fill="#00806B" font-weight="800" text-anchor="end">89%</text>
<rect x="84" y="848" width="1272" height="112" rx="16" fill="none" stroke="#C9A83E" stroke-width="2.5"/>
<text x="108" y="878" font-size="17" fill="#8F7418" font-weight="800">整體存活：看不出差別——這張圖談的是局部控制，不可讀成「SBRT 全面較好」</text>
<text x="108" y="906" font-size="15" fill="#345963">Wahl 2 年整體存活 53% 對 46%（統計相當）；NCDB 回溯配對的 5 年整體存活偏 RFA（29.8% 對 19.3%，缺肝功能變數）；統合分析 3、5 年無差異</text>
<text x="108" y="932" font-size="15" fill="#345963">Kim 2020（亞洲七院・回溯）：SBRT 組基線明顯更差（BCLC B–C 65% 對 16%、81% 治療過），3 年累積局部復發仍較低（21.2% 對 27.9%）</text>
<text x="84" y="980" font-size="16" fill="#6B8084">示意圖，依 Wahl 2016、Xi 2025、Yoon 2020、Ohri 2021（HyTEC）、Kim 2020、Lu 2003、Kang 2015 與 BCLC 2022 重繪｜各研究族群、設計與終點不同，數點不可直接互比</text>
  </g>
</svg>
